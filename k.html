<style>
:root{--bg:#E7F4FE;--card:#fff;--t:#1C1C1E;--tm:#6B7178;--p:#0A84FF;--soft:#E3EFFC;--red:#c62828}
@media (prefers-color-scheme: dark){:root{--bg:#111214;--card:#1C1C1E;--t:#F2F2F7;--tm:#A1A1AA;--soft:#22324a;--red:#f87171}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:-apple-system,"SF Pro Text","Segoe UI",sans-serif;min-height:100vh;padding:28px 16px calc(28px + env(safe-area-inset-bottom))}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--card);flex:0 0 auto}
.brand b{display:block;font-size:17px;font-weight:750}
.brand .phone{display:block;font-size:14px;color:var(--tm);text-decoration:none}
.card{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px}
.kind{font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--p)}
h1{font-size:22px;font-weight:800;line-height:1.25}
.meta{font-size:14px;color:var(--tm)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:12px;border-top:1px solid rgba(120,120,128,.18)}
.total span{font-size:15px;color:var(--tm)}
.total b{font-size:26px;font-weight:800}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:16px;font-size:17px;font-weight:750;text-decoration:none}
.primary{background:var(--p);color:#fff}
.second{background:var(--card);color:var(--p)}
.rows{display:flex;flex-direction:column;gap:4px;margin-top:10px;padding-top:12px;border-top:1px solid rgba(120,120,128,.18)}
.rows div{display:flex;justify-content:space-between;font-size:15px;color:var(--tm)}
.rows b{color:var(--t);font-weight:700}
.note{font-size:13px;line-height:1.45;color:var(--tm);text-align:center}
.err{color:var(--red);text-align:center;font-weight:650}
.hidden{display:none!important}
.st{align-self:flex-start;font-size:13px;font-weight:800;border-radius:9px;padding:5px 10px;margin-bottom:2px}
.st.wait{background:var(--card);color:var(--p);border:1.5px solid var(--p)}
.st.ok{background:var(--p);color:#fff}
.st.old{background:rgba(120,120,128,.14);color:var(--tm);text-decoration:line-through}
.st.pre{background:var(--card);color:var(--p);border:1.5px dashed var(--p)}
.prevok{background:rgba(255,255,255,.6);border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;font-size:14.5px;color:var(--tm)}
.prevok b{color:var(--p);white-space:nowrap}
.lines{display:flex;flex-direction:column;margin-top:8px}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:9px 0;border-top:1px solid rgba(120,120,128,.18)}
.ln span{flex:1;overflow-wrap:anywhere}.ln small{display:block;color:var(--tm);font-size:13px}
.ln b{white-space:nowrap;font-weight:700}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;height:50px;font-size:16px}
.banner{background:var(--p);color:#fff;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none}
.banner u{text-decoration:none;font-weight:800;white-space:nowrap}
.okbox{background:var(--card);border-radius:16px;padding:14px 16px;text-align:center;font-size:15px;font-weight:700;color:var(--p)}
button.btn{border:0;width:100%;font-family:inherit;cursor:pointer}
button.btn:disabled{opacity:.6}
.made{display:block;text-align:center;font-size:12px;color:var(--tm);text-decoration:none;margin-top:18px}
.made b{color:var(--t);font-weight:800}.made b span{color:#1F6BF2}
/* ==== Стиль «Креслення» (як у калькуляторі) ==== */
:root{--bg:#F2F4F7;--bp:#1F6BF2;--grid:rgba(31,107,242,.06);--gridM:rgba(31,107,242,.11);--bpa:rgba(31,107,242,.28);--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--tm:#5A616B}
@media (prefers-color-scheme: dark){:root{--bg:#0C1828;--card:#12233A;--grid:rgba(120,180,255,.07);--gridM:rgba(120,180,255,.13);--bpa:rgba(120,180,255,.3);--tm:#9FB3CC;--line:rgba(140,190,255,.14);--in:#0F1E33;--inb:rgba(140,190,255,.22);--soft:#173257}}
html,body{background-color:var(--bg)!important}
body{background-image:linear-gradient(var(--gridM) 1px,transparent 1px),linear-gradient(90deg,var(--gridM) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:96px 96px,96px 96px,12px 12px,12px 12px;background-attachment:fixed;font-variant-numeric:tabular-nums}
.card,.statbar{border-radius:8px!important;border:0!important;box-shadow:0 0 0 1px var(--bpa)!important;background-color:var(--card)!important;
 background-image:linear-gradient(var(--bp),var(--bp)),linear-gradient(var(--bp),var(--bp)),linear-gradient(var(--bp),var(--bp)),linear-gradient(var(--bp),var(--bp)),linear-gradient(var(--bp),var(--bp)),linear-gradient(var(--bp),var(--bp)),linear-gradient(var(--bp),var(--bp)),linear-gradient(var(--bp),var(--bp));background-repeat:no-repeat;
 background-size:12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px;
 background-position:-1px -1px,-1px -1px,calc(100% + 1px) -1px,calc(100% + 1px) -1px,-1px calc(100% + 1px),-1px calc(100% + 1px),calc(100% + 1px) calc(100% + 1px),calc(100% + 1px) calc(100% + 1px)}
.sec,.kind,.bal small,.statbar small,.sub,.ithead,label.f,.total span{font-family:var(--mono)!important;letter-spacing:.06em}
.stage,.st,.pill,.badge{font-family:var(--mono)!important;letter-spacing:.05em;border-radius:4px!important}
.stage{background:none!important;border:1px solid var(--bp);color:var(--bp)!important;text-transform:uppercase;font-size:11px!important}
.ln,.rows{border-top-style:dashed!important;border-top-color:var(--bpa)!important}
.btn,.route,.search,.chip,.toggle,button.btn,.filebtn,.photo,input,textarea,select,.call,.x{border-radius:8px!important}
.th,.fi{border-radius:6px!important}
h1{letter-spacing:-.02em}
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="logo.png" alt="" onerror="this.remove()">
    <div><b id="company">SA-MASTER</b><a id="companyPhone" class="phone"></a></div>
  </div>

  <div id="loading" class="note">Завантажуємо кошторис…</div>
  <div id="error" class="err hidden"></div>

  <div id="content" class="hidden" style="display:flex;flex-direction:column;gap:14px">
    <a class="banner hidden" id="newer" href="#">Є новіша версія кошторису<u>Відкрити ›</u></a>
    <div class="prevok hidden" id="worksOk"></div>
    <div class="card">
      <span class="st hidden" id="status"></span>
      <div class="kind" id="title">Кошторис</div>
      <h1 id="object"></h1>
      <div class="meta" id="date"></div>
      <div class="lines hidden" id="lines"></div>
      <div class="rows hidden" id="rows">
        <div><span>Разом за кошторисом</span><b id="sum"></b></div>
        <div><span>Отримано</span><b id="received"></b></div>
      </div>
      <div class="total"><span id="totalLabel">До сплати</span><b id="total"></b></div>
    </div>

    <div id="approveBox" class="hidden" style="display:flex;flex-direction:column;gap:10px">
      <button type="button" class="btn primary" id="approveBtn">✓ Погоджую</button>
      <div class="note" id="askNote">Є питання — напишіть у відповідь на повідомлення.<br>Або <a id="callLink" href="#" style="color:var(--tm);text-decoration:underline">подзвоніть майстру</a>.</div>
    </div>
    <div id="okBox" class="okbox hidden"></div>

    <div class="row2" id="files"><a class="btn second" id="pdfLink" href="#">📄 PDF</a><a class="btn second" id="xlsxLink" href="#">📊 Excel</a></div>
    <div class="note" id="filesNote">Повний кошторис — у PDF. Excel — якщо хочете самі порахувати.</div>
  </div>

  <div class="made hidden" id="made">Складено в <b>et<span>.app</span></b></div>
</main>

<script>
/* Адреса вашого Cloudflare Worker (див. інструкцію). */
const SERVER = "https://sa-master-api.c6hht469s9.workers.dev";

const $ = id => document.getElementById(id);
const id = (new URLSearchParams(location.search).get("id") || location.hash.replace(/^#/, "").replace(/^id=/, "") || "").trim();

function money(value){
  const n = Number(value);
  if(!Number.isFinite(n)) return "";
  return new Intl.NumberFormat("uk-UA", { maximumFractionDigits:0 }).format(Math.round(n)) + " ₴";
}

function fail(text){
  $("loading").classList.add("hidden");
  $("error").textContent = text;
  $("error").classList.remove("hidden");
}

async function load(){
  if(!/^[A-Za-z0-9_-]{6,40}$/.test(id || "")){ fail("Посилання неповне. Попросіть майстра надіслати його ще раз."); $("error").insertAdjacentHTML("beforeend", `<div style="margin-top:10px;font-size:11px;font-weight:400;color:var(--tm);word-break:break-all">${location.href.replace(/[<>&]/g, "")}</div>`); return; }
  try{
    const response = await fetch(`${SERVER}/q/${id}`, { cache:"no-store" });
    if(!response.ok){ fail("Кошторис не знайдено або посилання застаріло. Зверніться до майстра."); return; }
    const data = await response.json();
    if(data.companyName) $("company").textContent = data.companyName;
    if(data.companyPhone){
      $("companyPhone").textContent = data.companyPhone;
      $("companyPhone").href = `tel:${String(data.companyPhone).replace(/[^\d+]/g, "")}`;
    }
    $("title").textContent = data.title || "Кошторис";
    if(data.kind === "changes"){
      const rec = Number(data.received) || 0;
      $("rows").classList.remove("hidden");
      $("sum").parentElement.firstElementChild.textContent = "Було"; $("sum").textContent = money(data.prevTotal);
      if(rec > 0.5) $("received").textContent = "−" + money(rec); else $("received").parentElement.classList.add("hidden");
      $("totalLabel").textContent = rec > 0.5 ? "Стане · до сплати" : "Стане";
      $("total").textContent = money(Math.max(0, (Number(data.total) || 0) - rec));
    }
    else if(data.kind === "quote") $("totalLabel").textContent = "Разом";
    else if(data.kind === "works") $("totalLabel").textContent = "Разом за роботи";
    else if(data.kind === "materials") $("totalLabel").textContent = "Разом за матеріали";
    $("object").textContent = data.objectName || "";
    $("date").textContent = data.dateLabel || "";
    const received = Number(data.received) || 0;
    if(received > 0.5 && data.kind !== "changes"){
      $("rows").classList.remove("hidden");
      $("sum").textContent = money(data.total);
      $("received").textContent = "−" + money(received);
      const due = Math.max(0, (Number(data.total) || 0) - received);
      if(due < 0.5){ $("totalLabel").textContent = "Сплачено повністю"; $("total").textContent = "✓"; }
      else $("total").textContent = money(due);
    }else if(data.kind !== "changes"){
      $("total").textContent = money(data.total);
    }
    document.title = `${data.title || "Кошторис"} · ${data.objectName || ""}`;
    $("pdfLink").href = `${SERVER}/q/${id}/pdf`;
    if(data.xlsxName) $("xlsxLink").href = `${SERVER}/q/${id}/xlsx`;
    else{ $("xlsxLink").classList.add("hidden"); $("filesNote").textContent = "Повний кошторис — у PDF."; }
    renderApproval(data);
    $("loading").classList.add("hidden");
    $("content").classList.remove("hidden");
    if(data.madeWith) $("made").classList.remove("hidden");
  }catch(e){
    fail("Немає з'єднання. Перевірте інтернет і оновіть сторінку.");
  }
}

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const when = iso => { const d = new Date(iso); return d.toLocaleDateString("uk-UA", { day:"2-digit", month:"2-digit" }) + " о " + d.toLocaleTimeString("uk-UA", { hour:"2-digit", minute:"2-digit" }); };
function renderApproval(data){
  const lines = [];
  if(data.kind === "changes" && Array.isArray(data.lines)){
    data.lines.forEach(l => lines.push(`<div class="ln"><span>${esc(l.name)}<small>${l.sign === "＋" ? "додано" : l.sign === "−" ? "прибрано" : l.sign === "％" ? "знижка" : "змінено"}</small></span><b>${l.delta >= 0 ? "+" : "−"}${money(Math.abs(l.delta))}</b></div>`));
  }else if((data.kind === "quote" || data.kind === "materials") && data.parts){
    const p = data.parts, mats = data.kind === "materials";
    if(!mats && p.works > 0.5) lines.push(`<div class="ln"><span>Роботи</span><b>${money(p.works)}</b></div>`);
    if(p.materials > 0.5) lines.push(`<div class="ln"><span>Матеріали</span><b>${money(p.materials)}</b></div>`);
    if(p.fixtures > 0.5) lines.push(`<div class="ln"><span>Сантехприлади</span><b>${money(p.fixtures)}</b></div>`);
    const disc = mats ? p.matDiscount : p.discount;
    if(disc > 0.5) lines.push(`<div class="ln"><span>Знижка<small>уже врахована в сумах</small></span><b>−${money(disc)}</b></div>`);
  }
  if(data.kind === "materials" && data.worksApproved && data.worksApproved.total){
    $("worksOk").innerHTML = `<span>Роботи погоджено ${when(data.worksApproved.at).split(" о ")[0]}</span><b>✓ ${money(data.worksApproved.total)}</b>`;
    $("worksOk").classList.remove("hidden");
    $("total").parentElement.insertAdjacentHTML("afterend", `<div class="ln" style="border-top:1px dashed rgba(120,120,128,.25)"><span>Разом з роботами</span><b>${money(data.worksApproved.total + (Number(data.total) || 0))}</b></div>`);
  }
  if(lines.length){ $("lines").innerHTML = lines.join(""); $("lines").classList.remove("hidden"); }
  if(data.companyPhone) $("callLink").href = `tel:${String(data.companyPhone).replace(/[^\d+]/g, "")}`; else $("askNote").classList.add("hidden");
  if(!["quote", "changes", "works", "materials"].includes(data.kind)) return;
  const st = $("status"); st.classList.remove("hidden");
  if(data.prelim){ st.className = "st pre"; st.textContent = "~ Попередній розрахунок"; return; }
  if(data.approvedAt){
    st.className = "st ok"; st.textContent = "✓ Погоджено " + when(data.approvedAt);
    return;
  }
  if(data.supersededBy){
    st.className = "st old"; st.textContent = "↻ Замінено новішою версією";
    $("newer").href = "#" + data.supersededBy; $("newer").classList.remove("hidden");
    return;
  }
  st.className = "st wait"; st.textContent = "◷ Очікує погодження";
  const btnText = data.kind === "works" ? "✓ Погоджую роботи" : data.kind === "materials" ? "✓ Погоджую матеріали" : "✓ Погоджую";
  $("approveBtn").textContent = btnText;
  if(data.kind === "works") $("askNote").insertAdjacentHTML("beforebegin", `<div class="note">Матеріали майстер надішле окремо.</div>`);
  $("approveBox").classList.remove("hidden");
  $("approveBtn").onclick = async () => {
    const what = data.kind === "changes" ? `зміни до кошторису — разом ${money(data.total)}` : data.kind === "works" ? `кошторис робіт на ${money(data.total)}` : data.kind === "materials" ? `кошторис матеріалів на ${money(data.total)}` : `кошторис на ${money(data.total)}`;
    if(!confirm(`Погоджуєте ${what}?`)) return;
    const b = $("approveBtn"); b.disabled = true; b.textContent = "Надсилаємо…";
    try{
      const r = await fetch(`${SERVER}/q/${id}/approve`, { method:"POST" });
      const d = await r.json().catch(() => ({}));
      if(r.status === 409 && d.supersededBy){ location.hash = d.supersededBy; return; }
      if(!r.ok) throw new Error(d.error || "");
      $("approveBox").classList.add("hidden");
      st.className = "st ok"; st.textContent = "✓ Погоджено " + when(d.approvedAt);
      $("okBox").textContent = "Дякуємо! Майстер отримав ваше погодження.";
      $("okBox").classList.remove("hidden");
    }catch(e){ alert(e.message || "Немає з'єднання. Спробуйте ще раз."); b.disabled = false; b.textContent = btnText; }
  };
}
window.addEventListener("hashchange", () => location.reload());
load();
</script>
