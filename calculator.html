<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>SA-MASTER.PRO — Калькулятор</title>
<meta name="description" content="SA-MASTER.PRO — калькулятор вартості сантехнічних робіт.">

<style>
:root{
  --bg:#f2f2f7;
  --bg2:#fff;
  --card:rgba(255,255,255,.82);
  --solid:#fff;
  --text:#111;
  --muted:#777;
  --line:rgba(0,0,0,.09);
  --blue:#007aff;
  --blue-soft:rgba(0,122,255,.10);
  --red:#ff3b30;
  --shadow:0 10px 35px rgba(0,0,0,.08);
}

html[data-theme="dark"]{
  --bg:#101114;
  --bg2:#18191d;
  --card:rgba(29,30,35,.86);
  --solid:#1d1e23;
  --text:#f5f5f7;
  --muted:#999;
  --line:rgba(255,255,255,.10);
  --blue:#0a84ff;
  --blue-soft:rgba(10,132,255,.16);
  --red:#ff453a;
  --shadow:0 10px 35px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  min-height:100%;
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
}

body{
  min-height:100dvh;
  padding:
    max(12px,env(safe-area-inset-top))
    12px
    max(12px,env(safe-area-inset-bottom))
    12px;
  overflow:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  color:inherit;
  -webkit-user-select:none;
  user-select:none;
}

/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  max-width:560px;
  height:calc(100dvh - max(12px,env(safe-area-inset-top)) - max(12px,env(safe-area-inset-bottom)));
  margin:0 auto;
  display:flex;
  flex-direction:column;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  flex:0 0 auto;
  min-height:50px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
}

.brand{
  min-width:0;
}

.brand-title{
  font-size:22px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.7px;
}

.brand-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  line-height:1.1;
}

.theme-btn{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:50%;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  font-size:18px;
  display:grid;
  place-items:center;
}

/* =========================================================
   MAIN
========================================================= */

.main-card{
  min-height:0;
  flex:1 1 auto;
  display:flex;
  flex-direction:column;

  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  padding:10px;
}

/* =========================================================
   MAIN TABS
========================================================= */

.tabs{
  flex:0 0 auto;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;

  padding:4px;
  margin-bottom:9px;

  background:rgba(120,120,128,.10);
  border-radius:13px;
}

.tab{
  min-height:34px;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:750;
}

.tab.active{
  background:var(--solid);
  color:var(--text);
  box-shadow:0 2px 7px rgba(0,0,0,.08);
}

/* =========================================================
   ESTIMATE HEADER
========================================================= */

.section-head{
  flex:0 0 auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  min-height:27px;
  margin:0 2px 5px;
}

.section-title{
  font-size:11px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.45px;
}

.section-action{
  color:var(--blue);
  background:transparent;
  font-size:11px;
  font-weight:700;
  padding:4px 2px;
}

/* =========================================================
   ESTIMATE LIST
========================================================= */

.estimate-list{
  flex:1 1 auto;
  min-height:0;

  display:flex;
  flex-direction:column;
  gap:4px;

  overflow-y:auto;
  overflow-x:hidden;

  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;

  padding:0 1px 2px 0;

  scrollbar-width:thin;
}

/* =========================================================
   ESTIMATE ROW
========================================================= */

.estimate-row{
  flex:0 0 47px;
  min-height:47px;

  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  align-items:center;
  gap:5px;

  padding:5px 6px 5px 9px;

  border:1px solid var(--line);
  border-radius:12px;

  background:rgba(120,120,128,.055);
}

.estimate-info{
  min-width:0;
  cursor:pointer;
}

.estimate-name{
  font-size:12px;
  line-height:1.15;
  font-weight:680;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.estimate-meta{
  margin-top:2px;
  color:var(--muted);
  font-size:9px;
  line-height:1;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   QUANTITY
========================================================= */

.qty-control{
  height:29px;

  display:flex;
  align-items:center;
  gap:1px;

  padding:2px;

  border-radius:8px;
  background:rgba(120,120,128,.10);
}

.qty-btn{
  width:25px;
  height:25px;

  border-radius:6px;
  background:transparent;

  color:var(--blue);
  font-size:16px;
  font-weight:600;

  display:grid;
  place-items:center;
  line-height:1;
}

.qty-value{
  min-width:21px;

  text-align:center;

  font-size:11px;
  font-weight:800;
}

/* =========================================================
   PRICE
========================================================= */

.estimate-price{
  min-width:67px;

  text-align:right;

  font-size:11px;
  font-weight:800;

  white-space:nowrap;
}

/* =========================================================
   REMOVE
========================================================= */

.estimate-remove{
  width:24px;
  height:24px;

  border-radius:7px;
  background:transparent;

  color:var(--muted);
  font-size:16px;

  display:grid;
  place-items:center;
}

.estimate-remove:active{
  color:var(--red);
  background:rgba(255,59,48,.10);
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
  min-height:80px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  border:1px dashed var(--line);
  border-radius:13px;

  color:var(--muted);
  font-size:11px;

  padding:12px;
}

/* =========================================================
   BOTTOM PANEL
========================================================= */

.bottom-panel{
  flex:0 0 auto;
  padding-top:7px;
}

/* =========================================================
   TOTAL
========================================================= */

.total-box{
  min-height:49px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:8px 11px;

  border-radius:13px;
  background:var(--blue-soft);
}

.total-label{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.total-value{
  font-size:19px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.4px;
  white-space:nowrap;
}

/* =========================================================
   ACTIONS
========================================================= */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:6px;
}

.action-btn{
  min-height:37px;

  border-radius:11px;

  background:rgba(120,120,128,.09);
  border:1px solid var(--line);

  font-size:11px;
  font-weight:750;
}

.action-btn.primary{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

/* =========================================================
   CATALOG BUTTON
========================================================= */

.catalog-open{
  width:100%;
  min-height:42px;

  margin-top:6px;

  border-radius:12px;

  background:var(--blue);
  color:#fff;

  font-size:13px;
  font-weight:800;

  box-shadow:0 5px 16px rgba(0,122,255,.18);
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;

  display:none;
  align-items:flex-end;
  justify-content:center;

  padding:10px;

  background:rgba(0,0,0,.28);
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(560px,100%);
  max-height:92dvh;

  overflow:hidden;

  display:flex;
  flex-direction:column;

  background:var(--solid);
  color:var(--text);

  border:1px solid var(--line);
  border-radius:23px;

  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.sheet-head{
  flex:0 0 auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:13px 14px 9px;
}

.sheet-title{
  font-size:17px;
  font-weight:850;
  letter-spacing:-.3px;
}

.close-btn{
  width:34px;
  height:34px;

  border-radius:50%;

  background:rgba(120,120,128,.10);
  color:var(--muted);

  font-size:20px;

  display:grid;
  place-items:center;
}

/* =========================================================
   CATALOG
========================================================= */

.catalog-body{
  min-height:0;

  display:flex;
  flex-direction:column;

  padding:0 13px 13px;
}

.search{
  flex:0 0 auto;

  width:100%;
  height:40px;

  border:1px solid var(--line);
  border-radius:12px;

  outline:none;

  background:rgba(120,120,128,.07);
  color:var(--text);

  padding:0 12px;

  font-size:13px;

  margin-bottom:8px;
}

.search:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}

.catalog-tabs{
  flex:0 0 auto;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;

  padding:4px;

  background:rgba(120,120,128,.10);
  border-radius:12px;

  margin-bottom:8px;
}

.catalog-tab{
  height:32px;

  border-radius:9px;

  background:transparent;
  color:var(--muted);

  font-size:11px;
  font-weight:750;
}

.catalog-tab.active{
  background:var(--solid);
  color:var(--text);

  box-shadow:0 2px 7px rgba(0,0,0,.07);
}

/* =========================================================
   CATALOG LIST
========================================================= */

.work-list{
  height:430px;
  min-height:360px;

  overflow-y:auto;
  overflow-x:hidden;

  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;

  padding-right:2px;

  scrollbar-width:thin;
}

.work-item{
  width:100%;
  min-height:60px;

  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:9px;

  padding:7px 8px 7px 10px;
  margin-bottom:5px;

  border:1px solid var(--line);
  border-radius:13px;

  background:rgba(120,120,128,.055);

  text-align:left;
}

.work-item:active{
  transform:scale(.99);
  background:var(--blue-soft);
}

.work-info{
  min-width:0;
}

.work-name{
  font-size:12px;
  line-height:1.2;
  font-weight:700;
}

.work-meta{
  margin-top:3px;

  color:var(--muted);
  font-size:9px;
  line-height:1;
}

.work-price{
  color:var(--blue);

  font-size:11px;
  font-weight:800;

  white-space:nowrap;
}

.work-control{
  display:flex;
  align-items:center;
  gap:2px;

  height:30px;
  padding:2px;

  border-radius:8px;

  background:var(--blue-soft);
}

.work-control button{
  width:25px;
  height:25px;

  border-radius:6px;

  background:transparent;
  color:var(--blue);

  font-size:16px;

  display:grid;
  place-items:center;
}

.work-control span{
  min-width:20px;

  text-align:center;

  font-size:11px;
  font-weight:800;
}

.catalog-footer{
  flex:0 0 auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  padding-top:8px;
}

.catalog-count{
  color:var(--muted);
  font-size:10px;
}

.new-work-btn{
  min-height:35px;

  padding:0 12px;

  border-radius:10px;

  background:rgba(120,120,128,.10);
  border:1px solid var(--line);

  color:var(--blue);

  font-size:11px;
  font-weight:750;
}

/* =========================================================
   FORMS
========================================================= */

.form-body{
  padding:0 14px 14px;
  overflow-y:auto;
}

.field{
  margin-bottom:10px;
}

.field label{
  display:block;

  margin:0 0 5px 2px;

  color:var(--muted);

  font-size:10px;
  font-weight:700;
}

.input{
  width:100%;
  min-height:42px;

  border:1px solid var(--line);
  border-radius:11px;

  outline:none;

  background:rgba(120,120,128,.07);
  color:var(--text);

  padding:0 11px;

  font-size:13px;
}

.input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}

.form-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;

  margin-top:5px;
}

.form-btn{
  min-height:41px;

  border-radius:11px;

  background:rgba(120,120,128,.09);
  border:1px solid var(--line);

  font-size:12px;
  font-weight:750;
}

.form-btn.primary{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

.form-btn.danger{
  color:var(--red);
}

/* =========================================================
   PRICE
========================================================= */

.price-current{
  margin:0 0 10px;

  padding:10px 11px;

  border-radius:11px;

  background:var(--blue-soft);

  font-size:12px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  left:50%;
  bottom:max(18px,env(safe-area-inset-bottom));

  z-index:3000;

  transform:translate(-50%,20px);
  opacity:0;

  pointer-events:none;

  padding:9px 13px;

  border-radius:11px;

  background:#222;
  color:#fff;

  font-size:11px;
  font-weight:650;

  transition:.22s ease;

  max-width:calc(100vw - 30px);

  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================================================
   SMALL HEIGHT DEVICES
========================================================= */

@media(max-height:700px){

  .header{
    min-height:44px;
    margin-bottom:6px;
  }

  .brand-title{
    font-size:20px;
  }

  .theme-btn{
    width:35px;
    height:35px;
    flex-basis:35px;
  }

  .main-card{
    padding:8px;
  }

  .estimate-row{
    flex-basis:44px;
    min-height:44px;
  }

  .work-list{
    height:390px;
    min-height:330px;
  }
}

/* =========================================================
   VERY NARROW SCREEN
========================================================= */

@media(max-width:380px){

  .estimate-row{
    grid-template-columns:minmax(0,1fr) auto auto;
  }

  .estimate-price{
    grid-column:2;
    grid-row:1;
    min-width:60px;
  }

  .qty-control{
    grid-column:2;
    grid-row:2;
  }

  .estimate-remove{
    grid-column:3;
    grid-row:1 / span 2;
  }

  .estimate-name{
    font-size:11px;
  }

  .estimate-meta{
    font-size:8px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="brand">
      <div class="brand-title">SA-MASTER.PRO</div>
      <div class="brand-sub">Калькулятор вартості робіт</div>
    </div>

    <button
      id="themeButton"
      class="theme-btn"
      type="button"
      onclick="toggleTheme()"
      aria-label="Змінити тему"
    >☾</button>

  </header>

  <main class="main-card">

    <div class="tabs">

      <button
        id="roughTab"
        class="tab active"
        type="button"
        onclick="setMainCategory('rough')"
      >Чорнові</button>

      <button
        id="finishTab"
        class="tab"
        type="button"
        onclick="setMainCategory('finish')"
      >Чистові</button>

    </div>

    <div class="section-head">

      <div class="section-title">
        Додані роботи
      </div>

      <button
        id="clearEstimateBtn"
        class="section-action"
        type="button"
        onclick="clearEstimate()"
      >Очистити</button>

    </div>

    <div id="estimateList" class="estimate-list"></div>

    <div class="bottom-panel">

      <div class="total-box">

        <div class="total-label">
          Загальна вартість робіт
        </div>

        <div
          id="totalValue"
          class="total-value"
        >0 ₴</div>

      </div>

      <div class="actions">

        <button
          class="action-btn"
          type="button"
          onclick="openNewWorkModal()"
        >＋ Нова позиція</button>

        <button
          class="action-btn"
          type="button"
          onclick="exportJSON()"
        >Експорт JSON</button>

      </div>

      <button
        class="catalog-open"
        type="button"
        onclick="openCatalog()"
      >＋ Додати роботу</button>

    </div>

  </main>

</div>


<!-- =======================================================
     CATALOG MODAL
======================================================= -->

<div
  id="catalogModal"
  class="modal"
  onclick="modalBackgroundClick(event,'catalogModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        Додати роботу
      </div>

      <button
        class="close-btn"
        type="button"
        onclick="closeModal('catalogModal')"
        aria-label="Закрити"
      >×</button>

    </div>

    <div class="catalog-body">

      <input
        id="workSearch"
        class="search"
        type="search"
        placeholder="Пошук: раді, бойл, уніт..."
        autocomplete="off"
        oninput="renderAddWorkList()"
      >

      <div class="catalog-tabs">

        <button
          id="catalogRoughTab"
          class="catalog-tab active"
          type="button"
          onclick="setCatalogCategory('rough')"
        >Чорнові</button>

        <button
          id="catalogFinishTab"
          class="catalog-tab"
          type="button"
          onclick="setCatalogCategory('finish')"
        >Чистові</button>

      </div>

      <div
        id="workList"
        class="work-list"
      ></div>

      <div class="catalog-footer">

        <div
          id="catalogCount"
          class="catalog-count"
        ></div>

        <button
          class="new-work-btn"
          type="button"
          onclick="openNewWorkModal()"
        >＋ Створити позицію</button>

      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     NEW / EDIT WORK
======================================================= -->

<div
  id="workModal"
  class="modal"
  onclick="modalBackgroundClick(event,'workModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <div
        id="workModalTitle"
        class="sheet-title"
      >Нова позиція</div>

      <button
        class="close-btn"
        type="button"
        onclick="closeModal('workModal')"
      >×</button>

    </div>

    <div class="form-body">

      <div class="field">

        <label for="workName">
          Назва роботи
        </label>

        <input
          id="workName"
          class="input"
          type="text"
          placeholder="Наприклад, Монтаж фільтра"
        >

      </div>

      <div class="field">

        <label for="workUnit">
          Одиниця виміру
        </label>

        <input
          id="workUnit"
          class="input"
          type="text"
          placeholder="шт, компл, м.п."
        >

      </div>

      <div class="field">

        <label for="workPrice">
          Базова ціна, грн
        </label>

        <input
          id="workPrice"
          class="input"
          type="number"
          min="0"
          step="1"
          placeholder="0"
        >

      </div>

      <div class="form-actions">

        <button
          class="form-btn"
          type="button"
          onclick="closeModal('workModal')"
        >Скасувати</button>

        <button
          class="form-btn primary"
          type="button"
          onclick="saveWork()"
        >Зберегти</button>

      </div>

      <button
        id="deleteWorkButton"
        class="form-btn danger"
        type="button"
        onclick="deleteCurrentWork()"
        style="display:none;width:100%;margin-top:7px"
      >Видалити позицію</button>

    </div>

  </div>

</div>


<!-- =======================================================
     PRICE MODAL
======================================================= -->

<div
  id="priceModal"
  class="modal"
  onclick="modalBackgroundClick(event,'priceModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        Ціна позиції
      </div>

      <button
        class="close-btn"
        type="button"
        onclick="closeModal('priceModal')"
      >×</button>

    </div>

</div>

></div>


<script>
/* =========================================================
   DEFAULT DATABASE
========================================================= */

const defaultDB={

    {id:"r2",name:"Монтаж запірно-регулюючого вузла",unit:"компл",price:7000},

    {id:"f2",name:"Монтаж та обв’язка водоочистки",unit:"компл",price:10000},
    {id:"f3",name:"Підключення ванни",unit:"шт",price:3500},
    {id:"f4",name:"Монтаж душової системи",unit:"шт",price:3500},
    {id:"f5",name:"Підключення умивальника",unit:"шт",price:3500},
    {id:"f6",name:"Монтаж гігієнічного душа",unit:"шт",price:2000},
    {id:"f7",name:"Монтаж унітазу",unit:"шт",price:4000},
    {id:"f8",name:"Монтаж рушникосушки",unit:"шт",price:3000},
    {id:"f9",name:"Монтаж аксесуарів",unit:"шт",price:700},
    {id:"f10",name:"Монтаж пралки/сушки",unit:"компл",price:6000}
  ]
};


/* =========================================================
   STATE
========================================================= */

let db=loadDB();
let estimate=loadEstimate();

let mainCategory="rough";
let catalogCategory="rough";

let editingWorkId=null;
let editingWorkCategory=null;
let editingPriceLineId=null;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function esc(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(value){
  return Number(value||0).toLocaleString("uk-UA")+" ₴";
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function showToast(message){

  const el=$("toast");

  el.textContent=message;
  el.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer=setTimeout(()=>{
    el.classList.remove("show");
  },1800);
}


/* =========================================================
   DATABASE
========================================================= */

function loadDB(){

  try{

    const raw=localStorage.getItem("samaster_db");

    if(!raw){

      const copy=structuredClone(defaultDB);

      localStorage.setItem(
        "samaster_db",
        JSON.stringify(copy)
      );

      return copy;
    }

    const parsed=JSON.parse(raw);

    if(
      !parsed ||
      !Array.isArray(parsed.rough) ||
      !Array.isArray(parsed.finish)
    ){
      const copy=structuredClone(defaultDB);

      localStorage.setItem(
        "samaster_db",
        JSON.stringify(copy)
      );

      return copy;
    }

    /*
      Міграція старої позиції r20:
      "Монтаж рушникосушки" переносимо
      з чорнових у чистові як f8.
    */

    let changed=false;

    const oldRoughIndex=
      parsed.rough.findIndex(
        item=>item.id==="r20"
      );

    if(oldRoughIndex!==-1){

      const oldItem=
        parsed.rough.splice(
          oldRoughIndex,
          1
        )[0];

      changed=true;

      const finishHasF8=
        parsed.finish.some(
          item=>item.id==="f8"
        );

      if(!finishHasF8){

        parsed.finish.push({
          id:"f8",
          name:"Монтаж рушникосушки",
          unit:oldItem.unit||"шт",
          price:Number(
            oldItem.price??3000
          )
        });

      }
    }

    /*
      Додатково гарантуємо наявність f8.
    */

    if(
      !parsed.finish.some(
        item=>item.id==="f8"
      )
    ){

      parsed.finish.push({
        id:"f8",
        name:"Монтаж рушникосушки",
        unit:"шт",
        price:3000
      });

      changed=true;
    }

    /*
      Якщо f8 випадково опинився ще й у rough,
      прибираємо його звідти.
    */

    const roughBefore=
      parsed.rough.length;

    parsed.rough=
      parsed.rough.filter(
        item=>item.id!=="f8"
      );

    if(
      parsed.rough.length!==roughBefore
    ){
      changed=true;
    }

    if(changed){

      localStorage.setItem(
        "samaster_db",
        JSON.stringify(parsed)
      );
    }

    return parsed;

  }catch{

    const copy=structuredClone(defaultDB);

    localStorage.setItem(
      "samaster_db",
      JSON.stringify(copy)
    );

    return copy;
  }
}

function saveDB(){

  localStorage.setItem(
    "samaster_db",
    JSON.stringify(db)
  );
}


/* =========================================================
   ESTIMATE
========================================================= */

function loadEstimate(){

  try{

    const raw=
      localStorage.getItem(
        "samaster_estimate"
      );

    if(!raw) return [];

    const parsed=JSON.parse(raw);

    if(!Array.isArray(parsed)){
      return [];
    }

    /*
      Міграція старого r20 у f8
      у вже створеному кошторисі.
    */

    let changed=false;

    const oldLines=
      parsed.filter(
        item=>item.workId==="r20"
      );

    if(oldLines.length){

      const f8Line=
        parsed.find(
          item=>item.workId==="f8"
        );

      if(f8Line){

        oldLines.forEach(oldLine=>{

          f8Line.qty=
            Number(f8Line.qty||0)+
            Number(oldLine.qty||0);

        });

        return parsed.filter(
          item=>item.workId!=="r20"
        ).map(item=>item.workId==="f8"
          ?{
              ...item,
              cat:"finish",
              name:"Монтаж рушникосушки",
              unit:item.unit||"шт"
            }
          :item
        );

      }

      oldLines.forEach(item=>{

        item.workId="f8";
        item.cat="finish";
        item.name="Монтаж рушникосушки";
        item.unit=item.unit||"шт";

        changed=true;

      });
    }

    if(changed){

      localStorage.setItem(
        "samaster_estimate",
        JSON.stringify(parsed)
      );
    }

    return parsed;

  }catch{

    return [];

  }
}

function saveEstimate(){

  localStorage.setItem(
    "samaster_estimate",
    JSON.stringify(estimate)
  );

  savePassportEstimate();

  window.dispatchEvent(
    new CustomEvent(
      "samaster:estimate-updated",
      {detail:{estimate}}
    )
  );
}

function findWork(workId){

  for(const cat of ["rough","finish"]){

    const item=
      db[cat].find(
        x=>x.id===workId
      );

    if(item){

      return{
        ...item,
        cat
      };
    }
  }

  return null;
}

function getEstimateTotal(){

  return estimate.reduce(
    (sum,item)=>
      sum+
      Number(item.price||0)*
      Number(item.qty||0),
    0
  );
}


/* =========================================================
   PASSPORT
========================================================= */

function savePassportEstimate(){

  const estimateId=
    localStorage.getItem(
      "samaster_estimate_id"
    ) ||
    "SM-"+Date.now()
      .toString(36)
      .toUpperCase();

  localStorage.setItem(
    "samaster_estimate_id",
    estimateId
  );

  const createdAt=
    localStorage.getItem(
      "samaster_estimate_created"
    ) ||
    new Date().toISOString();

  localStorage.setItem(
    "samaster_estimate_created",
    createdAt
  );

  const passport={

    type:"sa-master-estimate",
    version:1,

    estimateId,

    createdAt,

    updatedAt:
      new Date().toISOString(),

    status:"draft",

    currency:"UAH",

    categories:{
      rough:
        estimate.filter(
          x=>x.cat==="rough"
        ).length,

      finish:
        estimate.filter(
          x=>x.cat==="finish"
        ).length
    },

    total:getEstimateTotal(),

    itemCount:
      estimate.reduce(
        (sum,x)=>
          sum+Number(x.qty||0),
        0
      ),

    items:
      estimate.map(item=>({

        id:item.lineId,

        workId:item.workId,

        name:item.name,

        category:item.cat,

        unit:item.unit,

        quantity:
          Number(item.qty||0),

        basePrice:
          Number(item.basePrice||0),

        price:
          Number(item.price||0),

        total:
          Number(item.price||0)*
          Number(item.qty||0)
      }))
  };

  localStorage.setItem(
    "samaster_passport_estimate",
    JSON.stringify(passport)
  );
}


/* =========================================================
   MAIN CATEGORY
========================================================= */

function setMainCategory(category){

  mainCategory=category;

  $("roughTab").classList.toggle(
    "active",
    category==="rough"
  );

  $("finishTab").classList.toggle(
    "active",
    category==="finish"
  );

  renderEstimate();
}


/* =========================================================
   RENDER ESTIMATE
========================================================= */

function renderEstimate(){

  const list=$("estimateList");

  const items=
    estimate.filter(
      item=>item.cat===mainCategory
    );

  if(!items.length){

    list.innerHTML=`
      <div class="empty">
        У цій категорії ще немає доданих робіт
      </div>
    `;

  }else{

    list.innerHTML=
      items.map(item=>{

        const total=
          Number(item.price||0)*
          Number(item.qty||0);

        return`

          <div class="estimate-row">

            <div
              class="estimate-info"
              onclick="openPriceModal('${esc(item.lineId)}')"
            >

              <div class="estimate-name">
                ${esc(item.name)}
              </div>

              <div class="estimate-meta">
                ${esc(item.unit)}
                ·
                ${money(item.price)}
                / ${esc(item.unit)}
              </div>

            </div>

            <div class="qty-control">

              <button
                class="qty-btn"
                type="button"
                onclick="changeQty('${esc(item.lineId)}',-1)"
              >−</button>

              <div class="qty-value">
                ${Number(item.qty||0)}
              </div>

              <button
                class="qty-btn"
                type="button"
                onclick="changeQty('${esc(item.lineId)}',1)"
              >+</button>

            </div>

            <div class="estimate-price">
              ${money(total)}
            </div>

            <button
              class="estimate-remove"
              type="button"
              onclick="removeEstimateLine('${esc(item.lineId)}')"
              aria-label="Видалити"
            >×</button>

          </div>
        `;

      }).join("");
  }

  $("totalValue").textContent=
    money(getEstimateTotal());

  $("clearEstimateBtn").style.visibility=
    estimate.length
      ? "visible"
      : "hidden";
}


/* =========================================================
   ADD WORK
========================================================= */

function addWork(workId){

  const item=findWork(workId);

  if(!item) return;

  const existing=
    estimate.find(
      x=>x.workId===workId
    );

  if(existing){

    existing.qty=
      Number(existing.qty||0)+1;

  }else{

    estimate.push({

      lineId:uid(),

      workId:item.id,

      name:item.name,

      unit:item.unit,

      cat:item.cat,

      basePrice:
        Number(item.price||0),

      price:
        Number(item.price||0),

      qty:1
    });
  }

  saveEstimate();

  renderEstimate();
  renderAddWorkList();

  showToast("Позицію додано");
}

function changeQty(lineId,delta){

  const item=
    estimate.find(
      x=>x.lineId===lineId
    );

  if(!item) return;

  item.qty=
    Number(item.qty||0)+
    Number(delta||0);

  if(item.qty<=0){

    estimate=
      estimate.filter(
        x=>x.lineId!==lineId
      );
  }

  saveEstimate();

  renderEstimate();
  renderAddWorkList();
}

function removeEstimateLine(lineId){

  estimate=
    estimate.filter(
      x=>x.lineId!==lineId
    );

  saveEstimate();

  renderEstimate();
  renderAddWorkList();
}


/* =========================================================
   CLEAR
========================================================= */

function clearEstimate(){

  if(!estimate.length) return;

  if(
    !confirm(
      "Очистити весь кошторис?"
    )
  ){
    return;
  }

  estimate=[];

  saveEstimate();

  renderEstimate();
  renderAddWorkList();

  showToast("Кошторис очищено");
}


/* =========================================================
   CATALOG
========================================================= */

function openCatalog(){

  $("catalogModal")
    .classList.add("show");

  $("workSearch").value="";

  catalogCategory=
    mainCategory;

  updateCatalogTabs();

  renderAddWorkList();

  setTimeout(()=>{
    $("workSearch").focus();
  },120);
}

function setCatalogCategory(category){

  catalogCategory=category;

  updateCatalogTabs();

  renderAddWorkList();
}

function updateCatalogTabs(){

  $("catalogRoughTab")
    .classList.toggle(
      "active",
      catalogCategory==="rough"
    );

  $("catalogFinishTab")
    .classList.toggle(
      "active",
      catalogCategory==="finish"
    );
}

function renderAddWorkList(){

  const list=$("workList");

  const query=
    $("workSearch")
      .value
      .trim()
      .toLowerCase();

  const source=
    db[catalogCategory]||[];

  const filtered=
    source.filter(item=>{

      if(!query) return true;

      return(
        item.name
          .toLowerCase()
          .includes(query) ||

        item.unit
          .toLowerCase()
          .includes(query)
      );
    });

  $("catalogCount").textContent=
    `${filtered.length} позицій`;

  if(!filtered.length){

    list.innerHTML=`
      <div class="empty">
        Нічого не знайдено
      </div>
    `;

    return;
  }

  list.innerHTML=
    filtered
      .map(renderAddWorkItem)
      .join("");
}

function renderAddWorkItem(item){

  const existing=
    estimate.find(
      x=>x.workId===item.id
    );

  const controls=

    existing

    ? `

      <div class="work-control">

        <button
          type="button"
          onclick="event.stopPropagation();changeQty('${esc(existing.lineId)}',-1)"
        >−</button>

        <span>
          ${Number(existing.qty||0)}
        </span>

        <button
          type="button"
          onclick="event.stopPropagation();changeQty('${esc(existing.lineId)}',1)"
        >+</button>

      </div>

    `

    : `

      <div class="work-price">
        ${money(item.price)}
      </div>

    `;

  return`

    <button
      class="work-item"
      type="button"
      onclick="addWork('${esc(item.id)}')"
    >

      <div class="work-info">

        <div class="work-name">
          ${esc(item.name)}
        </div>

        <div class="work-meta">
          ${esc(item.unit)}
        </div>

      </div>

      ${controls}

    </button>

  `;
}


/* =========================================================
   NEW WORK
========================================================= */

function openNewWorkModal(){

  editingWorkId=null;

  editingWorkCategory=
    catalogCategory||mainCategory;

  $("workModalTitle")
    .textContent="Нова позиція";

  $("workName").value="";
  $("workUnit").value="";
  $("workPrice").value="";

  $("deleteWorkButton")
    .style.display="none";

  $("workModal")
    .classList.add("show");

  setTimeout(()=>{
    $("workName").focus();
  },100);
}

function openEditWorkModal(workId){

  const item=findWork(workId);

  if(!item) return;

  editingWorkId=item.id;
  editingWorkCategory=item.cat;

  $("workModalTitle")
    .textContent="Редагувати позицію";

  $("workName").value=item.name;
  $("workUnit").value=item.unit;
  $("workPrice").value=item.price;

  $("deleteWorkButton")
    .style.display="block";

  $("workModal")
    .classList.add("show");
}

function saveWork(){

  const name=
    $("workName")
      .value
      .trim();

  const unit=
    $("workUnit")
      .value
      .trim();

  const price=
    Number(
      $("workPrice").value
    );

  if(!name){

    showToast(
      "Вкажіть назву роботи"
    );

    return;
  }

  if(!unit){

    showToast(
      "Вкажіть одиницю"
    );

    return;
  }

  if(
    !Number.isFinite(price) ||
    price<0
  ){

    showToast(
      "Вкажіть коректну ціну"
    );

    return;
  }

  if(editingWorkId){

    const item=
      findWork(editingWorkId);

    if(item){

      item.name=name;
      item.unit=unit;
      item.price=price;

      estimate.forEach(line=>{

        if(
          line.workId===item.id
        ){

          line.name=name;
          line.unit=unit;
          line.basePrice=price;
        }
      });

      saveDB();
      saveEstimate();

      closeModal("workModal");

      renderEstimate();
      renderAddWorkList();

      showToast(
        "Позицію оновлено"
      );
    }

  }else{

    const id=
      editingWorkCategory+
      "-"+
      uid();

    db[editingWorkCategory]
      .push({
        id,
        name,
        unit,
        price
      });

    saveDB();

    closeModal("workModal");

    renderAddWorkList();

    showToast(
      "Позицію створено"
    );
  }
}

function openEditFromCatalog(workId){
  openEditWorkModal(workId);
}

function deleteCurrentWork(){

  if(!editingWorkId) return;

  deleteWork(editingWorkId);
}

function deleteWork(workId){

  const item=findWork(workId);

  if(!item) return;

  if(
    !confirm(
      `Видалити "${item.name}" з каталогу?`
    )
  ){
    return;
  }

  db[item.cat]=
    db[item.cat].filter(
      x=>x.id!==workId
    );

  estimate=
    estimate.filter(
      x=>x.workId!==workId
    );

  saveDB();
  saveEstimate();

  closeModal("workModal");

  renderEstimate();
  renderAddWorkList();

  showToast(
    "Позицію видалено"
  );
}


/* =========================================================
   PRICE
========================================================= */

function openPriceModal(lineId){

  const item=
    estimate.find(
      x=>x.lineId===lineId
    );

  if(!item) return;

  editingPriceLineId=lineId;

  $("priceCurrent").innerHTML=`
    <strong>
      ${esc(item.name)}
    </strong>
    <br>
    <span style="color:var(--muted)">
      Базова ціна:
      ${money(item.basePrice)}
    </span>
  `;

  $("priceInput").value=
    item.price;

  $("priceModal")
    .classList.add("show");

  setTimeout(()=>{

    $("priceInput").focus();
    $("priceInput").select();

  },100);
}

function savePrice(){

  if(!editingPriceLineId)
    return;

  const item=
    estimate.find(
      x=>x.lineId===editingPriceLineId
    );

  if(!item) return;

  const price=
    Number(
      $("priceInput").value
    );

  if(
    !Number.isFinite(price) ||
    price<0
  ){

    showToast(
      "Вкажіть коректну ціну"
    );

    return;
  }

  item.price=price;

  saveEstimate();

  closeModal("priceModal");

  renderEstimate();

  showToast(
    "Ціну змінено"
  );
}

function resetPriceToBase(){

  if(!editingPriceLineId)
    return;

  const item=
    estimate.find(
      x=>x.lineId===editingPriceLineId
    );

  if(!item) return;

  item.price=
    Number(item.basePrice||0);

  $("priceInput").value=
    item.price;

  saveEstimate();

  renderEstimate();

  showToast(
    "Повернуто базову ціну"
  );
}


/* =========================================================
   JSON EXPORT
========================================================= */

function exportJSON(){

  const data={

    type:"sa-master-estimate",

    version:1,

    estimateId:
      localStorage.getItem(
        "samaster_estimate_id"
      )||null,

    createdAt:
      localStorage.getItem(
        "samaster_estimate_created"
      )||null,

    exportedAt:
      new Date().toISOString(),

    total:
      getEstimateTotal(),

    items:
      estimate.map(item=>({

        id:item.lineId,

        workId:item.workId,

        name:item.name,

        category:item.cat,

        unit:item.unit,

        quantity:
          Number(item.qty||0),

        basePrice:
          Number(item.basePrice||0),

        price:
          Number(item.price||0),

        total:
          Number(item.price||0)*
          Number(item.qty||0)
      }))
  };

  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json;charset=utf-8"
      }
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "sa-master-estimate.json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

  showToast(
    "JSON експортовано"
  );
}


/* =========================================================
   MODALS
========================================================= */

function closeModal(id){

  $(id)
    .classList
    .remove("show");
}

function modalBackgroundClick(event,id){

  if(
    event.target===
    $(id)
  ){

    closeModal(id);
  }
}

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key!=="Escape"
    ){
      return;
    }

    document
      .querySelectorAll(
        ".modal.show"
      )
      .forEach(modal=>{
        modal.classList.remove(
          "show"
        );
      });
  }
);


/* =========================================================
   THEME
========================================================= */

function applyTheme(theme){

  document.documentElement
    .dataset.theme=theme;

  localStorage.setItem(
    "samaster_theme_mode",
    theme
  );

  $("themeButton")
    .textContent=
      theme==="dark"
        ? "☀"
        : "☾";
}

function initTheme(){

  const saved=
    localStorage.getItem(
      "samaster_theme_mode"
    );

  applyTheme(
    saved==="dark"
      ? "dark"
      : "light"
  );
}

function toggleTheme(){

  const current=
    document.documentElement
      .dataset.theme ||
    "light";

  applyTheme(
    current==="dark"
      ? "light"
      : "dark"
  );
}


/* =========================================================
   INIT
========================================================= */

initTheme();

renderEstimate();

updateCatalogTabs();

renderAddWorkList();

</script>

</html>
