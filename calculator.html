<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Калькулятор сантехніка</title>
<meta name="description" content="Калькулятор вартості сантехнічних робіт.">

<style>
:root{
  --bg:#f2f2f7;
  --bg2:#fff;
  --card:rgba(255,255,255,.78);
  --card-solid:#fff;
  --text:#111;
  --muted:#777;
  --line:rgba(0,0,0,.09);
  --blue:#007aff;
  --blue-soft:rgba(0,122,255,.10);
  --green:#34c759;
  --red:#ff3b30;
  --shadow:0 10px 35px rgba(0,0,0,.08);
  --radius:22px;
}

html[data-theme="dark"]{
  --bg:#101114;
  --bg2:#18191d;
  --card:rgba(29,30,35,.82);
  --card-solid:#1d1e23;
  --text:#f5f5f7;
  --muted:#999;
  --line:rgba(255,255,255,.10);
  --blue:#0a84ff;
  --blue-soft:rgba(10,132,255,.16);
  --green:#30d158;
  --red:#ff453a;
  --shadow:0 10px 35px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
}

body{
  padding:
    max(16px,env(safe-area-inset-top))
    14px
    max(24px,env(safe-area-inset-bottom))
    14px;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  color:inherit;
}

.app{
  width:100%;
  max-width:560px;
  margin:0 auto;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.brand{
  min-width:0;
}

.brand-title{
  font-size:23px;
  line-height:1.05;
  font-weight:800;
  letter-spacing:-.7px;
}

.brand-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  line-height:1.2;
}

.theme-btn{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border-radius:50%;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  font-size:18px;
  display:grid;
  place-items:center;
}

/* MAIN */

.main-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  padding:14px;
}

/* PROJECT */

.project{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:10px;
}

.project-field{
  min-width:0;
}

.project-label{
  display:block;
  margin:0 0 4px 2px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
}

.project-input{
  width:100%;
  height:38px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
  background:rgba(120,120,128,.07);
  color:var(--text);
  padding:0 10px;
  font-size:12px;
}

.project-input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}

/* TABS */

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  padding:4px;
  background:rgba(120,120,128,.10);
  border-radius:14px;
  margin-bottom:12px;
}

.tab{
  min-height:36px;
  border-radius:11px;
  background:transparent;
  color:var(--muted);
  font-size:14px;
  font-weight:700;
}

.tab.active{
  background:var(--card-solid);
  color:var(--text);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* ESTIMATE */

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:3px 2px 7px;
}

.section-title{
  font-size:13px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.4px;
}

.section-action{
  color:var(--blue);
  background:none;
  font-size:12px;
  font-weight:700;
  padding:4px 2px;
}

.estimate-list{
  display:flex;
  flex-direction:column;
  gap:4px;
  max-height:235px;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding-right:1px;
}

.estimate-row{
  min-height:48px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  align-items:center;
  gap:7px;
  padding:6px 7px 6px 10px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(120,120,128,.055);
}

.estimate-info{
  min-width:0;
  cursor:pointer;
}

.estimate-name{
  font-size:13px;
  line-height:1.18;
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.estimate-meta{
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
  line-height:1.1;
  white-space:nowrap;
}

.qty-control{
  display:flex;
  align-items:center;
  gap:2px;
  height:31px;
  padding:2px;
  border-radius:9px;
  background:rgba(120,120,128,.10);
  flex:0 0 auto;
}

.qty-btn{
  width:27px;
  height:27px;
  border-radius:7px;
  background:transparent;
  color:var(--blue);
  font-size:17px;
  font-weight:600;
  display:grid;
  place-items:center;
  line-height:1;
}

.qty-value{
  min-width:25px;
  text-align:center;
  font-size:12px;
  font-weight:750;
}

.estimate-price{
  min-width:72px;
  text-align:right;
  font-size:12px;
  font-weight:750;
  white-space:nowrap;
}

.estimate-remove{
  width:24px;
  height:24px;
  border-radius:7px;
  background:transparent;
  color:var(--muted);
  font-size:16px;
  line-height:1;
  display:grid;
  place-items:center;
}

.estimate-remove:active{
  color:var(--red);
  background:rgba(255,59,48,.10);
}

.empty{
  min-height:66px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px dashed var(--line);
  border-radius:14px;
  color:var(--muted);
  font-size:12px;
  padding:12px;
}

/* TOTAL */

.total-box{
  margin-top:9px;
  padding:11px 12px;
  border-radius:15px;
  background:var(--blue-soft);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.total-label{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.total-value{
  font-size:20px;
  font-weight:850;
  letter-spacing:-.5px;
  white-space:nowrap;
}

/* ACTIONS */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.action-btn{
  min-height:43px;
  border-radius:13px;
  background:rgba(120,120,128,.09);
  border:1px solid var(--line);
  font-size:13px;
  font-weight:750;
}

.action-btn.primary{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

.action-btn.danger{
  color:var(--red);
}

/* CATALOG BUTTON */

.catalog-open{
  width:100%;
  min-height:46px;
  margin-top:9px;
  border-radius:14px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:800;
  box-shadow:0 6px 18px rgba(0,122,255,.20);
}

/* MODALS */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.28);
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(560px,100%);
  max-height:90vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:var(--card-solid);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.sheet-head{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px 15px 10px;
}

.sheet-title{
  font-size:18px;
  font-weight:850;
  letter-spacing:-.3px;
}

.close-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(120,120,128,.10);
  color:var(--muted);
  font-size:20px;
  display:grid;
  place-items:center;
}

/* CATALOG */

.catalog-body{
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:0 14px 14px;
}

.search{
  width:100%;
  height:42px;
  border:1px solid var(--line);
  border-radius:13px;
  outline:none;
  background:rgba(120,120,128,.07);
  color:var(--text);
  padding:0 13px;
  font-size:14px;
  margin-bottom:9px;
}

.search:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}

.catalog-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  padding:4px;
  background:rgba(120,120,128,.10);
  border-radius:13px;
  margin-bottom:9px;
}

.catalog-tab{
  height:34px;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:750;
}

.catalog-tab.active{
  background:var(--card-solid);
  color:var(--text);
  box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.work-list{
  height:448px;
  min-height:360px;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding-right:2px;
  scrollbar-width:thin;
}

.work-item{
  width:100%;
  min-height:62px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
  padding:8px 9px 8px 11px;
  margin-bottom:5px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(120,120,128,.055);
  text-align:left;
}

.work-item:active{
  transform:scale(.99);
  background:var(--blue-soft);
}

.work-info{
  min-width:0;
}

.work-name{
  font-size:13px;
  line-height:1.2;
  font-weight:700;
}

.work-meta{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
  line-height:1.1;
}

.work-price{
  color:var(--blue);
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.work-control{
  display:flex;
  align-items:center;
  gap:3px;
  height:32px;
  padding:2px;
  border-radius:9px;
  background:var(--blue-soft);
}

.work-control button{
  width:27px;
  height:27px;
  border-radius:7px;
  background:transparent;
  color:var(--blue);
  font-size:17px;
  display:grid;
  place-items:center;
}

.work-control span{
  min-width:22px;
  text-align:center;
  font-size:12px;
  font-weight:800;
}

.catalog-footer{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding-top:9px;
}

.catalog-count{
  color:var(--muted);
  font-size:11px;
}

.new-work-btn{
  min-height:37px;
  padding:0 13px;
  border-radius:11px;
  background:rgba(120,120,128,.10);
  border:1px solid var(--line);
  color:var(--blue);
  font-size:12px;
  font-weight:750;
}

/* FORMS */

.form-body{
  padding:0 15px 15px;
  overflow-y:auto;
}

.field{
  margin-bottom:11px;
}

.field label{
  display:block;
  margin:0 0 5px 2px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.input{
  width:100%;
  min-height:43px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  background:rgba(120,120,128,.07);
  color:var(--text);
  padding:0 12px;
  font-size:14px;
}

.input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}

.form-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:5px;
}

.form-btn{
  min-height:43px;
  border-radius:12px;
  background:rgba(120,120,128,.09);
  border:1px solid var(--line);
  font-size:13px;
  font-weight:750;
}

.form-btn.primary{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

.form-btn.danger{
  color:var(--red);
}

/* PRICE */

.price-current{
  margin:0 0 10px;
  padding:10px 12px;
  border-radius:12px;
  background:var(--blue-soft);
  font-size:13px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:max(18px,env(safe-area-inset-bottom));
  z-index:3000;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:10px 14px;
  border-radius:12px;
  background:#222;
  color:#fff;
  font-size:12px;
  font-weight:650;
  transition:.22s ease;
  max-width:calc(100vw - 32px);
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* PRINT */

#printArea{
  display:none;
}

@media print{
  body{
    padding:0;
    background:#fff;
  }

  body>*:not(#printArea){
    display:none!important;
  }

  #printArea{
    display:block!important;
  }
}

@media(max-height:700px){
  .work-list{
    height:390px;
    min-height:330px;
  }

  .estimate-list{
    max-height:190px;
  }
}

@media(max-width:390px){
  .project{
    grid-template-columns:1fr;
  }

  .estimate-row{
    grid-template-columns:minmax(0,1fr) auto;
  }

  .estimate-price{
    grid-column:2;
    grid-row:1;
  }

  .qty-control{
    grid-column:1;
    grid-row:2;
    justify-self:start;
  }

  .estimate-remove{
    grid-column:2;
    grid-row:2;
    justify-self:end;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div id="brandTitle" class="brand-title">Калькулятор сантехніка</div>
      <div id="brandSub" class="brand-sub">Калькулятор вартості робіт</div>
    </div>

    <button
      id="themeButton"
      class="theme-btn"
      type="button"
      onclick="toggleTheme()"
      aria-label="Змінити тему"
    >☾</button>
  </header>

  <main class="main-card">

    <!-- ДАНІ КОШТОРИСУ -->

    <div class="project">

      <div class="project-field">
        <label class="project-label" for="clientInput">
          Клієнт
        </label>

        <input
          id="clientInput"
          class="project-input"
          type="text"
          placeholder="Ім'я клієнта"
          autocomplete="off"
        >
      </div>

      <div class="project-field">
        <label class="project-label" for="objectInput">
          Об'єкт
        </label>

        <input
          id="objectInput"
          class="project-input"
          type="text"
          placeholder="ЖК / адреса"
          autocomplete="off"
        >
      </div>

    </div>

    <div class="tabs">

      <button
        id="roughTab"
        class="tab active"
        type="button"
        onclick="setMainCategory('rough')"
      >Чорнові</button>

      <button
        id="finishTab"
        class="tab"
        type="button"
        onclick="setMainCategory('finish')"
      >Чистові</button>

    </div>

    <div class="section-head">

      <div class="section-title">
        Додані роботи
      </div>

      <button
        id="clearEstimateBtn"
        class="section-action"
        type="button"
        onclick="clearEstimate()"
      >Очистити</button>

    </div>

    <div id="estimateList" class="estimate-list"></div>

    <div class="total-box">

      <div>
        <div class="total-label">
          Загальна вартість робіт
        </div>
      </div>

      <div id="totalValue" class="total-value">
        0 ₴
      </div>

    </div>

    <div class="actions">

      <button
        class="action-btn"
        type="button"
        onclick="openNewWorkModal()"
      >＋ Нова позиція</button>

      <button
        class="action-btn primary"
        type="button"
        onclick="createPDF()"
      >PDF кошторис</button>

    </div>

    <button
      class="catalog-open"
      type="button"
      onclick="openCatalog()"
    >＋ Додати роботу</button>

  </main>
</div>


<!-- =====================================================
     CATALOG
===================================================== -->

<div
  id="catalogModal"
  class="modal"
  onclick="modalBackgroundClick(event,'catalogModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        Додати роботу
      </div>

      <button
        class="close-btn"
        type="button"
        onclick="closeModal('catalogModal')"
      >×</button>

    </div>

    <div class="catalog-body">

      <input
        id="workSearch"
        class="search"
        type="search"
        placeholder="Пошук: раді, бойл, уніт..."
        autocomplete="off"
        oninput="renderAddWorkList()"
      >

      <div class="catalog-tabs">

        <button
          id="catalogRoughTab"
          class="catalog-tab active"
          type="button"
          onclick="setCatalogCategory('rough')"
        >Чорнові</button>

        <button
          id="catalogFinishTab"
          class="catalog-tab"
          type="button"
          onclick="setCatalogCategory('finish')"
        >Чистові</button>

      </div>

      <div id="workList" class="work-list"></div>

      <div class="catalog-footer">

        <div id="catalogCount" class="catalog-count"></div>

        <button
          class="new-work-btn"
          type="button"
          onclick="openNewWorkModal()"
        >＋ Створити позицію</button>

      </div>

    </div>

  </div>

</div>


<!-- =====================================================
     NEW / EDIT WORK
===================================================== -->

<div
  id="workModal"
  class="modal"
  onclick="modalBackgroundClick(event,'workModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <div
        id="workModalTitle"
        class="sheet-title"
      >Нова позиція</div>

      <button
        class="close-btn"
        type="button"
        onclick="closeModal('workModal')"
      >×</button>

    </div>

    <div class="form-body">

      <div class="field">

        <label for="workName">
          Назва роботи
        </label>

        <input
          id="workName"
          class="input"
          type="text"
          placeholder="Наприклад, Монтаж фільтра"
        >

      </div>

      <div class="field">

        <label for="workUnit">
          Одиниця виміру
        </label>

        <input
          id="workUnit"
          class="input"
          type="text"
          placeholder="шт, компл, м.п."
        >

      </div>

      <div class="field">

        <label for="workPrice">
          Ціна у моєму прайсі, грн
        </label>

        <input
          id="workPrice"
          class="input"
          type="number"
          min="0"
          step="1"
          placeholder="0"
        >

      </div>

      <div class="form-actions">

        <button
          class="form-btn"
          type="button"
          onclick="closeModal('workModal')"
        >Скасувати</button>

        <button
          id="saveWorkButton"
          class="form-btn primary"
          type="button"
          onclick="saveWork()"
        >Зберегти</button>

      </div>

      <button
        id="deleteWorkButton"
        class="form-btn danger"
        type="button"
        onclick="deleteCurrentWork()"
        style="display:none;width:100%;margin-top:8px"
      >Видалити позицію</button>

    </div>

  </div>

</div>


<!-- =====================================================
     PRICE
===================================================== -->

<div
  id="priceModal"
  class="modal"
  onclick="modalBackgroundClick(event,'priceModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        Ціна позиції
      </div>

      <button
        class="close-btn"
        type="button"
        onclick="closeModal('priceModal')"
      >×</button>

    </div>

    <div class="form-body">

      <div id="priceCurrent" class="price-current"></div>

      <div class="field">

        <label for="priceInput">
          Ціна для цього кошторису, грн
        </label>

function $(id){

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")

    */

      localStorage.getItem("samaster_profile");

        const migrated = {
          ...defaultProfile,
          ...parsed
        };

          "plumber_calc_profile",
          JSON.stringify(migrated)

/* =========================================================
   DATABASE
========================================================= */

function loadDB(){

  try{

    /*
      Новий універсальний ключ.
    */

    const generic =
      localStorage.getItem("plumber_calc_catalog");

    if(generic){

      const parsed =
        JSON.parse(generic);

      if(
        parsed &&
        Array.isArray(parsed.rough) &&
        Array.isArray(parsed.finish)
      ){

        return migrateDB(parsed);
      }
    }

    /*
      Міграція старого каталогу SA-MASTER.
    */

    const old =
      localStorage.getItem("samaster_db");

    if(old){

      const parsed =
        JSON.parse(old);

      if(
        parsed &&
        Array.isArray(parsed.rough) &&
        Array.isArray(parsed.finish)
      ){

        const migrated =
          migrateDB(parsed);

        localStorage.setItem(
          "plumber_calc_catalog",
          JSON.stringify(migrated)
        );

        return migrated;
      }
    }

  }catch{}

  const copy =
    structuredClone(defaultDB);

  localStorage.setItem(
    "plumber_calc_catalog",
    JSON.stringify(copy)
  );

  /*
    Залишаємо старий ключ для сумісності
    з поточним SA-MASTER.
  */

  localStorage.setItem(
    "samaster_db",
    JSON.stringify(copy)
  );

  return copy;
}


/*
  Міграція каталогу.

  Важливо:
  r20 — старе місце рушникосушки.
  Правильне місце — f8 / Чистові.
*/

function migrateDB(source){

  const result = {

    rough:Array.isArray(source.rough)
      ? source.rough.map(x=>({...x}))
      : [],

    finish:Array.isArray(source.finish)
      ? source.finish.map(x=>({...x}))
      : []

  };

  /*
    Видаляємо старий r20.
  */

  const oldTowel =
    result.rough.find(
      x => x.id === "r20"
    );

  result.rough =
    result.rough.filter(
      x => x.id !== "r20"
    );

  /*
    Видаляємо f8 з rough, якщо він там
    випадково опинився.
  */

  result.rough =
    result.rough.filter(
      x => x.id !== "f8"
    );

  /*
    Гарантуємо f8 у finish.
    Якщо старий r20 мав змінену користувачем
    ціну — переносимо її.
  */

  const finishTowel =
    result.finish.find(
      x => x.id === "f8"
    );

  if(!finishTowel){

    result.finish.push({
      id:"f8",
      name:"Монтаж рушникосушки",
      unit:"шт",
      price:
        oldTowel &&
        Number.isFinite(Number(oldTowel.price))
          ? Number(oldTowel.price)
          : 3000
    });

  }else{

    finishTowel.name =
      "Монтаж рушникосушки";

    finishTowel.unit =
      "шт";

  }

  saveCatalog(result);

  return result;
}

function saveCatalog(data = db){

  localStorage.setItem(
    "plumber_calc_catalog",
    JSON.stringify(data)
  );

  /*
    Зворотна сумісність із поточним
    SA-MASTER calculator.
  */

  localStorage.setItem(
    "samaster_db",
    JSON.stringify(data)
  );
}


/* =========================================================
   ESTIMATE
========================================================= */

function loadEstimate(){

  try{

    const generic =
      localStorage.getItem(
        "plumber_calc_estimate"
      );

    if(generic){

      const parsed =
        JSON.parse(generic);

      if(Array.isArray(parsed))
        return migrateEstimate(parsed);

      if(
        parsed &&
        Array.isArray(parsed.items)
      ){

        return migrateEstimate(parsed.items);
      }
    }

    const old =
      localStorage.getItem(
        "samaster_estimate"
      );

    if(old){

      const parsed =
        JSON.parse(old);

      if(Array.isArray(parsed)){

        const migrated =
          migrateEstimate(parsed);

        localStorage.setItem(
          "plumber_calc_estimate",
          JSON.stringify(migrated)
        );

        return migrated;
      }
    }

  }catch{}

  return [];
}

function migrateEstimate(items){

  return items.map(item=>{

    /*
      Старий r20 → новий f8.
    */

    if(item.workId === "r20"){

      return {
        ...item,
        workId:"f8",
        name:"Монтаж рушникосушки",
        unit:"шт",
        cat:"finish"
      };
    }

    return {
      lineId:item.lineId || uid(),
      workId:item.workId,
      name:item.name || "",
      unit:item.unit || "шт",
      cat:item.cat === "finish"
        ? "finish"
        : "rough",
      basePrice:Number(
        item.basePrice ??
        item.price ??
        0
      ),
      price:Number(
        item.price ??
        item.basePrice ??
        0
      ),
      qty:Number(item.qty || 1)
    };

  });
}

function saveEstimate(){

  /*
    Основний універсальний ключ.
  */

  localStorage.setItem(
    "plumber_calc_estimate",
    JSON.stringify(estimate)
  );

  /*
    Старий ключ залишаємо для сумісності.
  */

  localStorage.setItem(
    "samaster_estimate",
    JSON.stringify(estimate)
  );

  savePassportEstimate();

  window.dispatchEvent(
    new CustomEvent(
      "plumber:estimate-updated",
      {
        detail:{
          estimate
        }
      }
    )
  );
}


/* =========================================================
   WORK SEARCH
========================================================= */

function findWork(workId){

  for(const cat of ["rough","finish"]){

    const item =
      db[cat].find(
        x => x.id === workId
      );

    if(item){

      return {
        ...item,
        cat
      };

    }
  }

  return null;
}


/* =========================================================
   TOTAL
========================================================= */

function getEstimateTotal(){

  return estimate.reduce(
    (sum,item)=>
      sum +
      Number(item.price || 0) *
      Number(item.qty || 0),
    0
  );
}


/* =========================================================
   ESTIMATE DATA
========================================================= */

/*
  Це головна внутрішня структура продукту.

  Саме її пізніше можна буде передавати:
  - у PDF;
  - паспорт;
  - Cloudflare Worker;
  - Telegram;
  - CRM;
  - сервер;
  - резервну копію.

  JSON не є окремою функцією продукту —
  це просто формат даних.
*/

function buildEstimateData(){

  const estimateId =
    localStorage.getItem(
      "plumber_calc_estimate_id"
    ) ||
    localStorage.getItem(
      "samaster_estimate_id"
    ) ||
    ("EST-" +
      Date.now().toString(36).toUpperCase());

  const createdAt =
    localStorage.getItem(
      "plumber_calc_estimate_created"
    ) ||
    localStorage.getItem(
      "samaster_estimate_created"
    ) ||
    new Date().toISOString();

  localStorage.setItem(
    "plumber_calc_estimate_id",
    estimateId
  );

  localStorage.setItem(
    "plumber_calc_estimate_created",
    createdAt
  );

  const data = {

    type:"plumber-estimate",

    version:2,

    product:PRODUCT.name,

    estimateId,

    createdAt,

    updatedAt:
      new Date().toISOString(),

    status:"draft",

    currency:"UAH",

    client:
      $("clientInput").value.trim(),

    object:
      $("objectInput").value.trim(),

    master:{
      brand:profile.brand || "",
      name:profile.name || "",
      phone:profile.phone || "",
      details:profile.details || "",
      logo:profile.logo || ""
    },

    categories:{
      rough:
        estimate.filter(
          x => x.cat === "rough"
        ).length,

      finish:
        estimate.filter(
          x => x.cat === "finish"
        ).length
    },

    total:getEstimateTotal(),

    itemCount:
      estimate.reduce(
        (sum,x)=>
          sum + Number(x.qty || 0),
        0
      ),

    items:estimate.map(item=>({

      id:item.lineId,

      workId:item.workId,

      name:item.name,

      category:item.cat,

      unit:item.unit,

      quantity:Number(
        item.qty || 0
      ),

      /*
        Ціна майстра в каталозі.
      */

      basePrice:Number(
        item.basePrice || 0
      ),

      /*
        Ціна саме в цьому кошторисі.
      */

      price:Number(
        item.price || 0
      ),

      total:
        Number(item.price || 0) *
        Number(item.qty || 0)

    }))

  };

  return data;
}


/* =========================================================
   PASSPORT
========================================================= */

function savePassportEstimate(){

  const data =

  /*
    Універсальний ключ.

  localStorage.setItem(

}

========================================================= */

function setMainCategory(category){

/* =========================================================
   RENDER ESTIMATE
========================================================= */

function renderEstimate(){

  const list =
    $("estimateList");

  const items =
    estimate.filter(
      item => item.cat === mainCategory
    );

  if(!items.length){

    list.innerHTML = `
      <div class="empty">
        У цій категорії ще немає доданих робіт
      </div>
    `;

  }else{

    list.innerHTML =
      items.map(item=>{

        const total =
          Number(item.price || 0) *
          Number(item.qty || 0);

        return `

          <div class="estimate-row">

            <div
              class="estimate-info"
              onclick="openPriceModal('${esc(item.lineId)}')"
            >

              <div class="estimate-name">
                ${esc(item.name)}
              </div>

              <div class="estimate-meta">
                ${esc(item.unit)}
                ·
                ${money(item.price)}
                /
                ${esc(item.unit)}
              </div>

            </div>

            <div class="qty-control">

              <button
                class="qty-btn"
                type="button"
                onclick="changeQty('${esc(item.lineId)}',-1)"
              >−</button>

              <div class="qty-value">
                ${Number(item.qty || 0)}
              </div>

              <button
                class="qty-btn"
                type="button"
                onclick="changeQty('${esc(item.lineId)}',1)"
              >+</button>

            </div>

            <div class="estimate-price">
              ${money(total)}
            </div>

            <button
              class="estimate-remove"
              type="button"
              onclick="removeEstimateLine('${esc(item.lineId)}')"
              aria-label="Видалити"
            >×</button>

          </div>

        `;

      }).join("");
  }

  $("totalValue").textContent =
    money(getEstimateTotal());

  $("clearEstimateBtn").style.visibility =
    estimate.length
      ? "visible"
      : "hidden";
}


/* =========================================================
   ADD WORK
========================================================= */

function addWork(workId){

  const item =
    findWork(workId);

  if(!item) return;

  const existing =
    estimate.find(
      x => x.workId === workId
    );

  if(existing){

    existing.qty =
      Number(existing.qty || 0) + 1;

  }else{

    estimate.push({

      lineId:uid(),

      workId:item.id,

      name:item.name,

      unit:item.unit,

      cat:item.cat,

      /*
        Ціна майстра в прайсі.
      */

      basePrice:
        Number(item.price || 0),

      /*
        Початкова ціна кошторису
        дорівнює ціні майстра.
      */

      price:
        Number(item.price || 0),

      qty:1

    });
  }

  saveEstimate();

  renderEstimate();

  renderAddWorkList();

  showToast("Позицію додано");
}

function changeQty(lineId,delta){

  const item =
    estimate.find(
      x => x.lineId === lineId
    );

  if(!item) return;

  item.qty =
    Number(item.qty || 0) +
    Number(delta || 0);

  if(item.qty <= 0){

    estimate =
      estimate.filter(
        x => x.lineId !== lineId
      );
  }

  saveEstimate();

  renderEstimate();

  renderAddWorkList();
}

function removeEstimateLine(lineId){

  estimate =
    estimate.filter(
      x => x.lineId !== lineId
    );

  saveEstimate();

  renderEstimate();

  renderAddWorkList();
}


/* =========================================================
   CLEAR
========================================================= */

function clearEstimate(){

  if(!estimate.length)
    return;

  if(!confirm("Очистити весь кошторис?"))
    return;

  estimate = [];

  /*
    Новий кошторис отримує новий ID.
  */

  localStorage.removeItem(
    "plumber_calc_estimate_id"
  );

  localStorage.removeItem(
    "plumber_calc_estimate_created"
  );

  localStorage.removeItem(
    "samaster_estimate_id"
  );

  localStorage.removeItem(
    "samaster_estimate_created"
  );

  saveEstimate();

  renderEstimate();

  renderAddWorkList();

  showToast("Кошторис очищено");
}


/* =========================================================
   CATALOG
========================================================= */

function openCatalog(){

  $("catalogModal")
    .classList.add("show");

  $("workSearch").value = "";

  catalogCategory =
    mainCategory;

  updateCatalogTabs();

  renderAddWorkList();

  setTimeout(()=>{
    $("workSearch").focus();
  },120);
}

function setCatalogCategory(category){

  catalogCategory =
    category;

  updateCatalogTabs();

  renderAddWorkList();
}

function updateCatalogTabs(){

  $("catalogRoughTab")
    .classList.toggle(
      "active",
      catalogCategory === "rough"
    );

  $("catalogFinishTab")
    .classList.toggle(
      "active",
      catalogCategory === "finish"
    );
}

function renderAddWorkList(){

  const list =
    $("workList");

  const query =
    $("workSearch")
      .value
      .trim()
      .toLowerCase();

  const source =
    db[catalogCategory] || [];

  const filtered =
    source.filter(item=>{

      if(!query)
        return true;

      return (

        item.name
          .toLowerCase()
          .includes(query)

        ||

        item.unit
          .toLowerCase()
          .includes(query)

      );

    });

  $("catalogCount").textContent =
    `${filtered.length} позицій`;

  if(!filtered.length){

    list.innerHTML = `
      <div class="empty">
        Нічого не знайдено
      </div>
    `;

    return;
  }

  list.innerHTML =
    filtered
      .map(renderAddWorkItem)
      .join("");
}

function renderAddWorkItem(item){

  const existing =
    estimate.find(
      x => x.workId === item.id
    );

  const controls =
    existing

      ? `

        <div class="work-control">

          <button
            type="button"
            onclick="event.stopPropagation();changeQty('${esc(existing.lineId)}',-1)"
          >−</button>

          <span>
            ${Number(existing.qty || 0)}
          </span>

          <button
            type="button"
            onclick="event.stopPropagation();changeQty('${esc(existing.lineId)}',1)"
          >+</button>

        </div>

      `

      : `

        <div class="work-price">
          ${money(item.price)}
        </div>

      `;

  return `

    <button
      class="work-item"
      type="button"
      onclick="addWork('${esc(item.id)}')"
    >

      <div class="work-info">

        <div class="work-name">
          ${esc(item.name)}
        </div>

        <div class="work-meta">
          ${esc(item.unit)}
        </div>

      </div>

      ${controls}

    </button>

  `;
}


/* =========================================================
   NEW / EDIT WORK
========================================================= */

function openNewWorkModal(){

  editingWorkId =
    null;

  editingWorkCategory =
    catalogCategory;

  $("workModalTitle").textContent =
    "Нова позиція";

  $("workName").value = "";

  $("workUnit").value = "";

  $("workPrice").value = "";

  $("deleteWorkButton").style.display =
    "none";

  $("workModal")
    .classList.add("show");

  setTimeout(()=>{
    $("workName").focus();
  },100);
}

function openEditWorkModal(workId){

  const item =
    findWork(workId);

  if(!item) return;

  editingWorkId =
    item.id;

  editingWorkCategory =
    item.cat;

  $("workModalTitle").textContent =
    "Редагувати позицію";

  $("workName").value =
    item.name;

  $("workUnit").value =
    item.unit;

  $("workPrice").value =
    item.price;

  $("deleteWorkButton").style.display =
    "block";

  $("workModal")
    .classList.add("show");
}

function saveWork(){

  const name =
    $("workName")
      .value
      .trim();

  const unit =
    $("workUnit")
      .value
      .trim();

  const price =
    Number(
      $("workPrice").value
    );

  if(!name){

    showToast(
      "Вкажіть назву роботи"
    );

    return;
  }

  if(!unit){

    showToast(
      "Вкажіть одиницю"
    );

    return;
  }

  if(
    !Number.isFinite(price) ||
    price < 0
  ){

    showToast(
      "Вкажіть коректну ціну"
    );

    return;
  }

  if(editingWorkId){

    const item =
      findWork(
        editingWorkId
      );

    if(item){

      item.name =
        name;

      item.unit =
        unit;

      item.price =
        price;

      /*
        Важливо:

        змінюємо basePrice у кошторисі,
        але НЕ змінюємо price.

        Тобто якщо майстер вручну
        змінив ціну конкретного кошторису,
        його зміна не буде затерта.
      */

      estimate.forEach(line=>{

        if(
          line.workId === item.id
        ){

          line.name =
            name;

          line.unit =
            unit;

          line.basePrice =
            price;

        }

      });

      saveCatalog();

      saveEstimate();

      closeModal(
        "workModal"
      );

      renderEstimate();

      renderAddWorkList();

      showToast(
        "Позицію оновлено"
      );
    }

  }else{

    const id =
      editingWorkCategory +
      "-" +
      uid();

    db[editingWorkCategory].push({

      id,

      name,

      unit,

      price

    });

    saveCatalog();

    closeModal(
      "workModal"
    );

    renderAddWorkList();

    showToast(
      "Позицію створено"
    );
  }
}

function deleteCurrentWork(){

  if(!editingWorkId)
    return;

  deleteWork(
    editingWorkId
  );
}

function deleteWork(workId){

  const item =
    findWork(workId);

  if(!item)
    return;

  if(
    !confirm(
      `Видалити "${item.name}" з каталогу?`
    )
  ){

    return;
  }

  db[item.cat] =
    db[item.cat].filter(
      x => x.id !== workId
    );

  estimate =
    estimate.filter(
      x => x.workId !== workId
    );

  saveCatalog();

  saveEstimate();

  closeModal(
    "workModal"
  );

  renderEstimate();

  renderAddWorkList();

  showToast(
    "Позицію видалено"
  );
}


/* =========================================================
   PRICE
========================================================= */

function openPriceModal(lineId){

  const item =
    estimate.find(
      x => x.lineId === lineId
    );

  if(!item)
    return;

  editingPriceLineId =
    lineId;

  $("priceCurrent").innerHTML = `

    <strong>
      ${esc(item.name)}
    </strong>

    <br>

    <span style="color:var(--muted)">
      Ціна у моєму прайсі:
      ${money(item.basePrice)}
    </span>

  `;

  $("priceInput").value =
    item.price;

  $("priceModal")
    .classList.add("show");

  setTimeout(()=>{

    $("priceInput").focus();

    $("priceInput").select();

  },100);
}

function savePrice(){

  if(!editingPriceLineId)
    return;

  const item =
    estimate.find(
      x =>
        x.lineId ===
        editingPriceLineId
    );

  if(!item)
    return;

  const price =
    Number(
      $("priceInput").value
    );

  if(
    !Number.isFinite(price) ||
    price < 0
  ){

    showToast(
      "Вкажіть коректну ціну"
    );

    return;
  }

  item.price =
    price;

  saveEstimate();

  closeModal(
    "priceModal"
  );

  renderEstimate();

  showToast(
    "Ціну змінено"
  );
}

function resetPriceToBase(){

  if(!editingPriceLineId)
    return;

  const item =
    estimate.find(
      x =>
        x.lineId ===
        editingPriceLineId
    );

  if(!item)
    return;

  item.price =
    Number(
      item.basePrice || 0
    );

  $("priceInput").value =
    item.price;

  saveEstimate();

  renderEstimate();

  showToast(
    "Повернуто ціну з прайсу"
  );
}

/* =========================================================
   MODALS
========================================================= */

function closeModal(id){

  $(id)
    .classList
    .remove("show");
}

function modalBackgroundClick(event,id){

  if(
    event.target ===
    $(id)
  ){

    closeModal(id);

  }
}

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key !==
      "Escape"
    ){

      return;
    }

    document
      .querySelectorAll(
        ".modal.show"
      )
      .forEach(modal=>{
        modal.classList.remove(
          "show"
        );
      });

  }
);


/* =========================================================
   THEME
========================================================= */

function applyTheme(theme){

  document.documentElement
    .dataset.theme =
      theme;

  localStorage.setItem(
    "plumber_calc_theme",
    theme
  );

  /*
    Старий ключ залишаємо
    для сумісності.
  */

  localStorage.setItem(
    "samaster_theme_mode",
    theme
  );

  $("themeButton")
    .textContent =
      theme === "dark"
        ? "☀"
        : "☾";
}

function initTheme(){

  const saved =
    localStorage.getItem(
      "plumber_calc_theme"
    ) ||
    localStorage.getItem(
      "samaster_theme_mode"
    );

  applyTheme(
    saved === "dark"
      ? "dark"
      : "light"
  );
}

function toggleTheme(){

  const current =
    document.documentElement
      .dataset.theme ||
    "light";

  applyTheme(
    current === "dark"
      ? "light"
      : "dark"
  );
}
