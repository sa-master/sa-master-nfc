<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Калькулятор сантехніка</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f4f6fa;
  --card:rgba(255,255,255,.9);
  --soft:#eef1f5;
  --line:#e2e5ea;
  --text:#15171a;
  --muted:#7b8088;
  --blue:#007aff;
  --red:#ff3b30;
  --shadow:0 8px 25px rgba(30,40,60,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,input,select{font:inherit}

button{
  border:0;
  background:none;
  color:inherit;
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:560px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

.header{
  flex:0 0 auto;
  padding:calc(9px + env(safe-area-inset-top)) 14px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:19px;
  font-weight:750;
  letter-spacing:-.4px;
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:1px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:9px;
}

.date{
  color:var(--muted);
  font-size:12px;
}

.masterButton{
  width:32px;
  height:32px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:var(--blue);
  box-shadow:0 3px 12px rgba(30,40,60,.06);
}

.masterButton svg{
  width:19px;
  height:19px;
}

.clientWrap{
  flex:0 0 auto;
  padding:0 12px 8px;
}

.clientTitle{
  padding:0 3px 5px;
  font-size:13px;
  font-weight:750;
}

.client{
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:17px;
  padding:9px;
  box-shadow:var(--shadow);
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field input{
  width:100%;
  height:36px;
  border:0;
  outline:0;
  border-radius:10px;
  background:var(--soft);
  padding:0 10px;
  font-size:13px;
  color:var(--text);
}

.field input:focus{
  background:#fff;
  box-shadow:inset 0 0 0 1.5px var(--blue);
}

.estimate{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:0 12px;
}

.estimateHead{
  flex:0 0 auto;
  padding:3px 3px 6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.estimateHead strong{
  font-size:14px;
}

.estimateHeadRight{
  display:flex;
  align-items:center;
  gap:8px;
}

.count{
  color:var(--muted);
  font-size:11px;
}

.clearEstimate{
  display:none;
  color:var(--red);
  font-size:11px;
  font-weight:650;
}

.list{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding-bottom:8px;
}

.list::-webkit-scrollbar{
  display:none;
}

.empty{
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

.section{
  margin-bottom:9px;
}

.sectionTitle{
  position:sticky;
  top:0;
  z-index:2;
  background:rgba(244,246,250,.94);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--muted);
  font-size:10px;
  font-weight:750;
  letter-spacing:.5px;
  padding:6px 4px 5px;
}

.row{
  min-height:66px;
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:15px;
  box-shadow:0 3px 13px rgba(30,40,60,.05);
  padding:9px 9px 8px 11px;
  margin-bottom:6px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
}

.name{
  font-size:13px;
  line-height:1.25;
  font-weight:650;
  overflow-wrap:anywhere;
}

.controls{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:6px;
}

.qty{
  display:flex;
  align-items:center;
  height:28px;
  border-radius:9px;
  background:var(--soft);
  overflow:hidden;
}

.qty button{
  width:29px;
  height:28px;
  color:var(--blue);
  font-size:18px;
  line-height:1;
}

.qty b{
  min-width:24px;
  text-align:center;
  font-size:12px;
}

.price{
  min-height:28px;
  border-radius:9px;
  background:var(--soft);
  color:#555;
  padding:0 8px;
  font-size:10px;
}

.right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:space-between;
  align-self:stretch;
  min-width:82px;
}

.lineTotal{
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
}

.delete{
  width:27px;
  height:27px;
  border-radius:50%;
  background:#fff0ef;
  color:var(--red);
  font-size:18px;
}

.bottom{
  flex:0 0 auto;
  padding:7px 12px calc(8px + env(safe-area-inset-bottom));
}

.totalBar{
  height:44px;
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px;
  margin-bottom:7px;
  font-size:13px;
}

.totalBar strong{
  font-size:17px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.action{
  height:45px;
  border-radius:14px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:750;
  box-shadow:0 5px 14px rgba(0,122,255,.18);
}

.action:active{
  transform:scale(.98);
}

.sheet{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.32);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.sheet.open{
  display:flex;
}

.panel{
  width:100%;
  max-width:560px;
  height:min(82dvh,720px);
  margin:auto;
  background:#f6f7fa;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}

.panelHead{
  flex:0 0 auto;
  padding:11px 14px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panelHead strong{
  font-size:18px;
}

.panelHeadRight{
  display:flex;
  align-items:center;
  gap:4px;
}

.catalogEditButton{
  height:32px;
  padding:0 9px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  font-size:12px;
  font-weight:700;
}

.catalogEditButton.active{
  background:var(--blue);
  color:#fff;
}

.close{
  width:32px;
  height:32px;
  font-size:28px;
  color:#777;
}

.search{
  flex:0 0 auto;
  width:calc(100% - 24px);
  margin:0 12px 8px;
  height:40px;
  border:0;
  outline:0;
  border-radius:12px;
  background:#e9ebef;
  padding:0 12px;
  font-size:14px;
}

.filters,
.subFilters{
  flex:0 0 auto;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  padding:0 12px 8px;
}

.filters::-webkit-scrollbar,
.subFilters::-webkit-scrollbar{
  display:none;
}

.filter,
.subFilter{
  flex:0 0 auto;
  height:30px;
  padding:0 10px;
  border-radius:9px;
  background:#e9ebef;
  color:#555;
  font-size:11px;
  font-weight:650;
}

.filter.active,
.subFilter.active{
  background:var(--blue);
  color:#fff;
}

.catalog{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:0 12px 15px;
}

.catalog::-webkit-scrollbar{
  display:none;
}

.catalogItem{
  min-height:59px;
  background:#fff;
  border-radius:14px;
  padding:9px 9px 9px 11px;
  margin:6px 0;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 2px 10px rgba(30,40,60,.04);
}

.catalogItem.added{
  box-shadow:inset 0 0 0 1.5px rgba(0,122,255,.25);
}

.catalogName{
  font-size:13px;
  line-height:1.25;
  font-weight:700;
  overflow-wrap:anywhere;
}

.catalogMeta{
  color:var(--muted);
  font-size:10px;
  line-height:1.35;
  margin-top:3px;
}

.catalogControls{
  display:flex;
  align-items:center;
  gap:5px;
}

.catalogQtyButton{
  width:29px;
  height:29px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  font-size:18px;
}

.catalogQty{
  min-width:27px;
  text-align:center;
  color:var(--blue);
  font-size:12px;
  font-weight:750;
}

.addIcon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex:0 0 auto;
}
  .catalogManage{
  display:flex;
  gap:5px;
}

.manageEdit,
.manageDelete{
  width:31px;
  height:31px;
  border-radius:9px;
  font-size:15px;
}

.manageEdit{
  background:#e9ebef;
  color:var(--blue);
}

.manageDelete{
  background:#fff0ef;
  color:var(--red);
}

.catalog.manageMode .catalogControls,
.catalog.manageMode .addIcon{
  display:none;
}

.catalogAdd{
  width:100%;
  height:42px;
  margin:7px 0 12px;
  border-radius:13px;
  background:#fff;
  color:var(--blue);
  box-shadow:0 2px 10px rgba(30,40,60,.045);
  font-size:14px;
  font-weight:700;
}

.catalogClear{
  width:100%;
  height:42px;
  margin:0 0 12px;
  border-radius:13px;
  background:#fff;
  color:var(--red);
  box-shadow:0 2px 10px rgba(30,40,60,.045);
  font-size:14px;
  font-weight:700;
}

.noResults{
  text-align:center;
  color:var(--muted);
  padding:35px 20px;
  font-size:14px;
}

.editorSheet{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.34);
  backdrop-filter:blur(6px);
}

.editorSheet.open{
  display:flex;
}

.editorPanel{
  width:100%;
  max-width:560px;
  max-height:88dvh;
  margin:auto;
  background:#f6f7fa;
  border-radius:22px;
  overflow-y:auto;
  padding:13px 12px calc(14px + env(safe-area-inset-bottom));
}

.editorHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.editorHead strong{
  font-size:18px;
}

.editorFields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.editorField{
  min-width:0;
}

.editorField.full{
  grid-column:1/-1;
}

.editorField label{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin:0 3px 4px;
}

.editorField input,
.editorField select{
  width:100%;
  height:40px;
  border:0;
  outline:0;
  border-radius:11px;
  background:#fff;
  padding:0 10px;
  font-size:13px;
}

.editorSave{
  width:100%;
  height:44px;
  margin-top:11px;
  border-radius:13px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:750;
}

.masterSheet{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.34);
  backdrop-filter:blur(6px);
}

.masterSheet.open{
  display:flex;
}

.masterPanel{
  width:100%;
  max-width:560px;
  margin:auto;
  background:#f6f7fa;
  border-radius:22px;
  padding:13px 12px calc(14px + env(safe-area-inset-bottom));
}

.masterHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.masterHead strong{
  font-size:18px;
}

.masterFields{
  display:grid;
  gap:8px;
}

.masterFields input{
  width:100%;
  height:42px;
  border:0;
  outline:0;
  border-radius:11px;
  background:#fff;
  padding:0 11px;
  font-size:13px;
}

.masterSave{
  width:100%;
  height:44px;
  margin-top:10px;
  border-radius:13px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:750;
}

@media(max-width:390px){
  .logo{
    font-size:17px;
  }

  .row{
    min-height:63px;
  }

  .name{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div>
  <div class="logo">
    Калькулятор сантехніка
  </div>

  <div class="subtitle">
    кошторис
  </div>
</div>

<div class="headerRight">

<div
  class="date"
  id="date"
></div>

<button
  class="masterButton"
  onclick="openMaster()"
  aria-label="Дані майстра"
>
  ⚙
</button>

</div>

</header>

<div class="clientWrap">

<div class="clientTitle">
  Замовник
</div>

<div class="client">

<div class="fields">

<div class="field">
<input
  id="clientName"
  placeholder="Ім’я та прізвище"
>
</div>

<div class="field">
<input
  id="clientPhone"
  placeholder="Телефон"
  inputmode="tel"
>
</div>

<div class="field full">
<input
  id="clientAddress"
  placeholder="Адреса об’єкта"
>
</div>

</div>

</div>

</div>

<main class="estimate">

<div class="estimateHead">

<strong>
  Кошторис
</strong>

<div class="estimateHeadRight">

<span
  class="count"
  id="count"
>
  0 позицій
</span>

<button
  class="clearEstimate"
  id="clearEstimate"
  onclick="clearEstimate()"
>
  Очистити
</button>

</div>

</div>

<div
  class="list"
  id="list"
></div>

</main>

<div class="bottom">

<div class="totalBar">

<span>
  Разом
</span>

<strong id="grand">
  0 грн
</strong>

</div>

<div class="actions">

<button
  class="action"
  onclick="openCatalog('work')"
>
  ＋ Робота
</button>

<button
  class="action"
  onclick="openCatalog('material')"
>
  ＋ Матеріал
</button>

</div>

</div>

</div>

<!-- CATALOG -->

<div
  class="sheet"
  id="sheet"
  onclick="if(event.target===this)closeCatalog()"
>

<div class="panel">

<div class="panelHead">

<strong id="panelTitle">
  Додати
</strong>

<div class="panelHeadRight">

<button
  class="catalogEditButton"
  id="eurRateButton"
  onclick="editEurRate()"
  style="display:none"
>
  € Курс
</button>

<button
  class="catalogEditButton"
  id="catalogEditButton"
  onclick="toggleCatalogManage()"
>
  ✎ Каталог
</button>

<button
  class="close"
  onclick="closeCatalog()"
>
  ×
</button>

</div>

</div>

<input
  id="search"
  class="search"
  placeholder="Пошук позиції…"
  oninput="renderCatalog()"
>

<div
  class="filters"
  id="filters"
></div>

<div
  class="subFilters"
  id="brandFilters"
  style="display:none"
></div>

<div
  class="subFilters"
  id="systemFilters"
  style="display:none"
></div>

<div
  class="catalog"
  id="catalog"
></div>

</div>

</div>

<!-- EDITOR -->

<div
  class="editorSheet"
  id="editorSheet"
  onclick="if(event.target===this)closeCatalogEditor()"
>

<div class="editorPanel">

<div class="editorHead">

<strong id="editorTitle">
  Нова позиція
</strong>

<button
  class="close"
  onclick="closeCatalogEditor()"
>
  ×
</button>

</div>

<div class="editorFields">

<div class="editorField full">

<label>
  Повна назва
</label>

<input
  id="editorName"
  placeholder="Повна назва"
>

</div>

<div class="editorField full">

<label>
  Назва для кошторису
</label>

<input
  id="editorEstimateName"
  placeholder="Назва для кошторису"
>

</div>

<div class="editorField">

<label id="editorPriceLabel">
  Ціна
</label>

<input
  id="editorPrice"
  type="number"
  inputmode="decimal"
  min="0"
>

</div>

<div class="editorField">

<label>
  Одиниця
</label>

<input
  id="editorUnit"
  placeholder="шт"
>

</div>

<div class="editorField">

<label>
  Тип
</label>

<select id="editorType">

<option value="work">
  Робота
</option>

<option value="material">
  Матеріал
</option>

</select>

</div>

<div class="editorField">

<label id="editorGroupLabel">
  Етап
</label>

<select id="editorGroup"></select>

</div>

<div
  id="materialFields"
  class="editorField full"
>

<div class="editorFields">

<div class="editorField">

<label>
  Бренд
</label>

<input
  id="editorManufacturer"
  placeholder="TECE"
>

</div>

<div class="editorField">

<label>
  Система
</label>

<input
  id="editorSystem"
  placeholder="TECEflex"
>

</div>

<div class="editorField full">

<label>
  Артикул
</label>

<input
  id="editorArticle"
  placeholder="Артикул"
>

</div>

</div>

</div>

</div>

<button
  class="editorSave"
  onclick="saveCatalogItem()"
>
  Зберегти
</button>

</div>

</div>

<!-- MASTER -->

<div
  class="masterSheet"
  id="masterSheet"
  onclick="if(event.target===this)closeMaster()"
>

<div class="masterPanel">

<div class="masterHead">

<strong>
  Дані майстра
</strong>

<button
  class="close"
  onclick="closeMaster()"
>
  ×
</button>

</div>

<div class="masterFields">

<input
  id="masterName"
  placeholder="Ім’я"
>

<input
  id="masterPhone"
  placeholder="Телефон"
  inputmode="tel"
>

</div>

<button
  class="masterSave"
  onclick="saveMaster()"
>
  Зберегти
</button>

</div>

</div>

<script>
  const defaultCatalog = [

{
  id:"w-rough-node",
  name:"Монтаж запірно-регулюючого вузла",
  estimateName:"Монтаж запірно-регулюючого вузла",
  type:"work",
  stage:"rough",
  price:7000,
  unit:"шт"
},

{
  id:"w-rough-tech",
  name:"Оздоблення технічної зони",
  estimateName:"Оздоблення технічної зони",
  type:"work",
  stage:"rough",
  price:10000,
  unit:"шт"
},

{
  id:"w-rough-riser",
  name:"Заміна каналізаційного стояка",
  estimateName:"Заміна каналізаційного стояка",
  type:"work",
  stage:"rough",
  price:5000,
  unit:"шт"
},

{
  id:"w-finish-boiler",
  name:"Бойлер",
  estimateName:"Монтаж бойлера",
  type:"work",
  stage:"finish",
  price:7000,
  unit:"шт"
},

{
  id:"w-finish-water",
  name:"Водоочистка",
  estimateName:"Монтаж водоочистки",
  type:"work",
  stage:"finish",
  price:10000,
  unit:"шт"
},

{
  id:"w-finish-bath",
  name:"Ванна",
  estimateName:"Монтаж ванни",
  type:"work",
  stage:"finish",
  price:3500,

function normalizeText(
  value
){

  return String(
    value || ""
  )
    .trim()
    .toLowerCase()
    .replace(
      /\s+/g,
      " "
    );
}

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

function money(
  value
){

  return new Intl.NumberFormat(
    "uk-UA"
  )
    .format(
      Math.round(value)
    ) +
    " грн";
}

  function renderEstimate(){

  const list =
    document.getElementById(

    );

  if(
    !estimate.length
  ){

        Додайте роботу або матеріал.
      </div>
    `;

    clearButton.style.display =
      "none";

  }else{

    let html = "";

    const rough =
      estimate.filter(
        item =>
          item.type === "work" &&
          item.stage === "rough"
      );

    const finish =
      estimate.filter(
        item =>
          item.type === "work" &&
          item.stage === "finish"
      );

    const materials =
      estimate.filter(
        item =>
          item.type === "material"
      );

    if(
      rough.length
    ){

      html += section(
        "ЧОРНОВИЙ МОНТАЖ",
        rough
      );
    }

    if(
      finish.length
    ){

      html += section(
        "ЧИСТОВИЙ МОНТАЖ",
        finish
      );
    }

    if(
      materials.length
    ){

      html += section(
        "МАТЕРІАЛИ",
        materials
      );
    }

    list.innerHTML =
      html;

    clearButton.style.display =
      "block";
  }

  const total =
    estimate.reduce(
      (
        sum,
        item
      ) =>
        sum +
        item.price *
        item.qty,
      0
    );

  document.getElementById(
    "grand"
  ).textContent =
    money(total);

  document.getElementById(
    "count"
  ).textContent =
    estimate.length +
    " позицій";
}

function section(
  title,
  items
){

  return `
    <div class="section">

      <div class="sectionTitle">
        ${title}
      </div>

      ${
        items
          .map(
            renderRow
          )
          .join("")
      }

    </div>
  `;
}

function renderRow(
  item
){

  const index =
    estimate.indexOf(
      item
    );

  return `
    <div class="row">

      <div>

        <div class="name">
          ${escapeHtml(item.name)}
        </div>

        <div class="controls">

          <div class="qty">

            <button
              onclick="changeQty(${index},-1)"
            >
              −
            </button>

            <b>
              ${item.qty}
            </b>

            <button
              onclick="changeQty(${index},1)"
            >
              +
            </button>

          </div>

          <button
            class="price"
            onclick="editPrice(${index})"
          >
            ${money(item.price)}
            /
            ${escapeHtml(item.unit)}
          </button>

        </div>

      </div>

      <div class="right">

        <div class="lineTotal">
          ${
            money(
              item.price *
              item.qty
            )
          }
        </div>

        <button
          class="delete"
          onclick="removeItem(${index})"
        >
          ×
        </button>

      </div>

    </div>
  `;
}

function changeQty(
  index,
  delta
){

  estimate[index].qty =
    Math.max(
      1,
      estimate[index].qty +
      delta
    );

  save();
  renderEstimate();
}

function removeItem(
  index
){

  estimate.splice(
    index,
    1
  );

  save();
  renderEstimate();
}

function editPrice(
  index
){

  const value =
    prompt(
      "Ціна за одиницю, грн:",
      estimate[index].price
    );

  if(
    value === null
  ){
    return;
  }

  const price =
    Number(
      String(value)
        .replace(
          ",",
          "."
        )
    );

  if(
    Number.isFinite(
      price
    ) &&
    price >= 0
  ){

    estimate[index].price =
      price;

    save();
    renderEstimate();
  }
}

function clearEstimate(){

  if(
    !estimate.length
  ){
    return;
  }

  if(
    !confirm(
      "Очистити весь кошторис?"
    )
  ){
    return;
  }

  estimate = [];

  save();
  renderEstimate();
}

function getMaterialItemsForClassification(){

  return catalog.filter(
    item => {

      if(
        item.type !==
        "material"
      ){
        return false;
      }

      if(
        catalogFilter !== "all" &&
        item.category !==
        catalogFilter
      ){
        return false;
      }

      return true;
    }
  );
}

function getBrands(){

  const values =
    new Map();

  getMaterialItemsForClassification()
    .forEach(
      item => {

        const value =
          String(
            item.manufacturer ||
            ""
          ).trim();

        if(
          value
        ){

          values.set(
            normalizeText(
              value
            ),
            value
          );
        }
      }
    );

  return Array.from(
    values.values()
  ).sort(
    (
      a,
      b
    ) =>
      a.localeCompare(
        b,
        "uk"
      )
  );
}

function renderBrandFilters(){

  const box =
    document.getElementById(
      "brandFilters"

  if(
    catalogMode !==
    "material"

    box.style.display =
      "none";

    box.innerHTML =
      "";

    return;

  const brands =
    getBrands();

  if(
    !brands.length
  ){

    box.style.display =
      "none";

    box.innerHTML =
      "";

    catalogBrandFilter =
      "all";

    return;
  }

  if(
    catalogBrandFilter !==
      "all" &&
    !brands.some(
      brand =>
        normalizeText(
          brand
        ) ===
        normalizeText(
          catalogBrandFilter
        )
    )
  ){

    catalogBrandFilter =
      "all";
  }

  box.style.display =
    "flex";

          : ""
      }"

function renderCatalog(){

  const query =
    normalizeText(
      document.getElementById(
        "search"
      ).value
    );

  const items =
    catalog.filter(
      item => {

        if(
          item.type !==
          catalogMode
        ){
          return false;
        }

        if(
          query
        ){

          const searchable = [
            item.name,
            item.estimateName,
            item.article,
            item.manufacturer,
            item.system
          ]
          .map(
            normalizeText
          )
          .join(" ");

          if(
            !searchable.includes(
              query
            )
          ){
            return false;
          }
        }

        if(
          catalogFilter !==
          "all"
        ){

          if(
            item.stage !==
              catalogFilter &&
            item.category !==
              catalogFilter
          ){
            return false;
          }
        }

        if(
          catalogMode ===
            "material" &&
          catalogBrandFilter !==
            "all"
        ){

          if(
            normalizeText(
              item.manufacturer
            ) !==
            normalizeText(
              catalogBrandFilter
            )
          ){
            return false;
          }
        }

        if(
          catalogMode ===
            "material" &&
          catalogSystemFilter !==
            "all"
        ){

          if(
            normalizeText(
              item.system
            ) !==
            normalizeText(
              catalogSystemFilter
            )
          ){
            return false;
          }
        }

        return true;
      }
    );

  const box =
    document.getElementById(
      "catalog"

    "manageMode",
    catalogManageMode
  );

  if(
    !items.length

function renderCatalogItem(

){

        )

          Number(
            item.price
          ) || 0
        );

  const existing =
    estimate.find(
      estimateItem =>
        estimateItem.id ===
        item.id
    );

  const qty =
    existing
      ? existing.qty
      : 0;

  const meta = [];

  if(
    item.type ===
    "material"
  ){

    if(
      item.manufacturer
    ){
      meta.push(
        item.manufacturer
      );
    }

    if(
      item.system
    ){
      meta.push(
        item.system
      );
    }

    if(
      item.article
    ){
      meta.push(
        item.article
      );
    }
  }

  const encodedId =
    encodeURIComponent(
      item.id
    );

  const cardAction =
    catalogManageMode
      ? ""
      : `onclick="addItem(decodeURIComponent('${encodedId}'))"`;

  return `

    <div
      class="catalogItem ${
        qty > 0
          ? "added"
          : ""
      }"
    >

        style="flex:1;min-width:0"

      >

        </div>

            catalogPrice
              ? money(
                  catalogPrice
                )
              : "ціна не задана"
          }

          ·
          ${escapeHtml(item.unit)}

          ${
            meta.length
              ? " · " +
                escapeHtml(
                  meta.join(
                    " · "
                  )
                )
              : ""
          }

        </div>

      </div>

      ${
        catalogManageMode

          ? `

            <div class="catalogManage">

              >

              </button>

              <button
                class="manageDelete"
                onclick="deleteCatalogItem(decodeURIComponent('${encodedId}'))"
              >
                ×
              </button>

            </div>

          `

          : qty > 0

          ? `

            <div class="catalogControls">

              <button
                class="catalogQtyButton"
                onclick="catalogChangeQty(decodeURIComponent('${encodedId}'),-1)"
              >
                −
              </button>

              <div class="catalogQty">
                ×${qty}
              </div>

              <button
                class="catalogQtyButton"
                onclick="catalogChangeQty(decodeURIComponent('${encodedId}'),1)"
              >

          `

          : `

              ＋
            </span>

          `
      }

  `;

function addItem(
  id
){

  const product =
    catalog.find(
      item =>
        item.id === id
    );

  if(
    !product
  ){
    return;
  }

  if(
    product.type ===
      "material" &&
    (
      !Number.isFinite(
        eurRate
      ) ||
      eurRate <= 0
    )
  ){

    alert(
      "Спочатку вкажіть курс EUR."
    );

    return;
  }

  const existing =
    estimate.find(
      item =>
        item.id === id
    );

  if(
    existing
  ){

    existing.qty++;

  }else{

    const estimateItem = {

      id:
        product.id,

      name:
        product.estimateName ||
        product.name,

      type:
        product.type,

      stage:
        product.stage,

      category:
        product.category,

      price:
        product.type ===
          "material"
          ? getMaterialCatalogPrice(
              product
            )
          : (
              Number(
                product.price
              ) || 0
            ),

      unit:
        product.unit,

      qty:1
    };

    if(
      product.type ===
      "material"
    ){

      estimateItem.manufacturer =
        product.manufacturer ||
        "";

      estimateItem.system =
        product.system ||
        "";

      estimateItem.article =
        product.article ||
        "";
    }

    estimate.push(
      estimateItem
    );
  }

  save();

  renderEstimate();
  renderCatalog();
}

function catalogChangeQty(
  id,
  delta
){

  const index =
    estimate.findIndex(
      item =>
        item.id === id
    );

  if(
    index === -1
  ){

    if(
      delta > 0
    ){
      addItem(
        id
      );
    }

    return;
  }

  estimate[index].qty +=
    delta;

  if(
    estimate[index].qty <=
    0
  ){

    estimate.splice(
      index,
      1
    );
  }

  save();

  renderEstimate();
  renderCatalog();
}

function saveCatalogItem(){

  const name =
    document.getElementById(
      "editorName"
    ).value.trim();

  const estimateName =
    document.getElementById(
      "editorEstimateName"
    ).value.trim();

  const price =
    Number(
      document.getElementById(
        "editorPrice"
      ).value
    );

  const unit =
    document.getElementById(
      "editorUnit"
    ).value.trim();

  const type =
    document.getElementById(
      "editorType"
    ).value;

  const group =
    document.getElementById(
      "editorGroup"
    ).value;

  const manufacturer =
    document.getElementById(
      "editorManufacturer"
    ).value.trim();

  const system =
    document.getElementById(
      "editorSystem"
    ).value.trim();

  const article =
    document.getElementById(
      "editorArticle"
    ).value.trim();

  if(
    !name
  ){

    alert(
      "Вкажіть назву."
    );

    return;
  }

  if(
    !estimateName
  ){

    alert(
      "Вкажіть назву для кошторису."
    );

    return;
  }

  if(
    !Number.isFinite(
      price
    ) ||
    price < 0
  ){

    alert(
      type === "material"
        ? "Вкажіть коректну базову ціну в EUR."
        : "Вкажіть коректну ціну."
    );

    return;
  }

  if(
    !unit
  ){

    alert(
      "Вкажіть одиницю."
    );

    return;
  }

  if(
    editingCatalogId
  ){

    const item =
      catalog.find(
        x =>
          x.id ===
          editingCatalogId
      );

    if(
      !item
    ){
      return;
    }

    const wasMaterial =
      item.type ===
      "material";

    if(
      !wasMaterial
    ){

      item.name =
        name;
    }

    item.estimateName =
      estimateName;

    item.unit =
      unit;

    item.type =
      type;

    if(
      type === "work"
    ){

      item.price =
        price;

      item.stage =
        group;

      delete item.category;
      delete item.manufacturer;
      delete item.system;
      delete item.article;

    }else{

      item.basePriceEUR =
        price;

      delete item.price;

      item.category =
        group;

      delete item.stage;

      item.manufacturer =
        manufacturer;

      item.system =
        system;

      if(
        !wasMaterial
      ){

        item.article =
          article;
      }
    }

  }else{

    const item = {

      id:
        "custom-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2,8),

      name:
        name,

      estimateName:
        estimateName,

      unit:
        unit,

      type:
        type
    };

    if(
      type === "work"
    ){

      item.price =
        price;

      item.stage =
        group;

    }else{

      item.basePriceEUR =
        price;

      item.category =
        group;

      item.manufacturer =
        manufacturer;

      item.system =
        system;

      item.article =
        article;
    }

    catalog.push(
      item
    );
  }

  saveCatalog();

  closeCatalogEditor();

  renderFilters();
  renderBrandFilters();
  renderSystemFilters();
  renderCatalog();
}
  function deleteCatalogItem(
  id
){

  const item =
    catalog.find(
      x =>
        x.id === id
    );

  if(
    !item
  ){
    return;
  }

  if(
    !confirm(
      `Видалити «${item.name}»?`
    )
  ){
    return;
  }

  catalog =
    catalog.filter(
      x =>
        x.id !== id
    );

  saveCatalog();

  renderBrandFilters();
  renderSystemFilters();
  renderCatalog();
}

  function cleanText(value){

    return String(value ?? "")
      .replace(/\u00a0/g," ")
      .replace(/[\r\n]+/g," ")
      .replace(/\s+/g," ")
      .trim();
  }

  function activeImportItems(){

  }

  function ntext(value){

    return cleanText(value)
      .toLowerCase();
  }

  function parseNumber(value){

    if(
      typeof value === "number" &&
      Number.isFinite(value)
    ){
      return value;
    }

    let text =
      cleanText(value)
        .replace(/[\s\u00A0']/g,"")
        .replace(/грн\.?/gi,"")
        .replace(/[^0-9,.-]/g,"");

    if(
      !text ||
      text === "-" ||
      text === "." ||
      text === ","
    ){
      return null;
    }

    const lastComma =
      text.lastIndexOf(",");

    const lastDot =
      text.lastIndexOf(".");

    if(
      lastComma >= 0 &&
      lastDot >= 0
    ){

      const decimalSeparator =
        lastComma > lastDot
          ? ","
          : ".";

      const thousandsSeparator =
        decimalSeparator === ","
          ? "."
          : ",";

      text =
        text
          .split(thousandsSeparator)
          .join("")
          .replace(
            decimalSeparator,
            "."
          );

    }else if(lastComma >= 0){

      const parts =
        text.split(",");

      if(
        parts.length > 2 ||
        (
          parts.length === 2 &&
          parts[1].length === 3 &&
          parts[0].replace("-","").length <= 3
        )
      ){
        text = parts.join("");
      }else{
        text = text.replace(",", ".");
      }

    }else if(lastDot >= 0){

      const parts =
        text.split(".");

      if(
        parts.length > 2 &&
        parts[parts.length - 1].length === 3
      ){
        text = parts.join("");
      }
    }

    if(
      !text ||
      text === "-" ||
      text === "." ||
      text === "-."
    ){
      return null;
    }

    const number =
      Number(text);

    return Number.isFinite(number)
      ? number
      : null;
  }

  function formatImportPrice(value){

    const number =
      Number(value);

    if(
      !Number.isFinite(number)
    ){
      return "";
    }

    const formatted =
      number.toLocaleString(
        "uk-UA",
        {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        }
      );

    if(importCurrency === "EUR") return formatted + " EUR";
    if(importCurrency === "UAH") return formatted + " грн";
    if(importCurrency === "USD") return formatted + " USD";
    return formatted + " (валюта не визначена)";
  }

    const text =

    return /^(шт|м|м2|м²|м3|м³|компл|упак|уп|кг|л|погм|пог м|pcs|pc)$/
      .test(text);
  }

  function findHeaderRow(rows){

    let best = null;

    rows
      .slice(0,60)
      .forEach(
        (row,rowIndex) => {

          let score = 0;
          let articleCol = -1;
          let qtyCol = -1;
          let nameHeaderCol = -1;

          let genericPriceCol = -1;
          let explicitRetailPriceCol = -1;
          let explicitMasterPriceCol = -1;
          let customerDiscountPriceCol = -1;

          row.forEach(
            (cell,col) => {

              const text =
                ntext(cell);

              if(!text){
                return;
              }

              if(
                /артикул|код товар|код$|sku/
                  .test(text)
              ){

                score += 4;

                if(
                  articleCol < 0
                ){
                  articleCol = col;
                }
              }

              if(
                /кількість|количество|к-сть|qty/
                  .test(text)
              ){

                score += 4;

                if(
                  qtyCol < 0
                ){
                  qtyCol = col;
                }
              }

              const isExplicitRetailPrice =
                /ціна.*без\s*зниж|цена.*без\s*скид|retail.*price|list.*price/
                  .test(text);

              // Важливо: «ціна зі знижкою» НЕ є ціною майстра.
              // Це може бути індивідуальна знижка клієнтові, яку в каталозі
              // не зберігаємо. Ціною майстра вважаємо лише явну закупівельну/
              // оптову/дилерську колонку.
              const isExplicitMasterPrice =
                /ціна.*майстра|ціна.*закуп|закупівельн|закупочн|оптов|wholesale|dealer.*price/
                  .test(text);

              const isCustomerDiscountPrice =
                /ціна.*(зі|з)\s*зниж|цена.*(со|с)\s*скид|ціна.*після.*зниж|цена.*после.*скид|discount.*price|акційн.*ціна|акционн.*цена/
                  .test(text) &&
                !isExplicitRetailPrice &&
                !isExplicitMasterPrice;

              const isGenericPrice =
                /(^|\s)ціна(?:$|\s|[,:(])|(^|\s)цена(?:$|\s|[,:(])|^price(?:$|\s|[,:(])/
                  .test(text) &&
                !isExplicitRetailPrice &&
                !isExplicitMasterPrice &&
                !isCustomerDiscountPrice;

              if(
                isExplicitRetailPrice &&
                explicitRetailPriceCol < 0
              ){
                explicitRetailPriceCol = col;
                score += 5;
              }

              if(
                isExplicitMasterPrice &&
                explicitMasterPriceCol < 0
              ){
                explicitMasterPriceCol = col;
                score += 5;
              }

              if(
                isCustomerDiscountPrice &&
                customerDiscountPriceCol < 0
              ){
                customerDiscountPriceCol = col;
                score += 2;
              }

              if(
                isGenericPrice &&
                genericPriceCol < 0
              ){
                genericPriceCol = col;
                score += 4;
              }

              if(
                /товар|найменув|наименов|назва|именование|product/
                  .test(text)
              ){

                score += 3;

                if(
                  nameHeaderCol < 0
                ){
                  nameHeaderCol = col;
                }
              }
            }
          );

          let regularPriceCol = -1;
          let discountPriceCol = -1;
          let priceCol = -1;

          if(explicitRetailPriceCol >= 0){
            regularPriceCol = explicitRetailPriceCol;
          }

          if(explicitMasterPriceCol >= 0){
            discountPriceCol = explicitMasterPriceCol;
          }

          if(explicitRetailPriceCol >= 0 && explicitMasterPriceCol >= 0){
            discountPriceCol = explicitMasterPriceCol;
            priceCol = explicitRetailPriceCol;
          }else if(
            explicitRetailPriceCol >= 0 &&
            genericPriceCol >= 0
          ){
            priceCol = explicitRetailPriceCol;

          }else if(
            explicitMasterPriceCol >= 0 &&
            genericPriceCol >= 0
          ){
            regularPriceCol = genericPriceCol;

            priceCol =
              explicitMasterPriceCol;

          }else if(
            explicitRetailPriceCol >= 0
          ){
            priceCol =
              explicitRetailPriceCol;

          }else if(
            explicitMasterPriceCol >= 0
          ){
            priceCol =
              explicitMasterPriceCol;

          }else if(
            genericPriceCol >= 0
          ){
            priceCol =
              genericPriceCol;
          }else if(
            customerDiscountPriceCol >= 0
          ){
            // Товар з єдиною клієнтською ціною все одно можна додати в
            // каталог, але її подальшу долю вирішує майстер у вікні імпорту.
            priceCol = customerDiscountPriceCol;
          }

          if(priceCol >= 0 && nameHeaderCol >= 0 && score >= 7){

            if(
              !best ||
              score > best.score
            ){

              best = {
                rowIndex,
                score,
                articleCol,
                qtyCol,
                priceCol,
                regularPriceCol,
                discountPriceCol,
                customerDiscountPriceCol,
                nameHeaderCol
              };
            }
          }
        }
      );

    return best;
  }

  function detectDataColumns(
    rows,
    header
  ){

    const sample =
      rows.slice(
        header.rowIndex + 1,
        header.rowIndex + 45
      );

    const startName =
      Math.max(
        0,
        header.nameHeaderCol >= 0
          ? header.nameHeaderCol
          : (
              header.articleCol >= 0
                ? header.articleCol + 1
                : 0
            )
      );

    const endName =
      Math.max(
        startName,
        (header.qtyCol >= 0 ? header.qtyCol : header.priceCol) - 1
      );

    let nameCol =
      startName;

    let bestNameScore =
      -1;

    for(
      let col = startName;
      col <= endName;
      col++
    ){

      let count = 0;
      let chars = 0;

      sample.forEach(
        row => {

          const value =
            cleanText(
              row[col]
            );

          if(
            value &&
            !isUnit(value) &&
            parseNumber(value) === null &&
            value.length >= 4
          ){

            count++;
            chars +=
              value.length;
          }
        }
      );

      const score =
        count * 100 +
        chars;

      if(
        score >
        bestNameScore
      ){

        bestNameScore =
          score;

        nameCol =
          col;
      }
    }

    let unitCol =
      -1;

    let bestUnitScore =
      0;

    const maxCols =
      Math.max(
        ...sample.map(
          row => row.length
        ),
        header.priceCol + 1,
        header.qtyCol + 1
      );

    for(
      let col = 0;
      col < maxCols;
      col++
    ){

      if(
        col === nameCol ||
        col === header.articleCol ||
        col === header.qtyCol ||
        col === header.priceCol
      ){
        continue;
      }

      let score = 0;

      sample.forEach(
        row => {

          if(
            isUnit(
              row[col]
            )
          ){
            score++;
          }
        }
      );

      if(
        score >
        bestUnitScore
      ){

        bestUnitScore =
          score;

        unitCol =
          col;
      }
    }

    return {
      articleCol:
        header.articleCol,

      qtyCol:
        header.qtyCol,

      priceCol:
        header.priceCol,

      regularPriceCol:
        header.regularPriceCol ?? -1,

      discountPriceCol:
        header.discountPriceCol ?? -1,

      customerDiscountPriceCol:
        header.customerDiscountPriceCol ?? -1,

      nameCol,

      unitCol
    };
  }

  function classifyHeading(
    text,
    context
  ){

    const clean =
      cleanText(text);

    const source =
      ntext(clean);

    if(!source){
      return false;
    }

    if(
      /каналіз|канализ/
        .test(source)
    ){

      context.category =
        "sewer";

      context.brand = "";
      context.system = "";

      return true;
    }

    if(
      /водопостач|водоснаб|водопров/
        .test(source)
    ){

      context.category =
        "water";

      context.brand = "";
      context.system = "";

      return true;
    }

    if(
      /запірн.*арматур|запорн.*арматур/
        .test(source)
    ){

      context.category =
        "fittings";

      context.brand = "";
      context.system = "";

      return true;
    }

    if(
      /комплектуюч|комплектующ|кріплен|креплен|ізоляц|изоляц/
        .test(source)
    ){

      context.category =
        "other";

      const headingBrand =
        detectBrand(clean);

      const headingSystem =
        detectSystem(
          clean,
          headingBrand
        );

      context.brand =
        headingBrand || "";

      context.system =
        headingSystem || "";

      return true;
    }

    const brand =
      detectBrand(clean);

    const system =
      detectSystem(
        clean,
        brand
      );

    if(system){

      context.system =
        system;

      if(!context.brand){

        context.brand =
          detectBrand(
            system
          );
      }

      const category =
        detectCategory(
          clean,
          context.brand,
          system
        );

      if(category){
        context.category =
          category;
      }

      return true;
    }

    if(brand){

      context.brand =
        brand;

      context.system = "";

      const category =
        detectCategory(
          clean,
          brand,
          ""
        );

      if(category){
        context.category =
          category;
      }

      return true;
    }

    return false;
  }

  function getRowText(
    row,
    from = 0,
    to = null
  ){

    const end =
      to === null
        ? row.length - 1
        : Math.min(
            to,
            row.length - 1
          );

    const parts = [];

    for(
      let i = from;
      i <= end;
      i++
    ){

      const value =
        cleanText(row[i]);

      if(value){
        parts.push(value);
      }
    }

    return parts.join(" ");
  }

  function extractArticleFromName(
    name
  ){

    const text =
      cleanText(name);

    if(!text){
      return "";
    }

    const match =
      text.match(
        /(?:^|\s)([A-ZА-ЯІЇЄҐ0-9][A-ZА-ЯІЇЄҐ0-9._-]{3,})$/i
      );

    if(!match){
      return "";
    }

    const candidate =
      cleanText(
        match[1]
      );

    if(
      !/\d/.test(candidate)
    ){
      return "";
    }

    if(
      /^\d+(?:[.,]\d+)?$/
        .test(candidate)
    ){
      return "";
    }

    return candidate;
  }

  function extractManufacturerArticleFromName(
    name,
    directBrand = ""
  ){

    const text =
      cleanText(name);

    if(!text){
      return "";
    }

    // Без явно визначеного бренду дозволяємо лише дуже вузький
    // випадок: окремий цифровий код із 5–10 цифр наприкінці назви.
    // Це потрібно для позицій на кшталт Oventrop ... 4200553,
    // де бренд приходить із групового контексту рахунку.
    if(!directBrand){
      const trailingNumeric =
        text.match(/(?:^|\s)(\d{5,10})$/);

      return trailingNumeric
        ? cleanText(trailingNumeric[1])
        : "";
    }

    const candidates = [];

    const leading =
      text.match(
        /^([A-ZА-ЯІЇЄҐ0-9][A-ZА-ЯІЇЄҐ0-9._-]{4,15})(?:\s+|$)/i
      );

    if(leading){
      candidates.push(
        cleanText(leading[1])
      );
    }

    const trailing =
      text.match(
        /(?:^|\s)([A-ZА-ЯІЇЄҐ0-9][A-ZА-ЯІЇЄҐ0-9._-]{4,15})$/i
      );

    if(trailing){
      const value =
        cleanText(trailing[1]);

      if(
        !candidates.some(
          item => ntext(item) === ntext(value)
        )
      ){
        candidates.push(value);
      }
    }

    for(const candidate of candidates){

      if(!/\d/.test(candidate)){
        continue;
      }

      // Чисто цифрові артикули: 5–10 цифр.
      // Це відсікає типові розміри/кути на кшталт 20, 90, 1000.
      if(/^\d+$/.test(candidate)){
        if(/^\d{5,10}$/.test(candidate)){
          return candidate;
        }
        continue;
      }

      // Літерно-цифрові коди виробника, напр. VS0506008.
      if(
        /^[A-ZА-ЯІЇЄҐ0-9._-]{5,16}$/i.test(candidate) &&
        /[A-ZА-ЯІЇЄҐ]/i.test(candidate)
      ){
        return candidate;
      }
    }

    return "";
  }

  function parseSheetRows(
    rows,
    header
  ){

    const columns =
      detectDataColumns(
        rows,
        header
      );

    const result = [];

    const context = {
      category:"",
      brand:"",
      system:""
    };

    const savedRules =
      loadImportRules();

    let emptyStreak = 0;

    for(
      let rowIndex =
        header.rowIndex + 1;

      rowIndex < rows.length;

      rowIndex++
    ){

      const row =
        rows[rowIndex] || [];

      const rowText =
        getRowText(row);

      if(!rowText){

        emptyStreak++;

        if(
          emptyStreak > 15 &&
          result.length
        ){
          break;
        }

        continue;
      }

      emptyStreak = 0;

      const name =
        cleanText(
          row[
            columns.nameCol
          ]
        );

      const supplierArticle =
        columns.articleCol >= 0
          ? cleanText(
              row[
                columns.articleCol
              ]
            )
          : "";

      let article =
        supplierArticle ||
        extractArticleFromName(
          name
        );

      const qty =
        columns.qtyCol >= 0
          ? parseNumber(row[columns.qtyCol])
          : null;

      const price =
        parseNumber(
          row[
            columns.priceCol
          ]
        );

      const retailPrice =
        columns.regularPriceCol >= 0
          ? parseNumber(row[columns.regularPriceCol])
          : null;

      const masterPrice =
        columns.discountPriceCol >= 0
          ? parseNumber(row[columns.discountPriceCol])
          : null;

      // Зчитуємо лише для попереднього перегляду. Ця ціна не потрапляє
      // ані в каталог, ані в ціну майстра.
      const customerDiscountPrice =
        columns.customerDiscountPriceCol >= 0
          ? parseNumber(row[columns.customerDiscountPriceCol])
          : null;

      const unit =
        columns.unitCol >= 0
          ? cleanText(
              row[
                columns.unitCol
              ]
            )
          : "";

      const hasProductShape =
        name &&
        price !== null &&
        price >= 0;

      if(!hasProductShape){

        const lower =
          ntext(rowText);

        if(
          /разом|всього|итого|всего|пдв|ндс|до сплати|к оплате/
            .test(lower)
        ){
          continue;
        }

        classifyHeading(
          rowText,
          context
        );

        continue;
      }

      if(
        !isLikelyArticle(article) &&
        !name
      ){
        continue;
      }

      let brand =
        context.brand || "";

      let system =
        context.system || "";

      let category =
        context.category || "";

      const detectedBrand =
        detectBrand(
          name,
          article
        );

      const detectedSystem =
        detectSystem(
          name,
          detectedBrand ||
          brand
        );

      // Якщо сама товарна позиція явно вказує інший бренд,
      // не переносимо на неї категорію/систему попередньої групи.
      if(
        detectedBrand &&
        context.brand &&
        detectedBrand !== context.brand
      ){
        brand = detectedBrand;
        system = "";
        category = "";
      }else if(detectedBrand){
        brand = detectedBrand;
      }

      const manufacturerArticle =
        extractManufacturerArticleFromName(
          name,
          detectedBrand
        );

      if(manufacturerArticle){
        article =
          manufacturerArticle;
      }

      if(detectedSystem){
        system =
          detectedSystem;
      }

      const detectedCategory =
        detectCategory(
          name,
          detectedBrand ||
          "",
          detectedSystem ||
          ""
        );

      if(detectedCategory){

        // Пряма категорія товару сильніша за контекст групи.
        // Якщо вона змінилася, старий бренд/система не повинні
        // "перетікати" з попереднього блоку рахунку.
        if(
          context.category &&
          detectedCategory !== context.category
        ){
          if(!detectedBrand){
            brand = "";
          }
          if(!detectedSystem){
            system = "";
          }
        }

        category =
          detectedCategory;
      }

      if(
        detectedCategory === "other"
      ){
        if(!detectedBrand){

          const sourceName =
            ntext(name);

          const keepWalravenContext =
            context.brand === "Walraven" &&
            /\bbis\b|\b2s\b|\bwup\b|хомут|дюбел|шуруп|гвинт|винт|кріплен|креплен/
              .test(sourceName);

          brand =
            keepWalravenContext
              ? "Walraven"
              : "";
        }

        if(!detectedSystem){
          system = "";
        }
      }

      const key =
        ruleKey(
          article,
          name
        );

      const saved =
        savedRules[key];

      if(saved){

        if(
          !category &&
          typeof saved.category ===
          "string"
        ){
          category =
            saved.category;
        }

        if(
          !detectedBrand &&
          detectedCategory !== "other" &&
          typeof saved.manufacturer ===
          "string" &&
          saved.manufacturer
        ){
          brand =
            saved.manufacturer;
        }

        if(
          !detectedSystem &&
          detectedCategory !== "other" &&
          typeof saved.system ===
          "string" &&
          saved.system
        ){
          system =
            saved.system;
        }
      }

      result.push({

        rowIndex:
          rowIndex + 1,

        article,

        supplierArticle,

        name,

        qty,

        price,

        retailPrice,

        masterPrice,

        customerDiscountPrice,

        unit:
          unit || "шт",

        category,

        manufacturer:
          brand,

        system,

        sourceText:
          rowText

      });
    }

    return result;
  }

  function getImportableSheets(workbook){
    const result = [];

    workbook.SheetNames.forEach(sheetName => {

          const sheet =
            workbook.Sheets[
              sheetName
            ];

          const rows =
            XLSX.utils.sheet_to_json(
              sheet,
              {
                header:1,
                raw:false,
                defval:"",
                blankrows:true
              }
            );

          const header =
            findHeaderRow(rows);

          if(!header){
            return;
          }

          const items =
            parseSheetRows(
              rows,
              header
            );

          const supplierFullName =
            detectSupplierFullName(rows,header);

          const hasDualPrices =
            items.some(item =>
              Number.isFinite(item.retailPrice) &&
              Number.isFinite(item.masterPrice)
            );

          const hasCustomerDiscountOnly =
            items.some(item =>
              Number.isFinite(item.customerDiscountPrice) &&
              !Number.isFinite(item.retailPrice) &&
              !Number.isFinite(item.masterPrice)
            );

          const hasRetailPriceOnly =
            items.some(item =>
              Number.isFinite(item.retailPrice) &&
              !Number.isFinite(item.masterPrice)
            );

          const hasMasterPriceOnly =
            items.some(item =>
              Number.isFinite(item.masterPrice) &&
              !Number.isFinite(item.retailPrice)
            );

          result.push({
            sheetName,
            rows,
            header,
            items,
            supplierFullName,
            hasDualPrices,
            hasCustomerDiscountOnly,
            hasRetailPriceOnly,
            hasMasterPriceOnly
          });
        }
      );

    return result.sort((a,b) => b.items.length - a.items.length);
  }

  function chooseBestSheet(workbook){
    return getImportableSheets(workbook)[0] || null;
  }

  function detectInvoiceCurrency(rows,header){
    const source = rows
      // Символ валюти часто стоїть не в шапці, а в самих цінових комірках.
      .slice(0,rows.length)
      .flat()
      .map(ntext)
      .join(" ");
    const found = new Set();
    if(/(?:\beur\b|€)/.test(source)) found.add("EUR");
    if(/(?:\buah\b|грн|₴)/.test(source)) found.add("UAH");
    if(/(?:\busd\b|\$)/.test(source)) found.add("USD");
    return found.size === 1 ? Array.from(found)[0] : "";
  }

  function prepareSupplierImport(parsed){
    pendingSupplierImport = parsed.items.map(item => ({...item,include:true}));
    importSupplierFullName = cleanText(parsed.supplierFullName || "");

    const supplierNames = loadSupplierNames();
    importSupplierName = importSupplierFullName && supplierNames[supplierKey(importSupplierFullName)]
      ? supplierNames[supplierKey(importSupplierFullName)]
      : "";

    importHasDualPrices = !!parsed.hasDualPrices;
    importHasCustomerDiscountOnly = !!parsed.hasCustomerDiscountOnly;
    importHasRetailPriceOnly = !!parsed.hasRetailPriceOnly;
    importHasMasterPriceOnly = !!parsed.hasMasterPriceOnly;
    importPriceMode = importHasDualPrices ? "auto" : importHasRetailPriceOnly ? "retail" : importHasMasterPriceOnly ? "master" : "";
    importCustomerDiscountPercent = null;
    detectedInvoiceCurrency = detectInvoiceCurrency(parsed.rows,parsed.header);

    // Рахунок у гривні проходить без додаткового вибору валюти.
    // Для EUR/USD залишаємо поле порожнім, щоб майстер підтвердив валюту й курс.
    importCurrency = detectedInvoiceCurrency === "UAH" ? "UAH" : "";
    importShowAll = false;
    importEurRate = Number(localStorage.getItem(EUR_RATE_KEY) || importEurRate || 0);
    if(!Number.isFinite(importEurRate) || importEurRate < 0) importEurRate = 0;
    importUsdRate = Number(localStorage.getItem(USD_RATE_KEY) || importUsdRate || 0);
    if(!Number.isFinite(importUsdRate) || importUsdRate < 0) importUsdRate = 0;

    const applyButton = document.getElementById("supplierImportApply");
    applyButton.textContent = "Імпортувати";
    applyButton.onclick = applySupplierImport;
    renderSupplierImport();
    importSheet.classList.add("open");
  }

  async function handleSupplierFile(
    event
  ){

    const file =
      event.target.files &&
      event.target.files[0];

    event.target.value = "";

    if(!file){
      return;
    }

    if(
      typeof XLSX ===
      "undefined"
    ){

      alert(
        "Модуль XLS/XLSX не завантажився."
      );

      return;
    }

    try{

      const buffer =
        await file.arrayBuffer();

      const workbook =
        XLSX.read(
          buffer,
          {
            type:"array",
            cellDates:false
          }
        );

      const sheets = getImportableSheets(workbook);
      const parsed = sheets[0] || null;

      if(
        !parsed ||
        !parsed.items.length
      ){

        alert(
          "Не вдалося знайти таблицю товарів у цьому рахунку."
        );

        return;
      }

      if(sheets.length > 1){
        parsedImportSheets = sheets;
        selectedImportSheet = sheets[0].sheetName;
        openImportSheetChoice();
        return;
      }

      prepareSupplierImport(parsed);

    }catch(error){

      console.error(
        "Supplier import error:",
        error
      );

      alert(
        "Не вдалося прочитати файл рахунку."
      );
    }
  }

  }

  function getImportPreview(item){
    const existing = findExistingCatalogItem(item);
    if(!existing) return {kind:"new",label:"Новий товар",existing:null,unitWarning:false};

    const unitWarning = !!(
      existing.unit && item.unit && ntext(existing.unit) !== ntext(item.unit)
    );
    const pair = getImportedPricePair(item,"preview");
    const offer = Array.isArray(existing.supplierOffers)
      ? existing.supplierOffers.find(value => supplierKey(value && value.supplierName) === supplierKey(importSupplierName))
      : null;
    const sameRetail = !pair.retail || (
      offer && Number(offer.retail && offer.retail.priceEUR) === Number(pair.retail.priceEUR)
    );
    const sameMaster = !pair.master || (
      offer && Number(offer.master && offer.master.priceEUR) === Number(pair.master.priceEUR)
    );
    const sameFields =
      ntext(existing.name) === ntext(item.name) &&
      ntext(existing.unit) === ntext(item.unit) &&
      ntext(existing.category) === ntext(item.category) &&
      ntext(existing.manufacturer) === ntext(item.manufacturer) &&
      ntext(existing.system) === ntext(item.system);

    return sameRetail && sameMaster && sameFields
      ? {kind:"same",label:"Без змін",existing,unitWarning}
      : {kind:"update",label:"Буде оновлено",existing,unitWarning};
  }

  function findExistingCatalogItem(
    imported
  ){

    const article =
      ntext(
        imported.article
      );

    if(article){

      const byArticle = catalog.filter(
        item =>
          item.type === "material" &&
          ntext(item.article) === article
      );

      const brand = ntext(imported.manufacturer);
      const byBrandAndArticle = brand
        ? byArticle.find(item => ntext(item.manufacturer) === brand)
        : null;

      if(byBrandAndArticle){
        return byBrandAndArticle;
      }

      // Старі картки могли не мати бренду. Безпечний fallback можливий
      // лише коли артикул у каталозі унікальний.
      if(byArticle.length === 1){
        return byArticle[0];
      }
    }

    const supplierArticle =
      ntext(
        imported.supplierArticle
      );

    if(
      supplierArticle &&
      importSupplierName
    ){

      const supplier =
        supplierKey(
          importSupplierName
        );

      const bySupplierArticle =
        catalog.find(
          item =>
            item.type === "material" &&
            Array.isArray(item.supplierOffers) &&
            item.supplierOffers.some(
              offer =>
                supplierKey(offer && offer.supplierName) === supplier &&
                ntext(offer && offer.supplierArticle) === supplierArticle
            )
        );

      if(bySupplierArticle){
        return bySupplierArticle;
      }
    }

    const name =
      ntext(
        imported.name
      );

    if(name){

      return catalog.find(
        item =>
          item.type === "material" &&
          ntext(
            item.name
          ) === name
      ) || null;
    }

    return null;
  }

  function convertImportedPriceToEUR(sourcePrice){
    const number = Number(sourcePrice);
    if(!Number.isFinite(number) || number < 0) return null;
    if(importCurrency === "EUR") return number;
    if(!Number.isFinite(importEurRate) || importEurRate <= 0) return null;
    if(importCurrency === "USD"){
      if(!Number.isFinite(importUsdRate) || importUsdRate <= 0) return null;
      return number * importUsdRate / importEurRate;
    }
    return number / importEurRate;
  }

  function makePriceSnapshot(sourcePrice,importedAt){
    const priceEUR = convertImportedPriceToEUR(sourcePrice);
    if(!Number.isFinite(priceEUR) || priceEUR < 0) return null;
    return {
      priceEUR,
      sourcePrice:Number(sourcePrice),
      sourceCurrency:importCurrency,
      // Для USD зберігаємо обидва курси: це дозволяє надалі показати
      // еквівалент у гривні саме за курсом імпорту, а не поточним курсом.
      // Для EUR теж фіксуємо курс, який майстер підтвердив перед імпортом.
      eurRate:importEurRate > 0 ? importEurRate : null,
      usdRate:importCurrency === "USD" ? importUsdRate : null,
      importedAt
    };
  }

  function getImportedPricePair(imported,importedAt){
    let retail = null;
    let master = null;

    if(importHasCustomerDiscountOnly){
      const percent = Number(importCustomerDiscountPercent);
      const sourcePrice = Number(imported.customerDiscountPrice);
      if(Number.isFinite(percent) && percent > 0 && percent < 100 && Number.isFinite(sourcePrice)){
        retail = makePriceSnapshot(sourcePrice / (1 - percent / 100),importedAt);
      }
    }else if(importHasDualPrices){
      if(Number.isFinite(imported.retailPrice)) retail = makePriceSnapshot(imported.retailPrice,importedAt);
      if(Number.isFinite(imported.masterPrice)) master = makePriceSnapshot(imported.masterPrice,importedAt);
    }else if(importHasRetailPriceOnly){
      retail = makePriceSnapshot(imported.retailPrice,importedAt);
    }else if(importHasMasterPriceOnly){
      master = makePriceSnapshot(imported.masterPrice,importedAt);
    }else if(importPriceMode === "retail"){
      retail = makePriceSnapshot(imported.price,importedAt);
    }else if(importPriceMode === "master"){
      master = makePriceSnapshot(imported.price,importedAt);
    }
    return {retail,master};
  }

  function updateCustomerDiscountPercent(){
    const input = document.getElementById("supplierImportCustomerDiscount");
    if(!input) return;
    const value = Number(String(input.value).replace(",","."));
    importCustomerDiscountPercent = Number.isFinite(value) ? value : null;
    renderSupplierImport();
  }

  function calculatedRetailPrice(value){
    const percent = Number(importCustomerDiscountPercent);
    const price = Number(value);
    if(!Number.isFinite(percent) || percent <= 0 || percent >= 100 || !Number.isFinite(price)) return null;
    return price / (1 - percent / 100);
  }

  function upsertSupplierOffer(item,pricePair,importedAt,supplierArticle = ""){
    if(!Array.isArray(item.supplierOffers)) item.supplierOffers = [];
    const key = supplierKey(importSupplierName);
    let offer = item.supplierOffers.find(value => supplierKey(value && value.supplierName) === key);
    if(!offer){
      offer = {supplierId:key,supplierName:importSupplierName,supplierFullName:importSupplierFullName || "",retail:null,master:null,updatedAt:importedAt};
      item.supplierOffers.push(offer);
    }
    offer.supplierId = key;
    offer.supplierName = importSupplierName;
    if(importSupplierFullName) offer.supplierFullName = importSupplierFullName;
    if(supplierArticle) offer.supplierArticle = cleanText(supplierArticle);
    if(pricePair.retail) offer.retail = pricePair.retail;
    if(pricePair.master) offer.master = pricePair.master;
    offer.updatedAt = importedAt;
  }

  function getCatalogRetailPriceEUR(existing,pricePair){
    if(pricePair.retail) return pricePair.retail.priceEUR;
    const previous = Number(existing && (existing.retailPriceEUR ?? existing.basePriceEUR));
    return Number.isFinite(previous) && previous >= 0 ? previous : 0;
  }

  function getCatalogPurchasePriceEUR(existing,pricePair){
    if(pricePair.master) return pricePair.master.priceEUR;
    const previous = Number(existing && existing.purchasePriceEUR);
    return Number.isFinite(previous) && previous >= 0 ? previous : 0;
  }

  function escapeDiagHtml(value){
    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function formatDiagMoneyFromSnapshot(snapshot){
    if(!snapshot || !Number.isFinite(Number(snapshot.priceEUR))){
      return "—";
    }
    const rate = Number(snapshot.eurRate) > 0
      ? Number(snapshot.eurRate)
      : Number(localStorage.getItem(EUR_RATE_KEY) || 0);
    if(Number.isFinite(rate) && rate > 0){
      return (Number(snapshot.priceEUR) * rate).toLocaleString("uk-UA",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }) + " грн";
    }
    return Number(snapshot.priceEUR).toLocaleString("uk-UA",{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }) + " EUR";
  }

  function formatDiagDate(value){
    if(!value) return "—";
    const date = new Date(value);
    if(Number.isNaN(date.getTime())) return escapeDiagHtml(value);
    return date.toLocaleString("uk-UA",{
      day:"2-digit",month:"2-digit",year:"numeric",
      hour:"2-digit",minute:"2-digit"
    });
  }

  function renderSupplierDiag(){
    const list = document.getElementById("supplierDiagList");
    if(!list) return;
    const query = ntext(document.getElementById("supplierDiagSearch")?.value || "");
    const items = catalog
      .filter(item => item.type === "material" && Array.isArray(item.supplierOffers) && item.supplierOffers.length)
      .filter(item => {
        if(!query) return true;
        const haystack = ntext([
          item.name,item.estimateName,item.article,item.manufacturer,item.system,
          ...item.supplierOffers.flatMap(offer => [offer?.supplierName,offer?.supplierArticle])
        ].join(" "));
        return haystack.includes(query);
      })
      .slice(0,80);

    if(!items.length){
      list.innerHTML = '<div class="importEmpty">Нічого не знайдено.</div>';
      return;
    }

    list.innerHTML = items.map(item => {
      const offers = item.supplierOffers.map(offer => {
        const retail = formatDiagMoneyFromSnapshot(offer?.retail);
        const master = formatDiagMoneyFromSnapshot(offer?.master);
        const date = formatDiagDate(offer?.updatedAt || offer?.master?.importedAt || offer?.retail?.importedAt);
        return `
          <div class="supplierDiagOffer">
            <strong>${escapeDiagHtml(offer?.supplierName || "Без назви")}</strong>
            <div class="supplierDiagLine">Роздрібна: <b>${escapeDiagHtml(retail)}</b></div>
            <div class="supplierDiagLine">Майстра: <b>${escapeDiagHtml(master)}</b></div>
            <div class="supplierDiagLine">Код постачальника: ${escapeDiagHtml(offer?.supplierArticle || "—")}</div>
            <div class="supplierDiagLine">Імпорт: ${escapeDiagHtml(date)}</div>
          </div>
        `;
      }).join("");
      return `
        <div class="supplierDiagItem">
          <div class="supplierDiagName">${escapeDiagHtml(item.name || item.estimateName || "Без назви")}</div>
          <div class="supplierDiagMeta">Артикул: ${escapeDiagHtml(item.article || "—")} · ${escapeDiagHtml(item.manufacturer || "")}</div>
          ${offers}
        </div>
      `;
    }).join("");
  }

  function applySupplierImport(){

    if(
      !pendingSupplierImport.length
    ){
      return;
    }

    updateImportSupplier();
    updateImportPriceMode();
    updateImportCurrency();
    updateImportRate();

    if(!importSupplierName){
      alert("Вкажіть коротку назву постачальника.");
      return;
    }

    if(!importHasDualPrices && !importHasCustomerDiscountOnly && !["retail","master"].includes(importPriceMode)){
      alert("Оберіть тип ціни: роздрібна або ціна майстра.");
      return;
    }

    if(importHasCustomerDiscountOnly && !(
      Number.isFinite(Number(importCustomerDiscountPercent)) &&
      Number(importCustomerDiscountPercent) > 0 &&
      Number(importCustomerDiscountPercent) < 100
    )){
      alert("Вкажіть знижку понад 0 і менше 100%.");
      return;
    }

    if(!["UAH","EUR","USD"].includes(importCurrency)){
      alert("Оберіть валюту рахунку. Вона не підставляється автоматично, якщо файл не дав однозначної відповіді.");
      return;
    }

    const importItems = activeImportItems();

    if(!importItems.length){
      alert("Позначте хоча б одну позицію для імпорту.");
      return;
    }

    const unresolved =
      importItems
        .filter(
          item =>
            !item.category
        );

    if(unresolved.length){

      alert(
        `Залишилось ${unresolved.length} невизначених позицій. Спочатку призначте їм категорію.`
      );

      return;
    }

    if(
      !Number.isFinite(importEurRate) ||
      importEurRate <= 0
    ){
      alert(
        importCurrency === "UAH"
          ? "Для імпорту рахунку в гривнях спершу встановіть ручний курс EUR у каталозі."
          : "Вкажіть коректний курс EUR."
      );

      return;
    }

    if(
      importCurrency === "USD" &&
      (!Number.isFinite(importUsdRate) || importUsdRate <= 0)
    ){
      alert("Вкажіть коректний курс USD.");
      return;
    }

    const rules =
      loadImportRules();

    const importedAt = new Date().toISOString();

    let created = 0;
    let updated = 0;
    let unchanged = 0;

    const unitConflicts = importItems
      .map(item => ({item,preview:getImportPreview(item)}))
      .filter(value => value.preview.unitWarning);

    if(unitConflicts.length){
      alert(
        "Імпорт зупинено: для частини знайдених товарів відрізняється одиниця виміру.\n\n" +
        unitConflicts.slice(0,8).map(value =>
          value.item.name + ": у каталозі «" + value.preview.existing.unit + "», у файлі «" + value.item.unit + "»"
        ).join("\n") +
        (unitConflicts.length > 8 ? "\n…" : "")
      );
      return;
    }

    for(
      const imported
      of importItems
    ){

      const pricePair = getImportedPricePair(imported,importedAt);

      if(!pricePair.retail && !pricePair.master){

        alert(
          `Не вдалося визначити ціну для позиції:\n${imported.name}`
        );

        return;
      }
    }

    importItems
      .forEach(
        imported => {

          rememberImportRule(
            imported,
            rules
          );

          const pricePair = getImportedPricePair(imported,importedAt);

          const existing =
            findExistingCatalogItem(
              imported
            );

          const preview = getImportPreview(imported);

          if(existing && preview.kind === "same"){
            unchanged++;
            return;
          }

          if(existing){

            const retailPriceEUR = getCatalogRetailPriceEUR(existing,pricePair);
            const purchasePriceEUR = getCatalogPurchasePriceEUR(existing,pricePair);

            existing.name =
              imported.name;

            if(
              !existing.estimateName
            ){
              existing.estimateName =
                imported.name;
            }

            // Роздрібна ціна — єдина ціна, що може стати ціною для клієнта.
            // Ціна майстра лишається окремою закупівельною підказкою.
            existing.retailPriceEUR = retailPriceEUR;
            existing.purchasePriceEUR = purchasePriceEUR;
            existing.basePriceEUR = retailPriceEUR;

            delete existing.price;

            existing.unit =
              imported.unit || "шт";

            existing.category =
              imported.category;

            existing.manufacturer =
              imported.manufacturer || "";

            existing.system =
              imported.system || "";

            existing.article =
              imported.article ||
              existing.article ||
              "";

            upsertSupplierOffer(existing,pricePair,importedAt,imported.supplierArticle);

            updated++;

          }else{

            const retailPriceEUR = getCatalogRetailPriceEUR(null,pricePair);
            const purchasePriceEUR = getCatalogPurchasePriceEUR(null,pricePair);

            catalog.push({

              id:
                makeImportedId(),

              name:
                imported.name,

              estimateName:
                imported.name,

              type:
                "material",

              category:
                imported.category,

              manufacturer:
                imported.manufacturer || "",

              system:
                imported.system || "",

              article:
                imported.article || "",

              retailPriceEUR,

              purchasePriceEUR,

              // Тимчасово лишається для сумісності зі старим інтерфейсом.
              basePriceEUR:
                retailPriceEUR,

              unit:
                imported.unit || "шт",

              supplierOffers:[]

            });

            const createdItem = catalog[catalog.length - 1];
            upsertSupplierOffer(createdItem,pricePair,importedAt,imported.supplierArticle);

            created++;
          }
        }
      );

    saveImportRules(
      rules
    );

    if(importSupplierFullName){
      const supplierNames = loadSupplierNames();
      supplierNames[supplierKey(importSupplierFullName)] = importSupplierName;
      saveSupplierNames(supplierNames);
    }

    if(["UAH","EUR","USD"].includes(importCurrency)){

      localStorage.setItem(
        EUR_RATE_KEY,
        String(
          importEurRate
        )
      );

      try{

        eurRate =
          importEurRate;

      }catch(error){

        console.warn(
          "EUR rate sync:",
          error
        );
      }

      if(
        typeof updateEurRateButton ===
        "function"
      ){

        updateEurRateButton();
      }
    }

    if(importCurrency === "USD"){
      localStorage.setItem(USD_RATE_KEY,String(importUsdRate));
    }

    saveCatalog();

    const supplierNameForAlert = importSupplierName;

    closeSupplierImport();

    renderFilters();
    renderBrandFilters();
    renderSystemFilters();
    renderCatalog();

    alert(
      `Імпорт завершено.\nПостачальник: ${supplierNameForAlert}\nДодано: ${created}\nОновлено: ${updated}\nБез змін: ${unchanged}`
    );
  }

})();

</script>

</body>
</html>
