  wfV2.topups.push({
    id:"topup-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),
    name:String(name).trim(),
    qty:Math.max(.01,qty),
    unit:String(unit).trim()||"шт",
    comment:comment,
    sourceMaterialId:"",
    system:"",
    stage:context,
    room:"",
    status:"new",
    createdAt:wfNow()
  });
  wfSave();
  renderProcurement();
}

function wfOpenTopup(encodedId){
  const item=wfV2.topups.find(function(entry){return entry.id===wfDecode(encodedId);});
  if(!item)return;
  const id=wfEncode(item.id);
  const options=[
    ["new","Нове"],
    ["working","В роботі"],
    ["ordered","Додано до запиту/замовлення"],
    ["received","Отримано"]
  ].map(function(option){
    return '<button class="comp-dialog-option '+(item.status===option[0]?"primary":"")+'" onclick="wfSetTopupStatus(\''+id+'\',\''+option[0]+'\')">'+option[1]+'</button>';
  }).join("");
  wfDialog('<h3>'+escapeHtml(item.name)+'</h3><p>'+escapeHtml(String(item.qty))+' '+escapeHtml(item.unit)+(item.comment?'<br>'+escapeHtml(item.comment):"")+'</p>'+options+'<button class="comp-dialog-close" onclick="wfCloseDialog()">Закрити</button>');
}

function wfSetTopupStatus(encodedId,status){
  const item=wfV2.topups.find(function(entry){return entry.id===wfDecode(encodedId);});
  if(!item)return;
  item.status=status;
  wfSave();
  wfCloseDialog();
  renderProcurement();
}

function wfRemoveTopup(encodedId){
  const id=wfDecode(encodedId);
  const item=wfV2.topups.find(function(entry){return entry.id===id;});
  if(!item||!confirm("Видалити «"+item.name+"» із «Докупити»?"))return;
  wfV2.topups=wfV2.topups.filter(function(entry){return entry.id!==id;});
  wfSave();
  renderProcurement();
}

function wfAddNote(){
  const text=prompt("Нотатка:");
  if(text===null||!String(text).trim())return;
  const context=prompt("Етап або приміщення (необов’язково):","")||"";
  wfV2.notes.push({
    id:"note-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),
    text:String(text).trim(),
    context:context,
    author:localStorage.getItem("plumber_masterName")||"",
    status:"active",
    createdAt:wfNow()
  });
  wfSave();
  renderProcurement();
}

function wfToggleNote(encodedId){
  const item=wfV2.notes.find(function(entry){return entry.id===wfDecode(encodedId);});
  if(!item)return;
  item.status=item.status==="done"?"active":"done";
  wfSave();
  renderProcurement();
}

function wfRemoveNote(encodedId){
  const id=wfDecode(encodedId);
  const item=wfV2.notes.find(function(entry){return entry.id===id;});
  if(!item||!confirm("Видалити нотатку?"))return;
  wfV2.notes=wfV2.notes.filter(function(entry){return entry.id!==id;});
  wfSave();
  renderProcurement();
}

function wfTopupStatusLabel(value){
  return {new:"Нове",working:"В роботі",ordered:"Додано до запиту/замовлення",received:"Отримано"}[value]||"Нове";
}

function renderProcurement(){
  const panel=document.querySelector("#procurementSheet .procurementPanel");
  if(!panel)return;
  panel.className="procurementPanel comp-panel-v2";
  if(!wfV2.fixed){
    panel.innerHTML='<div class="comp-head"><h2>Комплектація</h2><button class="comp-close" onclick="closeProcurement()" aria-label="Закрити">×</button></div><div class="comp-lock"><div><b>Спочатку зафіксуйте кошторис</b><span>Матеріали для запитів і замовлень беруться лише з його зафіксованої версії.</span></div><button onclick="wfFixEstimate()">Зафіксувати</button></div>';
    return;
  }
  const diff=wfDifference();
  const filter=wfFilterOptions();
  const items=wfFilteredMaterials();
  const suppliers=wfAllSuppliers();
  const lock=diff.total
    ? '<div class="comp-lock changed"><div><b>Кошторис змінено після фіксації</b><span>Матеріали в комплектації не оновлено автоматично. Зафіксуйте нову версію лише після перевірки.</span></div><button onclick="wfFixEstimate()">Перевірити</button></div>'
    : '<div class="comp-lock"><div><b>Кошторис V'+wfV2.fixed.version+' зафіксовано</b><span>'+wfDate(wfV2.fixed.createdAt)+' · запити й замовлення працюють з цією версією</span></div></div>';
  const materialRows=items.length
    ? items.map(function(item){
        const state=wfMaterialState(item);
        const id=wfEncode(item.id);
        return '<div class="comp-material-row"><button class="comp-material-name" onclick="wfOpenMaterial(\''+id+'\')"><b>'+escapeHtml(item.name)+'</b><small class="'+wfAvailabilityClass(state)+'">'+escapeHtml(wfStatusLine(item,state))+' ›</small></button><div class="comp-material-qty">'+escapeHtml(String(item.qty))+' '+escapeHtml(item.unit)+'</div><div class="comp-material-price">'+money(Number(item.price)||0)+'</div></div>';
      }).join("")
    : '<div class="comp-empty">За цими фільтрами матеріалів немає.</div>';
  const selectedTopups=wfV2.topups.slice().sort(function(a,b){return (a.status==="received")-(b.status==="received");});
  const topupRows=selectedTopups.length
    ? selectedTopups.map(function(item){
        const id=wfEncode(item.id);
        const done=item.status==="received";
        return '<div class="comp-line"><button class="comp-check '+(done?"done":"")+'" onclick="wfSetTopupStatus(\''+id+'\',\''+(done?"new":"received")+'\')">'+(done?"✓":"")+'</button><button class="comp-line-main" onclick="wfOpenTopup(\''+id+'\')"><b>'+escapeHtml(item.name)+'</b><small>'+escapeHtml(wfTopupStatusLabel(item.status)+(item.comment?" · "+item.comment:""))+'</small></button><span class="comp-line-qty">'+escapeHtml(String(item.qty))+' '+escapeHtml(item.unit)+'</span><button class="comp-line-delete" onclick="wfRemoveTopup(\''+id+'\')" aria-label="Видалити">×</button></div>';
      }).join("")
    : '<div class="comp-empty">Поки що нічого не потрібно докупити.</div>';
  const notes=wfV2.notes.slice().sort(function(a,b){return (a.status==="done")-(b.status==="done");});
  const noteRows=notes.length
    ? notes.map(function(item){
        const id=wfEncode(item.id);
        const done=item.status==="done";
        return '<div class="comp-line"><button class="comp-check '+(done?"done":"")+'" onclick="wfToggleNote(\''+id+'\')">'+(done?"✓":"")+'</button><div class="comp-line-main"><b>'+escapeHtml(item.text)+'</b><small>'+escapeHtml((item.context?item.context+" · ":"")+(item.author?item.author+" · ":"")+wfDate(item.createdAt)+(done?" · виконано":""))+'</small></div><span></span><button class="comp-line-delete" onclick="wfRemoveNote(\''+id+'\')" aria-label="Видалити">×</button></div>';
      }).join("")
    : '<div class="comp-empty">Активних нотаток немає.</div>';
  panel.innerHTML=
    '<div class="comp-head"><h2>Комплектація</h2><button class="comp-close" onclick="closeProcurement()" aria-label="Закрити">×</button></div>'+
    lock+
    '<div class="comp-filters">'+filter.types+filter.brands+filter.suppliers+filter.statuses+'</div>'+
    '<section class="comp-section"><div class="comp-section-head"><b>Матеріали та постачальники</b><span>'+items.length+' позицій</span></div><div class="comp-material-head"><span>Матеріал</span><span>К-сть</span><span>Ціна, ₴</span></div>'+materialRows+
    '<div class="comp-bulk"><select id="wfSupplierAssign"><option value="">Постачальник для вибірки</option>'+suppliers.map(function(name){return '<option value="'+escapeHtml(name)+'">'+escapeHtml(name)+'</option>';}).join("")+'</select><button onclick="wfAssignSupplier()">Застосувати</button></div></section>'+
    '<section class="comp-section"><div class="comp-section-head"><b>Докупити</b><span>'+wfV2.topups.filter(function(item){return item.status!=="received";}).length+' активних</span></div>'+topupRows+'<button class="comp-add" onclick="wfAddTopup()">＋ Додати позицію</button></section>'+
    '<section class="comp-section"><div class="comp-section-head"><b>Нотатки</b><span>'+wfV2.notes.filter(function(item){return item.status!=="done";}).length+' активних</span></div>'+noteRows+'<button class="comp-add" onclick="wfAddNote()">＋ Нотатка</button></section>'+
    '<div class="comp-bottom"><button class="secondary" onclick="wfOpenAvailability()">Запитати наявність</button><button class="primary" onclick="wfCreateOrder()">Сформувати замовлення</button></div>';
}

function openProcurement(){
  if(viewMode!=="master")return;
  if(wfV2.fixed)wfV2.stage="procurement";
  wfSave();
  renderProcurement();
  document.getElementById("procurementSheet").classList.add("open");
  wfRenderChrome();
}

function closeProcurement(){
  const sheet=document.getElementById("procurementSheet");
  if(sheet)sheet.classList.remove("open");
  wfCloseDialog();
}

function wfAfterEstimateMutation(){
  wfRenderChrome();
  const sheet=document.getElementById("procurementSheet");
  if(sheet&&sheet.classList.contains("open"))renderProcurement();
}

var wfRenderEstimateBase=renderEstimate;
renderEstimate=function(){
  wfRenderEstimateBase();
  wfRenderChrome();
};

var wfTableSetNameBase=tableSetName;
tableSetName=function(){const result=wfTableSetNameBase.apply(this,arguments);wfAfterEstimateMutation();return result;};
var wfTableSetQtyBase=tableSetQty;
tableSetQty=function(){const result=wfTableSetQtyBase.apply(this,arguments);wfAfterEstimateMutation();return result;};
var wfTableSetPriceBase=tableSetPrice;
tableSetPrice=function(){const result=wfTableSetPriceBase.apply(this,arguments);wfAfterEstimateMutation();return result;};
var wfTableChangeQtyBase=tableChangeQty;
tableChangeQty=function(){const result=wfTableChangeQtyBase.apply(this,arguments);wfAfterEstimateMutation();return result;};
var wfTableRemoveBase=tableRemove;
tableRemove=function(){const result=wfTableRemoveBase.apply(this,arguments);wfAfterEstimateMutation();return result;};
var wfAddItemBase=addItem;
addItem=function(){const result=wfAddItemBase.apply(this,arguments);wfAfterEstimateMutation();return result;};
var wfCatalogChangeQtyBase=catalogChangeQty;
catalogChangeQty=function(){const result=wfCatalogChangeQtyBase.apply(this,arguments);wfAfterEstimateMutation();return result;};
var wfClearEstimateBase=clearEstimate;
clearEstimate=function(){const result=wfClearEstimateBase.apply(this,arguments);wfAfterEstimateMutation();return result;};

updateEurRateButton();
renderEstimate();

</script>

<script src="supplier-import-module.js"></script>

</body>
