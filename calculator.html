<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SA-MASTER.PRO — Калькулятор</title>

<style>
:root{
  --bg:#f2f2f7;
  --card:rgba(255,255,255,.82);
  --card-solid:#fff;
  --text:#111;
  --muted:#777;
  --line:rgba(0,0,0,.08);
  --input:#f2f2f7;
  --blue:#007aff;
  --blue-soft:rgba(0,122,255,.10);
  --danger:#ff3b30;
  --shadow:0 10px 35px rgba(0,0,0,.08);
}

html[data-theme="dark"]{
  --bg:#111214;
  --card:rgba(30,31,34,.88);
  --card-solid:#1e1f22;
  --text:#f5f5f7;
  --muted:#98989f;
  --line:rgba(255,255,255,.09);
  --input:#2a2b2f;
  --blue:#0a84ff;
  --blue-soft:rgba(10,132,255,.16);
  --danger:#ff453a;
  --shadow:0 12px 35px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:var(--bg);
  transition:background .25s ease;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
  transition:background .25s ease,color .25s ease;
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
  width:min(100%,620px);
  margin:0 auto;
  padding:
    calc(14px + env(safe-area-inset-top))
    14px
    calc(28px + env(safe-area-inset-bottom));
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.brand{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.5px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.icon-btn,
.top-btn{
  border:0;
  color:var(--text);
  background:var(--card);
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  transition:background .25s ease,color .25s ease,transform .15s ease;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:14px;
  font-size:21px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.top-btn{
  height:42px;
  padding:0 14px;
  border-radius:14px;
  font-size:14px;
  font-weight:600;
}

.icon-btn:active,
.top-btn:active,
.add-btn:active,
.action-btn:active,
.modal-btn:active{
  transform:scale(.96);
}

/* TABS */

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  padding:4px;
  background:var(--input);
  border-radius:15px;
  margin-bottom:14px;
}

.tab{
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:12px;
  padding:10px 8px;
  font-size:14px;
  font-weight:700;
  transition:.2s ease;
}

.tab.active{
  color:var(--text);
  background:var(--card-solid);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* WORK LIST */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:18px 4px 8px;
}

.section-title h2{
  margin:0;
  font-size:15px;
  font-weight:800;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

.work-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.work-row{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:56px;
  padding:9px 10px 9px 14px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  transition:background .25s ease,border .25s ease;
}

.work-info{
  min-width:0;
  flex:1;
}

.work-name{
  font-size:14px;
  font-weight:650;
  line-height:1.25;
}

.work-meta{
  margin-top:3px;
  font-size:12px;
  color:var(--muted);
}

.add-btn{
  flex:0 0 auto;
  width:38px;
  height:38px;
  border:0;
  border-radius:12px;
  background:var(--blue);
  color:#fff;
  font-size:23px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.15s ease;
}

/* ESTIMATE */

.estimate{
  margin-top:22px;
}

.estimate-group{
  margin-bottom:18px;
}

.group-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 4px 8px;
}

.group-title strong{
  font-size:15px;
}

.group-total{
  color:var(--blue);
  font-size:14px;
  font-weight:800;
}

.empty{
  padding:18px;
  text-align:center;
  color:var(--muted);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
}

.estimate-item{
  padding:12px;
  margin-bottom:7px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
}

.estimate-top{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.estimate-name{
  flex:1;
  min-width:0;
  font-size:14px;
  font-weight:700;
  line-height:1.3;
}

.remove-btn{
  border:0;
  background:transparent;
  color:var(--danger);
  font-size:20px;
  width:28px;
  height:28px;
  padding:0;
}

.estimate-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.control{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.control label{
  font-size:11px;
  color:var(--muted);
}

.control input{
  width:100%;
  border:1px solid var(--line);
  outline:none;
  background:var(--input);
  color:var(--text);
  border-radius:11px;
  padding:9px 10px;
  font-size:14px;
  transition:.2s ease;
}

.control input:focus{
  border-color:var(--blue);
}

.item-total{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:10px;
  padding-top:9px;
  border-top:1px solid var(--line);
}

.item-total span{
  color:var(--muted);
  font-size:12px;
}

.item-total strong{
  font-size:15px;
}

.reset-price{
  border:0;
  background:var(--blue-soft);
  color:var(--blue);
  border-radius:9px;
  padding:5px 8px;
  font-size:11px;
  font-weight:700;
}

/* TOTAL */

.grand-total{
  margin-top:20px;
  padding:17px;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.total-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:7px;
}

.total-row:last-child{margin:0}

.total-row span{
  color:var(--muted);
  font-size:13px;
}

.total-row strong{
  font-size:15px;
}

.total-final{
  margin-top:11px;
  padding-top:12px;
  border-top:1px solid var(--line);
}

.total-final span{
  color:var(--text);
  font-weight:800;
}

.total-final strong{
  color:var(--blue);
  font-size:22px;
}

/* ACTIONS */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.action-btn{
  height:45px;
  border:0;
  border-radius:14px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--line);
  font-size:14px;
  font-weight:700;
  transition:.15s ease;
}

.action-btn.primary{
  background:var(--blue);
  color:#fff;
  border-color:transparent;
}

/* MODALS */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.38);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.modal.show{display:flex}

.modal-card{
  width:min(100%,620px);
  max-height:90vh;
  overflow:auto;
  background:var(--card-solid);
  color:var(--text);
  border-radius:24px;
  padding:18px;
  box-shadow:0 20px 70px rgba(0,0,0,.3);
  animation:modalIn .2s ease;
}

@keyframes modalIn{
  from{transform:translateY(20px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
}

.modal-header h3{
  margin:0;
  font-size:19px;
}

.close-btn{
  width:36px;
  height:36px;
  border:0;
  border-radius:11px;
  background:var(--input);
  color:var(--text);
  font-size:20px;
}

.form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:12px;
  color:var(--muted);
  font-weight:600;
}

.field input,
.field select{
  width:100%;
  border:1px solid var(--line);
  outline:none;
  background:var(--input);
  color:var(--text);
  border-radius:13px;
  padding:11px 12px;
}

.field input:focus,
.field select:focus{
  border-color:var(--blue);
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:16px;
}

.modal-btn{
  min-height:44px;
  border:0;
  border-radius:13px;
  font-weight:700;
  background:var(--input);
  color:var(--text);
}

.modal-btn.primary{
  background:var(--blue);
  color:#fff;
}

.modal-btn.danger{
  background:rgba(255,59,48,.10);
  color:var(--danger);
}

/* PRICE DATABASE */

.price-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.price-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  background:var(--input);
  border-radius:14px;
}

.price-info{
  flex:1;
  min-width:0;
}

.price-name{
  font-size:13px;
  font-weight:700;
}

.price-meta{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.edit-price-btn{
  border:0;
  background:var(--blue-soft);
  color:var(--blue);
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  font-weight:700;
}

html[data-theme="dark"] .modal{
  background:rgba(0,0,0,.62);
}

html[data-theme="dark"] .tab.active{
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}

html[data-theme="dark"] .work-row,
html[data-theme="dark"] .estimate-item,
html[data-theme="dark"] .grand-total,
html[data-theme="dark"] .modal-card{
  border-color:rgba(255,255,255,.08);
}

@media(max-width:430px){
  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .brand{font-size:18px}

  .top-btn{padding:0 11px}

  .work-name{font-size:13px}
}
</style>

<script>
/* =========================================================
   THEME
   Режими:
   system / light / dark

   За замовчуванням — system.
========================================================= */

(function(){

  const mode =
    localStorage.getItem("samaster_theme_mode") || "system";

  function applyTheme(){

    if(mode === "dark"){
      document.documentElement.dataset.theme = "dark";
      return;
    }

    if(mode === "light"){
      document.documentElement.dataset.theme = "light";
      return;
    }

    const dark =
      window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches;

    document.documentElement.dataset.theme =
      dark ? "dark" : "light";
  }

  applyTheme();

})();
</script>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="brand">
      SA-MASTER.PRO
    </div>

    <div class="header-actions">

      <button
        class="top-btn"
        onclick="openPriceBase()"
      >Ціни</button>

      <button
        class="icon-btn"
        id="themeBtn"
        onclick="cycleTheme()"

      <button
        class="icon-btn"

    <div class="actions">

      <button

</div>


<!-- NEW / EDIT WORK -->

<div
  class="modal"
  id="workModal"
>

  <div class="modal-card">

    <div class="modal-header">

      <h3 id="modalTitle">
        Нова позиція
      </h3>

        class="close-btn"

    </div>

          id="workName"

        >

      </div>


      <div class="field">

        <label>Базова ціна, грн</label>

        <input

          min="0"
        >

      </div>

        <label>Одиниця</label>

        <select id="workUnit">

          <option value="шт.">шт.</option>
          <option value="компл.">компл.</option>
          <option value="м.п.">м.п.</option>

        </select>

      </div>


      <div class="field">

        <label>Категорія</label>

        <select id="workCategory">

          <option value="rough">
            Чорновий

      </div>

      <button

</div>


<!-- PRICE DATABASE -->

<div
  class="modal"
  id="priceModal"
>

  <div class="modal-card">

    <div class="modal-header">

      <h3>База цін</h3>

      <button
        class="close-btn"
        onclick="closePriceBase()"
      >×</button>

    </div>

    <div
      id="priceBaseList"
      class="price-list"
    ></div>

  </div>

</div>


<script>

/* =========================================================
   DATABASE
========================================================= */

const defaultDB = [

  {id:"rough-radiator",name:"Монтаж радіатора",cat:"rough",unit:"шт.",price:2500},
  {id:"rough-valve-node",name:"Монтаж запірно-регулюючого вузла",cat:"rough",unit:"компл.",price:7000},
  {id:"rough-comb",name:"Монтаж гребінки",cat:"rough",unit:"шт.",price:5000},
  {id:"rough-tech-zone",name:"Оздоблення технічної зони",cat:"rough",unit:"компл.",price:5000},
  {id:"rough-sewer-riser",name:"Врізка в каналізаційний стояк",cat:"rough",unit:"компл.",price:4000},
  {id:"rough-built-mixer",name:"Монтаж вбудованого змішувача",cat:"rough",unit:"шт.",price:3000},
  {id:"rough-installation",name:"Монтаж інсталяції",cat:"rough",unit:"шт.",price:4000},
  {id:"rough-shower-trap",name:"Монтаж душового трапа",cat:"rough",unit:"шт.",price:4000},
  {id:"rough-built-siphon",name:"Монтаж вбудованого сифона",cat:"rough",unit:"шт.",price:2000},
  {id:"rough-outdoor-tap",name:"Монтаж вуличного крана",cat:"rough",unit:"шт.",price:3000},
  {id:"rough-vk-outlet",name:"Монтаж виводу ВК",cat:"rough",unit:"шт.",price:1500},
  {id:"rough-pipe-insulation",name:"Укладання труб в ізоляції",cat:"rough",unit:"компл.",price:10000},
  {id:"rough-chasing",name:"Виготовлення штроб",cat:"rough",unit:"компл.",price:10000},
  {id:"rough-chase-repair",name:"Зароблення штроб",cat:"rough",unit:"компл.",price:8000},
  {id:"rough-sewer-replace",name:"Заміна каналізаційного стояка",cat:"rough",unit:"шт.",price:5000},
  {id:"rough-sewer-noise",name:"Знешумлення каналізаційного стояка",cat:"rough",unit:"шт.",price:4000},
  {id:"rough-convector",name:"Монтаж конвектора",cat:"rough",unit:"шт.",price:5000},
  {id:"rough-designer-radiator",name:"Монтаж дизайнерського радіатора",cat:"rough",unit:"шт.",price:5000},
  {id:"rough-shower-system",name:"Монтаж душової системи",cat:"rough",unit:"шт.",price:4000},
  {id:"rough-towel-warmer",name:"Монтаж рушникосушки",cat:"rough",unit:"шт.",price:3000},

  {id:"finish-boiler",name:"Монтаж та обв’язка бойлера",cat:"finish",unit:"компл.",price:7000},
  {id:"finish-water-treatment",name:"Монтаж та обв’язка водоочистки",cat:"finish",unit:"компл.",price:10000},
  {id:"finish-bath",name:"Підключення ванни",cat:"finish",unit:"шт.",price:3500},
  {id:"finish-shower-system",name:"Монтаж душової системи",cat:"finish",unit:"шт.",price:3500},
  {id:"finish-sink",name:"Підключення умивальника",cat:"finish",unit:"шт.",price:3500},
  {id:"finish-hygienic-shower",name:"Монтаж гігієнічного душа",cat:"finish",unit:"шт.",price:2000},
  {id:"finish-toilet",name:"Монтаж унітазу",cat:"finish",unit:"шт.",price:4000},
  {id:"finish-towel-warmer",name:"Монтаж рушникосушки",cat:"finish",unit:"шт.",price:3000},
  {id:"finish-accessories",name:"Монтаж аксесуарів",cat:"finish",unit:"шт.",price:700},
  {id:"finish-washer-dryer",name:"Монтаж пралки/сушки",cat:"finish",unit:"компл.",price:6000}

];


let db=[];
let estimate=[];
let currentCategory="rough";
let editingId=null;


/* =========================================================
   HELPERS
========================================================= */

function money(value){
  return Number(value||0)
    .toLocaleString("uk-UA")+" грн";
}

function saveDB(){
  localStorage.setItem(
    "samaster_db",
    JSON.stringify(db)
  );
}

function saveEstimate(){
  localStorage.setItem(
    "samaster_estimate",
    JSON.stringify(estimate)
  );
}

function loadDB(){

  const saved=
    localStorage.getItem("samaster_db");

  if(saved){

    try{
      db=JSON.parse(saved);
    }catch{
      db=JSON.parse(JSON.stringify(defaultDB));
    }

  }else{
    db=JSON.parse(JSON.stringify(defaultDB));
  }

  db=db.map(item=>({
    id:item.id||crypto.randomUUID(),
    name:item.name||"",
    cat:item.cat||item.category||"rough",
    unit:item.unit||"шт.",
    price:Number(
      item.price??
      item.basePrice??
      0
    )
  }));

  saveDB();
}

function loadEstimate(){

  const saved=
    localStorage.getItem("samaster_estimate");

  if(!saved){
    estimate=[];
    return;
  }

  try{
    estimate=JSON.parse(saved);
  }catch{
    estimate=[];
  }

  estimate=estimate.map(item=>({
    id:item.id||crypto.randomUUID(),
    workId:item.workId||"",
    name:item.name||"",
    cat:item.cat||item.category||"rough",
    unit:item.unit||"шт.",
    qty:Number(item.qty||1),
    basePrice:Number(
      item.basePrice??
      item.price??
      0
    ),
    price:Number(
      item.price??
      item.basePrice??
      0
    )
  }));

  saveEstimate();
}


/* =========================================================
   THEME
========================================================= */

const themeModes=[
  "system",
  "light",
  "dark"
];

function getThemeMode(){

  return localStorage.getItem(
    "samaster_theme_mode"
  )||"system";
}

function applyTheme(){

  const mode=getThemeMode();

  let theme=mode;

  if(mode==="system"){

    const dark=
      window.matchMedia &&
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

    theme=dark?"dark":"light";
  }

  document.documentElement.dataset.theme=theme;

  updateThemeButton();
}

function updateThemeButton(){

  const btn=
    document.getElementById("themeBtn");

  if(!btn)return;

  const mode=getThemeMode();

  if(mode==="system"){
    btn.textContent="◐";
    btn.title="Системна тема";
  }

  if(mode==="light"){
    btn.textContent="☀️";
    btn.title="Світла тема";
  }

  if(mode==="dark"){
    btn.textContent="🌙";
    btn.title="Темна тема";
  }
}

function cycleTheme(){

  const current=getThemeMode();

  const index=
    themeModes.indexOf(current);

  const next=
    themeModes[
      (index+1)%themeModes.length
    ];

  localStorage.setItem(
    "samaster_theme_mode",
    next
  );

  applyTheme();
}


/* реагуємо на зміну теми iPhone,
   якщо вибраний режим "Системна" */

const systemTheme=
  window.matchMedia
    ? window.matchMedia(
        "(prefers-color-scheme: dark)"
      )
    : null;

if(systemTheme){

  const systemThemeChanged=()=>{

    if(getThemeMode()==="system"){
      applyTheme();
    }

  };

  if(systemTheme.addEventListener){
    systemTheme.addEventListener(
      "change",
      systemThemeChanged
    );
  }else if(systemTheme.addListener){
    systemTheme.addListener(
      systemThemeChanged
    );
  }
}


/* =========================================================
   CATEGORY
========================================================= */

function setCategory(cat){

  currentCategory=cat;

  document
    .getElementById("tab-rough")
    .classList.toggle(
      "active",
      cat==="rough"
    );

  document
    .getElementById("tab-finish")
    .classList.toggle(
      "active",

    );

/* =========================================================
   ADD WORK LIST
========================================================= */

function renderAddWorkList(){

  const container=
    document.getElementById(
      "addWorkList"
    );

  const items=
    db.filter(item=>
      item.cat===currentCategory
    );

  container.innerHTML="";

  if(!items.length){

    container.innerHTML=`
      <div class="empty">
        У цій категорії ще немає позицій.
      </div>
    `;

    return;
  }

  items.forEach(item=>{
    container.appendChild(
      renderAddWorkItem(item)
    );
  });
}

function renderAddWorkItem(item){

  const row=
    document.createElement("div");

  row.className="work-row";

  row.innerHTML=`
    <div class="work-info">

      <div class="work-name">
        ${escapeHTML(item.name)}
      </div>

      <div class="work-meta">
        ${money(item.price)}
        /
        ${escapeHTML(item.unit)}
      </div>

    </div>

    <button
      class="add-btn"
      onclick="addWork('${item.id}')"
      aria-label="Додати"
    >＋</button>
  `;

}


/* =========================================================
   ADD TO ESTIMATE
========================================================= */

function addWork(workId){

  const base=
    db.find(item=>
      item.id===workId
    );

  if(!base)return;

  const existing=
    estimate.find(item=>
      item.workId===workId
    );

  if(existing){

    existing.qty=
      Number(existing.qty||0)+1;

  }else{

    estimate.push({

      id:crypto.randomUUID(),

      workId:base.id,

      name:base.name,

      cat:base.cat,

      unit:base.unit,

      qty:1,

      basePrice:Number(base.price),

      price:Number(base.price)

    });
  }

  saveEstimate();
  renderEstimate();
}


/* =========================================================
   ESTIMATE
========================================================= */

function renderEstimate(){

  const roughTotal=
    renderGroup(
      "rough",
      document.getElementById(
        "roughItems"
      ),
      document.getElementById(
        "roughTotal"
      )
    );

  const finishTotal=
    renderGroup(
      "finish",
      document.getElementById(
        "finishItems"
      ),
      document.getElementById(
        "finishTotal"
      )
    );

  const grand=
    roughTotal+finishTotal;

  document.getElementById(
    "summaryRough"
  ).textContent=money(roughTotal);

  document.getElementById(
    "summaryFinish"
  ).textContent=money(finishTotal);

  document.getElementById(
    "summaryCount"
  ).textContent=estimate.length;

  document.getElementById(
    "grandTotal"
  ).textContent=money(grand);
}

function renderGroup(
  cat,
  container,
  totalElement
){

  const items=
    estimate.filter(item=>
      item.cat===cat
    );

  container.innerHTML="";

  if(!items.length){

    container.innerHTML=`
      <div class="empty">
        Позиції ще не додані.
      </div>
    `;

    totalElement.textContent="0 грн";

    return 0;
  }

  let total=0;

  items.forEach(item=>{

    const itemTotal=
      Number(item.qty||0)*
      Number(item.price||0);

    total+=itemTotal;

    const row=
      document.createElement("div");

    row.className="estimate-item";

    row.innerHTML=`

      <div class="estimate-top">

        <div class="estimate-name">
          ${escapeHTML(item.name)}
        </div>

        <button
          class="remove-btn"
          onclick="removeItem('${item.id}')"
          aria-label="Видалити"
        >×</button>

      </div>

      <div class="estimate-controls">

        <div class="control">

          <label>
            Кількість (${escapeHTML(item.unit)})
          </label>

          <input
            type="number"
            min="0"
            step="1"
            value="${item.qty}"
            onchange="changeQty('${item.id}',this.value)"
          >

        </div>

        <div class="control">

          <label>
            Ціна за ${escapeHTML(item.unit)}
          </label>

          <input
            type="number"
            min="0"
            step="100"
            value="${item.price}"
            onchange="changePrice('${item.id}',this.value)"
          >

        </div>

      </div>

      <div class="item-total">

        <span>
          ${item.qty} × ${money(item.price)}
        </span>

        <div>

          <button
            class="reset-price"
            onclick="resetPrice('${item.id}')"
          >
            Базова: ${money(item.basePrice)}
          </button>

          <strong style="margin-left:8px">
            ${money(itemTotal)}
          </strong>

        </div>

      </div>
    `;

    container.appendChild(row);
  });

  totalElement.textContent=money(total);

  return total;
}


/* =========================================================
   ESTIMATE CONTROLS
========================================================= */

function changeQty(id,value){

  const item=
    estimate.find(x=>x.id===id);

  if(!item)return;

  let qty=Number(value);

  if(!Number.isFinite(qty)||qty<0){
    qty=0;
  }

  item.qty=qty;

  saveEstimate();
  renderEstimate();
}

function changePrice(id,value){

  const item=
    estimate.find(x=>x.id===id);

  if(!item)return;

  let price=Number(value);

  if(!Number.isFinite(price)||price<0){
    price=0;
  }

  item.price=price;

  saveEstimate();
  renderEstimate();
}

function resetPrice(id){

  const item=
    estimate.find(x=>x.id===id);

  if(!item)return;

  item.price=
    Number(item.basePrice||0);

  saveEstimate();
  renderEstimate();
}

function removeItem(id){

  estimate=
    estimate.filter(item=>
      item.id!==id
    );

  saveEstimate();
  renderEstimate();
}

function clearEstimate(){

  if(!estimate.length)return;

  if(!confirm(
    "Очистити поточний кошторис?"
  )){
    return;
  }

  estimate=[];

  saveEstimate();
  renderEstimate();
}


/* =========================================================
   NEW / EDIT BASE WORK
========================================================= */

function openNewWork(){

  editingId=null;

  document.getElementById(
    "modalTitle"
  ).textContent="Нова позиція";

  document.getElementById(
    "workName"
  ).value="";

  document.getElementById(
    "workPrice"
  ).value="";

  document.getElementById(
    "workUnit"
  ).value="шт.";

  document.getElementById(
    "workCategory"
  ).value=currentCategory;

  document.getElementById(
    "deleteWorkBtn"
  ).style.display="none";

  document
    .getElementById("workModal")
    .classList.add("show");
}

function editBasePrice(id){

  const item=
    db.find(x=>x.id===id);

  if(!item)return;

  editingId=id;

  document.getElementById(
    "modalTitle"
  ).textContent="Редагувати позицію";

  document.getElementById(
    "workName"
  ).value=item.name;

  document.getElementById(
    "workPrice"
  ).value=item.price;

  document.getElementById(
    "workUnit"
  ).value=item.unit;

  document.getElementById(
    "workCategory"
  ).value=item.cat;

  document.getElementById(
    "deleteWorkBtn"
  ).style.display="block";

  document
    .getElementById("workModal")
    .classList.add("show");
}

function saveModal(){

  const name=
    document.getElementById(
      "workName"
    ).value.trim();

  const price=
    Number(
      document.getElementById(
        "workPrice"
      ).value
    );

  const unit=
    document.getElementById(
      "workUnit"
    ).value;

  const cat=
    document.getElementById(
      "workCategory"
    ).value;

  if(!name){
    alert("Вкажіть назву роботи.");
    return;
  }

  if(!Number.isFinite(price)||price<0){
    alert("Вкажіть коректну ціну.");
    return;
  }

  if(editingId){

    const item=
      db.find(x=>x.id===editingId);

    if(item){
      item.name=name;
      item.price=price;
      item.unit=unit;
      item.cat=cat;
    }

  }else{

    db.push({

      id:crypto.randomUUID(),

      name,

      cat,

      unit,

      price

    });
  }

  saveDB();

  closeModal();

  renderAddWorkList();
  renderPriceBase();
}

function deleteEditingWork(){

  if(!editingId)return;

  const item=
    db.find(x=>x.id===editingId);

  if(!item)return;

  if(!confirm(
    `Видалити позицію "${item.name}" з бази?`
  )){
    return;
  }

  db=
    db.filter(x=>
      x.id!==editingId
    );

  saveDB();

  closeModal();

  renderAddWorkList();
  renderPriceBase();
}

function closeModal(){

  document
    .getElementById("workModal")
    .classList.remove("show");

  editingId=null;
}

   PRICE DATABASE

function closePriceBase(){

    .classList.remove("show");

      "priceBaseList"
    );

function renderPriceItem(item){

  row.className="price-row";

  row.innerHTML=`

    <div class="price-info">

      <div class="price-name">
        ${escapeHTML(item.name)}
      </div>

      <div class="price-meta">

        ${item.cat==="rough"
          ?"Чорновий"
          :"Чистовий"
        }

        ·

        ${money(item.price)}

        /

        ${escapeHTML(item.unit)}

/* =========================================================
   EXPORT
========================================================= */

function exportData(){

  const data={

    exportedAt:
      new Date().toISOString(),

    database:db,

    estimate:estimate

  };

  const blob=
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  const date=
    new Date()
      .toISOString()
      .slice(0,10);

  a.href=url;

  a.download=
    `sa-master-calculator-backup-${date}.json`;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   MODALS
========================================================= */

document
  .getElementById("workModal")
  .addEventListener(
    "click",
    function(e){

      if(e.target===this){
        closeModal();
      }

    }
  );

document
  .getElementById("priceModal")
  .addEventListener(
    "click",
    function(e){

      if(e.target===this){
        closePriceBase();
      }

    }
  );

document.addEventListener(
  "keydown",
  function(e){

    if(e.key!=="Escape")return;

    closeModal();
    closePriceBase();

  }
);


/* =========================================================
   START
========================================================= */

loadDB();
loadEstimate();

applyTheme();

renderAddWorkList();
renderEstimate();

</script>
