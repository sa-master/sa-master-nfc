<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">

<title>sa-master.pro — Кошторис. Звітність. Аудит.</title>
<meta name="theme-color" content="#E3F0FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">

<style>
:root{
  --p:#007AFF;
  --t:#1C1C1E;
  --ts:#3A3A3C;
  --tm:#8E8E93;
  --bg:#E3F0FA;
  --bgs:#F2F6FB;
  --bge:#EAF1FA;
  --gb:rgba(255,255,255,.55);
  --gbr:rgba(255,255,255,.7);
  --gs:0 .5rem 2rem rgba(0,0,0,.08);
  --card:#FFFFFF;
  --red:#FF3B30;
  --green:#34C759;
  --dot-gray:#C7C7CC;
  --dot-dark:#1C1C1E;
  --rc:.875rem;
  --rm:1.25rem;
  --rs:1.75rem;
  --rg:1.25rem;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --p:#0A84FF;
    --t:#F2F2F7;
    --ts:#C7C7CC;
    --tm:#8E8E93;
    --bg:#1C1C1E;
    --bgs:#2C2C2E;
    --bge:#1C1C1E;
    --gb:rgba(44,44,46,.6);
    --gbr:rgba(255,255,255,.12);
    --gs:0 .5rem 2rem rgba(0,0,0,.4);
    --card:#2C2C2E;
    --dot-dark:#F2F2F7;
  }
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  color:var(--t);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
  touch-action:manipulation;
}

button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}

/* ==== BACKGROUND ==== */

.bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  background:linear-gradient(180deg,var(--bgs) 0%,var(--bg) 25%,var(--bge) 75%,var(--bg) 100%);
}

.bg::before{
  content:"";
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(ellipse 60% 50% at 25% 20%,rgba(0,122,255,.15) 0%,transparent 60%),
    radial-gradient(ellipse 55% 45% at 75% 75%,rgba(88,86,214,.12) 0%,transparent 55%);
  animation:aur 20s ease-in-out infinite alternate;
}

@keyframes aur{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(3%,-2%) scale(1.05)}
  100%{transform:translate(-2%,1.5%) scale(1.02)}
}

/* ==== APP ==== */

.app{
  position:relative;
  z-index:1;
  width:min(30rem,calc(100% - 1rem));
  height:100dvh;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  padding:calc(.75rem + var(--sat)) 0 calc(.75rem + var(--sab));
  overflow:hidden;
}

/* ==== HERO (лого) ==== */

.hero{
  flex:0 0 auto;
  position:relative;
  padding:.875rem 1rem;
  border-radius:1.5rem;
  background:var(--gb);
  backdrop-filter:blur(1.75rem) saturate(220%);
  -webkit-backdrop-filter:blur(1.75rem) saturate(220%);
  border:1px solid var(--gbr);
  box-shadow:var(--gs);
  margin-bottom:.75rem;
}

.heroRow{
  display:flex;
  align-items:center;
  gap:.75rem;
  min-width:0;
}

.heroLogo{
  flex:0 0 auto;
  width:3rem;
  height:3rem;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:rgba(0,122,255,.1);
}

.heroLogo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.heroLogoFallback{
  font-family:'Russo One',sans-serif;
  font-size:1.375rem;
  color:var(--p);
  letter-spacing:-1px;
}

.heroDivider{
  width:1px;
  height:2.25rem;
  background:rgba(60,60,67,.15);
  flex-shrink:0;
}

@media (prefers-color-scheme: dark){
  .heroDivider{background:rgba(255,255,255,.15)}
}

.heroText{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
}

.heroTitle{
  font-family:'Russo One',sans-serif;
  font-size:1.25rem;
  font-weight:400;
  letter-spacing:.3px;
  color:var(--t);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1;
}

.heroTitle .pro{
  color:var(--tm);
  font-size:.875rem;
  font-weight:400;
  margin-left:2px;
}

.heroSub{
  font-size:.75rem;
  color:var(--ts);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:.1px;
}

/* ==== MAIN ==== */

.main{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ==== EMPTY STATE ==== */

.emptyState{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:1.5rem 1.25rem;
  text-align:center;
  overflow-y:auto;
  gap:1rem;
}

.emptyIntro{
  background:var(--gb);
  backdrop-filter:blur(1.5rem) saturate(200%);
  -webkit-backdrop-filter:blur(1.5rem) saturate(200%);
  border:1px solid var(--gbr);
  border-radius:1.5rem;
  box-shadow:var(--gs);
  padding:1.375rem 1.25rem;
  max-width:22rem;
  width:100%;
  text-align:left;
}

.emptyIntro h2{
  font-size:1rem;
  font-weight:700;
  color:var(--t);
  margin-bottom:.75rem;
  text-align:center;
}

.emptyIntro ol{
  padding-left:1.25rem;
  color:var(--ts);
  font-size:.875rem;
  line-height:1.7;
}

.emptyIntro li{
  margin-bottom:.375rem;
}

.emptyIntro li:last-child{
  margin-bottom:0;
}

.primaryButton{
  height:3.125rem;
  min-width:15rem;
  padding:0 1.375rem;
  border-radius:1.125rem;
  background:linear-gradient(135deg,#007AFF,#0A84FF);
  color:#fff;
  font-size:.9375rem;
  font-weight:700;
  box-shadow:0 .5rem 1.5rem rgba(0,122,255,.28);
  transition:transform .15s;
  letter-spacing:.1px;
}

.primaryButton:active{
  transform:scale(.97);
}

/* ==== LIST ==== */

.listWrap{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.listHeader{
  flex:0 0 auto;
  padding:.25rem .375rem .625rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.listHeader strong{
  font-size:.9375rem;
  font-weight:700;
  color:var(--t);
}

.addSmallButton{
  height:2rem;
  padding:0 .75rem;
  border-radius:.75rem;
  background:linear-gradient(135deg,#007AFF,#0A84FF);
  color:#fff;
  font-size:.75rem;
  font-weight:700;
  box-shadow:0 .25rem .625rem rgba(0,122,255,.24);
}

.list{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:0 .125rem .75rem;
}

.list::-webkit-scrollbar{display:none}

/* ==== PROJECT CARD ==== */

.projectCard{
  position:relative;
  background:var(--gb);
  backdrop-filter:blur(1.5rem) saturate(200%);
  -webkit-backdrop-filter:blur(1.5rem) saturate(200%);
  border:1px solid var(--gbr);
  border-radius:1.25rem;
  box-shadow:var(--gs);
  padding:.9375rem 1rem;
  margin-bottom:.625rem;
  display:flex;
  gap:.75rem;
  align-items:flex-start;
  transition:transform .12s;
}

.projectCard:active{
  transform:scale(.99);
}

.projectDot{
  flex:0 0 auto;
  width:.625rem;
  height:.625rem;
  border-radius:50%;
  background:var(--dot-gray);
  margin-top:.375rem;
  box-shadow:0 0 0 3px rgba(199,199,204,.25);
}

.projectDot.status-estimate{
  background:var(--dot-gray);
  box-shadow:0 0 0 3px rgba(199,199,204,.25);
}

.projectDot.status-work{
  background:var(--green);
  box-shadow:0 0 0 3px rgba(52,199,89,.25);
}

.projectDot.status-done{
  background:var(--dot-dark);
  box-shadow:0 0 0 3px rgba(28,28,30,.18);
}

.projectBody{
  flex:1 1 auto;
  min-width:0;
}

.projectTitle{
  font-size:.9375rem;
  font-weight:750;
  line-height:1.25;
  overflow-wrap:anywhere;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:.5rem;
  color:var(--t);
}

.projectUrgent{
  flex:0 0 auto;
  font-size:.875rem;
  line-height:1;
}

.projectClient{
  margin-top:.25rem;
  color:var(--ts);
  font-size:.8125rem;
  line-height:1.35;
  overflow-wrap:anywhere;
}

.projectAddress{
  margin-top:.125rem;
  color:var(--tm);
  font-size:.75rem;
  line-height:1.35;
  overflow-wrap:anywhere;
}

.projectDivider{
  height:1px;
  background:rgba(120,130,140,.15);
  margin:.625rem 0 .5rem;
}

.projectMeta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.5rem;
  font-size:.75rem;
  color:var(--ts);
}

.projectStage{
  font-weight:650;
}

.projectAmount{
  font-weight:750;
  color:var(--t);
  white-space:nowrap;
}

.projectDetails{
  margin-top:.375rem;
  color:var(--tm);
  font-size:.6875rem;
  line-height:1.35;
  overflow-wrap:anywhere;
}

/* ==== SHEET ==== */

.sheet{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(1rem);
  -webkit-backdrop-filter:blur(1rem);
}

.sheet.open{
  display:flex;
}

.panel{
  width:100%;
  max-width:30rem;
  max-height:90dvh;
  margin:0 auto;
  background:var(--bg);
  border-radius:1.75rem 1.75rem 0 0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-bottom:var(--sab);
  animation:slideUp .28s cubic-bezier(.22,.61,.36,1);
  border-top:1px solid var(--gbr);
}

@keyframes slideUp{
  from{transform:translateY(2rem);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.panelHead{
  flex:0 0 auto;
  padding:1rem 1.125rem .5rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panelHead strong{
  font-size:1.125rem;
  font-weight:750;
  color:var(--t);
}

.close{
  width:2.25rem;
  height:2.25rem;
  border-radius:50%;
  font-size:1.5rem;
  color:var(--tm);
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  background:rgba(120,130,140,.12);
}

.panelBody{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:0 1rem 1rem;
  scrollbar-width:none;
}

.panelBody::-webkit-scrollbar{display:none}

.panelFooter{
  flex:0 0 auto;
  padding:.625rem 1rem calc(.75rem + var(--sab));
  display:flex;
  gap:.5rem;
  border-top:1px solid var(--gbr);
  background:var(--bg);
}

.panelFooter button{
  flex:1;
  height:3rem;
  border-radius:1rem;
  font-size:.9375rem;
  font-weight:700;
  transition:transform .12s;
}

.panelFooter button:active{
  transform:scale(.98);
}

.btnGhost{
  background:rgba(120,130,140,.12);
  color:var(--ts);
}

.btnPrimary{
  background:linear-gradient(135deg,#007AFF,#0A84FF);
  color:#fff;
  box-shadow:0 .375rem 1rem rgba(0,122,255,.22);
}

/* ==== FORM ==== */

.formGroup{
  margin-bottom:.875rem;
}

.formLabel{
  display:block;
  color:var(--tm);
  font-size:.75rem;
  margin:0 .25rem .375rem;
  font-weight:600;
  letter-spacing:.2px;
}

.formInput,
.formTextarea{
  width:100%;
  border:1px solid var(--gbr);
  outline:0;
  border-radius:.875rem;
  background:var(--gb);
  backdrop-filter:blur(1rem);
  -webkit-backdrop-filter:blur(1rem);
  padding:0 .875rem;
  font-size:.9375rem;
  color:var(--t);
  transition:box-shadow .15s;
}

.formInput{
  height:3rem;
}

.formTextarea{
  padding:.75rem .875rem;
  min-height:3.75rem;
  resize:vertical;
  line-height:1.4;
  font-family:inherit;
}

.formInput:focus,
.formTextarea:focus{
  box-shadow:inset 0 0 0 1.5px var(--p);
}

.formHint{
  margin:.25rem .25rem 0;
  color:var(--tm);
  font-size:.6875rem;
  line-height:1.4;
}

/* ==== EMPTY PROJECT ==== */

.projectView{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  padding:.5rem 0;
  overflow-y:auto;
  scrollbar-width:none;
  gap:.75rem;
}

.projectView::-webkit-scrollbar{display:none}

.projectHeaderCard{
  background:var(--gb);
  backdrop-filter:blur(1.5rem) saturate(200%);
  -webkit-backdrop-filter:blur(1.5rem) saturate(200%);
  border:1px solid var(--gbr);
  border-radius:1.25rem;
  box-shadow:var(--gs);
  padding:1rem 1.125rem;
}

.projectHeaderTitle{
  font-size:1.0625rem;
  font-weight:800;
  line-height:1.25;
  overflow-wrap:anywhere;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:.625rem;
  color:var(--t);
}

.projectHeaderMeta{
  margin-top:.5rem;
  color:var(--ts);
  font-size:.8125rem;
  line-height:1.55;
  overflow-wrap:anywhere;
}

.projectHeaderMeta b{
  color:var(--t);
  font-weight:700;
}

.placeholderBlock{
  background:var(--gb);
  backdrop-filter:blur(1.5rem) saturate(200%);
  -webkit-backdrop-filter:blur(1.5rem) saturate(200%);
  border:1px solid var(--gbr);
  border-radius:1.25rem;
  box-shadow:var(--gs);
  padding:1.75rem 1.375rem;
  text-align:center;
  color:var(--tm);
  font-size:.8125rem;
  line-height:1.55;
}

.placeholderBlock strong{
  display:block;
  color:var(--t);
  font-size:.9375rem;
  margin-bottom:.375rem;
  font-weight:700;
}

/* ==== BACK BUTTON ==== */

.backButton{
  width:2.5rem;
  height:2.5rem;
  border-radius:.875rem;
  background:var(--gb);
  backdrop-filter:blur(1rem);
  -webkit-backdrop-filter:blur(1rem);
  border:1px solid var(--gbr);
  color:var(--p);
  font-size:1.375rem;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--gs);
  flex:0 0 auto;
}

/* ==== TOAST ==== */

.toast{
  position:fixed;
  left:50%;
  bottom:calc(1.5rem + var(--sab));
  transform:translateX(-50%) translateY(1.25rem);
  background:var(--t);
  color:var(--bg);
  padding:.625rem 1.125rem;
  border-radius:.75rem;
  font-size:.8125rem;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s, transform .2s;
  z-index:200;
  max-width:90%;
  text-align:center;
  box-shadow:0 .5rem 1.5rem rgba(0,0,0,.2);
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ==== HIDDEN ==== */

.hidden{display:none !important}

/* ==== MEDIA ==== */

@media (max-width:26rem){
  .heroTitle{font-size:1.125rem}
  .heroSub{font-size:.6875rem}
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="app" id="app">

  <section class="hero" id="hero"></section>

  <main class="main" id="main"></main>

</div>

<!-- SHEET: NEW PROJECT -->

<div class="sheet" id="newProjectSheet">
  <div class="panel">

    <div class="panelHead">
      <strong>Новий об'єкт</strong>
      <button class="close" onclick="closeNewProject()">×</button>
    </div>

    <div class="panelBody">

      <div class="formGroup">
        <label class="formLabel">Коротка назва (необов'язково)</label>
        <input
          class="formInput"
          id="npTitle"
          placeholder="Напр. Печерськ"
          autocomplete="off"
        >
        <div class="formHint">Якщо не вказати — використаємо адресу або ім'я замовника</div>
      </div>

      <div class="formGroup">
        <label class="formLabel">Ім'я замовника *</label>
        <input
          class="formInput"
          id="npClientName"
          placeholder="Іван Петренко"
          autocomplete="off"
        >
      </div>

      <div class="formGroup">
        <label class="formLabel">Телефон замовника *</label>
        <input
          class="formInput"
          id="npClientPhone"
          placeholder="+380 67 123 45 67"
          inputmode="tel"
          autocomplete="off"
        >
      </div>

      <div class="formGroup">
        <label class="formLabel">Адреса / позначення об'єкта</label>
        <textarea
          class="formTextarea"
          id="npAddress"
          placeholder="ЖК Comfort Town, літ. Б, кв. 45 або Котельня, Вінниця"
          autocomplete="off"
        ></textarea>
        <div class="formHint">Деталі об'єкта (тип, площа, санвузли) заповнимо пізніше</div>
      </div>

    </div>

    <div class="panelFooter">
      <button class="btnGhost" onclick="closeNewProject()">Скасувати</button>
      <button class="btnPrimary" onclick="createProject()">Створити</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   STORAGE
========================================================= */

const PROJECTS_KEY = "sa_projects";

let projects = [];

try{
  const raw = localStorage.getItem(PROJECTS_KEY);
  const parsed = raw ? JSON.parse(raw) : [];
  if(Array.isArray(parsed)) projects = parsed;
}catch(e){
  console.warn("Не вдалося прочитати projects:", e);
  projects = [];
}

function saveProjects(){
  try{
    localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));
  }catch(e){
    console.warn("Не вдалося зберегти projects:", e);
  }
}

let currentProjectId = null;

/* =========================================================
   UTILS
========================================================= */

function uid(prefix){
  return (prefix || "id") + "-" + Date.now() + "-" + Math.random().toString(36).slice(2,7);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2200);
}

function money(value){
  const n = Number(value) || 0;
  return new Intl.NumberFormat("uk-UA").format(Math.round(n)) + " ₴";
}

/* =========================================================
   RENDER — ROUTER
========================================================= */

function render(){
  renderHero();

  if(currentProjectId){
    const project = projects.find(p => p.id === currentProjectId);
    if(!project){
      currentProjectId = null;
      renderHome();
      return;
    }
    renderProject(project);
  }else{
    renderHome();
  }
}

function renderHero(){
  const hero = document.getElementById("hero");

  if(currentProjectId){
    const project = projects.find(p => p.id === currentProjectId);
    const title = project ? projectTitlePlain(project) : "Об'єкт";

    hero.innerHTML = `
      <div class="heroRow">
        <button class="backButton" onclick="backToList()" aria-label="Назад">←</button>
        <div class="heroText">
          <div class="heroSub" style="color:var(--tm);font-size:.6875rem;letter-spacing:.3px">ОБ'ЄКТ</div>
          <div class="heroTitle" style="font-family:inherit;font-size:.9375rem;font-weight:750;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(title)}</div>
        </div>
      </div>
    `;
    return;
  }

  hero.innerHTML = `
    <div class="heroRow">
      <div class="heroLogo">
        <img src="logo.png" alt="SA-MASTER.PRO" onerror="this.style.display='none';this.parentNode.innerHTML='<span class=\\'heroLogoFallback\\'>S</span>'">
      </div>
      <div class="heroDivider"></div>
      <div class="heroText">
        <div class="heroTitle">SA-MASTER<span class="pro">.pro</span></div>
        <div class="heroSub">Кошторис. Звітність. Аудит.</div>
      </div>
    </div>
  `;
}

/* =========================================================
   RENDER — HOME
========================================================= */

function renderHome(){
  const main = document.getElementById("main");

  if(!projects.length){
    main.innerHTML = renderEmptyState();
    return;
  }

  main.innerHTML = renderProjectList();
}

function renderEmptyState(){
  return `
    <div class="emptyState">

      <div class="emptyIntro">
        <h2>З чого почати</h2>
        <ol>
          <li>Створіть перший об'єкт</li>
          <li>Внесіть дані про себе та команду</li>
          <li>Складіть кошторис</li>
          <li>Відправте замовнику</li>
          <li>Ведіть роботу до завершення</li>
        </ol>
      </div>

      <button class="primaryButton" onclick="openNewProject()">
        + Створити перший об'єкт
      </button>

    </div>
  `;
}

function renderProjectList(){
  const sorted = projects.slice().sort(sortProjects);

  return `
    <div class="listWrap">

      <div class="listHeader">
        <strong>Об'єкти (${projects.length})</strong>
        <button class="addSmallButton" onclick="openNewProject()">+ Об'єкт</button>
      </div>

      <div class="list">
        ${sorted.map(renderProjectCard).join("")}
      </div>

    </div>
  `;
}

function sortProjects(a,b){
  if(a.urgent && !b.urgent) return -1;
  if(!a.urgent && b.urgent) return 1;
  return String(b.updatedAt || "").localeCompare(String(a.updatedAt || ""));
}

function renderProjectCard(p){
  const dotClass = projectStageClass(p);
  const title = projectTitle(p);
  const client = escapeHtml(p.client?.name || "");
  const phone = escapeHtml(p.client?.phone || "");
  const address = escapeHtml(p.client?.address || "");

  const urgentMark = p.urgent ? `<span class="projectUrgent" title="Терміново">🔥</span>` : "";

  const stageLabel = projectStageLabel(p);
  const amount = p._total != null ? money(p._total) : "";
  const details = p._detailsLine || "";

  return `
    <div class="projectCard" onclick="openProject('${escapeHtml(p.id)}')">

      <span class="projectDot ${dotClass}"></span>

      <div class="projectBody">

        <div class="projectTitle">
          <span>${title}</span>
          ${urgentMark}
        </div>

        ${client ? `
          <div class="projectClient">
            ${client}${phone ? " · " + phone : ""}
          </div>
        ` : ""}

        ${address ? `
          <div class="projectAddress">${address}</div>
        ` : ""}

        <div class="projectDivider"></div>

        <div class="projectMeta">
          <span class="projectStage">${escapeHtml(stageLabel)}</span>
          ${amount ? `<span class="projectAmount">${amount}</span>` : ""}
        </div>

        ${details ? `<div class="projectDetails">${escapeHtml(details)}</div>` : ""}

      </div>

    </div>
  `;
}

function projectTitlePlain(p){
  if(p.title && String(p.title).trim()){
    return p.title.trim();
  }
  if(p.client?.address && String(p.client.address).trim()){
    return p.client.address.trim();
  }
  if(p.client?.name && String(p.client.name).trim()){
    return p.client.name.trim();
  }
  return "Без назви";
}

function projectTitle(p){
  return escapeHtml(projectTitlePlain(p));
}

function projectStageClass(p){
  const s = p.stage || "estimate";
  if(s === "work" || s === "complete") return "status-work";
  if(s === "done" || s === "closed") return "status-done";
  return "status-estimate";
}

function projectStageLabel(p){
  const s = p.stage || "estimate";
  switch(s){
    case "estimate": return "Прорахунок";
    case "work":     return "В роботі";
    case "done":     return "Завершено";
    case "closed":   return "Закрито";
    default:         return "Прорахунок";
  }
}

/* =========================================================
   RENDER — PROJECT
========================================================= */

function renderProject(p){
  const main = document.getElementById("main");

  const title = projectTitle(p);
  const client = escapeHtml(p.client?.name || "");
  const phone = escapeHtml(p.client?.phone || "");
  const address = escapeHtml(p.client?.address || "");
  const stageLabel = projectStageLabel(p);

  main.innerHTML = `
    <div class="projectView">

      <div class="projectHeaderCard">

        <div class="projectHeaderTitle">
          <span>${title}</span>
          ${p.urgent ? `<span class="projectUrgent">🔥</span>` : ""}
        </div>

        <div class="projectHeaderMeta">
          ${client ? `<b>${client}</b>${phone ? " · " + phone : ""}<br>` : ""}
          ${address ? `${address}<br>` : ""}
          <span style="color:var(--tm);font-size:.75rem">${escapeHtml(stageLabel)}</span>
        </div>

      </div>

      <div class="placeholderBlock">
        <strong>Об'єкт створено</strong>
        Тут буде кошторис, статуси та фінанси.<br>
        Наступний крок — додати позиції.
      </div>

    </div>
  `;
}

/* =========================================================
   ACTIONS
========================================================= */

function backToList(){
  currentProjectId = null;
  render();
}

function openProject(id){
  currentProjectId = id;
  render();
}

function openNewProject(){
  document.getElementById("npTitle").value = "";
  document.getElementById("npClientName").value = "";
  document.getElementById("npClientPhone").value = "";
  document.getElementById("npAddress").value = "";
  document.getElementById("newProjectSheet").classList.add("open");
  setTimeout(() => document.getElementById("npClientName").focus(), 200);
}

function closeNewProject(){
  document.getElementById("newProjectSheet").classList.remove("open");
}

function createProject(){
  const title = document.getElementById("npTitle").value.trim();
  const name = document.getElementById("npClientName").value.trim();
  const phone = document.getElementById("npClientPhone").value.trim();
  const address = document.getElementById("npAddress").value.trim();

  if(!name){
    toast("Вкажіть ім'я замовника");
    return;
  }

  if(!phone){
    toast("Вкажіть телефон замовника");
    return;
  }

  const now = new Date().toISOString();

  const project = {
    id: uid("proj"),
    title,
    client: { name, phone, address },

    stage: "estimate",
    urgent: false,

    positions: [],
    discount: 0,
    payments: [],
    expenses: [],
    salaries: [],

    details: {
      objectType: "",
      workType: "",
      area: null,
      bathrooms: null,
      system: "",
      features: []
    },

    status: {
      pricesConfirmed: false,
      clientApproved: false,
      advanceReceived: false,
      materialsPurchased: false,
      workStarted: false,
      workFinished: false,
      closed: false
    },

    createdAt: now,
    updatedAt: now
  };

  projects.push(project);
  saveProjects();

  closeNewProject();
  currentProjectId = project.id;
  render();

  toast("Об'єкт створено");
}

/* =========================================================
   INIT
========================================================= */

render();

document.getElementById("newProjectSheet").addEventListener("click", e => {
  if(e.target === e.currentTarget) closeNewProject();
});

</script>

</body>
</html>
