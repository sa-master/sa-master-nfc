<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Калькулятор сантехніка</title>
<meta name="description" content="Калькулятор вартості сантехнічних робіт.">

<style>
:root{
  --bg:#f2f2f7;
  --bg2:#fff;
  --card:rgba(255,255,255,.82);
  --solid:#fff;
  --text:#111;
  --muted:#777;
  --line:rgba(0,0,0,.09);
  --blue:#007aff;
  --blue-soft:rgba(0,122,255,.10);
  --red:#ff3b30;
  --control-bg:rgba(255,255,255,.86);
  --shadow:0 10px 35px rgba(0,0,0,.08);
}

html[data-theme="dark"]{
  --bg:#101114;
  --bg2:#18191d;
  --card:rgba(29,30,35,.86);
  --solid:#1d1e23;
  --text:#f5f5f7;
  --muted:#999;
  --line:rgba(255,255,255,.10);
  --blue:#0a84ff;
  --blue-soft:rgba(10,132,255,.16);
  --red:#ff453a;
  --control-bg:#292b31;
  --shadow:0 10px 35px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  min-height:100%;
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
}

body{
  min-height:100dvh;
  padding:
    max(12px,env(safe-area-inset-top))
    12px
    max(12px,env(safe-area-inset-bottom))
    12px;
  overflow:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  color:inherit;
  -webkit-user-select:none;
  user-select:none;
}

.app{
  width:100%;
  max-width:560px;
  height:calc(
    100dvh -
    max(12px,env(safe-area-inset-top)) -
    max(12px,env(safe-area-inset-bottom))
  );
  margin:0 auto;
  display:flex;
  flex-direction:column;
}

.header{
  flex:0 0 auto;
  min-height:50px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.brand{
  min-width:0;
}

.brand-title{
  font-size:22px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.7px;
}

.brand-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  line-height:1.1;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:6px;
}

.header-btn{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:50%;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  font-size:17px;
  display:grid;
  place-items:center;
}

.main-card{
  min-height:0;
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  padding:10px;
}

.project-bar{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-bottom:8px;
}

.project-field{
  min-width:0;
  height:34px;
  border:1px solid var(--line);
  border-radius:10px;
  background:rgba(120,120,128,.07);
  color:var(--text);
  padding:0 9px;
  outline:none;
  font-size:11px;
}

.project-field:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}

.tabs{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  padding:4px;
  margin-bottom:9px;
  background:rgba(120,120,128,.10);
  border-radius:13px;
}

.tab{
  min-height:34px;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:750;
}

.tab.active{
  background:var(--solid);
  color:var(--text);
  box-shadow:0 2px 7px rgba(0,0,0,.08);
}

.section-head{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:27px;
  margin:0 2px 5px;
}

.section-title{
  font-size:11px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.45px;
}

.section-action{
  color:var(--blue);
  background:transparent;
  font-size:11px;
  font-weight:700;
  padding:4px 2px;
}

.estimate-list{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:0 1px 2px 0;
  scrollbar-width:thin;
}

.estimate-row{
  flex:0 0 47px;
  min-height:47px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  align-items:center;
  gap:5px;
  padding:5px 6px 5px 9px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(120,120,128,.055);
}

.estimate-info{
  min-width:0;
  cursor:pointer;
}

.estimate-name{
  font-size:12px;
  line-height:1.15;
  font-weight:680;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.estimate-meta{
  margin-top:2px;
  color:var(--muted);
  font-size:9px;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.qty-control{
  height:29px;
  display:flex;
  align-items:center;
  gap:1px;
  padding:2px;
  border-radius:8px;
  background:rgba(120,120,128,.10);
  border:1px solid var(--line);
}

.qty-btn{
  width:25px;
  height:25px;
  border-radius:6px;
  background:var(--control-bg);
  border:1px solid var(--line);
  color:var(--blue);
  font-size:16px;
  font-weight:850;
  display:grid;
  place-items:center;
  line-height:1;
}

.qty-btn:active{
  background:var(--blue);
  color:#fff;
}

.qty-value{
  min-width:21px;
  text-align:center;
  font-size:11px;
  font-weight:800;
}

.estimate-price{
  min-width:67px;
  text-align:right;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.estimate-remove{
  width:24px;
  height:24px;
  border-radius:7px;
  background:transparent;
  color:var(--muted);
  font-size:16px;
  display:grid;
  place-items:center;
}

.estimate-remove:active{
  color:var(--red);
  background:rgba(255,59,48,.10);
}

.empty{
  min-height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px dashed var(--line);
  border-radius:13px;
  color:var(--muted);
  font-size:11px;
  padding:12px;
}

.bottom-panel{
  flex:0 0 auto;
  padding-top:7px;
}

.total-box{
  min-height:49px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 11px;
  border-radius:13px;
  background:var(--blue-soft);
}

.total-label{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.total-value{
  font-size:19px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.4px;
  white-space:nowrap;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:6px;
}

.action-btn{
  min-height:37px;
  border-radius:11px;
  background:rgba(120,120,128,.09);
  border:1px solid var(--line);
  font-size:11px;
  font-weight:750;
}

.action-btn.primary{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

.catalog-open{
  width:100%;
  min-height:42px;
  margin-top:6px;
  border-radius:12px;
  background:var(--blue);
  color:#fff;
  font-size:13px;
  font-weight:800;
  box-shadow:0 5px 16px rgba(0,122,255,.18);
}

/* =========================================================
   PRINT TOTAL
========================================================= */

.print-total{
  display:none;
}


/* =========================================================
   MODALS
========================================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:10px;
  background:rgba(0,0,0,.28);
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(560px,100%);
  max-height:92dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:var(--solid);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:23px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.sheet-head{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 14px 9px;
}

.sheet-title{
  font-size:17px;
  font-weight:850;
  letter-spacing:-.3px;
}

.close-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(120,120,128,.10);
  color:var(--muted);
  font-size:20px;
  display:grid;
  place-items:center;
}

.catalog-body{
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:0 13px 13px;
}

.search{
  flex:0 0 auto;
  width:100%;
  height:40px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  background:rgba(120,120,128,.07);
  color:var(--text);
  padding:0 12px;
  font-size:13px;
  margin-bottom:8px;
}

.search:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}

.catalog-tabs{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  padding:4px;
  background:rgba(120,120,128,.10);
  border-radius:12px;
  margin-bottom:8px;
}

.catalog-tab{
  height:32px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  font-weight:750;
}

.catalog-tab.active{
  background:var(--solid);
  color:var(--text);
  box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.work-list{
  height:430px;
  min-height:360px;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding-right:2px;
  scrollbar-width:thin;
}

.work-item{
  width:100%;
  min-height:60px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:9px;
  padding:7px 8px 7px 10px;
  margin-bottom:5px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(120,120,128,.055);
  text-align:left;
  cursor:pointer;
  transition:
    transform .12s ease,
    background .12s ease;
}

.work-item:active{
  transform:scale(.99);
  background:var(--blue-soft);
}

.work-item:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:2px;
}

.work-info{
  min-width:0;
}

.work-name{
  font-size:12px;
  line-height:1.2;
  font-weight:700;
}

.work-meta{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
  line-height:1;
}

.work-price{
  color:var(--blue);
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.work-control{
  display:flex;
  align-items:center;
  gap:2px;
  height:30px;
  padding:2px;
  border-radius:8px;
  background:var(--blue-soft);
  border:1px solid var(--line);
}

.work-control button{
  width:25px;
  height:25px;
  flex:0 0 25px;
  border-radius:6px;
  background:var(--control-bg);
  border:1px solid var(--line);
  color:var(--blue);
  font-size:17px;
  font-weight:900;
  display:grid;
  place-items:center;
  line-height:1;
  opacity:1;
}

.work-control button:active{
  background:var(--blue);
  color:#fff;
}

.work-control span{
  min-width:20px;
  text-align:center;
  color:var(--text);
  font-size:11px;
  font-weight:850;
}

.catalog-footer{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding-top:8px;
}

.catalog-count{
  color:var(--muted);
  font-size:10px;
}

.new-work-btn{
  min-height:35px;
  padding:0 12px;
  border-radius:10px;
  background:rgba(120,120,128,.10);
  border:1px solid var(--line);
  color:var(--blue);
  font-size:11px;
  font-weight:750;
}

.form-body{
  padding:0 14px 14px;
  overflow-y:auto;
}

.field{
  margin-bottom:10px;
}

.field label{
  display:block;
  margin:0 0 5px 2px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
}

.input,
.textarea{
  width:100%;
  min-height:42px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
  background:rgba(120,120,128,.07);
  color:var(--text);
  padding:0 11px;
  font-size:13px;
}

.textarea{
  min-height:70px;
  padding:10px 11px;
  resize:none;
}

.input:focus,
.textarea:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}

.form-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:5px;
}

.form-btn{
  min-height:41px;
  border-radius:11px;
  background:rgba(120,120,128,.09);
  border:1px solid var(--line);
  font-size:12px;
  font-weight:750;
}

.form-btn.primary{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

.form-btn.danger{
  color:var(--red);
}

.price-current{
  margin:0 0 10px;
  padding:10px 11px;
  border-radius:11px;
  background:var(--blue-soft);
  font-size:12px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:max(18px,env(safe-area-inset-bottom));
  z-index:3000;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:9px 13px;
  border-radius:11px;
  background:#222;
  color:#fff;
  font-size:11px;
  font-weight:650;
  transition:.22s ease;
  max-width:calc(100vw - 30px);
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-height:700px){

  .header{
    min-height:44px;
    margin-bottom:6px;
  }

  .brand-title{
    font-size:20px;
  }

  .header-btn{
    width:35px;
    height:35px;
    flex-basis:35px;
  }

  .main-card{
    padding:8px;
  }

  .estimate-row{
    flex-basis:44px;
    min-height:44px;
  }

  .work-list{
    height:390px;
    min-height:330px;
  }
}

@media(max-width:380px){

  .estimate-row{
    grid-template-columns:minmax(0,1fr) auto auto;
  }

  .estimate-price{
    grid-column:2;
    grid-row:1;
    min-width:60px;
  }

  .qty-control{
    grid-column:2;
    grid-row:2;
  }

  .estimate-remove{
    grid-column:3;
    grid-row:1 / span 2;
  }

  .estimate-name{
    font-size:11px;
  }

  .estimate-meta{
    font-size:8px;
  }
}


/* =========================================================
   PRINT / PDF
========================================================= */

@media print{

  @page{
    size:auto;
    margin:12mm;
  }

  html,
  body{
    width:auto;
    height:auto;
    min-height:0;
    overflow:visible;
    background:#fff!important;
    color:#111!important;
    padding:0;
  }

  .app{
    width:100%;
    max-width:none;
    height:auto;
    margin:0;
  }

  .header{
    margin-bottom:14px;
  }

  .header-actions,
  .project-bar,
  .tabs,
  .section-action,
  .bottom-panel,
  .modal,
  .toast{
    display:none!important;
  }

  .main-card{
    display:block;
    width:100%;
    border:0;
    border-radius:0;
    box-shadow:none;
    background:#fff!important;
    padding:0;
  }

  .brand-title{
    color:#111!important;
  }

  .brand-sub{
    color:#666!important;
  }

  .section-head{
    margin-bottom:8px;
  }

  .section-title{
    color:#555!important;
  }

  .estimate-list{
    display:block;
    overflow:visible;
    height:auto;
    max-height:none;
    padding:0;
  }

  .estimate-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    width:100%;
    min-height:38px;
    height:auto;
    break-inside:avoid;
    page-break-inside:avoid;
    background:#fff!important;
    border-color:#ddd!important;
    color:#111!important;
    padding:7px 8px;
    margin-bottom:5px;
  }

  .estimate-name{
    color:#111!important;
  }

  .estimate-meta{
    color:#666!important;
  }

  .estimate-price{
    color:#111!important;
    min-width:80px;
  }

  .estimate-remove,
  .qty-control{
    display:none!important;
  }

  .empty{
    color:#666!important;
    border-color:#ccc!important;
  }

  /*
    Окремий друкований блок загальної суми.
    Він НЕ залежить від bottom-panel,
    тому гарантовано потрапляє у PDF.
  */

  .print-total{
    display:flex!important;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    width:100%;
    margin-top:18px;
    padding:12px 14px;
    border:1px solid #ccc;
    border-radius:10px;
    background:#f1f5ff!important;
    color:#111!important;
    break-inside:avoid;
    page-break-inside:avoid;
  }

  .print-total-label{
    font-size:13px;
    font-weight:700;
    color:#444!important;
  }

  .print-total-value{
    font-size:18px;
    line-height:1;
    font-weight:850;
    color:#111!important;
    white-space:nowrap;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand">

    <div id="brandTitle" class="brand-title">
      Калькулятор сантехніка
    </div>

    <div id="brandSub" class="brand-sub">
      Кошторис вартості робіт
    </div>

  </div>

  <div class="header-actions">

    <button
      class="header-btn"
      type="button"
      onclick="openSettings()"
      aria-label="Налаштування"
    >⚙</button>

    <button
      id="themeButton"
      class="header-btn"
      type="button"
      onclick="toggleTheme()"
      aria-label="Змінити тему"
    >☾</button>

  </div>

</header>

<main class="main-card">

  <div class="project-bar">

    <input
      id="clientInput"
      class="project-field"
      type="text"
      placeholder="Клієнт"
      autocomplete="off"
      oninput="updateProject()"
    >

    <input
      id="objectInput"
      class="project-field"
      type="text"
      placeholder="Об'єкт"
      autocomplete="off"
      oninput="updateProject()"
    >

  </div>

  <div class="tabs">

    <button
      id="roughTab"
      class="tab active"
      type="button"
      onclick="setMainCategory('rough')"
    >Чорнові</button>

    <button
      id="finishTab"
      class="tab"
      type="button"
      onclick="setMainCategory('finish')"
    >Чистові</button>

  </div>

  <div class="section-head">

    <div class="section-title">
      Додані роботи
    </div>

    <button
      id="clearEstimateBtn"
      class="section-action"
      type="button"
      onclick="clearEstimate()"
    >Очистити</button>

  </div>

  <div id="estimateList" class="estimate-list"></div>

  <!-- Друкується тільки у PDF -->
  <div class="print-total">

    <div class="print-total-label">
      Загальна вартість робіт
    </div>

    <div
      id="printTotalValue"
      class="print-total-value"
    >0 ₴</div>

  </div>

  <div class="bottom-panel">

function cloneDefaults(){

  return{

    rough:
      defaultDB.rough.map(
        item=>({...item})
      ),

    finish:
      defaultDB.finish.map(
        item=>({...item})
      )

function normalizeCatalog(data){

  const source=
    data&&
    typeof data==="object"
      ? data
      : {};

  const result={

    rough:
      Array.isArray(source.rough)
        ? source.rough
            .filter(Boolean)
            .map(item=>({...item}))
        : [],

    finish:
      Array.isArray(source.finish)
        ? source.finish
            .filter(Boolean)
            .map(item=>({...item}))
        : []

  };


  const oldR19=
    result.rough.find(
      item=>item.id==="r19"
    );

  if(oldR19){

    if(
      !result.finish.some(
        item=>item.id==="f4"
      )
    ){

      result.finish.push({

        id:"f4",

        name:"Монтаж душової системи",

        unit:oldR19.unit||"шт",

        price:Number(
          oldR19.price??3500
        )

      });

    }

    result.rough=
      result.rough.filter(
        item=>item.id!=="r19"
      );
  }


  const oldR20=
    result.rough.find(
      item=>item.id==="r20"
    );

  if(oldR20){

    if(
      !result.finish.some(
        item=>item.id==="f8"
      )
    ){

      result.finish.push({

        id:"f8",

        name:"Монтаж рушникосушки",

        unit:oldR20.unit||"шт",

        price:Number(
          oldR20.price??3000
        )

      });

    }

    result.rough=
      result.rough.filter(
        item=>item.id!=="r20"
      );
  }


  result.rough=
    result.rough.filter(
      item=>
        item.id!=="f4"&&
        item.id!=="f8"
    );


  ["rough","finish"].forEach(category=>{

    defaultDB[category].forEach(defaultItem=>{

      const exists=
        result[category].some(
          item=>item.id===defaultItem.id
        );

      if(!exists){

        result[category].push({
          ...defaultItem
        });

      }

    });

  });


  const f4=
    result.finish.find(
      item=>item.id==="f4"
    );

  if(f4){

    f4.name=
      "Монтаж душової системи";

    f4.unit=
      f4.unit||"шт";

    f4.price=
      Number(f4.price??3500);
  }


  const f8=
    result.finish.find(
      item=>item.id==="f8"
    );

  if(f8){

    f8.name=
      "Монтаж рушникосушки";

    f8.unit=
      f8.unit||"шт";

    f8.price=
      Number(f8.price??3000);
  }


  if(!result.rough.length){

    result.rough=
      defaultDB.rough.map(
        item=>({...item})
      );
  }

  if(!result.finish.length){

    result.finish=
      defaultDB.finish.map(
        item=>({...item})
      );
  }

  return result;
}


function loadDB(){

      localStorage.getItem(

      );

    if(raw){
      stored=JSON.parse(raw);
    }

  }catch(error){

    console.warn(
      "Не вдалося прочитати каталог:",
      error
    );
  }


  if(
    !stored||
    typeof stored!=="object"
  ){

    try{

      const old=
        localStorage.getItem(
          "samaster_db"
        );

      if(old){
        stored=JSON.parse(old);
      }

    }catch(error){

      console.warn(
        "Не вдалося прочитати старий каталог:",
        error
      );
    }
  }


  const result=
    normalizeCatalog(stored);


  try{

    localStorage.setItem(
      "plumber_calc_catalog",
      JSON.stringify(result)
    );

  }catch(error){

    console.warn(
      "Не вдалося зберегти каталог:",
      error
    );
  }

  return result;
}


function saveDB(){

  db=
    normalizeCatalog(db);

  try{

    localStorage.setItem(

      JSON.stringify(db)

    console.warn(
      "Не вдалося зберегти каталог:",
      error
    );
  }
}


function ensureCatalog(){

  const beforeRough=
    Array.isArray(db?.rough)
      ? db.rough.length
      : 0;

  const beforeFinish=
    Array.isArray(db?.finish)
      ? db.finish.length
      : 0;

  db=
    normalizeCatalog(db);

  const afterRough=
    db.rough.length;

  const afterFinish=
    db.finish.length;

  if(
    beforeRough!==afterRough||
    beforeFinish!==afterFinish
  ){

    saveDB();
  }

  return db;
}

function migrateEstimate(data){

  if(!Array.isArray(data)){
    return [];
  }

  let result=
    data
      .filter(Boolean)
      .map(item=>({...item}));


  const oldShower=
    result.filter(
      item=>item.workId==="r19"
    );

  if(oldShower.length){

    const existing=
      result.find(
        item=>item.workId==="f4"
      );

    if(existing){

      oldShower.forEach(item=>{

        existing.qty=
          Number(existing.qty||0)+
          Number(item.qty||0);

      });

      result=
        result.filter(
          item=>item.workId!=="r19"
        );

    }else{

      const first=oldShower[0];

      const totalQty=
        oldShower.reduce(
          (sum,item)=>
            sum+Number(item.qty||0),
          0
        );

      result=
        result
          .map(item=>{

            if(item===first){

              return{

                ...item,

                workId:"f4",

                cat:"finish",

                name:"Монтаж душової системи",

                unit:item.unit||"шт",

                qty:totalQty

              };

            }

            return item;

          })
          .filter(
            item=>item.workId!=="r19"
          );
    }
  }


  const oldTowel=
    result.filter(
      item=>item.workId==="r20"
    );

  if(oldTowel.length){

    const existing=
      result.find(
        item=>item.workId==="f8"
      );

    if(existing){

      oldTowel.forEach(item=>{

        existing.qty=
          Number(existing.qty||0)+
          Number(item.qty||0);

      });

      result=
        result.filter(
          item=>item.workId!=="r20"
        );

    }else{

      const first=oldTowel[0];

      const totalQty=
        oldTowel.reduce(
          (sum,item)=>
            sum+Number(item.qty||0),
          0
        );

      result=
        result
          .map(item=>{

            if(item===first){

              return{

                ...item,

                workId:"f8",

                cat:"finish",

                name:"Монтаж рушникосушки",

                unit:item.unit||"шт",

                qty:totalQty

              };

            }

            return item;

          })
          .filter(
            item=>item.workId!=="r20"
          );
    }
  }


  result=
    result.map(item=>{

      if(item.workId==="f4"){

        return{

          ...item,

          cat:"finish",

          name:"Монтаж душової системи",

          unit:item.unit||"шт"

        };

      }

      if(item.workId==="f8"){

        return{

          ...item,

          cat:"finish",

          name:"Монтаж рушникосушки",

          unit:item.unit||"шт"

        };

      }

      return item;

    });


  try{

    localStorage.setItem(
      "plumber_calc_estimate",
      JSON.stringify(result)
    );

  }catch{}

  return result;
}

    );

  }catch{}

  savePassportEstimate();
}


function renderProject(){

  $("clientInput").value=
    project.client||"";

  $("objectInput").value=
    project.object||"";
}


/* =========================================================
   PASSPORT
========================================================= */

function getEstimateId(){

  let id=
    localStorage.getItem(
      "plumber_calc_estimate_id"
    );

  if(!id){

    id=
      "PL-"+
      Date.now()
        .toString(36)
        .toUpperCase();

    localStorage.setItem(
      "plumber_calc_estimate_id",
      id
    );
  }

  return id;
}


function getCreatedAt(){

  let value=
    localStorage.getItem(
      "plumber_calc_estimate_created"
    );

  if(!value){

    value=
      new Date().toISOString();

    localStorage.setItem(
      "plumber_calc_estimate_created",
      value
    );
  }

  return value;
}


function savePassportEstimate(){

  if(!profile){
    return;
  }

  const passport={

    type:"plumber-estimate",

    version:3,

    product:PRODUCT.name,

    estimateId:getEstimateId(),

    createdAt:getCreatedAt(),

    updatedAt:new Date().toISOString(),

    status:"draft",

    currency:"UAH",

    master:{

      brand:profile.brand||"",

      name:profile.name||"",

      phone:profile.phone||"",

      details:profile.details||"",

      logo:profile.logo||""

    },

    client:
      project.client||"",

    object:
      project.object||"",

    categories:{

      rough:
        estimate.filter(
          x=>x.cat==="rough"
        ).length,

      finish:
        estimate.filter(
          x=>x.cat==="finish"
        ).length

    },

    total:
      getEstimateTotal(),

    itemCount:
      estimate.reduce(
        (sum,x)=>
          sum+Number(x.qty||0),
        0
      ),

    items:
      estimate.map(item=>({

        id:item.lineId,

        workId:item.workId,

        name:item.name,

        category:item.cat,

        unit:item.unit,

        quantity:
          Number(item.qty||0),

        basePrice:
          Number(item.basePrice||0),

        price:
          Number(item.price||0),

        total:
          Number(item.price||0)*
          Number(item.qty||0)

      }))

  };


  try{

    localStorage.setItem(
      "plumber_calc_passport",
      JSON.stringify(passport)
    );

    localStorage.setItem(
      "samaster_passport_estimate",
      JSON.stringify(passport)
    );

  }catch(error){

    console.warn(
      "Не вдалося зберегти паспорт:",
      error
    );
  }
}


/* =========================================================
   MAIN CATEGORY
========================================================= */

function setMainCategory(category){

  mainCategory=
    category==="finish"
      ? "finish"
      : "rough";

  $("roughTab")
    .classList.toggle(
      "active",
      mainCategory==="rough"
    );

  $("finishTab")
    .classList.toggle(
      "active",
      mainCategory==="finish"
    );

  renderEstimate();
}


/* =========================================================
   ESTIMATE RENDER
========================================================= */

function renderEstimate(){

  const list=
    $("estimateList");

  if(!list){
    return;
  }

  const items=
    estimate.filter(
      item=>item.cat===mainCategory
    );


  if(!items.length){

    list.innerHTML=`

      <div class="empty">
        У цій категорії ще немає доданих робіт
      </div>

    `;

  }else{

    list.innerHTML=
      items.map(item=>{

        const total=
          Number(item.price||0)*
          Number(item.qty||0);

        return`

          <div class="estimate-row">

            <div
              class="estimate-info"
              onclick="openPriceModal('${esc(item.lineId)}')"
            >

              <div class="estimate-name">
                ${esc(item.name)}
              </div>

              <div class="estimate-meta">
                ${esc(item.unit)}
                ·
                ${money(item.price)}
                / ${esc(item.unit)}
              </div>

            </div>

            <div class="qty-control">

              <button
                class="qty-btn"
                type="button"
                aria-label="Зменшити кількість"
                onclick="changeQty('${esc(item.lineId)}',-1)"
              >−</button>

              <div class="qty-value">
                ${Number(item.qty||0)}
              </div>

              <button
                class="qty-btn"
                type="button"
                aria-label="Збільшити кількість"
                onclick="changeQty('${esc(item.lineId)}',1)"
              >+</button>

            </div>

            <div class="estimate-price">
              ${money(total)}
            </div>

            <button
              class="estimate-remove"
              type="button"
              aria-label="Видалити позицію"
              onclick="removeEstimateLine('${esc(item.lineId)}')"
            >×</button>

          </div>

        `;

      }).join("");

  }


  const total=
    getEstimateTotal();

  $("totalValue").textContent=
    money(total);

  /*
    Окремий елемент використовується
    саме друкованою версією.
  */

  $("printTotalValue").textContent=
    money(total);

  $("clearEstimateBtn").style.visibility=
    estimate.length
      ? "visible"
      : "hidden";
}


/* =========================================================
   ADD WORK
========================================================= */

function addWork(workId){

  ensureCatalog();

  const item=
    findWork(workId);

  if(!item){

    showToast(
      "Позицію не знайдено"
    );

    return;
  }


  const existing=
    estimate.find(
      x=>x.workId===workId
    );


  if(existing){

    existing.qty=
      Number(existing.qty||0)+1;

  }else{

    estimate.push({

      lineId:uid(),

      workId:item.id,

      name:item.name,

      unit:item.unit,

      cat:item.cat,

      basePrice:
        Number(item.price||0),

      price:
        Number(item.price||0),

      qty:1

    });

  }


  saveEstimate();

  renderEstimate();

  renderAddWorkList();

  showToast(
    "Позицію додано"
  );
}


function changeQty(lineId,delta){

  const item=
    estimate.find(
      x=>x.lineId===lineId
    );

  if(!item){
    return;
  }


  item.qty=
    Number(item.qty||0)+
    Number(delta||0);


  if(item.qty<=0){

    estimate=
      estimate.filter(
        x=>x.lineId!==lineId
      );

  }


  saveEstimate();

  renderEstimate();

  renderAddWorkList();
}


function removeEstimateLine(lineId){

  estimate=
    estimate.filter(
      x=>x.lineId!==lineId
    );

  saveEstimate();

  renderEstimate();

  renderAddWorkList();
}


/* =========================================================
   CLEAR
========================================================= */

function clearEstimate(){

  if(!estimate.length){
    return;
  }

  if(
    !confirm(
      "Очистити весь кошторис?"
    )
  ){
    return;
  }


  estimate=[];

  localStorage.removeItem(
    "plumber_calc_estimate_id"
  );

  localStorage.removeItem(
    "plumber_calc_estimate_created"
  );

  saveEstimate();

  renderEstimate();

  renderAddWorkList();

  showToast(
    "Кошторис очищено"
  );
}


/* =========================================================
   CATALOG UI
========================================================= */

function openCatalog(){

  ensureCatalog();

  catalogCategory=
    mainCategory==="finish"
      ? "finish"
      : "rough";

  $("workSearch").value="";

  updateCatalogTabs();

  renderAddWorkList();

  $("catalogModal")
    .classList.add("show");

  setTimeout(()=>{

    $("workSearch").focus();

  },100);
}


function setCatalogCategory(category){

  catalogCategory=
    category==="finish"
      ? "finish"
      : "rough";

  updateCatalogTabs();

  renderAddWorkList();
}


function updateCatalogTabs(){

  $("catalogRoughTab")
    .classList.toggle(
      "active",
      catalogCategory==="rough"
    );

  $("catalogFinishTab")
    .classList.toggle(
      "active",
      catalogCategory==="finish"
    );
}


function renderAddWorkList(){

  const list=
    $("workList");

  if(!list){
    return;
  }

  ensureCatalog();


  const query=
    String(
      $("workSearch")?.value||""
    )
      .trim()
      .toLowerCase();


  const source=
    Array.isArray(db[catalogCategory])
      ? db[catalogCategory]
      : [];


  const filtered=
    source.filter(item=>{

      if(!item){
        return false;
      }

      if(!query){
        return true;
      }

      const name=
        String(item.name||"")
          .toLowerCase();

      const unit=
        String(item.unit||"")
          .toLowerCase();

      return(
        name.includes(query)||
        unit.includes(query)
      );

    });


  $("catalogCount").textContent=
    `${filtered.length} позицій`;


  if(!filtered.length){

    list.innerHTML=`

      <div class="empty">
        Нічого не знайдено
      </div>

    `;

    return;
  }


  list.innerHTML=
    filtered
      .map(renderAddWorkItem)
      .join("");
}


function renderAddWorkItem(item){

  const existing=
    estimate.find(
      x=>x.workId===item.id
    );


  const controls=

    existing

      ? `

        <div class="work-control">

          <button
            type="button"
            aria-label="Зменшити кількість"
            onclick="event.stopPropagation();changeQty('${esc(existing.lineId)}',-1)"
          >−</button>

          <span>
            ${Number(existing.qty||0)}
          </span>

          <button
            type="button"
            aria-label="Збільшити кількість"
            onclick="event.stopPropagation();changeQty('${esc(existing.lineId)}',1)"
          >+</button>

        </div>

      `

      : `

        <div class="work-price">
          ${money(item.price)}
        </div>

      `;


  /*
    Тут навмисно DIV, а не BUTTON.

    Раніше всередині work-item,
    який був button, знаходилися
    ще два button для +/−.

    Вкладені button є некоректним HTML
    і могли давати проблеми на iOS/Safari.

    Тепер структура коректна:
    DIV → BUTTON + BUTTON.
  */

  return`

    <div
      class="work-item"
      role="button"
      tabindex="0"
      onclick="addWork('${esc(item.id)}')"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();addWork('${esc(item.id)}')}"
      oncontextmenu="event.preventDefault();openEditWorkModal('${esc(item.id)}')"
    >

      <div class="work-info">

        <div class="work-name">
          ${esc(item.name)}
        </div>

        <div class="work-meta">
          ${esc(item.unit)}
        </div>

      </div>

      ${controls}

    </div>

  `;
}


/* =========================================================
   WORK MODAL
========================================================= */

function openNewWorkModal(){

  editingWorkId=null;


  editingWorkCategory=
    $("catalogModal")
      .classList
      .contains("show")
      ? catalogCategory
      : mainCategory;


  $("workModalTitle")
    .textContent="Нова позиція";

  $("workName").value="";
  $("workUnit").value="";
  $("workPrice").value="";

  $("deleteWorkButton")
    .style.display="none";

  $("workModal")
    .classList.add("show");

  setTimeout(()=>{

    $("workName").focus();

  },100);
}


function openEditWorkModal(workId){

  const item=
    findWork(workId);

  if(!item){
    return;
  }


  editingWorkId=item.id;

  editingWorkCategory=item.cat;


  $("workModalTitle")
    .textContent="Редагувати позицію";

  $("workName").value=
    item.name;

  $("workUnit").value=
    item.unit;

  $("workPrice").value=
    item.price;


  $("deleteWorkButton")
    .style.display="block";


  $("workModal")
    .classList.add("show");
}


function saveWork(){

  const name=
    $("workName")
      .value
      .trim();

  const unit=
    $("workUnit")
      .value
      .trim();

  const price=
    Number(
      $("workPrice").value
    );


  if(!name){

    showToast(
      "Вкажіть назву роботи"
    );

    return;
  }


  if(!unit){

    showToast(
      "Вкажіть одиницю"
    );

    return;
  }


  if(
    !Number.isFinite(price)||
    price<0
  ){

    showToast(
      "Вкажіть коректну ціну"
    );

    return;
  }


  if(editingWorkId){

    const item=
      findWork(editingWorkId);

    if(!item){
      return;
    }


    item.name=name;

    item.unit=unit;

    item.price=price;


    estimate.forEach(line=>{

      if(line.workId===item.id){

        line.name=name;

        line.unit=unit;

        line.basePrice=price;

      }

    });


    saveDB();

    saveEstimate();

    closeModal(
      "workModal"
    );

    renderEstimate();

    renderAddWorkList();

    showToast(
      "Позицію оновлено"
    );

    return;
  }


  ensureCatalog();


  const category=
    editingWorkCategory==="finish"
      ? "finish"
      : "rough";


  const id=
    category+
    "-"+
    uid();


  db[category].push({

    id,

    name,

    unit,

    price

  });


  saveDB();

  closeModal(
    "workModal"
  );

  renderAddWorkList();

  showToast(
    "Позицію створено"
  );
}


function deleteCurrentWork(){

  if(!editingWorkId){
    return;
  }

  deleteWork(
    editingWorkId
  );
}


function deleteWork(workId){

  const item=
    findWork(workId);

  if(!item){
    return;
  }


  if(
    !confirm(
      `Видалити "${item.name}" з каталогу?`
    )
  ){
    return;
  }


  db[item.cat]=
    db[item.cat].filter(
      x=>x.id!==workId
    );


  estimate=
    estimate.filter(
      x=>x.workId!==workId
    );


  saveDB();

  saveEstimate();

  closeModal(
    "workModal"
  );

  renderEstimate();

  renderAddWorkList();

  showToast(
    "Позицію видалено"
  );
}


/* =========================================================
   PRICE
========================================================= */

function openPriceModal(lineId){

  const item=
    estimate.find(
      x=>x.lineId===lineId
    );

  if(!item){
    return;
  }


  editingPriceLineId=lineId;


  $("priceCurrent").innerHTML=`

    <strong>
      ${esc(item.name)}
    </strong>

    <br>

    <span style="color:var(--muted)">
      Базова ціна:
      ${money(item.basePrice)}
    </span>

  `;


  $("priceInput").value=
    item.price;


  $("priceModal")
    .classList.add("show");


  setTimeout(()=>{

    $("priceInput").focus();

    $("priceInput").select();

  },100);
}


function savePrice(){

  if(!editingPriceLineId){
    return;
  }


  const item=
    estimate.find(
      x=>x.lineId===editingPriceLineId
    );

  if(!item){
    return;
  }


  const price=
    Number(
      $("priceInput").value
    );


  if(
    !Number.isFinite(price)||
    price<0
  ){

    showToast(
      "Вкажіть коректну ціну"
    );

    return;
  }


  item.price=price;

  saveEstimate();

  closeModal(
    "priceModal"
  );

  renderEstimate();

  showToast(
    "Ціну змінено"
  );
}


function resetPriceToBase(){

  if(!editingPriceLineId){
    return;
  }


  const item=
    estimate.find(
      x=>x.lineId===editingPriceLineId
    );

  if(!item){
    return;
  }


  item.price=
    Number(
      item.basePrice||0
    );


  $("priceInput").value=
    item.price;


  saveEstimate();

  renderEstimate();

  showToast(
    "Повернуто базову ціну"
  );
}

   SETTINGS
========================================================= */

  $("profileName").value=

  $("profilePhone").value=

/* =========================================================
   PDF
========================================================= */

function printEstimate(){

  if(!estimate.length){

    showToast(
      "Спочатку додайте роботи"
    );

    return;
  }


  /*
    Перед друком ще раз актуалізуємо
    загальну суму в друкованому блоці.

    Це важливо: print-total існує
    окремо від нижньої панелі,
    яка ховається під час друку.
  */

  const total=
    getEstimateTotal();

  $("printTotalValue").textContent=
    money(total);


  savePassportEstimate();

  /*
    Даємо браузеру короткий цикл
    на оновлення DOM перед print.
  */

  requestAnimationFrame(()=>{

    window.print();

  });
}


/* =========================================================
   JSON
========================================================= */

function exportJSON(){

  const data={

    type:"plumber-estimate",

    version:3,

    product:PRODUCT.name,

    estimateId:
      getEstimateId(),

    createdAt:
      getCreatedAt(),

    exportedAt:
      new Date().toISOString(),

    master:{
      ...profile
    },

    client:
      project.client||"",

    object:
      project.object||"",

    total:
      getEstimateTotal(),

    items:
      estimate.map(item=>({

        id:item.lineId,

        workId:item.workId,

        name:item.name,

        category:item.cat,

        unit:item.unit,

        quantity:
          Number(item.qty||0),

        basePrice:
          Number(item.basePrice||0),

        price:
          Number(item.price||0),

        total:
          Number(item.price||0)*
          Number(item.qty||0)

      }))

  };


  const blob=
    new Blob(

      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],

      {
        type:
          "application/json;charset=utf-8"
      }

    );


  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "plumber-estimate.json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

  showToast(
    "JSON експортовано"
  );
}


/* =========================================================
   MODALS
========================================================= */

function closeModal(id){

  const modal=$(id);

  if(modal){

    modal.classList.remove(
      "show"
    );

  }
}


function modalBackgroundClick(
  event,
  id
){

  if(
    event.target===
    $(id)
  ){

    closeModal(id);

  }
}


document.addEventListener(
  "keydown",
  event=>{

    if(event.key!=="Escape"){
      return;
    }

    document
      .querySelectorAll(
        ".modal.show"
      )
      .forEach(modal=>{

        modal.classList.remove(
          "show"
        );

      });

  }
);


/* =========================================================
   THEME
========================================================= */

function applyTheme(theme){

  document.documentElement
    .dataset.theme=theme;

  localStorage.setItem(
    "plumber_calc_theme",
    theme
  );

  $("themeButton")
    .textContent=
      theme==="dark"
        ? "☀"
        : "☾";
}


function initTheme(){

  const saved=
    localStorage.getItem(
      "plumber_calc_theme"
    );

  applyTheme(
    saved==="dark"
      ? "dark"
      : "light"
  );
}


function toggleTheme(){

  const current=
    document.documentElement
      .dataset.theme||
    "light";

  applyTheme(
    current==="dark"
      ? "light"
      : "dark"
  );
}


/* =========================================================
   INIT
========================================================= */

function init(){

  profile=
    loadProfile();

  db=
    loadDB();

  ensureCatalog();

  estimate=
    loadEstimate();

  project=
    loadProject();

  initTheme();

  renderProfile();

  renderProject();

  setMainCategory(
    "rough"
  );

  updateCatalogTabs();

  renderEstimate();

  renderAddWorkList();
}


if(
  document.readyState===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    init,
    {once:true}
  );

}else{

  init();

}
