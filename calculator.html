<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Калькулятор сантехніка</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f4f6fa;
  --card:rgba(255,255,255,.9);
  --soft:#eef1f5;
  --line:#e2e5ea;
  --text:#15171a;
  --muted:#7b8088;
  --blue:#007aff;
  --red:#ff3b30;
  --shadow:0 8px 25px rgba(30,40,60,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,input,select{font:inherit}

button{
  border:0;
  background:none;
  color:inherit;
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:560px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

.header{
  flex:0 0 auto;
  padding:calc(9px + env(safe-area-inset-top)) 14px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:19px;
  font-weight:750;
  letter-spacing:-.4px;
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:1px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:9px;
}

.date{
  color:var(--muted);
  font-size:12px;
}

.masterButton{
  width:32px;
  height:32px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:var(--blue);
  box-shadow:0 3px 12px rgba(30,40,60,.06);
}

.masterButton svg{
  width:19px;
  height:19px;
}

.clientWrap{
  flex:0 0 auto;
  padding:0 12px 8px;
}

.clientTitle{
  padding:0 3px 5px;
  font-size:13px;
  font-weight:750;
}

.client{
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:17px;
  padding:9px;
  box-shadow:var(--shadow);
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field input{
  width:100%;
  height:36px;
  border:0;
  outline:0;
  border-radius:10px;
  background:var(--soft);
  padding:0 10px;
  font-size:13px;
  color:var(--text);
}

.field input:focus{
  background:#fff;
  box-shadow:inset 0 0 0 1.5px var(--blue);
}

.estimate{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:0 12px;
}

.estimateHead{
  flex:0 0 auto;
  padding:3px 3px 6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.estimateHead strong{
  font-size:14px;
}

.estimateHeadRight{
  display:flex;
  align-items:center;
  gap:8px;
}

.count{
  color:var(--muted);
  font-size:11px;
}

.clearEstimate{
  display:none;
  color:var(--red);
  font-size:11px;
  font-weight:650;
}

.viewToggle{
  height:28px;
  padding:0 9px;
  border-radius:9px;
  background:#fff;
  color:var(--blue);
  box-shadow:0 2px 9px rgba(30,40,60,.05);
  font-size:11px;
  font-weight:700;
}

.list{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding-bottom:8px;
}

.list::-webkit-scrollbar{
  display:none;
}

.empty{
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

.section{
  margin-bottom:9px;
}

.sectionTitle{
  position:sticky;
  top:0;
  z-index:2;
  background:rgba(244,246,250,.94);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--muted);
  font-size:10px;
  font-weight:750;
  letter-spacing:.5px;
  padding:6px 4px 5px;
}

.row{
  min-height:66px;
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:15px;
  box-shadow:0 3px 13px rgba(30,40,60,.05);
  padding:9px 9px 8px 11px;
  margin-bottom:6px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
}

.name{
  font-size:13px;
  line-height:1.25;
  font-weight:650;
  overflow-wrap:anywhere;
}

.controls{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:6px;
}

.qty{
  display:flex;
  align-items:center;
  height:28px;
  border-radius:9px;
  background:var(--soft);
  overflow:hidden;
}

.qty button{
  width:29px;
  height:28px;
  color:var(--blue);
  font-size:18px;
  line-height:1;
}

.qty b{
  min-width:24px;
  text-align:center;
  font-size:12px;
}

.price{
  min-height:28px;
  border-radius:9px;
  background:var(--soft);
  color:#555;
  padding:0 8px;
  font-size:10px;
}

.right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:space-between;
  align-self:stretch;
  min-width:82px;
}

.lineTotal{
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
}

.delete{
  width:27px;
  height:27px;
  border-radius:50%;
  background:#fff0ef;
  color:var(--red);
  font-size:18px;
}

.bottom{
  flex:0 0 auto;
  padding:7px 12px calc(8px + env(safe-area-inset-bottom));
}

.totalBar{
  height:44px;
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px;
  margin-bottom:7px;
  font-size:13px;
}

.totalBar strong{
  font-size:17px;
}

.masterSummary{
  display:none;
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:8px 13px;
  margin-bottom:7px;
}

.masterSummary.show{
  display:block;
}

.masterSummaryRow{
  min-height:23px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:11px;
  color:var(--muted);
}

.masterSummaryRow strong{
  color:var(--text);
  font-size:12px;
}

.masterSummaryRow.earnings strong{
  color:var(--blue);
}

.masterSummaryDiscount{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding-bottom:6px;
  margin-bottom:4px;
  border-bottom:1px solid var(--line);
}

.masterSummaryDiscount span{
  color:var(--muted);
  font-size:11px;
}

.discountOptions{
  display:flex;
  gap:4px;
}

.discountButton{
  min-width:34px;
  height:26px;
  padding:0 7px;
  border-radius:8px;
  background:var(--soft);
  color:#555;
  font-size:10px;
  font-weight:700;
}

.discountButton.active{
  background:var(--blue);
  color:#fff;
}

.masterSummaryRow.discount strong{
  color:var(--red);
}

.clientDiscountOption{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:28px;
  margin-top:5px;
  padding-top:6px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
}

.clientDiscountOption input{
  width:18px;
  height:18px;
  accent-color:var(--blue);
}

.clientSummary{
  display:none;
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:8px 13px;
  margin-bottom:7px;
}

.clientSummary.show{
  display:block;
}

.clientSummaryRow{
  min-height:24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:12px;
  color:var(--muted);
}

.clientSummaryRow strong{
  color:var(--text);
  font-size:13px;
}

.clientSummaryRow.discount strong{
  color:var(--red);
}

.clientMode .masterButton{
  display:none;
}

.clientMode .clearEstimate{
  display:none !important;
}

.clientMode .actions{
  display:none;
}

.clientMode .row{
  min-height:58px;
}

.clientMode .qty{
  background:transparent;
  height:auto;
}

.clientMode .qty button{
  display:none;
}

.clientMode .qty b{
  min-width:0;
  color:var(--muted);
  font-size:11px;
  font-weight:650;
}

.clientMode .price{
  background:transparent;
  padding:0;
  min-height:auto;
  pointer-events:none;
}

.clientMode .priceEditIcon,
.clientMode .delete{
  display:none;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.action{
  height:45px;
  border-radius:14px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:750;
  box-shadow:0 5px 14px rgba(0,122,255,.18);
}

.action:active{
  transform:scale(.98);
}

.procurementAction{
  grid-column:1/-1;
}

.consumablesPrice{
  display:inline-flex;
  align-items:center;
  min-height:28px;
  margin-top:7px;
  padding:0 9px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  font-size:11px;
  font-weight:700;
}

.clientMode .consumablesPrice{
  background:transparent;
  padding:0;
  pointer-events:none;
}

.procurementSheet{
  position:fixed;
  inset:0;
  z-index:45;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.34);
  backdrop-filter:blur(6px);
}

.procurementSheet.open{
  display:flex;
}

.procurementPanel{
  width:100%;
  max-width:560px;
  max-height:88dvh;
  margin:auto;
  background:#f6f7fa;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  padding:13px 12px calc(14px + env(safe-area-inset-bottom));
}

.procurementHead{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.procurementHead strong{
  font-size:18px;
}

.procurementStatus{
  flex:0 0 auto;
  margin-bottom:8px;
  padding:8px 10px;
  border-radius:11px;
  background:#fff0ef;
  color:var(--red);
  font-size:12px;
  font-weight:700;
}

.procurementStatus.reviewed{
  background:#edf8ef;
  color:#248a3d;
}

.procurementList{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}

.procurementList::-webkit-scrollbar{
  display:none;
}

.procurementRow{
  background:#fff;
  border-radius:14px;
  padding:10px 11px;
  margin:6px 0;
  box-shadow:0 2px 10px rgba(30,40,60,.04);
}

.procurementRowTop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.procurementName{
  min-width:0;
  font-size:13px;
  line-height:1.25;
  font-weight:700;
  overflow-wrap:anywhere;
}

.procurementNeed{
  flex:0 0 auto;
  color:var(--muted);
  font-size:11px;
  font-weight:650;
}

.procurementControls{
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.procurementControls span{
  color:var(--muted);
  font-size:11px;
  font-weight:650;
}

.procurementQty{
  height:31px;
  display:flex;
  align-items:center;
  border-radius:10px;
  background:#e9ebef;
  overflow:hidden;
}

.procurementQty button{
  width:31px;
  height:31px;
  color:var(--blue);
  font-size:18px;
}

.procurementQty b{
  min-width:36px;
  text-align:center;
  color:var(--blue);
  font-size:12px;
}

.procurementConfirm{
  flex:0 0 auto;
  width:100%;
  height:44px;
  margin-top:10px;
  border-radius:13px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:750;
}

.procurementEmpty{
  text-align:center;
  color:var(--muted);
  padding:35px 20px;
  font-size:14px;
}

.procurementHeadLeft{
  min-width:0;
  display:flex;
  align-items:center;
  gap:6px;
}

.procurementBack{
  width:32px;
  height:32px;
  border-radius:10px;
  color:var(--blue);
  font-size:24px;
  line-height:1;
}

.procurementSecondary,
.procurementSupplier{
  flex:0 0 auto;
  width:100%;
  height:42px;
  margin-top:8px;
  border-radius:13px;
  background:#e9ebef;
  color:var(--blue);
  font-size:13px;
  font-weight:750;
}

.procurementSupplier{
  background:#edf8ef;
  color:#248a3d;
}

.topupDivider{
  margin:14px 2px 7px;
  color:var(--muted);
  font-size:11px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.topupCardWrap{
  display:flex;
  align-items:center;
  gap:7px;
  margin:6px 0;
}

.topupCard{
  flex:1 1 auto;
  min-width:0;
  margin:0;
  padding:10px 11px;
  border-radius:14px;
  background:#fff;
  text-align:left;
  box-shadow:0 2px 10px rgba(30,40,60,.04);
}

.topupDelete{
  flex:0 0 42px;
  width:42px;
  height:42px;
  border-radius:13px;
  background:#fff;
  color:var(--red);
  font-size:20px;
  line-height:1;
  box-shadow:0 2px 10px rgba(30,40,60,.04);
}

.topupCardTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.topupCard strong{
  font-size:13px;
}

.topupCardMeta{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  font-weight:650;
}

.topupBadge{
  flex:0 0 auto;
  font-size:10px;
  font-weight:750;
  color:var(--red);
}

.topupBadge.reviewed{
  color:#248a3d;
}

.sheet{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.32);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.sheet.open{
  display:flex;
}

.panel{
  width:100%;
  max-width:560px;
  height:min(82dvh,720px);
  margin:auto;
  background:#f6f7fa;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}

.panelHead{
  flex:0 0 auto;
  padding:11px 14px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panelHead strong{
  font-size:18px;
}

.panelHeadRight{
  display:flex;
  align-items:center;
  gap:4px;
}

.catalogEditButton{
  height:32px;
  padding:0 9px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  font-size:12px;
  font-weight:700;
}

.catalogEditButton.active{
  background:var(--blue);
  color:#fff;
}

.close{
  width:32px;
  height:32px;
  font-size:28px;
  color:#777;
}

.search{
  flex:0 0 auto;
  width:calc(100% - 24px);
  margin:0 12px 8px;
  height:40px;
  border:0;
  outline:0;
  border-radius:12px;
  background:#e9ebef;
  padding:0 12px;
  font-size:14px;
}

.filters,
.subFilters{
  flex:0 0 auto;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  padding:0 12px 8px;
}

.filters::-webkit-scrollbar,
.subFilters::-webkit-scrollbar{
  display:none;
}

.filter,
.subFilter{
  flex:0 0 auto;
  height:30px;
  padding:0 10px;
  border-radius:9px;
  background:#e9ebef;
  color:#555;
  font-size:11px;
  font-weight:650;
}

.filter.active,
.subFilter.active{
  background:var(--blue);
  color:#fff;
}

.catalog{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:0 12px 15px;
}

.catalog::-webkit-scrollbar{
  display:none;
}

.catalogItem{
  min-height:59px;
  background:#fff;
  border-radius:14px;
  padding:9px 9px 9px 11px;
  margin:6px 0;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 2px 10px rgba(30,40,60,.04);
}

.catalogItem.added{
  box-shadow:inset 0 0 0 1.5px rgba(0,122,255,.25);
}

.catalogName{
  font-size:13px;
  line-height:1.25;
  font-weight:700;
  overflow-wrap:anywhere;
}

.catalogFullName{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
  font-weight:500;
  line-height:1.25;
}

.catalogMeta{
  color:var(--muted);
  font-size:10px;
  line-height:1.35;
  margin-top:3px;
}

.catalogControls{
  display:flex;
  align-items:center;
  gap:5px;
}

.catalogQtyButton{
  width:29px;
  height:29px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  font-size:18px;
}

.catalogQty{
  min-width:27px;
  text-align:center;
  color:var(--blue);
  font-size:12px;
  font-weight:750;
}

.addIcon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex:0 0 auto;
}
  .catalogManage{
  display:flex;
  gap:5px;
}

.manageEdit,
.manageDelete{
  width:31px;
  height:31px;
  border-radius:9px;
  font-size:15px;
}

.manageEdit{
  background:#e9ebef;
  color:var(--blue);
}

.manageDelete{
  background:#fff0ef;
  color:var(--red);
}

.catalog.manageMode .catalogControls,
.catalog.manageMode .addIcon{
  display:none;
}

.catalogAdd{
  width:100%;
  height:42px;
  margin:7px 0 12px;
  border-radius:13px;
  background:#fff;
  color:var(--blue);
  box-shadow:0 2px 10px rgba(30,40,60,.045);
  font-size:14px;
  font-weight:700;
}

.catalogClear{
  width:100%;
  height:42px;
  margin:0 0 12px;
  border-radius:13px;
  background:#fff;
  color:var(--red);
  box-shadow:0 2px 10px rgba(30,40,60,.045);
  font-size:14px;
  font-weight:700;
}

.noResults{
  text-align:center;
  color:var(--muted);
  padding:35px 20px;
  font-size:14px;
}

.editorSheet{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.34);
  backdrop-filter:blur(6px);
}

.editorSheet.open{
  display:flex;
}

.editorPanel{
  width:100%;
  max-width:560px;
  max-height:88dvh;
  margin:auto;
  background:#f6f7fa;
  border-radius:22px;
  overflow-y:auto;
  padding:13px 12px calc(14px + env(safe-area-inset-bottom));
}

.editorHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.editorHead strong{
  font-size:18px;
}

.editorFields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.editorField{
  min-width:0;
}

.editorField.full{
  grid-column:1/-1;
}

.editorField label{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin:0 3px 4px;
}

.editorField input,
.editorField select{
  width:100%;
  height:40px;
  border:0;
  outline:0;
  border-radius:11px;

function getSupplierOffers(
  item
){

  return Array.isArray(
    item && item.supplierOffers
  )
    ? item.supplierOffers
    : [];
}

function getSnapshotPriceUAH(
  snapshot
){

  if(
    !snapshot ||
    !Number.isFinite(
      Number(snapshot.priceEUR)
    ) ||
    !Number.isFinite(
      eurRate
    ) ||
    eurRate <= 0
  ){
    return null;
  }

  return (
    Number(snapshot.priceEUR) *
    eurRate
  );
}

function getCompleteSupplierOffers(
  item
){

  return getSupplierOffers(
    item
  ).filter(
    offer =>
      offer &&
      offer.retail &&
      Number.isFinite(
        Number(
          offer.retail.priceEUR
        )
      )
  );
}

function getDefaultSupplierOffer(
  item
){

  const offers =
    getCompleteSupplierOffers(
      item
    );

  if(
    offers.length === 1
  ){
    return offers[0];
  }

  return null;
}

function getMaterialCatalogPrice(
  item
){

  const offer =
    getDefaultSupplierOffer(
      item
    );

  if(offer){

    const retailPrice =
      getSnapshotPriceUAH(
        offer.retail
      );

    return Number.isFinite(
      retailPrice
    )
      ? retailPrice
      : 0;
  }

  const supplierOffers =
    getSupplierOffers(
      item
    );

  if(
    supplierOffers.length
  ){
    return 0;
  }

  const basePriceEUR =
    Number(
      item.basePriceEUR
    );

  if(
    !Number.isFinite(
      basePriceEUR
    ) ||
    basePriceEUR < 0 ||
    !Number.isFinite(
      eurRate
    ) ||
    eurRate <= 0
  ){
    return 0;
  }

  return (
    basePriceEUR *
    eurRate
  );
}

function chooseSupplierOffer(
  item
){

  const offers =
    getCompleteSupplierOffers(
      item
    );

  if(
    !offers.length
  ){
    return null;
  }

  if(
    offers.length === 1
  ){
    return offers[0];
  }

  const lines =
    offers.map(
      (offer,index) => {

        const retailPrice =
          getSnapshotPriceUAH(
            offer.retail
          );

        const purchasePrice =
          getSnapshotPriceUAH(
            offer.master
          );

        return (
          `${index + 1}. ${offer.supplierName || "Постачальник"}` +
          ` — роздріб ${
            Number.isFinite(retailPrice)
              ? money(retailPrice)
              : "не задано"
          }` +
          `, майстра ${
            Number.isFinite(purchasePrice)
              ? money(purchasePrice)
              : "не задано"
          }`
        );
      }
    );

  const value =
    prompt(
      "Оберіть постачальника:\n\n" +
      lines.join("\n") +
      "\n\nВведіть номер:",
      "1"
    );

  if(
    value === null
  ){
    return null;
  }

  const index =
    Number(value) - 1;

  if(
    !Number.isInteger(index) ||
    index < 0 ||
    index >= offers.length
  ){

    alert(
      "Оберіть коректний номер постачальника."
    );

    return null;
  }

  return offers[index];
}

function normalizeText(
  value
){

  return String(
    value || ""
  )
    .trim()
    .toLowerCase()
    .replace(
      /\s+/g,
      " "
    );
}

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

function money(
  value
){

  return new Intl.NumberFormat(
    "uk-UA"
  )
    .format(
      Math.round(value)
    ) +
    " грн";
}

function procurementSecondaryAction(){

function createTopup(){

  const nextNumber =
    procurementTopups.reduce(
      (
        max,
        topup
      ) =>
        Math.max(
          max,
          Number(topup.number) || 0
        ),
      0
    ) + 1;

  const topup = {
    id:
      "topup-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2,8),
    number:nextNumber,
    createdAt:
      new Date().toISOString(),
    reviewed:false,
    items:[]
  };

  procurementTopups.push(
    topup
  );

  saveProcurementTopups();

  activeTopupId =
    topup.id;

  renderProcurement();
}

function deleteTopup(
  id
){

  const topup =
    procurementTopups.find(
      item =>
        item.id === id
    );

  if(!topup){
    return;
  }

  const number =
    Number(topup.number) || 1;

  const message =
    topup.reviewed
      ? `Добір №${number} уже перевірено. Видалити його разом з усіма позиціями?`
      : `Видалити Добір №${number} разом з усіма позиціями?`;

  if(!confirm(message)){
    return;
  }

  procurementTopups =
    procurementTopups.filter(
      item =>
        item.id !== id
    );

  if(activeTopupId === id){
    activeTopupId = null;
  }

  if(supplierTopupId === id){
    supplierTopupId = null;
  }

  saveProcurementTopups();
  renderProcurement();
}

function openTopup(
  id
){

  if(

  activeTopupId =

}

    "procurementBack"
  ).style.display =
    "block";

  status.textContent =
    topup.reviewed
      ? "Добір перевірено"
      : "Потрібна перевірка";

  status.classList.toggle(
    "reviewed",
    !!topup.reviewed
  );

  secondaryButton.textContent =
    "＋ Матеріал";

  secondaryButton.style.display =
    "block";

  confirmButton.textContent =
    "Добір перевірено";

  confirmButton.onclick =
    confirmActiveTopup;

  confirmButton.style.display =
    Array.isArray(topup.items) &&
    topup.items.length
      ? "block"
      : "none";

  supplierButton.style.display =
    topup.reviewed &&
    Array.isArray(topup.items) &&
    topup.items.some(
      item =>
        Number(item.qty) > 0
    )
      ? "block"
      : "none";

  const items =
    Array.isArray(topup.items)
      ? topup.items
      : [];

  if(
    !items.length
  ){

    list.innerHTML = `
      <div class="procurementEmpty">
        У цьому доборі ще немає матеріалів.
      </div>
    `;

    return;
  }

  list.innerHTML =
    items.map(
      (
        item,
        index
      ) => `
        <div class="procurementRow">

          <div class="procurementRowTop">
            <div class="procurementName">
              ${escapeHtml(item.name)}
            </div>

            <div class="procurementNeed">
              ${escapeHtml(item.unit)}
            </div>
          </div>

          <div class="procurementControls">
            <span>Кількість</span>

            <div class="procurementQty">
              <button
                onclick="changeTopupQty(${index},-1)"
              >
                −
              </button>

              <b>
                ${Math.max(0,Number(item.qty) || 0)}
              </b>

              <button
                onclick="changeTopupQty(${index},1)"
              >
                +
              </button>
            </div>
          </div>

        </div>
      `
    ).join("");
}

function changeProcurementQty(
  index,
  delta
){

  const item =
    estimate[index];

  if(
    !item ||
    item.type !==
      "material"
  ){
    return;
  }

  const maxQty =
    Math.max(
      0,
      Number(item.qty) || 0
    );

  const currentQty =
    Math.min(
      maxQty,
      getProcurementQty(item)
    );

  item.procurementQty =
    Math.max(
      0,
      Math.min(
        maxQty,
        currentQty + delta
      )
    );

  invalidateProcurement();
  save();
  renderProcurement();
  renderEstimate();
}

function changeTopupQty(
  index,
  delta
){

  const topup =
    getActiveTopup();

  if(
    !topup ||
    !Array.isArray(topup.items) ||
    !topup.items[index]
  ){
    return;
  }

  const item =
    topup.items[index];

  item.qty =
    Math.max(
      0,
      (Number(item.qty) || 0) +
      delta
    );

  if(
    item.qty <= 0
  ){
    topup.items.splice(
      index,
      1
    );
  }

  topup.reviewed =
    false;

  saveProcurementTopups();
  renderProcurement();
}

function confirmProcurement(){

  const materials =
    estimate.filter(
      item =>
        item.type ===
          "material"
    );

  if(
    !materials.length
  ){
    return;
  }

  materials.forEach(
    item => {

      const maxQty =
        Math.max(
          0,
          Number(item.qty) || 0
        );

      item.procurementQty =
        Math.max(
          0,
          Math.min(
            maxQty,
            getProcurementQty(item)
          )
        );
    }
  );

  procurementReviewed =
    true;

  localStorage.setItem(
    PROCUREMENT_REVIEWED_KEY,
    "1"
  );

  save();
  renderProcurement();
  renderEstimate();
}

function confirmActiveTopup(){

  const topup =
    getActiveTopup();

  if(
    !topup ||
    !Array.isArray(topup.items) ||
    !topup.items.length
  ){
    return;
  }

  topup.reviewed =
    true;

  saveProcurementTopups();
  renderProcurement();
}

function openCatalogForTopup(){

  const topup =
    getActiveTopup();

  if(!topup){
    return;
  }

  catalogTarget =

  document.getElementById(
    "procurementSheet"

  );

  );
}

function addItemToTopup(
  id
){

  const topup =
    getActiveTopup();

  const product =
    catalog.find(
      item =>
        item.id === id &&
        item.type ===
          "material"
    );

  if(
    !topup ||
    !product
  ){
    return;
  }

  if(
    !Number.isFinite(eurRate) ||
    eurRate <= 0
  ){
    alert(
      "Спочатку вкажіть курс EUR."
    );
    return;
  }

  const existing =
    topup.items.find(
      item =>
        item.id === id
    );

  if(existing){

    existing.qty =
      (Number(existing.qty) || 0) + 1;

  }else{

    let materialPrice = 0;
    let selectedOffer = null;

    const supplierOffers =
      getSupplierOffers(
        product
      );

    if(
      supplierOffers.length
    ){

      selectedOffer =
        chooseSupplierOffer(
          product
        );

      if(
        !selectedOffer
      ){
        alert(
          "Для цієї позиції немає доступної роздрібної ціни постачальника."
        );
        return;
      }

      materialPrice =
        getSnapshotPriceUAH(
          selectedOffer.retail
        );

      if(
        !Number.isFinite(materialPrice)
      ){
        alert(
          "Не вдалося визначити роздрібну ціну матеріалу."
        );
        return;
      }

    }else{

      materialPrice =
        getMaterialCatalogPrice(
          product
        );
    }

    const topupItem = {
      id:product.id,
      type:"material",
      name:
        product.estimateName ||
        product.name,
      fullName:
        product.name ||
        product.estimateName ||
        "",
      article:
        product.article ||
        "",
      category:
        product.category ||
        "other",
      unit:
        product.unit ||
        "",
      qty:1,
      price:materialPrice,
      retailPrice:materialPrice,
      priceSnapshotAt:
        new Date().toISOString(),
      eurRate:eurRate,
      supplierId:"",
      supplierName:
        product.supplierName ||
        "",
      supplierImportedAt:"",
      purchasePrice:null
    };

    if(selectedOffer){

      topupItem.supplierId =
        selectedOffer.supplierId ||
        "";

      topupItem.supplierName =
        selectedOffer.supplierName ||
        topupItem.supplierName;

      topupItem.supplierImportedAt =
        selectedOffer.updatedAt ||
        selectedOffer.retail?.importedAt ||
        selectedOffer.master?.importedAt ||
        "";

      const purchasePrice =
        getSnapshotPriceUAH(
          selectedOffer.master
        );

      topupItem.purchasePrice =
        Number.isFinite(purchasePrice)
          ? purchasePrice
          : null;
    }

    topup.items.push(
      topupItem
    );
  }

  topup.reviewed =
    false;

  saveProcurementTopups();
  closeCatalog();
}

function topupCatalogChangeQty(
  id,
  delta
){

  const topup =
    getActiveTopup();

  if(
    !topup ||
    !Array.isArray(topup.items)
  ){
    return;
  }

  const index =
    topup.items.findIndex(
      item =>
        item.id === id
    );

  if(index === -1){

    if(delta > 0){
      addItemToTopup(id);
    }

    return;
  }

  topup.items[index].qty +=
    delta;

  if(
    topup.items[index].qty <= 0
  ){
    topup.items.splice(
      index,
      1
    );
  }

  topup.reviewed =
    false;

  saveProcurementTopups();
  renderCatalog();
}

/* =========================
   ESTIMATE
========================= */
  function renderEstimate(){

  const list =
    document.getElementById(
      "list"
    );

  const clearButton =
    document.getElementById(
      "clearEstimate"
    );

  const supplierTopup =
    viewMode === "supplier"
      ? getSupplierTopup()
      : null;

  if(
    !estimate.length &&
    !supplierTopup
  ){

    list.innerHTML = `
      <div class="empty">
        Кошторис порожній.<br>
        Додайте роботу або матеріал.
      </div>
    `;

    clearButton.style.display =
      "none";

  }else{

    let html = "";

    const rough =
      estimate.filter(
        item =>
          item.type === "work" &&
          item.stage === "rough"
      );

    const finish =
      estimate.filter(
        item =>
          item.type === "work" &&
          item.stage === "finish"
      );

    const materials =
      supplierTopup
        ? (
            Array.isArray(supplierTopup.items)
              ? supplierTopup.items.filter(
                  item =>
                    Number(item.qty) > 0
                )
              : []
          )
        : estimate.filter(
            item =>
              item.type === "material" &&
              (
                viewMode !==
                  "supplier" ||
                getProcurementQty(item) > 0
              )
          );

    const consumables =
      estimate.filter(
        item =>
          item.type ===
            "consumables"
      );

    if(
      viewMode !==
        "supplier" &&
      rough.length
    ){

      html += section(
        "ЧОРНОВИЙ МОНТАЖ",
        rough
      );
    }

    if(
      viewMode !==
        "supplier" &&
      finish.length
    ){

      html += section(
        "ЧИСТОВИЙ МОНТАЖ",
        finish
      );
    }

    const visibleMaterials =
      viewMode ===
        "supplier"
        ? materials
        : materials.concat(
            consumables
          );

    if(
      visibleMaterials.length
    ){

      html += section(
        "МАТЕРІАЛИ",
        visibleMaterials
      );
    }

    list.innerHTML =
      html;

    clearButton.style.display =
      "block";
  }

  const workTotal =
    estimate
      .filter(
        item =>
          item.type ===
          "work"
      )
      .reduce(
        (
          sum,
          item
        ) =>
          sum +
          (
            Number(
              item.price
            ) || 0
          ) *
          (
            Number(
              item.qty
            ) || 0
          ),
        0
      );

  const materialItems =
    supplierTopup
      ? (
          Array.isArray(supplierTopup.items)
            ? supplierTopup.items
            : []
        )
      : estimate.filter(
          item =>
            item.type ===
            "material"
        );

  const materialsRetailTotal =
    materialItems.reduce(
      (
        sum,
        item
      ) =>
        sum +
        (
          Number(
            item.price
          ) || 0
        ) *
        (
          Number(
            item.qty
          ) || 0
        ),
      0
    );

  const materialsDiscountTotal =
    materialsRetailTotal *
    materialDiscountPercent /
    100;

  const materialsClientTotal =
    materialsRetailTotal -
    materialsDiscountTotal;

  const consumablesItems =
    estimate.filter(
      item =>
        item.type ===
          "consumables"
    );

  const consumablesTotal =
    consumablesItems.reduce(
      (
        sum,
        item
      ) =>
        sum +
        (
          Number(item.price) || 0
        ),
      0
    );

  const supplierMaterialsTotal =
    materialItems.reduce(
      (
        sum,
        item
      ) => {

        const factor =
          showClientDiscount
            ? 1
            : (
                1 -
                materialDiscountPercent /
                100
              );

        return sum +
          (
            Number(item.price) || 0
          ) *
          factor *
          (
            supplierTopup
              ? (Number(item.qty) || 0)
              : getProcurementQty(item)
          );
      },
      0
    );

  const total =
    viewMode ===
      "supplier"
      ? supplierMaterialsTotal
      : (
          workTotal +
          materialsClientTotal +
          consumablesTotal
        );

  document.getElementById(
    "grand"
  ).textContent =
    money(
      total
    );

  const hasCompletePurchaseData =
    materialItems.length > 0 &&
    materialItems.every(
      item =>
        Number.isFinite(
          Number(
            item.purchasePrice
          )
        ) &&
        Number(
          item.purchasePrice
        ) >= 0
    );

  const materialsPurchaseTotal =
    hasCompletePurchaseData
      ? materialItems.reduce(
          (
            sum,
            item
          ) =>
            sum +
            Number(
              item.purchasePrice
            ) *
            (
              Number(
                item.qty
              ) || 0
            ),
          0
        )
      : null;

  const materialsEarningsTotal =
    hasCompletePurchaseData
      ? materialsClientTotal -
        materialsPurchaseTotal
      : null;

  const masterSummary =
    document.getElementById(
      "masterSummary"
    );

  masterSummary.classList.toggle(
    "show",
    viewMode ===
      "master" &&
    materialItems.length > 0
  );

  document.getElementById(
    "materialsRetailTotal"
  ).textContent =
    money(
      materialsRetailTotal
    );

  const discountRow =
    document.getElementById(
      "materialsDiscountRow"
    );

  discountRow.style.display =
    materialDiscountPercent > 0
      ? "flex"
      : "none";

  document.getElementById(
    "materialsDiscountLabel"
  ).textContent =
    `Знижка −${materialDiscountPercent.toLocaleString(
      "uk-UA",
      {
        maximumFractionDigits:2
      }
    )}%`;

  document.getElementById(
    "materialsDiscountTotal"
  ).textContent =
    "−" +
    money(
      materialsDiscountTotal
    );

  document.getElementById(
    "materialsClientTotal"
  ).textContent =
    money(
      materialsClientTotal
    );

  document.getElementById(
    "materialsPurchaseTotal"
  ).textContent =
    hasCompletePurchaseData
      ? money(
          materialsPurchaseTotal
        )
      : "—";

  document.getElementById(
    "materialsEarningsTotal"
  ).textContent =
    hasCompletePurchaseData
      ? money(
          materialsEarningsTotal
        )
      : "—";

  renderMaterialDiscountButtons();

  const showClientDiscountInput =
    document.getElementById(
      "showClientDiscount"
    );

  if(
    showClientDiscountInput
  ){

    showClientDiscountInput.checked =
      showClientDiscount;
  }

  const clientSummary =
    document.getElementById(
      "clientSummary"
    );

  clientSummary.classList.toggle(
    "show",
    (
      viewMode ===
        "client" ||
      viewMode ===
        "supplier"
    ) &&
    estimate.length > 0
  );

  const clientWorkRow =
    document.getElementById(
      "clientWorkRow"
    );

  clientWorkRow.style.display =
    viewMode !==
      "supplier" &&
    workTotal > 0
      ? "flex"
      : "none";

  document.getElementById(
    "clientWorkTotal"
  ).textContent =
    money(
      workTotal
    );

  const showDiscountDetails =
    showClientDiscount &&
    materialDiscountPercent > 0 &&
    materialItems.length > 0;

  document.getElementById(
    "clientRetailRow"
  ).style.display =
    showDiscountDetails
      ? "flex"
      : "none";

  document.getElementById(
    "clientDiscountRow"
  ).style.display =
    showDiscountDetails
      ? "flex"
      : "none";

  document.getElementById(
    "clientRetailTotal"
  ).textContent =
    money(
      materialsRetailTotal +
      (
        viewMode ===
          "supplier"
          ? 0
          : consumablesTotal
      )
    );

  document.getElementById(
    "clientDiscountLabel"
  ).textContent =
    `Знижка −${materialDiscountPercent.toLocaleString(
      "uk-UA",
      {
        maximumFractionDigits:2
      }
    )}%`;

  document.getElementById(
    "clientDiscountTotal"
  ).textContent =
    "−" +
    money(
      materialsDiscountTotal
    );

  document.getElementById(
    "clientMaterialsRow"
  ).style.display =
    (
      materialItems.length > 0 ||
      (
        viewMode !==
          "supplier" &&
        consumablesItems.length > 0
      )
    )
      ? "flex"
      : "none";

  document.getElementById(
    "clientMaterialsTotal"
  ).textContent =
    money(
      viewMode ===
        "supplier"
        ? supplierMaterialsTotal
        : (
            materialsClientTotal +
            consumablesTotal
          )
    );

  const clearEstimateButton =
    document.getElementById(
      "clearEstimate"
    );

  if(
    viewMode !==
      "master"
  ){

    clearEstimateButton.style.display =
      "none";
  }

  const visibleItemCount =
    viewMode ===
      "supplier"
      ? materialItems.filter(
          item =>
            (
              supplierTopup
                ? Number(item.qty)
                : getProcurementQty(item)
            ) > 0
        ).length
      : estimate.length;

  document.getElementById(
    "count"
  ).textContent =
    visibleItemCount +
    " позицій";
}

function section(
  title,
  items
){

  return `
    <div class="section">

      <div class="sectionTitle">
        ${title}
      </div>

      ${
        items
          .map(
            renderRow
          )
          .join("")
      }

    </div>
  `;
}

function renderRow(
  item
){

  const index =
    estimate.indexOf(
      item
    );

  if(
    item.type ===
      "consumables"
  ){

    return `
      <div class="row">

        <div>
          <div class="name">
            ${escapeHtml(item.name)}
          </div>

          <button
            class="consumablesPrice"
            onclick="editPrice(${index})"
          >
            ≈ ${money(Number(item.price) || 0)}
            <span class="priceEditIcon">✎</span>
          </button>
        </div>

        <div class="right">
          <div class="lineTotal">
            ≈ ${money(Number(item.price) || 0)}
          </div>
        </div>

      </div>
    `;
  }

  const isMaterial =
    item.type ===
    "material";

  const externalView =
    viewMode ===
      "client" ||
    viewMode ===
      "supplier";

  const clientFactor =
    (
      externalView &&
      isMaterial &&
      !showClientDiscount
    )
      ? (
          1 -
          materialDiscountPercent /
          100
        )
      : 1;

  const displayPrice =
    (
      Number(
        item.price
      ) || 0
    ) *
    clientFactor;

  const displayQty =
    viewMode ===
      "supplier" &&
    isMaterial
      ? (
          supplierTopupId
            ? (Number(item.qty) || 0)
            : getProcurementQty(item)
        )
      : (
          Number(item.qty) || 0
        );

  const displayLineTotal =
    displayPrice *
    displayQty;

  const displayName =
    viewMode ===
      "supplier" &&
    isMaterial
      ? getSupplierViewName(
          item
        )
      : item.name;

  const supplierArticle =
    viewMode ===
      "supplier" &&
    isMaterial
      ? getSupplierViewArticle(
          item
        )
      : "";

  return `
    <div class="row">

      <div>

        <div class="name">
          ${escapeHtml(displayName)}
        </div>

        ${
          supplierArticle
            ? `
              <div
                style="
                  margin-top:4px;
                  color:var(--muted);
                  font-size:11px;
                  font-weight:650;
                "
              >
                Артикул:
                ${escapeHtml(supplierArticle)}
              </div>
            `
            : ""
        }

        <div class="controls">

          <div class="qty">

            <button
              onclick="changeQty(${index},-1)"
            >
              −
            </button>

            <b>
              ${
                externalView
                  ? `×${displayQty}`
                  : item.qty
              }
            </b>

            <button
              onclick="changeQty(${index},1)"
            >
              +
            </button>

          </div>

          <button
            class="price"
            onclick="editPrice(${index})"
          >
            ${money(displayPrice)}
            /
            ${escapeHtml(item.unit)}
            <span class="priceEditIcon">✎</span>
          </button>

        </div>

      </div>

      <div class="right">

        <div class="lineTotal">
          ${money(displayLineTotal)}
        </div>

        <button
          class="delete"
          onclick="removeItem(${index})"
        >
          ×
        </button>

      </div>

    </div>
  `;
}

function changeQty(
  index,
  delta
){

  const item =
    estimate[index];

  if(!item){
    return;
  }

  const oldQty =
    Number(item.qty) || 0;

  const oldProcurementQty =
    item.type ===
      "material"
      ? getProcurementQty(item)
      : 0;

  item.qty =
    Math.max(
      1,
      item.qty +
      delta
    );

  if(
    item.type ===
      "material"
  ){

    if(
      oldProcurementQty ===
        oldQty
    ){
      item.procurementQty =
        item.qty;
    }else{
      item.procurementQty =
        Math.min(
          item.qty,
          oldProcurementQty
        );
    }

    invalidateProcurement();
  }

  save();
  renderEstimate();
}

function removeItem(
  index
){

  const item =
    estimate[index];

  if(
    !item ||
    item.type ===
      "consumables"
  ){
    return;
  }

  const wasMaterial =
    item.type ===
      "material";

  estimate.splice(
    index,
    1
  );

  if(wasMaterial){
    invalidateProcurement();
  }

  save();
  renderEstimate();
}

function editPrice(
  index
){

  const value =
    prompt(
      estimate[index].type ===
        "consumables"
        ? "Умовна вартість, грн:"
        : "Ціна за одиницю, грн:",
      estimate[index].price
    );

  if(
    value === null
  ){
    return;
  }

  const price =
    Number(
      String(value)
        .replace(
          ",",
          "."
        )
    );

  if(
    Number.isFinite(
      price
    ) &&
    price >= 0
  ){

    estimate[index].price =
      price;

    save();
    renderEstimate();
  }
}

function clearEstimate(){

  if(
    !estimate.length
  ){
    return;
  }

  if(
    !confirm(
      "Очистити весь кошторис?"
    )
  ){
    return;
  }

  estimate = [
    createConsumablesItem()
  ];

  procurementReviewed =
    false;

  localStorage.setItem(
    PROCUREMENT_REVIEWED_KEY,
    "0"
  );

  materialDiscountPercent =
    0;

  localStorage.setItem(
    MATERIAL_DISCOUNT_KEY,
    "0"
  );

  save();
  renderEstimate();
}

function getMaterialItemsForClassification(){

  return catalog.filter(
    item => {

      if(
        item.type !==
        "material"
      ){
        return false;
      }

      if(
        catalogFilter !== "all" &&
        item.category !==
        catalogFilter
      ){
        return false;
      }

      return true;
    }
  );
}

function getBrands(){

  const values =
    new Map();

  getMaterialItemsForClassification()
    .forEach(
      item => {

        const value =
          String(
            item.manufacturer ||
            ""
          ).trim();

        if(
          value
        ){

          values.set(
            normalizeText(
              value
            ),
            value
          );
        }
      }
    );

  return Array.from(
    values.values()
  ).sort(
    (
      a,
      b
    ) =>
      a.localeCompare(
        b,
        "uk"
      )
  );
}

function renderBrandFilters(){

function renderCatalog(){

  const query =
    normalizeText(
      document.getElementById(
        "search"
      ).value
    );

  const items =
    catalog.filter(
      item => {

        if(
          item.type !==
          catalogMode
        ){
          return false;
        }

        if(
          query
        ){

          const searchable = [
            item.name,
            item.estimateName,
            item.article,
            item.manufacturer,
            item.system
          ]
          .map(
            normalizeText
          )
          .join(" ");

          if(
            !searchable.includes(
              query
            )
          ){
            return false;
          }
        }

        if(
          catalogFilter !==
          "all"
        ){

          if(
            item.stage !==
              catalogFilter &&
            item.category !==
              catalogFilter
          ){
            return false;
          }
        }

        if(
          catalogMode ===
            "material" &&
          catalogBrandFilter !==
            "all"
        ){

          if(
            normalizeText(
              item.manufacturer
            ) !==
            normalizeText(
              catalogBrandFilter
            )
          ){
            return false;
          }
        }

        if(
          catalogMode ===
            "material" &&
          catalogSystemFilter !==
            "all"
        ){

          if(
            normalizeText(
              item.system
            ) !==
            normalizeText(
              catalogSystemFilter
            )
          ){
            return false;
          }
        }

    document.getElementById(

function renderCatalogItem(
  item
){

  const catalogPrice =
    item.type ===
      "material"
      ? getMaterialCatalogPrice(
          item
        )
      : (
          Number(
            item.price
          ) || 0
        );

  const activeTopup =
    catalogTarget ===
      "topup"
      ? getActiveTopup()
      : null;

  const existing =
    activeTopup
      ? (
          Array.isArray(activeTopup.items)
            ? activeTopup.items.find(
                topupItem =>
                  topupItem.id ===
                  item.id
              )
            : null
        )
      : estimate.find(
          estimateItem =>
            estimateItem.id ===
            item.id
        );

  const qty =
    existing
      ? existing.qty
      : 0;

  const meta = [];

  if(
    item.type ===
    "material"
  ){

    if(
      item.manufacturer
    ){
      meta.push(
        item.manufacturer
      );
    }

    if(
      item.system
    ){
      meta.push(
        item.system
      );
    }

    if(
      item.article
    ){
      meta.push(
        item.article
      );
    }
  }

  const encodedId =
    encodeURIComponent(
      item.id
    );

  const cardAction =
    catalogManageMode
      ? ""
      : (
          catalogTarget ===
            "topup"
            ? `onclick="addItemToTopup(decodeURIComponent('${encodedId}'))"`
            : `onclick="addItem(decodeURIComponent('${encodedId}'))"`
        );

  return `

    <div
      class="catalogItem ${
        qty > 0
          ? "added"
          : ""
      }"
    >

      <div
        style="flex:1;min-width:0"
        ${cardAction}
      >

        <div class="catalogName">
          ${
            escapeHtml(
              item.type ===
                "material"
                ? (
                    item.estimateName ||
                    item.name
                  )
                : item.name
            )
          }
        </div>

        ${
          item.type ===
            "material" &&
          item.estimateName &&
          normalizeText(
            item.estimateName
          ) !==
          normalizeText(
            item.name
          )
            ? `
              <div class="catalogFullName">
                ${escapeHtml(item.name)}
              </div>
            `
            : ""
        }

        <div class="catalogMeta">

          ${
            item.type === "material" &&
            getCompleteSupplierOffers(item).length > 1
              ? "кілька постачальників"
              : catalogPrice
              ? money(
                  catalogPrice
                )
              : (
                  item.type === "material" &&
                  getSupplierOffers(item).length
                    ? "роздрібна ціна не задана"
                    : "ціна не задана"
                )
          }

          ·
          ${escapeHtml(item.unit)}

          ${
            meta.length
              ? " · " +
                escapeHtml(
                  meta.join(
                    " · "
                  )
                )
              : ""
          }

        </div>

      </div>

      ${
        catalogManageMode

          ? `

            <div class="catalogManage">

              <button
                class="manageEdit"
                onclick="openCatalogEditor(decodeURIComponent('${encodedId}'))"
              >
                ✎
              </button>

              <button
                class="manageDelete"
                onclick="deleteCatalogItem(decodeURIComponent('${encodedId}'))"
              >
                ×
              </button>

            </div>

          `

          : qty > 0

          ? `

            <div class="catalogControls">

              <button
                class="catalogQtyButton"
                onclick="${catalogTarget === "topup" ? "topupCatalogChangeQty" : "catalogChangeQty"}(decodeURIComponent('${encodedId}'),-1)"
              >
                −
              </button>

              <div class="catalogQty">
                ×${qty}
              </div>

              <button
                class="catalogQtyButton"
                onclick="${catalogTarget === "topup" ? "topupCatalogChangeQty" : "catalogChangeQty"}(decodeURIComponent('${encodedId}'),1)"
              >
                +
              </button>

            </div>

          `

          : `

            <button
              class="addIcon"
              onclick="${catalogTarget === "topup" ? `addItemToTopup(decodeURIComponent('${encodedId}'))` : `addItem(decodeURIComponent('${encodedId}'))`}"
              aria-label="Додати"
            >
              ＋
            </button>

          `
      }

    </div>

  `;
}

function addItem(
  id
){

  const product =
    catalog.find(
      item =>
        item.id === id
    );

  if(
    !product
  ){
    return;
  }

  if(
    product.type ===
      "material" &&
    (
      !Number.isFinite(
        eurRate
      ) ||
      eurRate <= 0
    )
  ){

    alert(
      "Спочатку вкажіть курс EUR."
    );

    return;
  }

  const existing =
    estimate.find(
      item =>
        item.id === id
    );

  if(
    existing
  ){

    const oldQty =
      Number(existing.qty) || 0;

    const oldProcurementQty =
      getProcurementQty(
        existing
      );

    existing.qty++;

    if(
      existing.type ===
        "material"
    ){

      if(
        oldProcurementQty ===
          oldQty
      ){
        existing.procurementQty =
          existing.qty;
      }

      invalidateProcurement();
    }

  }else{

    let materialPrice = 0;
    let selectedOffer = null;

    if(
      product.type ===
      "material"
    ){

      const supplierOffers =
        getSupplierOffers(
          product
        );

      if(
        supplierOffers.length
      ){

        selectedOffer =
          chooseSupplierOffer(
            product
          );

        if(
          !selectedOffer
        ){

          alert(
            "Для цієї позиції немає доступної роздрібної ціни постачальника."
          );

          return;
        }

        materialPrice =
          getSnapshotPriceUAH(
            selectedOffer.retail
          );

        if(
          !Number.isFinite(
            materialPrice
          )
        ){

          alert(
            "Не вдалося визначити роздрібну ціну матеріалу."
          );

          return;
        }

      }else{

        materialPrice =
          getMaterialCatalogPrice(
            product
          );
      }
    }

    const estimateItem = {

      id:
        product.id,

      name:
        product.estimateName ||
        product.name,

      type:
        product.type,

      stage:
        product.stage,

      category:
        product.category,

      price:
        product.type ===
          "material"
          ? materialPrice
          : (
              Number(
                product.price
              ) || 0
            ),

      unit:
        product.unit,

      qty:1
    };

    if(
      product.type ===
        "material"
    ){
      estimateItem.procurementQty =
        1;
    }

    if(
      product.type ===
      "material"
    ){

      estimateItem.manufacturer =
        product.manufacturer ||
        "";

      estimateItem.system =
        product.system ||
        "";

      estimateItem.article =
        product.article ||
        "";

      estimateItem.fullName =
        product.name ||
        product.estimateName ||
        "";

      estimateItem.retailPrice =
        materialPrice;

      estimateItem.priceSnapshotAt =
        new Date().toISOString();

      estimateItem.eurRate =
        eurRate;

      if(selectedOffer){

        estimateItem.supplierId =
          selectedOffer.supplierId ||
          "";

        estimateItem.supplierName =
          selectedOffer.supplierName ||
          "";

        estimateItem.supplierImportedAt =
          selectedOffer.updatedAt ||
          selectedOffer.retail?.importedAt ||
          selectedOffer.master?.importedAt ||
          "";

        const purchasePrice =
          getSnapshotPriceUAH(
            selectedOffer.master
          );

        estimateItem.purchasePrice =
          Number.isFinite(
            purchasePrice
          )
            ? purchasePrice
            : null;
      }else{

        estimateItem.supplierId =
          "";

        estimateItem.supplierName =
          "";

        estimateItem.supplierImportedAt =
          "";

        estimateItem.purchasePrice =
          null;
      }
    }

    estimate.push(
      estimateItem
    );

    if(
      estimateItem.type ===
        "material"
    ){
      invalidateProcurement();
    }
  }

  save();

  renderEstimate();
  renderCatalog();
}

function catalogChangeQty(
  id,
  delta
){

  const index =
    estimate.findIndex(
      item =>
        item.id === id
    );

  if(
    index === -1
  ){

    if(
      delta > 0
    ){
      addItem(
        id
      );
    }

    return;
  }

  estimate[index].qty +=
    delta;

  if(
    estimate[index].qty <=
    0
  ){

    estimate.splice(
      index,
      1
    );
  }

  save();

  renderEstimate();
  renderCatalog();
}

function saveCatalogItem(){

  const name =
    document.getElementById(
      "editorName"
    ).value.trim();

  const estimateName =
    document.getElementById(
      "editorEstimateName"
    ).value.trim();

  const priceRaw =
    document.getElementById(
      "editorPrice"
    ).value.trim();

  const price =
    Number(
      priceRaw
    );

  const unit =
    document.getElementById(
      "editorUnit"
    ).value.trim();

  const type =
    document.getElementById(
      "editorType"
    ).value;

  const group =
    document.getElementById(
      "editorGroup"
    ).value;

  const manufacturer =
    document.getElementById(
      "editorManufacturer"
    ).value.trim();

  const system =
    document.getElementById(
      "editorSystem"
    ).value.trim();

  const article =
    document.getElementById(
      "editorArticle"
    ).value.trim();

  const supplierName =
    document.getElementById(
      "editorSupplier"
    ).value.trim();

  if(
    type === "work" &&
    !name
  ){

    alert(
      "Вкажіть назву."
    );

    return;
  }

  if(
    !estimateName
  ){

    alert(
      "Вкажіть назву для кошторису."
    );

    return;
  }

  if(
    (
      type === "material" &&
      !priceRaw
    ) ||
    !Number.isFinite(
      price
    ) ||
    price < 0
  ){

    alert(
      type === "material"
        ? "Вкажіть коректну базову ціну в EUR."
        : "Вкажіть коректну ціну."
    );

    return;
  }

  if(
    !unit
  ){

    alert(
      "Вкажіть одиницю."
    );

    return;
  }

  if(
    type === "material" &&
    !group
  ){

    alert(
      "Вкажіть категорію."
    );

    return;
  }

  const materialFullName =
    name ||
    estimateName;

  if(
    editingCatalogId
  ){

    const item =
      catalog.find(
        x =>
          x.id ===
          editingCatalogId
      );

    if(
      !item
    ){
      return;
    }

    const wasMaterial =
      item.type ===
      "material";

    if(
      !wasMaterial
    ){

      item.name =
        name;
    }

    item.estimateName =
      estimateName;

    item.unit =
      unit;

    item.type =
      type;

    if(
      type === "work"
    ){

      item.price =
        price;

      item.stage =
        group;

      delete item.category;
      delete item.manufacturer;
      delete item.system;
      delete item.article;

    }else{

      item.basePriceEUR =
        price;

      delete item.price;

      if(
        !wasMaterial
      ){
        item.name =
          materialFullName;
      }

      item.category =
        group;

      delete item.stage;

      item.manufacturer =
        manufacturer;

      item.system =
        system;

      item.supplierName =
        supplierName;

      if(
        !wasMaterial
      ){

        item.article =
          article;
      }
    }

  }else{

    const item = {

      id:
        "custom-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2,8),

      name:
        type === "material"
          ? materialFullName
          : name,

      estimateName:
        estimateName,

      unit:
        unit,

      type:
        type
    };

    if(
      type === "work"
    ){

      item.price =
        price;

      item.stage =
        group;

    }else{

      item.basePriceEUR =
        price;

      item.category =
        group;

      item.manufacturer =
        manufacturer;

      item.system =
        system;

      item.article =
        article;

      item.supplierName =
        supplierName;
    }

    catalog.push(
      item
    );

    if(
      pendingTopupAutoAdd &&
      type === "material"
    ){
      addItemToTopup(
        item.id
      );
    }
  }

  saveCatalog();

  closeCatalogEditor(
    true
  );

  pendingTopupAutoAdd =
    false;

  renderFilters();
  renderBrandFilters();
  renderSystemFilters();
  renderCatalog();
}
  function deleteCatalogItem(
  id
){

  const item =
    catalog.find(
      x =>
        x.id === id
    );

  if(

  if(
    !confirm(
      `Видалити «${item.name}»?`
    )
  ){

/* =========================
   PURCHASE PROTOTYPE v1.4
   One live list + fixed supplier orders.
========================= */

const PURCHASE_WORKFLOW_KEY =
  "plumber_purchaseWorkflow_v14";

let purchaseWorkflow =
  loadPurchaseWorkflow();

let activePurchaseSupplierKey =
  "";

let purchaseAddOpen =
  false;

function createPurchaseUid(){

  return (
    "purchase-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,8)
  );
}

function loadPurchaseWorkflow(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          PURCHASE_WORKFLOW_KEY
        ) || "null"
      );

    if(
      saved &&
      typeof saved === "object"
    ){

      return {
        initialized:
          !!saved.initialized,
        initializedAt:
          saved.initializedAt || "",
        items:
          Array.isArray(saved.items)
            ? saved.items
            : [],
        orders:
          Array.isArray(saved.orders)
            ? saved.orders
            : []
      };
    }

  }catch(error){
    // Start clean if an old prototype value is malformed.
  }

  return {
    initialized:false,
    initializedAt:"",
    items:[],
    orders:[]
  };
}

function savePurchaseWorkflow(){

  localStorage.setItem(
    PURCHASE_WORKFLOW_KEY,
    JSON.stringify(
      purchaseWorkflow
    )
  );
}

function resetPurchaseWorkflow(){

  purchaseWorkflow = {
    initialized:false,
    initializedAt:"",
    items:[],
    orders:[]
  };

  activePurchaseSupplierKey =
    "";

  purchaseAddOpen =
    false;

  localStorage.removeItem(
    PURCHASE_WORKFLOW_KEY
  );
}

function getPurchaseCatalogItem(
  purchaseItem
){

  if(!purchaseItem){
    return null;
  }

  return catalog.find(
    item =>
      item.id ===
      purchaseItem.catalogId
  ) || null;
}

function supplierChoiceKey(
  offer,
  fallbackIndex = 0
){

  const id =
    String(
      offer?.supplierId || ""
    ).trim();

  if(id){
    return "id:" + id;
  }

  const name =
    normalizeText(
      offer?.supplierName || ""
    );

  if(name){
    return "name:" + name;
  }

  return "supplier:" + fallbackIndex;
}

function getPurchaseSupplierChoices(
  purchaseItem
){

  const product =
    getPurchaseCatalogItem(
      purchaseItem
    );

  if(!product){
    return [];
  }

  const result = [];
  const seen = new Set();

  getSupplierOffers(product)
    .forEach(
      (offer,index) => {

        if(!offer){
          return;
        }

        const name =
          String(
            offer.supplierName ||
            "Постачальник"
          ).trim();

        const key =
          supplierChoiceKey(
            offer,
            index
          );

        if(seen.has(key)){
          return;
        }

        seen.add(key);

        const masterPrice =
          getSnapshotPriceUAH(
            offer.master
          );

        const retailPrice =
          getSnapshotPriceUAH(
            offer.retail
          );

        const price =
          Number.isFinite(masterPrice)
            ? masterPrice
            : (
                Number.isFinite(retailPrice)
                  ? retailPrice
                  : null
              );

        result.push({
          key:key,
          supplierId:
            offer.supplierId || "",
          name:name,
          price:price
        });
      }
    );

  if(
    !result.length &&
    product.supplierName
  ){

    const name =
      String(
        product.supplierName
      ).trim();

    if(name){
      result.push({
        key:
          "name:" +
          normalizeText(name),
        supplierId:
          product.supplierId || "",
        name:name,
        price:null
      });
    }
  }

  return result;
}

function getEstimateSupplierText(
  item
){

  if(
    !item ||
    item.type !== "material"
  ){
    return "";
  }

  const product =
    catalog.find(
      product =>
        product.id === item.id
    );

  if(!product){
    return "";
  }

  const names = [];
  const seen = new Set();

  getSupplierOffers(product)
    .forEach(
      offer => {

        const name =
          String(
            offer?.supplierName || ""
          ).trim();

        const key =
          normalizeText(name);

        if(
          name &&
          !seen.has(key)
        ){
          seen.add(key);
          names.push(name);
        }
      }
    );

  if(
    !names.length &&
    product.supplierName
  ){
    names.push(
      String(product.supplierName)
    );
  }

  return names.join(" · ");
}

  }

function getAllPurchaseSuppliers(){

  const map = new Map();

  purchaseWorkflow.items
    .forEach(
      item => {

        getPurchaseSupplierChoices(item)
          .forEach(
            choice => {

              if(!map.has(choice.key)){
                map.set(
                  choice.key,
                  {
                    key:choice.key,
                    name:choice.name
                  }
                );
              }
            }
          );
      }
    );

  return Array.from(
    map.values()
  ).sort(
    (a,b) =>
      a.name.localeCompare(
        b.name,
        "uk"
      )
  );
}

function purchaseItemHasSupplier(
  item,
  supplierKey
){

  if(!supplierKey){
    return true;
  }

  return getPurchaseSupplierChoices(
    item
  ).some(
    choice =>
      choice.key === supplierKey
  );
}

function getActivePurchaseSupplier(){

  if(!activePurchaseSupplierKey){
    return null;
  }

  return getAllPurchaseSuppliers()
    .find(
      supplier =>
        supplier.key ===
        activePurchaseSupplierKey
    ) || null;
}

function setPurchaseSupplier(
  encodedKey
){

  activePurchaseSupplierKey =
    decodeURIComponent(
      encodedKey
    );

  purchaseWorkflow.items
    .forEach(
      item => {
        item.selected = false;
      }
    );

  savePurchaseWorkflow();
  renderPurchasing();
}

function togglePurchaseItem(
  encodedUid
){

  const uid =
    decodeURIComponent(
      encodedUid
    );

  const item =
    purchaseWorkflow.items.find(
      item => item.uid === uid
    );

  if(
    !item ||
    !activePurchaseSupplierKey ||
    !purchaseItemHasSupplier(
      item,
      activePurchaseSupplierKey
    )
  ){
    return;
  }

  item.selected =
    !item.selected;

  savePurchaseWorkflow();
  renderPurchasing();
}

function changePurchaseQty(
  encodedUid,
  delta
){

  const uid =
    decodeURIComponent(
      encodedUid
    );

  const item =
    purchaseWorkflow.items.find(
      item => item.uid === uid
    );

  if(!item){
    return;
  }

  item.qty =
    Math.max(
      1,
      (Number(item.qty) || 1) +
      delta
    );

  savePurchaseWorkflow();
  renderPurchasing();
}

function closePurchaseItem(
  encodedUid
){

  const uid =
    decodeURIComponent(
      encodedUid
    );

  purchaseWorkflow.items =
    purchaseWorkflow.items.filter(
      item => item.uid !== uid
    );

  savePurchaseWorkflow();
  renderPurchasing();
}

function createSupplierOrder(){

  const supplier =
    getActivePurchaseSupplier();

  if(!supplier){
    return;
  }

  const selected =
    purchaseWorkflow.items.filter(
      item =>
        item.selected &&
        purchaseItemHasSupplier(
          item,
          supplier.key
        )
    );

  if(!selected.length){
    return;
  }

  const order = {
    id:
      "order-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2,8),
    createdAt:
      new Date().toISOString(),
    supplierKey:
      supplier.key,
    supplierName:
      supplier.name,
    items:
      selected.map(
        item => ({
          catalogId:item.catalogId,
          name:item.name,
          fullName:item.fullName,
          article:item.article,
          unit:item.unit,
          qty:Number(item.qty) || 0
        })
      )
  };

  const selectedIds =
    new Set(
      selected.map(
        item => item.uid
      )
    );

  purchaseWorkflow.orders.push(
    order
  );

  purchaseWorkflow.items =
    purchaseWorkflow.items.filter(
      item =>
        !selectedIds.has(item.uid)
    );

  activePurchaseSupplierKey =
    "";

  savePurchaseWorkflow();
  renderPurchasing();
}

      );

}

function renderPurchaseSearch(){

  const box =
    document.getElementById(
      "purchaseSearchResults"
    );

  const input =
    document.getElementById(
      "purchaseSearch"
    );

  if(
    !box ||
    !input
  ){
    return;
  }

  const query =
    normalizeText(
      input.value
    );

  const items =
    catalog.filter(
      item => {

        if(item.type !== "material"){
          return false;
        }

        if(!query){
          return false;
        }

        const searchable = [
          item.name,
          item.estimateName,
          item.article,
          item.manufacturer,
          item.system
        ]
        .map(normalizeText)
        .join(" ");

        return searchable.includes(
          query
        );
      }
    )
    .slice(0,20);

  if(!query){
    box.innerHTML = "";
    return;
  }

  if(!items.length){
    box.innerHTML = `
      <div class="purchaseEmpty" style="padding:14px 8px">
        Нічого не знайдено
      </div>
    `;
    return;
  }

  box.innerHTML =
    items.map(
      item => {

        const encodedId =
          encodeURIComponent(
            item.id
          );

        const meta = [
          item.manufacturer,
          item.system,
          item.article
        ]
        .filter(Boolean)
        .join(" · ");

        return `
          <button
            class="purchaseSearchItem"
            onclick="addPurchaseCatalogItem('${encodedId}')"
          >
            <strong>
              ${escapeHtml(item.estimateName || item.name)}
            </strong>
            <span>
              ${escapeHtml(meta || item.unit || "Матеріал")}
            </span>
          </button>
        `;
      }
    ).join("");
}

function addPurchaseCatalogItem(
  encodedId
){

  const id =
    decodeURIComponent(
      encodedId
    );

  const product =
    catalog.find(
      item =>
        item.id === id &&
        item.type === "material"
    );

  if(!product){
    return;
  }

  const existing =
    purchaseWorkflow.items.find(
      item =>
        item.catalogId === id
    );

  if(existing){

    existing.qty =
      (Number(existing.qty) || 0) + 1;

  }else{

    purchaseWorkflow.items.push({
      uid:createPurchaseUid(),
      catalogId:product.id,
      name:
        product.estimateName ||
        product.name || "",
      fullName:
        product.name ||
        product.estimateName || "",
      article:
        product.article || "",
      unit:
        product.unit || "",
      qty:1,
      source:"added",
      selected:false
    });
  }

  savePurchaseWorkflow();

  const input =
    document.getElementById(
      "purchaseSearch"
    );

  if(input){
    input.value = "";
  }

  purchaseAddOpen = false;
  renderPurchasing();
}


function copySupplierOrder(
  encodedOrderId
){

  const orderId =
    decodeURIComponent(
      encodedOrderId
    );

  const order =
    purchaseWorkflow.orders.find(
      item => item.id === orderId
    );

  if(!order){
    return;
  }

  const lines = [
    order.supplierName || "Замовлення",
    ""
  ];

  (Array.isArray(order.items)
    ? order.items
    : []
  ).forEach(
    (item,index) => {

      const name =
        item.fullName ||
        item.name ||
        "Матеріал";

      const article =
        item.article
          ? ` · арт. ${item.article}`
          : "";

      lines.push(
        `${index + 1}. ${name}${article} — ${Number(item.qty) || 0} ${item.unit || ""}`
      );
    }
  );

  const text =
    lines.join("\n");

  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(text)
      .then(
        () => alert("Замовлення скопійовано.")
      )
      .catch(
        () => prompt("Скопіюйте замовлення:",text)
      );

    return;
  }

  prompt(
    "Скопіюйте замовлення:",
    text
  );
}

  return date.toLocaleDateString(
    "uk-UA",
    {
      day:"2-digit",
      month:"2-digit",
      year:"2-digit"
    }
  );
