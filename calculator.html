<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">

<title>sa-master.pro — Кошторис. Звітність. Аудит.</title>
<meta name="theme-color" content="#E3F0FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">

<style>
:root{
  --p:#007AFF;
  --t:#1C1C1E;
  --ts:#3A3A3C;
  --tm:#8E8E93;
  --bg:#E3F0FA;
  --bgs:#F2F6FB;
  --bge:#EAF1FA;
  --gb:rgba(255,255,255,.55);
  --gbr:rgba(255,255,255,.7);
  --gs:0 .5rem 2rem rgba(0,0,0,.08);
  --card:#FFFFFF;
  --red:#FF3B30;
  --green:#34C759;
  --dot-gray:#C7C7CC;
  --dot-dark:#1C1C1E;
  --rc:.875rem;
  --rm:1.25rem;
  --rs:1.75rem;
  --rg:1.25rem;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --p:#0A84FF;
    --t:#F2F2F7;
    --ts:#C7C7CC;
    --tm:#8E8E93;
    --bg:#1C1C1E;
    --bgs:#2C2C2E;
    --bge:#1C1C1E;
    --gb:rgba(44,44,46,.6);
    --gbr:rgba(255,255,255,.12);
    --gs:0 .5rem 2rem rgba(0,0,0,.4);
    --card:#2C2C2E;
    --dot-dark:#F2F2F7;
  }
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  color:var(--t);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
  touch-action:manipulation;
}

button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}

/* ==== BACKGROUND ==== */

.bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  background:linear-gradient(180deg,var(--bgs) 0%,var(--bg) 25%,var(--bge) 75%,var(--bg) 100%);
}

.bg::before{
  content:"";
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(ellipse 60% 50% at 25% 20%,rgba(0,122,255,.15) 0%,transparent 60%),
    radial-gradient(ellipse 55% 45% at 75% 75%,rgba(88,86,214,.12) 0%,transparent 55%);
  animation:aur 20s ease-in-out infinite alternate;
}

@keyframes aur{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(3%,-2%) scale(1.05)}
  100%{transform:translate(-2%,1.5%) scale(1.02)}
}

/* ==== APP ==== */

.app{
  position:relative;
  z-index:1;
  width:min(30rem,calc(100% - 1rem));
  height:100dvh;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  padding:calc(.75rem + var(--sat)) 0 calc(.75rem + var(--sab));
  overflow:hidden;
}

/* ==== HERO ==== */

.hero{
  flex:0 0 auto;
  position:relative;
  padding:.875rem 1rem;
  border-radius:1.5rem;
  background:var(--gb);
  backdrop-filter:blur(1.75rem) saturate(220%);
  -webkit-backdrop-filter:blur(1.75rem) saturate(220%);
  border:1px solid var(--gbr);
  box-shadow:var(--gs);
  margin-bottom:.75rem;
}

.heroRow{
  display:flex;
  align-items:center;
  gap:.75rem;
  min-width:0;
}

.heroLogo{
  flex:0 0 auto;
  width:3rem;
  height:3rem;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:rgba(0,122,255,.1);
}

.heroLogo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.heroLogoFallback{
  font-family:'Russo One',sans-serif;
  font-size:1.375rem;
  color:var(--p);
  letter-spacing:-1px;
}

.heroDivider{
  width:1px;
  height:2.25rem;
  background:rgba(60,60,67,.15);
  flex-shrink:0;
}

@media (prefers-color-scheme: dark){
  .heroDivider{background:rgba(255,255,255,.15)}
}

.heroText{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
}

.heroTitle{
  font-family:'Russo One',sans-serif;
  font-size:1.25rem;
  font-weight:400;
  letter-spacing:.3px;
  color:var(--t);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1;
}

.heroTitle .pro{
  color:var(--tm);
  font-size:.875rem;
  font-weight:400;
  margin-left:2px;
}

.heroSub{
  font-size:.75rem;
  color:var(--ts);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:.1px;
}

.heroAction{
  flex:0 0 auto;
  width:2rem;
  height:2rem;
  border-radius:.625rem;
  background:rgba(0,122,255,.1);
  color:var(--p);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .12s;
}

.heroAction:active{
  transform:scale(.92);
}

.heroAction svg{
  width:1.125rem;
  height:1.125rem;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ==== MAIN ==== */

.main{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ==== EMPTY STATE ==== */

.emptyState{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:1.5rem 1.25rem;
  text-align:center;
  overflow-y:auto;
  gap:1rem;
}

.emptyIntro{
  background:var(--gb);
  backdrop-filter:blur(1.5rem) saturate(200%);
  -webkit-backdrop-filter:blur(1.5rem) saturate(200%);
  border:1px solid var(--gbr);
  border-radius:1.5rem;
  box-shadow:var(--gs);
  padding:1.375rem 1.25rem;
  max-width:22rem;
  width:100%;
  text-align:left;
}

.emptyIntro h2{
  font-size:1rem;
  font-weight:700;
  color:var(--t);
  margin-bottom:.75rem;
  text-align:center;
}

.emptyIntro ol{
  padding-left:1.25rem;
  color:var(--ts);
  font-size:.875rem;
  line-height:1.7;
}

.emptyIntro li{
  margin-bottom:.375rem;
}

.emptyIntro li:last-child{
  margin-bottom:0;
}

.primaryButton{
  height:3.125rem;
  min-width:15rem;
  padding:0 1.375rem;
  border-radius:1.125rem;
  background:linear-gradient(135deg,#007AFF,#0A84FF);
  color:#fff;
  font-size:.9375rem;
  font-weight:700;
  box-shadow:0 .5rem 1.5rem rgba(0,122,255,.28);
  transition:transform .15s;
  letter-spacing:.1px;
}

.primaryButton:active{
  transform:scale(.97);
}

/* ==== LIST ==== */

.listWrap{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.listHeader{
  flex:0 0 auto;
  padding:.25rem .375rem .625rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.listHeader strong{
  font-size:.9375rem;
  font-weight:700;
  color:var(--t);
}

.addSmallButton{
  height:2rem;
  padding:0 .75rem;
  border-radius:.75rem;
  background:linear-gradient(135deg,#007AFF,#0A84FF);
  color:#fff;
  font-size:.75rem;
  font-weight:700;
  box-shadow:0 .25rem .625rem rgba(0,122,255,.24);
}

.list{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:0 .125rem .75rem;
}

.list::-webkit-scrollbar{display:none}

/* ==== PROJECT CARD ==== */

.projectCard{
  position:relative;
  background:var(--gb);
  backdrop-filter:blur(1.5rem) saturate(200%);
  -webkit-backdrop-filter:blur(1.5rem) saturate(200%);
  border:1px solid var(--gbr);
  border-radius:1.25rem;
  box-shadow:var(--gs);
  padding:.9375rem 1rem;
  margin-bottom:.625rem;
  display:flex;
  gap:.75rem;
  align-items:flex-start;
  transition:transform .12s;
}

.projectCard:active{
  transform:scale(.99);
}

.projectDot{
  flex:0 0 auto;
  width:.625rem;
  height:.625rem;
  border-radius:50%;
  background:var(--dot-gray);
  margin-top:.375rem;
  box-shadow:0 0 0 3px rgba(199,199,204,.25);
}

.projectDot.status-estimate{background:var(--dot-gray);box-shadow:0 0 0 3px rgba(199,199,204,.25)}
.projectDot.status-work{background:var(--green);box-shadow:0 0 0 3px rgba(52,199,89,.25)}
.projectDot.status-done{background:var(--dot-dark);box-shadow:0 0 0 3px rgba(28,28,30,.18)}

.projectBody{
  flex:1 1 auto;
  min-width:0;
}

.projectTitle{
  font-size:.9375rem;
  font-weight:750;
  line-height:1.25;
  overflow-wrap:anywhere;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:.5rem;
  color:var(--t);
}

.projectUrgent{
  flex:0 0 auto;
  font-size:.875rem;
  line-height:1;
}

.projectClient{
  margin-top:.25rem;
  color:var(--ts);
  font-size:.8125rem;
  line-height:1.35;
  overflow-wrap:anywhere;
}

.projectAddress{
  margin-top:.125rem;
  color:var(--tm);
  font-size:.75rem;
  line-height:1.35;
  overflow-wrap:anywhere;
}

.projectDivider{
  height:1px;
  background:rgba(120,130,140,.15);
  margin:.625rem 0 .5rem;
}

.projectMeta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.5rem;
  font-size:.75rem;
  color:var(--ts);
}

.projectStage{font-weight:650}
.projectAmount{font-weight:750;color:var(--t);white-space:nowrap}
.projectDetails{margin-top:.375rem;color:var(--tm);font-size:.6875rem;line-height:1.35;overflow-wrap:anywhere}

/* ==== SHEET ==== */

.sheet{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(1rem);
  -webkit-backdrop-filter:blur(1rem);
}

.sheet.open{display:flex}

.panel{
  width:100%;
  max-width:30rem;
  max-height:90dvh;
  margin:0 auto;
  background:var(--bg);
  border-radius:1.75rem 1.75rem 0 0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-bottom:var(--sab);
  animation:slideUp .28s cubic-bezier(.22,.61,.36,1);
  border-top:1px solid var(--gbr);
}

@keyframes slideUp{
  from{transform:translateY(2rem);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.panelHead{
  flex:0 0 auto;
  padding:1rem 1.125rem .5rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panelHead strong{
  font-size:1.125rem;
  font-weight:750;
  color:var(--t);
}

.close{
  width:2.25rem;
  height:2.25rem;
  border-radius:50%;
  font-size:1.5rem;
  color:var(--tm);
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  background:rgba(120,130,140,.12);
}

.panelBody{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:0 1rem 1rem;
  scrollbar-width:none;
}

.panelBody::-webkit-scrollbar{display:none}

.panelFooter{
  flex:0 0 auto;
  padding:.625rem 1rem calc(.75rem + var(--sab));
  display:flex;
  gap:.5rem;
  border-top:1px solid var(--gbr);
  background:var(--bg);
}

.panelFooter button{
  flex:1;
  height:3rem;
  border-radius:1rem;
  font-size:.9375rem;
  font-weight:700;
  transition:transform .12s;
}

.panelFooter button:active{transform:scale(.98)}

.btnGhost{
  background:rgba(120,130,140,.12);
  color:var(--ts);
}

.btnPrimary{
  background:linear-gradient(135deg,#007AFF,#0A84FF);
  color:#fff;
  box-shadow:0 .375rem 1rem rgba(0,122,255,.22);
}

/* ==== FORM ==== */

.formGroup{margin-bottom:.875rem}

.formLabel{
  display:block;
  color:var(--tm);
  font-size:.75rem;
  margin:0 .25rem .375rem;
  font-weight:600;
  letter-spacing:.2px;
}

.formInput,
.formTextarea{
  width:100%;
  border:1px solid var(--gbr);
  outline:0;
  border-radius:.875rem;
  background:var(--gb);
  backdrop-filter:blur(1rem);
  -webkit-backdrop-filter:blur(1rem);
  padding:0 .875rem;
  font-size:.9375rem;
  color:var(--t);
  transition:box-shadow .15s;
}

.formInput{height:3rem}

.formTextarea{
  padding:.75rem .875rem;
  min-height:3.75rem;
  resize:vertical;
  line-height:1.4;
  font-family:inherit;
}

.formInput:focus,
.formTextarea:focus{box-shadow:inset 0 0 0 1.5px var(--p)}

.formHint{
  margin:.25rem .25rem 0;
  color:var(--tm);
  font-size:.6875rem;
  line-height:1.4;
}

/* ==== CHECKBOX ==== */

.checkRow{
  display:flex;
  align-items:center;
  gap:.625rem;
  padding:.75rem .875rem;
  border-radius:.875rem;
  background:var(--gb);
  border:1px solid var(--gbr);
  cursor:pointer;
}

.checkBox{
  flex:0 0 auto;
  width:1.25rem;
  height:1.25rem;
  border-radius:.375rem;
  border:1.5px solid var(--tm);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .15s;
}

.checkRow.on .checkBox{
  background:var(--p);
  border-color:var(--p);
}

.checkBox svg{
  width:.75rem;
  height:.75rem;
  stroke:#fff;
  stroke-width:2.5;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:0;
  transition:opacity .15s;
}

.checkRow.on .checkBox svg{opacity:1}

.checkLabel{
  flex:1 1 auto;
  font-size:.875rem;
  color:var(--t);
}

/* ==== CHIPS ==== */

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:.375rem;
  margin-bottom:.625rem;
}

.chip{
  padding:.5rem .75rem;
  border-radius:.75rem;
  background:var(--gb);
  border:1px solid var(--gbr);
  color:var(--ts);
  font-size:.8125rem;
  font-weight:600;
  transition:all .15s;
  white-space:nowrap;
}

.chip.active{
  background:var(--p);
  color:#fff;
  border-color:var(--p);
  box-shadow:0 .25rem .75rem rgba(0,122,255,.25);
}

/* ==== PROJECT VIEW ==== */

.projectView{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  padding:.25rem 0;
  overflow-y:auto;
  scrollbar-width:none;
  gap:.75rem;
}

.projectView::-webkit-scrollbar{display:none}

.backRow{
  display:flex;
  align-items:center;
  padding:0 .25rem;
}

.backButton{
  width:2.5rem;
  height:2.5rem;
  border-radius:.875rem;
  background:var(--gb);
  backdrop-filter:blur(1rem);
  -webkit-backdrop-filter:blur(1rem);
  border:1px solid var(--gbr);
  color:var(--p);
  font-size:1.375rem;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--gs);
  flex:0 0 auto;
}

.projectHeaderCard{
  background:var(--gb);
  backdrop-filter:blur(1.5rem) saturate(200%);
  -webkit-backdrop-filter:blur(1.5rem) saturate(200%);
  border:1px solid var(--gbr);
  border-radius:1.25rem;
  box-shadow:var(--gs);
  padding:1rem 1.125rem;
}

.projectHeaderTitle{
  font-size:1.0625rem;
  font-weight:800;
  line-height:1.25;
  overflow-wrap:anywhere;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:.625rem;
  color:var(--t);
}

.projectHeaderMeta{
  margin-top:.5rem;
  color:var(--ts);
  font-size:.8125rem;
  line-height:1.55;
  overflow-wrap:anywhere;
}

.projectHeaderMeta b{color:var(--t);font-weight:700}

.placeholderBlock{
  background:var(--gb);
  backdrop-filter:blur(1.5rem) saturate(200%);
  -webkit-backdrop-filter:blur(1.5rem) saturate(200%);
  border:1px solid var(--gbr);
  border-radius:1.25rem;
  box-shadow:var(--gs);
  padding:1.75rem 1.375rem;
  text-align:center;
  color:var(--tm);
  font-size:.8125rem;
  line-height:1.55;
}

.placeholderBlock strong{
  display:block;
  color:var(--t);
  font-size:.9375rem;
  margin-bottom:.375rem;
  font-weight:700;
}

/* ==== FULLSCREEN PROFILE ==== */

.fullscreen{
  position:fixed;
  inset:0;
  z-index:150;
  background:var(--bg);
  display:none;
  flex-direction:column;
  overflow:hidden;
}

.fullscreen.open{display:flex}

.fsBody{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  scrollbar-width:none;
  padding:calc(1rem + var(--sat)) 1rem calc(1rem + var(--sab));
  width:min(30rem,100%);
  margin:0 auto;
}

.fsBody::-webkit-scrollbar{display:none}

.fsHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:1.25rem;
}

.fsHead strong{
  font-size:1.25rem;
  font-weight:800;
  color:var(--t);
}

.fsHead .close{
  background:rgba(120,130,140,.12);
}

.fsSection{
  margin-bottom:1.5rem;
}

.fsSectionTitle{
  font-size:.75rem;
  font-weight:700;
  color:var(--tm);
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:.625rem;
  padding:0 .25rem;
}

.fsCard{
  background:var(--gb);
  backdrop-filter:blur(1.5rem) saturate(200%);
  -webkit-backdrop-filter:blur(1.5rem) saturate(200%);
  border:1px solid var(--gbr);
  border-radius:1.25rem;
  box-shadow:var(--gs);
  padding:1rem 1.125rem;
}

.fsCard + .fsCard{
  margin-top:.5rem;
}

.personRow{
  display:flex;
  align-items:center;
  gap:.75rem;
}

.personAvatar{
  flex:0 0 auto;
  width:2.5rem;
  height:2.5rem;
  border-radius:50%;
  background:rgba(0,122,255,.12);
  color:var(--p);
  font-size:1rem;
  font-weight:750;
  display:flex;
  align-items:center;
  justify-content:center;
  text-transform:uppercase;
}

.personBody{
  flex:1 1 auto;
  min-width:0;
}

.personName{
  font-size:.9375rem;
  font-weight:700;
  color:var(--t);
  line-height:1.2;
  overflow-wrap:anywhere;
}

.personMeta{
  margin-top:.125rem;
  color:var(--tm);
  font-size:.75rem;
  line-height:1.35;
  overflow-wrap:anywhere;
}

.personDelete{
  flex:0 0 auto;
  width:2rem;
  height:2rem;
  border-radius:50%;
  background:rgba(255,59,48,.1);
  color:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.125rem;
  line-height:1;
}

.emptyTeam{
  text-align:center;
  color:var(--tm);
  font-size:.8125rem;
  line-height:1.5;
  padding:1.5rem .875rem;
}

.addPersonButton{
  width:100%;
  height:2.875rem;
  margin-top:.625rem;
  border-radius:.875rem;
  background:rgba(0,122,255,.1);
  color:var(--p);
  font-size:.875rem;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.375rem;
}

.addPersonButton:active{
  transform:scale(.98);
}

.fsFooter{
  flex:0 0 auto;
  padding:.75rem 1rem calc(1rem + var(--sab));
  border-top:1px solid var(--gbr);
  background:var(--bg);
  width:100%;
}

.fsFooterInner{
  width:min(30rem,100%);
  margin:0 auto;
}

.fsFooter button{
  width:100%;
  height:3rem;
  border-radius:1rem;
  background:linear-gradient(135deg,#007AFF,#0A84FF);
  color:#fff;
  font-size:.9375rem;
  font-weight:700;
  box-shadow:0 .375rem 1rem rgba(0,122,255,.22);
}

/* ==== TOAST ==== */

.toast{
  position:fixed;
  left:50%;
  bottom:calc(1.5rem + var(--sab));
  transform:translateX(-50%) translateY(1.25rem);
  background:var(--t);
  color:var(--bg);
  padding:.625rem 1.125rem;
  border-radius:.75rem;
  font-size:.8125rem;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s, transform .2s;
  z-index:200;
  max-width:90%;
  text-align:center;
  box-shadow:0 .5rem 1.5rem rgba(0,0,0,.2);
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ==== HIDDEN ==== */

.hidden{display:none !important}

@media (max-width:26rem){
  .heroTitle{font-size:1.125rem}
  .heroSub{font-size:.6875rem}
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="app" id="app">

  <section class="hero" id="hero"></section>

  <main class="main" id="main"></main>

</div>

<!-- SHEET: NEW PROJECT -->

<div class="sheet" id="newProjectSheet">
  <div class="panel">
    <div class="panelHead">
      <strong>Новий об'єкт</strong>
      <button class="close" onclick="closeNewProject()">×</button>
    </div>

    <div class="panelBody">
      <div class="formGroup">
        <label class="formLabel">Коротка назва (необов'язково)</label>
        <input class="formInput" id="npTitle" placeholder="Напр. Печерськ" autocomplete="off">
        <div class="formHint">Якщо не вказати — використаємо адресу або ім'я замовника</div>
      </div>

      <div class="formGroup">
        <label class="formLabel">Ім'я замовника *</label>
        <input class="formInput" id="npClientName" placeholder="Іван Петренко" autocomplete="off">
      </div>

      <div class="formGroup">
        <label class="formLabel">Телефон замовника *</label>
        <input class="formInput" id="npClientPhone" placeholder="+380 67 123 45 67" inputmode="tel" autocomplete="off">
      </div>

      <div class="formGroup">
        <label class="formLabel">Адреса / позначення об'єкта</label>
        <textarea class="formTextarea" id="npAddress" placeholder="ЖК Comfort Town, літ. Б, кв. 45 або Котельня, Вінниця" autocomplete="off"></textarea>
        <div class="formHint">Деталі об'єкта (тип, площа, санвузли) заповнимо пізніше</div>
      </div>
    </div>

    <div class="panelFooter">
      <button class="btnGhost" onclick="closeNewProject()">Скасувати</button>
      <button class="btnPrimary" onclick="createProject()">Створити</button>
    </div>
  </div>
</div>

<!-- SHEET: ADD PERSON -->

<div class="sheet" id="addPersonSheet">
  <div class="panel">
    <div class="panelHead">
      <strong>Додати в команду</strong>
      <button class="close" onclick="closeAddPerson()">×</button>
    </div>

    <div class="panelBody">
      <div class="formGroup">
        <label class="formLabel">Ім'я *</label>
        <input class="formInput" id="apName" placeholder="Толік" autocomplete="off">
      </div>

      <div class="formGroup">
        <label class="formLabel">Телефон (опційно)</label>
        <input class="formInput" id="apPhone" placeholder="+380 67 123 45 67" inputmode="tel" autocomplete="off">
      </div>

      <div class="formGroup">
        <label class="formLabel">Принцип оплати</label>
        <div class="chips" id="apChips">
          <button type="button" class="chip active" data-type="percent_of_income">% від доходу</button>
          <button type="button" class="chip" data-type="per_day">За день</button>
          <button type="button" class="chip" data-type="per_month">За місяць</button>
          <button type="button" class="chip" data-type="fixed_per_object">Фіксована</button>
        </div>
      </div>

      <div class="formGroup">
        <label class="formLabel" id="apValueLabel">Сума</label>
        <input class="formInput" id="apValue" inputmode="decimal" placeholder="0">
        <div class="formHint" id="apValueHint">% від доходу об'єкта</div>
      </div>
    </div>

    <div class="panelFooter">
      <button class="btnGhost" onclick="closeAddPerson()">Скасувати</button>
      <button class="btnPrimary" onclick="savePerson()">Зберегти</button>
    </div>
  </div>
</div>

<!-- FULLSCREEN: PROFILE -->

<div class="fullscreen" id="profileScreen">
  <div class="fsBody">

    <div class="fsHead">
      <strong>Профіль</strong>
      <button class="close" onclick="closeProfile()">×</button>
    </div>

    <div class="fsSection">
      <div class="fsSectionTitle">Мої дані</div>
      <div class="fsCard">
        <div class="formGroup">
          <label class="formLabel">Ім'я</label>
          <input class="formInput" id="pfFirstName" placeholder="Сергій" autocomplete="off">
        </div>

        <div class="formGroup">
          <label class="formLabel">Прізвище</label>
          <input class="formInput" id="pfLastName" placeholder="Мельник" autocomplete="off">
        </div>

        <div class="formGroup">
          <label class="formLabel">Компанія</label>
          <input class="formInput" id="pfCompany" placeholder="SA-MASTER.PRO" autocomplete="off">
        </div>

        <div class="formGroup" style="margin-bottom:0">
          <label class="formLabel">Телефон</label>
          <input class="formInput" id="pfPhone" placeholder="+380 97 911 18 71" inputmode="tel" autocomplete="off">
        </div>
      </div>
    </div>

    <div class="fsSection">
      <div class="fsSectionTitle">Оплата праці</div>
      <div class="fsCard">
        <div class="checkRow" id="pfOwnerRow" onclick="toggleOwner()">
          <div class="checkBox">
            <svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
          </div>
          <div class="checkLabel">Я власник — мені залишається залишок</div>
        </div>

        <div id="pfPayBlock" style="margin-top:.75rem">
          <div class="formGroup">
            <label class="formLabel">Принцип оплати</label>
            <div class="chips" id="pfChips">
              <button type="button" class="chip active" data-type="percent_of_income">% від доходу</button>
              <button type="button" class="chip" data-type="per_day">За день</button>
              <button type="button" class="chip" data-type="per_month">За місяць</button>
              <button type="button" class="chip" data-type="fixed_per_object">Фіксована</button>
            </div>
          </div>

          <div class="formGroup" style="margin-bottom:0">
            <label class="formLabel" id="pfValueLabel">Сума</label>
            <input class="formInput" id="pfValue" inputmode="decimal" placeholder="0">
            <div class="formHint" id="pfValueHint">% від доходу об'єкта</div>
          </div>
        </div>
      </div>
    </div>

    <div class="fsSection">
      <div class="fsSectionTitle">Команда</div>
      <div id="teamList"></div>

      <button class="addPersonButton" onclick="openAddPerson()">
        <span style="font-size:1.25rem;line-height:1">＋</span>
        <span>Додати людину</span>
      </button>
    </div>

  </div>

  <div class="fsFooter">
    <div class="fsFooterInner">
      <button onclick="saveProfile()">Готово</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   STORAGE
========================================================= */

const PROJECTS_KEY = "sa_projects";
const PROFILE_KEY = "sa_profile";
const TEAM_KEY = "sa_team";

let projects = [];
let profile = {
  firstName: "",
  lastName: "",
  company: "",
  phone: "",
  isOwner: true,
  payType: "per_day",
  payValue: 0
};
let team = [];

try{
  const raw = localStorage.getItem(PROJECTS_KEY);
  const parsed = raw ? JSON.parse(raw) : [];
  if(Array.isArray(parsed)) projects = parsed;
}catch(e){ projects = []; }

try{
  const raw = localStorage.getItem(PROFILE_KEY);
  const parsed = raw ? JSON.parse(raw) : null;
  if(parsed && typeof parsed === "object"){
    profile = { ...profile, ...parsed };
  }
}catch(e){}

try{
  const raw = localStorage.getItem(TEAM_KEY);
  const parsed = raw ? JSON.parse(raw) : [];
  if(Array.isArray(parsed)) team = parsed;
}catch(e){ team = []; }

function saveProjects(){
  try{ localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects)); }catch(e){}
}

function saveProfileData(){
  try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }catch(e){}
}

function saveTeamData(){
  try{ localStorage.setItem(TEAM_KEY, JSON.stringify(team)); }catch(e){}
}

let currentProjectId = null;
let editingPayType = "percent_of_income";
let profilePayType = "percent_of_income";
let ownerMode = true;

/* =========================================================
   UTILS
========================================================= */

function uid(prefix){
  return (prefix || "id") + "-" + Date.now() + "-" + Math.random().toString(36).slice(2,7);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2200);
}

function money(value){
  const n = Number(value) || 0;
  return new Intl.NumberFormat("uk-UA").format(Math.round(n)) + " ₴";
}

function payTypeLabel(t){
  switch(t){
    case "percent_of_income": return "% від доходу";
    case "per_day": return "за день";
    case "per_month": return "за місяць";
    case "fixed_per_object": return "за об'єкт";
    default: return "";
  }
}

function payValueUnit(t){
  switch(t){
    case "percent_of_income": return "%";
    case "per_day": return "₴/день";
    case "per_month": return "₴/міс";
    case "fixed_per_object": return "₴";
    default: return "";
  }
}

function payValueHint(t){
  switch(t){
    case "percent_of_income": return "% від доходу об'єкта";
    case "per_day": return "фіксована ставка за робочий день";
    case "per_month": return "фіксована ставка за місяць";
    case "fixed_per_object": return "фіксована сума за об'єкт";
    default: return "";
  }
}

function personInitial(name){
  const n = String(name || "").trim();
  return n ? n[0] : "?";
}

/* =========================================================
   RENDER — ROUTER
========================================================= */

function render(){
  renderHero();

  if(currentProjectId){
    const project = projects.find(p => p.id === currentProjectId);
    if(!project){
      currentProjectId = null;
      renderHome();
      return;
    }
    renderProject(project);
  }else{
    renderHome();
  }
}

function renderHero(){
  const hero = document.getElementById("hero");

  if(currentProjectId){
    hero.innerHTML = "";
    hero.style.display = "none";
    return;
  }

  hero.style.display = "";

  const initials = (profile.firstName || profile.lastName)
    ? ((profile.firstName || "")[0] || "").toUpperCase() + ((profile.lastName || "")[0] || "").toUpperCase()
    : "";

  hero.innerHTML = `
    <div class="heroRow">
      <div class="heroLogo">
        <img src="logo.png" alt="SA-MASTER.PRO" onerror="this.style.display='none';this.parentNode.innerHTML='<span class=\\'heroLogoFallback\\'>S</span>'">
      </div>
      <div class="heroDivider"></div>
      <div class="heroText">
        <div class="heroTitle">SA-MASTER<span class="pro">.pro</span></div>
        <div class="heroSub">Кошторис. Звітність. Аудит.</div>
      </div>
      <button class="heroAction" onclick="openProfile()" aria-label="Профіль">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"/>
          <path d="M5.3 18.3C6.8 16.5 9.2 15 12 15s5.2 1.5 6.7 3.3"/>
        </svg>
      </button>
    </div>
  `;
}

/* =========================================================
   RENDER — HOME
========================================================= */

function renderHome(){
  const main = document.getElementById("main");

  if(!projects.length){
    main.innerHTML = renderEmptyState();
    return;
  }

  main.innerHTML = renderProjectList();
}

function renderEmptyState(){
  return `
    <div class="emptyState">
      <div class="emptyIntro">
        <h2>З чого почати</h2>
        <ol>
          <li>Створіть перший об'єкт</li>
          <li>Внесіть дані про себе та команду</li>
          <li>Складіть кошторис</li>
          <li>Відправте замовнику</li>
          <li>Ведіть роботу до завершення</li>
        </ol>
      </div>

      <button class="primaryButton" onclick="openNewProject()">
        + Створити перший об'єкт
      </button>
    </div>
  `;
}

function renderProjectList(){
  const active = projects.filter(p => (p.status || "active") === "active");
  const archived = projects.filter(p => (p.status || "active") === "archived");

  const activeSorted = active.slice().sort(sortProjects);
  const archivedSorted = archived.slice().sort(sortProjects);

  let html = `
    <div class="listWrap">
      <div class="listHeader">
        <strong>Об'єкти (${active.length})</strong>
        <button class="addSmallButton" onclick="openNewProject()">+ Об'єкт</button>
      </div>
      <div class="list">
  `;

  if(activeSorted.length){
    html += activeSorted.map(renderProjectCard).join("");
  }else{
    html += `
      <div class="emptyTeam" style="padding:2rem 1rem">
        Активних об'єктів немає.<br>
        Створіть новий об'єкт, щоб почати роботу.
      </div>
    `;
  }

  if(archivedSorted.length){
    html += `
      <div style="margin-top:.75rem;margin-bottom:.5rem;padding:0 .5rem;display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:.75rem;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.5px">
          Архів (${archivedSorted.length})
        </div>
      </div>
    `;
    html += archivedSorted.map(renderProjectCard).join("");
  }

  html += `
      </div>
    </div>
  `;

  return html;
}

function sortProjects(a,b){
  if(a.urgent && !b.urgent) return -1;
  if(!a.urgent && b.urgent) return 1;
  return String(b.updatedAt || "").localeCompare(String(a.updatedAt || ""));
}

function renderProjectCard(p){
  const dotClass = projectStageClass(p);
  const title = projectTitle(p);
  const client = escapeHtml(p.client?.name || "");
  const phone = escapeHtml(p.client?.phone || "");
  const address = escapeHtml(p.client?.address || "");

  const urgentMark = p.urgent ? `<span class="projectUrgent" title="Терміново">🔥</span>` : "";

  const stageLabel = projectStageLabel(p);
  const amount = p._total != null ? money(p._total) : "";
  const details = p._detailsLine || "";

  const isArchived = (p.status || "active") === "archived";
  const clickAttr = isArchived ? "" : `onclick="openProject('${escapeHtml(p.id)}')"`;

  return `
    <div class="projectCard" ${clickAttr} style="${isArchived ? "opacity:.75" : ""}">
      <span class="projectDot ${dotClass}"></span>
      <div class="projectBody">
        <div class="projectTitle">
          <span>${title}</span>
          ${urgentMark}
        </div>
        ${client ? `<div class="projectClient">${client}${phone ? " · " + phone : ""}</div>` : ""}
        ${address ? `<div class="projectAddress">${address}</div>` : ""}
        <div class="projectDivider"></div>
        <div class="projectMeta">
          <span class="projectStage">${escapeHtml(stageLabel)}</span>
          ${amount ? `<span class="projectAmount">${amount}</span>` : ""}
        </div>
        ${details ? `<div class="projectDetails">${escapeHtml(details)}</div>` : ""}
      </div>
    </div>
  `;
}

function projectTitlePlain(p){
  if(p.title && String(p.title).trim()) return p.title.trim();
  if(p.client?.address && String(p.client.address).trim()) return p.client.address.trim();
  if(p.client?.name && String(p.client.name).trim()) return p.client.name.trim();
  return "Без назви";
}

function projectTitle(p){
  return escapeHtml(projectTitlePlain(p));
}

function projectStageClass(p){
  if((p.status || "active") === "archived") return "status-done";
  const s = p.stage || "estimate";
  if(s === "work" || s === "complete") return "status-work";
  if(s === "done" || s === "closed") return "status-done";
  return "status-estimate";
}

function projectStageLabel(p){
  const s = p.stage || "estimate";
  switch(s){
    case "estimate": return "Прорахунок";
    case "work":     return "В роботі";
    case "done":     return "Завершено";
    case "closed":   return "Закрито";
    default:         return "Прорахунок";
  }
}

/* =========================================================
   RENDER — PROJECT
========================================================= */

function renderProject(p){
  const main = document.getElementById("main");

  const title = projectTitle(p);
  const client = escapeHtml(p.client?.name || "");
  const phone = escapeHtml(p.client?.phone || "");
  const address = escapeHtml(p.client?.address || "");
  const stageLabel = projectStageLabel(p);

  main.innerHTML = `
    <div class="projectView">
      <div class="backRow">
        <button class="backButton" onclick="backToList()" aria-label="Назад до об'єктів">←</button>
      </div>

      <div class="projectHeaderCard">
        <div class="projectHeaderTitle">
          <span>${title}</span>
          ${p.urgent ? `<span class="projectUrgent">🔥</span>` : ""}
        </div>

        <div class="projectHeaderMeta">
          ${client ? `<b>${client}</b>${phone ? " · " + phone : ""}<br>` : ""}
          ${address ? `${address}<br>` : ""}
          <span style="color:var(--tm);font-size:.75rem">${escapeHtml(stageLabel)}</span>
        </div>
      </div>

      <div class="placeholderBlock">
        <strong>Об'єкт створено</strong>
        Тут буде кошторис, статуси та фінанси.<br>
        Наступний крок — додати позиції.
      </div>
    </div>
  `;
}

/* =========================================================
   PROFILE
========================================================= */

function openProfile(){
  // Заповнюємо поля поточними значеннями
  document.getElementById("pfFirstName").value = profile.firstName || "";
  document.getElementById("pfLastName").value = profile.lastName || "";
  document.getElementById("pfCompany").value = profile.company || "";
  document.getElementById("pfPhone").value = profile.phone || "";
  document.getElementById("pfValue").value = profile.payValue || 0;

  ownerMode = profile.isOwner !== false;
  profilePayType = profile.payType || "percent_of_income";

  updateOwnerUI();
  updateProfileChips();
  updateProfileValueUI();
  renderTeamList();

  document.getElementById("profileScreen").classList.add("open");
}

function closeProfile(){
  document.getElementById("profileScreen").classList.remove("open");
}

function toggleOwner(){
  ownerMode = !ownerMode;
  updateOwnerUI();
}

function updateOwnerUI(){
  const row = document.getElementById("pfOwnerRow");
  const block = document.getElementById("pfPayBlock");
  row.classList.toggle("on", ownerMode);
  block.style.display = ownerMode ? "none" : "block";
}

function updateProfileChips(){
  document.querySelectorAll("#pfChips .chip").forEach(c => {
    c.classList.toggle("active", c.dataset.type === profilePayType);
  });
}

function updateProfileValueUI(){
  const label = document.getElementById("pfValueLabel");
  const hint = document.getElementById("pfValueHint");
  label.textContent = "Сума (" + payValueUnit(profilePayType) + ")";
  hint.textContent = payValueHint(profilePayType);
}

function renderTeamList(){
  const box = document.getElementById("teamList");

  if(!team.length){
    box.innerHTML = `
      <div class="fsCard">
        <div class="emptyTeam">
          Команда порожня.<br>
          Якщо працюєте самі — нічого додавати не треба.
        </div>
      </div>
    `;
    return;
  }

  box.innerHTML = team.map(p => `
    <div class="fsCard">
      <div class="personRow">
        <div class="personAvatar">${escapeHtml(personInitial(p.name))}</div>
        <div class="personBody">
          <div class="personName">${escapeHtml(p.name)}</div>
          <div class="personMeta">
            ${Number(p.payValue) || 0}${payValueUnit(p.payType)} · ${payTypeLabel(p.payType)}
          </div>
        </div>
        <button class="personDelete" onclick="deletePerson('${escapeHtml(p.id)}')" aria-label="Видалити">×</button>
      </div>
    </div>
  `).join("");
}

function saveProfile(){
  profile.firstName = document.getElementById("pfFirstName").value.trim();
  profile.lastName = document.getElementById("pfLastName").value.trim();
  profile.company = document.getElementById("pfCompany").value.trim();
  profile.phone = document.getElementById("pfPhone").value.trim();
  profile.isOwner = ownerMode;
  profile.payType = profilePayType;
  profile.payValue = Number(String(document.getElementById("pfValue").value).replace(",",".")) || 0;

  saveProfileData();
  closeProfile();
  renderHero();
  toast("Профіль збережено");
}

/* =========================================================
   TEAM
========================================================= */

function openAddPerson(){
  document.getElementById("apName").value = "";
  document.getElementById("apPhone").value = "";
  document.getElementById("apValue").value = "0";
  editingPayType = "percent_of_income";
  updateAddPersonChips();
  updateAddPersonValueUI();
  document.getElementById("addPersonSheet").classList.add("open");
  setTimeout(() => document.getElementById("apName").focus(), 200);
}

function closeAddPerson(){
  document.getElementById("addPersonSheet").classList.remove("open");
}

function updateAddPersonChips(){
  document.querySelectorAll("#apChips .chip").forEach(c => {
    c.classList.toggle("active", c.dataset.type === editingPayType);
  });
}

function updateAddPersonValueUI(){
  const label = document.getElementById("apValueLabel");
  const hint = document.getElementById("apValueHint");
  label.textContent = "Сума (" + payValueUnit(editingPayType) + ")";
  hint.textContent = payValueHint(editingPayType);
}

function savePerson(){
  const name = document.getElementById("apName").value.trim();
  const phone = document.getElementById("apPhone").value.trim();
  const value = Number(String(document.getElementById("apValue").value).replace(",",".")) || 0;

  if(!name){
    toast("Вкажіть ім'я");
    return;
  }

  team.push({
    id: uid("p"),
    name,
    phone,
    payType: editingPayType,
    payValue: value
  });

  saveTeamData();
  closeAddPerson();
  renderTeamList();
  toast("Додано в команду");
}

function deletePerson(id){
  const person = team.find(p => p.id === id);
  if(!person) return;
  if(!confirm(`Видалити «${person.name}» з команди?`)) return;
  team = team.filter(p => p.id !== id);
  saveTeamData();
  renderTeamList();
}

/* =========================================================
   ACTIONS
========================================================= */

function backToList(){
  currentProjectId = null;
  render();
}

function openProject(id){
  currentProjectId = id;
  render();
}

function openNewProject(){
  document.getElementById("npTitle").value = "";
  document.getElementById("npClientName").value = "";
  document.getElementById("npClientPhone").value = "";
  document.getElementById("npAddress").value = "";
  document.getElementById("newProjectSheet").classList.add("open");
  setTimeout(() => document.getElementById("npClientName").focus(), 200);
}

function closeNewProject(){
  document.getElementById("newProjectSheet").classList.remove("open");
}

function createProject(){
  const title = document.getElementById("npTitle").value.trim();
  const name = document.getElementById("npClientName").value.trim();
  const phone = document.getElementById("npClientPhone").value.trim();
  const address = document.getElementById("npAddress").value.trim();

  if(!name){ toast("Вкажіть ім'я замовника"); return; }
  if(!phone){ toast("Вкажіть телефон замовника"); return; }

  const now = new Date().toISOString();
  const wasFirst = projects.length === 0;

  const project = {
    id: uid("proj"),
    title,
    client: { name, phone, address },

    status: "active",
    stage: "estimate",
    urgent: false,

    positions: [],
    stages: [],
    discount: 0,
    payments: [],
    expenses: [],
    salaries: [],

    details: {
      objectType: "",
      workType: "",
      area: null,
      bathrooms: null,
      system: "",
      features: []
    },

    createdAt: now,
    updatedAt: now
  };

  projects.push(project);
  saveProjects();

  closeNewProject();
  currentProjectId = project.id;
  render();

  toast("Об'єкт створено");

  // Якщо це перший об'єкт і профіль ще не заповнений — показати профіль
  const profileEmpty = !profile.firstName && !profile.lastName && !profile.company;
  if(wasFirst && profileEmpty){
    setTimeout(() => {
      openProfile();
    }, 400);
  }
}

/* =========================================================
   INIT
========================================================= */

// Обробники чипів — принцип оплати людини в команді
document.getElementById("apChips").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if(!chip) return;
  editingPayType = chip.dataset.type;
  updateAddPersonChips();
  updateAddPersonValueUI();
});

// Чипи принципу оплати в профілі
document.getElementById("pfChips").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if(!chip) return;
  profilePayType = chip.dataset.type;
  updateProfileChips();
  updateProfileValueUI();
});

// Клік по фону модалок
document.getElementById("newProjectSheet").addEventListener("click", e => {
  if(e.target === e.currentTarget) closeNewProject();
});

document.getElementById("addPersonSheet").addEventListener("click", e => {
  if(e.target === e.currentTarget) closeAddPerson();
});

render();

</script>

</body>
</html>
