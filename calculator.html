<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Калькулятор сантехніка</title>

<style>
:root{
  --bg:#f4f6fa;
  --card:rgba(255,255,255,.9);
  --soft:#eef1f5;
  --line:#e2e5ea;
  --text:#15171a;
  --muted:#7b8088;
  --blue:#007aff;
  --red:#ff3b30;
  --shadow:0 8px 25px rgba(30,40,60,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,input{
  font:inherit;
}

button{
  border:0;
  background:none;
  color:inherit;
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:560px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */

.header{
  flex:0 0 auto;
  padding:
    calc(9px + env(safe-area-inset-top))
    14px
    7px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:19px;
  font-weight:750;
  letter-spacing:-.4px;
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:1px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:9px;
}

.date{
  color:var(--muted);
  font-size:12px;
}

.masterButton{
  width:32px;
  height:32px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:var(--blue);
  box-shadow:0 3px 12px rgba(30,40,60,.06);
}

.masterButton svg{
  width:19px;
  height:19px;
}

/* ================= CLIENT ================= */

.clientWrap{
  flex:0 0 auto;
  padding:0 12px 8px;
}

.client{
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:17px;
  padding:9px;
  box-shadow:var(--shadow);
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field input{
  width:100%;
  height:36px;
  border:0;
  outline:0;
  border-radius:10px;
  background:var(--soft);
  padding:0 10px;
  font-size:13px;
  color:var(--text);
}

.field input:focus{
  background:#fff;
  box-shadow:inset 0 0 0 1.5px var(--blue);
}

/* ================= ESTIMATE ================= */

.estimate{
  min-height:0;
  flex:1;

  margin:0 12px;

  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:20px;

  box-shadow:var(--shadow);

  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.estimateHead{
  flex:0 0 auto;

  padding:11px 13px 7px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.estimateHead strong{
  font-size:15px;
}

.count{
  color:var(--muted);
  font-size:11px;
}

/* ================= LIST ================= */

.list{
  min-height:0;
  flex:1;

  overflow-y:auto;
  overflow-x:hidden;

  padding:0 9px 8px;

  -webkit-overflow-scrolling:touch;
}

.section{
  margin:4px 3px 10px;
}

.sectionTitle{
  padding:5px 5px 4px;

  font-size:10px;
  font-weight:800;

  color:var(--muted);
  letter-spacing:.55px;
}

.row{
  display:grid;

  grid-template-columns:minmax(0,1fr) auto;

  gap:8px;

  align-items:center;

  padding:9px 5px;

  border-top:1px solid var(--line);
}

.name{
  font-size:14px;
  font-weight:650;

  line-height:1.2;

  overflow-wrap:anywhere;
}

.controls{
  display:flex;
  align-items:center;
  gap:6px;

  margin-top:5px;
}

.qty{
  display:flex;
  align-items:center;

  background:var(--soft);

  border-radius:9px;

  overflow:hidden;
}

.qty button{
  width:27px;
  height:27px;

  font-size:17px;

  color:#555;
}

.qty b{
  min-width:25px;

  text-align:center;

  font-size:12px;
}

.price{
  padding:0;

  color:var(--muted);

  font-size:11px;

  text-decoration:underline;
  text-underline-offset:2px;
}

.right{
  display:flex;
  align-items:center;
  gap:5px;
}

.lineTotal{
  white-space:nowrap;

  font-size:14px;
  font-weight:750;
}

.delete{
  width:27px;
  height:27px;

  border-radius:8px;

  color:#999;

  font-size:19px;
}

.delete:active{
  background:#fee;
  color:var(--red);
}

/* ================= EMPTY ================= */

.empty{
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  color:var(--muted);

  font-size:14px;

  padding:30px;
}

/* ================= BOTTOM ================= */

.bottom{
  flex:0 0 auto;

  padding:
    7px
    12px
    calc(9px + env(safe-area-inset-bottom));
}

.totalBar{
  display:flex;

  align-items:center;
  justify-content:space-between;

  padding:5px 3px 8px;
}

.totalBar span{
  color:var(--muted);
  font-size:13px;
}

.totalBar strong{
  font-size:22px;
  letter-spacing:-.5px;
}

.actions{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;
}

.action{
  height:43px;

  border-radius:14px;

  background:#fff;

  box-shadow:0 5px 18px rgba(30,40,60,.07);

  color:var(--blue);

  font-size:14px;
  font-weight:700;
}

/* ================= CATALOG SHEET ================= */

.sheet{
  position:fixed;

  inset:0;

  z-index:20;

  display:none;
  align-items:flex-end;

  background:rgba(0,0,0,.28);

  backdrop-filter:blur(5px);
}

.sheet.open{
  display:flex;
}

.panel{
  width:100%;
  max-width:560px;

  height:min(84dvh,720px);

  margin:auto;

  background:#f6f7fa;

  border-radius:22px 22px 0 0;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  padding-bottom:env(safe-area-inset-bottom);
}

.panelHead{
  flex:0 0 auto;

  padding:11px 14px 7px;

  display:flex;

  align-items:center;
  justify-content:space-between;
}

.panelHead strong{
  font-size:18px;
}

.close{
  width:32px;
  height:32px;

  font-size:28px;

  color:#777;
}

.search{
  flex:0 0 auto;

  width:calc(100% - 24px);

  margin:0 12px 8px;

  height:40px;

  border:0;
  outline:0;

  border-radius:12px;

  background:#e9ebef;

  padding:0 12px;

  font-size:14px;
}

.search:focus{
  background:#fff;

  box-shadow:
    inset 0 0 0 1.5px var(--blue);
}

/* ================= FILTERS ================= */

.filters{
  flex:0 0 auto;

  display:flex;

  gap:6px;

  overflow-x:auto;

  padding:0 12px 9px;

  white-space:nowrap;

  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  padding:7px 12px;

  border-radius:999px;

  background:#e7eaf0;

  font-size:12px;

  font-weight:700;
}

.filter.active{
  background:var(--blue);
  color:white;
}

/* ================= CATALOG ================= */

.catalog{
  min-height:0;
  flex:1;

  overflow-y:auto;

  padding:0 12px 20px;

  -webkit-overflow-scrolling:touch;
}

.catalogTitle{
  padding:5px 3px;

  color:var(--muted);

  font-size:10px;
  font-weight:800;

  letter-spacing:.5px;
}

.catalogItem{
  width:100%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  text-align:left;

  background:#fff;

  border-radius:13px;

  padding:10px 11px;

  margin:5px 0;

  box-shadow:0 2px 10px rgba(30,40,60,.045);

  transition:none;
}

.catalogItem.added{
  background:#eaf3ff;
  box-shadow:
    inset 0 0 0 1px rgba(0,122,255,.16),
    0 2px 10px rgba(0,122,255,.07);
}

.catalogName{
  font-size:14px;
  font-weight:650;
  line-height:1.2;
}

.catalogMeta{
  margin-top:3px;

  color:var(--muted);

  font-size:11px;
}

.catalogControls{
  flex:0 0 auto;

  display:flex;
  align-items:center;
  gap:4px;

  padding-left:8px;
}

.catalogQtyButton{
  width:29px;
  height:29px;

  border-radius:8px;

  background:#e7ebf1;

  color:#555;

  font-size:18px;
}

.catalogQty{
  min-width:27px;

  height:29px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  color:var(--blue);

  font-size:12px;
  font-weight:750;

  padding:0 3px;
}

.catalogQtyInput{
  width:42px;
  height:29px;

  border:0;
  outline:0;

  border-radius:8px;

  background:#fff;

  text-align:center;

  color:var(--blue);

  font-size:12px;
  font-weight:750;
}

.addIcon{
  flex:0 0 auto;

  color:var(--blue);

  font-size:22px;
  font-weight:300;

  padding-left:8px;
}

.noResults{
  text-align:center;

  color:var(--muted);

  padding:35px 20px;

  font-size:14px;
}

/* ================= MASTER ================= */

.masterSheet{
  position:fixed;

  inset:0;

  z-index:30;

  display:none;
  align-items:flex-end;

  background:rgba(0,0,0,.28);

  backdrop-filter:blur(5px);
}

.masterSheet.open{
  display:flex;
}

.masterPanel{
  width:100%;
  max-width:560px;

  margin:auto;

  background:#f6f7fa;

  border-radius:22px 22px 0 0;

  padding:
    10px
    14px
    calc(18px + env(safe-area-inset-bottom));
}

.masterHead{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:2px 0 12px;
}

.masterHead strong{
  font-size:18px;
}

.masterFields{
  display:grid;
  gap:8px;
}

.masterFields input{
  width:100%;
  height:40px;

  border:0;
  outline:0;

  border-radius:11px;

  background:#e9ebef;

  padding:0 11px;

  font-size:14px;
}

.masterFields input:focus{
  background:#fff;
  box-shadow:inset 0 0 0 1.5px var(--blue);
}

.masterSave{
  width:100%;
  height:42px;

  margin-top:10px;

  border-radius:13px;

  background:var(--blue);
  color:#fff;

  font-size:14px;
  font-weight:700;
}

/* ================= SMALL HEIGHT ================= */

@media(max-height:680px){

  .header{
    padding-top:calc(5px + env(safe-area-inset-top));
    padding-bottom:4px;
  }

  .clientWrap{
    padding-bottom:5px;
  }

  .client{
    padding:7px;
  }

  .field input{
    height:33px;
  }

  .bottom{
    padding-top:4px;
  }

  .totalBar{
    padding-top:3px;
    padding-bottom:5px;
  }

  .action{
    height:39px;
  }
}
</style>
</head>

<div class="app">

        кошторис
      </div>
    </div>

    <div class="headerRight">

        class="masterButton"

        </svg>
      </button>

    </div>

  </header>


  <!-- CLIENT -->
  <div class="clientWrap">

    <div class="client">

      <div class="fields">

        <div class="field">
          <input
            id="clientName"
            placeholder="Ім’я та прізвище"
          >
        </div>

        <div class="field">
          <input
            id="clientPhone"
            placeholder="Телефон"
            inputmode="tel"
          >
        </div>

        <div class="field full">
          <input
            id="clientAddress"
            placeholder="Адреса об’єкта"
          >
        </div>

      </div>

    </div>

  </div>


  <!-- ESTIMATE -->
  <main class="estimate">

    <div class="estimateHead">

      <strong>
        Кошторис
      </strong>

      <span
        class="count"
        id="count"
      >
        0 позицій
      </span>

    </div>


    <div
      class="list"
      id="list"
    ></div>

  </main>


  <!-- BOTTOM -->
  <div class="bottom">

    <div class="totalBar">

      <span>
        Разом
      </span>

      <strong id="grand">
        0 грн
      </strong>

    </div>


    <div class="actions">

      <button
        class="action"
        onclick="openCatalog('work')"
      >
        ＋ Робота
      </button>

      <button
        class="action"
        onclick="openCatalog('material')"
      >
        ＋ Матеріал
      </button>

    </div>

  </div>

</div>


<!-- CATALOG -->
<div
  class="sheet"
  id="sheet"
  onclick="if(event.target===this)closeCatalog()"
>

  <div class="panel">

    <div class="panelHead">

      <strong id="panelTitle">
        Додати роботу
      </strong>

      <button
        class="close"
        onclick="closeCatalog()"
      >
        ×
      </button>

    </div>


    <input
      id="search"
      class="search"
      placeholder="Пошук позиції…"
      oninput="renderCatalog()"
    >


    <div
      class="filters"
      id="filters"
    ></div>


    <div
      class="catalog"
      id="catalog"
    ></div>

  </div>

</div>


<!-- MASTER -->
<div
  class="masterSheet"
  id="masterSheet"
  onclick="if(event.target===this)closeMaster()"
>

  <div class="masterPanel">

    <div class="masterHead">

      <strong>
        Дані майстра
      </strong>

      <button
        class="close"
        onclick="closeMaster()"
      >
        ×
      </button>

    </div>

    <div class="masterFields">

      <input
        id="masterName"
        placeholder="Ім’я / назва"
      >

      <input
        id="masterPhone"
        placeholder="Телефон"
        inputmode="tel"
      >

    </div>

    <button
      class="masterSave"
      onclick="saveMaster()"
    >
      Зберегти
    </button>

  </div>

</div>

    unit:"м"
  },

  {
    id:"m-sewer-fittings",
    name:"Фітинги каналізації",
    type:"material",
    category:"sewer",
    price:0,
    unit:"компл."
  },

  {
    id:"m-valve",
    name:"Крани",
    type:"material",
    category:"fittings",
    price:0,
    unit:"шт"
  },

  {
    id:"m-reducer",
    name:"Редуктор",
    type:"material",
    category:"fittings",
    price:0,
    unit:"шт"
  },

  {
    id:"m-other",
    name:"Інше",
    type:"material",
    category:"other",
    price:0,
    unit:"шт"
  }

];


/* =========================================================
   СТАН
========================================================= */

let estimate =
  JSON.parse(
    localStorage.getItem("plumber_estimate") || "[]"
  );

let catalogMode = "work";

let catalogFilter = "all";


/* =========================================================
   ДОПОМІЖНІ
========================================================= */

function money(value){

  return new Intl.NumberFormat("uk-UA")
    .format(Math.round(value))
    + " грн";

}


function save(){

  localStorage.setItem(
    "plumber_estimate",
    JSON.stringify(estimate)
  );

}


/* =========================================================
   КОШТОРИС
========================================================= */

function renderEstimate(){

  const list =
    document.getElementById("list");


  if(!estimate.length){

    list.innerHTML = `
      <div class="empty">
        Кошторис порожній.<br>
        Додайте роботу або матеріал.
      </div>
    `;

  }else{

    let html = "";

    const rough =
      estimate.filter(
        x => x.type === "work" &&
             x.stage === "rough"
      );

    const finish =
      estimate.filter(
        x => x.type === "work" &&
             x.stage === "finish"
      );

    const materials =
      estimate.filter(
        x => x.type === "material"
      );


    if(rough.length){

      html += section(
        "ЧОРНОВИЙ МОНТАЖ",
        rough
      );

    }


    if(finish.length){

      html += section(
        "ЧИСТОВИЙ МОНТАЖ",
        finish
      );

    }


    if(materials.length){

      html += section(
        "МАТЕРІАЛИ",
        materials
      );

    }


    list.innerHTML = html;

  }


  const total =
    estimate.reduce(
      (sum,item) =>
        sum + item.price * item.qty,
      0
    );


  document.getElementById("grand")
    .textContent = money(total);


  document.getElementById("count")
    .textContent =
      estimate.length +
      " " +
      (estimate.length === 1
        ? "позиція"
        : "позицій");

}


function section(title,items){

  return `
    <div class="section">

      <div class="sectionTitle">
        ${title}
      </div>

      ${items
        .map(renderRow)
        .join("")}

    </div>
  `;

}


function renderRow(item){

  const index =
    estimate.indexOf(item);


  return `
    <div class="row">

      <div>

        <div class="name">
          ${item.name}
        </div>

        <div class="controls">

          <div class="qty">

            <button
              onclick="changeQty(${index},-1)"
            >
              −
            </button>

            <b>
              ${item.qty}
            </b>

            <button
              onclick="changeQty(${index},1)"
            >
              +
            </button>

          </div>


          <button
            class="price"
            onclick="editPrice(${index})"
          >
            ${money(item.price)} / ${item.unit}
          </button>

        </div>

      </div>


      <div class="right">

        <div class="lineTotal">
          ${money(item.price * item.qty)}
        </div>

        <button
          class="delete"
          onclick="removeItem(${index})"
        >
          ×
        </button>

      </div>

    </div>
  `;

}


/* =========================================================
   КІЛЬКІСТЬ
========================================================= */

function changeQty(index,delta){

  estimate[index].qty =
    Math.max(
      1,
      estimate[index].qty + delta
    );

  save();

  renderEstimate();

}


/* =========================================================
   ВИДАЛЕННЯ
========================================================= */

function removeItem(index){

  estimate.splice(index,1);

  save();

  renderEstimate();

}


/* =========================================================
   РЕДАГУВАННЯ ЦІНИ
========================================================= */

function editPrice(index){

  const value =
    prompt(
      "Ціна за одиницю, грн:",
      estimate[index].price
    );


  if(value === null){
    return;
  }


  const price =
    Number(
      String(value)
        .replace(",",".")
    );


  if(
    Number.isFinite(price) &&
    price >= 0
  ){

    estimate[index].price =
      price;

    save();

    renderEstimate();

  }

}


/* =========================================================
   КАТАЛОГ
========================================================= */

function openCatalog(type){

  catalogMode = type;

  catalogFilter = "all";


  document.getElementById(
    "panelTitle"
  ).textContent =
    type === "work"
      ? "Додати роботу"
      : "Додати матеріал";


  document.getElementById(
    "search"
  ).value = "";


  document.getElementById(
    "sheet"
  ).classList.add("open");


  renderFilters();

  renderCatalog();


  setTimeout(
    () =>
      document
        .getElementById("search")
        .focus(),
    100
  );

}


function closeCatalog(){

  document
    .getElementById("sheet")
    .classList.remove("open");

}


/* =========================================================
   ФІЛЬТРИ
========================================================= */

function renderFilters(){

  const box =
    document.getElementById("filters");


  if(catalogMode === "work"){

    box.innerHTML = `

      <button
        class="filter ${
          catalogFilter === "all"
            ? "active"
            : ""
        }"
        onclick="setFilter('all')"
      >
        Усі
      </button>

      <button
        class="filter ${
          catalogFilter === "rough"
            ? "active"
            : ""
        }"
        onclick="setFilter('rough')"
      >
        Чорнові
      </button>

      <button
        class="filter ${
          catalogFilter === "finish"
            ? "active"
            : ""
        }"
        onclick="setFilter('finish')"
      >
        Чистові
      </button>

    `;

  }else{

    box.innerHTML = `

      <button
        class="filter ${
          catalogFilter === "all"
            ? "active"
            : ""
        }"
        onclick="setFilter('all')"
      >
        Усі
      </button>

      <button
        class="filter ${
          catalogFilter === "water"
            ? "active"
            : ""
        }"
        onclick="setFilter('water')"
      >
        Водопостачання
      </button>

      <button
        class="filter ${
          catalogFilter === "sewer"
            ? "active"
            : ""
        }"
        onclick="setFilter('sewer')"
      >
        Каналізація
      </button>

      <button
        class="filter ${
          catalogFilter === "fittings"
            ? "active"
            : ""
        }"
        onclick="setFilter('fittings')"
      >
        Різьбова арматура
      </button>

      <button
        class="filter ${
          catalogFilter === "other"
            ? "active"
            : ""
        }"
        onclick="setFilter('other')"
      >
        Інше
      </button>

    `;

  }

}


function setFilter(filter){

  catalogFilter = filter;

  renderFilters();

  renderCatalog();

}


/* =========================================================
   КАТАЛОГ — РЕНДЕР
========================================================= */

function renderCatalog(){

  const query =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  let items =
    catalog.filter(item => {

      if(item.type !== catalogMode){
        return false;
      }


      if(
        query &&
        !item.name
          .toLowerCase()
          .includes(query)
      ){
        return false;
      }


      if(catalogFilter === "all"){
        return true;
      }


      return (
        item.stage === catalogFilter ||
        item.category === catalogFilter
      );

    });


  const box =
    document.getElementById("catalog");


  if(!items.length){

    box.innerHTML = `
      <div class="noResults">
        Нічого не знайдено
      </div>
    `;

    return;

  }


  let groups = {};


  items.forEach(item => {

    let group;


    if(item.type === "work"){

      group =
        item.stage === "rough"
          ? "Чорнові"
          : "Чистові";

    }else{

      if(item.category === "water"){
        group = "Водопостачання";
      }

      else if(item.category === "sewer"){
        group = "Каналізація";
      }

      else if(item.category === "fittings"){
        group = "Різьбова арматура";
      }

      else{
        group = "Інше";
      }

    }


    if(!groups[group]){
      groups[group] = [];
    }


    groups[group].push(item);

  });


  box.innerHTML =
    Object.entries(groups)
      .map(
        ([group,items]) => `

          <div class="catalogTitle">
            ${group}
          </div>

          ${items
            .map(
              item => {

                const existing =
                  estimate.find(
                    x => x.id === item.id
                  );

                const qty =
                  existing
                    ? existing.qty
                    : 0;

                return `

                  <div
                    class="catalogItem ${
                      qty > 0 ? "added" : ""
                    }"
                  >

                    <div
                      onclick="addItem('${item.id}')"
                      style="flex:1;min-width:0"
                    >

                      <div class="catalogName">
                        ${item.name}
                      </div>

                      <div class="catalogMeta">
                        ${
                          item.price
                            ? money(item.price)
                            : "ціна не задана"
                        }
                        ·
                        ${item.unit}
                      </div>

                    </div>

                    ${
                      qty > 0

                      ? `

                        <div class="catalogControls">

                          <button
                            class="catalogQtyButton"
                            onclick="catalogChangeQty('${item.id}',-1)"
                          >
                            −
                          </button>

                          <button
                            class="catalogQty"
                            onclick="editCatalogQty('${item.id}')"
                          >
                            ×${qty}
                          </button>

                          <button
                            class="catalogQtyButton"
                            onclick="catalogChangeQty('${item.id}',1)"
                          >
                            +
                          </button>

                        </div>

                      `

                      : `

                        <span class="addIcon">
                          ＋
                        </span>

                      `
                    }

                  </div>

                `;

              }
            )
            .join("")}

        `
      )
      .join("");

}


/* =========================================================
   ДОДАВАННЯ
========================================================= */

function addItem(id){

  const product =
    catalog.find(
      item => item.id === id
    );


  if(!product){
    return;
  }


  const existing =
    estimate.find(
      item => item.id === id
    );


  if(existing){

    existing.qty++;

  }else{

    estimate.push({
      ...product,
      qty:1
    });

  }


  save();

  renderEstimate();

  renderCatalog();

}


/* =========================================================
   КІЛЬКІСТЬ У КАТАЛОЗІ
========================================================= */

function catalogChangeQty(id,delta){

  const index =
    estimate.findIndex(
      item => item.id === id
    );


  if(index === -1){

    if(delta > 0){
      addItem(id);
    }

    return;

  }


  estimate[index].qty += delta;


  if(estimate[index].qty <= 0){

    estimate.splice(index,1);

  }


  save();

  renderEstimate();

  renderCatalog();

}


function editCatalogQty(id){

  const item =
    estimate.find(
      x => x.id === id
    );


  if(!item){
    return;
  }


  const value =
    prompt(
      "Кількість:",
      item.qty
    );


  if(value === null){
    return;
  }


  const qty =
    Number(
      String(value)
        .replace(",",".")
    );


  if(
    !Number.isFinite(qty) ||
    qty < 0
  ){
    return;
  }


  const newQty =
    Math.floor(qty);


  if(newQty <= 0){

    const index =
      estimate.indexOf(item);

    estimate.splice(index,1);

  }else{

    item.qty = newQty;

  }


  save();

  renderEstimate();

  renderCatalog();

}


/* =========================================================
   ДАНІ МАЙСТРА
========================================================= */

function openMaster(){

  document.getElementById("masterName").value =
    localStorage.getItem("plumber_masterName") || "";

  document.getElementById("masterPhone").value =
    localStorage.getItem("plumber_masterPhone") || "";

  document
    .getElementById("masterSheet")
    .classList.add("open");

}


function closeMaster(){

  document
    .getElementById("masterSheet")
    .classList.remove("open");

}


function saveMaster(){

  localStorage.setItem(
    "plumber_masterName",
    document.getElementById("masterName").value
  );

  localStorage.setItem(
    "plumber_masterPhone",
    document.getElementById("masterPhone").value
  );

  closeMaster();

}


/* =========================================================
   КЛІЄНТ
========================================================= */

[
  "clientName",
  "clientPhone",
  "clientAddress"
]
.forEach(id => {

  const input =
    document.getElementById(id);


  input.value =
    localStorage.getItem(
      "plumber_" + id
    ) || "";


  input.addEventListener(
    "input",
    () => {

      localStorage.setItem(
        "plumber_" + id,
        input.value
      );

    }
  );

});


/* =========================================================
   ДАТА
========================================================= */

document.getElementById("date")
  .textContent =
    new Date()
      .toLocaleDateString("uk-UA");


/* =========================================================
   START
========================================================= */

renderEstimate();

</script>

</body>
</html>
