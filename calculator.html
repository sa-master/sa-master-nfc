<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>sa-master.pro — Кошторис. Звітність. Аудит.</title>

<style>
:root{
  --bg:#f4f6fa;
  --card:#fff;
  --soft:#eef1f5;
  --line:#e2e5ea;
  --text:#15171a;
  --muted:#7b8088;
  --blue:#007aff;
  --red:#ff3b30;
  --green:#34c759;
  --gray-dot:#c8cbd0;
  --dark-dot:#1c1c1e;
  --shadow:0 8px 25px rgba(30,40,60,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,input,select,textarea{font:inherit}

button{
  border:0;
  background:none;
  color:inherit;
  touch-action:manipulation;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:560px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

/* ===== HEADER ===== */

.header{
  flex:0 0 auto;
  padding:calc(9px + env(safe-area-inset-top)) 14px 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--bg);
}

.logo{
  font-size:19px;
  font-weight:800;
  letter-spacing:-.4px;
  color:var(--text);
}

.logo span{
  color:var(--blue);
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:1px;
  letter-spacing:.2px;
}

.backButton{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:var(--blue);
  font-size:22px;
  box-shadow:0 3px 12px rgba(30,40,60,.06);
}

/* ===== MAIN ===== */

.main{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ===== EMPTY STATE ===== */

.emptyState{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 24px;
  text-align:center;
  overflow-y:auto;
}

.emptyLogo{
  font-size:34px;
  font-weight:850;
  letter-spacing:-1px;
  margin-bottom:6px;
}

.emptyLogo span{
  color:var(--blue);
}

.emptySubtitle{
  color:var(--muted);
  font-size:13px;
  letter-spacing:.3px;
  margin-bottom:38px;
}

.emptySteps{
  text-align:left;
  max-width:340px;
  width:100%;
  background:#fff;
  border-radius:18px;
  padding:20px 22px;
  box-shadow:var(--shadow);
  margin-bottom:22px;
}

.emptySteps ol{
  margin:0;
  padding-left:20px;
  color:#333;
  font-size:13px;
  line-height:1.7;
}

.emptySteps li{
  margin-bottom:4px;
}

.emptySteps li:last-child{
  margin-bottom:0;
}

.primaryButton{
  height:50px;
  min-width:220px;
  padding:0 22px;
  border-radius:15px;
  background:var(--blue);
  color:#fff;
  font-size:15px;
  font-weight:750;
  box-shadow:0 6px 18px rgba(0,122,255,.25);
  transition:transform .12s;
}

.primaryButton:active{
  transform:scale(.97);
}

/* ===== LIST ===== */

.listWrap{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.listHeader{
  flex:0 0 auto;
  padding:4px 18px 8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.listHeader strong{
  font-size:14px;
}

.listHeaderRight{
  display:flex;
  align-items:center;
  gap:10px;
}

.archLink{
  color:var(--blue);
  font-size:12px;
  font-weight:650;
}

.addSmallButton{
  height:32px;
  padding:0 12px;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-size:12px;
  font-weight:700;
  box-shadow:0 3px 10px rgba(0,122,255,.2);
}

.list{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:0 12px 20px;
}

.list::-webkit-scrollbar{
  display:none;
}

/* ===== PROJECT CARD ===== */

.projectCard{
  background:#fff;
  border-radius:15px;
  padding:13px 14px;
  margin-bottom:8px;
  box-shadow:0 3px 13px rgba(30,40,60,.05);
  display:flex;
  gap:11px;
  align-items:flex-start;
  transition:transform .1s;
}

.projectCard:active{
  transform:scale(.99);
}

.projectDot{
  flex:0 0 auto;
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--gray-dot);
  margin-top:6px;
}

.projectDot.status-estimate{ background:var(--gray-dot) }
.projectDot.status-work{ background:var(--green) }
.projectDot.status-done{ background:var(--dark-dot) }

.projectBody{
  flex:1 1 auto;
  min-width:0;
}

.projectTitle{
  font-size:15px;
  font-weight:750;
  line-height:1.25;
  overflow-wrap:anywhere;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}

.projectUrgent{
  flex:0 0 auto;
  font-size:14px;
  line-height:1;
}

.projectClient{
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
  line-height:1.3;
  overflow-wrap:anywhere;
}

.projectAddress{
  margin-top:1px;
  color:var(--muted);
  font-size:12px;
  line-height:1.3;
  overflow-wrap:anywhere;
}

.projectDivider{
  height:1px;
  background:var(--line);
  margin:9px 0 8px;
}

.projectMeta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
  color:#444;
}

.projectStage{
  font-weight:650;
}

.projectAmount{
  font-weight:750;
  color:var(--text);
  white-space:nowrap;
}

.projectDetails{
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
  line-height:1.35;
  overflow-wrap:anywhere;
}

/* ===== SHEET (MОДАЛКА) ===== */

.sheet{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.32);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.sheet.open{
  display:flex;
}

.panel{
  width:100%;
  max-width:560px;
  max-height:88dvh;
  margin:auto;
  background:#f6f7fa;
  border-radius:22px 22px 0 0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
  animation:slideUp .22s ease-out;
}

@keyframes slideUp{
  from{ transform:translateY(30px); opacity:0 }
  to{ transform:translateY(0); opacity:1 }
}

.panelHead{
  flex:0 0 auto;
  padding:13px 16px 8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panelHead strong{
  font-size:18px;
}

.close{
  width:34px;
  height:34px;
  border-radius:50%;
  font-size:26px;
  color:#777;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
}

.panelBody{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:0 14px 14px;
}

.panelFooter{
  flex:0 0 auto;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  display:flex;
  gap:8px;
  border-top:1px solid var(--line);
  background:#f6f7fa;
}

.panelFooter button{
  flex:1;
  height:46px;
  border-radius:13px;
  font-size:14px;
  font-weight:750;
}

.btnGhost{
  background:#e9ebef;
  color:#555;
}

.btnPrimary{
  background:var(--blue);
  color:#fff;
}

/* ===== FORM ===== */

.formGroup{
  margin-bottom:12px;
}

.formLabel{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin:0 4px 5px;
  font-weight:600;
  letter-spacing:.2px;
}

.formInput,
.formTextarea{
  width:100%;
  border:0;
  outline:0;
  border-radius:12px;
  background:#fff;
  padding:0 12px;
  font-size:14px;
  color:var(--text);
  box-shadow:0 1px 4px rgba(30,40,60,.04);
}

.formInput{
  height:44px;
}

.formTextarea{
  padding:11px 12px;
  min-height:60px;
  resize:vertical;
  line-height:1.35;
}

.formInput:focus,
.formTextarea:focus{
  box-shadow:inset 0 0 0 1.5px var(--blue);
}

.formRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.formHint{
  margin:4px 4px 0;
  color:var(--muted);
  font-size:10.5px;
  line-height:1.35;
}

/* ===== EMPTY PROJECT ===== */

.emptyProject{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  padding:20px 16px;
  overflow-y:auto;
}

.projectHeaderCard{
  background:#fff;
  border-radius:16px;
  padding:15px 16px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}

.projectHeaderTitle{
  font-size:17px;
  font-weight:800;
  line-height:1.25;
  overflow-wrap:anywhere;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.projectHeaderMeta{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.projectHeaderMeta b{
  color:#333;
  font-weight:650;
}

.placeholderBlock{
  background:#fff;
  border-radius:16px;
  padding:26px 22px;
  box-shadow:var(--shadow);
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.placeholderBlock strong{
  display:block;
  color:var(--text);
  font-size:15px;
  margin-bottom:6px;
}

/* ===== TOAST ===== */

.toast{
  position:fixed;
  left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  background:#1c1c1e;
  color:#fff;
  padding:10px 18px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s, transform .2s;
  z-index:100;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ===== UTIL ===== */

.hidden{ display:none !important }

@media(max-width:390px){
  .logo{ font-size:17px }
  .emptyLogo{ font-size:30px }
  .projectTitle{ font-size:14px }
}
</style>
</head>

<body>

<div class="app">

  <header class="header" id="appHeader">
    <div>
      <div class="logo">sa-master<span>.pro</span></div>
      <div class="subtitle" id="headerSubtitle">Кошторис. Звітність. Аудит.</div>
    </div>
    <div id="headerRight"></div>
  </header>

  <main class="main" id="main"></main>

</div>

<!-- SHEET: NEW PROJECT -->

<div class="sheet" id="newProjectSheet">
  <div class="panel">

    <div class="panelHead">
      <strong>Новий об'єкт</strong>
      <button class="close" onclick="closeNewProject()">×</button>
    </div>

    <div class="panelBody">

      <div class="formGroup">
        <label class="formLabel">Коротка назва (необов'язково)</label>
        <input
          class="formInput"
          id="npTitle"
          placeholder="Напр. Печерськ"
          autocomplete="off"
        >
        <div class="formHint">Якщо не вказати — використаємо адресу або ім'я замовника</div>
      </div>

      <div class="formGroup">
        <label class="formLabel">Ім'я замовника *</label>
        <input
          class="formInput"
          id="npClientName"
          placeholder="Іван Петренко"
          autocomplete="off"
        >
      </div>

      <div class="formGroup">
        <label class="formLabel">Телефон замовника *</label>
        <input
          class="formInput"
          id="npClientPhone"
          placeholder="+380 67 123 45 67"
          inputmode="tel"
          autocomplete="off"
        >
      </div>

      <div class="formGroup">
        <label class="formLabel">Адреса / позначення об'єкта</label>
        <textarea
          class="formTextarea"
          id="npAddress"
          placeholder="ЖК Comfort Town, літ. Б, кв. 45 або Котельня, Вінниця"
          autocomplete="off"
        ></textarea>
        <div class="formHint">Деталі об'єкта (тип, площа, санвузли) заповнимо пізніше</div>
      </div>

    </div>

    <div class="panelFooter">
      <button class="btnGhost" onclick="closeNewProject()">Скасувати</button>
      <button class="btnPrimary" onclick="createProject()">Створити</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   STORAGE
========================================================= */

const PROJECTS_KEY = "sa_projects";

let projects = [];

try{
  const raw = localStorage.getItem(PROJECTS_KEY);
  const parsed = raw ? JSON.parse(raw) : [];
  if(Array.isArray(parsed)) projects = parsed;
}catch(e){
  console.warn("Не вдалося прочитати projects:", e);
  projects = [];
}

function saveProjects(){
  try{
    localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));
  }catch(e){
    console.warn("Не вдалося зберегти projects:", e);
  }
}

/* Ідентифікатор активної сесії — який об'єкт зараз відкритий */
let currentProjectId = null;

/* =========================================================
   UTILS
========================================================= */

function uid(prefix){
  return (prefix || "id") + "-" + Date.now() + "-" + Math.random().toString(36).slice(2,7);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2200);
}

function money(value){
  const n = Number(value) || 0;
  return new Intl.NumberFormat("uk-UA").format(Math.round(n)) + " ₴";
}

/* =========================================================
   RENDER — ROUTER
========================================================= */

function render(){
  renderHeader();

  if(currentProjectId){
    const project = projects.find(p => p.id === currentProjectId);
    if(!project){
      currentProjectId = null;
      renderHome();
      return;
    }
    renderProject(project);
  }else{
    renderHome();
  }
}

function renderHeader(){
  const right = document.getElementById("headerRight");
  const subtitle = document.getElementById("headerSubtitle");

  if(currentProjectId){
    subtitle.textContent = "Об'єкт";
    right.innerHTML = `
      <button class="backButton" onclick="backToList()" aria-label="Назад">←</button>
    `;
  }else{
    subtitle.textContent = "Кошторис. Звітність. Аудит.";
    right.innerHTML = "";
  }
}

/* =========================================================
   RENDER — HOME
========================================================= */

function renderHome(){
  const main = document.getElementById("main");

  if(!projects.length){
    main.innerHTML = renderEmptyState();
    return;
  }

  main.innerHTML = renderProjectList();
}

function renderEmptyState(){
  return `
    <div class="emptyState">

      <div class="emptyLogo">sa-master<span>.pro</span></div>
      <div class="emptySubtitle">Кошторис. Звітність. Аудит.</div>

      <div class="emptySteps">
        <ol>
          <li>Створіть перший об'єкт</li>
          <li>Внесіть дані про себе та команду</li>
          <li>Складіть кошторис</li>
          <li>Відправте замовнику</li>
          <li>Ведіть роботу до завершення</li>
        </ol>
      </div>

      <button class="primaryButton" onclick="openNewProject()">
        + Створити перший об'єкт
      </button>

    </div>
  `;
}

function renderProjectList(){
  const sorted = projects.slice().sort(sortProjects);

  return `
    <div class="listWrap">

      <div class="listHeader">
        <strong>Об'єкти (${projects.length})</strong>
        <div class="listHeaderRight">
          <button class="addSmallButton" onclick="openNewProject()">+ Об'єкт</button>
        </div>
      </div>

      <div class="list">
        ${sorted.map(renderProjectCard).join("")}
      </div>

    </div>
  `;
}

function sortProjects(a,b){
  // Термінові — вгору
  if(a.urgent && !b.urgent) return -1;
  if(!a.urgent && b.urgent) return 1;
  // Далі — за датою оновлення
  return String(b.updatedAt || "").localeCompare(String(a.updatedAt || ""));
}

function renderProjectCard(p){
  const dotClass = projectStageClass(p);
  const title = projectTitle(p);
  const client = escapeHtml(p.client?.name || "");
  const phone = escapeHtml(p.client?.phone || "");
  const address = escapeHtml(p.client?.address || "");

  const urgentMark = p.urgent ? `<span class="projectUrgent" title="Терміново">🔥</span>` : "";

  // Мета-рядок (етап + сума) — поки що заглушка
  const stageLabel = projectStageLabel(p);
  const amount = p._total != null ? money(p._total) : "";

  // Деталі — поки що порожні
  const details = p._detailsLine || "";

  return `
    <div class="projectCard" onclick="openProject('${escapeHtml(p.id)}')">

      <span class="projectDot ${dotClass}"></span>

      <div class="projectBody">

        <div class="projectTitle">
          <span>${title}</span>
          ${urgentMark}
        </div>

        ${client ? `
          <div class="projectClient">
            ${client}${phone ? " · " + phone : ""}
          </div>
        ` : ""}

        ${address ? `
          <div class="projectAddress">${address}</div>
        ` : ""}

        <div class="projectDivider"></div>

        <div class="projectMeta">
          <span class="projectStage">${escapeHtml(stageLabel)}</span>
          ${amount ? `<span class="projectAmount">${amount}</span>` : ""}
        </div>

        ${details ? `<div class="projectDetails">${escapeHtml(details)}</div>` : ""}

      </div>

    </div>
  `;
}

function projectTitle(p){
  if(p.title && String(p.title).trim()){
    return escapeHtml(p.title.trim());
  }
  if(p.client?.address && String(p.client.address).trim()){
    return escapeHtml(p.client.address.trim());
  }
  if(p.client?.name && String(p.client.name).trim()){
    return escapeHtml(p.client.name.trim());
  }
  return "Без назви";
}

function projectStageClass(p){
  const s = p.stage || "estimate";
  if(s === "work" || s === "complete") return "status-work";
  if(s === "done" || s === "closed") return "status-done";
  return "status-estimate";
}

function projectStageLabel(p){
  const s = p.stage || "estimate";
  switch(s){
    case "estimate": return "Прорахунок";
    case "work":     return "В роботі";
    case "done":     return "Завершено";
    case "closed":   return "Закрито";
    default:         return "Прорахунок";
  }
}

/* =========================================================
   RENDER — PROJECT
========================================================= */

function renderProject(p){
  const main = document.getElementById("main");

  const title = projectTitle(p);
  const client = escapeHtml(p.client?.name || "");
  const phone = escapeHtml(p.client?.phone || "");
  const address = escapeHtml(p.client?.address || "");
  const stageLabel = projectStageLabel(p);

  main.innerHTML = `
    <div class="emptyProject">

      <div class="projectHeaderCard">

        <div class="projectHeaderTitle">
          <span>${title}</span>
          ${p.urgent ? `<span class="projectUrgent">🔥</span>` : ""}
        </div>

        <div class="projectHeaderMeta">
          ${client ? `<b>${client}</b>${phone ? " · " + phone : ""}<br>` : ""}
          ${address ? `${address}<br>` : ""}
          <span style="color:var(--muted)">${escapeHtml(stageLabel)}</span>
        </div>

      </div>

      <div class="placeholderBlock">
        <strong>Об'єкт створено</strong>
        Тут буде кошторис, статуси та фінанси.<br>
        Наступний крок — додати позиції.
      </div>

    </div>
  `;
}

/* =========================================================
   ACTIONS
========================================================= */

function backToList(){
  currentProjectId = null;
  render();
}

function openProject(id){
  currentProjectId = id;
  render();
}

function openNewProject(){
  document.getElementById("npTitle").value = "";
  document.getElementById("npClientName").value = "";
  document.getElementById("npClientPhone").value = "";
  document.getElementById("npAddress").value = "";
  document.getElementById("newProjectSheet").classList.add("open");
  setTimeout(() => document.getElementById("npClientName").focus(), 200);
}

function closeNewProject(){
  document.getElementById("newProjectSheet").classList.remove("open");
}

function createProject(){
  const title = document.getElementById("npTitle").value.trim();
  const name = document.getElementById("npClientName").value.trim();
  const phone = document.getElementById("npClientPhone").value.trim();
  const address = document.getElementById("npAddress").value.trim();

  if(!name){
    toast("Вкажіть ім'я замовника");
    return;
  }

  if(!phone){
    toast("Вкажіть телефон замовника");
    return;
  }

  const now = new Date().toISOString();

  const project = {
    id: uid("proj"),
    title,
    client: { name, phone, address },

    stage: "estimate",
    urgent: false,

    // Кошик (порожній на старті)
    positions: [],
    discount: 0,
    payments: [],
    expenses: [],
    salaries: [],

    // Деталі об'єкта (порожні на старті)
    details: {
      objectType: "",
      workType: "",
      area: null,
      bathrooms: null,
      system: "",
      features: []
    },

    status: {
      pricesConfirmed: false,
      clientApproved: false,
      advanceReceived: false,
      materialsPurchased: false,
      workStarted: false,
      workFinished: false,
      closed: false
    },

    createdAt: now,
    updatedAt: now
  };

  projects.push(project);
  saveProjects();

  closeNewProject();
  currentProjectId = project.id;
  render();

  toast("Об'єкт створено");
}

/* =========================================================
   INIT
========================================================= */

render();

/* Клік по фону модалки — закриває */
document.getElementById("newProjectSheet").addEventListener("click", e => {
  if(e.target === e.currentTarget) closeNewProject();
});

</script>
