<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Калькулятор сантехніка</title>
<meta name="description" content="Калькулятор вартості сантехнічних робіт.">

<style>
:root{
  --bg:#f2f2f7;
  --card:rgba(255,255,255,.86);
  --solid:#fff;
  --text:#111;
  --muted:#777;
  --line:rgba(0,0,0,.09);
  --blue:#007aff;
  --blue-soft:rgba(0,122,255,.10);
  --red:#ff3b30;
  --control-bg:rgba(255,255,255,.92);
  --shadow:0 10px 35px rgba(0,0,0,.08);
}

html[data-theme="dark"]{
  --bg:#101114;
  --card:rgba(29,30,35,.90);
  --solid:#1d1e23;
  --text:#f5f5f7;
  --muted:#999;
  --line:rgba(255,255,255,.11);
  --blue:#0a84ff;
  --blue-soft:rgba(10,132,255,.17);
  --red:#ff453a;
  --control-bg:#292b31;
  --shadow:0 10px 35px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  min-height:100%;
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
}

body{
  min-height:100dvh;
  padding:
    max(12px,env(safe-area-inset-top))
    12px
    max(12px,env(safe-area-inset-bottom))
    12px;
  overflow:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  color:inherit;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:560px;
  height:calc(
    100dvh -
    max(12px,env(safe-area-inset-top)) -
    max(12px,env(safe-area-inset-bottom))
  );
  margin:0 auto;
  display:flex;
  flex-direction:column;
}

.header{
  flex:0 0 auto;
  min-height:50px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.brand{
  min-width:0;
}

.brand-title{
  font-size:22px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.7px;
}

.brand-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  line-height:1.1;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:6px;
}

.header-btn{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:50%;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  font-size:17px;
  display:grid;
  place-items:center;
}

.header-btn:active{
  background:var(--blue);
  color:#fff;
}

.main-card{
  min-height:0;
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  padding:10px;
}

.project-bar{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-bottom:8px;
}

.project-field{
  min-width:0;
  height:34px;
  border:1px solid var(--line);
  border-radius:10px;
  background:rgba(120,120,128,.07);
  color:var(--text);
  padding:0 9px;
  outline:none;
  font-size:11px;
}

.project-field:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}

.tabs{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  padding:4px;
  margin-bottom:9px;
  background:rgba(120,120,128,.10);
  border-radius:13px;
}

.tab{
  min-height:34px;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:750;
}

.tab.active{
  background:var(--solid);
  color:var(--text);
  box-shadow:0 2px 7px rgba(0,0,0,.08);
}

.section-head{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:27px;
  margin:0 2px 5px;
}

.section-title{
  font-size:11px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.45px;
}

.section-action{
  color:var(--blue);
  background:transparent;
  font-size:11px;
  font-weight:700;
  padding:4px 2px;
}

.estimate-list{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:0 1px 2px 0;
  scrollbar-width:thin;
}

.estimate-row{
  flex:0 0 47px;
  min-height:47px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  align-items:center;
  gap:5px;
  padding:5px 6px 5px 9px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(120,120,128,.055);
}

.estimate-info{
  min-width:0;
  cursor:pointer;
}

.estimate-name{
  font-size:12px;
  line-height:1.15;
  font-weight:680;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.estimate-meta{
  margin-top:2px;
  color:var(--muted);
  font-size:9px;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.qty-control{
  height:29px;
  display:flex;
  align-items:center;
  gap:1px;
  padding:2px;
  border-radius:8px;
  background:rgba(120,120,128,.10);
  border:1px solid var(--line);
}

.qty-btn{
  width:25px;
  height:25px;
  flex:0 0 25px;
  border-radius:6px;
  background:var(--control-bg);
  border:1px solid var(--line);
  color:var(--blue);
  font-size:16px;
  font-weight:850;
  display:grid;
  place-items:center;
  line-height:1;
}

.qty-btn:active{
  background:var(--blue);
  color:#fff;
}

.qty-value{
  min-width:21px;
  text-align:center;
  font-size:11px;
  font-weight:800;
}

.estimate-price{
  min-width:67px;
  text-align:right;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.estimate-remove{
  width:30px;
  height:30px;
  flex:0 0 30px;
  border-radius:8px;
  background:rgba(120,120,128,.08);
  border:1px solid var(--line);
  color:var(--muted);
  font-size:20px;
  font-weight:500;
  display:grid;
  place-items:center;
  line-height:1;
  padding:0;
}

.estimate-remove:active{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}

.empty{
  min-height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px dashed var(--line);
  border-radius:13px;
  color:var(--muted);
  font-size:11px;
  padding:12px;
}

.bottom-panel{
  flex:0 0 auto;
  padding-top:7px;
}

.total-box{
  min-height:49px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 11px;
  border-radius:13px;
  background:var(--blue-soft);
}

.total-label{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.total-value{
  font-size:19px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.4px;
  white-space:nowrap;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:6px;
}

.action-btn{
  min-height:37px;
  border-radius:11px;
  background:rgba(120,120,128,.09);
  border:1px solid var(--line);
  font-size:11px;
  font-weight:750;
}

.action-btn.primary{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

.catalog-open{
  width:100%;
  min-height:42px;
  margin-top:6px;
  border-radius:12px;
  background:var(--blue);
  color:#fff;
  font-size:13px;
  font-weight:800;
  box-shadow:0 5px 16px rgba(0,122,255,.18);
}

.print-total{
  display:none;
}


/* =========================================================
   MODALS
========================================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:10px;
  background:rgba(0,0,0,.28);
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(560px,100%);
  max-height:92dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:var(--solid);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:23px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.sheet-head{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 14px 9px;
}

.sheet-title{
  font-size:17px;
  font-weight:850;
  letter-spacing:-.3px;
}

.close-btn{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:50%;
  background:rgba(120,120,128,.12);
  border:1px solid var(--line);
  color:var(--text);
  font-size:25px;
  font-weight:400;
  display:grid;
  place-items:center;
  line-height:1;
  padding:0;
}

.close-btn:active{
  background:var(--blue);
  color:#fff;
}

.catalog-body{
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:0 13px 13px;
}

.search{
  flex:0 0 auto;
  width:100%;
  height:40px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  background:rgba(120,120,128,.07);
  color:var(--text);
  padding:0 12px;
  font-size:13px;
  margin-bottom:8px;
}

.search:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}

.catalog-tabs{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  padding:4px;
  background:rgba(120,120,128,.10);
  border-radius:12px;
  margin-bottom:8px;
}

.catalog-tab{
  height:32px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  font-weight:750;
}

.catalog-tab.active{
  background:var(--solid);
  color:var(--text);
  box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.work-list{
  height:430px;
  min-height:360px;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding-right:2px;
  scrollbar-width:thin;
}

.work-item{
  width:100%;
  min-height:60px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:9px;
  padding:7px 8px 7px 10px;
  margin-bottom:5px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(120,120,128,.055);
  text-align:left;
  cursor:pointer;
}

.work-item:active{
  transform:scale(.99);
  background:var(--blue-soft);
}

.work-item:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:2px;
}

.work-info{
  min-width:0;
}

.work-name{
  font-size:12px;
  line-height:1.2;
  font-weight:700;
}

.work-meta{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
  line-height:1;
}

.work-price{
  color:var(--blue);
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.work-control{
  display:flex;
  align-items:center;
  gap:2px;
  height:30px;
  padding:2px;
  border-radius:8px;
  background:var(--blue-soft);
  border:1px solid var(--line);
}

.work-control button{
  width:25px;
  height:25px;
  flex:0 0 25px;
  border-radius:6px;
  background:var(--control-bg);
  border:1px solid var(--line);
  color:var(--blue);
  font-size:17px;
  font-weight:900;
  display:grid;
  place-items:center;
  line-height:1;
  padding:0;
}

.work-control button:active{
  background:var(--blue);
  color:#fff;
}

.work-control span{
  min-width:20px;
  text-align:center;
  color:var(--text);
  font-size:11px;
  font-weight:850;
}

.catalog-footer{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding-top:8px;
}

.catalog-count{
  color:var(--muted);
  font-size:10px;
}

.new-work-btn{
  min-height:35px;
  padding:0 12px;
  border-radius:10px;
  background:rgba(120,120,128,.10);
  border:1px solid var(--line);
  color:var(--blue);
  font-size:11px;
  font-weight:750;
}

.form-body{
  padding:0 14px 14px;
  overflow-y:auto;
}

.field{
  margin-bottom:10px;
}

.field label{
  display:block;
  margin:0 0 5px 2px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
}

.input,
.textarea{
  width:100%;
  min-height:42px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
  background:rgba(120,120,128,.07);
  color:var(--text);
  padding:0 11px;
  font-size:13px;
}

.textarea{
  min-height:70px;
  padding:10px 11px;
  resize:none;
}

.input:focus,
.textarea:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}

.form-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:5px;
}

.form-btn{
  min-height:41px;
  border-radius:11px;
  background:rgba(120,120,128,.09);
  border:1px solid var(--line);
  font-size:12px;
  font-weight:750;
}

.form-btn.primary{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

.form-btn.danger{
  color:var(--red);
}

.price-current{
  margin:0 0 10px;
  padding:10px 11px;
  border-radius:11px;
  background:var(--blue-soft);
  font-size:12px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:max(18px,env(safe-area-inset-bottom));
  z-index:3000;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:9px 13px;
  border-radius:11px;
  background:#222;
  color:#fff;
  font-size:11px;
  font-weight:650;
  transition:.22s ease;
  max-width:calc(100vw - 30px);
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-height:700px){

  .header{
    min-height:44px;
    margin-bottom:6px;
  }

  .brand-title{
    font-size:20px;
  }

  .header-btn{
    width:35px;
    height:35px;
    flex-basis:35px;
  }

  .main-card{
    padding:8px;
  }

  .estimate-row{
    flex-basis:44px;
    min-height:44px;
  }

  .work-list{
    height:390px;
    min-height:330px;
  }
}

@media(max-width:380px){

  .estimate-row{
    grid-template-columns:minmax(0,1fr) auto auto;
  }

  .estimate-price{
    grid-column:2;
    grid-row:1;
    min-width:60px;
  }

  .qty-control{
    grid-column:2;
    grid-row:2;
  }

  .estimate-remove{
    grid-column:3;
    grid-row:1 / span 2;
  }

  .estimate-name{
    font-size:11px;
  }

  .estimate-meta{
    font-size:8px;
  }
}


/* =========================================================
   PRINT / PDF
========================================================= */

@media print{

  @page{
    size:auto;
    margin:12mm;
  }

  html,
  body{
    width:auto;
    height:auto;
    min-height:0;
    overflow:visible;
    background:#fff!important;
    color:#111!important;
    padding:0;
  }

  .app{
    width:100%;
    max-width:none;
    height:auto;
    margin:0;
  }

  .header{
    margin-bottom:14px;
  }

  .header-actions,
  .project-bar,
  .tabs,
  .section-action,
  .bottom-panel,
  .modal,
  .toast{
    display:none!important;
  }

  .main-card{
    display:block;
    width:100%;
    border:0;
    border-radius:0;
    box-shadow:none;
    background:#fff!important;
    padding:0;
  }

  .brand-title{
    color:#111!important;
  }

  .brand-sub{
    color:#666!important;
  }

  .section-head{
    margin-bottom:8px;
  }

  .section-title{
    color:#555!important;
  }

  .estimate-list{
    display:block;
    overflow:visible;
    height:auto;
    max-height:none;
    padding:0;
  }

  .estimate-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    width:100%;
    min-height:38px;
    height:auto;
    break-inside:avoid;
    page-break-inside:avoid;
    background:#fff!important;
    border-color:#ddd!important;
    color:#111!important;
    padding:7px 8px;
    margin-bottom:5px;
  }

  .estimate-name{
    color:#111!important;
  }

  .estimate-meta{
    color:#666!important;
  }

  .estimate-price{
    color:#111!important;
    min-width:80px;
  }

  .estimate-remove,
  .qty-control{
    display:none!important;
  }

  .empty{
    color:#666!important;
    border-color:#ccc!important;
  }

  .print-total{
    display:flex!important;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    width:100%;
    margin-top:18px;
    padding:12px 14px;
    border:1px solid #ccc;
    border-radius:10px;
    background:#f1f5ff!important;
    color:#111!important;
    break-inside:avoid;
    page-break-inside:avoid;
  }

  .print-total-label{
    font-size:13px;
    font-weight:700;
    color:#444!important;
  }

  .print-total-value{
    font-size:18px;
    line-height:1;
    font-weight:850;
    color:#111!important;
    white-space:nowrap;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand">

    <div id="brandTitle" class="brand-title">
      Калькулятор сантехніка
    </div>

    <div id="brandSub" class="brand-sub">
      Кошторис вартості робіт
    </div>

  </div>

  <div class="header-actions">

    <button
      id="settingsButton"
      class="header-btn"
      type="button"
      aria-label="Налаштування"
    >⚙</button>

    <button
      id="themeButton"
      class="header-btn"
      type="button"
      aria-label="Змінити тему"
    >☾</button>

  </div>

</header>

<main class="main-card">

  <div class="project-bar">

    <input
      id="clientInput"
      class="project-field"
      type="text"
      placeholder="Клієнт"
      autocomplete="off"
    >

    <input
      id="objectInput"
      class="project-field"
      type="text"
      placeholder="Об'єкт"
      autocomplete="off"
    >

  </div>

  <div class="tabs">

    <button
      id="roughTab"
      class="tab active"
      type="button"
    >Чорнові</button>

    <button
      id="finishTab"
      class="tab"
      type="button"
    >Чистові</button>

  </div>

  <div class="section-head">

    <div class="section-title">
      Додані роботи
    </div>

    <button
      id="clearEstimateBtn"
      class="section-action"
      type="button"
    >Очистити</button>

  </div>

  <div id="estimateList" class="estimate-list"></div>

  <div class="print-total">

    <div class="print-total-label">
      Загальна вартість робіт
    </div>

    <div
      id="printTotalValue"
      class="print-total-value"
    >0 ₴</div>

  </div>

  <div class="bottom-panel">

/* =========================================================
   STATE
========================================================= */

let db={
  rough:[],

/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function esc(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(value){

  return Number(value||0)
    .toLocaleString("uk-UA")+" ₴";
}

function uid(){

  return Date.now().toString(36)+
    Math.random().toString(36).slice(2,7);
}

function showToast(message){

  const el=$("toast");

  if(!el)return;

  el.textContent=message;
  el.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer=setTimeout(()=>{

    el.classList.remove("show");

  },1800);
}


/* =========================================================
   PROFILE
========================================================= */

const defaultProfile={
  brand:"SA-MASTER.PRO",
  name:"Сергій Мельник",
  phone:"0979111871",
  details:"",
  logo:""
};

function loadProfile(){

  try{

    const raw=
      localStorage.getItem(
        "plumber_calc_profile"
      );

    if(!raw){

      localStorage.setItem(
        "plumber_calc_profile",
        JSON.stringify(defaultProfile)
      );

      return {...defaultProfile};
    }

    const data=JSON.parse(raw);

    return{
      ...defaultProfile,
      ...(data&&typeof data==="object"?data:{})
    };

  }catch{

    return {...defaultProfile};
  }
}

function saveProfile(){

  try{

    localStorage.setItem(
      "plumber_calc_profile",
      JSON.stringify(profile)
    );

  }catch(error){

    console.warn(
      "Не вдалося зберегти профіль:",
      error
    );
  }
}

  $("brandTitle").textContent=
    profile.brand||
    PRODUCT.name;

  $("brandSub").textContent=
    profile.brand
      ? "Калькулятор вартості робіт"
      : "Калькулятор сантехніка";
}


/* =========================================================
   CATALOG
========================================================= */

function cloneDefaults(){

  return{

    rough:
      defaultDB.rough.map(
        item=>({...item})
      ),

    finish:
      defaultDB.finish.map(
        item=>({...item})
      )

  };
}


function normalizeCatalog(data){

  const source=
    data&&typeof data==="object"
      ? data
      : {};

  const result={

    rough:
      Array.isArray(source.rough)
        ? source.rough
            .filter(Boolean)
            .map(item=>({...item}))
        : [],

    finish:
      Array.isArray(source.finish)
        ? source.finish
            .filter(Boolean)
            .map(item=>({...item}))
        : []

  };

  ["rough","finish"].forEach(category=>{

    defaultDB[category].forEach(defaultItem=>{

      const exists=
        result[category].some(
          item=>item.id===defaultItem.id
        );

      if(!exists){

        result[category].push({
          ...defaultItem
        });

      }

    });

  });

  result.rough=
    result.rough.filter(
      item=>
        item.id!=="f4" &&
        item.id!=="f8"
    );

  return result;
}


function loadDB(){

  let stored=null;

  try{

    const raw=
      localStorage.getItem(
        "plumber_calc_catalog"
      );

    if(raw){
      stored=JSON.parse(raw);
    }

  }catch(error){

    console.warn(
      "Помилка читання каталогу:",
      error
    );

  }

  if(
    !stored ||
    typeof stored!=="object"
  ){

    try{

      const old=
        localStorage.getItem(
          "samaster_db"
        );

      if(old){
        stored=JSON.parse(old);
      }

    }catch{}

  }

  const result=
    normalizeCatalog(stored);

  try{

    localStorage.setItem(
      "plumber_calc_catalog",
      JSON.stringify(result)
    );

  }catch{}

  return result;
}


function saveDB(){

  db=normalizeCatalog(db);

  try{

    localStorage.setItem(
      "plumber_calc_catalog",
      JSON.stringify(db)
    );

  }catch(error){

    console.warn(
      "Помилка збереження каталогу:",
      error
    );

  }
}


function ensureCatalog(){

  db=normalizeCatalog(db);

  return db;
}


/* =========================================================
   ESTIMATE
========================================================= */

function migrateEstimate(data){

  if(!Array.isArray(data)){
    return [];
  }

  return data
    .filter(Boolean)
    .map(item=>({...item}))
    .map(item=>{

      if(item.workId==="r19"){

        return{
          ...item,
          workId:"f4",
          cat:"finish",
          name:"Монтаж душової системи",
          unit:item.unit||"шт"
        };

      }

      if(item.workId==="r20"){

        return{
          ...item,
          workId:"f8",
          cat:"finish",
          name:"Монтаж рушникосушки",
          unit:item.unit||"шт"
        };

      }

      return item;

    });
}


function loadEstimate(){

  let data=null;

  try{

    const raw=
      localStorage.getItem(
        "plumber_calc_estimate"
      );

    if(raw){
      data=JSON.parse(raw);
    }

  }catch{}

  if(!Array.isArray(data)){

    try{

      const old=
        localStorage.getItem(
          "samaster_estimate"
        );

      if(old){
        data=JSON.parse(old);
      }

    }catch{}

  }

  return migrateEstimate(
    Array.isArray(data)
      ? data
      : []
  );
}


function saveEstimate(){

  try{

    localStorage.setItem(
      "plumber_calc_estimate",
      JSON.stringify(estimate)
    );

  }catch{}

  savePassportEstimate();

  window.dispatchEvent(
    new CustomEvent(
      "plumber:estimate-updated",
      {
        detail:{estimate}
      }
    )
  );
}


function findWork(workId){

  ensureCatalog();

  for(
    const category of ["rough","finish"]
  ){

    const item=
      db[category].find(
        work=>work.id===workId
      );

    if(item){

      return{
        ...item,
        cat:category
      };

    }

  }

  return null;
}


function getEstimateTotal(){

  return estimate.reduce(
    (sum,item)=>
      sum+
      Number(item.price||0)*
      Number(item.qty||0),
    0
  );
}


/* =========================================================
   PROJECT
========================================================= */

function loadProject(){

  try{

    const raw=
      localStorage.getItem(
        "plumber_calc_project"
      );

    if(!raw){

      return{
        client:"",
        object:""
      };

    }

    const data=JSON.parse(raw);

    return{
      client:"",
      object:"",
      ...(data&&typeof data==="object"?data:{})
    };

  }catch{

    return{
      client:"",
      object:""
    };

  }
}

let project=loadProject();


function updateProject(){

  project.client=
    $("clientInput").value.trim();

  project.object=
    $("objectInput").value.trim();

  try{

    localStorage.setItem(
      "plumber_calc_project",
      JSON.stringify(project)
    );

  }catch{}

  savePassportEstimate();
}


function renderProject(){

  $("clientInput").value=
    project.client||"";

  $("objectInput").value=
    project.object||"";
}


/* =========================================================
   PASSPORT
========================================================= */

function getEstimateId(){

  let id=
    localStorage.getItem(
      "plumber_calc_estimate_id"
    );

  if(!id){

    id=
      "PL-"+
      Date.now()
        .toString(36)
        .toUpperCase();

    localStorage.setItem(
      "plumber_calc_estimate_id",
      id
    );

  }

  return id;
}


function getCreatedAt(){

  let value=
    localStorage.getItem(
      "plumber_calc_estimate_created"
    );

  if(!value){

    value=
      new Date().toISOString();

    localStorage.setItem(
      "plumber_calc_estimate_created",
      value
    );

  }

  return value;
}


function savePassportEstimate(){

  if(!profile){
    return;
  }

  const passport={

    type:"plumber-estimate",

    version:3,

    product:PRODUCT.name,

    estimateId:getEstimateId(),

    createdAt:getCreatedAt(),

    updatedAt:new Date().toISOString(),

    status:"draft",

    currency:"UAH",

    master:{
      brand:profile.brand||"",
      name:profile.name||"",
      phone:profile.phone||"",
      details:profile.details||"",
      logo:profile.logo||""
    },

    client:project.client||"",

    object:project.object||"",

    total:getEstimateTotal(),

    itemCount:
      estimate.reduce(
        (sum,item)=>
          sum+Number(item.qty||0),
        0
      ),

    items:
      estimate.map(item=>({

        id:item.lineId,

        workId:item.workId,

        name:item.name,

        category:item.cat,

        unit:item.unit,

        quantity:Number(item.qty||0),

        basePrice:Number(item.basePrice||0),

        price:Number(item.price||0),

        total:
          Number(item.price||0)*
          Number(item.qty||0)

      }))

  };

  try{

    localStorage.setItem(
      "plumber_calc_passport",
      JSON.stringify(passport)
    );

    localStorage.setItem(
      "samaster_passport_estimate",
      JSON.stringify(passport)
    );

  }catch{}

}


/* =========================================================
   MAIN CATEGORY
========================================================= */

function setMainCategory(category){

  mainCategory=
    category==="finish"
      ? "finish"
      : "rough";

  $("roughTab")
    .classList.toggle(
      "active",
      mainCategory==="rough"
    );

  $("finishTab")
    .classList.toggle(
      "active",
      mainCategory==="finish"
    );

  renderEstimate();
}


/* =========================================================
   ESTIMATE RENDER
========================================================= */

function renderEstimate(){

  const list=
    $("estimateList");

  if(!list){
    return;
  }

  const items=
    estimate.filter(
      item=>item.cat===mainCategory
    );

  if(!items.length){

    list.innerHTML=`
      <div class="empty">
        У цій категорії ще немає доданих робіт
      </div>
    `;

  }else{

    list.innerHTML=
      items.map(item=>{

        const total=
          Number(item.price||0)*
          Number(item.qty||0);

        return`

          <div class="estimate-row">

            <div
              class="estimate-info"
              data-price-line="${esc(item.lineId)}"
            >

              <div class="estimate-name">
                ${esc(item.name)}
              </div>

              <div class="estimate-meta">
                ${esc(item.unit)}
                ·
                ${money(item.price)}
                / ${esc(item.unit)}
              </div>

            </div>

            <div class="qty-control">

              <button
                class="qty-btn"
                type="button"
                data-qty-line="${esc(item.lineId)}"
                data-qty-delta="-1"
                aria-label="Зменшити"
              >−</button>

              <div class="qty-value">
                ${Number(item.qty||0)}
              </div>

              <button
                class="qty-btn"
                type="button"
                data-qty-line="${esc(item.lineId)}"
                data-qty-delta="1"
                aria-label="Збільшити"
              >+</button>

            </div>

            <div class="estimate-price">
              ${money(total)}
            </div>

            <button
              class="estimate-remove"
              type="button"
              data-remove-line="${esc(item.lineId)}"
              aria-label="Видалити позицію"
            >×</button>

          </div>

        `;

      }).join("");

  }

  const total=
    getEstimateTotal();

  $("totalValue").textContent=
    money(total);

  $("printTotalValue").textContent=
    money(total);

  $("clearEstimateBtn").style.visibility=
    estimate.length
      ? "visible"
      : "hidden";
}


/* =========================================================
   ADD / QUANTITY / REMOVE
========================================================= */

function addWork(workId){

  ensureCatalog();

  const item=
    findWork(workId);

  if(!item){

    showToast(
      "Позицію не знайдено"
    );

    return;
  }

  const existing=
    estimate.find(
      line=>line.workId===workId
    );

  if(existing){

    existing.qty=
      Number(existing.qty||0)+1;

  }else{

    estimate.push({

      lineId:uid(),

      workId:item.id,

      name:item.name,

      unit:item.unit,

      cat:item.cat,

      basePrice:Number(item.price||0),

      price:Number(item.price||0),

      qty:1

    });

  }

  saveEstimate();

  renderEstimate();
  renderAddWorkList();

  showToast("Позицію додано");
}


function changeQty(lineId,delta){

  const item=
    estimate.find(
      line=>line.lineId===lineId
    );

  if(!item){
    return;
  }

  item.qty=
    Number(item.qty||0)+
    Number(delta||0);

  if(item.qty<=0){

    estimate=
      estimate.filter(
        line=>line.lineId!==lineId
      );

  }

  saveEstimate();

  renderEstimate();
  renderAddWorkList();
}


function removeEstimateLine(lineId){

  const exists=
    estimate.some(
      line=>line.lineId===lineId
    );

  if(!exists){
    return;
  }

  estimate=
    estimate.filter(
      line=>line.lineId!==lineId
    );

  saveEstimate();

  renderEstimate();
  renderAddWorkList();

  showToast("Позицію видалено");
}


/* =========================================================
   CLEAR
========================================================= */

function clearEstimate(){

  if(!estimate.length){
    return;
  }

  if(
    !confirm(
      "Очистити весь кошторис?"
    )
  ){
    return;
  }

  estimate=[];

  localStorage.removeItem(
    "plumber_calc_estimate_id"
  );

  localStorage.removeItem(
    "plumber_calc_estimate_created"
  );

  saveEstimate();

  renderEstimate();
  renderAddWorkList();

  showToast("Кошторис очищено");
}


/* =========================================================
   CATALOG
========================================================= */

function openCatalog(){

  ensureCatalog();

  catalogCategory=
    mainCategory==="finish"
      ? "finish"
      : "rough";

  $("workSearch").value="";

  updateCatalogTabs();

  renderAddWorkList();

  openModal("catalogModal");

  setTimeout(()=>{

    $("workSearch").focus();

  },100);
}


function setCatalogCategory(category){

  catalogCategory=
    category==="finish"
      ? "finish"
      : "rough";

  updateCatalogTabs();
  renderAddWorkList();
}


function updateCatalogTabs(){

  $("catalogRoughTab")
    .classList.toggle(
      "active",
      catalogCategory==="rough"
    );

  $("catalogFinishTab")
    .classList.toggle(
      "active",
      catalogCategory==="finish"
    );
}


function renderAddWorkList(){

  const list=
    $("workList");

  if(!list){
    return;
  }

  ensureCatalog();

  const query=
    String(
      $("workSearch")?.value||""
    )
      .trim()
      .toLowerCase();

  const source=
    Array.isArray(db[catalogCategory])
      ? db[catalogCategory]
      : [];

  const filtered=
    source.filter(item=>{

      if(!item){
        return false;
      }

      if(!query){
        return true;
      }

      const name=
        String(item.name||"")
          .toLowerCase();

      const unit=
        String(item.unit||"")
          .toLowerCase();

      return(
        name.includes(query)||
        unit.includes(query)
      );

    });

  $("catalogCount").textContent=
    `${filtered.length} позицій`;

  if(!filtered.length){

    list.innerHTML=`
      <div class="empty">
        Нічого не знайдено
      </div>
    `;

    return;
  }

  list.innerHTML=
    filtered
      .map(renderAddWorkItem)
      .join("");
}


function renderAddWorkItem(item){

  const existing=
    estimate.find(
      line=>line.workId===item.id
    );

  let controls="";

  if(existing){

    controls=`

      <div class="work-control">

        <button
          type="button"
          data-qty-line="${esc(existing.lineId)}"
          data-qty-delta="-1"
          aria-label="Зменшити"
        >−</button>

        <span>
          ${Number(existing.qty||0)}
        </span>

        <button
          type="button"
          data-qty-line="${esc(existing.lineId)}"
          data-qty-delta="1"
          aria-label="Збільшити"
        >+</button>

      </div>

    `;

  }else{

    controls=`

      <div class="work-price">
        ${money(item.price)}
      </div>

    `;

  }

  return`

    <div
      class="work-item"
      data-add-work="${esc(item.id)}"
      data-edit-work="${esc(item.id)}"
      role="button"
      tabindex="0"
    >

      <div class="work-info">

        <div class="work-name">
          ${esc(item.name)}
        </div>

        <div class="work-meta">
          ${esc(item.unit)}
        </div>

      </div>

      ${controls}

    </div>

  `;
}


/* =========================================================
   WORK MODAL
========================================================= */

function openNewWorkModal(){

  editingWorkId=null;

  editingWorkCategory=
    $("catalogModal").classList.contains("show")
      ? catalogCategory
      : mainCategory;

  $("workModalTitle").textContent=
    "Нова позиція";

  $("workName").value="";
  $("workUnit").value="";
  $("workPrice").value="";

  $("deleteWorkButton").style.display=
    "none";

  openModal("workModal");

  setTimeout(()=>{

    $("workName").focus();

  },100);
}


function openEditWorkModal(workId){

  const item=
    findWork(workId);

  if(!item){
    return;
  }

  editingWorkId=item.id;
  editingWorkCategory=item.cat;

  $("workModalTitle").textContent=
    "Редагувати позицію";

  $("workName").value=
    item.name;

  $("workUnit").value=
    item.unit;

  $("workPrice").value=
    item.price;

  $("deleteWorkButton").style.display=
    "block";

  openModal("workModal");
}


function saveWork(){

  const name=
    $("workName").value.trim();

  const unit=
    $("workUnit").value.trim();

  const price=
    Number($("workPrice").value);

  if(!name){

    showToast(
      "Вкажіть назву роботи"
    );

    return;
  }

  if(!unit){

    showToast(
      "Вкажіть одиницю"
    );

    return;
  }

  if(
    !Number.isFinite(price)||
    price<0
  ){

    showToast(
      "Вкажіть коректну ціну"
    );

    return;
  }

  if(editingWorkId){

    const item=
      findWork(editingWorkId);

    if(!item){
      return;
    }

    item.name=name;
    item.unit=unit;
    item.price=price;

    estimate.forEach(line=>{

      if(line.workId===item.id){

        line.name=name;
        line.unit=unit;
        line.basePrice=price;

      }

    });

    saveDB();
    saveEstimate();

    closeModal("workModal");

    renderEstimate();
    renderAddWorkList();

    showToast(
      "Позицію оновлено"
    );

    return;
  }

  ensureCatalog();

  const category=
    editingWorkCategory==="finish"
      ? "finish"
      : "rough";

  db[category].push({

    id:
      category+"-"+uid(),

    name,
    unit,
    price

  });

  saveDB();

  closeModal("workModal");

  renderAddWorkList();

  showToast(
    "Позицію створено"
  );
}


function deleteCurrentWork(){

  if(!editingWorkId){
    return;
  }

  deleteWork(editingWorkId);
}


function deleteWork(workId){

  const item=
    findWork(workId);

  if(!item){
    return;
  }

  if(
    !confirm(
      `Видалити "${item.name}" з каталогу?`
    )
  ){
    return;
  }

  db[item.cat]=
    db[item.cat].filter(
      work=>work.id!==workId
    );

  estimate=
    estimate.filter(
      line=>line.workId!==workId
    );

  saveDB();
  saveEstimate();

  closeModal("workModal");

  renderEstimate();
  renderAddWorkList();

  showToast(
    "Позицію видалено"
  );
}


/* =========================================================
   PRICE
========================================================= */

function openPriceModal(lineId){

  const item=
    estimate.find(
      line=>line.lineId===lineId
    );

  if(!item){
    return;
  }

  editingPriceLineId=lineId;

  $("priceCurrent").innerHTML=`

    <strong>
      ${esc(item.name)}
    </strong>

    <br>

    <span style="color:var(--muted)">
      Базова ціна:
      ${money(item.basePrice)}
    </span>

  `;

  $("priceInput").value=
    item.price;

  openModal("priceModal");

  setTimeout(()=>{

    $("priceInput").focus();
    $("priceInput").select();

  },100);
}


function savePrice(){

  if(!editingPriceLineId){
    return;
  }

  const item=
    estimate.find(
      line=>line.lineId===editingPriceLineId
    );

  if(!item){
    return;
  }

  const price=
    Number($("priceInput").value);

  if(
    !Number.isFinite(price)||
    price<0
  ){

    showToast(
      "Вкажіть коректну ціну"
    );

    return;
  }

  item.price=price;

  saveEstimate();

  closeModal("priceModal");

  renderEstimate();

  showToast(
    "Ціну змінено"
  );
}


function resetPriceToBase(){

  if(!editingPriceLineId){
    return;
  }

  const item=
    estimate.find(
      line=>line.lineId===editingPriceLineId
    );

  if(!item){
    return;
  }

  item.price=
    Number(item.basePrice||0);

  $("priceInput").value=
    item.price;

  saveEstimate();

  renderEstimate();

  showToast(
    "Повернуто базову ціну"
  );
}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

  $("profileBrand").value=
    profile.brand||"";

  $("profileName").value=
    profile.name||"";

  $("profilePhone").value=
    profile.phone||"";

  $("profileDetails").value=
    profile.details||"";

  openModal("settingsModal");
}


function saveSettings(){

  profile={

    ...profile,

    brand:
      $("profileBrand").value.trim(),

    name:
      $("profileName").value.trim(),

    phone:
      $("profilePhone").value.trim(),

    details:
      $("profileDetails").value.trim()

  };

  savePassportEstimate();
  renderProfile();

  showToast(
    "Профіль збережено"
  );

/* =========================================================
   PDF
========================================================= */

function printEstimate(){

  if(!estimate.length){

    showToast(
      "Спочатку додайте роботи"
    );

    return;
  }

  const total=
    getEstimateTotal();

  $("printTotalValue").textContent=
    money(total);

  savePassportEstimate();

  requestAnimationFrame(()=>{

    window.print();

  });
}


/* =========================================================
   JSON
========================================================= */

function exportJSON(){

  const data={

    type:"plumber-estimate",

    version:3,

    product:PRODUCT.name,

    estimateId:getEstimateId(),

    createdAt:getCreatedAt(),

    exportedAt:
      new Date().toISOString(),

    master:{
      ...profile
    },

    client:
      project.client||"",

    object:
      project.object||"",

    total:
      getEstimateTotal(),

    items:
      estimate.map(item=>({

        id:item.lineId,

        workId:item.workId,

        name:item.name,

        category:item.cat,

        unit:item.unit,

        quantity:
          Number(item.qty||0),

        basePrice:
          Number(item.basePrice||0),

        price:
          Number(item.price||0),

        total:
          Number(item.price||0)*
          Number(item.qty||0)

      }))

  };

  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json;charset=utf-8"
      }
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;
  a.download="plumber-estimate.json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

  showToast(
    "JSON експортовано"
  );
}


/* =========================================================
   MODALS
========================================================= */

function openModal(id){

  const modal=$(id);

  if(modal){

    modal.classList.add("show");

  }
}


function closeModal(id){

  const modal=$(id);

  if(modal){

    modal.classList.remove("show");

  }
}


function closeAllModals(){

  document
    .querySelectorAll(".modal.show")
    .forEach(modal=>{

      modal.classList.remove("show");

    });

}


/* =========================================================
   EVENT DELEGATION
   УСІ ДИНАМІЧНІ КНОПКИ ТУТ
========================================================= */

document.addEventListener(
  "click",
  function(event){

    /* -----------------------------------------
       Закриття модалки
    ----------------------------------------- */

    const closeButton=
      event.target.closest(
        "[data-close-modal]"
      );

    if(closeButton){

      event.preventDefault();
      event.stopPropagation();

      closeModal(
        closeButton.dataset.closeModal
      );

      return;
    }


    /* -----------------------------------------
       Видалення позиції з кошторису
    ----------------------------------------- */

    const removeButton=
      event.target.closest(
        "[data-remove-line]"
      );

    if(removeButton){

      event.preventDefault();
      event.stopPropagation();

      removeEstimateLine(
        removeButton.dataset.removeLine
      );

      return;
    }


    /* -----------------------------------------
       + / − кількість
    ----------------------------------------- */

    const qtyButton=
      event.target.closest(
        "[data-qty-line]"
      );

    if(qtyButton){

      event.preventDefault();
      event.stopPropagation();

      changeQty(
        qtyButton.dataset.qtyLine,
        Number(
          qtyButton.dataset.qtyDelta
        )
      );

      return;
    }


    /* -----------------------------------------
       Редагування ціни
    ----------------------------------------- */

    const priceLine=
      event.target.closest(
        "[data-price-line]"
      );

    if(priceLine){

      openPriceModal(
        priceLine.dataset.priceLine
      );

      return;
    }


    /* -----------------------------------------
       Додавання роботи
    ----------------------------------------- */

    const workItem=
      event.target.closest(
        "[data-add-work]"
      );

    if(workItem){

      /*
        Якщо натиснули + або −,
        його обробник вище вже спрацював.
      */

      if(
        event.target.closest(
          "[data-qty-line]"
        )
      ){
        return;
      }

      addWork(
        workItem.dataset.addWork
      );

      return;
    }

  },
  false
);


/* =========================================================
   KEYBOARD FOR CATALOG ITEMS
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key!=="Enter" &&
      event.key!==" "
    ){
      return;
    }

    const item=
      event.target.closest(
        "[data-add-work]"
      );

    if(!item){
      return;
    }

    if(
      event.target.closest(
        "[data-qty-line]"
      )
    ){
      return;
    }

    event.preventDefault();

    addWork(
      item.dataset.addWork
    );

  }
);


/* =========================================================
   CONTEXT MENU = EDIT CATALOG POSITION
========================================================= */

document.addEventListener(
  "contextmenu",
  function(event){

    const item=
      event.target.closest(
        "[data-edit-work]"
      );

    if(!item){
      return;
    }

    event.preventDefault();

    openEditWorkModal(
      item.dataset.editWork
    );

  }
);


/* =========================================================
   MODAL BACKGROUND
========================================================= */

document.addEventListener(
  "click",
  function(event){

    if(
      !event.target.classList.contains(
        "modal"
      )
    ){
      return;
    }

    closeModal(
      event.target.id
    );

  }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key==="Escape"){

      closeAllModals();

    }

  }
);


/* =========================================================
   THEME
========================================================= */

function applyTheme(theme){

  const value=
    theme==="dark"
      ? "dark"
      : "light";

  document.documentElement
    .dataset.theme=value;

  try{

    localStorage.setItem(
      "plumber_calc_theme",
      value
    );

  }catch{}

  $("themeButton").textContent=
    value==="dark"
      ? "☀"
      : "☾";
}


function initTheme(){

  let saved=null;

  try{

    saved=
      localStorage.getItem(
        "plumber_calc_theme"
      );

  }catch{}

  applyTheme(
    saved==="dark"
      ? "dark"
      : "light"
  );
}


function toggleTheme(){

  const current=
    document.documentElement
      .dataset.theme||
    "light";

  applyTheme(
    current==="dark"
      ? "light"
      : "dark"
  );
}

   STATIC BUTTON EVENTS
========================================================= */

function bindEvents(){

  $("settingsButton")
    .addEventListener(
      "click",

    );

  $("themeButton")
    .addEventListener(
      "click",
      toggleTheme
    );

  $("roughTab")
    .addEventListener(

      ()=>setMainCategory("rough")
    );

  $("finishTab")
    .addEventListener(
      "click",
      ()=>setMainCategory("finish")
    );

  $("clearEstimateBtn")
    .addEventListener(
      "click",
      clearEstimate
    );

  $("newWorkButton")
    .addEventListener(
      "click",
      openNewWorkModal
    );

  $("printButton")
    .addEventListener(
      "click",
      printEstimate
    );

  $("catalogOpenButton")
    .addEventListener(
      "click",

    );

  $("workSearch")
    .addEventListener(
      "input",

    );

  $("catalogRoughTab")

      ()=>setCatalogCategory("rough")
    );

  $("catalogFinishTab")
    .addEventListener(

    .addEventListener(

  $("objectInput")
    .addEventListener(

    );

/* =========================================================
   INIT
========================================================= */

function init(){

  profile=
    loadProfile();

  db=
    loadDB();

  ensureCatalog();

  estimate=
    loadEstimate();

  project=
    loadProject();

  initTheme();

  renderProfile();

  renderProject();

  bindEvents();

  setMainCategory("rough");

  updateCatalogTabs();

  renderEstimate();

  renderAddWorkList();
}


if(
  document.readyState===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    init,
    {once:true}
  );

}else{

  init();

}
