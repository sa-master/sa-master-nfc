function renderPurchaseSupplierText(
  item
){

  const choices =
    getPurchaseSupplierChoices(
      item
    );

  if(!choices.length){
    return "Постачальників у каталозі немає";
  }

  return choices.map(
    choice => {

      if(
        Number.isFinite(
          choice.price
        )
      ){
        return (
          choice.name +
          " " +
          new Intl.NumberFormat(
            "uk-UA"
          ).format(
            Math.round(choice.price)
          )
        );
      }

      return choice.name;
    }
  ).join(" · ");
}

function renderPurchasing(){

  const intro =
    document.getElementById(
      "purchaseIntro"
    );

  const chips =
    document.getElementById(
      "purchaseSupplierChips"
    );

  const list =
    document.getElementById(
      "purchaseList"
    );

  const addBox =
    document.getElementById(
      "purchaseAddBox"
    );

  const addButton =
    document.getElementById(
      "purchaseAddButton"
    );

  const orderButton =
    document.getElementById(
      "purchaseOrderButton"
    );

  const history =
    document.getElementById(
      "purchaseHistory"
    );

  if(
    !intro ||
    !chips ||
    !list ||
    !addBox ||
    !addButton ||
    !orderButton ||
    !history
  ){
    return;
  }

  if(!purchaseWorkflow.initialized){

    intro.innerHTML = `
      <div class="purchaseStart">
        <strong>Почати закупівлю</strong>
        <p>
          Створимо робочий список із матеріалів поточного кошторису.
          Далі кошторис і закупівля живуть окремо.
        </p>
        <button onclick="initializePurchaseFromEstimate()">
          Створити з кошторису
        </button>
      </div>
    `;

    chips.innerHTML = "";
    list.innerHTML = "";
    history.innerHTML = "";
    addBox.style.display = "none";
    addButton.style.display = "none";
    orderButton.style.display = "none";
    return;
  }

  const suppliers =
    getAllPurchaseSuppliers();

  if(
    activePurchaseSupplierKey &&
    !suppliers.some(
      supplier =>
        supplier.key ===
        activePurchaseSupplierKey
    )
  ){
    activePurchaseSupplierKey = "";
  }

  intro.innerHTML = `
    <div class="purchaseSummary">
      <span>Докупити</span>
      <strong>
        ${purchaseWorkflow.items.length} позицій
      </strong>
    </div>
  `;

  chips.innerHTML = `
    <button
      class="purchaseSupplierChip ${!activePurchaseSupplierKey ? "active" : ""}"
      onclick="setPurchaseSupplier('')"
    >
      Усі
    </button>
    ${
      suppliers.map(
        supplier => {

          const encoded =
            encodeURIComponent(
              supplier.key
            );

          return `
            <button
              class="purchaseSupplierChip ${activePurchaseSupplierKey === supplier.key ? "active" : ""}"
              onclick="setPurchaseSupplier('${encoded}')"
            >
              ${escapeHtml(supplier.name)}
            </button>
          `;
        }
      ).join("")
    }
  `;

  const visibleItems =
    purchaseWorkflow.items.filter(
      item =>
        purchaseItemHasSupplier(
          item,
          activePurchaseSupplierKey
        )
    );

  if(!purchaseWorkflow.items.length){

    list.innerHTML = `
      <div class="purchaseEmpty">
        Список порожній.<br>
        Якщо в процесі щось знадобиться — додайте матеріал нижче.
      </div>
    `;

  }else if(!visibleItems.length){

    list.innerHTML = `
      <div class="purchaseEmpty">
        Для цього постачальника в активному списку нічого немає.
      </div>
    `;

  }else{

    list.innerHTML =
      visibleItems.map(
        item => {

          const uid =
            encodeURIComponent(
              item.uid
            );

          const canSelect =
            !!activePurchaseSupplierKey;

          const sourceLabel =
            item.source === "added"
              ? "Додано в процесі"
              : "З кошторису";

          return `
            <div class="purchaseItem">

              ${
                canSelect
                  ? `
                    <button
                      class="purchaseSelect ${item.selected ? "selected" : ""}"
                      onclick="togglePurchaseItem('${uid}')"
                      aria-label="Вибрати позицію"
                    >
                      ✓
                    </button>
                  `
                  : ""
              }

              <div class="purchaseItemBody">
                <div class="purchaseItemName">
                  ${escapeHtml(item.name)}
                </div>

                <div class="purchaseItemMeta">
                  ${escapeHtml(sourceLabel)}
                  ${item.article ? " · " + escapeHtml(item.article) : ""}
                </div>

                <div class="purchaseSupplierLine">
                  ${escapeHtml(renderPurchaseSupplierText(item))}
                </div>

                <div class="purchaseItemActions">
                  <div class="purchaseQty">
                    <button onclick="changePurchaseQty('${uid}',-1)">−</button>
                    <b>${Math.max(1,Number(item.qty) || 1)} ${escapeHtml(item.unit)}</b>
                    <button onclick="changePurchaseQty('${uid}',1)">＋</button>
                  </div>

                  ${
                    !activePurchaseSupplierKey
                      ? `
                        <button
                          class="purchaseBought"
                          onclick="closePurchaseItem('${uid}')"
                        >
                          ✓ Куплено
                        </button>
                      `
                      : ""
                  }
                </div>
              </div>
            </div>
          `;
        }
      ).join("");
  }

  addButton.style.display =
    "block";

  addBox.style.display =
    purchaseAddOpen
      ? "block"
      : "none";

  const supplier =
    getActivePurchaseSupplier();

  const selectedCount =
    purchaseWorkflow.items.filter(
      item =>
        item.selected &&
        activePurchaseSupplierKey &&
        purchaseItemHasSupplier(
          item,
          activePurchaseSupplierKey
        )
    ).length;

  if(
    supplier &&
    selectedCount > 0
  ){

    orderButton.style.display =
      "block";

    orderButton.textContent =
      `Замовити · ${supplier.name} (${selectedCount})`;

  }else{

    orderButton.style.display =
      "none";
  }

  if(
    purchaseWorkflow.orders.length
  ){

    history.innerHTML = `
      <div class="purchaseHistoryTitle">
        Сформовані замовлення
      </div>
      ${
        purchaseWorkflow.orders
          .slice()
          .reverse()
          .map(
            order => `
              <div class="purchaseOrderCard">
                <div class="purchaseOrderHead">
                  <strong>${escapeHtml(order.supplierName || "Постачальник")}</strong>
                  <div class="purchaseOrderHeadRight">
                    <span>${escapeHtml(formatPurchaseOrderDate(order.createdAt))}</span>
                    <button onclick="copySupplierOrder('${encodeURIComponent(order.id)}')">Скопіювати</button>
                  </div>
                </div>
                <div class="purchaseOrderItems">
                  ${
                    Array.isArray(order.items)
                      ? order.items.map(
                          item =>
                            `${escapeHtml(item.name)} — ${Number(item.qty) || 0} ${escapeHtml(item.unit || "")}`
                        ).join("<br>")
                      : ""
                  }
                </div>
              </div>
            `
          ).join("")
      }
    `;

  }else{
    history.innerHTML = "";
  }
}

/* Supplier mode remains available in the prototype without the old
   "Комплектацію перевірено" gate. */
function toggleViewMode(){

  if(viewMode === "master"){
    viewMode = "client";
  }else if(viewMode === "client"){
    supplierTopupId = null;
    viewMode = "supplier";
  }else{
    supplierTopupId = null;
    viewMode = "master";
  }

  document.body.classList.toggle(
    "clientMode",
    viewMode !== "master"
  );

  const button =
    document.getElementById(
      "viewToggle"
    );

  if(button){
    button.textContent =
      viewMode === "master"
        ? "Майстер"
        : (
            viewMode === "client"
              ? "Клієнт"
              : "Постачальник"
          );
  }

  renderEstimate();
}

/* Clearing the estimate starts a new local prototype workflow too. */
function clearEstimate(){

  if(!estimate.length){
    return;
  }

  if(
    !confirm(
      "Очистити весь кошторис?"
    )
  ){
    return;
  }

  estimate = [
    createConsumablesItem()
  ];

  procurementReviewed = false;

  localStorage.setItem(
    PROCUREMENT_REVIEWED_KEY,
    "0"
  );

  materialDiscountPercent = 0;

  localStorage.setItem(
    MATERIAL_DISCOUNT_KEY,
    "0"
  );

  resetPurchaseWorkflow();
  save();
  renderEstimate();
}

/* Same estimate row as v1.2 + a small supplier availability line
   visible only to the executor. */
function renderRow(
  item
){

  const index =
    estimate.indexOf(
      item
    );

  if(
    item.type ===
      "consumables"
  ){

    return `
      <div class="row">

        <div>
          <div class="name">
            ${escapeHtml(item.name)}
          </div>

          <button
            class="consumablesPrice"
            onclick="editPrice(${index})"
          >
            ≈ ${money(Number(item.price) || 0)}
            <span class="priceEditIcon">✎</span>
          </button>
        </div>

        <div class="right">
          <div class="lineTotal">
            ≈ ${money(Number(item.price) || 0)}
          </div>
        </div>

      </div>
    `;
  }

  const isMaterial =
    item.type ===
    "material";

  const externalView =
    viewMode ===
      "client" ||
    viewMode ===
      "supplier";

  const clientFactor =
    (
      externalView &&
      isMaterial &&
      !showClientDiscount
    )
      ? (
          1 -
          materialDiscountPercent /
          100
        )
      : 1;

  const displayPrice =
    (
      Number(
        item.price
      ) || 0
    ) *
    clientFactor;

  const displayQty =
    viewMode ===
      "supplier" &&
    isMaterial
      ? (
          supplierTopupId
            ? (Number(item.qty) || 0)
            : getProcurementQty(item)
        )
      : (
          Number(item.qty) || 0
        );

  const displayLineTotal =
    displayPrice *
    displayQty;

  const displayName =
    viewMode ===
      "supplier" &&
    isMaterial
      ? getSupplierViewName(
          item
        )
      : item.name;

  const supplierArticle =
    viewMode ===
      "supplier" &&
    isMaterial
      ? getSupplierViewArticle(
          item
        )
      : "";

  const supplierAvailability =
    viewMode === "master" &&
    isMaterial
      ? getEstimateSupplierText(item)
      : "";

  return `
    <div class="row">

      <div>

        <div class="name">
          ${escapeHtml(displayName)}
        </div>

        ${
          supplierArticle
            ? `
              <div
                style="
                  margin-top:4px;
                  color:var(--muted);
                  font-size:11px;
                  font-weight:650;
                "
              >
                Артикул:
                ${escapeHtml(supplierArticle)}
              </div>
            `
            : ""
        }

        ${
          supplierAvailability
            ? `
              <div class="estimateSuppliers">
                ${escapeHtml(supplierAvailability)}
              </div>
            `
            : ""
        }

        <div class="controls">

          <div class="qty">

            <button
              onclick="changeQty(${index},-1)"
            >
              −
            </button>

            <b>
              ${
                externalView
                  ? `×${displayQty}`
                  : item.qty
              }
            </b>

            <button
              onclick="changeQty(${index},1)"
            >
              +
            </button>

          </div>

          <button
            class="price"
            onclick="editPrice(${index})"
          >
            ${money(displayPrice)}
            /
            ${escapeHtml(item.unit)}
            <span class="priceEditIcon">✎</span>
          </button>

        </div>

      </div>

      <div class="right">

        <div class="lineTotal">
          ${money(displayLineTotal)}
        </div>

        <button
          class="delete"
          onclick="removeItem(${index})"
        >
          ×
        </button>

      </div>

    </div>
  `;
}

/* =========================
   MASTER
========================= */

function openMaster(){

  document.getElementById(
    "masterName"
  ).value =
    localStorage.getItem(
      "plumber_masterName"
    ) || "";

  document.getElementById(
    "masterPhone"
  ).value =
    localStorage.getItem(
      "plumber_masterPhone"
    ) || "";

  document.getElementById(
    "masterSheet"
  ).classList.add(
    "open"
  );
}

function closeMaster(){

  document.getElementById(
    "masterSheet"
  ).classList.remove(
    "open"
  );
}

function saveMaster(){

  localStorage.setItem(
    "plumber_masterName",
    document.getElementById(
      "masterName"
    ).value
  );

  localStorage.setItem(
    "plumber_masterPhone",
    document.getElementById(
      "masterPhone"
    ).value
  );

  closeMaster();
}

/* =========================
   CLIENT
========================= */

[
  "clientName",
  "clientPhone",
  "clientAddress"
]
.forEach(
  id => {

    const input =
      document.getElementById(
        id
      );

    input.value =
      localStorage.getItem(
        "plumber_" + id
      ) || "";

    input.addEventListener(
      "input",
      () => {

        localStorage.setItem(
          "plumber_" + id,
          input.value
        );
      }
    );
  }
);

document.getElementById(
  "date"
).textContent =
  new Date()
    .toLocaleDateString(
      "uk-UA"
    );

updateEurRateButton();
renderEstimate();

</script>
