<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f7fb">
<title>SA-MASTER.PRO — Кошториси</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f7fb;--card:rgba(255,255,255,.76);--ink:#18202b;--muted:#697586;--line:#dce5ef;--blue:#087cf0;--blue-soft:#e8f3ff;--green:#16834b;--green-soft:#e9f8ef;--orange:#b35c00;--orange-soft:#fff2df;--red:#c33232;--red-soft:#ffeded;--shadow:0 10px 28px rgba(31,56,87,.09);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#111820;--card:rgba(31,41,53,.8);--ink:#f4f7fb;--muted:#a8b2c0;--line:#344252;--blue:#58a6ff;--blue-soft:#163c62;--green:#55c985;--green-soft:#143e2c;--orange:#ffb25b;--orange-soft:#49351c;--red:#ff8383;--red-soft:#482727;--shadow:0 10px 28px rgba(0,0,0,.28)}}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,rgba(0,124,240,.13),transparent 31rem),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100dvh}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer;color:inherit}button:active{transform:scale(.98)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:.78rem .86rem;background:var(--card);color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(8,124,240,.12)}textarea{min-height:5.2rem;resize:vertical}.app{max-width:920px;margin:auto;padding:calc(14px + var(--sat)) 14px calc(88px + var(--sab))}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{display:flex;gap:10px;align-items:center}.logo{width:43px;height:43px;border-radius:15px;background:linear-gradient(145deg,#0c8cff,#005cce);display:grid;place-items:center;color:white;font-weight:900;font-size:1.2rem;box-shadow:0 7px 18px rgba(0,112,235,.28)}h1{font-size:1.05rem;margin:0;letter-spacing:.1px}.sub{font-size:.74rem;color:var(--muted);margin-top:2px}.icon,.small{border-radius:12px;padding:.62rem .75rem;background:var(--card);border:1px solid var(--line)}.primary{background:linear-gradient(145deg,#0d8aff,#006be1);color:#fff;font-weight:750;box-shadow:0 7px 17px rgba(0,112,235,.2)}.secondary{background:var(--blue-soft);color:var(--blue);font-weight:700}.danger{background:var(--red-soft);color:var(--red);font-weight:700}.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px);border-radius:19px;padding:15px}.grid{display:grid;gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.screen{display:none}.screen.active{display:block}.hero{padding:22px;text-align:left}.hero h2{font-size:1.5rem;line-height:1.15;margin:0 0 8px}.hero p{color:var(--muted);line-height:1.45;margin:0}.steps{margin:15px 0;display:grid;gap:8px}.step{display:flex;gap:9px;color:var(--muted);font-size:.87rem;align-items:center}.num{width:22px;height:22px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:.72rem;font-weight:800}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 9px}.sectionTitle h2{font-size:1rem;margin:0}.meta{font-size:.76rem;color:var(--muted)}.project{display:grid;grid-template-columns:9px 1fr auto;gap:10px;align-items:start;margin-bottom:9px}.dot{width:9px;height:9px;border-radius:50%;background:var(--orange);margin-top:6px}.dot.approved,.dot.active{background:var(--green)}.dot.completed{background:var(--ink)}.pname{font-size:.94rem;font-weight:800}.pline{font-size:.77rem;color:var(--muted);margin-top:3px;line-height:1.35}.amount{font-weight:800;font-size:.88rem}.badge{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:.25rem .5rem;background:var(--blue-soft);color:var(--blue);font-size:.69rem;font-weight:750}.badge.warn{background:var(--orange-soft);color:var(--orange)}.badge.ok{background:var(--green-soft);color:var(--green)}.badge.red{background:var(--red-soft);color:var(--red)}.nav{position:fixed;z-index:10;bottom:calc(9px + var(--sab));left:50%;transform:translateX(-50%);width:min(580px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(20px);border-radius:18px}.nav button{padding:.55rem .2rem;border-radius:12px;color:var(--muted);font-size:.68rem}.nav button.active{color:var(--blue);background:var(--blue-soft);font-weight:800}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{min-height:38px}.row{display:flex;gap:8px;align-items:center}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}.stat{padding:13px}.stat b{display:block;font-size:1.15rem;margin-top:4px}.stat span{font-size:.71rem;color:var(--muted);text-transform:uppercase;letter-spacing:.35px}.empty{text-align:center;color:var(--muted);padding:31px 16px;line-height:1.45}.pillbar{display:flex;gap:6px;overflow:auto;padding:2px 0 7px}.pill{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:.45rem .65rem;border-radius:999px;font-size:.75rem}.pill.on{color:white;background:var(--blue);border-color:var(--blue)}.line{padding:10px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:0}.lineName{font-size:.88rem;font-weight:760;line-height:1.25}.lineInfo{font-size:.72rem;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.qty button{width:28px;height:28px;background:var(--card);color:var(--blue);font-size:1rem}.qty span{font-size:.76rem;min-width:23px;text-align:center;font-weight:750}.total{font-size:.93rem;font-weight:850}.subTotal{display:flex;justify-content:space-between;padding:9px 0 0;font-size:.78rem;color:var(--muted)}.sticky{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 24%);padding-top:18px}.modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;background:rgba(6,13,22,.42);backdrop-filter:blur(7px)}.modal.open{display:flex}.sheet{width:min(680px,100%);max-height:91dvh;overflow:auto;margin:auto auto 0;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 14px calc(16px + var(--sab));box-shadow:0 -10px 35px rgba(0,0,0,.2)}.sheet h2{font-size:1.08rem;margin:2px 0 14px}.form{display:grid;gap:11px}.label{font-size:.73rem;color:var(--muted);font-weight:700;margin:0 2px 4px}.field{display:grid;gap:4px}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1;min-height:46px;border-radius:14px}.close{float:right;font-size:1.25rem;width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--muted)}.offer{padding:10px;border-radius:13px;border:1px solid var(--line);margin-top:7px}.offerHead{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;font-weight:750}.hint{font-size:.73rem;line-height:1.4;color:var(--muted);padding:9px 10px;border-radius:12px;background:var(--blue-soft)}.warnBox{background:var(--orange-soft);color:var(--orange)}.progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden}.progress i{height:100%;background:linear-gradient(90deg,var(--blue),#46adff);display:block;border-radius:inherit}.check{display:flex;gap:9px;align-items:center;font-size:.81rem}.check input{width:18px;height:18px}.tour{position:fixed;z-index:50;inset:auto 14px calc(92px + var(--sab));background:var(--ink);color:var(--bg);padding:15px;border-radius:17px;box-shadow:var(--shadow);display:none}.tour.show{display:block}.tour strong{font-size:.88rem}.tour p{font-size:.78rem;line-height:1.4;margin:5px 0 11px;opacity:.88}.toast{position:fixed;z-index:60;bottom:calc(98px + var(--sab));left:50%;transform:translate(-50%,15px);padding:10px 14px;background:var(--ink);color:var(--bg);border-radius:12px;font-size:.79rem;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}@media(max-width:540px){.grid.three{grid-template-columns:1fr}.grid.two{grid-template-columns:1fr}.app{padding-inline:10px}.card{border-radius:17px}.top{margin-bottom:12px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand"><div class="logo">S</div><div><h1>SA-MASTER.PRO</h1><div class="sub">Кошторис · комплектація · контроль</div></div></div><button class="icon" onclick="startTour()" title="Підказки">?</button></header>
  <section id="home" class="screen active"></section>
  <section id="project" class="screen"></section>
  <section id="catalog" class="screen"></section>
  <section id="finance" class="screen"></section>
</main>
<nav class="nav"><button data-screen="home" class="active" onclick="go('home')">Об’єкти</button><button data-screen="project" onclick="go('project')">Кошторис</button><button data-screen="catalog" onclick="go('catalog')">Каталог</button><button data-screen="finance" onclick="go('finance')">Фінанси</button></nav>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="sheet" class="sheet"></div></div><div id="tour" class="tour"></div><div id="toast" class="toast"></div><input id="xlsx" type="file" accept=".xlsx,.xls,.xlsm" hidden>
<script>
const K='sa_master_estimator_v1';
const uid=(p='id')=>p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const n=v=>Number(v)||0; const fmt=v=>new Intl.NumberFormat('uk-UA',{maximumFractionDigits:0}).format(n(v))+' ₴';
const date=()=>new Date().toISOString(); const day=v=>v?new Intl.DateTimeFormat('uk-UA',{dateStyle:'medium'}).format(new Date(v)):'—';
let state=load(); let currentId=state.ui.currentId||null; let catFilter='all';
function seed(){return {version:1,projects:[],profile:{company:'SA-MASTER.PRO',name:'',phone:'',plan:'base'},team:[],inventory:[],catalog:[
 {id:uid('w'),type:'work',name:'Розведення каналізації',unit:'компл.',price:0,stage:'rough'},
 {id:uid('w'),type:'work',name:'Розведення водопостачання',unit:'компл.',price:0,stage:'rough'},
 {id:uid('w'),type:'work',name:'Монтаж інсталяції',unit:'шт',price:0,stage:'rough'},
 {id:uid('w'),type:'work',name:'Монтаж унітазу',unit:'шт',price:0,stage:'finish'},
 {id:uid('w'),type:'work',name:'Монтаж умивальника',unit:'шт',price:0,stage:'finish'}
],ui:{currentId:null}}}
function load(){try{const x=JSON.parse(localStorage.getItem(K));return x&&Array.isArray(x.projects)?x:seed()}catch{return seed()}}
function save(){state.ui.currentId=currentId;localStorage.setItem(K,JSON.stringify(state))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2300)}
function project(){return state.projects.find(x=>x.id===currentId)}
function estimate(p){return (p?.items||[]).reduce((s,x)=>s+n(x.customerPrice)*n(x.qty),0)}
function cost(p){return (p?.items||[]).filter(x=>x.type==='material').reduce((s,x)=>s+n(x.costPrice)*n(x.qty),0)}
function paid(p){return (p?.payments||[]).reduce((s,x)=>s+n(x.amount),0)}
function expenses(p){return (p?.expenses||[]).reduce((s,x)=>s+n(x.amount),0)}
function payroll(p){return (p?.labour||[]).reduce((s,x)=>s+n(x.amount),0)}
function stageLabel(s){return ({draft:'Чернетка',supplier_review:'Постачальники',client_review:'У клієнта',approved:'Погоджено',active:'В роботі',completed:'Завершено'})[s]||'Чернетка'}
function go(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('active',e.dataset.screen===id));if(id==='home')renderHome();if(id==='project')renderProject();if(id==='catalog')renderCatalog();if(id==='finance')renderFinance()}
function renderHome(){const el=document.getElementById('home');const active=state.projects.filter(p=>p.stage!=='completed');const done=state.projects.filter(p=>p.stage==='completed');if(!state.projects.length){el.innerHTML=`<div class="card hero"><h2>Кошторис без хаосу в цінах.</h2><p>Створіть об’єкт, додайте роботи й матеріали з каталогу, зафіксуйте ціну, погодьте з постачальниками та ведіть фінанси до завершення.</p><div class="steps"><div class="step"><i class="num">1</i>Створити об’єкт і кошторис</div><div class="step"><i class="num">2</i>Перевірити матеріали й постачальників</div><div class="step"><i class="num">3</i>Надіслати замовнику та вести об’єкт</div></div><button class="primary" style="width:100%;min-height:48px;border-radius:14px" onclick="newProject()">+ Створити перший об’єкт</button></div>`;return}el.innerHTML=`<div class="toolbar"><button class="primary" onclick="newProject()">+ Новий об’єкт</button><button class="secondary" onclick="openProfile()">Профіль і команда</button></div><div class="sectionTitle"><h2>Активні об’єкти</h2><span class="meta">${active.length}</span></div><div class="card">${active.length?active.map(projectRow).join(''):'<div class="empty">Активних об’єктів немає.</div>'}</div><div class="sectionTitle"><h2>Завершені</h2><span class="meta">${done.length}</span></div><div class="card">${done.length?done.map(projectRow).join(''):'<div class="empty">Тут збережеться історія завершених об’єктів.</div>'}</div>`}
function projectRow(p){return `<div class="project"><i class="dot ${p.stage}"></i><button style="text-align:left;background:none;padding:0" onclick="openProject('${p.id}')"><div class="pname">${esc(p.title)}</div><div class="pline">${esc(p.client||'Без замовника')} · ${esc(p.address||'Адреса не вказана')}<br><span class="badge ${p.stage==='approved'||p.stage==='active'?'ok':''}">${stageLabel(p.stage)}</span></div></button><div style="text-align:right"><div class="amount">${fmt(estimate(p))}</div><div class="meta">${(p.items||[]).length} поз.</div></div></div>`}
function newProject(){openModal(`<button class="close" onclick="closeModal()">×</button><h2>Новий об’єкт</h2><div class="form"><div class="field"><label class="label">Назва об’єкта *</label><input id="ptitle" placeholder="ЖК, квартира або назва об’єкта"></div><div class="grid two"><div class="field"><label class="label">Замовник</label><input id="pclient" placeholder="Ім’я"></div><div class="field"><label class="label">Телефон</label><input id="pphone" inputmode="tel" placeholder="+380 …"></div></div><div class="field"><label class="label">Адреса</label><input id="paddress" placeholder="Місто, вулиця, будинок"></div><div class="grid two"><div class="field"><label class="label">Санвузлів</label><input id="pbath" inputmode="numeric" placeholder="1"></div><div class="field"><label class="label">Система</label><select id="psystem"><option value="">Не вказано</option><option>Трійникова</option><option>Колекторна</option><option>Змішана</option></select></div></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Скасувати</button><button class="primary" onclick="createProject()">Створити</button></div>`) }
function createProject(){const title=document.getElementById('ptitle').value.trim();if(!title)return toast('Вкажіть назву об’єкта');const p={id:uid('p'),title,client:document.getElementById('pclient').value.trim(),phone:document.getElementById('pphone').value.trim(),address:document.getElementById('paddress').value.trim(),bathrooms:n(document.getElementById('pbath').value),system:document.getElementById('psystem').value,stage:'draft',createdAt:date(),updatedAt:date(),items:[],supplierReviews:[],clientReview:{status:'not_sent',updatedAt:null,note:''},payments:[],expenses:[],labour:[],tasks:[],notes:[]};state.projects.unshift(p);currentId=p.id;save();closeModal();go('project');toast('Об’єкт створено')}
function openProject(id){currentId=id;save();go('project')}
function renderProject(){const el=document.getElementById('project'),p=project();if(!p){el.innerHTML=`<div class="card empty">Оберіть або створіть об’єкт на головній сторінці.</div>`;return}const works=p.items.filter(i=>i.type==='work'),materials=p.items.filter(i=>i.type==='material');const allSupplier=p.supplierReviews||[];const replied=allSupplier.filter(x=>x.status==='confirmed').length;el.innerHTML=`<div class="row between"><button class="secondary" onclick="go('home')">← Об’єкти</button><button class="icon" onclick="editProject()">⋯</button></div><div class="card" style="margin-top:10px"><div class="row between"><div><div class="pname">${esc(p.title)}</div><div class="pline">${esc(p.client||'Замовник не вказаний')}${p.phone?' · '+esc(p.phone):''}<br>${esc(p.address||'Адреса не вказана')}</div></div><span class="badge ${p.stage==='approved'||p.stage==='active'?'ok':''}">${stageLabel(p.stage)}</span></div><div class="row wrap" style="margin-top:10px"><span class="badge">${p.bathrooms||'—'} санвуз.</span>${p.system?`<span class="badge">${esc(p.system)}</span>`:''}<span class="badge ${p.clientReview.status==='approved'?'ok':'warn'}">Клієнт: ${p.clientReview.status==='approved'?'погодив':'не погоджено'}</span></div></div><div class="sectionTitle"><h2>Кошторис</h2><button class="secondary" onclick="addFromCatalog()">+ Позиція</button></div><div class="card">${works.length?section('Роботи',works):''}${materials.length?section('Матеріали',materials):''}${!p.items.length?'<div class="empty">Додайте роботу або матеріал із каталогу.</div>':''}<div class="subTotal"><span>Роботи</span><b>${fmt(works.reduce((s,x)=>s+n(x.customerPrice)*n(x.qty),0))}</b></div><div class="subTotal"><span>Матеріали</span><b>${fmt(materials.reduce((s,x)=>s+n(x.customerPrice)*n(x.qty),0))}</b></div><div class="row between" style="padding-top:11px"><b>До сплати</b><span class="total">${fmt(estimate(p))}</span></div></div><div class="sectionTitle"><h2>Погодження</h2><span class="meta">${replied}/${allSupplier.length||0} постачальників</span></div>${renderApproval(p)}<div class="sectionTitle"><h2>Команда й нотатки</h2><button class="secondary" onclick="addTask()">+ Нотатка</button></div><div class="card">${(p.tasks||[]).length?p.tasks.map(taskRow).join(''):'<div class="empty">Тут можна фіксувати завдання, докупівлі та коментарі команди.</div>'}</div><div class="sticky"><div class="toolbar"><button class="secondary" onclick="shareProject('client')">Надіслати клієнту</button><button class="primary" onclick="startSupplierReview()">Погодити з постачальниками</button></div></div>`}
function section(name,items){return `<div class="lineName" style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:3px 0 6px">${name}</div>${items.map(itemRow).join('')}`}
function itemRow(i){const p=project();return `<div class="line"><div class="row between"><div style="min-width:0;flex:1"><div class="lineName">${esc(i.name)}</div><div class="lineInfo">${i.type==='material'?`${esc(i.supplier||'Ціну не обрано')} · ${esc(i.priceModeLabel||'ручна ціна')}`:esc(i.unit)}${i.priceSnapshotAt?' · зафіксовано '+day(i.priceSnapshotAt):''}</div></div><button class="danger small" onclick="removeItem('${i.id}')">×</button></div><div class="row between" style="margin-top:8px"><div class="qty"><button onclick="qty('${i.id}',-1)">−</button><span>${i.qty}</span><button onclick="qty('${i.id}',1)">＋</button></div><button class="small secondary" onclick="editItem('${i.id}')">${fmt(i.customerPrice)} / ${esc(i.unit)}</button><b class="total">${fmt(n(i.customerPrice)*n(i.qty))}</b></div></div>`}
function renderApproval(p){const reviews=p.supplierReviews||[];const materialSuppliers=[...new Set(p.items.filter(i=>i.type==='material'&&i.supplier).map(i=>i.supplier))];const supplierBlock=materialSuppliers.length?`<div class="card"><div class="row between"><b style="font-size:.9rem">Постачальники</b><button class="secondary" onclick="shareProject('supplier')">Надіслати запити</button></div>${materialSuppliers.map(s=>{const r=reviews.find(x=>x.supplier===s)||{status:'pending'};return `<div class="line"><div class="row between"><div><div class="lineName">${esc(s)}</div><div class="lineInfo">${r.status==='confirmed'?'Підтверджено':r.status==='changes'?'Є коригування':'Очікується відповідь'}${r.note?' · '+esc(r.note):''}</div></div><button class="small ${r.status==='confirmed'?'secondary':'primary'}" onclick="supplierReply('${encodeURIComponent(s)}')">${r.status==='confirmed'?'Переглянути':'Внести відповідь'}</button></div></div>`}).join('')}<div class="progress"><i style="width:${reviews.length?Math.round(reviews.filter(x=>x.status==='confirmed').length/materialSuppliers.length*100):0}%"></i></div></div>`:'<div class="card hint warnBox">Матеріали без вибраного постачальника не можна надіслати на погодження.</div>';return `${supplierBlock}<div class="card" style="margin-top:10px"><div class="row between"><div><b style="font-size:.9rem">Замовник</b><div class="lineInfo">${p.clientReview.status==='approved'?'Кошторис погоджено':p.clientReview.status==='declined'?'Кошторис відхилено':'Очікує рішення'}</div></div><button class="small primary" onclick="clientReply()">Статус клієнта</button></div></div>`}
function addFromCatalog(){if(!project())return toast('Спершу оберіть об’єкт');go('catalog');toast('Оберіть позицію в каталозі')}
function renderCatalog(){const el=document.getElementById('catalog');const items=state.catalog.filter(x=>catFilter==='all'||x.type===catFilter);el.innerHTML=`<div class="toolbar"><button class="primary" onclick="newCatalogItem()">+ Позиція</button><button class="secondary" onclick="importFile()">Імпорт Excel</button></div><div class="pillbar"><button class="pill ${catFilter==='all'?'on':''}" onclick="filterCat('all')">Усі</button><button class="pill ${catFilter==='work'?'on':''}" onclick="filterCat('work')">Роботи</button><button class="pill ${catFilter==='material'?'on':''}" onclick="filterCat('material')">Матеріали</button></div><div class="card">${items.length?items.map(catalogRow).join(''):'<div class="empty">Каталог порожній.</div>'}</div><div class="card hint" style="margin-top:11px">Ціна в кошторисі фіксується в момент додавання. Зміни постачальника або курсу впливають лише на майбутні позиції.</div>`}
function filterCat(v){catFilter=v;renderCatalog()}
function catalogRow(c){const offers=c.offers||[];return `<div class="line"><div class="row between"><div style="min-width:0;flex:1"><div class="lineName">${esc(c.name)}</div><div class="lineInfo">${c.type==='work'?`${c.stage==='finish'?'Чистовий':'Чорновий'} · ${fmt(c.price)} / ${esc(c.unit)}`:`${esc(c.category||'Інше')}${c.brand?' · '+esc(c.brand):''}${c.system?' · '+esc(c.system):''}${offers.length?' · '+offers.length+' постач.':''} · залишок: ${n(c.stock)} ${esc(c.unit)}`}</div></div><div class="row"><button class="small secondary" onclick="editCatalog('${c.id}')">✎</button>${currentId?`<button class="small primary" onclick="pickCatalog('${c.id}')">Додати</button>`:''}</div></div></div>`}
function newCatalogItem(){openCatalogEditor()}
function openCatalogEditor(id){const c=state.catalog.find(x=>x.id===id)||{id:'',type:'material',name:'',unit:'шт',price:0,stage:'rough',category:'other',brand:'',system:'',article:'',stock:0,offers:[]};const offers=(c.offers||[]).map(o=>`<div class="offer"><div class="offerHead"><span>${esc(o.supplier)}</span><span>${moneyCur(o.retail,o)} / ${moneyCur(o.master,o)}</span></div><div class="lineInfo">${esc(o.currency)} · курс ${o.rate||1} · ${day(o.updatedAt)}</div><div class="row" style="margin-top:7px"><button class="small secondary" onclick="openOfferEditor('${c.id}','${o.id}')">Редагувати</button><button class="small danger" onclick="deleteOffer('${c.id}','${o.id}')">Видалити</button></div></div>`).join('');openModal(`<button class="close" onclick="closeModal()">×</button><h2>${id?'Редагувати позицію':'Нова позиція'}</h2><div class="form"><div class="grid two"><div class="field"><label class="label">Тип</label><select id="ctype"><option value="work" ${c.type==='work'?'selected':''}>Робота</option><option value="material" ${c.type==='material'?'selected':''}>Матеріал</option></select></div><div class="field"><label class="label">Одиниця</label><input id="cunit" value="${esc(c.unit)}"></div></div><div class="field"><label class="label">Назва *</label><input id="cname" value="${esc(c.name)}"></div><div class="grid two"><div class="field"><label class="label">Ціна роботи / ручна ціна</label><input id="cprice" inputmode="decimal" value="${c.price||''}"></div><div class="field"><label class="label">Етап роботи</label><select id="cstage"><option value="rough" ${c.stage==='rough'?'selected':''}>Чорновий</option><option value="finish" ${c.stage==='finish'?'selected':''}>Чистовий</option></select></div></div><div class="grid two"><div class="field"><label class="label">Категорія матеріалу</label><select id="ccategory"><option ${c.category==='other'?'selected':''} value="other">Інше</option><option ${c.category==='water'?'selected':''} value="water">Водопостачання</option><option ${c.category==='sewer'?'selected':''} value="sewer">Каналізація</option><option ${c.category==='fittings'?'selected':''} value="fittings">Арматура</option></select></div><div class="field"><label class="label">Артикул</label><input id="carticle" value="${esc(c.article)}"></div></div><div class="grid two"><div class="field"><label class="label">Бренд</label><input id="cbrand" value="${esc(c.brand)}"></div><div class="field"><label class="label">Система</label><input id="csystem" value="${esc(c.system)}"></div></div><div class="field"><label class="label">Залишок на складі</label><input id="cstock" inputmode="decimal" value="${n(c.stock)}"></div>${id&&c.type==='material'?`<div class="sectionTitle"><h2>Пропозиції постачальників</h2><button class="secondary" onclick="openOfferEditor('${c.id}')">+ Ціна</button></div>${offers||'<div class="hint">Додайте першу пропозицію постачальника.</div>'}`:c.type==='material'?`<div class="hint">Спершу збережіть матеріал, потім додайте його пропозиції постачальників.</div>`:''}</div><div class="actions"><button class="secondary" onclick="closeModal()">Скасувати</button><button class="primary" onclick="saveCatalogItem('${c.id}')">Зберегти</button></div>`) }
function saveCatalogItem(id){const name=document.getElementById('cname').value.trim();if(!name)return toast('Вкажіть назву');let c=state.catalog.find(x=>x.id===id);if(!c){c={id:uid('c'),offers:[]};state.catalog.push(c)}c.type=document.getElementById('ctype').value;c.name=name;c.unit=document.getElementById('cunit').value.trim()||'шт';c.price=n(document.getElementById('cprice').value);c.stage=document.getElementById('cstage').value;c.category=document.getElementById('ccategory').value;c.article=document.getElementById('carticle').value.trim();c.brand=document.getElementById('cbrand').value.trim();c.system=document.getElementById('csystem').value.trim();c.stock=n(document.getElementById('cstock').value);save();closeModal();renderCatalog();toast('Збережено')}
function openOfferEditor(cId,oId){const c=state.catalog.find(x=>x.id===cId),o=(c.offers||[]).find(x=>x.id===oId)||{id:'',supplier:'',currency:'UAH',rate:1,retail:'',master:'',note:''};openModal(`<button class="close" onclick="closeModal()">×</button><h2>${oId?'Редагувати ціну':'Нова пропозиція'}</h2><div class="form"><div class="field"><label class="label">Постачальник *</label><input id="osupplier" value="${esc(o.supplier)}"></div><div class="grid two"><div class="field"><label class="label">Валюта</label><select id="ocurrency"><option ${o.currency==='UAH'?'selected':''}>UAH</option><option ${o.currency==='EUR'?'selected':''}>EUR</option><option ${o.currency==='USD'?'selected':''}>USD</option></select></div><div class="field"><label class="label">Ручний курс до ₴</label><input id="orate" inputmode="decimal" value="${o.rate||1}"></div></div><div class="grid two"><div class="field"><label class="label">Роздрібна ціна</label><input id="oretail" inputmode="decimal" value="${o.retail||''}"></div><div class="field"><label class="label">Ціна майстра</label><input id="omaster" inputmode="decimal" value="${o.master||''}"></div></div><div class="field"><label class="label">Уточнення</label><input id="onote" value="${esc(o.note||'')}"></div></div><div class="actions"><button class="secondary" onclick="editCatalog('${cId}')">Назад</button><button class="primary" onclick="saveOffer('${cId}','${o.id}')">Зберегти</button></div>`) }
function saveOffer(cId,oId){const c=state.catalog.find(x=>x.id===cId),supplier=document.getElementById('osupplier').value.trim();if(!supplier)return toast('Вкажіть постачальника');let o=c.offers.find(x=>x.id===oId);if(!o){o={id:uid('o')};c.offers.push(o)}o.supplier=supplier;o.currency=document.getElementById('ocurrency').value;o.rate=n(document.getElementById('orate').value)||1;o.retail=n(document.getElementById('oretail').value);o.master=n(document.getElementById('omaster').value);o.note=document.getElementById('onote').value.trim();o.updatedAt=date();save();editCatalog(cId);toast('Пропозицію збережено')}
function deleteOffer(cId,oId){const c=state.catalog.find(x=>x.id===cId);c.offers=c.offers.filter(x=>x.id!==oId);save();editCatalog(cId)}
function editCatalog(id){openCatalogEditor(id)}
function pickCatalog(id){const c=state.catalog.find(x=>x.id===id);if(!c)return;if(c.type==='work'){addItem({catalogId:c.id,type:'work',name:c.name,unit:c.unit,qty:1,customerPrice:c.price,costPrice:0,priceModeLabel:'ціна роботи',priceSnapshotAt:date()});return}pickOffer(c)}
function pickOffer(c){const offers=c.offers||[];if(!offers.length){return toast('Спершу додайте ціну постачальника до цього матеріалу')}openModal(`<button class="close" onclick="closeModal()">×</button><h2>Ціна для кошторису</h2><div class="hint">Майстер сам обирає погоджену, роздрібну або роздрібну зі знижкою ціну. Вибір зафіксується в кошторисі.</div><div class="form" style="margin-top:11px">${offers.map(o=>`<div class="offer"><div class="offerHead"><span>${esc(o.supplier)}</span><span class="badge ${isOld(o.updatedAt)?'warn':''}">${esc(o.currency)} · ${day(o.updatedAt)}</span></div><div class="lineInfo">Роздріб: ${moneyCur(o.retail,o)} · Майстер: ${moneyCur(o.master,o)}${o.note?' · '+esc(o.note):''}</div><div class="row wrap" style="margin-top:8px">${o.master>0?`<button class="small primary" onclick="chooseOffer('${c.id}','${o.id}','master')">Ціна майстра</button>`:''}${o.retail>0?`<button class="small secondary" onclick="chooseOffer('${c.id}','${o.id}','retail')">Роздріб</button><button class="small secondary" onclick="chooseOffer('${c.id}','${o.id}','discount')">Роздріб зі знижкою</button>`:''}</div></div>`).join('')}</div>`) }
function isOld(d){return d&&Date.now()-new Date(d).getTime()>30*864e5}function moneyCur(v,o){return n(v).toLocaleString('uk-UA')+' '+(o.currency||'₴')}
function chooseOffer(cId,oId,mode){const c=state.catalog.find(x=>x.id===cId),o=(c.offers||[]).find(x=>x.id===oId);if(!c||!o)return;let discount=0;if(mode==='discount'){const a=prompt('Знижка від роздрібної ціни, %:','0');if(a===null)return;discount=n(String(a).replace(',','.'));if(discount<0||discount>=100)return toast('Некоректна знижка')}const source=mode==='master'?n(o.master):n(o.retail);const final=source*(1-discount/100)*rate(o);addItem({catalogId:c.id,type:'material',name:c.name,unit:c.unit,qty:1,customerPrice:final,costPrice:n(o.master)*rate(o),supplier:o.supplier,offerId:o.id,priceMode:mode,priceModeLabel:mode==='master'?'ціна майстра':mode==='retail'?'роздрібна':'роздрібна − '+discount+'%',discount,sourcePrice:source,sourceCurrency:o.currency,sourceRate:o.rate,priceSnapshotAt:date()});closeModal()}
function rate(o){return o.currency==='UAH'?1:n(o.rate)||0}function addItem(x){const p=project();if(!p)return;const same=p.items.find(i=>i.catalogId===x.catalogId&&i.offerId===x.offerId&&i.priceMode===x.priceMode&&i.discount===x.discount);if(same)same.qty++;else p.items.push({id:uid('i'),...x});p.updatedAt=date();save();go('project');toast('Додано до кошторису')}
function qty(id,d){const i=project().items.find(x=>x.id===id);if(!i)return;i.qty=Math.max(1,n(i.qty)+d);save();renderProject()}
function removeItem(id){const p=project();p.items=p.items.filter(x=>x.id!==id);save();renderProject()}
function editItem(id){const i=project().items.find(x=>x.id===id);openModal(`<button class="close" onclick="closeModal()">×</button><h2>Ціна позиції</h2><div class="hint">Ручна зміна діє тільки для цього кошторису та не переписує каталог.</div><div class="form" style="margin-top:12px"><div class="field"><label class="label">Ціна для клієнта, ₴</label><input id="iprice" inputmode="decimal" value="${i.customerPrice}"></div><div class="field"><label class="label">Закупівельна ціна, ₴</label><input id="icost" inputmode="decimal" value="${i.costPrice||0}"></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Скасувати</button><button class="primary" onclick="saveItemPrice('${i.id}')">Зберегти</button></div>`) }
function saveItemPrice(id){const i=project().items.find(x=>x.id===id);i.customerPrice=n(document.getElementById('iprice').value);i.costPrice=n(document.getElementById('icost').value);i.priceModeLabel='ручне коригування';i.priceSnapshotAt=date();save();closeModal();renderProject()}
function startSupplierReview(){const p=project(),names=[...new Set(p.items.filter(i=>i.type==='material'&&i.supplier).map(i=>i.supplier))];if(!names.length)return toast('Додайте матеріали з пропозиціями постачальників');p.supplierReviews=names.map(s=>p.supplierReviews.find(x=>x.supplier===s)||{supplier:s,status:'pending',note:'',sentAt:date(),updatedAt:date()});p.stage='supplier_review';save();renderProject();toast('Запити сформовано')}
function supplierReply(encoded){const s=decodeURIComponent(encoded),p=project();const r=(p.supplierReviews||[]).find(x=>x.supplier===s);openModal(`<button class="close" onclick="closeModal()">×</button><h2>${esc(s)} — відповідь</h2><div class="form"><div class="field"><label class="label">Статус</label><select id="rstatus"><option value="pending" ${r?.status==='pending'?'selected':''}>Очікується</option><option value="confirmed" ${r?.status==='confirmed'?'selected':''}>Підтверджено</option><option value="changes" ${r?.status==='changes'?'selected':''}>Є коригування</option><option value="declined" ${r?.status==='declined'?'selected':''}>Не може поставити</option></select></div><div class="field"><label class="label">Нотатка / зміни</label><textarea id="rnote">${esc(r?.note||'')}</textarea></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Скасувати</button><button class="primary" onclick="saveSupplierReply('${encodeURIComponent(s)}')">Зберегти</button></div>`) }
function saveSupplierReply(encoded){const s=decodeURIComponent(encoded),p=project();let r=p.supplierReviews.find(x=>x.supplier===s);if(!r){r={supplier:s};p.supplierReviews.push(r)}r.status=document.getElementById('rstatus').value;r.note=document.getElementById('rnote').value.trim();r.updatedAt=date();save();closeModal();renderProject()}
function clientReply(){const p=project();openModal(`<button class="close" onclick="closeModal()">×</button><h2>Статус замовника</h2><div class="form"><div class="field"><label class="label">Рішення</label><select id="clstatus"><option value="not_sent">Ще не надіслано</option><option value="pending">Очікується відповідь</option><option value="approved">Погоджено</option><option value="declined">Відхилено</option></select></div><div class="field"><label class="label">Коментар</label><textarea id="clnote">${esc(p.clientReview.note||'')}</textarea></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Скасувати</button><button class="primary" onclick="saveClientReply()">Зберегти</button></div>`);setTimeout(()=>document.getElementById('clstatus').value=p.clientReview.status,0)}
function saveClientReply(){const p=project();p.clientReview={status:document.getElementById('clstatus').value,note:document.getElementById('clnote').value.trim(),updatedAt:date()};if(p.clientReview.status==='approved')p.stage='approved';save();closeModal();renderProject()}
function taskRow(t){return `<div class="line"><div class="row between"><label class="check"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><span>${esc(t.text)}</span></label><span class="meta">${esc(t.assignee||'')}</span></div></div>`}
function addTask(){const p=project();openModal(`<button class="close" onclick="closeModal()">×</button><h2>Нотатка або завдання</h2><div class="form"><div class="field"><label class="label">Текст *</label><textarea id="ttext" placeholder="Наприклад: докупити два крани 1/2″"></textarea></div><div class="field"><label class="label">Виконавець</label><select id="tperson"><option value="">Не призначено</option>${state.team.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Скасувати</button><button class="primary" onclick="saveTask()">Додати</button></div>`) }
function saveTask(){const text=document.getElementById('ttext').value.trim();if(!text)return toast('Напишіть текст');project().tasks.push({id:uid('t'),text,assignee:document.getElementById('tperson').value,done:false,createdAt:date()});save();closeModal();renderProject()}
function toggleTask(id){const t=project().tasks.find(x=>x.id===id);t.done=!t.done;save()}
function shareProject(kind){const p=project();if(kind==='client'){const suppliers=[...new Set(p.items.filter(i=>i.type==='material'&&i.supplier).map(i=>i.supplier))],confirmed=(p.supplierReviews||[]).filter(x=>x.status==='confirmed').map(x=>x.supplier);if(suppliers.length&&suppliers.some(s=>!confirmed.includes(s)))return toast('Спершу дочекайтесь підтвердження всіх постачальників');p.clientReview.status='pending';p.clientReview.updatedAt=date();p.stage='client_review';save()}let text='';if(kind==='client')text=`Кошторис: ${p.title}\nЗамовник: ${p.client||'—'}\nДо сплати: ${fmt(estimate(p))}\nПозицій: ${p.items.length}\nСтан: ${stageLabel(p.stage)}\n\nЦіни зафіксовані: ${day(date())}.`;else{const groups={};p.items.filter(i=>i.type==='material'&&i.supplier).forEach(i=>(groups[i.supplier]??=[]).push(i));text=Object.entries(groups).map(([s,arr])=>`Запит постачальнику: ${s}\nОб’єкт: ${p.title}\n${arr.map(i=>`• ${i.name} — ${i.qty} ${i.unit}`).join('\n')}`).join('\n\n')}if(navigator.share)navigator.share({title:'SA-MASTER.PRO',text}).catch(()=>{});else navigator.clipboard?.writeText(text).then(()=>toast('Текст скопійовано'));if(kind==='client')renderProject()}
function renderFinance(){const ps=state.projects;const revenue=ps.reduce((s,p)=>s+paid(p),0), allExp=ps.reduce((s,p)=>s+expenses(p),0),allLab=ps.reduce((s,p)=>s+payroll(p),0),allCost=ps.reduce((s,p)=>s+cost(p),0);const completed=ps.filter(p=>p.stage==='completed');const avg=completed.length?completed.reduce((s,p)=>s+estimate(p),0)/completed.length:0;const cur=project();const comparable=cur?completed.filter(p=>(!cur.bathrooms||p.bathrooms===cur.bathrooms)&&(!cur.system||p.system===cur.system)):[];const compAvg=comparable.length?comparable.reduce((s,p)=>s+estimate(p),0)/comparable.length:0;document.getElementById('finance').innerHTML=`<div class="grid three"><div class="card stat"><span>Оплачено</span><b>${fmt(revenue)}</b></div><div class="card stat"><span>Витрати</span><b>${fmt(allExp+allCost)}</b></div><div class="card stat"><span>Залишок</span><b>${fmt(revenue-allExp-allCost-allLab)}</b></div></div><div class="sectionTitle"><h2>Фінанси об’єкта</h2>${cur?`<button class="secondary" onclick="financeEntry()">+ Запис</button>`:''}</div><div class="card">${cur?financeProject(cur):'<div class="empty">Оберіть об’єкт, щоб додати оплату, витрати або зарплату.</div>'}</div><div class="sectionTitle"><h2>Історія та орієнтир</h2></div><div class="card"><div class="lineName">Середній завершений об’єкт</div><div class="total" style="margin-top:5px">${completed.length?fmt(avg):'Ще немає завершених об’єктів'}</div>${cur?`<div class="line" style="margin-top:9px"><div class="lineName">Подібні до поточного: ${cur.bathrooms||'—'} санвуз. · ${esc(cur.system||'система не вказана')}</div><div class="total" style="margin-top:5px">${comparable.length?fmt(compAvg):'Ще немає подібних завершених об’єктів'}</div></div>`:''}<div class="lineInfo" style="margin-top:8px">Це орієнтир на основі завершених об’єктів, а не автоматична ціна для клієнта.</div></div>`}
function financeProject(p){const list=[...(p.payments||[]).map(x=>({...x,kind:'Оплата',plus:true})),...(p.expenses||[]).map(x=>({...x,kind:'Витрата'})),...(p.labour||[]).map(x=>({...x,kind:'Зарплата'}))];return `<div class="grid two"><div class="stat"><span>Кошторис</span><b>${fmt(estimate(p))}</b></div><div class="stat"><span>Закупівля</span><b>${fmt(cost(p))}</b></div></div>${list.length?list.map(x=>`<div class="line row between"><div><div class="lineName">${x.kind}: ${esc(x.note||'Без опису')}</div><div class="lineInfo">${day(x.createdAt)}</div></div><b style="color:${x.plus?'var(--green)':'var(--red)'}">${x.plus?'+':'−'}${fmt(x.amount)}</b></div>`).join(''):'<div class="empty">Фінансових записів ще немає.</div>'}`}
function financeEntry(){openModal(`<button class="close" onclick="closeModal()">×</button><h2>Фінансовий запис</h2><div class="form"><div class="field"><label class="label">Тип</label><select id="fkind"><option value="payments">Оплата від клієнта</option><option value="expenses">Додаткова витрата</option><option value="labour">Зарплата</option></select></div><div class="field"><label class="label">Сума, ₴</label><input id="famount" inputmode="decimal"></div><div class="field"><label class="label">Коментар</label><input id="fnote" placeholder="Що це за операція"></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Скасувати</button><button class="primary" onclick="saveFinance()">Зберегти</button></div>`) }
function saveFinance(){const p=project(),kind=document.getElementById('fkind').value,amount=n(document.getElementById('famount').value);if(amount<=0)return toast('Вкажіть суму');p[kind].push({id:uid('f'),amount,note:document.getElementById('fnote').value.trim(),createdAt:date()});save();closeModal();renderFinance()}
function openProfile(){openModal(`<button class="close" onclick="closeModal()">×</button><h2>Профіль і команда</h2><div class="form"><div class="grid two"><div class="field"><label class="label">Ім’я</label><input id="prname" value="${esc(state.profile.name)}"></div><div class="field"><label class="label">Телефон</label><input id="prphone" value="${esc(state.profile.phone)}"></div></div><div class="field"><label class="label">Компанія</label><input id="prcompany" value="${esc(state.profile.company)}"></div></div><div class="sectionTitle"><h2>Команда</h2><button class="secondary" onclick="addTeam()">+ Людина</button></div><div class="card">${state.team.length?state.team.map(x=>`<div class="line row between"><div><div class="lineName">${esc(x.name)}</div><div class="lineInfo">${esc(x.role||'Майстер')}</div></div><button class="danger small" onclick="deleteTeam('${x.id}')">×</button></div>`).join(''):'<div class="empty">Команда ще не додана.</div>'}</div><div class="actions"><button class="primary" onclick="saveProfile()">Зберегти профіль</button></div>`) }
function saveProfile(){state.profile.name=document.getElementById('prname').value.trim();state.profile.phone=document.getElementById('prphone').value.trim();state.profile.company=document.getElementById('prcompany').value.trim();save();closeModal();renderHome()}
function addTeam(){const name=prompt('Ім’я працівника:');if(!name)return;state.team.push({id:uid('u'),name:name.trim(),role:'Майстер'});save();openProfile()}
function deleteTeam(id){state.team=state.team.filter(x=>x.id!==id);save();openProfile()}
function editProject(){const p=project();openModal(`<button class="close" onclick="closeModal()">×</button><h2>Керування об’єктом</h2><div class="form"><div class="field"><label class="label">Стадія</label><select id="pstage">${['draft','supplier_review','client_review','approved','active','completed'].map(s=>`<option value="${s}" ${p.stage===s?'selected':''}>${stageLabel(s)}</option>`).join('')}</select></div><div class="field"><label class="label">Назва</label><input id="etitle" value="${esc(p.title)}"></div></div><div class="actions"><button class="danger" onclick="deleteProject('${p.id}')">Видалити</button><button class="primary" onclick="saveProjectEdit()">Зберегти</button></div>`) }
function saveProjectEdit(){const p=project();p.title=document.getElementById('etitle').value.trim()||p.title;p.stage=document.getElementById('pstage').value;p.updatedAt=date();save();closeModal();renderProject()}
function deleteProject(id){if(!confirm('Видалити об’єкт і всі його дані?'))return;state.projects=state.projects.filter(x=>x.id!==id);currentId=null;save();closeModal();go('home')}
function importFile(){document.getElementById('xlsx').click()}
document.getElementById('xlsx').onchange=async e=>{const f=e.target.files?.[0];e.target.value='';if(!f||typeof XLSX==='undefined')return toast('Не вдалося відкрити XLSX');const supplier=prompt('Коротка назва постачальника:');if(!supplier)return;const currency=(prompt('Валюта цін: UAH, EUR або USD','UAH')||'').toUpperCase();if(!['UAH','EUR','USD'].includes(currency))return toast('Некоректна валюта');const rate=currency==='UAH'?1:n(prompt('Ручний курс до гривні:',currency==='EUR'?'45':'41'));if(rate<=0)return toast('Вкажіть коректний курс');const mode=(prompt('Тип колонки ціни: retail або master','retail')||'retail').toLowerCase();try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const sh=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:''});const head=rows.findIndex(r=>r.some(x=>/назв|найменув|товар|product/i.test(String(x))));if(head<0)throw Error();const h=rows[head].map(x=>String(x).toLowerCase());const col=(rx)=>h.findIndex(x=>rx.test(x));const nc=col(/назв|найменув|товар|product/),ac=col(/артикул|sku|код/),uc=col(/^од|unit/),pc=col(/ціна|цена|price/);if(nc<0||pc<0)throw Error();let added=0;rows.slice(head+1).forEach(r=>{const name=String(r[nc]||'').trim(),price=n(String(r[pc]).replace(',','.'));if(!name||price<=0)return;let c=state.catalog.find(x=>x.type==='material'&&x.article&&String(x.article)===String(r[ac]||'').trim())||state.catalog.find(x=>x.type==='material'&&x.name.toLowerCase()===name.toLowerCase());if(!c){c={id:uid('m'),type:'material',name,unit:String(r[uc]||'шт').trim()||'шт',category:'other',brand:'',system:'',article:String(r[ac]||'').trim(),offers:[]};state.catalog.push(c)}const old=c.offers.find(x=>x.supplier===supplier);const o={id:old?.id||uid('o'),supplier,currency,rate,retail:mode==='retail'?price:n(old?.retail),master:mode==='master'?price:n(old?.master),updatedAt:date(),note:'Імпорт із '+f.name};if(old)Object.assign(old,o);else c.offers.push(o);added++});save();renderCatalog();toast('Імпортовано '+added+' позицій')}catch{toast('Не вдалося розпізнати таблицю')}};
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('sheet').innerHTML=''}function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open')}
const tourSteps=[['Старт','Тут зберігаються активні й завершені об’єкти. Створіть об’єкт за 1 хвилину.'],['Кошторис','Додавайте роботи або матеріали. Ціна кожної доданої позиції зберігається окремо.'],['Каталог','Імпортуйте прайси постачальників або додавайте позиції вручну.'],['Погодження','Надсилайте короткий запит постачальнику та фіксуйте його відповідь у сервісі.'],['Фінанси','Додавайте оплату, витрати й зарплату, щоб бачити фінальний результат.']];let tourI=0;function startTour(){tourI=0;renderTour()}function renderTour(){const [h,t]=tourSteps[tourI],e=document.getElementById('tour');e.innerHTML=`<strong>${tourI+1}/${tourSteps.length} · ${h}</strong><p>${t}</p><div class="row between"><button class="small" onclick="stopTour()">Закрити</button><button class="small primary" onclick="nextTour()">${tourI===tourSteps.length-1?'Готово':'Далі'}</button></div>`;e.classList.add('show')}function nextTour(){if(++tourI>=tourSteps.length)stopTour();else renderTour()}function stopTour(){document.getElementById('tour').classList.remove('show')}
renderHome();
