<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Калькулятор сантехніка</title>

<style>
:root{
  --bg:#f4f6fa;
  --card:rgba(255,255,255,.9);
  --soft:#eef1f5;
  --line:#e2e5ea;
  --text:#15171a;
  --muted:#7b8088;
  --blue:#007aff;
  --red:#ff3b30;
  --shadow:0 8px 25px rgba(30,40,60,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  background:none;
  color:inherit;
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:560px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */

.header{
  flex:0 0 auto;
  padding:
    calc(9px + env(safe-area-inset-top))
    14px
    7px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:19px;
  font-weight:750;
  letter-spacing:-.4px;
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:1px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:9px;
}

.date{
  color:var(--muted);
  font-size:12px;
}

.masterButton{
  width:32px;
  height:32px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:var(--blue);
  box-shadow:0 3px 12px rgba(30,40,60,.06);
}

.masterButton svg{
  width:19px;
  height:19px;
}

/* ================= CLIENT ================= */

.clientWrap{
  flex:0 0 auto;
  padding:0 12px 8px;
}

.clientTitle{
  padding:0 3px 5px;
  font-size:13px;
  font-weight:750;
}

.client{
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:17px;
  padding:9px;
  box-shadow:var(--shadow);
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field input{
  width:100%;
  height:36px;
  border:0;
  outline:0;
  border-radius:10px;
  background:var(--soft);
  padding:0 10px;
  font-size:13px;
  color:var(--text);
}

.field input:focus{
  background:#fff;
  box-shadow:inset 0 0 0 1.5px var(--blue);
}

/* ================= ESTIMATE ================= */

.estimate{
  min-height:0;
  flex:1;
  margin:0 12px;
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:20px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.estimateHead{
  flex:0 0 auto;
  padding:11px 13px 7px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.estimateHead strong{
  font-size:15px;
}

.estimateHeadRight{
  display:flex;
  align-items:center;
  gap:8px;
}

.count{
  color:var(--muted);
  font-size:11px;
}

.clearEstimate{
  display:none;
  padding:5px 7px;
  border-radius:8px;
  background:#fff0ef;
  color:var(--red);
  font-size:11px;
  font-weight:700;
}

.clearEstimate:active{
  background:#ffe3e0;
}

/* ================= LIST ================= */

.list{
  min-height:0;
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:0 9px 8px;
  -webkit-overflow-scrolling:touch;
}

.section{
  margin:4px 3px 10px;
}

.sectionTitle{
  padding:5px 5px 4px;
  font-size:10px;
  font-weight:800;
  color:var(--muted);
  letter-spacing:.55px;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
  padding:9px 5px;
  border-top:1px solid var(--line);
}

.name{
  font-size:14px;
  font-weight:650;
  line-height:1.2;
  overflow-wrap:anywhere;
}

.controls{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:5px;
}

.qty{
  display:flex;
  align-items:center;
  background:var(--soft);
  border-radius:9px;
  overflow:hidden;
}

.qty button{
  width:27px;
  height:27px;
  font-size:17px;
  color:#555;
}

.qty b{
  min-width:25px;
  text-align:center;
  font-size:12px;
}

.qtyValue{
  min-width:30px;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.price{
  padding:0;
  color:var(--muted);
  font-size:11px;
  text-decoration:underline;
  text-underline-offset:2px;
}

.right{
  display:flex;
  align-items:center;
  gap:5px;
}

.lineTotal{
  white-space:nowrap;
  font-size:14px;
  font-weight:750;
}

.delete{
  width:27px;
  height:27px;
  border-radius:8px;
  color:#999;
  font-size:19px;
}

.delete:active{
  background:#fee;
  color:var(--red);
}

/* ================= EMPTY ================= */

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  padding:30px;
}

/* ================= BOTTOM ================= */

.bottom{
  flex:0 0 auto;
  padding:
    7px
    12px
    calc(9px + env(safe-area-inset-bottom));
}

.totalBar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:5px 3px 8px;
}

.totalBar span{
  color:var(--muted);
  font-size:13px;
}

.totalBar strong{
  font-size:22px;
  letter-spacing:-.5px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.action{
  height:43px;
  border-radius:14px;
  background:#fff;
  box-shadow:0 5px 18px rgba(30,40,60,.07);
  color:var(--blue);
  font-size:14px;
  font-weight:700;
}

/* ================= CATALOG SHEET ================= */

.sheet{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(5px);
}

.sheet.open{
  display:flex;
}

.panel{
  width:100%;
  max-width:560px;
  height:min(84dvh,720px);
  margin:auto;
  background:#f6f7fa;
  border-radius:22px 22px 0 0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}

.panelHead{
  flex:0 0 auto;
  padding:11px 14px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panelHead strong{
  font-size:18px;
}

.panelHeadRight{
  display:flex;
  align-items:center;
  gap:4px;
}

.catalogEditButton{
  height:32px;
  padding:0 9px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  font-size:12px;
  font-weight:700;
}

.catalogEditButton.active{
  background:var(--blue);
  color:#fff;
}

.close{
  width:32px;
  height:32px;
  font-size:28px;
  color:#777;
}

.search{
  flex:0 0 auto;
  width:calc(100% - 24px);
  margin:0 12px 8px;
  height:40px;
  border:0;
  outline:0;
  border-radius:12px;
  background:#e9ebef;
  padding:0 12px;
  font-size:14px;
}

.search:focus{
  background:#fff;
  box-shadow:inset 0 0 0 1.5px var(--blue);
}

/* ================= FILTERS ================= */

.filters{
  flex:0 0 auto;
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:0 12px 9px;
  white-space:nowrap;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  padding:7px 12px;
  border-radius:999px;
  background:#e7eaf0;
  font-size:12px;
  font-weight:700;
}

.filter.active{
  background:var(--blue);
  color:white;
}

/* ================= CATALOG ================= */

.catalog{
  min-height:0;
  flex:1;
  overflow-y:auto;
  padding:0 12px 20px;
  -webkit-overflow-scrolling:touch;
}

.catalogTitle{
  padding:5px 3px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:.5px;
}

.catalogItem{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:left;
  background:#fff;
  border-radius:13px;
  padding:10px 11px;
  margin:5px 0;
  box-shadow:0 2px 10px rgba(30,40,60,.045);
  transition:none;
}

.catalogItem.added{
  background:#eaf3ff;
  box-shadow:
    inset 0 0 0 1px rgba(0,122,255,.16),
    0 2px 10px rgba(0,122,255,.07);
}

.catalogName{
  font-size:14px;
  font-weight:650;
  line-height:1.2;
  overflow-wrap:anywhere;
}

.catalogMeta{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.catalogControls{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:4px;
  padding-left:8px;
}

.catalogQtyButton{
  width:29px;
  height:29px;
  border-radius:8px;
  background:#e7ebf1;
  color:#555;
  font-size:18px;
}

.catalogQty{
  min-width:27px;
  height:29px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  color:var(--blue);
  font-size:12px;
  font-weight:750;
  padding:0 3px;
}

.addIcon{
  flex:0 0 auto;
  color:var(--blue);
  font-size:22px;
  font-weight:300;
  padding-left:8px;
}

.catalogManage{
  flex:0 0 auto;
  display:none;
  align-items:center;
  gap:5px;
  padding-left:8px;
}

.manageEdit{
  width:31px;
  height:31px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  font-size:16px;
}

.manageDelete{
  width:31px;
  height:31px;
  border-radius:9px;
  background:#fff0ef;
  color:var(--red);
  font-size:17px;
}

.catalog.manageMode .catalogManage{
  display:flex;
}

.catalog.manageMode .catalogControls,
.catalog.manageMode .addIcon{
  display:none;
}

.catalogAdd{
  width:100%;
  height:42px;
  margin:7px 0 12px;
  border-radius:13px;
  background:#fff;
  color:var(--blue);
  box-shadow:0 2px 10px rgba(30,40,60,.045);
  font-size:14px;
  font-weight:700;
}

.noResults{
  text-align:center;
  color:var(--muted);
  padding:35px 20px;
  font-size:14px;
}

/* ================= EDIT CATALOG SHEET ================= */

.editorSheet{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(5px);
}

.editorSheet.open{
  display:flex;
}

.editorPanel{
  width:100%;
  max-width:560px;
  margin:auto;
  background:#f6f7fa;
  border-radius:22px 22px 0 0;
  padding:
    10px
    14px
    calc(18px + env(safe-area-inset-bottom));
}

.editorHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:2px 0 12px;
}

.editorHead strong{
  font-size:18px;
}

.editorFields{
  display:grid;
  gap:8px;
}

.editorFields label{
  color:var(--muted);
  font-size:11px;
  font-weight:650;
  margin:2px 2px -4px;
}

.editorHint{
  color:var(--muted);
  font-size:10px;
  line-height:1.2;
  margin:-4px 2px 0;
}

.editorFields input,
.editorFields select{
  width:100%;
  height:40px;
  border:0;
  outline:0;
  border-radius:11px;
  background:#e9ebef;
  padding:0 11px;
  font-size:14px;
  color:var(--text);
}

.editorFields input:focus,
.editorFields select:focus{
  background:#fff;
  box-shadow:inset 0 0 0 1.5px var(--blue);
}

.editorSave{
  width:100%;
  height:42px;
  margin-top:10px;
  border-radius:13px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:700;
}

/* ================= MASTER ================= */

.masterSheet{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(5px);
}

.masterSheet.open{
  display:flex;
}

.masterPanel{
  width:100%;
  max-width:560px;
  margin:auto;
  background:#f6f7fa;
  border-radius:22px 22px 0 0;
  padding:
    10px
    14px
    calc(18px + env(safe-area-inset-bottom));
}

.masterHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:2px 0 12px;
}

.masterHead strong{
  font-size:18px;
}

.masterFields{
  display:grid;
  gap:8px;
}

.masterFields input{
  width:100%;
  height:40px;
  border:0;
  outline:0;
  border-radius:11px;
  background:#e9ebef;
  padding:0 11px;
  font-size:14px;
}

.masterFields input:focus{
  background:#fff;
  box-shadow:inset 0 0 0 1.5px var(--blue);
}

.masterSave{
  width:100%;
  height:42px;
  margin-top:10px;
  border-radius:13px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:700;
}

/* ================= SMALL HEIGHT ================= */

@media(max-height:680px){

  .header{
    padding-top:calc(5px + env(safe-area-inset-top));
    padding-bottom:4px;
  }

  .clientWrap{
    padding-bottom:5px;
  }

  .clientTitle{
    padding-bottom:3px;
  }

  .client{
    padding:7px;
  }

  .field input{
    height:33px;
  }

  .bottom{
    padding-top:4px;
  }

  .totalBar{
    padding-top:3px;
    padding-bottom:5px;
  }

  .action{
    height:39px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <div>
      <div class="logo">
        Калькулятор сантехніка
      </div>

      <div class="subtitle">
        кошторис
      </div>
    </div>

    <div class="headerRight">

      <div class="date" id="date"></div>

      <button
        class="masterButton"
        onclick="openMaster()"
        aria-label="Дані майстра"
      >
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="9" cy="7" r="3" stroke="currentColor" stroke-width="1.8"/>
          <path
            d="M3.8 19c.7-3.2 2.4-5 5.2-5s4.5 1.8 5.2 5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M15 5.5l1.2 1.2m1.7-1.7l1.2 1.2m-2.3 1.9l1.2 1.2"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M16.2 9.2l3.2-3.2"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>

    </div>

  </header>


  <!-- CLIENT -->
  <div class="clientWrap">

    <div class="clientTitle">
      Замовник
    </div>

    <div class="client">

      <div class="fields">

        <div class="field">
          <input
            id="clientName"
            placeholder="Ім’я та прізвище"
          >
        </div>

        <div class="field">
          <input
            id="clientPhone"
            placeholder="Телефон"
            inputmode="tel"
          >
        </div>

        <div class="field full">
          <input
            id="clientAddress"
            placeholder="Адреса об’єкта"
          >
        </div>

      </div>

    </div>

  </div>


  <!-- ESTIMATE -->
  <main class="estimate">

    <div class="estimateHead">

      <strong>
        Кошторис
      </strong>

      <div class="estimateHeadRight">

        <span
          class="count"
          id="count"
        >
          0 позицій
        </span>

        <button
          class="clearEstimate"
          id="clearEstimate"
          onclick="clearEstimate()"
        >
          Очистити
        </button>

      </div>

    </div>


    <div
      class="list"
      id="list"
    ></div>

  </main>


  <!-- BOTTOM -->
  <div class="bottom">

    <div class="totalBar">

      <span>
        Разом
      </span>

      <strong id="grand">
        0 грн
      </strong>

    </div>


    <div class="actions">

      <button
        class="action"
        onclick="openCatalog('work')"
      >
        ＋ Робота
      </button>

      <button
        class="action"
        onclick="openCatalog('material')"
      >
        ＋ Матеріал
      </button>

    </div>

  </div>

</div>


<!-- CATALOG -->
<div
  class="sheet"
  id="sheet"
  onclick="if(event.target===this)closeCatalog()"
>

  <div class="panel">

    <div class="panelHead">

      <strong id="panelTitle">
        Додати роботу
      </strong>

      <div class="panelHeadRight">

        <button
          class="catalogEditButton"
          id="catalogEditButton"
          onclick="toggleCatalogManage()"
        >
          ✎ Каталог
        </button>

        <button
          class="close"
          onclick="closeCatalog()"
        >
          ×
        </button>

      </div>

    </div>


    <input
      id="search"
      class="search"
      placeholder="Пошук позиції…"
      oninput="renderCatalog()"
    >


    <div
      class="filters"
      id="filters"
    ></div>


    <div
      class="catalog"
      id="catalog"
    ></div>

  </div>

</div>


<!-- CATALOG EDITOR -->
<div
  class="editorSheet"
  id="editorSheet"
  onclick="if(event.target===this)closeCatalogEditor()"
>

  <div class="editorPanel">

    <div class="editorHead">

      <strong id="editorTitle">
        Нова позиція
      </strong>

      <button
        class="close"
        onclick="closeCatalogEditor()"
      >
        ×
      </button>

    </div>


    <div class="editorFields">

      <label>
        Коротка назва
      </label>

      <input
        id="editorName"
        placeholder="Наприклад: Технічна зона"
      >

      <div class="editorHint">
        Для каталогу
      </div>


      <label>
        Повна назва
      </label>

      <input
        id="editorEstimateName"
        placeholder="Наприклад: Облаштування технічної зони"
      >

      <div class="editorHint">
        Для кошторису
      </div>


      <label>
        Ціна
      </label>

      <input
        id="editorPrice"
        type="number"
        inputmode="numeric"
        min="0"
        step="100"
        placeholder="0"
      >


      <label>
        Одиниця
      </label>

      <input
        id="editorUnit"
        placeholder="шт"
      >


      <label>
        Тип
      </label>

      <select id="editorType">
        <option value="work">Робота</option>
        <option value="material">Матеріал</option>
      </select>


      <label id="editorGroupLabel">
        Етап
      </label>

      <select id="editorGroup">

        <option value="rough">
          Чорновий монтаж
        </option>

        <option value="finish">
          Чистовий монтаж
        </option>

      </select>

    </div>


    <button
      class="editorSave"
      onclick="saveCatalogItem()"
    >
      Зберегти
    </button>

  </div>

</div>


<!-- MASTER -->
<div
  class="masterSheet"
  id="masterSheet"
  onclick="if(event.target===this)closeMaster()"
>

  <div class="masterPanel">

    <div class="masterHead">

      <strong>
        Дані майстра
      </strong>

      <button
        class="close"
        onclick="closeMaster()"
      >
        ×
      </button>

    </div>

    <div class="masterFields">

      <input
        id="masterName"
        placeholder="Ім’я / назва"
      >

      <input
        id="masterPhone"
        placeholder="Телефон"
        inputmode="tel"
      >

    </div>

    <button
      class="masterSave"
      onclick="saveMaster()"
    >
      Зберегти
    </button>

  </div>

</div>


<script>

/* =========================================================
   ПОЧАТКОВИЙ КАТАЛОГ

function money(value){

  return new Intl.NumberFormat("uk-UA")
    .format(Math.round(value))
    + " грн";

}


function save(){

  localStorage.setItem(
    "plumber_estimate",
    JSON.stringify(estimate)

}

/* =========================================================
   КОШТОРИС
========================================================= */

function renderEstimate(){

  const list =
    document.getElementById("list");

  const clearButton =
    document.getElementById("clearEstimate");


  if(!estimate.length){

    list.innerHTML = `
      <div class="empty">
        Кошторис порожній.<br>
        Додайте роботу або матеріал.
      </div>
    `;

    clearButton.style.display = "none";

  }else{

    let html = "";

    const rough =
      estimate.filter(
        x => x.type === "work" &&
             x.stage === "rough"
      );

    const finish =
      estimate.filter(
        x => x.type === "work" &&
             x.stage === "finish"
      );

    const materials =
      estimate.filter(
        x => x.type === "material"
      );


    if(rough.length){

      html += section(
        "ЧОРНОВИЙ МОНТАЖ",
        rough
      );

    }


    if(finish.length){

      html += section(
        "ЧИСТОВИЙ МОНТАЖ",
        finish
      );

    }


    if(materials.length){

      html += section(
        "МАТЕРІАЛИ",
        materials
      );

    }


    list.innerHTML = html;

    clearButton.style.display = "block";

  }


  const total =
    estimate.reduce(
      (sum,item) =>
        sum + item.price * item.qty,
      0
    );


  document.getElementById("grand")
    .textContent = money(total);


  document.getElementById("count")
    .textContent =
      estimate.length +
      " " +
      (estimate.length === 1
        ? "позиція"
        : "позицій");

}


function clearEstimate(){

  if(!estimate.length){
    return;
  }


  const confirmed =
    confirm(
      "Очистити весь кошторис?"
    );


  if(!confirmed){
    return;
  }


  estimate = [];

  save();

  renderEstimate();

}


function section(title,items){

  return `
    <div class="section">

      <div class="sectionTitle">
        ${title}
      </div>

      ${items
        .map(renderRow)
        .join("")}

    </div>
  `;

}


function renderRow(item){

  const index =
    estimate.indexOf(item);


  return `
    <div class="row">

      <div>

        <div class="name">
          ${item.name}
        </div>

        <div class="controls">

          <div class="qty">

            <button
              onclick="changeQty(${index},-1)"
            >
              −
            </button>

            <button
              class="qtyValue"
              onclick="editEstimateQty(${index})"
            >
              ${item.qty}
            </button>

            <button
              onclick="changeQty(${index},1)"
            >
              +
            </button>

          </div>


          <button
            class="price"
            onclick="editPrice(${index})"
          >
            ${money(item.price)} / ${item.unit}
          </button>

        </div>

      </div>


      <div class="right">

        <div class="lineTotal">
          ${money(item.price * item.qty)}
        </div>

        <button
          class="delete"
          onclick="removeItem(${index})"
        >
          ×
        </button>

      </div>

    </div>
  `;

}


/* =========================================================
   КІЛЬКІСТЬ У КОШТОРИСІ
========================================================= */

function changeQty(index,delta){

  estimate[index].qty =
    Math.max(
      1,
      estimate[index].qty + delta
    );

  save();

  renderEstimate();

}


function editEstimateQty(index){

  const value =
    prompt(
      "Кількість:",
      estimate[index].qty
    );


  if(value === null){
    return;
  }


  const qty =
    Number(
      String(value)
        .replace(",",".")
    );


  if(
    !Number.isFinite(qty) ||
    qty < 0
  ){
    return;
  }


  const newQty =
    Math.floor(qty);


  if(newQty <= 0){

    estimate.splice(index,1);

  }else{

    estimate[index].qty = newQty;

  }


  save();

  renderEstimate();

}


/* =========================================================
   ВИДАЛЕННЯ
========================================================= */

function removeItem(index){

  estimate.splice(index,1);

  save();

  renderEstimate();

}


/* =========================================================
   РЕДАГУВАННЯ ЦІНИ
========================================================= */

function editPrice(index){

  const value =
    prompt(
      "Ціна за одиницю, грн:",
      estimate[index].price
    );


  if(value === null){
    return;
  }


  const price =
    Number(
      String(value)
        .replace(",",".")
    );


  if(
    Number.isFinite(price) &&
    price >= 0
  ){

    estimate[index].price =
      price;

    save();

    renderEstimate();

  }

}

/* =========================================================
   КАТАЛОГ — РЕНДЕР
========================================================= */

function renderCatalog(){

  const query =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  let items =
    catalog.filter(item => {

      if(item.type !== catalogMode){
        return false;
      }


      if(
        query &&
        !(
          item.name
            .toLowerCase()
            .includes(query) ||
          item.estimateName
            .toLowerCase()
            .includes(query)
        )
      ){
        return false;
      }


      if(catalogFilter === "all"){
        return true;
      }


      return (
        item.stage === catalogFilter ||
        item.category === catalogFilter
      );

    });


  const box =
    document.getElementById("catalog");


  box.classList.toggle(
    "manageMode",
    catalogManageMode
  );


  if(!items.length){

    box.innerHTML = `
      <div class="noResults">
        Нічого не знайдено
      </div>

      ${
        catalogManageMode
          ? `
            <button
              class="catalogAdd"
              onclick="openCatalogEditor()"
            >
              ＋ Додати позицію
            </button>
          `
          : ""
      }
    `;

    return;

  }


  let groups = {};


  items.forEach(item => {

    let group;


    if(item.type === "work"){

      group =
        item.stage === "rough"
          ? "Чорнові"
          : "Чистові";

    }else{

      if(item.category === "water"){
        group = "Водопостачання";
      }

      else if(item.category === "sewer"){
        group = "Каналізація";
      }

      else if(item.category === "fittings"){
        group = "Різьбова арматура";
      }

      else{
        group = "Інше";
      }

    }


    if(!groups[group]){
      groups[group] = [];
    }


    groups[group].push(item);

  });


  box.innerHTML =
    Object.entries(groups)
      .map(
        ([group,items]) => `

          <div class="catalogTitle">
            ${group}
          </div>

          ${items
            .map(
              item => {

                const existing =
                  estimate.find(
                    x => x.id === item.id
                  );

                const qty =
                  existing
                    ? existing.qty
                    : 0;

                return `

                  <div
                    class="catalogItem ${
                      qty > 0 ? "added" : ""
                    }"
                  >

                    <div
                      onclick="${
                        catalogManageMode
                          ? ""
                          : `addItem('${item.id}')`
                      }"
                      style="flex:1;min-width:0"
                    >

                      <div class="catalogName">
                        ${item.name}
                      </div>

                      <div class="catalogMeta">
                        ${
                          item.price
                            ? money(item.price)
                            : "ціна не задана"
                        }
                        ·
                        ${item.unit}
                      </div>

                    </div>


                    ${
                      catalogManageMode

                      ? `

                        <div class="catalogManage">

                          <button
                            class="manageEdit"
                            onclick="openCatalogEditor('${item.id}')"
                            aria-label="Редагувати"
                          >
                            ✎
                          </button>

                          <button
                            class="manageDelete"
                            onclick="deleteCatalogItem('${item.id}')"
                            aria-label="Видалити"
                          >
                            ×
                          </button>

                        </div>

                      `

                      : qty > 0

                      ? `

                        <div class="catalogControls">

                          <button
                            class="catalogQtyButton"
                            onclick="catalogChangeQty('${item.id}',-1)"
                          >
                            −
                          </button>

                          <button
                            class="catalogQty"
                            onclick="editCatalogQty('${item.id}')"
                          >
                            ×${qty}
                          </button>

                          <button
                            class="catalogQtyButton"
                            onclick="catalogChangeQty('${item.id}',1)"
                          >
                            +
                          </button>

                        </div>

                      `

                      : `

                        <span class="addIcon">
                          ＋
                        </span>

                      `
                    }

                  </div>

                `;

              }
            )
            .join("")}

        `
      )
      .join("");


  if(catalogManageMode){

    box.innerHTML += `
      <button
        class="catalogAdd"
        onclick="openCatalogEditor()"
      >
        ＋ Додати позицію
      </button>
    `;

  }

}


/* =========================================================
   ДОДАВАННЯ В КОШТОРИС
========================================================= */

function addItem(id){

  const product =
    catalog.find(
      item => item.id === id
    );


  if(!product){
    return;
  }


  const existing =
    estimate.find(
      item => item.id === id
    );


  if(existing){

    existing.qty++;

  }else{

    estimate.push({

      id:product.id,

      name:
        product.estimateName ||
        product.name,

      type:product.type,

      stage:product.stage,

      category:product.category,

      price:product.price,

      unit:product.unit,

      qty:1

    });

  }


  save();

  renderEstimate();

  renderCatalog();

}


/* =========================================================
   КІЛЬКІСТЬ У КАТАЛОЗІ
========================================================= */

function catalogChangeQty(id,delta){

  const index =
    estimate.findIndex(
      item => item.id === id
    );


  if(index === -1){

    if(delta > 0){
      addItem(id);
    }

    return;

  }


  estimate[index].qty += delta;


  if(estimate[index].qty <= 0){

    estimate.splice(index,1);

  }


  save();

  renderEstimate();

  renderCatalog();

}


function editCatalogQty(id){

  const item =
    estimate.find(
      x => x.id === id
    );


  if(!item){
    return;
  }


  const value =
    prompt(
      "Кількість:",
      item.qty
    );


  if(value === null){
    return;
  }


  const qty =
    Number(
      String(value)
        .replace(",",".")
    );


  if(
    !Number.isFinite(qty) ||
    qty < 0
  ){
    return;
  }


  const newQty =
    Math.floor(qty);


  if(newQty <= 0){

    const index =
      estimate.indexOf(item);

    estimate.splice(index,1);

  }else{

    item.qty = newQty;

  }


  save();

  renderEstimate();

  renderCatalog();

}


/* =========================================================
   РЕДАГУВАННЯ КАТАЛОГУ
========================================================= */

function openCatalogEditor(id=null){

  editingCatalogId = id;


  const item =
    id
      ? catalog.find(
          x => x.id === id
        )
      : null;


  document.getElementById(
    "editorTitle"
  ).textContent =
    item
      ? "Редагувати позицію"
      : "Нова позиція";


  document.getElementById(
    "editorName"
  ).value =
    item
      ? item.name
      : "";


  document.getElementById(
    "editorEstimateName"
  ).value =
    item
      ? (
          item.estimateName ||
          item.name
        )
      : "";


  document.getElementById(
    "editorPrice"
  ).value =
    item
      ? item.price
      : 0;


  document.getElementById(
    "editorUnit"
  ).value =
    item
      ? item.unit
      : "шт";


  document.getElementById(
    "editorType"
  ).value =
    item
      ? item.type
      : catalogMode;


  if(item){

    if(item.type === "work"){

      document.getElementById(
        "editorGroup"
      ).value =
        item.stage || "rough";

    }else{

      document.getElementById(
        "editorGroup"
      ).value =
        item.category || "other";

    }

  }else{

    document.getElementById(
      "editorGroup"
    ).value =
      catalogMode === "work"
        ? "rough"
        : "water";

  }


  updateEditorGroup();


  document
    .getElementById("editorSheet")
    .classList.add("open");

}


function closeCatalogEditor(){

  document
    .getElementById("editorSheet")
    .classList.remove("open");

  editingCatalogId = null;

}


function updateEditorGroup(){

  const type =
    document.getElementById(
      "editorType"
    ).value;


  const select =
    document.getElementById(
      "editorGroup"
    );

  const label =
    document.getElementById(
      "editorGroupLabel"
    );


  if(type === "work"){

    label.textContent = "Етап";


    select.innerHTML = `

      <option value="rough">
        Чорновий монтаж
      </option>

      <option value="finish">
        Чистовий монтаж
      </option>

    `;

  }else{

    label.textContent = "Категорія";


    select.innerHTML = `

      <option value="water">
        Водопостачання
      </option>

      <option value="sewer">
        Каналізація
      </option>

      <option value="fittings">
        Різьбова арматура
      </option>

      <option value="other">
        Інше
      </option>

    `;

  }

}


document
  .getElementById("editorType")
  .addEventListener(
    "change",
    updateEditorGroup
  );


function saveCatalogItem(){

  const name =
    document
      .getElementById("editorName")
      .value
      .trim();


  const estimateName =
    document
      .getElementById("editorEstimateName")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("editorPrice")
        .value
    );


  const unit =
    document
      .getElementById("editorUnit")
      .value
      .trim();


  const type =
    document
      .getElementById("editorType")
      .value;


  const group =
    document
      .getElementById("editorGroup")
      .value;


  if(!name){

    alert("Вкажіть коротку назву.");

    return;

  }


  if(!estimateName){

    alert("Вкажіть повну назву для кошторису.");

    return;

  }


  if(
    !Number.isFinite(price) ||
    price < 0
  ){

    alert("Вкажіть коректну ціну.");

    return;

  }


  if(!unit){

    alert("Вкажіть одиницю.");

    return;

  }


  if(editingCatalogId){

    const item =
      catalog.find(
        x => x.id === editingCatalogId
      );


    if(!item){
      return;
    }


    item.name = name;

    item.estimateName =
      estimateName;

    item.price = price;

    item.unit = unit;

    item.type = type;


    if(type === "work"){

      item.stage = group;

      delete item.category;

    }else{

      item.category = group;

      delete item.stage;

    }

  }else{

    const id =
      "custom-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2,8);


    const item = {

      id:id,

      name:name,

      estimateName:
        estimateName,

      type:type,

      price:price,

      unit:unit

    };


    if(type === "work"){

      item.stage = group;

    }else{

      item.category = group;

    }


    catalog.push(item);

  }


  saveCatalog();

  closeCatalogEditor();

  renderFilters();

  renderCatalog();

}


/* =========================================================
   ВИДАЛЕННЯ ПОЗИЦІЇ З КАТАЛОГУ
========================================================= */

function deleteCatalogItem(id){

  const item =
    catalog.find(
      x => x.id === id
    );


  if(!item){
    return;
  }


  const confirmed =
    confirm(
      `Видалити з каталогу «${item.name}»?`
    );


  if(!confirmed){
    return;
  }


  catalog =
    catalog.filter(
      x => x.id !== id
    );


  saveCatalog();

  renderCatalog();

}
