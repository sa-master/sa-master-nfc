<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Калькулятор сантехніка</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f4f6fa;
  --card:rgba(255,255,255,.9);
  --soft:#eef1f5;
  --line:#e2e5ea;
  --text:#15171a;
  --muted:#7b8088;
  --blue:#007aff;
  --red:#ff3b30;
  --shadow:0 8px 25px rgba(30,40,60,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,input,select{font:inherit}

button{
  border:0;
  background:none;
  color:inherit;
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:560px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

.header{
  flex:0 0 auto;
  padding:calc(9px + env(safe-area-inset-top)) 14px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:19px;
  font-weight:750;
  letter-spacing:-.4px;
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:1px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:9px;
}

.date{
  color:var(--muted);
  font-size:12px;
}

.masterButton{
  width:32px;
  height:32px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:var(--blue);
  box-shadow:0 3px 12px rgba(30,40,60,.06);
}

.masterButton svg{
  width:19px;
  height:19px;
}

.clientWrap{
  flex:0 0 auto;
  padding:0 12px 8px;
}

.clientTitle{
  padding:0 3px 5px;
  font-size:13px;
  font-weight:750;
}

.client{
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:17px;
  padding:9px;
  box-shadow:var(--shadow);
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field input{
  width:100%;
  height:36px;
  border:0;
  outline:0;
  border-radius:10px;
  background:var(--soft);
  padding:0 10px;
  font-size:13px;
  color:var(--text);
}

.field input:focus{
  background:#fff;
  box-shadow:inset 0 0 0 1.5px var(--blue);
}

.estimate{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:0 12px;
}

.estimateHead{
  flex:0 0 auto;
  padding:3px 3px 6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.estimateHead strong{
  font-size:14px;
}

.estimateHeadRight{
  display:flex;
  align-items:center;
  gap:8px;
}

.count{
  color:var(--muted);
  font-size:11px;
}

.clearEstimate{
  display:none;
  color:var(--red);
  font-size:11px;
  font-weight:650;
}

.viewToggle{
  height:28px;
  padding:0 9px;
  border-radius:9px;
  background:#fff;
  color:var(--blue);
  box-shadow:0 2px 9px rgba(30,40,60,.05);
  font-size:11px;
  font-weight:700;
}

.list{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding-bottom:8px;
}

.list::-webkit-scrollbar{
  display:none;
}

.empty{
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

.section{
  margin-bottom:9px;
}

.sectionTitle{
  position:sticky;
  top:0;
  z-index:2;
  background:rgba(244,246,250,.94);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--muted);
  font-size:10px;
  font-weight:750;
  letter-spacing:.5px;
  padding:6px 4px 5px;
}

.row{
  min-height:66px;
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:15px;
  box-shadow:0 3px 13px rgba(30,40,60,.05);
  padding:9px 9px 8px 11px;
  margin-bottom:6px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
}

.name{
  font-size:13px;
  line-height:1.25;
  font-weight:650;
  overflow-wrap:anywhere;
}

.controls{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:6px;
}

.qty{
  display:flex;
  align-items:center;
  height:28px;
  border-radius:9px;
  background:var(--soft);
  overflow:hidden;
}

.qty button{
  width:29px;
  height:28px;
  color:var(--blue);
  font-size:18px;
  line-height:1;
}

.qty b{
  min-width:24px;
  text-align:center;
  font-size:12px;
}

.price{
  min-height:28px;
  border-radius:9px;
  background:var(--soft);
  color:#555;
  padding:0 8px;
  font-size:10px;
}

.right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:space-between;
  align-self:stretch;
  min-width:82px;
}

.lineTotal{
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
}

.delete{
  width:27px;
  height:27px;
  border-radius:50%;
  background:#fff0ef;
  color:var(--red);
  font-size:18px;
}

.bottom{
  flex:0 0 auto;
  padding:7px 12px calc(8px + env(safe-area-inset-bottom));
}

.totalBar{
  height:44px;
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px;
  margin-bottom:7px;
  font-size:13px;
}

.totalBar strong{
  font-size:17px;
}

.masterSummary{
  display:none;
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:8px 13px;
  margin-bottom:7px;
}

.masterSummary.show{
  display:block;
}

.masterSummaryRow{
  min-height:23px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:11px;
  color:var(--muted);
}

.masterSummaryRow strong{
  color:var(--text);
  font-size:12px;
}

.masterSummaryRow.earnings strong{
  color:var(--blue);
}

.masterSummaryDiscount{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding-bottom:6px;
  margin-bottom:4px;
  border-bottom:1px solid var(--line);
}

.masterSummaryDiscount span{
  color:var(--muted);
  font-size:11px;
}

.discountOptions{
  display:flex;
  gap:4px;
}

.discountButton{
  min-width:34px;
  height:26px;
  padding:0 7px;
  border-radius:8px;
  background:var(--soft);
  color:#555;
  font-size:10px;
  font-weight:700;
}

.discountButton.active{
  background:var(--blue);
  color:#fff;
}

.masterSummaryRow.discount strong{
  color:var(--red);
}

.clientDiscountOption{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:28px;
  margin-top:5px;
  padding-top:6px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
}

.clientDiscountOption input{
  width:18px;
  height:18px;
  accent-color:var(--blue);
}

.clientSummary{
  display:none;
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:8px 13px;
  margin-bottom:7px;
}

.clientSummary.show{
  display:block;
}

.clientSummaryRow{
  min-height:24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:12px;
  color:var(--muted);
}

.clientSummaryRow strong{
  color:var(--text);
  font-size:13px;
}

.clientSummaryRow.discount strong{
  color:var(--red);
}

.clientMode .masterButton{
  display:none;
}

.clientMode .clearEstimate{
  display:none !important;
}

.clientMode .actions{
  display:none;
}

.clientMode .row{
  min-height:58px;
}

.clientMode .qty{
  background:transparent;
  height:auto;
}

.clientMode .qty button{
  display:none;
}

.clientMode .qty b{
  min-width:0;
  color:var(--muted);
  font-size:11px;
  font-weight:650;
}

.clientMode .price{
  background:transparent;
  padding:0;
  min-height:auto;
  pointer-events:none;
}

.clientMode .priceEditIcon,
.clientMode .delete{
  display:none;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.action{
  height:45px;
  border-radius:14px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:750;
  box-shadow:0 5px 14px rgba(0,122,255,.18);
}

.action:active{
  transform:scale(.98);
}

.procurementAction{
  grid-column:1/-1;
}

.consumablesPrice{
  display:inline-flex;
  align-items:center;
  min-height:28px;
  margin-top:7px;
  padding:0 9px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  font-size:11px;
  font-weight:700;
}

.clientMode .consumablesPrice{
  background:transparent;
  padding:0;
  pointer-events:none;
}

.procurementSheet{
  position:fixed;
  inset:0;
  z-index:45;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.34);
  backdrop-filter:blur(6px);
}

.procurementSheet.open{
  display:flex;
}

.procurementPanel{
  width:100%;
  max-width:560px;
  max-height:88dvh;
  margin:auto;
  background:#f6f7fa;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  padding:13px 12px calc(14px + env(safe-area-inset-bottom));
}

.procurementHead{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.procurementHead strong{
  font-size:18px;
}

.procurementStatus{
  flex:0 0 auto;
  margin-bottom:8px;
  padding:8px 10px;
  border-radius:11px;
  background:#fff0ef;
  color:var(--red);
  font-size:12px;
  font-weight:700;
}

.procurementStatus.reviewed{
  background:#edf8ef;
  color:#248a3d;
}

.procurementList{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}

.procurementList::-webkit-scrollbar{
  display:none;
}

.procurementRow{
  background:#fff;
  border-radius:14px;
  padding:10px 11px;
  margin:6px 0;
  box-shadow:0 2px 10px rgba(30,40,60,.04);
}

.procurementRowTop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.procurementName{
  min-width:0;
  font-size:13px;
  line-height:1.25;
  font-weight:700;
  overflow-wrap:anywhere;
}

.procurementNeed{
  flex:0 0 auto;
  color:var(--muted);
  font-size:11px;
  font-weight:650;
}

.procurementControls{
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.procurementControls span{
  color:var(--muted);
  font-size:11px;
  font-weight:650;
}

.procurementQty{
  height:31px;
  display:flex;
  align-items:center;
  border-radius:10px;
  background:#e9ebef;
  overflow:hidden;
}

.procurementQty button{
  width:31px;
  height:31px;
  color:var(--blue);
  font-size:18px;
}

.procurementQty b{
  min-width:36px;
  text-align:center;
  color:var(--blue);
  font-size:12px;
}

.procurementConfirm{
  flex:0 0 auto;
  width:100%;
  height:44px;
  margin-top:10px;
  border-radius:13px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:750;
}

.procurementEmpty{
  text-align:center;
  color:var(--muted);
  padding:35px 20px;
  font-size:14px;
}

.procurementHeadLeft{
  min-width:0;
  display:flex;
  align-items:center;
  gap:6px;
}

.procurementBack{
  width:32px;
  height:32px;
  border-radius:10px;
  color:var(--blue);
  font-size:24px;
  line-height:1;
}

.procurementSecondary,
.procurementSupplier{
  flex:0 0 auto;
  width:100%;
  height:42px;
  margin-top:8px;
  border-radius:13px;
  background:#e9ebef;
  color:var(--blue);
  font-size:13px;
  font-weight:750;
}

.procurementSupplier{
  background:#edf8ef;
  color:#248a3d;
}

.topupDivider{
  margin:14px 2px 7px;
  color:var(--muted);
  font-size:11px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.topupCardWrap{
  display:flex;
  align-items:center;
  gap:7px;
  margin:6px 0;
}

.topupCard{
  flex:1 1 auto;
  min-width:0;
  margin:0;
  padding:10px 11px;
  border-radius:14px;
  background:#fff;
  text-align:left;
  box-shadow:0 2px 10px rgba(30,40,60,.04);
}

.topupDelete{
  flex:0 0 42px;
  width:42px;
  height:42px;
  border-radius:13px;
  background:#fff;
  color:var(--red);
  font-size:20px;
  line-height:1;
  box-shadow:0 2px 10px rgba(30,40,60,.04);
}

.topupCardTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.topupCard strong{
  font-size:13px;
}

.topupCardMeta{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  font-weight:650;
}

.topupBadge{
  flex:0 0 auto;
  font-size:10px;
  font-weight:750;
  color:var(--red);
}

.topupBadge.reviewed{
  color:#248a3d;
}

.topupChecklistRow{
  display:flex;
  align-items:center;
  gap:10px;
}

.topupCheck{
  flex:0 0 30px;
  width:30px;
  height:30px;
  border-radius:9px;
  border:1.5px solid #c7cbd3;
  background:#fff;
  color:#fff;
  font-size:18px;
  font-weight:800;
  line-height:1;
}

.topupCheck.checked{
  border-color:#248a3d;
  background:#248a3d;
}

.topupPurchased .procurementName{
  color:var(--muted);
  text-decoration:line-through;
}

.sheet{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.32);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.sheet.open{
  display:flex;
}

.panel{
  width:100%;
  max-width:560px;
  height:min(82dvh,720px);
  margin:auto;
  background:#f6f7fa;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}

.panelHead{
  flex:0 0 auto;
  padding:11px 14px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panelHead strong{
  font-size:18px;
}

.panelHeadRight{
  display:flex;
  align-items:center;
  gap:4px;
}

.catalogEditButton{
  height:32px;
  padding:0 9px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  font-size:12px;
  font-weight:700;
}

.catalogEditButton.active{
  background:var(--blue);
  color:#fff;
}

.close{
  width:32px;
  height:32px;
  font-size:28px;
  color:#777;
}

.search{
  flex:0 0 auto;
  width:calc(100% - 24px);
  margin:0 12px 8px;
  height:40px;
  border:0;
  outline:0;
  border-radius:12px;
  background:#e9ebef;
  padding:0 12px;
  font-size:14px;
}

.filters,
.subFilters{
  flex:0 0 auto;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  padding:0 12px 8px;
}

.filters::-webkit-scrollbar,
.subFilters::-webkit-scrollbar{
  display:none;
}

.filter,
.subFilter{
  flex:0 0 auto;
  height:30px;
  padding:0 10px;
  border-radius:9px;
  background:#e9ebef;
  color:#555;
  font-size:11px;
  font-weight:650;
}

.filter.active,
.subFilter.active{
  background:var(--blue);
  color:#fff;
}

.catalog{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:0 12px 15px;
}

.catalog::-webkit-scrollbar{
  display:none;
}

.catalogItem{
  min-height:59px;
  background:#fff;
  border-radius:14px;
  padding:9px 9px 9px 11px;
  margin:6px 0;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 2px 10px rgba(30,40,60,.04);
}

.catalogItem.added{
  box-shadow:inset 0 0 0 1.5px rgba(0,122,255,.25);
}

.catalogName{
  font-size:13px;
  line-height:1.25;
  font-weight:700;
  overflow-wrap:anywhere;
}

.catalogFullName{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
  font-weight:500;
  line-height:1.25;
}

.catalogMeta{
  color:var(--muted);
  font-size:10px;
  line-height:1.35;
  margin-top:3px;
}

.catalogControls{
  display:flex;
  align-items:center;
  gap:5px;
}

.catalogQtyButton{
  width:29px;
  height:29px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  font-size:18px;
}

.catalogQty{
  min-width:27px;
  text-align:center;
  color:var(--blue);
  font-size:12px;
  font-weight:750;
}

.addIcon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex:0 0 auto;
}
  .catalogManage{
  display:flex;
  gap:5px;
}

.manageEdit,
.manageDelete{
  width:31px;
  height:31px;
  border-radius:9px;
  font-size:15px;
}

.manageEdit{
  background:#e9ebef;
  color:var(--blue);
}

.manageDelete{
  background:#fff0ef;
  color:var(--red);
}

.catalog.manageMode .catalogControls,
.catalog.manageMode .addIcon{
  display:none;
}

.catalogAdd{
  width:100%;
  height:42px;
  margin:7px 0 12px;
  border-radius:13px;
  background:#fff;
  color:var(--blue);
  box-shadow:0 2px 10px rgba(30,40,60,.045);
  font-size:14px;
  font-weight:700;
}

.catalogClear{
  width:100%;
  height:42px;
  margin:0 0 12px;
  border-radius:13px;
  background:#fff;
  color:var(--red);
  box-shadow:0 2px 10px rgba(30,40,60,.045);
  font-size:14px;
  font-weight:700;
}

.noResults{
  text-align:center;
  color:var(--muted);
  padding:35px 20px;
  font-size:14px;
}

.editorSheet{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.34);
  backdrop-filter:blur(6px);
}

.editorSheet.open{
  display:flex;
}

.editorPanel{
  width:100%;
  max-width:560px;
  max-height:88dvh;
  margin:auto;
  background:#f6f7fa;
  border-radius:22px;
  overflow-y:auto;
  padding:13px 12px calc(14px + env(safe-area-inset-bottom));
}

.editorHead{
  display:flex;
  align-items:center;
  justify-content:space-between;

function getSupplierOffers(
  item
){

  return Array.isArray(
    item && item.supplierOffers
  )
    ? item.supplierOffers
    : [];
}

function getSnapshotPriceUAH(
  snapshot
){

  if(
    !snapshot ||
    !Number.isFinite(
      Number(snapshot.priceEUR)
    ) ||
    !Number.isFinite(
      eurRate
    ) ||
    eurRate <= 0
  ){
    return null;
  }

  return (
    Number(snapshot.priceEUR) *
    eurRate
  );
}

function getCompleteSupplierOffers(
  item
){

  return getSupplierOffers(
    item
  ).filter(
    offer =>
      offer &&
      offer.retail &&
      Number.isFinite(
        Number(
          offer.retail.priceEUR
        )
      )
  );
}

function getDefaultSupplierOffer(
  item
){

  const offers =
    getCompleteSupplierOffers(
      item
    );

  if(
    offers.length === 1
  ){
    return offers[0];
  }

  return null;
}

function getMaterialCatalogPrice(
  item
){

  const offer =
    getDefaultSupplierOffer(
      item
    );

  if(offer){

    const retailPrice =
      getSnapshotPriceUAH(
        offer.retail
      );

    return Number.isFinite(
      retailPrice
    )
      ? retailPrice
      : 0;
  }

  const supplierOffers =
    getSupplierOffers(
      item
    );

  if(
    supplierOffers.length
  ){
    return 0;
  }

  const basePriceEUR =
    Number(
      item.basePriceEUR
    );

  if(
    !Number.isFinite(
      basePriceEUR
    ) ||
    basePriceEUR < 0 ||
    !Number.isFinite(
      eurRate
    ) ||
    eurRate <= 0
  ){
    return 0;
  }

  return (
    basePriceEUR *
    eurRate
  );
}

function chooseSupplierOffer(
  item
){

  const offers =
    getCompleteSupplierOffers(
      item
    );

  if(
    !offers.length
  ){
    return null;
  }

  if(
    offers.length === 1
  ){
    return offers[0];
  }

  const lines =
    offers.map(
      (offer,index) => {

        const retailPrice =
          getSnapshotPriceUAH(
            offer.retail
          );

        const purchasePrice =
          getSnapshotPriceUAH(
            offer.master
          );

        return (
          `${index + 1}. ${offer.supplierName || "Постачальник"}` +
          ` — роздріб ${
            Number.isFinite(retailPrice)
              ? money(retailPrice)
              : "не задано"
          }` +
          `, майстра ${
            Number.isFinite(purchasePrice)
              ? money(purchasePrice)
              : "не задано"
          }`
        );
      }
    );

  const value =
    prompt(
      "Оберіть постачальника:\n\n" +
      lines.join("\n") +
      "\n\nВведіть номер:",
      "1"
    );

  if(
    value === null
  ){
    return null;
  }

  const index =
    Number(value) - 1;

  if(
    !Number.isInteger(index) ||
    index < 0 ||
    index >= offers.length
  ){

    alert(
      "Оберіть коректний номер постачальника."
    );

    return null;
  }

  return offers[index];
}

  const button =
    document.getElementById(

}

function editEurRate(){

  const value =
    prompt(
      "Поточний курс EUR, грн:",
      eurRate > 0
        ? String(eurRate)
        : ""
    );

  if(
    value === null
  ){
    return;
  }

  const rate =
    Number(
      String(value)
        .replace(
          ",",
          "."
        )
    );

  if(
    !Number.isFinite(
      rate
    ) ||
    rate <= 0
  ){

    alert(
      "Вкажіть коректний курс EUR."
    );

    return;
  }

  eurRate =
    rate;

  localStorage.setItem(
    EUR_RATE_KEY,
    String(eurRate)
  );

  updateEurRateButton();
  renderCatalog();
}

function normalizeText(
  value
){

  return String(
    value || ""
  )
    .trim()
    .toLowerCase()
    .replace(
      /\s+/g,
      " "
    );
}

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

function money(
  value
){

  return new Intl.NumberFormat(
    "uk-UA"
  )
    .format(
      Math.round(value)
    ) +
    " грн";
}

function toggleViewMode(){

  if(
    viewMode ===
    "master"
  ){

    viewMode =
      "client";

  }else if(
    viewMode ===
    "client"
  ){

    if(
      !procurementReviewed

        "Спочатку перевірте комплектацію та натисніть «Комплектацію перевірено»."
      );

      viewMode =
        "master";

    }else{

      viewMode =
        "supplier";
    }

  }else{

    viewMode =
      "master";
  }

  document.body.classList.toggle(
    "clientMode",
    viewMode !==
      "master"
  );

  const button =
    document.getElementById(
      "viewToggle"
    );

  if(
    button

    button.textContent =
      viewMode ===
        "master"
        ? "Майстер"
        : (
            viewMode ===
              "client"
              ? "Клієнт"
              : "Постачальник"
          );
  }

  renderEstimate();
}

    document.getElementById(

function getProcurementQty(
  item
){

  const savedQty =
    Number(
      item &&
      item.procurementQty
    );

  if(
    Number.isFinite(savedQty) &&
    savedQty >= 0
  ){
    return savedQty;
  }

  const estimateQty =
    Number(
      item &&
      item.qty
    );

  return Number.isFinite(
    estimateQty
  ) && estimateQty > 0
    ? estimateQty
    : 0;
}

  procurementReviewed =

  localStorage.setItem(
    PROCUREMENT_REVIEWED_KEY,

    "procurementSheet"

}

  document.getElementById(
    "procurementSheet"

function formatTopupDate(
  value
){

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "";
  }

  return date.toLocaleDateString(
    "uk-UA"
  );
}

    procurementTopups[0]
  ){

    renderProcurement();
    return;
  }

  if(

function toggleTopupPurchased(
  index
){

  const topup =
    getActiveTopup();

  if(
    !topup ||
    !Array.isArray(topup.items) ||
    !topup.items[index]
  ){
    return;
  }

  topup.items[index].purchased =
    !topup.items[index].purchased;

  saveProcurementTopups();
  renderProcurement();
}

function changeProcurementQty(
  index,
  delta
){

  const item =
    estimate[index];

  if(
    !item ||
    item.type !==
      "material"
  ){
    return;
  }

  const maxQty =
    Math.max(
      0,
      Number(item.qty) || 0
    );

  const currentQty =
    Math.min(
      maxQty,
      getProcurementQty(item)
    );

  item.procurementQty =
    Math.max(
      0,
      Math.min(
        maxQty,
        currentQty + delta
      )
    );

  invalidateProcurement();
  save();
  renderProcurement();
  renderEstimate();
}

function changeTopupQty(
  index,
  delta
){

  const topup =
    getActiveTopup();

  if(
    !topup ||
    !Array.isArray(topup.items) ||
    !topup.items[index]
  ){
    return;
  }

  const item =
    topup.items[index];

  item.qty =
    Math.max(
      0,
      (Number(item.qty) || 0) +
      delta
    );

  if(
    item.qty <= 0
  ){
    topup.items.splice(
      index,
      1
    );
  }

  item.purchased =
    false;

  saveProcurementTopups();
  renderProcurement();
}

function confirmProcurement(){

  const materials =
    estimate.filter(
      item =>
        item.type ===
          "material"
    );

  if(
    !materials.length
  ){
    return;
  }

  materials.forEach(
    item => {

      const maxQty =
        Math.max(
          0,
          Number(item.qty) || 0
        );

      item.procurementQty =
        Math.max(
          0,
          Math.min(
            maxQty,
            getProcurementQty(item)
          )
        );
    }
  );

  procurementReviewed =
    true;

  localStorage.setItem(
    PROCUREMENT_REVIEWED_KEY,
    "1"
  );

  save();
  renderProcurement();
  renderEstimate();
}

function addItemToTopup(
  id
){

  const topup =
    getSingleTopup();

  const product =
    catalog.find(
      item =>
        item.id === id &&
        item.type ===
          "material"
    );

  if(
    !topup ||
    !product
  ){
    return;
  }

  if(!Array.isArray(topup.items)){
    topup.items = [];
  }

  if(
    !Number.isFinite(eurRate) ||
    eurRate <= 0
  ){
    alert(
      "Спочатку вкажіть курс EUR."
    );
    return;
  }

  const existing =
    topup.items.find(
      item =>
        item.id === id
    );

  if(existing){

    existing.qty =
      (Number(existing.qty) || 0) + 1;

    existing.purchased =
      false;

  }else{

    let materialPrice = 0;
    let selectedOffer = null;

    const supplierOffers =
      getSupplierOffers(
        product
      );

    if(
      supplierOffers.length
    ){

      selectedOffer =
        chooseSupplierOffer(
          product
        );

      if(
        !selectedOffer
      ){
        alert(
          "Для цієї позиції немає доступної роздрібної ціни постачальника."
        );
        return;
      }

      materialPrice =
        getSnapshotPriceUAH(
          selectedOffer.retail
        );

      if(
        !Number.isFinite(materialPrice)
      ){
        alert(
          "Не вдалося визначити роздрібну ціну матеріалу."
        );
        return;
      }

    }else{

      materialPrice =
        getMaterialCatalogPrice(
          product
        );
    }

    const topupItem = {
      id:product.id,
      type:"material",
      name:
        product.estimateName ||
        product.name,
      fullName:
        product.name ||
        product.estimateName ||
        "",
      article:
        product.article ||
        "",
      category:
        product.category ||
        "other",
      unit:
        product.unit ||
        "",
      qty:1,
      purchased:false,
      price:materialPrice,
      retailPrice:materialPrice,
      priceSnapshotAt:
        new Date().toISOString(),
      eurRate:eurRate,
      supplierId:"",
      supplierName:
        product.supplierName ||
        "",
      supplierImportedAt:"",
      purchasePrice:null
    };

    if(selectedOffer){

      topupItem.supplierId =
        selectedOffer.supplierId ||
        "";

      topupItem.supplierName =
        selectedOffer.supplierName ||
        topupItem.supplierName;

      topupItem.supplierImportedAt =
        selectedOffer.updatedAt ||
        selectedOffer.retail?.importedAt ||
        selectedOffer.master?.importedAt ||
        "";

      const purchasePrice =
        getSnapshotPriceUAH(
          selectedOffer.master
        );

      topupItem.purchasePrice =
        Number.isFinite(purchasePrice)
          ? purchasePrice
          : null;
    }

    topup.items.push(
      topupItem
    );
  }

  saveProcurementTopups();
  closeCatalog();
}

function topupCatalogChangeQty(
  id,
  delta
){

  const topup =
    getSingleTopup();

  if(
    !topup ||
    !Array.isArray(topup.items)
  ){
    return;
  }

  const index =
    topup.items.findIndex(
      item =>
        item.id === id
    );

  if(index === -1){

    if(delta > 0){
      addItemToTopup(id);
    }

    return;
  }

  topup.items[index].qty +=
    delta;

  topup.items[index].purchased =
    false;

  if(
    topup.items[index].qty <= 0
  ){
    topup.items.splice(
      index,
      1
    );
  }

  saveProcurementTopups();
  renderCatalog();
}

  function renderEstimate(){

  const list =
    document.getElementById(
      "list"
    );

  const clearButton =
    document.getElementById(
      "clearEstimate"
    );

  if(
    !estimate.length
  ){

    list.innerHTML = `
      <div class="empty">
        Кошторис порожній.<br>
        Додайте роботу або матеріал.
      </div>
    `;

    clearButton.style.display =
      "none";

  }else{

    let html = "";

    const rough =
      estimate.filter(
        item =>
          item.type === "work" &&
          item.stage === "rough"
      );

    const finish =
      estimate.filter(
        item =>
          item.type === "work" &&
          item.stage === "finish"
      );

    const materials =
      estimate.filter(
        item =>
          item.type === "material" &&
          (
            viewMode !==
              "supplier" ||
            getProcurementQty(item) > 0
          )
      );

    const consumables =
      estimate.filter(
        item =>
          item.type ===
            "consumables"
      );

    if(
      viewMode !==
        "supplier" &&
      rough.length
    ){

      html += section(
        "ЧОРНОВИЙ МОНТАЖ",
        rough
      );
    }

    if(
      viewMode !==
        "supplier" &&
      finish.length
    ){

      html += section(
        "ЧИСТОВИЙ МОНТАЖ",
        finish
      );
    }

    const visibleMaterials =
      viewMode ===
        "supplier"
        ? materials
        : materials.concat(
            consumables
          );

    if(
      visibleMaterials.length
    ){

      html += section(
        "МАТЕРІАЛИ",
        visibleMaterials
      );
    }

    list.innerHTML =
      html;

    clearButton.style.display =
      "block";
  }

  const workTotal =
    estimate
      .filter(
        item =>
          item.type ===
          "work"
      )
      .reduce(
        (
          sum,
          item
        ) =>
          sum +
          (
            Number(
              item.price
            ) || 0
          ) *
          (
            Number(
              item.qty
            ) || 0
          ),
        0
      );

  const materialItems =
    estimate.filter(
      item =>
        item.type ===
          "material"
    );

  const materialsRetailTotal =
    materialItems.reduce(
      (
        sum,
        item
      ) =>
        sum +
        (
          Number(
            item.price
          ) || 0
        ) *
        (
          Number(
            item.qty
          ) || 0
        ),
      0
    );

  const materialsDiscountTotal =
    materialsRetailTotal *
    materialDiscountPercent /
    100;

  const materialsClientTotal =
    materialsRetailTotal -
    materialsDiscountTotal;

  const consumablesItems =
    estimate.filter(
      item =>
        item.type ===
          "consumables"
    );

  const consumablesTotal =
    consumablesItems.reduce(
      (
        sum,
        item
      ) =>
        sum +
        (
          Number(item.price) || 0
        ),
      0
    );

  const supplierMaterialsTotal =
    materialItems.reduce(
      (
        sum,
        item
      ) => {

        const factor =
          showClientDiscount
            ? 1
            : (
                1 -
                materialDiscountPercent /
                100
              );

        return sum +
          (
            Number(item.price) || 0
          ) *
          factor *
          getProcurementQty(item);
      },
      0
    );

  const total =
    viewMode ===
      "supplier"
      ? supplierMaterialsTotal
      : (
          workTotal +
          materialsClientTotal +
          consumablesTotal
        );

  document.getElementById(
    "grand"
  ).textContent =
    money(
      total
    );

  const hasCompletePurchaseData =
    materialItems.length > 0 &&
    materialItems.every(
      item =>
        Number.isFinite(
          Number(
            item.purchasePrice
          )
        ) &&
        Number(
          item.purchasePrice
        ) >= 0
    );

  const materialsPurchaseTotal =
    hasCompletePurchaseData
      ? materialItems.reduce(
          (
            sum,
            item
          ) =>
            sum +
            Number(
              item.purchasePrice
            ) *
            (
              Number(
                item.qty
              ) || 0
            ),
          0
        )
      : null;

  const materialsEarningsTotal =
    hasCompletePurchaseData
      ? materialsClientTotal -
        materialsPurchaseTotal
      : null;

  const masterSummary =
    document.getElementById(
      "masterSummary"
    );

  masterSummary.classList.toggle(
    "show",
    viewMode ===
      "master" &&
    materialItems.length > 0
  );

  document.getElementById(
    "materialsRetailTotal"
  ).textContent =
    money(
      materialsRetailTotal
    );

  const discountRow =
    document.getElementById(
      "materialsDiscountRow"
    );

  discountRow.style.display =
    materialDiscountPercent > 0
      ? "flex"
      : "none";

  document.getElementById(
    "materialsDiscountLabel"
  ).textContent =
    `Знижка −${materialDiscountPercent.toLocaleString(
      "uk-UA",
      {
        maximumFractionDigits:2
      }
    )}%`;

  document.getElementById(
    "materialsDiscountTotal"
  ).textContent =
    "−" +
    money(
      materialsDiscountTotal
    );

  document.getElementById(
    "materialsClientTotal"
  ).textContent =
    money(
      materialsClientTotal
    );

  document.getElementById(
    "materialsPurchaseTotal"
  ).textContent =
    hasCompletePurchaseData
      ? money(
          materialsPurchaseTotal
        )
      : "—";

  document.getElementById(
    "materialsEarningsTotal"
  ).textContent =
    hasCompletePurchaseData
      ? money(
          materialsEarningsTotal
        )
      : "—";

  renderMaterialDiscountButtons();

  const showClientDiscountInput =
    document.getElementById(
      "showClientDiscount"
    );

  if(
    showClientDiscountInput
  ){

    showClientDiscountInput.checked =
      showClientDiscount;
  }

  const clientSummary =
    document.getElementById(
      "clientSummary"
    );

  clientSummary.classList.toggle(
    "show",
    (
      viewMode ===
        "client" ||
      viewMode ===
        "supplier"
    ) &&
    estimate.length > 0
  );

  const clientWorkRow =
    document.getElementById(
      "clientWorkRow"
    );

  clientWorkRow.style.display =
    viewMode !==
      "supplier" &&
    workTotal > 0
      ? "flex"
      : "none";

  document.getElementById(
    "clientWorkTotal"
  ).textContent =
    money(
      workTotal
    );

  const showDiscountDetails =
    showClientDiscount &&
    materialDiscountPercent > 0 &&
    materialItems.length > 0;

  document.getElementById(
    "clientRetailRow"
  ).style.display =
    showDiscountDetails
      ? "flex"
      : "none";

  document.getElementById(
    "clientDiscountRow"
  ).style.display =
    showDiscountDetails
      ? "flex"
      : "none";

  document.getElementById(
    "clientRetailTotal"
  ).textContent =
    money(
      materialsRetailTotal +
      (
        viewMode ===
          "supplier"
          ? 0
          : consumablesTotal
      )
    );

  document.getElementById(
    "clientDiscountLabel"
  ).textContent =
    `Знижка −${materialDiscountPercent.toLocaleString(
      "uk-UA",
      {
        maximumFractionDigits:2
      }
    )}%`;

  document.getElementById(
    "clientDiscountTotal"
  ).textContent =
    "−" +
    money(
      materialsDiscountTotal
    );

  document.getElementById(
    "clientMaterialsRow"
  ).style.display =
    (
      materialItems.length > 0 ||
      (
        viewMode !==
          "supplier" &&
        consumablesItems.length > 0
      )
    )
      ? "flex"
      : "none";

  document.getElementById(
    "clientMaterialsTotal"
  ).textContent =
    money(
      viewMode ===
        "supplier"
        ? supplierMaterialsTotal
        : (
            materialsClientTotal +
            consumablesTotal
          )
    );

  const clearEstimateButton =
    document.getElementById(
      "clearEstimate"
    );

  if(
    viewMode !==
      "master"
  ){

    clearEstimateButton.style.display =
      "none";
  }

  const visibleItemCount =
    viewMode ===
      "supplier"
      ? materialItems.filter(
          item =>
            getProcurementQty(item) > 0
        ).length
      : estimate.length;

  document.getElementById(
    "count"
  ).textContent =
    visibleItemCount +
    " позицій";
}

function section(
  title,
  items
){

  return `
    <div class="section">

      <div class="sectionTitle">
        ${title}
      </div>

      ${
        items
          .map(
            renderRow
          )
          .join("")
      }

    </div>
  `;
}

function renderRow(
  item
){

  const index =
    estimate.indexOf(
      item
    );

  if(
    item.type ===
      "consumables"
  ){

    return `
      <div class="row">

        <div>
          <div class="name">
            ${escapeHtml(item.name)}
          </div>

          <button
            class="consumablesPrice"
            onclick="editPrice(${index})"
          >
            ≈ ${money(Number(item.price) || 0)}
            <span class="priceEditIcon">✎</span>
          </button>
        </div>

        <div class="right">
          <div class="lineTotal">
            ≈ ${money(Number(item.price) || 0)}
          </div>
        </div>

      </div>
    `;
  }

  const isMaterial =
    item.type ===
    "material";

  const externalView =
    viewMode ===
      "client" ||
    viewMode ===
      "supplier";

  const clientFactor =
    (
      externalView &&
      isMaterial &&
      !showClientDiscount
    )
      ? (
          1 -
          materialDiscountPercent /
          100
        )
      : 1;

  const displayPrice =
    (
      Number(
        item.price
      ) || 0
    ) *
    clientFactor;

  const displayQty =
    viewMode ===
      "supplier" &&
    isMaterial
      ? getProcurementQty(item)
      : (
          Number(item.qty) || 0
        );

  const displayLineTotal =
    displayPrice *
    displayQty;

  const displayName =
    viewMode ===
      "supplier" &&
    isMaterial
      ? getSupplierViewName(
          item
        )
      : item.name;

  const supplierArticle =
    viewMode ===
      "supplier" &&
    isMaterial
      ? getSupplierViewArticle(
          item
        )
      : "";

  return `
    <div class="row">

      <div>

        <div class="name">
          ${escapeHtml(displayName)}
        </div>

        ${
          supplierArticle
            ? `
              <div
                style="
                  margin-top:4px;
                  color:var(--muted);
                  font-size:11px;
                  font-weight:650;
                "
              >
                Артикул:
                ${escapeHtml(supplierArticle)}
              </div>
            `
            : ""
        }

        <div class="controls">

          <div class="qty">

            <button
              onclick="changeQty(${index},-1)"
            >
              −
            </button>

            <b>
              ${
                externalView
                  ? `×${displayQty}`
                  : item.qty
              }
            </b>

            <button
              onclick="changeQty(${index},1)"
            >
              +
            </button>

          </div>

          <button
            class="price"
            onclick="editPrice(${index})"
          >
            ${money(displayPrice)}
            /
            ${escapeHtml(item.unit)}
            <span class="priceEditIcon">✎</span>
          </button>

        </div>

      </div>

      <div class="right">

        <div class="lineTotal">
          ${money(displayLineTotal)}
        </div>

        <button
          class="delete"
          onclick="removeItem(${index})"
        >
          ×
        </button>

      </div>

    </div>
  `;
}

function changeQty(
  index,
  delta
){

  const item =
    estimate[index];

  if(!item){
    return;
  }

  const oldQty =
    Number(item.qty) || 0;

  const oldProcurementQty =
    item.type ===
      "material"
      ? getProcurementQty(item)
      : 0;

  item.qty =
    Math.max(
      1,
      item.qty +
      delta
    );

  if(
    item.type ===
      "material"
  ){

    if(
      oldProcurementQty ===
        oldQty
    ){
      item.procurementQty =
        item.qty;
    }else{
      item.procurementQty =
        Math.min(
          item.qty,
          oldProcurementQty
        );
    }

    invalidateProcurement();
  }

  save();
  renderEstimate();
}

function removeItem(
  index
){

  const item =
    estimate[index];

  if(
    !item ||
    item.type ===
      "consumables"
  ){
    return;
  }

  const wasMaterial =
    item.type ===
      "material";

  estimate.splice(
    index,
    1
  );

  if(wasMaterial){
    invalidateProcurement();
  }

  save();
  renderEstimate();
}

function editPrice(
  index
){

  const value =
    prompt(
      estimate[index].type ===
        "consumables"
        ? "Умовна вартість, грн:"
        : "Ціна за одиницю, грн:",
      estimate[index].price
    );

  if(
    value === null
  ){
    return;
  }

  const price =
    Number(
      String(value)
        .replace(
          ",",
          "."
        )
    );

  if(
    Number.isFinite(
      price
    ) &&
    price >= 0
  ){

    estimate[index].price =
      price;

    save();
    renderEstimate();
  }
}

function clearEstimate(){

  if(
    !estimate.length
  ){
    return;
  }

  if(
    !confirm(
      "Очистити весь кошторис?"
    )
  ){
    return;
  }

  estimate = [
    createConsumablesItem()
  ];

  procurementReviewed =
    false;

  localStorage.setItem(
    PROCUREMENT_REVIEWED_KEY,
    "0"
  );

  procurementTopups = [];
  activeTopupId = null;
  saveProcurementTopups();

  materialDiscountPercent =
    0;

  localStorage.setItem(
    MATERIAL_DISCOUNT_KEY,
    "0"
  );

  save();
  renderEstimate();
}

function getMaterialItemsForClassification(){

  return catalog.filter(
    item => {

      if(
        item.type !==
        "material"
      ){
        return false;
      }

      if(
        catalogFilter !== "all" &&
        item.category !==
        catalogFilter
      ){
        return false;
      }

      return true;
    }
  );
}

function getBrands(){

  const values =
    new Map();

  getMaterialItemsForClassification()
    .forEach(
      item => {

        const value =
          String(
            item.manufacturer ||
            ""
          ).trim();

        if(
          value
        ){

          values.set(
            normalizeText(
              value
            ),
            value
          );
        }
      }
    );

  return Array.from(
    values.values()
  ).sort(
    (
      a,
      b
    ) =>
      a.localeCompare(
        b,
        "uk"
      )
  );
}

function renderBrandFilters(){

function renderCatalog(){

  const query =
    normalizeText(
      document.getElementById(
        "search"
      ).value
    );

  const items =
    catalog.filter(
      item => {

        if(
          item.type !==
          catalogMode
        ){
          return false;
        }

        if(
          query
        ){

          const searchable = [
            item.name,
            item.estimateName,
            item.article,
            item.manufacturer,
            item.system
          ]
          .map(
            normalizeText
          )
          .join(" ");

          if(
            !searchable.includes(
              query
            )
          ){
            return false;
          }
        }

        if(
          catalogFilter !==
          "all"
        ){

          if(
            item.stage !==
              catalogFilter &&
            item.category !==
              catalogFilter
          ){
            return false;
          }
        }

        if(
          catalogMode ===
            "material" &&
          catalogBrandFilter !==
            "all"
        ){

          if(
            normalizeText(
              item.manufacturer
            ) !==
            normalizeText(
              catalogBrandFilter
            )
          ){
            return false;
          }
        }

        if(
          catalogMode ===
            "material" &&
          catalogSystemFilter !==
            "all"
        ){

          if(
            normalizeText(
              item.system
            ) !==
            normalizeText(
              catalogSystemFilter
            )
          ){
            return false;
          }
        }

        return true;
      }
    );

  const box =
    document.getElementById(
      "catalog"
    );

  box.classList.toggle(
    "manageMode",
    catalogManageMode
  );

  if(
    !items.length
  ){

                  >
                    ＋ Нова позиція

                : ""
            )

    return;
  }

  box.innerHTML =
    items
      .map(
        renderCatalogItem
      )
      .join("");

  if(
    catalogManageMode
  ){

    box.innerHTML += `

      <button
        class="catalogAdd"
        onclick="openCatalogEditor()"

        ＋ Додати позицію

          ? `
            <button
              class="catalogClear"
              onclick="clearMaterialCatalog()"

          : ""

  }else if(
    catalogTarget ===
      "topup"
  ){

    box.innerHTML += `
      <button
        class="catalogAdd"
        onclick="openCatalogEditor()"

        ＋ Нова позиція

function renderCatalogItem(
  item
){

  const catalogPrice =

      "material"
      ? getMaterialCatalogPrice(

            item.price
          ) || 0
        );

                  topupItem.id ===
                  item.id
              )
            : null
        )

            estimateItem.id ===
            item.id
        );

    existing

    if(
      item.manufacturer
    ){

      );
    }

    if(
      item.system

      meta.push(
        item.system
      );
    }

    if(
      item.article
    ){
      meta.push(
        item.article
      );

  const encodedId =

    );

    catalogManageMode
      ? ""

                  )

            )

          )

}

function addItem(
  id
){

  const product =
    catalog.find(
      item =>
        item.id === id
    );

  if(
    !product
  ){
    return;
  }

  if(
    product.type ===
      "material" &&
    (
      !Number.isFinite(
        eurRate
      ) ||
      eurRate <= 0
    )
  ){

    alert(
      "Спочатку вкажіть курс EUR."
    );

    return;
  }

  const existing =
    estimate.find(
      item =>
        item.id === id
    );

  if(
    existing
  ){

    const oldQty =
      Number(existing.qty) || 0;

    const oldProcurementQty =
      getProcurementQty(
        existing
      );

    existing.qty++;

    if(
      existing.type ===
        "material"
    ){

      if(
        oldProcurementQty ===
          oldQty
      ){
        existing.procurementQty =
          existing.qty;
      }

      invalidateProcurement();
    }

  }else{

    let materialPrice = 0;
    let selectedOffer = null;

    if(
      product.type ===
      "material"
    ){

      const supplierOffers =
        getSupplierOffers(
          product
        );

      if(
        supplierOffers.length
      ){

        selectedOffer =
          chooseSupplierOffer(
            product
          );

        if(
          !selectedOffer
        ){

          alert(
            "Для цієї позиції немає доступної роздрібної ціни постачальника."
          );

          return;
        }

        materialPrice =
          getSnapshotPriceUAH(
            selectedOffer.retail
          );

        if(
          !Number.isFinite(
            materialPrice
          )
        ){

          alert(
            "Не вдалося визначити роздрібну ціну матеріалу."
          );

          return;
        }

      }else{

        materialPrice =
          getMaterialCatalogPrice(
            product
          );
      }
    }

    const estimateItem = {

      id:
        product.id,

      name:
        product.estimateName ||
        product.name,

      type:
        product.type,

      stage:
        product.stage,

      category:
        product.category,

      price:
        product.type ===
          "material"
          ? materialPrice
          : (
              Number(
                product.price
              ) || 0
            ),

      unit:
        product.unit,

      qty:1
    };

    if(
      product.type ===
        "material"
    ){
      estimateItem.procurementQty =
        1;
    }

    if(
      product.type ===
      "material"
    ){

      estimateItem.manufacturer =
        product.manufacturer ||
        "";

      estimateItem.system =
        product.system ||
        "";

      estimateItem.article =
        product.article ||
        "";

      estimateItem.fullName =
        product.name ||
        product.estimateName ||
        "";

      estimateItem.retailPrice =
        materialPrice;

      estimateItem.priceSnapshotAt =
        new Date().toISOString();

      estimateItem.eurRate =
        eurRate;

      if(selectedOffer){

        estimateItem.supplierId =
          selectedOffer.supplierId ||
          "";

        estimateItem.supplierName =
          selectedOffer.supplierName ||
          "";

        estimateItem.supplierImportedAt =
          selectedOffer.updatedAt ||
          selectedOffer.retail?.importedAt ||
          selectedOffer.master?.importedAt ||
          "";

        const purchasePrice =
          getSnapshotPriceUAH(
            selectedOffer.master
          );

        estimateItem.purchasePrice =
          Number.isFinite(
            purchasePrice
          )
            ? purchasePrice
            : null;
      }else{

        estimateItem.supplierId =
          "";

        estimateItem.supplierName =
          "";

        estimateItem.supplierImportedAt =
          "";

        estimateItem.purchasePrice =
          null;
      }
    }

    estimate.push(
      estimateItem
    );

    if(
      estimateItem.type ===
        "material"
    ){
      invalidateProcurement();
    }
  }

  save();

  renderEstimate();
  renderCatalog();
}

function catalogChangeQty(
  id,
  delta
){

  const index =
    estimate.findIndex(
      item =>
        item.id === id
    );

  if(
    index === -1
  ){

    if(
      delta > 0
    ){
      addItem(
        id
      );
    }

    return;
  }

  estimate[index].qty +=
    delta;

  if(
    estimate[index].qty <=
    0
  ){

    estimate.splice(
      index,
      1
    );
  }

  save();

  renderEstimate();
  renderCatalog();
}

function saveCatalogItem(){

  const name =
    document.getElementById(
      "editorName"
    ).value.trim();

  const estimateName =
    document.getElementById(
      "editorEstimateName"
    ).value.trim();

  const priceRaw =
    document.getElementById(
      "editorPrice"
    ).value.trim();

  const price =
    Number(
      priceRaw
    );

  const unit =
    document.getElementById(
      "editorUnit"
    ).value.trim();

  const type =
    document.getElementById(
      "editorType"
    ).value;

  const group =
    document.getElementById(
      "editorGroup"
    ).value;

  const manufacturer =
    document.getElementById(
      "editorManufacturer"
    ).value.trim();

  const system =
    document.getElementById(
      "editorSystem"
    ).value.trim();

  const article =
    document.getElementById(
      "editorArticle"
    ).value.trim();

  const supplierName =
    document.getElementById(
      "editorSupplier"
    ).value.trim();

  if(
    type === "work" &&
    !name
  ){

    alert(
      "Вкажіть назву."
    );

    return;
  }

  if(
    !estimateName
  ){

    alert(
      "Вкажіть назву для кошторису."
    );

    return;
  }

  if(
    (
      type === "material" &&
      !priceRaw
    ) ||
    !Number.isFinite(
      price
    ) ||
    price < 0
  ){

    alert(
      type === "material"
        ? "Вкажіть коректну базову ціну в EUR."
        : "Вкажіть коректну ціну."
    );

    return;
  }

  if(
    !unit
  ){

    alert(
      "Вкажіть одиницю."
    );

    return;
  }

  if(
    type === "material" &&
    !group
  ){

    alert(
      "Вкажіть категорію."
    );

    return;
  }

  const materialFullName =
    name ||
    estimateName;

  if(
    editingCatalogId
  ){

    const item =
      catalog.find(
        x =>
          x.id ===
          editingCatalogId
      );

    if(
      !item
    ){
      return;
    }

    const wasMaterial =
      item.type ===
      "material";

    if(
      !wasMaterial
    ){

      item.name =
        name;
    }

    item.estimateName =
      estimateName;

    item.unit =
      unit;

    item.type =
      type;

    if(
      type === "work"
    ){

      item.price =
        price;

      item.stage =
        group;

      delete item.category;
      delete item.manufacturer;
      delete item.system;
      delete item.article;

    }else{

      item.basePriceEUR =
        price;

      delete item.price;

      if(
        !wasMaterial
      ){
        item.name =
          materialFullName;
      }

      item.category =
        group;

      delete item.stage;

      item.manufacturer =
        manufacturer;

      item.system =
        system;

      item.supplierName =
        supplierName;

      if(
        !wasMaterial
      ){

        item.article =
          article;
      }
    }

  }else{

    const item = {

      id:
        "custom-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2,8),

      name:
        type === "material"
          ? materialFullName
          : name,

      estimateName:
        estimateName,

      unit:
        unit,

      type:
        type
    };

    if(
      type === "work"
    ){

      item.price =
        price;

      item.stage =
        group;

    }else{

      item.basePriceEUR =
        price;

      item.category =
        group;

      item.manufacturer =
        manufacturer;

      item.system =
        system;

      item.article =
        article;

      item.supplierName =
        supplierName;
    }

    catalog.push(
      item
    );

    if(
      pendingTopupAutoAdd &&
      type === "material"
    ){
      addItemToTopup(
        item.id
      );
    }
  }

  saveCatalog();

  closeCatalogEditor(
    true
  );

  pendingTopupAutoAdd =
    false;

  renderFilters();
  renderBrandFilters();
  renderSystemFilters();
  renderCatalog();
}

function tableSetName(index,value){
  const item=estimate[index];
  const name=String(value||"").trim();
  if(item&&name){item.name=name;save();renderEstimate();}
}

function tableSetQty(index,value){
  const item=estimate[index];
  const qty=Number(String(value).replace(",","."));
  if(item&&Number.isFinite(qty)&&qty>0){item.qty=qty;save();renderEstimate();}
  else renderEstimate();
}

function tableSetPrice(index,value){
  const item=estimate[index];
  const price=Number(String(value).replace(",","."));
  if(item&&Number.isFinite(price)&&price>=0){item.price=price;save();renderEstimate();}
  else renderEstimate();
}

function tableChangeQty(index,delta){
  const item=estimate[index];
  if(!item||item.type==="consumables")return;
  item.qty=Math.max(.01,(Number(item.qty)||0)+delta);
  save();renderEstimate();
}

function tableRemove(index){
  const item=estimate[index];
  if(!item||item.type==="consumables")return;
  estimate.splice(index,1);save();renderEstimate();
}

function tableSupplierMeta(item){
  if(item.type!=="material")return "";
  const meta=[];
  if(item.manufacturer)meta.push(item.manufacturer);
  if(item.supplierName)meta.push(item.supplierName);
  if(item.article)meta.push("арт. "+item.article);
  return meta.join(" · ");
}

function renderRow(item){
  const index=estimate.indexOf(item);
  const isMaterial=item.type==="material";
  const external=viewMode==="client"||viewMode==="supplier";
  const discount=external&&isMaterial&&!showClientDiscount
    ? 1-materialDiscountPercent/100 : 1;
  const price=(Number(item.price)||0)*discount;
  const qty=Number(item.qty)||1;
  const isConsumables=item.type==="consumables";
  return '<div class="row estimate-table-row '+(isConsumables?"consumables":"")+'">'+
    '<div><input class="table-name" value="'+escapeHtml(item.name)+'" '+(external?'readonly':'onchange="tableSetName('+index+',this.value)"')+'>'+
    (tableSupplierMeta(item)?'<div class="table-supplier">'+escapeHtml(tableSupplierMeta(item))+'</div>':'')+
    '</div>'+
    '<div class="table-qty">'+
    (external||isConsumables
      ? '<input value="'+qty+'" readonly>'
      : '<button onclick="tableChangeQty('+index+',-1)">−</button><input inputmode="decimal" value="'+qty+'" onchange="tableSetQty('+index+',this.value)"><button onclick="tableChangeQty('+index+',1)">＋</button>')+
    '</div>'+
    (external
      ? '<div class="table-price">'+money(price)+'</div>'
      : '<input class="table-price" inputmode="decimal" value="'+price+'" onchange="tableSetPrice('+index+',this.value)">')+
    (isConsumables||external?'':'<button class="table-remove" onclick="tableRemove('+index+')">×</button>')+
    (isConsumables||external?'<span></span>':'')+
    '</div>';
}

function section(title,items){
  return '<div class="section"><div class="sectionTitle">'+title+'</div>'+items.map(renderRow).join("")+'</div>';
}

const WF_V2_KEY="sa_master_workflow_v2";
let wfV2=wfLoad();
let wfFilters={type:"all",brand:"all",supplier:"",status:"all"};

function wfLoad(){
  try{
    const saved=JSON.parse(localStorage.getItem(WF_V2_KEY)||"null");
    if(saved&&typeof saved==="object"){
      return {
        stage:["estimate","procurement","work","done"].includes(saved.stage)?saved.stage:"estimate",
        fixed:saved.fixed&&Array.isArray(saved.fixed.items)?saved.fixed:null,
        materials:saved.materials&&typeof saved.materials==="object"?saved.materials:{},
        topups:Array.isArray(saved.topups)?saved.topups:[],
        notes:Array.isArray(saved.notes)?saved.notes:[],
        orders:Array.isArray(saved.orders)?saved.orders:[]
      };
    }
  }catch(error){}
  return {stage:"estimate",fixed:null,materials:{},topups:[],notes:[],orders:[]};
}

function wfSave(){
  localStorage.setItem(WF_V2_KEY,JSON.stringify(wfV2));
}

function wfCopy(value){
  return JSON.parse(JSON.stringify(value));
}

function wfEncode(value){
  return encodeURIComponent(String(value||""));
}

function wfDecode(value){
  try{return decodeURIComponent(String(value||""));}catch(error){return String(value||"");}
}

function wfNow(){

}

function wfDate(value){
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return "";
  return date.toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit",year:"2-digit"});
}

function wfSnapshotItems(items){
  return items
    .filter(function(item){return item&&item.type!=="consumables";})
    .map(function(item){
      return {
        id:item.id||("manual-"+item.name),
        name:item.name||"",
        fullName:item.fullName||"",
        type:item.type||"",
        stage:item.stage||"",
        category:item.category||"",
        manufacturer:item.manufacturer||"",
        system:item.system||"",
        article:item.article||"",
        supplierName:item.supplierName||"",
        unit:item.unit||"",
        qty:Number(item.qty)||0,
        price:Number(item.price)||0,
        purchasePrice:Number.isFinite(Number(item.purchasePrice))?Number(item.purchasePrice):null
      };
    });
}

function wfCurrentSnapshot(){
  return wfSnapshotItems(estimate);
}

function wfSignature(items){
  return JSON.stringify(
    wfSnapshotItems(items)
      .map(function(item){
        return [item.id,item.name,item.qty,item.unit,item.price,item.type].join("|");
      })
      .sort()
  );
}

function wfDifference(){
  if(!wfV2.fixed)return {added:0,removed:0,changed:0,total:0};
  const before=new Map();
  const after=new Map();
  wfV2.fixed.items.forEach(function(item){before.set(item.id,item);});
  wfCurrentSnapshot().forEach(function(item){after.set(item.id,item);});
  let added=0,removed=0,changed=0;
  after.forEach(function(item,id){
    if(!before.has(id)){added++;return;}
    const old=before.get(id);
    if(old.name!==item.name||old.qty!==item.qty||old.unit!==item.unit||old.price!==item.price||old.type!==item.type)changed++;
  });
  before.forEach(function(item,id){if(!after.has(id))removed++;});
  return {added:added,removed:removed,changed:changed,total:added+removed+changed};
}

function wfFixedMaterials(){
  return wfV2.fixed&&Array.isArray(wfV2.fixed.items)
    ? wfV2.fixed.items.filter(function(item){return item.type==="material";})
    : [];
}

function wfDefaultMaterialState(item){
  return {
    supplierName:item.supplierName||"",
    supplierId:item.supplierId||"",
    availability:"pending",
    availableQty:null,
    lifecycle:"draft",
    actualQty:null,
    actualPrice:null,
    updatedAt:""
  };
}

function wfMaterialState(item){
  if(!item)return wfDefaultMaterialState({});
  if(!wfV2.materials[item.id]){
    wfV2.materials[item.id]=wfDefaultMaterialState(item);
  }
  return wfV2.materials[item.id];
}

function wfSyncMaterialStates(previousItems){
  const previous=new Map((previousItems||[]).filter(function(item){return item.type==="material";}).map(function(item){return [item.id,item];}));
  const next={};
  wfFixedMaterials().forEach(function(item){
    const oldState=wfV2.materials[item.id];
    const oldItem=previous.get(item.id);
    const same=oldItem&&oldItem.name===item.name&&oldItem.qty===item.qty&&oldItem.unit===item.unit&&oldItem.price===item.price;
    next[item.id]=oldState&&same?oldState:wfDefaultMaterialState(item);
  });
  wfV2.materials=next;
}

function wfStageIndex(value){
  return ["estimate","procurement","work","done"].indexOf(value);
}

function wfStageLabel(value){
  return {estimate:"Кошторис",procurement:"Комплектація",work:"В роботі",done:"Завершено"}[value]||"Кошторис";
}

function wfLifecycleLabel(value){
  return {
    draft:"Чернетка",
    requested:"Запит наявності",
    response:"Відповідь отримано",
    confirmed:"Підтверджено",
    ordered:"Замовлено",
    received:"Отримано"
  }[value]||"Чернетка";
}

function wfAvailabilityLabel(state,item){
  if(state.availability==="available")return "✓ є";
  if(state.availability==="partial")return "◐ "+(Number(state.availableQty)||0)+"/"+(Number(item.qty)||0);
  if(state.availability==="missing")return "× немає";
  return "○ очікуємо";
}

function wfAvailabilityClass(state){
  if(state.availability==="available")return "available";
  if(state.availability==="partial")return "partial";
  if(state.availability==="missing")return "missing";
  return "";
}

function wfMaterialType(item){
  return {
    fittings:"Арматура",
    water:"Водопостачання",
    sewer:"Каналізація",
    equipment:"Обладнання",
    other:"Інше"
  }[item.category]||"Інше";
}

function wfSupplierChoices(item){
  const values=[];
  const seen={};
  function add(name,id){
    const text=String(name||"").trim();
    const key=text.toLowerCase();
    if(text&&!seen[key]){
      seen[key]=true;
      values.push({name:text,id:id||""});
    }
  }
  if(typeof getSupplierOffers==="function"){
    const product=(typeof getEstimateCatalogProduct==="function"?getEstimateCatalogProduct(item):null)||catalog.find(function(product){return product.id===item.id;});
    if(product){
      getSupplierOffers(product).forEach(function(offer){add(offer&&offer.supplierName,offer&&offer.supplierId);});
      add(product.supplierName,product.supplierId);
    }
  }
  const state=wfMaterialState(item);
  add(state.supplierName,state.supplierId);
  add(item.supplierName,item.supplierId);
  return values;
}

function wfAllSuppliers(){
  const result=[];
  const seen={};
  wfFixedMaterials().forEach(function(item){
    wfSupplierChoices(item).forEach(function(choice){
      const key=choice.name.toLowerCase();
      if(!seen[key]){seen[key]=true;result.push(choice.name);}
    });
  });
  return result.sort(function(a,b){return a.localeCompare(b,"uk");});
}

function wfFilteredMaterials(){
  return wfFixedMaterials().filter(function(item){
    const state=wfMaterialState(item);
    if(wfFilters.type!=="all"&&item.category!==wfFilters.type)return false;
    if(wfFilters.brand!=="all"&&String(item.manufacturer||"")!==wfFilters.brand)return false;
    if(wfFilters.supplier==="__none__"&&state.supplierName)return false;
    if(wfFilters.supplier&&wfFilters.supplier!=="__none__"&&state.supplierName!==wfFilters.supplier)return false;
    if(wfFilters.status!=="all"&&state.availability!==wfFilters.status&&state.lifecycle!==wfFilters.status)return false;
    return true;
  });
}

function wfOption(value,label,current){
  return '<option value="'+escapeHtml(value)+'"'+(value===current?" selected":"")+'>'+escapeHtml(label)+'</option>';
}

function wfFilterOptions(){
  const materials=wfFixedMaterials();
  const types=Array.from(new Set(materials.map(function(item){return item.category||"other";})));
  const brands=Array.from(new Set(materials.map(function(item){return String(item.manufacturer||"").trim();}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b,"uk");});
  const suppliers=wfAllSuppliers();
  return {
    types:'<select class="comp-filter" aria-label="Тип" onchange="wfSetFilter(\'type\',this.value)">'+wfOption("all","Тип: усі",wfFilters.type)+types.map(function(value){return wfOption(value,wfMaterialType({category:value}),wfFilters.type);}).join("")+'</select>',
    brands:'<select class="comp-filter" aria-label="Бренд" onchange="wfSetFilter(\'brand\',this.value)">'+wfOption("all","Бренд: усі",wfFilters.brand)+brands.map(function(value){return wfOption(value,value,wfFilters.brand);}).join("")+'</select>',
    suppliers:'<select class="comp-filter" aria-label="Постачальник" onchange="wfSetFilter(\'supplier\',this.value)">'+wfOption("","Постачальник: усі",wfFilters.supplier)+wfOption("__none__","Без постачальника",wfFilters.supplier)+suppliers.map(function(value){return wfOption(value,value,wfFilters.supplier);}).join("")+'</select>',
    statuses:'<select class="comp-filter" aria-label="Статус" onchange="wfSetFilter(\'status\',this.value)">'+wfOption("all","Статус: усі",wfFilters.status)+wfOption("pending","Очікуємо",wfFilters.status)+wfOption("available","Є",wfFilters.status)+wfOption("partial","Частково",wfFilters.status)+wfOption("missing","Немає",wfFilters.status)+wfOption("ordered","Замовлено",wfFilters.status)+wfOption("received","Отримано",wfFilters.status)+'</select>'
  };
}

function wfStatusLine(item,state){
  const supplier=state.supplierName||"Без постачальника";
  return supplier+" · "+wfLifecycleLabel(state.lifecycle)+" · "+wfAvailabilityLabel(state,item);
}

function wfRenderChrome(){
  const anchor=document.querySelector(".clientWrap");
  if(!anchor)return;
  let wrap=document.getElementById("workflowWrap");
  if(!wrap){
    wrap=document.createElement("div");
    wrap.id="workflowWrap";
    wrap.className="workflow-wrap";
    anchor.parentNode.insertBefore(wrap,anchor.nextSibling);
  }
  const diff=wfDifference();
  const current=wfStageIndex(wfV2.stage);
  const steps=["estimate","procurement","work","done"];
  const stepHtml=steps.map(function(step,index){
    return '<button class="workflow-step '+(index===current?"active ":"")+(index<current?"done":"")+'" onclick="wfSetStage(\''+step+'\')">'+wfStageLabel(step)+'</button>';
  }).join("");
  let stateHtml="";
  if(!wfV2.fixed){
    stateHtml='<div class="workflow-state"><span><b>Кошторис — чернетка</b></span><button onclick="wfFixEstimate()">Зафіксувати</button></div>';
  }else if(diff.total){
    const pieces=[];
    if(diff.added)pieces.push("додано "+diff.added);
    if(diff.removed)pieces.push("видалено "+diff.removed);
    if(diff.changed)pieces.push("змінено "+diff.changed);
    stateHtml='<div class="workflow-state changed"><span><b>Після фіксації є зміни</b><br>'+escapeHtml(pieces.join(" · "))+'</span><button onclick="openProcurement()">Перевірити</button></div>';
  }else{
    stateHtml='<div class="workflow-state"><span><b>Кошторис V'+wfV2.fixed.version+' зафіксовано</b><br>'+wfDate(wfV2.fixed.createdAt)+'</span><button onclick="openProcurement()">Комплектація</button></div>';
  }
  wrap.innerHTML='<div class="workflow-steps">'+stepHtml+'</div>'+stateHtml;
  const procurementButton=document.querySelector(".procurementAction");
  if(procurementButton){
    procurementButton.textContent=wfV2.fixed?"Комплектація":"Зафіксувати кошторис";
    procurementButton.onclick=wfV2.fixed?openProcurement:wfFixEstimate;
  }
}

function wfFixEstimate(){
  const next=wfCurrentSnapshot();
  if(!next.length){
    alert("Спочатку додайте хоча б одну роботу або матеріал до кошторису.");
    return;
  }
  const previous=wfV2.fixed?wfV2.fixed.items:[];
  if(wfV2.fixed&&!confirm("Оновити зафіксований кошторис? Дані запитів і замовлень не зміняться автоматично; для змінених позицій буде потрібна повторна перевірка."))return;
  wfV2.fixed={
    version:(wfV2.fixed?Number(wfV2.fixed.version)||1:0)+1,
    createdAt:wfNow(),
    items:wfCopy(next)
  };
  wfSyncMaterialStates(previous);
  wfV2.stage="procurement";
  wfSave();
  wfRenderChrome();
  openProcurement();
}

function wfSetStage(stage){
  if(stage==="procurement"){
    openProcurement();
    return;
  }
  if((stage==="work"||stage==="done")&&!wfV2.fixed){
    alert("Спочатку зафіксуйте кошторис і пройдіть комплектацію.");
    return;
  }
  wfV2.stage=stage;
  wfSave();
  wfRenderChrome();
}

function wfSetFilter(key,value){
  wfFilters[key]=value;
  renderProcurement();
}

function wfAssignSupplier(){
  const select=document.getElementById("wfSupplierAssign");
  const supplier=select?select.value:"";
  const items=wfFilteredMaterials();
  if(!supplier){
    alert("Оберіть постачальника.");
    return;
  }
  if(!items.length){
    alert("У цій вибірці немає матеріалів.");
    return;
  }
  const hasDifferent=items.some(function(item){
    const state=wfMaterialState(item);
    return state.supplierName&&state.supplierName!==supplier;
  });
  if(hasDifferent&&!confirm("Замінити постачальника на «"+supplier+"» у всіх "+items.length+" позиціях вибірки?")){
    return;
  }
  items.forEach(function(item){
    const state=wfMaterialState(item);
    if(state.supplierName!==supplier){
      state.supplierName=supplier;
      state.supplierId="";
      state.availability="pending";
      state.availableQty=null;
      state.lifecycle="draft";
      state.updatedAt=wfNow();
    }
  });
  wfSave();
  renderProcurement();
}

function wfDialog(content){
  wfCloseDialog();
  const dialog=document.createElement("div");
  dialog.id="wfDialog";
  dialog.className="comp-dialog";
  dialog.innerHTML='<div class="comp-dialog-panel">'+content+'</div>';
  dialog.addEventListener("click",function(event){if(event.target===dialog)wfCloseDialog();});
  document.body.appendChild(dialog);
}

function wfCloseDialog(){
  const dialog=document.getElementById("wfDialog");
  if(dialog)dialog.remove();
}

function wfOpenMaterial(encodedId){

  const choices=wfSupplierChoices(item);

    ? choices.map(function(choice){

      }).join("")
    : '<p>Для цієї позиції в каталозі ще немає постачальника. Його можна додати у каталозі або вибрати для вибірки вище.</p>';
  let lifecycle="";
  if(state.lifecycle==="response"&&(state.availability==="available"||state.availability==="partial")){
    lifecycle+='<button class="comp-dialog-option primary" onclick="wfConfirmMaterial(\''+id+'\')">Підтвердити позицію</button>';
  }

    lifecycle+='<button class="comp-dialog-option primary" onclick="wfReceiveMaterial(\''+id+'\',\'full\')">Отримано повністю</button>';
    lifecycle+='<button class="comp-dialog-option" onclick="wfReceiveMaterial(\''+id+'\',\'partial\')">Є розбіжності</button>';
    lifecycle+='<button class="comp-dialog-option" onclick="wfEditActual(\''+id+'\')">Фактична кількість і ціна</button>';
  }
  if(state.lifecycle==="received"){
    lifecycle+='<button class="comp-dialog-option" onclick="wfEditActual(\''+id+'\')">Фактична кількість і ціна</button>';

  wfDialog(

    '<div class="comp-dialog-row"><div><b>Постачальник</b><small>Вибір лише для цього об’єкта</small></div></div>'+
    supplierButtons+
    '<div class="comp-dialog-row"><div><b>Наявність</b><small>Швидко зафіксуйте відповідь постачальника</small></div></div>'+
    '<button class="comp-dialog-option" onclick="wfSetAvailability(\''+id+'\',\'available\')">✓ Є повністю</button>'+
    '<button class="comp-dialog-option" onclick="wfSetAvailability(\''+id+'\',\'partial\')">◐ Є частково</button>'+
    '<button class="comp-dialog-option" onclick="wfSetAvailability(\''+id+'\',\'missing\')">× Немає</button>'+

}

function wfAddShortage(item,qty,reason){
  const amount=Math.max(0,Number(qty)||0);
  if(!amount)return;
  let topup=wfV2.topups.find(function(entry){return entry.sourceMaterialId===item.id&&entry.status!=="received";});
  if(topup){
    topup.qty=Math.max(Number(topup.qty)||0,amount);
    topup.comment=reason||topup.comment||"";
  }else{
    wfV2.topups.push({
      id:"topup-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),
      name:item.name,
      qty:amount,
      unit:item.unit||"",
      comment:reason||"",
      sourceMaterialId:item.id,
      system:item.system||"",
      stage:item.stage||"",
      room:"",
      status:"new",
      createdAt:wfNow()
    });
  }
}

function wfSetAvailability(encodedId,kind){
  const item=wfFindFixedMaterial(wfDecode(encodedId));
  if(!item)return;
  const state=wfMaterialState(item);
  const total=Math.max(0,Number(item.qty)||0);
  if(kind==="available"){
    state.availability="available";
    state.availableQty=total;
    state.lifecycle="response";
  }else if(kind==="partial"){
    const raw=prompt("Скільки є в наявності, "+item.unit+"?",String(Math.max(0,total-1)));
    if(raw===null)return;
    const available=Math.max(0,Math.min(total,Number(String(raw).replace(",","."))||0));
    state.availability=available>=total?"available":"partial";
    state.availableQty=available;
    state.lifecycle="response";
    if(available<total&&confirm("Додати відсутні "+(total-available)+" "+item.unit+" до «Докупити»?")){
      wfAddShortage(item,total-available,"Часткова наявність у "+(state.supplierName||"постачальника"));
    }
  }else if(kind==="missing"){
    state.availability="missing";
    state.availableQty=0;
    state.lifecycle="response";
    if(confirm("Додати "+total+" "+item.unit+" до «Докупити»?")){
      wfAddShortage(item,total,"Немає у "+(state.supplierName||"постачальника"));
    }
  }
  state.updatedAt=wfNow();
  wfSave();
  wfCloseDialog();
  renderProcurement();
}

function wfConfirmMaterial(encodedId){
  const item=wfFindFixedMaterial(wfDecode(encodedId));
  if(!item)return;
  const state=wfMaterialState(item);
  if(state.availability!=="available"&&state.availability!=="partial"){
    alert("Підтвердити можна лише позицію з наявністю.");
    return;
  }
  state.lifecycle="confirmed";
  state.updatedAt=wfNow();
  wfSave();
  wfCloseDialog();
  renderProcurement();
}

function wfCreateOrder(){
  const supplier=wfFilters.supplier;
  if(!supplier||supplier==="__none__"){
    alert("У фільтрі оберіть конкретного постачальника.");
    return;
  }
  const candidates=wfFilteredMaterials().filter(function(item){
    const state=wfMaterialState(item);
    return state.supplierName===supplier&&(state.availability==="available"||state.availability==="partial");
  });
  if(!candidates.length){
    alert("Немає позицій із підтвердженою наявністю.");
    return;
  }
  const unconfirmed=candidates.filter(function(item){return wfMaterialState(item).lifecycle!=="confirmed"&&wfMaterialState(item).lifecycle!=="ordered";});
  if(unconfirmed.length&&!confirm("Підтвердити "+unconfirmed.length+" доступних позицій і сформувати замовлення?")){
    return;
  }
  const orderItems=[];
  candidates.forEach(function(item){
    const state=wfMaterialState(item);
    if(state.lifecycle==="ordered")return;
    const qty=state.availability==="partial"?Math.max(0,Number(state.availableQty)||0):Math.max(0,Number(item.qty)||0);
    if(!qty)return;
    state.lifecycle="ordered";
    state.actualQty=qty;
    state.actualPrice=Number(item.price)||0;
    state.updatedAt=wfNow();
    orderItems.push({id:item.id,name:item.name,qty:qty,unit:item.unit,price:Number(item.price)||0});
  });
  if(!orderItems.length){
    alert("Для цього постачальника всі доступні позиції вже замовлені.");
    return;
  }
  wfV2.orders.push({id:"order-"+Date.now(),supplier:supplier,createdAt:wfNow(),items:orderItems});
  wfSave();
  renderProcurement();
}

function wfReceiveMaterial(encodedId,mode){
  const item=wfFindFixedMaterial(wfDecode(encodedId));
  if(!item)return;
  const state=wfMaterialState(item);
  const ordered=Math.max(0,Number(state.actualQty)||Number(item.qty)||0);
  let received=ordered;
  if(mode==="partial"){
    const raw=prompt("Фактично отримано, "+item.unit+":",String(ordered));
    if(raw===null)return;
    received=Math.max(0,Math.min(ordered,Number(String(raw).replace(",","."))||0));
  }
  state.lifecycle="received";
  state.actualQty=received;
  state.availableQty=received;
  state.availability=received>=Number(item.qty)?"available":(received>0?"partial":"missing");
  state.updatedAt=wfNow();
  if(received<Number(item.qty)){
    wfAddShortage(item,Number(item.qty)-received,"Розбіжність при отриманні");
  }
  wfSave();
  wfCloseDialog();
  renderProcurement();
}

function wfEditActual(encodedId){
  const item=wfFindFixedMaterial(wfDecode(encodedId));
  if(!item)return;
  const state=wfMaterialState(item);
  const rawQty=prompt("Фактична кількість, "+item.unit+":",String(Number(state.actualQty)||Number(item.qty)||0));
  if(rawQty===null)return;
  const rawPrice=prompt("Фактична ціна за одиницю, грн:",String(Number(state.actualPrice)||Number(item.price)||0));
  if(rawPrice===null)return;
  const qty=Number(String(rawQty).replace(",",".")); 
  const price=Number(String(rawPrice).replace(",",".")); 
  if(!Number.isFinite(qty)||qty<0||!Number.isFinite(price)||price<0){
    alert("Вкажіть коректні фактичні кількість і ціну.");
    return;
  }
  state.actualQty=qty;
  state.actualPrice=price;
  state.updatedAt=wfNow();
  wfSave();
  wfCloseDialog();
  renderProcurement();
}

function wfAddTopup(){
