<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Калькулятор сантехніка</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f4f6fa;
  --card:rgba(255,255,255,.9);
  --soft:#eef1f5;
  --line:#e2e5ea;
  --text:#15171a;
  --muted:#7b8088;
  --blue:#007aff;
  --red:#ff3b30;
  --shadow:0 8px 25px rgba(30,40,60,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,input,select{font:inherit}

button{
  border:0;
  background:none;
  color:inherit;
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:560px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

.header{
  flex:0 0 auto;
  padding:calc(9px + env(safe-area-inset-top)) 14px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:19px;
  font-weight:750;
  letter-spacing:-.4px;
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:1px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:9px;
}

.date{
  color:var(--muted);
  font-size:12px;
}

.masterButton{
  width:32px;
  height:32px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:var(--blue);
  box-shadow:0 3px 12px rgba(30,40,60,.06);
}

.masterButton svg{
  width:19px;
  height:19px;
}

.clientWrap{
  flex:0 0 auto;
  padding:0 12px 8px;
}

.clientTitle{
  padding:0 3px 5px;
  font-size:13px;
  font-weight:750;
}

.client{
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:17px;
  padding:9px;
  box-shadow:var(--shadow);
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field input{
  width:100%;
  height:36px;
  border:0;
  outline:0;
  border-radius:10px;
  background:var(--soft);
  padding:0 10px;
  font-size:13px;
  color:var(--text);
}

.field input:focus{
  background:#fff;
  box-shadow:inset 0 0 0 1.5px var(--blue);
}

.estimate{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:0 12px;
}

.estimateHead{
  flex:0 0 auto;
  padding:3px 3px 6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.estimateHead strong{
  font-size:14px;
}

.estimateHeadRight{
  display:flex;
  align-items:center;
  gap:8px;
}

.count{
  color:var(--muted);
  font-size:11px;
}

.clearEstimate{
  display:none;
  color:var(--red);
  font-size:11px;
  font-weight:650;
}

.list{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding-bottom:8px;
}

.list::-webkit-scrollbar{
  display:none;
}

.empty{
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

.section{
  margin-bottom:9px;
}

.sectionTitle{
  position:sticky;
  top:0;
  z-index:2;
  background:rgba(244,246,250,.94);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--muted);
  font-size:10px;
  font-weight:750;
  letter-spacing:.5px;
  padding:6px 4px 5px;
}

.row{
  min-height:66px;
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  border-radius:15px;
  box-shadow:0 3px 13px rgba(30,40,60,.05);
  padding:9px 9px 8px 11px;
  margin-bottom:6px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
}

.name{
  font-size:13px;
  line-height:1.25;
  font-weight:650;
  overflow-wrap:anywhere;
}

.controls{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:6px;
}

.qty{
  display:flex;
  align-items:center;
  height:28px;
  border-radius:9px;
  background:var(--soft);
  overflow:hidden;
}

.qty button{
  width:29px;
  height:28px;
  color:var(--blue);
  font-size:18px;
  line-height:1;
}

.qty b{
  min-width:24px;
  text-align:center;
  font-size:12px;
}

.price{
  min-height:28px;
  border-radius:9px;
  background:var(--soft);
  color:#555;
  padding:0 8px;
  font-size:10px;
}

.priceEditIcon{
  margin-left:3px;
  opacity:.5;
  font-size:9px;
}

.right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:space-between;
  align-self:stretch;
  min-width:82px;
}

.lineTotal{
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
}

.delete{
  width:27px;
  height:27px;
  border-radius:50%;
  background:#fff0ef;
  color:var(--red);
  font-size:18px;
}

.bottom{
  flex:0 0 auto;
  padding:7px 12px calc(8px + env(safe-area-inset-bottom));
}

.totalBar{
  height:44px;
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px;
  margin-bottom:7px;
  font-size:13px;
}

.totalBar strong{
  font-size:17px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.action{
  height:45px;
  border-radius:14px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:750;
  box-shadow:0 5px 14px rgba(0,122,255,.18);
}

.action:active{
  transform:scale(.98);
}

.sheet{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.32);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.sheet.open{
  display:flex;
}

.panel{
  width:100%;
  max-width:560px;
  height:min(82dvh,720px);
  margin:auto;
  background:#f6f7fa;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}

.panelHead{
  flex:0 0 auto;
  padding:11px 14px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panelHead strong{
  font-size:18px;
}

.panelHeadRight{
  display:flex;
  align-items:center;
  gap:4px;
}

.catalogEditButton{
  height:32px;
  padding:0 9px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  font-size:12px;
  font-weight:700;
}

.catalogEditButton.active{
  background:var(--blue);
  color:#fff;
}

.close{
  width:32px;
  height:32px;
  font-size:28px;
  color:#777;
}

.search{
  flex:0 0 auto;
  width:calc(100% - 24px);
  margin:0 12px 8px;
  height:40px;
  border:0;
  outline:0;
  border-radius:12px;
  background:#e9ebef;
  padding:0 12px;
  font-size:14px;
}

.filters,
.subFilters{
  flex:0 0 auto;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  padding:0 12px 8px;
}

.filters::-webkit-scrollbar,
.subFilters::-webkit-scrollbar{
  display:none;
}

.filter,
.subFilter{
  flex:0 0 auto;
  height:30px;
  padding:0 10px;
  border-radius:9px;
  background:#e9ebef;
  color:#555;
  font-size:11px;
  font-weight:650;
}

.filter.active,
.subFilter.active{
  background:var(--blue);
  color:#fff;
}

.catalog{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:0 12px 15px;
}

.catalog::-webkit-scrollbar{
  display:none;
}

.catalogItem{
  min-height:59px;
  background:#fff;
  border-radius:14px;
  padding:9px 9px 9px 11px;
  margin:6px 0;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 2px 10px rgba(30,40,60,.04);
}

.catalogItem.added{
  box-shadow:inset 0 0 0 1.5px rgba(0,122,255,.25);
}

.catalogName{
  font-size:13px;
  line-height:1.25;
  font-weight:700;
  overflow-wrap:anywhere;
}

.catalogMeta{
  color:var(--muted);
  font-size:10px;
  line-height:1.35;
  margin-top:3px;
}

.catalogControls{
  display:flex;
  align-items:center;
  gap:5px;
}

.catalogQtyButton{
  width:29px;
  height:29px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  font-size:18px;
}

.catalogQty{
  min-width:27px;
  text-align:center;
  color:var(--blue);
  font-size:12px;
  font-weight:750;
}

.addIcon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#e9ebef;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex:0 0 auto;
}
  .catalogManage{
  display:flex;
  gap:5px;
}

.manageEdit,
.manageDelete{
  width:31px;
  height:31px;
  border-radius:9px;
  font-size:15px;
}

.manageEdit{
  background:#e9ebef;
  color:var(--blue);
}

.manageDelete{
  background:#fff0ef;
  color:var(--red);
}

.catalog.manageMode .catalogControls,
.catalog.manageMode .addIcon{
  display:none;
}

.catalogAdd{
  width:100%;
  height:42px;
  margin:7px 0 12px;
  border-radius:13px;
  background:#fff;
  color:var(--blue);
  box-shadow:0 2px 10px rgba(30,40,60,.045);
  font-size:14px;
  font-weight:700;
}

.catalogClear{
  width:100%;
  height:42px;
  margin:0 0 12px;
  border-radius:13px;
  background:#fff;
  color:var(--red);
  box-shadow:0 2px 10px rgba(30,40,60,.045);
  font-size:14px;
  font-weight:700;
}

.noResults{
  text-align:center;
  color:var(--muted);
  padding:35px 20px;
  font-size:14px;
}

.editorSheet{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.34);
  backdrop-filter:blur(6px);
}

.editorSheet.open{
  display:flex;
}

.editorPanel{
  width:100%;
  max-width:560px;
  max-height:88dvh;
  margin:auto;
  background:#f6f7fa;
  border-radius:22px;
  overflow-y:auto;
  padding:13px 12px calc(14px + env(safe-area-inset-bottom));
}

.editorHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.editorHead strong{
  font-size:18px;
}

.editorFields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.editorField{
  min-width:0;
}

.editorField.full{
  grid-column:1/-1;
}

.editorField label{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin:0 3px 4px;
}

.editorField input,
.editorField select{
  width:100%;
  height:40px;
  border:0;
  outline:0;
  border-radius:11px;
  background:#fff;
  padding:0 10px;
  font-size:13px;
}

.editorSave{
  width:100%;
  height:44px;
  margin-top:11px;
  border-radius:13px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:750;
}

.masterSheet{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.34);
  backdrop-filter:blur(6px);
}

.masterSheet.open{
  display:flex;
}

.masterPanel{
  width:100%;
  max-width:560px;
  margin:auto;
  background:#f6f7fa;
  border-radius:22px;
  padding:13px 12px calc(14px + env(safe-area-inset-bottom));
}

.masterHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.masterHead strong{
  font-size:18px;
}

.masterFields{
  display:grid;
  gap:8px;
}

.masterFields input{
  width:100%;
  height:42px;
  border:0;
  outline:0;
  border-radius:11px;
  background:#fff;
  padding:0 11px;
  font-size:13px;
}

.masterSave{
  width:100%;
  height:44px;
  margin-top:10px;
  border-radius:13px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:750;
}

@media(max-width:390px){
  .logo{
    font-size:17px;
  }

  .row{
    min-height:63px;
  }

  .name{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div>
  <div class="logo">
    Калькулятор сантехніка
  </div>

  <div class="subtitle">
    кошторис
  </div>
</div>

<div class="headerRight">

<div
  class="date"
  id="date"
></div>

<button
  class="masterButton"
  onclick="openMaster()"
  aria-label="Дані майстра"
>
  ⚙
</button>

</div>

</header>

<div class="clientWrap">

<div class="clientTitle">
  Замовник
</div>

<div class="client">

<div class="fields">

<div class="field">
<input
  id="clientName"
  placeholder="Ім’я та прізвище"
>
</div>

<div class="field">
<input
  id="clientPhone"
  placeholder="Телефон"
  inputmode="tel"
>
</div>

<div class="field full">
<input
  id="clientAddress"
  placeholder="Адреса об’єкта"
>
</div>

</div>

</div>

</div>

<main class="estimate">

<div class="estimateHead">

<strong>
  Кошторис
</strong>

<div class="estimateHeadRight">

<span
  class="count"
  id="count"
>
  0 позицій
</span>

<button
  class="clearEstimate"
  id="clearEstimate"
  onclick="clearEstimate()"
>
  Очистити
</button>

</div>

</div>

<div
  class="list"
  id="list"
></div>

</main>

<div class="bottom">

<div class="totalBar">

<span>
  Разом
</span>

<strong id="grand">
  0 грн
</strong>

</div>

<div class="actions">

<button
  class="action"
  onclick="openCatalog('work')"
>
  ＋ Робота
</button>

<button
  class="action"
  onclick="openCatalog('material')"
>
  ＋ Матеріал
</button>

</div>

</div>

</div>

<!-- CATALOG -->

<div
  class="sheet"
  id="sheet"
  onclick="if(event.target===this)closeCatalog()"
>

<div class="panel">

<div class="panelHead">

<strong id="panelTitle">
  Додати
</strong>

<div class="panelHeadRight">

<button
  class="catalogEditButton"
  id="eurRateButton"
  onclick="editEurRate()"
  style="display:none"
>
  € Курс
</button>

<button
  class="catalogEditButton"
  id="catalogEditButton"
  onclick="toggleCatalogManage()"
>
  ✎ Каталог
</button>

<button
  class="close"
  onclick="closeCatalog()"
>
  ×
</button>

</div>

</div>

<input
  id="search"
  class="search"
  placeholder="Пошук позиції…"
  oninput="renderCatalog()"
>

<div
  class="filters"
  id="filters"
></div>

<div
  class="subFilters"
  id="brandFilters"
  style="display:none"
></div>

<div
  class="subFilters"
  id="systemFilters"
  style="display:none"
></div>

<div
  class="catalog"
  id="catalog"
></div>

</div>

</div>

<!-- EDITOR -->

<div
  class="editorSheet"
  id="editorSheet"
  onclick="if(event.target===this)closeCatalogEditor()"
>

<div class="editorPanel">

<div class="editorHead">

<strong id="editorTitle">
  Нова позиція
</strong>

<button
  class="close"
  onclick="closeCatalogEditor()"
>
  ×
</button>

</div>

<div class="editorFields">

<div class="editorField full">

<label>
  Повна назва
</label>

<input
  id="editorName"
  placeholder="Повна назва"
>

</div>

<div class="editorField full">

<label>
  Назва для кошторису
</label>

<input
  id="editorEstimateName"
  placeholder="Назва для кошторису"
>

</div>

<div class="editorField">

<label id="editorPriceLabel">
  Ціна
</label>

<input
  id="editorPrice"
  type="number"
  inputmode="decimal"
  min="0"
>

</div>

<div class="editorField">

<label>
  Одиниця
</label>

<input
  id="editorUnit"
  placeholder="шт"
>

</div>

<div class="editorField">

<label>
  Тип
</label>

<select id="editorType">

<option value="work">
  Робота
</option>

<option value="material">
  Матеріал
</option>

</select>

</div>

<div class="editorField">

<label id="editorGroupLabel">
  Етап
</label>

<select id="editorGroup"></select>

</div>

<div
  id="materialFields"
  class="editorField full"
>

<div class="editorFields">

<div class="editorField">

<label>
  Бренд
</label>

<input
  id="editorManufacturer"
  placeholder="TECE"
>

</div>

<div class="editorField">

<label>
  Система
</label>

<input
  id="editorSystem"
  placeholder="TECEflex"
>

</div>

<div class="editorField full">

<label>
  Артикул
</label>

<input
  id="editorArticle"
  placeholder="Артикул"
>

</div>

</div>

</div>

</div>

<button
  class="editorSave"
  onclick="saveCatalogItem()"
>
  Зберегти
</button>

</div>

</div>

<!-- MASTER -->

<div
  class="masterSheet"
  id="masterSheet"
  onclick="if(event.target===this)closeMaster()"
>

<div class="masterPanel">

<div class="masterHead">

<strong>
  Дані майстра
</strong>

<button
  class="close"
  onclick="closeMaster()"
>
  ×
</button>

</div>

<div class="masterFields">

<input
  id="masterName"
  placeholder="Ім’я"
>

<input
  id="masterPhone"
  placeholder="Телефон"
  inputmode="tel"
>

</div>

<button
  class="masterSave"
  onclick="saveMaster()"
>
  Зберегти
</button>

</div>

</div>

<script>
  const defaultCatalog = [

{
  id:"w-rough-node",
  name:"Монтаж запірно-регулюючого вузла",
  estimateName:"Монтаж запірно-регулюючого вузла",
  type:"work",
  stage:"rough",
  price:7000,
  unit:"шт"
},

{
  id:"w-rough-tech",
  name:"Оздоблення технічної зони",
  estimateName:"Оздоблення технічної зони",
  type:"work",
  stage:"rough",
  price:10000,
  unit:"шт"
},

{
  id:"w-rough-riser",
  name:"Заміна каналізаційного стояка",
  estimateName:"Заміна каналізаційного стояка",
  type:"work",
  stage:"rough",
  price:5000,
  unit:"шт"
},

{
  id:"w-finish-boiler",
  name:"Бойлер",
  estimateName:"Монтаж бойлера",
  type:"work",
  stage:"finish",
  price:7000,
  unit:"шт"
},

{
  id:"w-finish-water",
  name:"Водоочистка",
  estimateName:"Монтаж водоочистки",
  type:"work",
  stage:"finish",
  price:10000,
  unit:"шт"
},

{

){

  const basePriceEUR =

      item.basePriceEUR

  if(

      basePriceEUR
    ) ||
    basePriceEUR < 0 ||
    !Number.isFinite(

    eurRate <= 0
  ){

  return (

    eurRate
  );

function normalizeText(
  value
){

  return String(
    value || ""
  )
    .trim()
    .toLowerCase()
    .replace(
      /\s+/g,
      " "
    );
}

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

function money(
  value
){

  return new Intl.NumberFormat(
    "uk-UA"
  )
    .format(
      Math.round(value)
    ) +
    " грн";
}

  function renderEstimate(){

  const list =
    document.getElementById(
      "list"
    );

  const clearButton =
    document.getElementById(
      "clearEstimate"
    );

  if(
    !estimate.length
  ){

    list.innerHTML = `
      <div class="empty">
        Кошторис порожній.<br>
        Додайте роботу або матеріал.
      </div>
    `;

    clearButton.style.display =
      "none";

  }else{

    let html = "";

    const rough =
      estimate.filter(
        item =>
          item.type === "work" &&
          item.stage === "rough"
      );

    const finish =
      estimate.filter(
        item =>
          item.type === "work" &&
          item.stage === "finish"
      );

    const materials =
      estimate.filter(
        item =>
          item.type === "material"
      );

    if(
      rough.length
    ){

      html += section(
        "ЧОРНОВИЙ МОНТАЖ",
        rough
      );
    }

    if(
      finish.length
    ){

      html += section(
        "ЧИСТОВИЙ МОНТАЖ",
        finish
      );
    }

    if(
      materials.length
    ){

      html += section(
        "МАТЕРІАЛИ",
        materials
      );
    }

    list.innerHTML =
      html;

    clearButton.style.display =
      "block";
  }

  const total =
    estimate.reduce(
      (
        sum,
        item
      ) =>
        sum +
        item.price *
        item.qty,
      0
    );

  document.getElementById(
    "grand"
  ).textContent =
    money(total);

  document.getElementById(
    "count"
  ).textContent =
    estimate.length +
    " позицій";
}

function section(
  title,
  items
){

  return `
    <div class="section">

      <div class="sectionTitle">
        ${title}
      </div>

      ${
        items
          .map(
            renderRow
          )
          .join("")
      }

    </div>
  `;
}

function renderRow(
  item
){

  const index =
    estimate.indexOf(
      item
    );

  return `
    <div class="row">

      <div>

        <div class="name">
          ${escapeHtml(item.name)}
        </div>

        <div class="controls">

          <div class="qty">

            <button
              onclick="changeQty(${index},-1)"
            >
              −
            </button>

            <b>
              ${item.qty}
            </b>

            <button
              onclick="changeQty(${index},1)"
            >
              +
            </button>

          </div>

          <button
            class="price"
            onclick="editPrice(${index})"
          >
            ${money(item.price)}
            /
            ${escapeHtml(item.unit)}
            <span class="priceEditIcon">✎</span>
          </button>

        </div>

      </div>

      <div class="right">

        <div class="lineTotal">
          ${
            money(
              item.price *
              item.qty
            )
          }
        </div>

        <button
          class="delete"
          onclick="removeItem(${index})"
        >
          ×
        </button>

      </div>

    </div>
  `;
}

function changeQty(
  index,
  delta
){

  estimate[index].qty =
    Math.max(
      1,
      estimate[index].qty +
      delta
    );

  save();
  renderEstimate();
}

function removeItem(
  index
){

  estimate.splice(
    index,
    1
  );

  save();
  renderEstimate();
}

function editPrice(
  index
){

  const value =
    prompt(
      "Ціна за одиницю, грн:",
      estimate[index].price
    );

  if(
    value === null
  ){
    return;
  }

  const price =
    Number(
      String(value)
        .replace(
          ",",
          "."
        )
    );

  if(
    Number.isFinite(
      price
    ) &&
    price >= 0
  ){

    estimate[index].price =
      price;

    save();
    renderEstimate();
  }
}

function clearEstimate(){

  if(
    !estimate.length
  ){
    return;
  }

  if(
    !confirm(
      "Очистити весь кошторис?"
    )
  ){
    return;
  }

  estimate = [];

  save();
  renderEstimate();
}

function getMaterialItemsForClassification(){

  return catalog.filter(
    item => {

      if(
        item.type !==
        "material"
      ){
        return false;
      }

      if(
        catalogFilter !== "all" &&
        item.category !==
        catalogFilter
      ){
        return false;
      }

      return true;
    }
  );
}

function getBrands(){

  const values =
    new Map();

  getMaterialItemsForClassification()
    .forEach(
      item => {

        const value =
          String(
            item.manufacturer ||
            ""
          ).trim();

        if(
          value
        ){

          values.set(
            normalizeText(
              value
            ),
            value
          );
        }
      }
    );

  return Array.from(
    values.values()
  ).sort(
    (
      a,
      b
    ) =>
      a.localeCompare(
        b,
        "uk"
      )
  );
}

function renderBrandFilters(){

  const box =
    document.getElementById(
      "brandFilters"
    );

  if(
    catalogMode !==
    "material"
  ){

    box.style.display =
      "none";

    box.innerHTML =
      "";

    return;
  }

  const brands =
    getBrands();

  if(
    !brands.length
  ){

    box.style.display =
      "none";

    box.innerHTML =
      "";

    catalogBrandFilter =
      "all";

    return;
  }

  if(
    catalogBrandFilter !==
      "all" &&
    !brands.some(
      brand =>
        normalizeText(
          brand
        ) ===
        normalizeText(
          catalogBrandFilter
        )
    )
  ){

    catalogBrandFilter =
      "all";
  }

  box.style.display =
    "flex";

  box.innerHTML = `

    <button
      class="subFilter ${
        catalogBrandFilter ===
        "all"
          ? "active"
          : ""
      }"
      onclick="setBrandFilter('all')"
    >
      Усі бренди
    </button>

    ${
      brands.map(
        brand => {

          const encoded =
            encodeURIComponent(

            );

          return `
            <button
              class="subFilter ${
                normalizeText(
                  catalogBrandFilter
                ) ===
                normalizeText(

                )
                  ? "active"
                  : ""
              }"

              ${escapeHtml(brand)}
            </button>
          `;
        }
      ).join("")
    }

}

function renderCatalog(){

  const query =
    normalizeText(
      document.getElementById(
        "search"
      ).value
    );

  const items =
    catalog.filter(
      item => {

        if(
          item.type !==
          catalogMode
        ){
          return false;
        }

        if(
          query
        ){

          const searchable = [
            item.name,
            item.estimateName,
            item.article,
            item.manufacturer,
            item.system
          ]
          .map(
            normalizeText
          )
          .join(" ");

          if(
            !searchable.includes(
              query
            )
          ){
            return false;
          }
        }

        if(
          catalogFilter !==
          "all"
        ){

          if(
            item.stage !==
              catalogFilter &&
            item.category !==
              catalogFilter
          ){
            return false;
          }
        }

        if(
          catalogMode ===
            "material" &&
          catalogBrandFilter !==
            "all"
        ){

          if(
            normalizeText(
              item.manufacturer
            ) !==
            normalizeText(
              catalogBrandFilter
            )
          ){
            return false;
          }
        }

        if(
          catalogMode ===
            "material" &&
          catalogSystemFilter !==
            "all"
        ){

          if(
            normalizeText(
              item.system
            ) !==
            normalizeText(
              catalogSystemFilter
            )
          ){
            return false;
          }
        }

        return true;
      }
    );

  const box =
    document.getElementById(
      "catalog"
    );

  box.classList.toggle(
    "manageMode",
    catalogManageMode
  );

  if(
    !items.length
  ){

    box.innerHTML = `

      <div class="noResults">

      ${
        catalogManageMode
          ? `

                  >
                    Очистити матеріали
                  </button>
                `
                : ""

          `
          : ""
      }

    `;

    return;
  }

  box.innerHTML =
    items
      .map(
        renderCatalogItem
      )
      .join("");

  if(
    catalogManageMode
  ){

    box.innerHTML += `

      <button
        class="catalogAdd"

      }

  }
}

function renderCatalogItem(
  item
){

  const catalogPrice =
    item.type ===
      "material"
      ? getMaterialCatalogPrice(
          item
        )
      : (
          Number(
            item.price
          ) || 0
        );

  const existing =
    estimate.find(
      estimateItem =>
        estimateItem.id ===
        item.id
    );

  const qty =
    existing
      ? existing.qty
      : 0;

  const meta = [];

  if(
    item.type ===
    "material"
  ){

    if(
      item.manufacturer
    ){
      meta.push(
        item.manufacturer
      );
    }

    if(
      item.system
    ){
      meta.push(
        item.system
      );
    }

    if(
      item.article
    ){
      meta.push(
        item.article
      );
    }
  }

  const encodedId =
    encodeURIComponent(
      item.id
    );

  const cardAction =
    catalogManageMode
      ? ""
      : `onclick="addItem(decodeURIComponent('${encodedId}'))"`;

  return `

    <div
      class="catalogItem ${
        qty > 0
          ? "added"
          : ""
      }"
    >

      <div
        style="flex:1;min-width:0"
        ${cardAction}
      >

        <div class="catalogName">
          ${escapeHtml(item.name)}
        </div>

        <div class="catalogMeta">

          ${
            catalogPrice
              ? money(
                  catalogPrice
                )
              : "ціна не задана"
          }

          ·
          ${escapeHtml(item.unit)}

          ${
            meta.length
              ? " · " +
                escapeHtml(
                  meta.join(
                    " · "
                  )
                )
              : ""
          }

        </div>

      </div>

      ${
        catalogManageMode

          ? `

            <div class="catalogManage">

              <button
                class="manageEdit"
                onclick="openCatalogEditor(decodeURIComponent('${encodedId}'))"
              >
                ✎
              </button>

              <button
                class="manageDelete"
                onclick="deleteCatalogItem(decodeURIComponent('${encodedId}'))"
              >
                ×
              </button>

            </div>

          `

          : qty > 0

          ? `

            <div class="catalogControls">

              <button
                class="catalogQtyButton"
                onclick="catalogChangeQty(decodeURIComponent('${encodedId}'),-1)"
              >
                −
              </button>

              <div class="catalogQty">
                ×${qty}
              </div>

              <button
                class="catalogQtyButton"
                onclick="catalogChangeQty(decodeURIComponent('${encodedId}'),1)"
              >
                +
              </button>

            </div>

          `

          : `

            <span class="addIcon">
              ＋
            </span>

          `
      }

    </div>

  `;
}

function addItem(
  id
){

  const product =
    catalog.find(
      item =>
        item.id === id
    );

  if(
    !product
  ){
    return;
  }

  if(
    product.type ===
      "material" &&
    (
      !Number.isFinite(
        eurRate
      ) ||
      eurRate <= 0
    )
  ){

    alert(
      "Спочатку вкажіть курс EUR."
    );

    return;
  }

  const existing =
    estimate.find(
      item =>
        item.id === id
    );

  if(
    existing
  ){

    existing.qty++;

  }else{

    const estimateItem = {

      id:
        product.id,

      name:
        product.estimateName ||
        product.name,

      type:
        product.type,

      stage:
        product.stage,

      category:
        product.category,

      price:
        product.type ===
          "material"
          ? getMaterialCatalogPrice(
              product
            )
          : (
              Number(
                product.price
              ) || 0
            ),

      unit:
        product.unit,

      qty:1
    };

    if(
      product.type ===
      "material"
    ){

      estimateItem.manufacturer =
        product.manufacturer ||
        "";

      estimateItem.system =
        product.system ||
        "";

      estimateItem.article =
        product.article ||
        "";
    }

    estimate.push(
      estimateItem
    );
  }

  save();

  renderEstimate();
  renderCatalog();
}

function catalogChangeQty(
  id,
  delta
){

  const index =
    estimate.findIndex(
      item =>
        item.id === id
    );

  if(
    index === -1
  ){

    if(
      delta > 0
    ){
      addItem(
        id
      );
    }

    return;
  }

  estimate[index].qty +=
    delta;

  if(
    estimate[index].qty <=
    0
  ){

    estimate.splice(
      index,
      1
    );
  }

  save();

  renderEstimate();
  renderCatalog();
}

/* =========================
   MANAGE CATALOG
========================= */

function toggleCatalogManage(){

  catalogManageMode =
    !catalogManageMode;

  const button =
    document.getElementById(
      "catalogEditButton"
    );

  if(
    catalogManageMode
  ){

    button.classList.add(
      "active"
    );

    button.textContent =
      "✓ Готово";

  }else{

    button.classList.remove(
      "active"
    );

    button.textContent =
      "✎ Каталог";
  }

  renderCatalog();
}

function clearMaterialCatalog(){

  const materialCount =
    catalog.filter(
      item =>
        item.type ===
        "material"
    ).length;

  if(
    !materialCount
  ){

    alert(
      "Каталог матеріалів уже порожній."
    );

    return;
  }

  if(
    !confirm(
      `Видалити всі матеріали з каталогу?\n\nБуде видалено: ${materialCount} позицій.\n\nКошторис, роботи, курс EUR і правила імпорту залишаться без змін.`
    )
  ){
    return;
  }

  catalog =
    catalog.filter(
      item =>
        item.type !==
        "material"
    );

  catalogBrandFilter =
    "all";

  catalogSystemFilter =
    "all";

  catalogFilter =
    "all";

  saveCatalog();

  renderFilters();
  renderBrandFilters();
  renderSystemFilters();
  renderCatalog();

  alert(
    "Каталог матеріалів очищено."
  );
}
  function updateEditorGroup(){

  const type =
    document.getElementById(
      "editorType"
    ).value;

  const select =
    document.getElementById(
      "editorGroup"
    );

  const label =
    document.getElementById(
      "editorGroupLabel"
    );

  if(
    type === "work"
  ){

    label.textContent =
      "Етап";

    select.innerHTML = `

      <option value="rough">
        Чорновий монтаж
      </option>

      <option value="finish">
        Чистовий монтаж
      </option>

    `;

  }else{

    label.textContent =
      "Категорія";

    select.innerHTML = `

      <option value="water">
        Водопостачання
      </option>

      <option value="sewer">
        Каналізація
      </option>

      <option value="fittings">
        Арматура
      </option>

      <option value="other">
        Інше
      </option>

    `;
  }
}

function updateMaterialFields(){

  const type =
    document.getElementById(
      "editorType"
    ).value;

  document.getElementById(
    "materialFields"
  ).style.display =
    type === "material"
      ? "block"
      : "none";

  document.getElementById(
    "editorPriceLabel"
  ).textContent =
    type === "material"
      ? "Базова ціна, EUR"
      : "Ціна";
}

document.getElementById(
  "editorType"
).addEventListener(
  "change",
  () => {

    updateEditorGroup();
    updateMaterialFields();
  }
);

function openCatalogEditor(
  id = null
){

  editingCatalogId =
    id;

  const item =
    id
      ? catalog.find(
          x =>
            x.id === id
        )
      : null;

  document.getElementById(
    "editorTitle"
  ).textContent =
    item
      ? "Редагувати позицію"
      : "Нова позиція";

  document.getElementById(
    "editorName"
  ).value =
    item
      ? item.name
      : "";

  document.getElementById(
    "editorEstimateName"
  ).value =
    item
      ? (
          item.estimateName ||
          item.name
        )
      : "";

  const editorType =
    item
      ? item.type
      : catalogMode;

  document.getElementById(
    "editorType"
  ).value =
    editorType;

  document.getElementById(
    "editorPrice"
  ).value =
    item
      ? (
          item.type ===
          "material"
            ? (
                Number(
                  item.basePriceEUR
                ) || 0
              )
            : (
                Number(
                  item.price
                ) || 0
              )
        )
      : 0;

  document.getElementById(
    "editorUnit"
  ).value =
    item
      ? item.unit
      : "шт";

  document.getElementById(
    "editorManufacturer"
  ).value =
    item
      ? (
          item.manufacturer ||
          ""
        )
      : "";

  document.getElementById(
    "editorSystem"
  ).value =
    item
      ? (
          item.system ||
          ""
        )
      : "";

  document.getElementById(
    "editorArticle"
  ).value =
    item
      ? (
          item.article ||
          ""
        )
      : "";

  const lockMaterialIdentity =
    !!(
      item &&
      item.type ===
      "material"
    );

  document.getElementById(
    "editorName"
  ).readOnly =
    lockMaterialIdentity;

  document.getElementById(
    "editorArticle"
  ).readOnly =
    lockMaterialIdentity;

  updateEditorGroup();
  updateMaterialFields();

  if(
    item
  ){

    document.getElementById(
      "editorGroup"
    ).value =
      item.type ===
        "work"
        ? (
            item.stage ||
            "rough"
          )
        : (
            item.category ||
            "other"
          );

  }else{

    if(
      catalogMode ===
        "material" &&
      [
        "water",
        "sewer",
        "fittings",
        "other"
      ].includes(
        catalogFilter
      )
    ){

      document.getElementById(
        "editorGroup"
      ).value =
        catalogFilter;
    }
  }

  document.getElementById(
    "editorSheet"
  ).classList.add(
    "open"
  );
}

function closeCatalogEditor(){

  document.getElementById(
    "editorSheet"
  ).classList.remove(
    "open"
  );

  editingCatalogId =
    null;
}

function saveCatalogItem(){

  const name =
    document.getElementById(
      "editorName"
    ).value.trim();

  const estimateName =
    document.getElementById(
      "editorEstimateName"
    ).value.trim();

  const price =
    Number(
      document.getElementById(
        "editorPrice"
      ).value
    );

  const unit =
    document.getElementById(
      "editorUnit"
    ).value.trim();

  const type =
    document.getElementById(
      "editorType"
    ).value;

  const group =
    document.getElementById(
      "editorGroup"
    ).value;

  const manufacturer =
    document.getElementById(
      "editorManufacturer"
    ).value.trim();

  const system =
    document.getElementById(
      "editorSystem"
    ).value.trim();

  const article =
    document.getElementById(
      "editorArticle"
    ).value.trim();

  if(
    !name
  ){

    alert(
      "Вкажіть назву."
    );

    return;
  }

  if(
    !estimateName
  ){

    alert(
      "Вкажіть назву для кошторису."
    );

    return;
  }

  if(
    !Number.isFinite(
      price
    ) ||
    price < 0
  ){

    alert(
      type === "material"
        ? "Вкажіть коректну базову ціну в EUR."
        : "Вкажіть коректну ціну."
    );

    return;
  }

  if(
    !unit
  ){

    alert(
      "Вкажіть одиницю."
    );

    return;
  }

  if(
    editingCatalogId
  ){

    const item =
      catalog.find(
        x =>
          x.id ===
          editingCatalogId
      );

    if(
      !item
    ){
      return;
    }

    const wasMaterial =
      item.type ===
      "material";

    if(
      !wasMaterial
    ){

      item.name =
        name;
    }

    item.estimateName =
      estimateName;

    item.unit =
      unit;

    item.type =
      type;

    if(
      type === "work"
    ){

      item.price =
        price;

      item.stage =
        group;

      delete item.category;
      delete item.manufacturer;
      delete item.system;
      delete item.article;

    }else{

      item.basePriceEUR =
        price;

      delete item.price;

      item.category =
        group;

      delete item.stage;

      item.manufacturer =
        manufacturer;

      item.system =
        system;

      if(
        !wasMaterial
      ){

        item.article =
          article;
      }
    }

  }else{

    const item = {

      id:
        "custom-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2,8),

      name:
        name,

      estimateName:
        estimateName,

      unit:
        unit,

      type:
        type
    };

    if(
      type === "work"
    ){

      item.price =
        price;

      item.stage =
        group;

    }else{

      item.basePriceEUR =
        price;

      item.category =
        group;

      item.manufacturer =
        manufacturer;

      item.system =
        system;

      item.article =
        article;
    }

    catalog.push(
      item
    );
  }

  saveCatalog();

  closeCatalogEditor();

  renderFilters();
  renderBrandFilters();
  renderSystemFilters();
  renderCatalog();
}
  function deleteCatalogItem(
  id
){

  const item =
    catalog.find(
      x =>
        x.id === id
    );

  if(
    !item
  ){
    return;
  }

  if(
    !confirm(
      `Видалити «${item.name}»?`
    )
  ){
    return;
  }

  catalog =
    catalog.filter(
      x =>
        x.id !== id
    );

  saveCatalog();

  renderBrandFilters();
  renderSystemFilters();
  renderCatalog();
}

  ).classList.remove(

  );
}

      "masterName"
    ).value
  );

  localStorage.setItem(
    "plumber_masterPhone",
    document.getElementById(
      "masterPhone"
    ).value
  );

  closeMaster();
}
