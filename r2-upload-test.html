<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SA-MASTER — R2 Upload Test</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "Segoe UI",sans-serif;
  background:#f2f2f7;
  color:#111;
  padding:24px 16px;
}
.card{
  width:100%;
  max-width:520px;
  margin:40px auto;
  padding:24px;
  border-radius:24px;
  background:rgba(255,255,255,.82);
  box-shadow:0 12px 40px rgba(0,0,0,.10);
}
h1{
  margin:0 0 8px;
  font-size:24px;
}
p{
  color:#666;
  line-height:1.45;
}
label{
  display:block;
  margin:18px 0 8px;
  font-weight:600;
}
input{
  width:100%;
  padding:14px;
  border:1px solid #d1d1d6;
  border-radius:14px;
  background:#fff;
  font-size:16px;
}
button{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:16px;
  background:#007aff;
  color:#fff;
  font-size:17px;
  font-weight:600;
}
button:disabled{
  opacity:.5;
}
#result{
  margin-top:20px;
  padding:14px;
  border-radius:14px;
  background:#f2f2f7;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:14px;
}
</style>
</head>
<body>
<div class="card">
  <h1>SA-MASTER R2 Test</h1>
  <p>
    Тестове завантаження файлу для об'єкта
    <strong>SM-2026-002</strong>.
  </p>
  <label for="file">Файл</label>
  <input
    id="file"
    type="file"
  >
  <label for="folder">Папка</label>
  <input
    id="folder"
    value="documents"
  >
  <button
    id="uploadBtn"
    type="button"
  >
    Завантажити файл
  </button>
  <div id="result">
    Очікується файл...
  </div>
</div>
<script>
const API =
  'https://sa-master-worker.c6hht469s9.workers.dev';
const OBJECT_CODE =
  'SM-2026-002';
const fileInput =
  document.getElementById('file');
const folderInput =
  document.getElementById('folder');
const uploadBtn =
  document.getElementById('uploadBtn');
const result =
  document.getElementById('result');
uploadBtn.addEventListener(
  'click',
  async () => {
    const file =
      fileInput.files[0];
    if (!file) {
      result.textContent =
        'Спочатку вибери файл.';
      return;
    }
    uploadBtn.disabled = true;
    uploadBtn.textContent =
      'Завантаження...';
    result.textContent =
      'Відправляю файл у Worker...';
    try {
      const formData =
        new FormData();
      formData.append(
        'file',
        file
      );
      formData.append(
        'folder',
        folderInput.value.trim() ||
        'documents'
      );
      formData.append(
        'uploaded_by',
        'system'
      );
      const response =
        await fetch(
          `${API}/object/${encodeURIComponent(OBJECT_CODE)}/file`,
          {
            method:'POST',
            body:formData
          }
        );
      const data =
        await response.json();
      if (!response.ok || !data.ok) {
        throw new Error(
          data.error ||
          `HTTP ${response.status}`
        );
      }
      result.textContent =
        '✓ Файл успішно завантажено\n\n' +
        JSON.stringify(
          data,
          null,
          2
        );
    } catch(error) {
      result.textContent =
        '✕ ПОМИЛКА\n\n' +
        error.message;
    } finally {
      uploadBtn.disabled = false;
      uploadBtn.textContent =
        'Завантажити файл';
    }
  }
);
</script>
</body>
</html>
