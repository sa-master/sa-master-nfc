<script>
"use strict";
function escapeHtml(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

const store={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ===== Логіка звіту (перенесена з калькулятора без змін) ===== */
const ACT_SYSTEMS = [
  { key:"water", label:"Водопостачання (ХВП/ГВП)", pressure:4.5, minutes:30, work:3, k:1.5, need:30 },

const ACT_MAX_PHOTOS = 4;
const ACT_ALLOW = 0.2; /* падіння не більше 0,2 бар — герметично */
let actDraft = null;

function todayIso(){ const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
/* Дата початку потрібна клієнту, лише поки роботи ще не почались: дата не минула й об’єкт не в роботі */
function actSysDone(x){ return Boolean(x && x.on && (actPair(x).a || x.manual)); }
function actSysDate(x, a){
  const ph = actPair(x).a;
  if(ph && ph.at){ const d = new Date(ph.at); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

function actShortName(x){ return x.key === "water" ? "водопостачання" : x.key === "heat" ? "опалення" : String(x.label || "").toLowerCase(); }
function actNum(v){ const n = parseFloat(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? Math.round(n * 100) / 100 : null; }

/* Критерії беруться з окремого файлу правил (shared/hydrorules.js), лише за ДБН. Числового допуску немає — його не вигадуємо */
function actRule(x){ return HydroRules.ruleFor(x.key, x.medium === "air" ? "air" : "hydro"); }
function actAllow(x){ const r = actRule(x); return r ? r.maxDrop : null; }

function actSysOk(x){ const d = actDrop(x); return d === null ? null : d <= ACT_ALLOW + 1e-9; }

function actDropText(x){

}
function actDateLabel(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return "";

  return `${d}.${m}.${y}`;
}

/* Час зйомки з фото (EXIF DateTimeOriginal) — щоб тривалість між «до» і «після» рахувалась сама */
function actExifTime(buf){
  try{
    const v = new DataView(buf);
    if(v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while(o + 4 < v.byteLength){
      const m = v.getUint16(o), len = v.getUint16(o + 2);
      if(m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966){
        const t = o + 10, le = v.getUint16(t) === 0x4949;
        const u16 = x => v.getUint16(x, le), u32 = x => v.getUint32(x, le);
        const readStr = (off, n) => { let r = ""; for(let i = 0; i < n - 1; i++) r += String.fromCharCode(v.getUint8(off + i)); return r; };
        const scan = ifd => {
          const out = {}; const n = u16(t + ifd);
          for(let i = 0; i < n; i++){
            const e = t + ifd + 2 + i * 12, tag = u16(e), cnt = u32(e + 4);
            if(tag === 0x8769) out.exif = u32(e + 8);
            if(tag === 0x9003 || tag === 0x0132) out[tag] = readStr(t + u32(e + 8), cnt);
          }
          return out;
        };
        const ifd0 = scan(u32(t + 4));
        const ex = ifd0.exif ? scan(ifd0.exif) : {};
        const str = ex[0x9003] || ifd0[0x0132];
        const mm = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(str || "");
        if(!mm) return null;
        const d = new Date(+mm[1], +mm[2] - 1, +mm[3], +mm[4], +mm[5], +mm[6]);
        return isNaN(d) ? null : d.toISOString();
      }
      if((m & 0xFF00) !== 0xFF00) break;
      o += 2 + len;
    }
  }catch(e){}
  return null;
}
function actDur(min){
  const m = Math.round(Number(min) || 0);
  if(m < 60) return `${m} хв`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h} год ${r} хв` : `${h} год`;
}
function actPair(x){ const ph = x && x.ph || {}; return { b: ph.before || null, a: ph.after || null }; }
function actGapMin(x){ const { b, a } = actPair(x); return b && a && b.at && a.at ? (new Date(a.at) - new Date(b.at)) / 60000 : null; }
function actPhLabel(x, which){
  const { b, a } = actPair(x), ph = which === "after" ? a : b;
  if(!ph) return which === "after" ? "після" : "до";
  if(!ph.at) return which === "after" ? "після" : "до";
  const d = new Date(ph.at), other = which === "after" ? b : a;
  const sameDay = !other || !other.at || new Date(other.at).toDateString() === d.toDateString();
  const hm = d.toLocaleTimeString("uk-UA", { hour:"2-digit", minute:"2-digit" });
  const dm = `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}`;
  return `${which === "after" ? "після" : "до"} · ${sameDay ? hm : dm + " " + hm}`;
}
function actGapWarn(x){
  const g = actGapMin(x);
  if(g === null) return "";
  if(g < 0) return "Фото «після» зроблено раніше, ніж «до» — перевірте, чи не переплутали";
  const need = x.medium === "air" ? 5 : (x.need || 30);
  if(g < need) return `Між фото лише ${actDur(g)} — менше ${need} хв, які вимагає ДБН`;
  if(g > 3 * 24 * 60) return `Між фото ${Math.round(g / 1440)} дн. — перевірте, чи правильні фото`;
  return "";
}
const ACT_GAUGE_SVG = '<svg viewBox="0 0 64 64" width="44" height="44" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="3.5"/><circle cx="32" cy="32" r="21" fill="none" stroke="currentColor" stroke-width="1" opacity=".35"/><g stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M14.5 45.5l3-2.6M11 32h4M14.5 18.5l3 2.6M32 9v4M49.5 18.5l-3 2.6M53 32h-4M49.5 45.5l-3-2.6"/></g><path d="M32 32L44 20" stroke="#ff453a" stroke-width="3.5" stroke-linecap="round"/><circle cx="32" cy="32" r="4" fill="currentColor"/><path d="M26 50h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".6"/></svg>';
function actReadForm(){
  if(!actDraft) return;
  const v = id => { const el = document.getElementById(id); return el ? el.value : ""; };
  actDraft.date = actDraft.date || todayIso();
  actDraft.note = cleanText(v("actNote"));
  actDraft.systems.forEach((x, i) => {
    const on = document.getElementById("actOn" + i);

    const prev = actNum(x.pressure);
    ["pressure", "minutes", "end"].forEach(f => { if(document.getElementById(`act_${f}_${i}`)) x[f] = actNum(v(`act_${f}_${i}`)); });
    /* тиск у кінці «йде» за тиском на початку, поки майстер його окремо не змінював */
    if(actNum(x.pressure) !== prev) x.pManual = true;
    if(actNum(x.end) === prev && actNum(x.pressure) !== prev) x.end = x.pressure;
    x.start = x.pressure;
    const lk = document.getElementById(`act_leak_${i}`); if(lk) x.leak = lk.value || null;

    document.querySelectorAll(`.actCk[data-i="${i}"]`).forEach(c => {
      const k = c.dataset.k;
      if(k === "glued") x.glued = c.checked; else if(k === "confirm") x.confirm = c.checked; else if(k === "air1") x.air1 = c.checked; else x.cond[k] = c.checked;
    });

    if(document.getElementById(`act_k_${i}`)) x.k = Number(v(`act_k_${i}`)) || 1.5;
    const dt = document.getElementById(`act_date_${i}`); if(dt && dt.value) x.date = dt.value;

/* Підказка пробного тиску: робочий тиск × коефіцієнт. Коефіцієнт залежить від виробника труб і проєкту — вибирає майстер */
const ACT_KS = [1.1, 1.3, 1.5];
function actSuggest(x){ const w = actNum(x && x.work), k = (x && x.k) || 1.5; return w === null || w <= 0 ? null : Math.round(w * k * 2) / 2; }
function actSetMedium(m){
  actReadForm();
  if(!actDraft) return;
  const med = m === "air" ? "air" : "water";
  actDraft.systems.forEach(x => {
    x.medium = med;
    if(actSysDone(x)) return;
    if(med === "air"){ x.pressure = 1; x.minutes = 5; }
    else { x.pressure = actSuggest(x) || (x.key === "heat" ? 4 : 4.5); x.minutes = x.need || 30; }
    x.start = x.pressure; x.end = x.pressure; x.pManual = false;
  });
  renderActSheet();
}
/* Колір тиску: до 6,5 бар звичайний, далі від жовтого до червоного, з 10 бар червоний */
function actPColor(p){ p = actNum(p); if(p === null || p <= 6.5) return ""; const t = Math.min(1, (p - 6.5) / 3.5); return `hsl(${Math.round(42 - 42 * t)} 90% 45%)`; }
function actInfoBtn(p){ const c = actPColor(p); return `<button type="button" class="actInfo" ${c ? `style="color:${c};border-color:${c}"` : ""} onclick="event.preventDefault();actToggleInfo(this)" aria-label="Підказка">і</button>`; }
function actToggleInfo(b){ const n = b.closest(".actSys").querySelector(".actInfoTxt"); if(n) n.hidden = !n.hidden; }
const ACT_INFO_TXT = "Перед випробуванням переконайтеся, що обладнання в мережі розраховане на цей пробний тиск.";
function actWorkHtml(x, i){
  const sug = actSuggest(x), k = x.k || 1.5, w = actNum(x.work);
  if(x.medium === "air") return `<div class="actWork"><details class="actHelp"><summary>Підказки</summary><p>Повітрям. Етап 1: накачати до 1,5 бар і оглянути систему на дефекти; якщо знайшли, знизити тиск до атмосферного й усунути. Етап 2 (контрольний): 1,0 бар, 5 хв, падіння не більше 0,1 бар. Тиск 1,5 бар це не контрольна витримка.</p></details></div>`;
  return `<div class="actWork">
    <label><small>Робочий тиск, бар</small><input id="act_work_${i}" inputmode="decimal" placeholder="напр. 6" value="${w === null ? "" : String(w).replace(".", ",")}" onfocus="this.select()" onchange="actReadForm();actAutoP(${i});renderActSheet()"></label>
    <label><small>Коефіцієнт</small><select id="act_k_${i}" onchange="actReadForm();actAutoP(${i});renderActSheet()">${ACT_KS.map(c => `<option value="${c}" ${c === k ? "selected" : ""}>× ${String(c).replace(".", ",")}</option>`).join("")}</select></label>
    ${sug === null ? "" : `<div class="actSug">Пропонований пробний тиск: <b ${actPColor(sug) ? `style="color:${actPColor(sug)}"` : ""}>${String(sug).replace(".", ",")} бар</b> ${actInfoBtn(sug)}</div>`}
    <details class="actHelp"><summary>Підказки</summary><p>Коефіцієнт залежить від виробника труб і проєкту: уточніть його в інструкції. Якщо температура води й повітря в приміщенні відрізняється більше ніж на 10 °C, після набору тиску зачекайте близько 30 хв, щоб вона вирівнялась. Залишки повітря в системі можуть дати просідання кінцевого тиску: перед випробуванням ретельно видаліть повітря.</p></details>
  </div>`;
}
/* Початковий тиск сам береться з пропозиції, поки майстер не виправив його вручну */
function actAutoP(i){
  const x = actDraft && actDraft.systems[i], sug = actSuggest(x); if(!x || sug === null || x.pManual) return;
  const prev = actNum(x.pressure);
  x.pressure = sug; x.start = sug;
  if(actNum(x.end) === prev) x.end = sug;
}
function actApplySug(i){
  actReadForm();

/* Перевірка за ДБН: огляд, умови випробування, підтвердження виконавця, результат і його причини */
function actCheckHtml(x, i, ev, done){

  </details>`;
}
/* Випробування одного обʼєкта: вкладки «Водопостачання» / «Опалення», у PDF — разом або окремо */
function actHasData(x){ return Boolean(x && (actPair(x).b || actPair(x).a || x.manual)); }

function actCompress(file){

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);

    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

/* y: Float32Array N*N grayscale of ring's bounding square; returns {ok, cx, cy, r, score} in px of N */

/* Фото з камери калькулятора: лише те, що в колі (манометр); навколо — темно, внизу — підпис */
function actCircleCanvas(v, at){
  try{
    const ring = document.querySelector("#actCam .actCamRing").getBoundingClientRect();
    const vr = v.getBoundingClientRect();
    const vw = v.videoWidth, vh = v.videoHeight;
    const k = Math.max(vr.width / vw, vr.height / vh);

    g.fillStyle = "#fff"; g.font = `700 ${fs}px -apple-system, system-ui, sans-serif`;
    g.fillText(`${L.kind} · ${L.sys}`, pad, D - barH + pad * .5, D - pad * 2);
    g.fillStyle = "rgba(255,255,255,.88)"; g.font = `500 ${Math.round(fs * .82)}px -apple-system, system-ui, sans-serif`;
    g.fillText(L.obj, pad, D - barH + pad * .5 + fs * 1.35, D - pad * 2);

  }catch(e){ return null; }
}

function actViewRetake(){ const t = actViewAt; closeActView(); if(t && t.i >= 0) openActCam(t.i, t.w); }
function actEdit(i){ if(!actDraft) return; actReadForm(); actDraft.systems[i].edit = true; actDraft.systems[i].manual = true; renderActSheet(); setTimeout(() => document.getElementById("act_minutes_" + i)?.focus(), 50); }
function actPhotoDel(i, which){ if(!actDraft) return; actReadForm(); const x = actDraft.systems[i]; if(x.ph) delete x.ph[which]; renderActSheet(); }
function actOldPhotoDel(i){ if(!actDraft) return; actReadForm(); actDraft.photos.splice(i, 1); renderActSheet(); }
function actClientData(project){
  const a = project.pressureAct;
  const done = (a.systems || []).filter(actSysDone);
  const dates = done.map(x => actSysDate(x, a)).sort();
  return {
    date: dates[dates.length - 1] || a.date,
    systems: done.map(x => ({ key:x.key, ev:actEval(x), l:x.label + (x.medium === "air" ? " (повітрям)" : ""), d:actSysDate(x, a), p:actNum(x.pressure), m:actNum(x.minutes), s:actNum(x.start), e:actNum(x.end), dt:actDropText(x), ok:actSysOk(x), air:x.medium === "air", rule:actRule(x), wk:actNum(x.work), leak:x.leak,
      ph: ["before", "after"].map(w => { const ph = actPair(x)[w === "before" ? "b" : "a"]; return ph ? { src:ph.src, c:actPhLabel(x, w), w, at:ph.at || "" } : null; }).filter(Boolean) })),
    note: a.note || "",
    photos: (a.photos || []).slice(0, ACT_MAX_PHOTOS)
  };
}
/* Висновок: одна система — «Систему», кілька — «Системи»; падіння в межах допуску не називаємо «не виявлено» */
function actConclusion(list){
  const one = list.length === 1;
  const drop = list.some(x => x.s !== null && x.e !== null && x.s - x.e > 0.001);
  return `${one ? "Систему" : "Системи"} випробувано надлишковим тиском. ${drop ? "Протікань не виявлено; значення тиску на початку й у кінці наведено в таблиці." : "Падіння тиску та протікань не виявлено."}`;
}
/* ===== Новий вигляд звіту (прототип) ===== */
function actSysNoun(x){ return x.key === "heat" ? "опалення" : "водопостачання"; }
function actPaperTitle(list){
  const air = list.filter(x => x.air).length;
  return air === 0 ? "Звіт про гідравлічні випробування" : air === list.length ? "Звіт про манометричні випробування" : "Звіт про гідравлічні та манометричні випробування";
}
function actPaperSub(list){
  const n = [...new Set(list.map(actSysNoun))];
  return "Перевірка герметичності " + (n.length > 1 ? "систем " + n.join(" та ") : "системи " + n[0]) + ".";
}
const ACT_IC = {
  building:'<rect x="5" y="3" width="10" height="18"/><path d="M15 9h4v12h-4M8 7h2M8 11h2M8 15h2"/>',
  person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2"/>',
  gauge:'<path d="M4 18a8.5 8.5 0 1 1 16 0"/><path d="M12 17l4-6"/><circle cx="12" cy="17" r="1"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  tri:'<path d="M12 4l9 16H3z"/>',
  camera:'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="14" r="4"/>',
  clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM8 14l3 3 5-6"/>'
};
function actIc(n, sz){ return `<svg class="qa2Ic" width="${sz || 22}" height="${sz || 22}" viewBox="0 0 24 24" fill="none" stroke="#0b1b33" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ACT_IC[n]}</svg>`; }
function actBadge(cls, sz){
  const col = cls === "ok" ? "#1F8A4C" : cls === "bad" ? "#c62828" : "#b26a00";
  const g = cls === "ok" ? '<path d="M7 12.5l3.3 3.3L17 9"/>' : cls === "bad" ? '<path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/>' : '<path d="M12 7v6M12 16.5v.5"/>';
  return `<svg width="${sz || 28}" height="${sz || 28}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="${col}"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${g}</g></svg>`;
}
function actStat(x){
  /* Той самий критерій, що й на екрані майстра: падіння тиску порівнюється з допустимим (actSysOk) */
  if(x.ok === true) return { cls:"ok", t:"Герметично" };
  if(x.ok === false) return { cls:"bad", t:"Падіння тиску більше допустимого" };
  return { cls:"warn", t:"Недостатньо даних" };
}
function actPhTime(iso, sameDay){
  const d = new Date(iso); if(isNaN(d)) return "";
  const p2 = n => String(n).padStart(2, "0");
  return (sameDay ? "" : `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()} `) + `${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
function actConclText(list){
  const multi = list.length > 1, nm = x => multi ? x.l + ": " : "", dr = x => actFmt(Math.round((x.s - x.e) * 100) / 100) + " бар";
  const bad = list.filter(x => x.ok === false);
  if(bad.length) return { cls:"bad", t:"Випробування не пройдено. " + bad.map(x => (multi ? nm(x) + "падіння" : "Падіння") + " тиску " + dr(x) + " більше допустимого (" + actFmt(ACT_ALLOW) + " бар)").join("; ") + "." };
  const other = list.filter(x => x.ok !== true);
  if(other.length) return { cls:"warn", t:"Висновок не сформовано: не вказано тиск на початку або в кінці випробування." };
  const drops = list.filter(x => x.s !== null && x.e !== null && x.s - x.e > 0.001);
  if(!drops.length) return { cls:"ok", t:"За час випробування падіння тиску не зафіксовано." };
  return { cls:"ok", t:"За час випробування зафіксовано падіння тиску: " + drops.map(x => nm(x) + dr(x)).join("; ") + "." };
}
function actPaperHtml(project, info){
  const d = actClientData(project);
  const multi = d.systems.length > 1;
  const dates = [...new Set(d.systems.map(x => x.d))].sort();
  const dl = dates.length > 1 ? `${actDateLabel(dates[0])} – ${actDateLabel(dates[dates.length - 1])}` : actDateLabel(d.date);
  const sec = x => {
    const st = actStat(x), drop = x.s !== null && x.e !== null ? Math.round((x.s - x.e) * 100) / 100 : null;
    const day = ph => { const t = new Date(ph.at); return !isNaN(t) && `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}` === x.d; };
    return `<div class="docBlock qa2Sys">
      ${multi ? `<div class="qa2SysT">${escapeHtml(x.l)}${dates.length > 1 ? ` · ${actDateLabel(x.d)}` : ""}</div>` : ""}
      <div class="qa2H">Параметри випробування</div>
      <div class="qa2Cards">
        <div>${actIc("gauge", 30)}<span><b>${actFmt(x.s)} бар</b><small>Початковий тиск</small></span></div>
        <div>${actIc("clock", 30)}<span><b>${x.m === null ? "—" : actDur(x.m)}</b><small>Тривалість</small></span></div>
        <div>${actIc("tri", 28)}<span><b>${drop === null ? "—" : actFmt(drop) + " бар"}</b><small>Падіння тиску</small></span></div>
      </div>
      <div class="qa2Stat ${st.cls}">${actBadge(st.cls, 30)}<b>${escapeHtml(st.t)}</b></div>
      ${x.ph.length ? `<div class="qa2H qa2H2">${actIc("camera", 24)}<span>Фотофіксація показників</span></div>
      <div class="qa2Ph">${x.ph.map(ph => `<figure><div class="qa2PhI"><img src="${ph.src}" alt="Манометр"></div><figcaption><b>${ph.w === "before" ? "ДО" : "ПІСЛЯ"} · ${actFmt(ph.w === "before" ? x.s : x.e)} бар</b>${ph.at ? `<span>${actIc("clock", 15)}${escapeHtml(actPhTime(ph.at, day(ph)))}</span>` : ""}</figcaption></figure>`).join("")}</div>` : ""}
    </div>`;
  };
  const cl = actConclText(d.systems);
  return `<section class="quoteAct qa2">
    <div class="docBlock"><div class="qa2Title">${actPaperTitle(d.systems)}</div>
    <div class="qa2Sub">${escapeHtml(actPaperSub(d.systems))}</div>
    <div class="qa2Meta">
      <div class="qa2MC"><div>${actIc("building", 26)}<span><small>Об’єкт</small><b>${escapeHtml(info.objectName)}</b></span></div>
      ${info.clientName ? `<div>${actIc("person", 26)}<span><small>Замовник</small><b>${escapeHtml(info.clientName)}</b></span></div>` : ""}</div>
      <div class="qa2MC qa2MD"><div>${actIc("calendar", 26)}<span><small>Дата проведення</small><b>${dl}</b></span></div></div>
    </div></div>
    ${d.systems.map(sec).join("")}
    ${d.note ? `<div class="docBlock qaNote">${escapeHtml(d.note)}</div>` : ""}
    <div class="docBlock qa2Concl"><div class="qa2H qa2H2">${actIc("clip", 24)}<span>Висновок</span></div>
    <div class="qa2CB ${cl.cls}">${cl.cls === "ok" ? actBadge("ok", 24) : ""}<p>${escapeHtml(cl.t)}</p></div></div>
    <div class="qa2Sign"><span>Сформовано на sa-master.pro</span></div>
  </section>`;
}


/* ===== Самостійна сторінка ===== */
function actCamLabels(){
  const x = actDraft && actCamTarget ? actDraft.systems[actCamTarget.i] : null;
  const obj = cleanText(document.getElementById("iObj").value);
  return {
    kind: actCamTarget && actCamTarget.which === "after" ? "ПІСЛЯ" : "ДО",
    sys: x ? x.label : "",
    obj: obj || "sa-master.pro"
  };
}
const $ = id => document.getElementById(id);
const newDraft = () => ({
  date: todayIso(),
  systems: ACT_SYSTEMS.map(x => ({ key:x.key, label:x.label, on:false, pressure:x.pressure, minutes:x.minutes, work:x.work, k:x.k, need:x.need, leak:null, cond:{}, glued:false, confirm:false, air1:false, compMax:null, start:x.pressure, end:x.pressure })),
  note: "", photos: []
});
actDraft = newDraft();
renderActSheet();
const INFO = ["iObj","iClient"];
const infoGet = () => INFO.map(id => $(id).value);
function isEmptyAct(){
  actReadForm();
  const touched = actDraft.systems.some(x => (x.ph && (x.ph.before || x.ph.after)) || String(x.start) !== String(x.pressure) || String(x.end) !== String(x.pressure) || x.manual || x.leak);
  return !infoGet().some(v => cleanText(v)) && !touched && !cleanText(actDraft.note);
}
let suppressSave = false;
function loadAct(d){
  suppressSave = true;
  INFO.forEach((id,i) => { $(id).value = (d.info && d.info[i]) || ""; });
  actDraft = d.act || newDraft(); renderActSheet();
  suppressSave = false;
}
const mgr = { touch(){}, currentTitle: () => "Звіт про герметичність" };

SMProfile.mount($("profileBox"));

async function buildPaper(){
  actReadForm();
  if(!actDraft.systems.some(x=>x.on)){toast("Зробіть фото або впишіть результат хоча б однієї системи");return null;}
  const bad=actDraft.systems.find(x=>x.on&&actNum(x.pressure)===null);
  if(bad){toast(bad.label+": вкажіть тиск");return null;}
  if(!actDraft.systems.some(actSysDone)){toast("Зробіть фото «після» або впишіть результат вручну");return null;}
  /* Ручний режим: тривалість менша за потрібну (вода 30 хв, опалення 120, повітря 5) — звіт не формуємо */
  const shortSys=actDraft.systems.find(x=>{ if(!actSysDone(x)) return false; const need=x.medium==="air"?5:(x.need||30), m=actNum(x.minutes); return m===null||m<need; });
  if(shortSys){ const need=shortSys.medium==="air"?5:(shortSys.need||30); toast(`${shortSys.label}: тривалість менша за ${need} хв. Випробування має тривати не менше ${need} хв`,5000); return null; }
  const prof = await SMProfile.get();
  const info={
    objectName: cleanText($("iObj").value)||"—",
    clientName: cleanText($("iClient").value),
    companyName: [prof.name, prof.phone].filter(Boolean).join(", ")||"—"
  };
  const paper=document.createElement("div"); paper.className="paper";
  paper.innerHTML=SMProfile.headerHtml(prof)+actPaperHtml({pressureAct:actDraft},info);
  return paper;
}
async function outPdf(btn, mode){
  const p = await buildPaper(); if(!p) return;
  const t0=btn.textContent; btn.disabled=true; btn.textContent="Готуємо PDF…";
  try{
    const blob = await SMDoc.pdf(p, { footer: "none", signSelector: ".qa2Sign span" }), name="Звіт про герметичність.pdf";
    if(window.SMStats) SMStats.event("zvit-pdf-hydro");
    if(mode==="share"){ const r=await SMDoc.share(blob,name,false); if(r==="downloaded") toast("Поділитися з цього браузера не вдалося. PDF завантажено."); }
    else SMDoc.download(blob,name);
  }catch(e){ toast("Не вдалося створити PDF. Перевірте звʼязок і спробуйте ще раз."); }
  finally{ btn.disabled=false; btn.textContent=t0; }
}
$("btnMake").addEventListener("click",e=>outPdf(e.currentTarget,"share"));
