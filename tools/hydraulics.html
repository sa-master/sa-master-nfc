<script>
"use strict";
const $ = id => document.getElementById(id), H = Hydraulics, { toast } = SMUI;
let lastDoc = null;
const f2 = (x, n = 2) => x.toFixed(n).replace(".", ",");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
const opts = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => `<option>${a + i}</option>`).join("");
$("U").innerHTML = opts(1, 12); $("U").value = 3;
$("mat").innerHTML = H.LIST.map(k => `<option value="${k}">${H.MAT[k].label}</option>`).join(""); $("mat").value = "pex";
const DEF = { bath: 1, shower: 1, sink: 1, basin: 1, wc: 1, washer: 1 };
$("devs").innerHTML = H.ORDER.map(id => `<div class="dv"><span>${H.DEV[id].label}</span><span class="dr"><select class="formInput" id="c_${id}">${opts(0, 6)}</select><input class="formInput" id="d_${id}" type="number" inputmode="decimal" step="0.5" placeholder="м"></span></div>`).join("");
$("devs").insertAdjacentHTML("beforeend", `<div class="dv"><span>Бойлер (електричний)</span><span class="dr"><select class="formInput" id="c_boiler"><option>0</option><option selected>1</option></select><input class="formInput" id="d_boiler" type="number" inputmode="decimal" step="0.5" placeholder="м"></span></div>`);
H.ORDER.forEach(id => $("c_" + id).value = DEF[id] || 0);
function scheme(r){
  const W = 360, top = 70, C = "#0A84FF", Hh = "#FF3B30", xc = 44, xh = 86, x0 = 112;
  const tee = r.scheme === "tee";
  const anyD = r.lines.some(l => l.len > 0);
  const ruler = !tee && anyD; /* променева з відстанями: масштабна лінійка, прилади від ближчих до дальніх */
  const known = r.lines.filter(l => l.len > 0).map(l => l.len), dmean = known.length ? known.reduce((a, b) => a + b, 0) / known.length : 0;
  const dOf = l => (l.len > 0 ? l.len : dmean);
  const L = ruler ? r.lines.slice().sort((a, b) => dOf(a) - dOf(b)) : r.lines;
  const n = L.length, ds = L.map(l => (l.len > 0 ? l.len : null)), dv = L.map(dOf);
  const rowMin = ruler ? 58 : 44;
  const ys = []; L.forEach((l, i) => { ys.push(i === 0 ? 0 : ys[i - 1] + rowMin + (tee && anyD ? Math.min(44, Math.max(0, (dv[i] - dv[i - 1])) * 7) : 0)); });
  const H = top + (n ? ys[n - 1] : 0) + rowMin + 12, span = n ? ys[n - 1] + rowMin - 2 : 0;
  const dmax = Math.max.apply(null, dv.concat([1])), step = dmax <= 6 ? 1 : dmax <= 14 ? 2 : 5, dr = Math.ceil(dmax / step) * step, kx = (W - 18 - x0) / dr;
  const xe = i => ruler ? Math.max(x0 + 60, x0 + dv[i] * kx) : 190;
  let o = `<svg class="sch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Схема розводки">`;
  o += `<defs><marker id="ac" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="${C}"/></marker><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="${Hh}"/></marker><marker id="ahl" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M8 0L0 4L8 8z" fill="${Hh}"/></marker></defs>`;
  const badge = (x, y, t, c) => `<rect x="${x - 16}" y="${y - 8}" width="32" height="16" rx="8" fill="${c}"/><text class="bd" x="${x}" y="${y + 4}" text-anchor="middle">${t}</text>`;
  const cy = i => top + ys[i] + (ruler ? 20 : 10), hy = i => cy(i) + (ruler ? 18 : 18);
  const lastCold = n - 1;
  let lastHot = -1; L.forEach((l, i) => { if(l.hot) lastHot = i; });
  o += `<line x1="${xc}" y1="8" x2="${xc}" y2="${tee ? cy(lastCold) : top - 4}" stroke="${C}" stroke-width="${tee ? 4 : 3}"/>`;
  o += `<text class="nm" x="${xc + 12}" y="22">Ввід</text>` + badge(xc + 70, 18, "Ø" + r.inDn, C) + `<text class="sm" x="${xc + 94}" y="22">кран ${r.valveIn}</text>`;
  if(tee){
    o += badge(xc, top - 20, "Ø" + r.main.first, C);
  } else {
    o += `<rect x="${xc - 4}" y="${top - 4}" width="8" height="${span}" rx="4" fill="${C}"/><text class="sm" x="${xc}" y="${top - 10}" text-anchor="middle">ХВП</text>`;
    if(lastHot >= 0) o += `<rect x="${xh - 4}" y="${top - 4}" width="8" height="${span}" rx="4" fill="${Hh}"/><text class="sm" x="${xh}" y="${top - 10}" text-anchor="middle">ГВП</text>`;
  }
  if(tee && lastHot >= 0) o += `<line x1="${xh}" y1="${top - 4}" x2="${xh}" y2="${hy(lastHot)}" stroke="${Hh}" stroke-width="3"/><text class="sm" x="${xh}" y="${top - 10}" text-anchor="middle">ГВП</text>`;
  if(ruler){
    /* лінійка: вертикальні штрихи кожні step метрів і підписи зверху */
    for(let m = 0; m <= dr; m += step){ const x = x0 + m * kx; o += `<line x1="${x}" y1="${top - 4}" x2="${x}" y2="${H - 8}" stroke="rgba(128,128,128,.28)" stroke-width="1" stroke-dasharray="3 4"/><text class="sm" x="${x}" y="${top - 14}" text-anchor="middle">${m}${m === dr ? " м" : ""}</text>`; }
  }
  L.forEach((l, i) => {
    const yc = cy(i), yh = hy(i), x2 = xe(i), mid = ruler ? x0 + 28 : (xh + x2) / 2 + 14;
    o += `<line x1="${xc}" y1="${yc}" x2="${x2}" y2="${yc}" stroke="${C}" stroke-width="2" marker-end="url(#ac)"/>` + badge(mid, yc, "Ø" + l.cold, C);
    if(l.hot){
      if(l.boiler) o += `<line x1="${x2}" y1="${yh}" x2="${xh}" y2="${yh}" stroke="${Hh}" stroke-width="2" marker-end="url(#ah)"/>`;
      else o += `<line x1="${xh}" y1="${yh}" x2="${x2}" y2="${yh}" stroke="${Hh}" stroke-width="2" marker-end="url(#ah)"/>`;
      o += badge(mid, yh, "Ø" + l.hot, Hh);
    }
    if(tee){ o += `<circle cx="${xc}" cy="${yc}" r="3.5" fill="${C}"/>`; if(l.hot) o += `<circle cx="${xh}" cy="${yh}" r="3.5" fill="${Hh}"/>`; }
    const nm = esc(l.name.replace(" (змішувач)", "")), dtxt = ds[i] ? " · " + String(ds[i]).replace(".", ",") + " м" : "";
    if(ruler) o += `<text class="nm" x="${x0 + 50}" y="${yc - 8}" style="font-size:12.5px">${nm}<tspan class="sm" style="font-weight:500"> ${dtxt.replace(" · ", "")}</tspan></text>`;
    else {
      const ly = l.hot ? (yc + yh) / 2 : yc;
      o += `<text class="nm" x="${x2 + 12}" y="${ly + (ds[i] ? 0 : 4)}" style="font-size:12.5px">${nm}</text>`;
      if(ds[i]) o += `<text class="sm" x="${x2 + 12}" y="${ly + 14}">${dtxt.replace(" · ", "")}</text>`;
    }
  });
  if(tee && n > 1){
    let prev = r.main.first;
    r.main.segs.forEach((od, k) => { if(k + 1 < n && od !== prev){ o += badge(xc, cy(k) + 22, "Ø" + od, C); } prev = od; });
    if(lastHot > 0) o += badge(xh, (hy(0) + cy(1)) / 2, "Ø" + r.main.hot, Hh);
  }
  return o + "</svg>";
}

function render(){
  const counts = {}, dist = {}; H.ORDER.forEach(id => { counts[id] = $("c_" + id).value; dist[id] = $("d_" + id).value; });
  const U = +$("U").value, mat = $("mat").value, boiler = $("c_boiler").value === "1", tee = $("scheme").value === "tee";
  const q = H.byU(285, U), qIn = boiler ? q.tot : q.cold;
  const ent = H.pick(mat, qIn, false, 0, 18); /* ввід у колектор або до першого трійника: прохід не менший, ніж у PEX Ø25 */
  const r = H.calc({ U, norm: 285, mat, scheme: tee ? "tee" : "ray", entry: { mat, od: ent[0] }, counts, boiler, dist, hotDist: $("d_boiler").value });
  if(!r.lines.length){ lastDoc = null; $("pdfCard").style.display = "none"; $("res").innerHTML = `<p class="hint">Додайте хоча б один прилад.</p>`; return; }
  $("pdfCard").style.display = "";
  const ln = r.lines.map(l => ({ name: l.name, boiler: l.boiler, cold: l.cold.od, hot: l.hot ? l.hot.od : null, len: l.len > 0 ? l.len : null }));
  const e0 = r.sections[0], segs = r.sections.slice(1);
  const sc = { scheme: r.scheme, inDn: e0.od, valveIn: '1/2"', lines: ln, main: tee ? { first: e0.od, segs: segs.map(s => s.od), hot: H.reserveSize(mat)[0] } : null };
  let h = `<div class="ttl">Схема</div>` + scheme(sc) + `<p class="hint">Синя лінія холодна вода, червона гаряча. Ø це зовнішній діаметр труби, мм.</p>`;
  /* швидкість і запас до межі п. 11.6 / 12.12 */
  const spd = s => {
    if(s.v == null) return `<td class="n">–</td>`;
    const m = 1 - s.v / s.vmax, cls = m < 0 ? "wr" : m < 0.1 ? "wy" : "okc";
    return `<td class="n"><span class="${cls}">${f2(s.v, 1)} м/с</span><br><span class="sm" style="color:var(--ts)">${m < 0 ? "вище норми" : "запас " + Math.round(m * 100) + "%"}</span></td>`;
  };
  const row = (n, s) => `<tr><td>${esc(n)}</td><td><b>Ø${s.od}</b> <span class="sm" style="color:var(--ts)">${esc(s.size)}</span></td>${spd(s)}</tr>`;
  h += `<div class="ttl" style="margin-top:14px">Діаметри</div><table class="tb"><tr><th>Ділянка</th><th>Труба</th><th class="n">Швидкість</th></tr>`;
  h += row(tee ? "Ввід до першого трійника" : "Ввід у колектор", e0);
  if(tee) {
    const groups = [];
    segs.forEach((s, i) => { const g = groups[groups.length - 1]; if(g && g.od === s.od){ g.to = i + 1; if(s.v > g.s.v) g.s = s; } else groups.push({ od: s.od, from: i + 1, to: i + 1, s }); });
    groups.forEach(g => h += row("Магістраль після " + (g.from === g.to ? g.from + "-го" : g.from + "–" + g.to + "-го") + " відгалуження", g.s));
  }
  r.lines.forEach(l => {
    const nm = l.name.replace(" (змішувач)", "");
    if(l.hot && l.hot.od === l.cold.od) h += row(nm + ": холодна і гаряча", l.cold.v != null && l.hot.v != null && l.hot.v > l.cold.v ? l.hot : l.cold);
    else { h += row(nm + (l.hot ? ": холодна" : ""), l.cold); if(l.hot) h += row(nm + ": гаряча", l.hot); }
  });
  h += `</table>`;
  const docT = h.slice(h.indexOf('<table class="tb">')).replace('class="tb"', 'class="docT"');
  if(r.lines.some(l => l.id === "bath" || l.id === "shower")) h += `<div class="warn">Ванна й душ: прийнято витрату змішувача 0,30 л/с (18 л/хв). Тропічний душ або змішувач з більшою витратою може працювати некоректно.</div>`;
  const bad = [e0].concat(segs, r.lines.flatMap(l => [l.cold, l.hot].filter(Boolean))).filter(s => s.v != null && !s.ok);
  if(bad.length) h += `<div class="warn">Швидкість води вище норми на ділянках: ${bad.map(s => esc(s.name)).join(", ")}. Збільшіть діаметр.</div>`;
  if(r.recirc){
    const rc = r.recirc;
    h += `<div class="ttl" style="margin-top:14px">Гаряча вода: чекання і циркуляція</div><table class="tb"><tr><th>Прилад</th><th class="n">Довжина, м</th><th class="n">Обʼєм, л</th><th class="n">Чекати, с</th></tr>`;
    rc.items.forEach(x => h += `<tr><td>${esc(x.name)}</td><td class="n">${f2(x.len, 1)}</td><td class="n">${x.over ? '<span class="wr">' + f2(x.vol) + '</span>' : f2(x.vol)}</td><td class="n">${x.wait == null ? "–" : f2(x.wait, 0)}</td></tr>`);
    h += `</table>` + (rc.needed
      ? `<div class="warn">До ${esc(rc.worst.name.toLowerCase())} у трубі ${f2(rc.worst.vol)} л гарячої води, що більше ${rc.limit} л. Поки не піде гаряча, зливатиметься холодна. Варіанти: зменшити діаметр або відстань, поставити циркуляційну лінію з насосом і зворотним клапаном, або електростічку (кабель, що підігріває трубу).</div>`
      : `<p class="hint">Обʼєм у всіх лініях не більше ${rc.limit} л, циркуляція не потрібна.</p>`)
      + `<p class="hint">Критерій: не більше 3 л води в гілці без циркуляції (п. 7.4 ДБН для централізованого ГВП, для бойлера в квартирі це орієнтир). Довжина це відстань від бойлера до вузла плюс від вузла до приладу, це спрощення. Час це обʼєм на витрату приладу; для ванни й душу не рахується, поки не відома їхня витрата.</p>`;
  }
  const ad = H.nodeAdvice($("pIn").value, qIn);
  if(ad) h += `<div class="ttl" style="margin-top:14px">Вузол</div><ul class="rec">${ad.lines.map(l => "<li>" + esc(l) + "</li>").join("")}</ul><p class="hint">Пороги тиску (3 і 4 бар) і запас Kvs в 1,5 раза це орієнтири, не вимоги норми. Витрата вводу ${f2(qIn * 3.6)} м³/год.</p>`;
  $("res").innerHTML = h;
  lastDoc = { svg: scheme(sc), diam: docT, recirc: r.recirc ? r.recirc : null, ad, qIn, U, scheme: tee ? "трійникова" : "променева", mat: H.MAT[mat].label, boiler, pIn: $("pIn").value };
}

/* ---------- PDF ---------- */
SMProfile.mount($("profileBox"));
async function paperEl(){
  const d = lastDoc, prof = await SMProfile.get();
  const el = document.createElement("div"); el.className = "paper";
  let rc = "";
  if(d.recirc){
    rc = `<div class="docBlock"><b>Гаряча вода: чекання і циркуляція</b><table class="docT"><tr><th>Прилад</th><th class="r">Довжина, м</th><th class="r">Обʼєм, л</th><th class="r">Чекати, с</th></tr>` +
      d.recirc.items.map(x => `<tr><td>${esc(x.name)}</td><td class="r">${f2(x.len, 1)}</td><td class="r${x.over ? " bad" : ""}">${f2(x.vol)}</td><td class="r">${x.wait == null ? "–" : f2(x.wait, 0)}</td></tr>`).join("") +
      `</table>` + (d.recirc.needed ? `<div class="docNote" style="margin:6px 0 0">До ${esc(d.recirc.worst.name.toLowerCase())} у трубі ${f2(d.recirc.worst.vol)} л гарячої води, що більше ${d.recirc.limit} л: варто передбачити циркуляцію.</div>` : `<div class="docNote" style="margin:6px 0 0">Обʼєм у всіх лініях не більше ${d.recirc.limit} л, циркуляція не потрібна.</div>`) + `</div>`;
  }
  const nd = d.ad ? `<div class="docBlock"><b>Вузол</b><ul style="margin:6px 0 0 18px;padding:0">${d.ad.lines.map(l => "<li>" + esc(l) + "</li>").join("")}</ul></div>` : "";
  el.innerHTML = SMProfile.headerHtml(prof) + `<div class="docH">Гідравлічний розрахунок водопроводу квартири</div><div class="docSub">${SMUI.dateLabel(Date.now())}</div>` +
    `<div class="docBlock docKV"><span>Мешканців</span><b>${d.U}</b><span>Система</span><b>${d.scheme}</b><span>Матеріал розводки</span><b>${esc(d.mat)}</b>${d.pIn ? `<span>Тиск після лічильника</span><b>${esc(String(d.pIn))} бар</b>` : ""}</div>` +
    `<div class="docBlock"><b>Схема</b>${d.svg}</div><div class="docBlock"><b>Діаметри</b>${d.diam}</div>` + rc + nd +
    `<div class="docNote">Орієнтовний розрахунок за ДБН В.2.5-64:2012. Ø це зовнішній діаметр труби, мм. Не замінює проєкт.</div>`;
  return el;
}
async function makePdf(btn, mode){
  if(!lastDoc) return;
  const t0 = btn.textContent; btn.disabled = true; btn.textContent = "Готуємо PDF…";
  try {
    const blob = await SMDoc.pdf(await paperEl()), name = "gidravlichnyi-rozrakhunok-" + new Date().toISOString().slice(0, 10) + ".pdf";
    if(mode === "share"){ const r = await SMDoc.share(blob, name, "Гідравлічний розрахунок"); if(r === "downloaded") toast("Поділитися з цього браузера не вдалося. PDF завантажено."); }
    else SMDoc.download(blob, name);
  } catch(e){ toast("Не вдалося створити PDF. Перевірте звʼязок і спробуйте ще раз."); }
  finally { btn.disabled = false; btn.textContent = t0; }
}
$("btnPdf").addEventListener("click", e => makePdf(e.currentTarget, "download"));
$("btnShare").addEventListener("click", e => makePdf(e.currentTarget, "share"));
document.querySelectorAll("select,input").forEach(e => { e.addEventListener("change", render); if(e.type === "number") e.addEventListener("input", render); });
render();
</script>
