<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ПРОТОТИП: редактор прихованих комунікацій</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ln:#d6dbe3;--t:#111;--tm:#667085;--p:#0a64d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font:15px/1.35 -apple-system,"Segoe UI",Arial,sans-serif;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#top{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--ln)}
#top .ttl{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 6px;border-radius:10px;background:none;border:0;text-align:left;font-size:15px}
.ib{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.ib:disabled{opacity:.35}
#stage{position:relative;flex:1;min-height:0;touch-action:none;background:#fff;user-select:none;-webkit-user-select:none}
#sv{position:absolute;inset:0;width:100%;height:100%;display:block}
#loupe{position:absolute;width:128px;height:128px;border-radius:50%;border:3px solid #1b2a49;background:#fff;overflow:hidden;pointer-events:none;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#loupe svg{width:100%;height:100%;display:block}
#draftBar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:none;gap:8px;padding:6px 8px;background:#fff8e1;border-top:1px solid var(--ln);align-items:center}
#draftBar.on{display:flex}#draftBar .n{flex:1;font-size:13px;color:#7a5b00}
.btn{height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--ln);background:#fff;font:inherit;font-weight:600}
.btn.p{background:var(--p);color:#fff;border-color:var(--p)}.btn.d{color:#d70015}
#chips{display:flex;gap:8px;overflow-x:auto;padding:6px 8px;background:var(--card);border-top:1px solid var(--ln);scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--ln);background:#fff;font:inherit;font-size:13px;font-weight:600;white-space:nowrap}
.chip i{width:11px;height:11px;border-radius:50%}.chip.on{border-color:var(--p);background:#e8f1ff}
#bar{display:flex;background:var(--card);border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#bar button{flex:1;height:54px;border:0;background:none;border-radius:12px;font:inherit;font-size:12px;font-weight:600;color:var(--tm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#bar button b{font-size:20px;line-height:1;color:var(--t)}#bar button.on{background:#e8f1ff;color:var(--p)}#bar button.on b{color:var(--p)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;box-shadow:0 -4px 14px rgba(0,0,0,.12);display:none;background:var(--card);border-top:1px solid var(--ln);padding:10px 10px 8px;max-height:44vh;overflow:auto}
#sheet.on{display:block}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row label{display:flex;flex-direction:column;font-size:11px;font-weight:700;color:var(--tm);gap:3px;flex:1;min-width:84px}
input,select{font:inherit;font-size:16px;height:42px;padding:0 10px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;color:var(--t);width:100%}
#ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ovl.on{display:flex}#box{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
#box h3{margin:0 0 10px;font-size:17px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#1b2a49;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;z-index:30;text-align:center}
#toast.on{opacity:1}
.mk{position:absolute;left:8px;top:8px;background:#fff3cd;color:#7a5b00;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;pointer-events:none}
@media (max-height:520px){#bar button{height:40px;flex-direction:row;gap:6px}#bar button b{font-size:17px}#chips{padding:3px 8px}.chip{height:30px}#top{padding:3px 8px}.ib{height:38px;min-width:40px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a class="ib" href="/tools/" aria-label="Назад" style="text-decoration:none;color:var(--t)">←</a>
    <button class="ttl" id="title">Поверхня</button>
    <button class="ib" id="undo" aria-label="Скасувати">↶</button>
    <button class="ib" id="redo" aria-label="Повторити">↷</button>
    <button class="ib" id="menu" aria-label="Меню">⋯</button>
  </div>
  <div id="stage"><svg id="sv" xmlns="http://www.w3.org/2000/svg"></svg><div id="loupe"></div><div class="mk">ПРОТОТИП</div>
  <div id="draftBar"><span class="n" id="draftN"></span><button class="btn" id="dUndo">↶ Точка</button><button class="btn d" id="dCancel">✕</button><button class="btn p" id="dDone">Готово ✓</button></div>
  <div id="sheet"></div></div>
  <div id="chips"></div>
  <div id="bar">
    <button data-tool="select"><b>☝</b>Вибір</button>
    <button data-tool="route"><b>╱</b>Траса</button>
    <button data-tool="point"><b>●</b>Точка</button>
    <button data-tool="zone"><b>▱</b>Зона</button>
    <button data-tool="dims"><b>↔</b>Розміри</button>
  </div>
</div>
<div id="ovl"><div id="box"></div></div>
<div id="toast"></div>
<script src="../shared/store.js?v=20261121"></script>
<script src="geometry.js"></script><script src="library.js"></script><script src="model.js"></script><script src="dims.js"></script>
<script src="editor.js"></script>
</body>
</html>
