<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SA-MASTER — Test Status</title>
</head>
<body style="font-family:Arial,sans-serif;padding:30px">
  <h2>Тест зміни статусу</h2>
  <p>
    Заявка: <b>SM-R-2026-005</b>
  </p>
  <p>
    Поточний статус: <b>Прорахунок</b>
    → новий: <b>Погоджено</b>
  </p>
  <button
    onclick="changeStatus()"
    style="padding:12px 20px;font-size:16px"
  >
    Змінити статус
  </button>
  <pre
    id="result"
    style="margin-top:20px;background:#f2f2f2;padding:15px;white-space:pre-wrap"
  >Очікування...</pre>
<script>
async function changeStatus() {
  const result = document.getElementById("result");
  result.textContent = "Виконується запит...";
  try {
    const response = await fetch(
      "https://sa-master-worker.c6hht469s9.workers.dev/request/SM-R-2026-005/status",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          status: "approved"
        })
      }
    );
    const data = await response.json();
    result.textContent =
      JSON.stringify(data, null, 2);
  } catch (error) {
    result.textContent =
      "Помилка:\n" + error;
  }
}
</script>
</body>
</html>
