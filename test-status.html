<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test status</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 30px;
      background: #f2f2f7;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-bottom: 12px;
      border: 0;
      border-radius: 14px;
      font-size: 17px;
      background: #007aff;
      color: white;
    }

    pre {
      white-space: pre-wrap;
      background: white;
      padding: 15px;
      border-radius: 14px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h2>Тест статусу заявки</h2>

  <button onclick="changeStatus('processing')">
    → Опрацювання
  </button>

  <button onclick="changeStatus('estimate')">
    → Прорахунок
  </button>

  <button onclick="changeStatus('approved')">
    → Погоджено
  </button>

  <pre id="result">Результат з'явиться тут...</pre>

<script>

const WORKER =
  'https://sa-master-worker.c6hht469s9.workers.dev';

const REQUEST_CODE =
  'SM-R-2026-005';

async function changeStatus(status) {

  const result = document.getElementById('result');

  result.textContent = 'Відправляємо...';

  try {

    const response = await fetch(
      `${WORKER}/request/${REQUEST_CODE}/status`,
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          status: status
        })
      }
    );

    const data = await response.json();

    result.textContent =
      JSON.stringify(data, null, 2);

  } catch (error) {

    result.textContent =
      'ПОМИЛКА:\n' + error;

  }
}

</script>

</body>
</html>
