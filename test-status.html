<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SA-MASTER — Test Status</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
    }
    h1 {
      font-size: 24px;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
    pre {
      background: #f3f3f3;
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Тест зміни статусу заявки</h1>
  <p>
    <strong>Заявка:</strong> SM-R-2026-005
  </p>
  <p>
    <strong>Поточний статус:</strong>
    Прорахунок
  </p>
  <p>
    <strong>Новий статус:</strong>
    Погоджено
  </p>
  <button id="changeStatus">
    Змінити статус
  </button>
  <h3>Результат:</h3>
  <pre id="result">Очікування...</pre>
  <script>
    const WORKER_URL =
      "https://sa-master-worker.c6hht469s9.workers.dev";
    const REQUEST_CODE = "SM-R-2026-005";
    document
      .getElementById("changeStatus")
      .addEventListener("click", async () => {
        const result = document.getElementById("result");
        const button = document.getElementById("changeStatus");
        button.disabled = true;
        result.textContent = "Виконується...";
        try {
          const response = await fetch(
            `${WORKER_URL}/request/${REQUEST_CODE}/status`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                status: "approved"
              })
            }
          );
          const data = await response.json();
          result.textContent =
            JSON.stringify(data, null, 2);
        } catch (error) {
          result.textContent =
            JSON.stringify(
              {
                ok: false,
                error: error.message
              },
              null,
              2
            );
        } finally {
          button.disabled = false;
        }
      });
  </script>
</body>
</html>
