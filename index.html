<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SA-MASTER.PRO — Комплексний монтаж сантехніки</title>
    <meta name="description" content="SA-MASTER.PRO — комплексний монтаж сантехніки у новобудовах Києва. Реалізація сучасних проектних рішень. 0979111871" />
    
    <!-- OG-теги -->
    <meta property="og:title" content="SA-MASTER.PRO" />
    <meta property="og:description" content="комплексний монтаж сантехніки. Реалізація сучасних проектних рішень. 0979111871" />
    <meta property="og:image" content="https://sa-master.pro/og-image.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sa-master.pro/" />
    
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet" />
    <style>
        :root {
            --color-primary: #007AFF;
            --color-text: #1C1C1E;
            --color-bg: #F2F2F7;
            --radius-card: 24px;
            --shadow-card: 0 4px 16px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.03);
            --transition: .35s cubic-bezier(.22,.61,.36,1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
            color: var(--color-text);
            background: var(--color-bg);
            -webkit-font-smoothing: antialiased;
            padding: 12px 0 20px;
        }
        a { text-decoration: none; color: inherit; }
        .page {
            width: min(480px, calc(100% - 20px));
            margin: 0 auto;
        }

        /* Шапка */
        .hero {
            position: relative;
            overflow: hidden;
            padding: 20px 16px 16px;
            border-radius: 28px;
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 8px 32px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.02);
        }
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 70% 20%, rgba(0,122,255,.06), transparent 60%),
                        radial-gradient(ellipse at 30% 80%, rgba(0,122,255,.04), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .hero-header {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: heroReveal .7s ease-out forwards;
        }
        @keyframes heroReveal {
            0% { opacity: 0; transform: translateY(20px); filter: blur(4px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* Рядок з логотипом і заголовком */
        .hero-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between; /* логотип зліва, заголовок справа */
            width: 100%;
            gap: 12px;
        }
        .logo-wrapper {
            flex: 0 0 auto;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform .35s ease;
        }
        .logo-wrapper:hover { transform: scale(1.03); }
        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 6px;
        }
        .brand-top {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end; /* назва притиснута до правого краю */
            min-width: 0;
        }
        .brand-link {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: transform .3s ease;
        }
        .brand-link:hover { transform: translateY(-2px); }
        .brand-name {
            font-family: 'Russo One', sans-serif;
            font-size: clamp(28px, 5vw, 36px);
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #1C1C1E;
            white-space: nowrap;
        }
        .brand-badge {
            font-size: 0.45em;
            font-weight: 400;
            color: inherit;
            background: none;
            padding: 0;
            border: none;
            white-space: nowrap;
            align-self: flex-start;
            margin-top: 0.15em;
            line-height: 1;
            text-transform: lowercase;
        }

        /* Підзаголовок на всю ширину, один рядок */
        .brand-sub {
            width: 100%;
            text-align: center;
            font-size: clamp(14px, 2.5vw, 18px);
            font-weight: 500;
            color: #3A3A3C;
            line-height: 1.3;
            white-space: nowrap; /* забороняємо перенос */
            overflow: hidden;
            text-overflow: ellipsis; /* на випадок надто довгого тексту */
        }

        /* Галерея */
        .gallery {
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            background: #E5E8EC;
            box-shadow: 0 8px 24px rgba(0,0,0,.06);
            margin-top: 12px;
        }
        .gallery-window {
            position: relative;
            width: 100%;
            aspect-ratio: 16/10;
            overflow: hidden;
        }
        .gallery-track {
            display: flex;
            height: 100%;
            transform: translate3d(0,0,0);
            transition: transform .5s cubic-bezier(.22,.61,.36,1);
        }
        .gallery-slide {
            flex: 0 0 100%;
            height: 100%;
            overflow: hidden;
            background: #D2D6DC;
        }
        .gallery-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .gallery-counter {
            position: absolute;
            top: 10px; right: 10px;
            z-index: 5;
            min-width: 36px; height: 24px;
            padding: 0 10px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px;
            background: rgba(0,0,0,.45);
            border: 1px solid rgba(255,255,255,.2);
            color: #fff;
            font-size: 12px; font-weight: 600;
            backdrop-filter: blur(12px);
        }
        .gallery-dots {
            position: absolute;
            left: 50%; bottom: 10px;
            transform: translateX(-50%);
            display: flex; align-items: center; gap: 4px;
            padding: 4px 7px;
            border-radius: 14px;
            background: rgba(0,0,0,.35);
            border: 1px solid rgba(255,255,255,.15);
            backdrop-filter: blur(12px);
            z-index: 5;
        }
        .gallery-dot {
            width: 4px; height: 4px;
            border: 0; border-radius: 50%;
            background: rgba(255,255,255,.5);
            transition: width .25s ease, background .25s ease;
            cursor: pointer;
        }
        .gallery-dot.active { width: 14px; border-radius: 4px; background: #fff; }

        /* Віджети */
        .widgets-section { margin: 20px 0 16px; }
        .widgets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .widget-card {
            position: relative;
            padding: 18px 16px 16px;
            border-radius: 24px;
            background: #fff;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(255,255,255,.9);
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
            display: flex; flex-direction: column; min-height: 130px;
            opacity: 0; animation: heroReveal .6s ease-out forwards;
        }
        .widget-card:nth-child(1) { animation-delay: .1s; }
        .widget-card:nth-child(2) { animation-delay: .2s; }
        .widget-card:nth-child(3) { animation-delay: .3s; }
        .widget-card:nth-child(4) { animation-delay: .4s; }
        .widget-card:active { transform: scale(.97); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .widget-icon {
            width: 44px; height: 44px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 8px; flex: 0 0 44px;
        }
        .widget-icon svg { width: 22px; height: 22px; stroke-width: 2.2; fill: none; }
        .widget-badge {
            position: absolute; top: 14px; right: 14px;
            font-size: 14px; font-weight: 800;
            color: rgba(0,0,0,.06);
        }
        .widget-title { font-size: 18px; font-weight: 700; color: #1a1a2e; }
        .widget-sub { font-size: 14px; font-weight: 600; color: #1a1a2e; margin-top: 2px; }
        .widget-desc { font-size: 12px; color: #8E8E93; margin-top: 4px; }

        /* Модальні вікна */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 11000;
            display: flex; align-items: center; justify-content: center;
            padding: 18px;
            background: rgba(0,0,0,.45);
            backdrop-filter: blur(20px);
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity .3s ease, visibility .3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
        .modal-box {
            position: relative;
            width: 100%; max-width: 420px; max-height: 85vh;
            overflow-y: auto;
            padding: 24px 20px 22px;
            border-radius: 28px;
            background: rgba(255,255,255,.98);
            box-shadow: 0 24px 64px rgba(0,0,0,.18);
            transform: translateY(16px) scale(.96);
            transition: transform .35s cubic-bezier(.22,.61,.36,1);
        }
        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }
        .modal-close {
            position: absolute; top: 12px; right: 12px;
            width: 36px; height: 36px;
            border: 0; border-radius: 50%;
            background: rgba(120,130,140,.08);
            color: #8E8E93; font-size: 20px; line-height: 1;
            cursor: pointer; z-index: 5;
        }
        .modal-title { font-size: 24px; font-weight: 800; }
        .modal-lead { margin-top: 4px; font-size: 15px; font-weight: 600; color: #007AFF; }
        .modal-text { margin-top: 16px; font-size: 16px; line-height: 1.6; color: #5F6C73; }
        .modal-text p { margin: 0 0 12px; }
        .modal-text strong { color: #1C1C1E; }
        .modal-photo {
            display: block; width: 96px; height: 96px;
            object-fit: cover; border-radius: 50%;
            margin: 0 auto 14px; border: 3px solid #fff;
            box-shadow: 0 6px 18px rgba(0,0,0,.08);
        }
        .payment-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
        .payment-btn {
            position: relative; min-height: 84px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 4px; border-radius: 20px; color: #fff; font-size: 13px; font-weight: 700;
            box-shadow: 0 6px 16px rgba(0,0,0,.1);
            transition: transform .18s ease; overflow: hidden; cursor: pointer;
        }
        .payment-btn:active { transform: scale(.94); }
        .payment-btn svg { width: 38px; height: 38px; }
        .payment-btn.privat { background: linear-gradient(145deg, #67D45B, #159C35); }
        .payment-btn.mono { background: linear-gradient(145deg, #303034, #09090A); }

        /* Lightbox */
        .lightbox {
            position: fixed; inset: 0; z-index: 12000;
            display: flex; align-items: center; justify-content: center;
            padding: 12px; background: rgba(0,0,0,.85);
            backdrop-filter: blur(16px);
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity .25s ease, visibility .25s ease;
        }
        .lightbox.active { opacity: 1; visibility: visible; pointer-events: auto; }
        .lightbox img {
            max-width: 100%; max-height: 90vh;
            border-radius: 14px; object-fit: contain;
            box-shadow: 0 16px 48px rgba(0,0,0,.4);
            transform: scale(.95); transition: transform .3s ease;
        }
        .lightbox.active img { transform: scale(1); }
        .lightbox-close {
            position: absolute; top: 14px; right: 14px; z-index: 3;
            width: 38px; height: 38px; border: 1px solid rgba(255,255,255,.15);
            border-radius: 50%; background: rgba(255,255,255,.08);
            color: #fff; font-size: 22px; cursor: pointer;
            backdrop-filter: blur(10px);
        }

        /* Соціальний док */
        .ios-social-shell {
            width: 400px; max-width: calc(100vw - 28px);
            margin: 24px auto 8px; padding: 12px 6px 11px;
            background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(244,248,250,.68));
            border: 1px solid rgba(255,255,255,.92);
            box-shadow: 0 16px 38px rgba(38,75,91,.13), 0 3px 10px rgba(38,75,91,.06);
            backdrop-filter: blur(24px) saturate(170%);
            border-radius: 31px; overflow: hidden;
        }
        .ios-social-viewport { width: 100%; overflow: hidden; }
        .ios-social-track {
            display: flex; width: 200%;
            transform: translate3d(0,0,0);
            transition: transform .48s cubic-bezier(.22,.61,.36,1);
        }
        .ios-social-page {
            width: 50%; flex: 0 0 50%;
            display: grid; grid-template-columns: repeat(4, 76px);
            column-gap: 16px; justify-content: center; padding: 0 2px;
        }
        .ios-social-item { width: 76px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .ios-social-button {
            width: 76px; height: 76px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; overflow: hidden; cursor: pointer;
            box-shadow: 0 7px 15px rgba(44,67,76,.16);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .ios-social-button svg { width: 48px; height: 48px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.1)); }
        .ios-phone { background: linear-gradient(145deg, #55f36d, #31dc50); }
        .ios-contact { background: linear-gradient(145deg, #42A5F5, #007AFF); }
        .ios-instagram { background: linear-gradient(145deg, #ffdc80, #e1306c); }
        .ios-facebook { background: linear-gradient(145deg, #5b9af9, #1877f2); }
        .ios-youtube { background: linear-gradient(145deg, #ff5c5c, #ff0000); }
        .ios-telegram { background: linear-gradient(145deg, #5bc9ff, #229ed9); }
        .ios-viber { background: linear-gradient(145deg, #a486ff, #665cac); }
        .ios-payment { background: linear-gradient(145deg, #57c2ff, #007AFF); }
        .ios-social-label { font-size: 12px; font-weight: 500; color: #4d5d65; text-align: center; }
        .ios-social-icon-wrap { width: 76px; height: 76px; }
        .ios-social-pagination { display: flex; justify-content: center; gap: 5px; margin-top: 7px; }
        .ios-social-page-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: rgba(77,93,101,.28);
            transition: width .25s ease, background .25s ease;
        }
        .ios-social-page-dot.active { width: 15px; border-radius: 5px; background: #6d858f; }

        /* Адаптивність */
        @media(max-width:480px) {
            .page { width: calc(100% - 14px); }
            .hero { padding: 16px 12px 12px; border-radius: 24px; }
            .hero-top-row { gap: 10px; }
            .logo-wrapper { width: 70px; height: 70px; }
            .brand-name { font-size: 24px; letter-spacing: 0.3px; }
            .brand-badge { font-size: 0.4em; }
            .brand-sub { font-size: 15px; }
            .widgets-grid { gap: 10px; }
            .widget-card { padding: 14px 14px 12px; min-height: 110px; border-radius: 20px; }
            .widget-icon { width: 36px; height: 36px; border-radius: 12px; }
            .widget-icon svg { width: 18px; height: 18px; }
            .widget-title { font-size: 16px; }
            .widget-sub { font-size: 13px; }
            .widget-desc { font-size: 11px; }
            .widget-badge { font-size: 12px; }
            .ios-social-shell { width: 360px; }
            .ios-social-page { grid-template-columns: repeat(4, 68px); column-gap: 12px; }
            .ios-social-item { width: 68px; }
            .ios-social-button { width: 68px; height: 68px; border-radius: 18px; }
            .ios-social-button svg { width: 44px; height: 44px; }
            .ios-social-icon-wrap { width: 68px; height: 68px; }
            .modal-box { padding: 20px 16px 18px; border-radius: 24px; }
            .modal-title { font-size: 22px; }
            .modal-text { font-size: 15px; }
            .payment-btn { min-height: 70px; border-radius: 16px; font-size: 12px; }
            .payment-btn svg { width: 32px; height: 32px; }
        }
        @media(max-width:380px) {
            .hero { padding: 14px 10px 10px; border-radius: 20px; }
            .logo-wrapper { width: 60px; height: 60px; }
            .brand-name { font-size: 20px; }
            .brand-badge { font-size: 0.35em; }
            .brand-sub { font-size: 13px; }
            .widget-card { padding: 12px 12px 10px; min-height: 90px; border-radius: 16px; }
            .widget-icon { width: 30px; height: 30px; }
            .widget-icon svg { width: 16px; height: 16px; }
            .widget-title { font-size: 14px; }
            .widget-sub { font-size: 12px; }
            .widget-desc { font-size: 10px; }
            .widget-badge { font-size: 10px; }
            .ios-social-shell { width: 320px; }
            .ios-social-page { grid-template-columns: repeat(4, 64px); column-gap: 10px; }
            .ios-social-item { width: 64px; }
            .ios-social-button { width: 64px; height: 64px; }
            .ios-social-button svg { width: 40px; height: 40px; }
        }
    </style>
</head>

                        <a href="https://sa-master.pro/" class="brand-link" target="_blank" rel="noopener">

                    <div class="gallery-track" id="galleryTrack">

                        <div class="gallery-slide"><img src="photo-6.jpg" alt="Робота 6"></div>
                        <div class="gallery-slide"><img src="photo-7.jpg" alt="Робота 7"></div>

                    <div class="gallery-counter" id="galleryCounter">1 / 8</div>
                    <div class="gallery-dots" id="galleryDots">
                        <button class="gallery-dot active" type="button"></button>

            </div>
        </section>

        <!-- Віджети, докбар, модальні вікна залишаються без змін -->
