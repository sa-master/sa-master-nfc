    <style>
        /* ===== БАЗОВІ ЗМІННІ ===== */
        :root {
            --color-primary: #007AFF;
            --color-text: #1C1C1E;
            --color-text-secondary: #3A3A3C;
            --color-text-muted: #8E8E93;
            --color-bg: #E3F0FA;
            --color-bg-gradient-start: #F2F6FB;
            --color-bg-gradient-end: #EAF1FA;
            --color-glass-bg: rgba(255, 255, 255, 0.45);
            --color-glass-border: rgba(255, 255, 255, 0.65);
            --color-glass-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.08), 0 0.125rem 0.5rem rgba(0, 0, 0, 0.04);
            --color-modal-bg: rgba(255, 255, 255, 0.98);
            --color-modal-text: #5F6C73;
            --color-modal-title: #1C1C1E;
            --color-footer-text: #6D6D72;
            --color-focus: #007AFF;
            --radius-card: 0.875rem;
            --radius-modal: 1.25rem;
            --radius-social: 1.75rem;
            --radius-gallery: 1.25rem;
            --transition: 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        /* ===== ТЕМНА ТЕМА ===== */
        body.dark-mode {
            --color-primary: #0A84FF;
            --color-text: #F2F2F7;
            --color-text-secondary: #C7C7CC;
            --color-text-muted: #8E8E93;
            --color-bg: #1C1C1E;
            --color-bg-gradient-start: #2C2C2E;
            --color-bg-gradient-end: #1C1C1E;
            --color-glass-bg: rgba(44, 44, 46, 0.55);
            --color-glass-border: rgba(255, 255, 255, 0.12);
            --color-glass-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.4), 0 0.125rem 0.5rem rgba(0, 0, 0, 0.2);
            --color-modal-bg: rgba(28, 28, 30, 0.98);
            --color-modal-text: #C7C7CC;
            --color-modal-title: #F2F2F7;
            --color-footer-text: #8E8E93;
            --color-focus: #0A84FF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        
        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
            color: var(--color-text);
            background: var(--color-bg);
            -webkit-font-smoothing: antialiased;
            position: relative;
            padding: 0;
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        a { text-decoration: none; color: inherit; }
        
        :focus-visible {
            outline: 0.1875rem solid var(--color-focus);
            outline-offset: 0.125rem;
            border-radius: 0.25rem;
        }

        /* ===== ФОНОВИЙ ШАР ===== */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: linear-gradient(
                180deg,
                var(--color-bg-gradient-start) 0%,
                var(--color-bg) 25%,
                var(--color-bg-gradient-end) 75%,
                var(--color-bg) 100%
            );
            transition: background 0.3s ease;
        }
        
        .background-layer::before {
            content: "";
            position: absolute;
            inset: -30%;
            background: radial-gradient(ellipse 60% 50% at 25% 20%, rgba(0, 122, 255, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse 55% 45% at 75% 75%, rgba(88, 86, 214, 0.12) 0%, transparent 55%);
            animation: auroraShift 20s ease-in-out infinite alternate;
        }
        
        @keyframes auroraShift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(3%, -2%) scale(1.05); }
            100% { transform: translate(-2%, 1.5%) scale(1.02); }
        }
        
        @media (prefers-reduced-motion: reduce) {
            .background-layer::before {
                animation: none;
            }
        }

        /* ===== КОНТЕНТ ===== */
        .content-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0.5rem 0 1.5rem;
        }
        
        .page {
            width: min(30rem, calc(100% - 1.25rem));
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ===== ШАПКА ===== */
        .hero {
            position: relative;
            overflow: hidden;
            padding: 0.5rem 0.75rem;
            border-radius: 1.5rem;
            background: var(--color-glass-bg);
            backdrop-filter: blur(1.75rem) saturate(220%);
            -webkit-backdrop-filter: blur(1.75rem) saturate(220%);
            border: 1px solid var(--color-glass-border);
            box-shadow: var(--color-glass-shadow);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        .hero-header {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            animation: heroReveal 0.7s ease-out forwards;
        }
        
        @keyframes heroReveal {
            0% { opacity: 0; transform: translateY(1.25rem); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .hero-top-row {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 0.75rem;
        }
        
        .logo-wrapper {
            flex: 0 0 auto;
            width: 4.25rem;
            height: 4.25rem;
            margin-left: 0.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.35s ease;
        }
        
        .logo-wrapper:hover { transform: scale(1.03); }
        
        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
