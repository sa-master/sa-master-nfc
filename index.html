<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detroit Plumbing Co. - Надійні сантехнічні послуги</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Базові стилі */
        :root {
            --primary-blue: #004aad;
            --dark-blue: #002e66;
            --text-dark: #333;
            --text-white: #fff;
            --bg-light: #f8f9fa;
            --font-family: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            line-height: 1.6;
            color: var(--text-dark);
            background-color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Шапка (Header) */
        header {
            background-color: #fff;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark-blue);
        }

        .logo-subtitle {
            font-size: 0.8rem;
            color: #666;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: var(--primary-blue);
        }

        .mobile-menu-toggle {
            display: none; /* Приховано для десктопу */
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Кнопка "Зателефонувати" (Call Now) */
        .call-now-btn {
            background-color: var(--primary-blue);
            color: var(--text-white);
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
        }

        .call-now-btn:hover {
            background-color: #003a8c;
        }

        /* Hero секція */
        .hero {
            background-color: var(--dark-blue);
            color: var(--text-white);
            padding: 80px 0;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .hero-text h1 {
            font-size: 3rem;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-text p {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .hero-services-list {
            list-style: none;
            margin-bottom: 30px;
        }

        .hero-services-list li {
            margin-bottom: 5px;
            position: relative;
            padding-left: 25px;
        }

        .hero-services-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #4caf50;
        }

        .hero-image-container {
            position: relative;
        }

        .hero-image {
            width: 100%;
            height: auto;
            border-radius: 10px;
            object-fit: cover;
        }

        .hero-btn {
            background-color: var(--primary-blue);
            color: var(--text-white);
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
            transition: background-color 0.3s;
        }

        .hero-btn:hover {
            background-color: #003a8c;
        }

        /* Секція "Як ми можемо допомогти" (How We Can Help) */
        .services {
            padding: 80px 0;
            background-color: #fff;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 50px;
            color: var(--dark-blue);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .service-card {
            background-color: var(--bg-light);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
        }

        .service-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
        }

        .service-card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--dark-blue);
        }

        /* Секція "Чому обирають нас" (Why Choose Us) */
        .why-choose-us {
            background-color: var(--dark-blue);
            color: var(--text-white);
            padding: 80px 0;
        }

        .reasons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            text-align: center;
        }

        .reason-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .reason-icon {
            width: 50px;
            height: 50px;
        }

        .reason-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Підвал (Footer) */
        footer {
            background-color: #f0f0f0;
            padding: 50px 0;
            text-align: center;
        }

        .footer-content {
            font-size: 0.9rem;
            color: #666;
        }

        /* Адаптивність (Mobile Responsiveness) */
        @media (max-width: 768px) {
            .nav-links {
                display: none; /* Приховати стандартне меню */
            }
            
            .mobile-menu-toggle {
                display: block;
            }

            .hero-content {
                grid-template-columns: 1fr;
            }

            .hero-text h1 {
                font-size: 2rem;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }

            .reasons-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }
    </style>
</head>
