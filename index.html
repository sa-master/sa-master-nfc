<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="shortcut icon" href="favicon.ico">

<meta name="twitter:description" content="Комплексний монтаж сантехніки в новобудовах Києва. Працюємо з провідними світовими брендами. Понад 20 років досвіду.">
<meta name="twitter:image" content="https://sa-master.kyiv.ua/og-image.jpg">

<style>

/* ========================================
   RESET
======================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(
            circle at 10% 0%,
            #ffffff 0%,
            #f3f8fa 45%,
            #dce5e9 100%
        );
    color: #17272f;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* ========================================
   PAGE
======================================== */

.page {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 14px;
}


/* ========================================
   HERO
======================================== */

.hero {
    position: relative;
    overflow: hidden;
    padding: 20px 18px 22px;
    border-radius: 30px;
    background:
        radial-gradient(
            circle at 75% 15%,
            rgba(89,194,230,.30),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #f8fcfd 0%,
            #cbd8dd 45%,
            #738991 100%
        );
    box-shadow:
        0 20px 50px rgba(37,63,75,.20);
}


/* декоративні кола */

.hero::before {
    content: "";
    position: absolute;
    width: 310px;
    height: 310px;
    right: -120px;
    top: 150px;
    border: 2px solid rgba(255,255,255,.38);
    border-radius: 50%;
    box-shadow:
        0 0 0 28px rgba(255,255,255,.08),
        0 0 0 58px rgba(255,255,255,.05),
        0 0 0 90px rgba(255,255,255,.03);
    pointer-events: none;
}

.hero::after {
    content: "";
    position: absolute;
    width: 190px;
    height: 2px;
    right: 5px;
    top: 390px;
    background: rgba(53,177,218,.45);
    transform: rotate(-32deg);
    box-shadow:
        0 30px 0 rgba(53,177,218,.25),
        0 60px 0 rgba(53,177,218,.15);
    pointer-events: none;
}


/* ========================================
   HEADER
======================================== */

.hero-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    position: relative;
    z-index: 5;
}


/* LOGO */

.logo-wrapper {
    flex-shrink: 0;
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: transparent;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(25,55,68,.16);
    border: none;
    isolation: isolate;
}

.logo-wrapper::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #ffffff;
    mask-image: url(logo.png);
    -webkit-mask-image: url(logo.png);
    mask-size: cover;
    -webkit-mask-size: cover;
    mask-position: center;
    -webkit-mask-position: center;
    mask-repeat: no-repeat;
    -webkit-mask-repeat: no-repeat;
    mask-mode: alpha;
    -webkit-mask-mode: alpha;
    pointer-events: none;
}

.logo {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    padding: 0;
    border: none;
    background: transparent;
    box-shadow: none;
    object-fit: cover;
    object-position: center;
    display: block;
}


/* Бренд */

.hero-brand {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
}

.brand-name {
    font-family: "Rubik Mono One", "Arial Black", "Segoe UI", sans-serif;
    font-size: 38px;
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: normal;
    color: #2a2a2a;
    text-shadow:
        0 -1px 0 rgba(255, 255, 255, 0.4),
        0 2px 6px rgba(0, 0, 0, 0.20),
        0 4px 12px rgba(0, 0, 0, 0.08);
    white-space: nowrap;
}

.brand-divider {
    width: 80%;
    height: 2px;
    margin: 8px 0 6px;
    background: linear-gradient(
        90deg,
        rgba(70, 184, 223, 0) 0%,
        #46b8df 50%,
        rgba(70, 184, 223, 0) 100%
    );
    border-radius: 2px;
}

.brand-sub {
    font-size: 19px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.3;
    letter-spacing: 0.3px;
}


/* ========================================
   TEXT UNDER GALLERY
======================================== */

.hero-gallery-sub {
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    margin-top: 8px;
    line-height: 1.3;
    letter-spacing: 0.3px;
    text-align: center;
    position: relative;
    z-index: 5;
    text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.45),
        0 4px 12px rgba(0, 0, 0, 0.30);
}


/* ========================================
   HEADER GALLERY
======================================== */

.header-gallery {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 390px;
    margin: 0 auto 19px;
    overflow: hidden;
    border-radius: 22px;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35);
    box-shadow: 0 14px 35px rgba(25,55,68,.20);
    touch-action: pan-y;
}

.header-gallery-track {
    display: flex;
    width: 100%;
    transition: transform .45s cubic-bezier(.22,.61,.36,1);
}

.header-gallery-slide {
    position: relative;
    flex: 0 0 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: #b9c8ce;
    cursor: pointer;
}

.header-gallery-slide img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .35s ease;
}

.header-gallery-slide:hover img {
    transform: scale(1.015);
}


/* ========================================
   COUNTER
======================================== */

.header-gallery-counter {
    position: absolute;
    z-index: 10;
    top: 10px;
    right: 10px;
    padding: 6px 9px;
    background: rgba(18,35,42,.58);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 8px;
    color: white;
    font-size: 8px;
    font-weight: 800;
}


/* ========================================
   ARROWS
======================================== */

.header-gallery-arrow {
    position: absolute;
    z-index: 10;
    top: 50%;
    width: 34px;
    height: 34px;
    margin-top: -17px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.60);
    border-radius: 50%;
    color: #243940;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,0,0,.15);
    transition: .2s ease;
}

.header-gallery-arrow:hover {
    transform: scale(1.06);
    background: white;
}

.header-gallery-prev {
    left: 9px;
}

.header-gallery-next {
    right: 9px;
}


/* ========================================
   DOTS
======================================== */

.header-gallery-dots {
    position: absolute;
    z-index: 10;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    padding: 5px 7px;
    background: rgba(18,35,42,.48);
    backdrop-filter: blur(10px);
    border-radius: 20px;
}

.header-gallery-dot {
    width: 5px;
    height: 5px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.45);
    cursor: pointer;
    transition: .25s ease;
}

.header-gallery-dot.active {
    width: 15px;
    border-radius: 5px;
    background: white;
}


/* ========================================
   ACTION BUTTON (phone + save в одній кнопці)
======================================== */

.action-button {
    display: flex;
    align-items: center;
    max-width: 440px;
    margin: 14px auto 12px;
    min-height: 72px;
    background: linear-gradient(180deg, #42a5f5 0%, #1976d2 100%);
    border-radius: 24px;
    box-shadow: 0 10px 25px rgba(25,118,210,.25);
    transition: transform .2s ease, box-shadow .2s ease;
    overflow: hidden;
}

.action-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(25,118,210,.35);
}

.phone-part {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    padding: 10px 16px;
    text-decoration: none;
    color: white;
    min-width: 0;
}

.phone-part .phone-icon-circle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    background: rgba(255,255,255,.15);
    border-radius: 50%;
    flex-shrink: 0;
}

.phone-part .phone-icon-circle svg {
    width: 22px;
    height: 22px;
    fill: #ffffff;
}

.phone-number {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: .5px;
    color: #ffffff;
    white-space: nowrap;
}

.save-part {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    align-self: stretch;
    background: rgba(255,255,255,.12);
    border-left: 1px solid rgba(255,255,255,.25);
    text-decoration: none;
    transition: background .2s ease;
}

.save-part:hover {
    background: rgba(255,255,255,.20);
}

.save-part svg {
    width: 28px;
    height: 28px;
    color: #ffffff;
}


/* ========================================
   SOCIAL
======================================== */

.social-container {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin: 10px 0 24px;
    padding: 0 2px;
}

.social-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    gap: 8px;
    width: 62px;
}

.social-icon-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 6px 18px rgba(0,0,0,.06);
    transition: transform .25s ease, box-shadow .25s ease;
}

.social-item:hover .social-icon-wrapper {
    transform: translateY(-3px);
    box-shadow: 0 10px 22px rgba(0,0,0,.12);
}

.social-icon-wrapper svg {
    width: 24px;
    height: 24px;
}

.social-label {
    font-size: 12px;
    font-weight: 600;
    color: #334155;
    text-align: center;
}


/* COLORS */

.social-item.instagram .social-icon-wrapper {
    color: #e1306c;
}

.social-item.facebook .social-icon-wrapper {
    color: #1877f2;
}

.social-item.youtube .social-icon-wrapper {
    color: #ff0000;
}

.social-item.telegram .social-icon-wrapper {
    color: #0088cc;
}

.social-item.viber .social-icon-wrapper {
    color: #7360f2;
}


/* ========================================
   ABOUT CAROUSEL
======================================== */

.about-carousel {
    position: relative;
    margin: 24px 0;
    overflow: hidden;
    border-radius: 20px;
}

.about-track {
    display: flex;
    transition: transform .35s ease;
}

.about-slide {
    flex: 0 0 100%;
    min-width: 100%;
    padding: 16px;
    background: rgba(255,255,255,.6);
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

.about-top {
    overflow: hidden;
}

.about-photo {
    float: right;
    width: 150px;
    height: 150px;
    margin-left: 16px;
    margin-bottom: 12px;
    border-radius: 50%;
    box-shadow: 0 6px 18px rgba(0,0,0,.12);
    object-fit: cover;
}

.first-paragraph {
    font-size: 16px;
    color: #4a5b66;
    line-height: 1.5;
    margin: 0;
}

.first-paragraph strong {
    color: #1c59a3;
    font-weight: 800;
}

.read-more {
    display: inline;
    background: none;
    border: none;
    padding: 0;
    margin-left: 4px;
    color: #1c59a3;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    white-space: nowrap;
}

.read-more:hover {
    color: #0d3a66;
}

.about-hidden {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.3s ease;
    margin-top: 0;
}

.about-hidden.open {
    max-height: 1000px;
    opacity: 1;
    margin-top: 12px;
}

.about-hidden p {
    font-size: 16px;
    color: #4a5b66;
    line-height: 1.5;
    margin: 0 0 8px;
}

.about-hidden p strong {
    color: #1c59a3;
    font-weight: 800;
}

.about-prev,
.about-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    background: #ffffff;
    border: 1px solid #ccd8df;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    color: #1c59a3;
    box-shadow: 0 4px 12px rgba(0,0,0,.10);
    z-index: 5;
}

.about-prev { left: 8px; }
.about-next { right: 8px; }


/* ========================================
   PAYMENT
======================================== */

.payment-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 25px;
}

.payment-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 68px;
    padding: 10px;
    background: linear-gradient(145deg,#ffffff,#e6f1f5);
    border: 1px solid rgba(100,135,148,.16);
    border-radius: 19px;
    color: #263840;
    text-decoration: none;
    box-shadow: 0 8px 22px rgba(40,70,82,.07);
    transition: .2s ease;
}

.payment-button:hover {
    transform: translateY(-2px);
}

.payment-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 47px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 11px;
    color: white;
    font-size: 11px;
    font-weight: 950;
    letter-spacing: -.5px;
    box-shadow: 0 5px 13px rgba(40,70,82,.16);
}

.privat-icon {
    background: linear-gradient(145deg,#63c64b,#238a31);
    font-size: 12px;
}

.mono-icon {
    background: linear-gradient(145deg,#242424,#000);
    font-size: 11px;
    letter-spacing: -1px;
}

.payment-button strong {
    font-size: 12px;
    font-weight: 900;
}


/* ========================================
   BRANDS (компактний футер)
======================================== */

.brands-section {
    margin-top: 22px;
    padding: 12px 4px 4px;
    border-top: 1px solid rgba(90,120,130,.14);
    text-align: center;
}

.brands-subtitle {
    font-size: 12px;
    font-weight: 500;
    color: #6b7f88;
    margin-bottom: 8px;
    line-height: 1.35;
    letter-spacing: 0.3px;
}

.brands-line {
    font-size: 12px;
    font-weight: 600;
    color: #5a6d76;
    line-height: 1.5;
    letter-spacing: 0.4px;
    word-spacing: 2px;
}

.brands-line span {
    display: inline;
    white-space: nowrap;
}

.brands-line .sep {
    color: #b0c0c8;
    margin: 0 5px;
}


/* ========================================
   LIGHTBOX
======================================== */

.lightbox {
    position: fixed;
    z-index: 9999;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(5,15,20,.92);
    backdrop-filter: blur(10px);
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 100%;
    max-height: 94vh;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 20px 70px rgba(0,0,0,.45);
}

.lightbox-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
    color: white;
    font-size: 26px;
    cursor: pointer;
}


/* ========================================
   MOBILE
======================================== */

@media (max-width:480px) {

    .hero {
        padding: 17px 14px 20px;
    }

    .logo-wrapper {
        width: 64px;
        height: 64px;
    }

    .brand-name {
        font-size: 22px;
        letter-spacing: normal;
    }

    .brand-sub {
        font-size: 11px;
    }

    .header-gallery {
        max-width: 100%;
    }

    .hero-gallery-sub {
        font-size: 11px;
    }

    .action-button {
        max-width: 70%;
        margin: 14px auto 12px;
        min-height: 64px;
        border-radius: 20px;
    }

    .phone-part {
        padding: 10px 12px;
        gap: 10px;
    }

    .phone-part .phone-icon-circle {
        width: 40px;
        height: 40px;
    }

    .phone-part .phone-icon-circle svg {
        width: 20px;
        height: 20px;
    }

    .phone-number {
        font-size: 22px;
        letter-spacing: .2px;
    }

    .save-part {
        width: 48px;
    }

    .save-part svg {
        width: 24px;
        height: 24px;
    }

    .payment-button {
        gap: 7px;
        padding: 8px;
    }

    .payment-icon {
        width: 43px;
        height: 38px;
    }

    .social-item {
        width: 52px;
    }

    .social-icon-wrapper {
        width: 44px;
        height: 44px;
    }

    .social-icon-wrapper svg {
        width: 20px;
        height: 20px;
    }

    .social-label {
        font-size: 10px;
    }

    .about-photo {
        width: 100px;
        height: 100px;
        margin-left: 10px;
        margin-bottom: 8px;
    }

    .first-paragraph,
    .about-hidden p {
        font-size: 14px;
    }

    .read-more {
        font-size: 14px;
    }

    .brands-subtitle {
        font-size: 11px;
        margin-bottom: 6px;
    }

    .brands-line {
        font-size: 11px;
        line-height: 1.45;
    }
}

</style>

</head>

<body>


<div class="page">


<section class="hero">

    <div class="hero-header">

        <div class="logo-wrapper">
            <img
                class="logo"
                src="logo.png"
                alt="SA MASTER"
            >
        </div>

        <div class="hero-brand">

            <div class="brand-name">
                SA-MASTER
            </div>

            <div class="brand-divider"></div>

            <div class="brand-sub">
                комплексний монтаж сантехніки
            </div>

        </div>

    </div>


    <div
        class="header-gallery"
        id="headerGallery"
    >

        <div
            class="header-gallery-track"
            id="headerGalleryTrack"
        >

            <div
                class="header-gallery-slide"
                onclick="openLightbox(0)"
            >
                <img
                    src="photo-1.jpg"
                    alt="Приклад роботи SA MASTER"
                >
            </div>

            <div
                class="header-gallery-slide"
                onclick="openLightbox(1)"
            >
                <img
                    src="photo-2.jpg"
                    alt="Приклад роботи SA MASTER"
                >
            </div>

            <div
                class="header-gallery-slide"
                onclick="openLightbox(2)"
            >
                <img
                    src="photo-3.jpg"
                    alt="Приклад роботи SA MASTER"
                >
            </div>

            <div
                class="header-gallery-slide"
                onclick="openLightbox(3)"
            >
                <img
                    src="photo-4.jpg"
                    alt="Приклад роботи SA MASTER"
                >
            </div>

        </div>


        <div
            class="header-gallery-counter"
            id="headerGalleryCounter"
        >
            01 / 04
        </div>


        <button
            class="header-gallery-arrow header-gallery-prev"
            onclick="changeHeaderSlide(-1)"
            aria-label="Попереднє фото"
        >
            ‹
        </button>


        <button
            class="header-gallery-arrow header-gallery-next"
            onclick="changeHeaderSlide(1)"
            aria-label="Наступне фото"
        >
            ›
        </button>


        <div
            class="header-gallery-dots"
