<!DOCTYPE html>
<html lang="uk">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SA MASTER — Комплексний монтаж сантехніки</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="shortcut icon" href="favicon.ico">

<meta name="twitter:description" content="Комплексний монтаж сантехніки в новобудовах Києва.">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    color: #16252c;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            #ffffff 0%,
            #f4f8fa 38%,
            #e4ecef 100%
        );
}


/* =========================================================
   PAGE
========================================================= */

.page {
    width: 100%;
    max-width: 560px;

    margin: 0 auto;

    padding: 18px 16px 28px;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;

    overflow: hidden;

    padding: 19px 18px 20px;

    border-radius: 34px;

    background:
        linear-gradient(
            145deg,
            #fdfefe 0%,
            #eef3f5 48%,
            #d8e2e6 100%
        );

    box-shadow:
        0 30px 70px rgba(25,48,58,.16),
        inset 0 1px 0 rgba(255,255,255,.9);
}


/* =========================================================
   BACKGROUND GLOW
========================================================= */

.hero::before {
    content: "";

    position: absolute;

    width: 340px;
    height: 340px;

    right: -180px;
    top: -150px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(78,190,225,.28),
            rgba(78,190,225,0) 70%
        );

    pointer-events: none;
}


/* =========================================================
   TOP BAR
========================================================= */

.hero-topbar {
    position: relative;

    z-index: 5;

    display: flex;
    align-items: center;

    margin-bottom: 25px;
    
    gap: 15px;
}


/* =========================================================
   LOGO - ЗБІЛЬШЕНО
========================================================= */

.logo-wrapper {
    position: relative;

    width: 90px;
    height: 90px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #ffffff;

    box-shadow:
        0 9px 24px rgba(20,45,55,.14),
        inset 0 1px 0 rgba(255,255,255,.95);

    overflow: hidden;
}

.logo {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


/* =========================================================
   BRAND
========================================================= */

.hero-brand {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
}


/* SA-MASTER - ЗБІЛЬШЕНИЙ ШРИФТ */

.brand-name {
    font-family:
        "Rubik Mono One",
        "Arial Black",
        sans-serif;

    font-size: 42px;

    line-height: .95;

    color: #202020;

    letter-spacing: -1.2px;

    white-space: nowrap;

    width: 100%;

    text-shadow:
        0 2px 8px rgba(0,0,0,.08);
}


/* COMPLEX INSTALLATION */

.brand-sub {
    display: block;

    margin-top: 10px;

    width: 100%;

    font-size: 12px;

    line-height: 1;

    font-weight: 800;

    color: #1977a1;

    letter-spacing: -.15px;

    white-space: nowrap;
}


/* =========================================================
   GALLERY
========================================================= */

.header-gallery {
    position: relative;

    z-index: 5;

    width: 100%;

    overflow: hidden;

    border-radius: 27px;

    background: #aebcc1;

    box-shadow:
        0 22px 45px rgba(22,47,58,.20),
        0 2px 4px rgba(0,0,0,.06);

    touch-action: pan-y;
}

.header-gallery-track {
    display: flex;

    width: 100%;

    transition:
        transform .6s cubic-bezier(.22,.61,.36,1);
}

.header-gallery-slide {
    position: relative;

    flex: 0 0 100%;

    aspect-ratio: 4 / 3;

    overflow: hidden;

    cursor: pointer;
}

.header-gallery-slide::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.07),
            transparent 35%,
            rgba(0,0,0,.25)
        );

    pointer-events: none;
}

.header-gallery-slide img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    transition:
        transform .7s cubic-bezier(.22,.61,.36,1);
}

.header-gallery-slide:hover img {
    transform: scale(1.025);
}


/* =========================================================
   GALLERY TOP
========================================================= */

.gallery-top {
    position: absolute;

    z-index: 20;

    top: 12px;
    left: 12px;
    right: 12px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    pointer-events: none;
}

.gallery-label,
.header-gallery-counter {
    padding: 7px 10px;

    border-radius: 10px;

    background:
        rgba(10,25,32,.48);

    border:
        1px solid rgba(255,255,255,.16);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    color: white;

    font-size: 8px;

    font-weight: 800;

    letter-spacing: 1px;

    text-transform: uppercase;
}

.header-gallery-counter {
    letter-spacing: .5px;
}


/* =========================================================
   DOTS
========================================================= */

.header-gallery-dots {
    position: absolute;

    z-index: 20;

    left: 50%;
    bottom: 13px;

    transform: translateX(-50%);

    display: flex;
    align-items: center;

    gap: 5px;

    padding: 6px 8px;

    border-radius: 20px;

    background:
        rgba(10,25,32,.42);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.header-gallery-dot {
    width: 5px;
    height: 5px;

    padding: 0;

    border: 0;

    border-radius: 10px;

    background:
        rgba(255,255,255,.45);

    cursor: pointer;

    transition:
        width .3s ease,
        background .3s ease;
}

.header-gallery-dot.active {
    width: 18px;

    background: white;
}


/* =========================================================
   PHOTO CAPTION
========================================================= */

.gallery-caption {
    position: absolute;

    z-index: 15;

    left: 15px;
    bottom: 15px;

    max-width: 65%;

    color: white;

    font-size: 10px;

    line-height: 1.25;

    font-weight: 700;

    text-shadow:
        0 2px 7px rgba(0,0,0,.5);

    pointer-events: none;
}


/* =========================================================
   CTA
========================================================= */

.action-button {
    position: relative;

    display: flex;
    align-items: stretch;

    width: 100%;

    min-height: 68px;

    margin: 17px 0 13px;

    overflow: hidden;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            #258cb8 0%,
            #17688d 100%
        );

    box-shadow:
        0 15px 32px rgba(22,104,141,.23);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.action-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 19px 38px rgba(22,104,141,.30);
}

.phone-part {
    flex: 1;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 9px 15px;

    color: white;

    text-decoration: none;
}

.phone-icon-circle {
    width: 43px;
    height: 43px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(255,255,255,.14);

    border:
        1px solid rgba(255,255,255,.18);
}

.phone-icon-circle svg {
    width: 20px;
    height: 20px;

    fill: white;
}

.phone-info {
    min-width: 0;
}

.phone-label {
    display: block;

    margin-bottom: 2px;

    font-size: 8px;

    font-weight: 700;

    opacity: .72;

    letter-spacing: .7px;

    text-transform: uppercase;
}

.phone-number {
    display: block;

    font-size: 21px;

    line-height: 1.05;

    font-weight: 800;

    letter-spacing: .2px;

    white-space: nowrap;
}

.save-part {
    width: 58px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,.10);

    border-left:
        1px solid rgba(255,255,255,.16);

    color: white;

    text-decoration: none;

    transition:
        background .2s ease;
}

.save-part:hover {
    background:
        rgba(0,0,0,.18);
}

.save-part svg {
    width: 25px;
    height: 25px;
}


/* =========================================================
   SOCIAL
========================================================= */

.social-container {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 7px;

    margin: 12px 0 25px;
}

.social-item {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 6px;

    min-width: 0;

    text-decoration: none;
}

.social-icon-wrapper {
    width: 46px;
    height: 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(255,255,255,.82);

    border:
        1px solid rgba(255,255,255,.95);

    box-shadow:
        0 7px 18px rgba(20,50,60,.08);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.social-item:hover .social-icon-wrapper {
    transform: translateY(-3px);

    box-shadow:
        0 12px 24px rgba(20,50,60,.13);
}

.social-icon-wrapper svg {
    width: 21px;
    height: 21px;
}

.social-label {
    font-size: 9px;

    font-weight: 650;

    color: #66767d;

    text-align: center;
}


/* SOCIAL COLORS */

.social-item.instagram .social-icon-wrapper {
    color: #e1306c;
}

.social-item.facebook .social-icon-wrapper {
    color: #1877f2;
}

.social-item.youtube .social-icon-wrapper {
    color: #ff0000;
}

.social-item.telegram .social-icon-wrapper {
    color: #0088cc;
}

.social-item.viber .social-icon-wrapper {
    color: #7360f2;
}


/* =========================================================
   ABOUT
========================================================= */

.about-block {
    margin: 0 0 23px;

    padding: 20px;

    border-radius: 25px;

    background:
        rgba(255,255,255,.72);

    border:
        1px solid rgba(255,255,255,.88);

    box-shadow:
        0 12px 30px rgba(30,55,65,.08);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.about-top {
    overflow: hidden;
}

.about-photo {
    float: right;

    width: 108px;
    height: 108px;

    margin-left: 15px;
    margin-bottom: 9px;

    border-radius: 50%;

    object-fit: cover;

    box-shadow:
        0 8px 22px rgba(20,45,55,.14);
}

.first-paragraph {
    margin: 0;

    color: #53656d;

    font-size: 15px;

    line-height: 1.55;
}

.first-paragraph strong,
.about-hidden strong {
    color: #155f8a;

    font-weight: 800;
}

.read-more {
    display: inline;

    padding: 0;
    margin-left: 4px;

    border: 0;

    background: none;

    color: #156d99;

    font-size: inherit;

    font-weight: 800;

    cursor: pointer;

    text-decoration: underline;

    text-underline-offset: 3px;
}

.about-hidden {
    max-height: 0;

    opacity: 0;

    overflow: hidden;

    margin-top: 0;

    transition:
        max-height .45s ease,
        opacity .3s ease,
        margin-top .3s ease;
}

.about-hidden.open {
    max-height: 1000px;

    opacity: 1;

    margin-top: 14px;
}

.about-hidden p {
    margin: 0 0 10px;

    color: #53656d;

    font-size: 15px;

    line-height: 1.55;
}


/* =========================================================
   PAYMENT
========================================================= */

.payment-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 11px;

    margin-bottom: 23px;
}

.payment-button {
    min-height: 64px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    padding: 10px;

    border-radius: 19px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #edf4f6
        );

    border:
        1px solid rgba(100,135,148,.13);

    color: #263840;

    text-decoration: none;

    box-shadow:
        0 8px 22px rgba(40,70,82,.07);

    transition:
        transform .2s ease;
}

.payment-button:hover {
    transform: translateY(-2px);
}

.payment-icon {
    width: 44px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    color: white;

    font-size: 11px;

    font-weight: 950;

    letter-spacing: -.5px;

    box-shadow:
        0 5px 13px rgba(40,70,82,.16);
}

.privat-icon {
    background:
        linear-gradient(
            145deg,
            #63c64b,
            #238a31
        );
}

.mono-icon {
    background:
        linear-gradient(
            145deg,
            #242424,
            #000
        );
}

.payment-button strong {
    font-size: 12px;

    font-weight: 900;
}


/* =========================================================
   BRANDS
========================================================= */

.brands-section {
    padding: 17px 5px 5px;

    border-top:
        1px solid rgba(90,120,130,.13);

    text-align: center;
}

.brands-subtitle {
    margin-bottom: 8px;

    font-size: 10px;

    font-weight: 600;

    color: #7a898f;

    letter-spacing: .2px;
}

.brands-line {
    font-size: 11px;

    line-height: 1.7;

    font-weight: 650;

    color: #607078;

    letter-spacing: .2px;
}

.brands-line span {
    white-space: nowrap;
}

.brands-line .sep {
    color: #bdc9ce;

    margin: 0 4px;
}


/* =========================================================
   LIGHTBOX
========================================================= */

.lightbox {
    position: fixed;

    z-index: 9999;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 18px;

    background:
        rgba(4,13,18,.95);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    touch-action: pan-y;
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 100%;
    max-height: 88vh;

    object-fit: contain;

    border-radius: 16px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.55);

    user-select: none;
    -webkit-user-drag: none;
}


/* LIGHTBOX CLOSE */

.lightbox-close {
    position: absolute;

    z-index: 30;

    top: 18px;
    right: 18px;

    width: 43px;
    height: 43px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255,255,255,.2);

    border-radius: 50%;

    background:
        rgba(255,255,255,.13);

    color: white;

    font-size: 25px;

    cursor: pointer;
}


/* LIGHTBOX COUNTER */

.lightbox-counter {
    position: absolute;

    z-index: 30;

    top: 22px;
    left: 50%;

    transform: translateX(-50%);

    padding: 7px 11px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid rgba(255,255,255,.15);

    color: white;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: .5px;

    backdrop-filter: blur(12px);
}


/* =========================================================
   MOBILE - ОНОВЛЕНО ДЛЯ БІЛЬШОГО ШРИФТА
========================================================= */

@media (max-width: 480px) {

    .page {
        padding:
            10px
            10px
            22px;
    }

    .hero {
        padding:
            15px
            13px
            16px;

        border-radius: 29px;
    }

    .hero-topbar {
        margin-bottom: 21px;
        gap: 12px;
    }

    .logo-wrapper {
        width: 75px;
        height: 75px;
    }

    .brand-name {
        font-size: 35px;

        letter-spacing: -1px;
    }

    .brand-sub {
        margin-top: 8px;

        font-size: 10.5px;

        letter-spacing: -.15px;
    }

    .header-gallery {
        border-radius: 23px;
    }

    .header-gallery-slide {
        aspect-ratio: 4 / 3;
    }

    .gallery-label,
    .header-gallery-counter {
        font-size: 7px;

        padding:
            6px 8px;
    }

    .gallery-caption {
        left: 12px;
        bottom: 12px;

        font-size: 9px;
    }

    .action-button {
        min-height: 62px;

        border-radius: 20px;
    }

    .phone-part {
        gap: 9px;

        padding:
            8px
            11px;
    }

    .phone-icon-circle {
        width: 39px;
        height: 39px;
    }

    .phone-icon-circle svg {
        width: 18px;
        height: 18px;
    }

    .phone-label {
        font-size: 7px;
    }

    .phone-number {
        font-size: 19px;
    }

    .save-part {
        width: 49px;
    }

    .save-part svg {
        width: 23px;
        height: 23px;
    }

    .social-container {
        gap: 4px;

        margin-top: 10px;
    }

    .social-icon-wrapper {
        width: 42px;
        height: 42px;
    }

    .social-icon-wrapper svg {
        width: 19px;
        height: 19px;
    }

    .social-label {
        font-size: 8px;
    }

    .about-block {
        padding: 16px;

        border-radius: 21px;
    }

    .about-photo {
        width: 92px;
        height: 92px;

        margin-left: 11px;
    }

    .first-paragraph,
    .about-hidden p {
        font-size: 14px;
    }

    .payment-buttons {
        gap: 8px;
    }

    .payment-button {
        min-height: 60px;

        gap: 7px;
    }

    .payment-icon {
        width: 40px;
        height: 35px;
    }

    .payment-button strong {
        font-size: 11px;
    }

    .brands-line {
        font-size: 10px;
    }
}


/* =========================================================
   VERY SMALL PHONES - ОНОВЛЕНО
========================================================= */

@media (max-width: 360px) {

    .logo-wrapper {
        width: 60px;
        height: 60px;
    }

    .brand-name {
        font-size: 29px;
    }

    .brand-sub {
        font-size: 9px;
    }

    .phone-number {
        font-size: 17px;
    }

    .social-label {
        font-size: 7px;
    }

}


/* =========================================================
   EXTRA NARROW — PREVENT BRAND OVERFLOW
========================================================= */

@media (max-width: 335px) {

    .logo-wrapper {
        width: 55px;
        height: 55px;
    }

    .hero-brand {
        margin-left: 0;
    }

    .brand-name {
        font-size: 26px;
    }

    .brand-sub {
        font-size: 8.5px;
    }

}

</style>
</head>


<body>

<div class="page">


<!-- ======================================================
     HERO
====================================================== -->

<section class="hero">


    <!-- TOP BAR -->

    <div class="hero-topbar">

        <div class="logo-wrapper">

            <img
                class="logo"
                src="logo.png"
                alt="SA MASTER"
            >

        </div>


        <div class="hero-brand">

            <div class="brand-name">
                SA-MASTER
            </div>

            <div class="brand-sub">
                комплексний монтаж сантехніки
            </div>

        </div>

    </div>



    <!-- ==================================================
         GALLERY
    ================================================== -->

    <div
        class="header-gallery"
        id="headerGallery"
    >

        <div
            class="header-gallery-track"
            id="headerGalleryTrack"
        >


            <div
                class="header-gallery-slide"
                data-index="0"
            >

                <img
                    src="photo-1.jpg"
                    alt="Приклад роботи SA MASTER"
                >

                <div class="gallery-caption">
                    SA-MASTER / WORK 01
                </div>

            </div>


            <div
                class="header-gallery-slide"
                data-index="1"
            >

                <img
                    src="photo-2.jpg"
                    alt="Приклад роботи SA MASTER"
                >

                <div class="gallery-caption">
                    SA-MASTER / WORK 02
                </div>

            </div>


            <div
                class="header-gallery-slide"
                data-index="2"
            >

                <img
                    src="photo-3.jpg"
                    alt="Приклад роботи SA MASTER"
                >

                <div class="gallery-caption">
                    SA-MASTER / WORK 03
                </div>

            </div>


            <div
                class="header-gallery-slide"
                data-index="3"
            >

                <img
                    src="photo-4.jpg"
                    alt="Приклад роботи SA MASTER"
                >

                <div class="gallery-caption">
                    SA-MASTER / WORK 04
                </div>

            </div>


        </div>
