<!-- ========================================
     SA-MASTER — PREMIUM PHOTO CAROUSEL
======================================== -->

<style>
/* КОНТЕЙНЕР КАРУСЕЛІ */
.sa-carousel {
    width: 100%;
    position: relative;
    overflow: hidden;
    border-radius: 28px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-y;
    cursor: grab;
}

/* Коли користувач тягне карусель */
.sa-carousel.is-dragging {
    cursor: grabbing;
}

/* Вікно слайдера */
.sa-carousel-viewport {
    width: 100%;
    overflow: hidden;
}

/* Стрічка */
.sa-carousel-track {
    display: flex;
    width: 100%;
    will-change: transform;
    transition: transform 0.65s cubic-bezier(.22, .61, .36, 1);
}

/* Слайд */
.sa-carousel-slide {
    min-width: 100%;
    flex: 0 0 100%;
    position: relative;
    overflow: hidden;
    aspect-ratio: 16 / 10;
}

/* Фото */
.sa-carousel-slide img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    -webkit-user-drag: none;
    
    transform: scale(1.001);
    transition: transform 1.2s cubic-bezier(.22, .61, .36, 1);
}

/* Легкий zoom активного фото */
.sa-carousel-slide.active img {
    transform: scale(1.025);
}

/* М'яке затемнення знизу */
.sa-carousel-slide::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 28%;
    pointer-events: none;

    background: linear-gradient(
        to top,
        rgba(0,0,0,.18),
        transparent
    );
}

/* ІНДИКАТОР */
.sa-carousel-progress {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);

    display: flex;
    gap: 6px;

    padding: 7px 9px;
    border-radius: 20px;

    background: rgba(20, 24, 28, .28);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

/* Крапка */
.sa-carousel-dot {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: rgba(255,255,255,.42);

    transition:
        width .35s ease,
        background .35s ease,
        transform .35s ease;
}

/* Активна крапка */
.sa-carousel-dot.active {
    width: 18px;
    border-radius: 10px;
    background: #fff;
}

/* МОБІЛЬНА ВЕРСІЯ */
@media (max-width: 700px) {

    .sa-carousel {
        border-radius: 22px;
    }

    .sa-carousel-slide {
        aspect-ratio: 4 / 3;
    }

    .sa-carousel-progress {
        bottom: 12px;
    }
}

/* Дуже вузькі екрани */
@media (max-width: 420px) {

    .sa-carousel {
        border-radius: 18px;
    }

    .sa-carousel-slide {
        aspect-ratio: 4 / 3;
    }
}

/* Якщо користувач просить зменшити анімації */
@media (prefers-reduced-motion: reduce) {

    .sa-carousel-track {
        transition: none;
    }

    .sa-carousel-slide img {
        transition: none;
    }
}
</style>


<div class="sa-carousel" id="saCarousel">

    <div class="sa-carousel-viewport">

        <div class="sa-carousel-track" id="saCarouselTrack">

            <!-- ФОТО 1 -->
            <div class="sa-carousel-slide active">
                <img
                    src="images/photo-1.jpg"
                    alt="SA-MASTER — монтаж сантехніки"
                    draggable="false"
                >
            </div>

            <!-- ФОТО 2 -->
            <div class="sa-carousel-slide">
                <img
                    src="images/photo-2.jpg"
                    alt="SA-MASTER — монтаж сантехніки"
                    draggable="false"
                >
            </div>

            <!-- ФОТО 3 -->
            <div class="sa-carousel-slide">
                <img
                    src="images/photo-3.jpg"
                    alt="SA-MASTER — монтаж сантехніки"
                    draggable="false"
                >
            </div>

            <!-- ФОТО 4 -->
            <div class="sa-carousel-slide">
                <img
                    src="images/photo-4.jpg"
                    alt="SA-MASTER — монтаж сантехніки"
                    draggable="false"
                >
            </div>

            <!-- ФОТО 5 -->
            <div class="sa-carousel-slide">
                <img
                    src="images/photo-5.jpg"
                    alt="SA-MASTER — монтаж сантехніки"
                    draggable="false"
                >
            </div>

        </div>

    </div>


    <!-- ІНДИКАТОРИ -->
    <div class="sa-carousel-progress" id="saCarouselDots"></div>

</div>


<script>
(function () {

    const carousel = document.getElementById("saCarousel");
    const track = document.getElementById("saCarouselTrack");
    const slides = Array.from(
        track.querySelectorAll(".sa-carousel-slide")
    );
    const dotsContainer =
        document.getElementById("saCarouselDots");

    if (!carousel || !track || !slides.length) return;


    /* ========================================
       НАЛАШТУВАННЯ
    ======================================== */

    const AUTO_DELAY = 4500;
    const TRANSITION_TIME = 650;


    /* ========================================
       СТАН
    ======================================== */

    let currentIndex = 0;
    let autoTimer = null;

    let startX = 0;
    let currentX = 0;

    let isDragging = false;
    let isPointerDown = false;

    let dragOffset = 0;


    /* ========================================
       ІНДИКАТОРИ
    ======================================== */

    slides.forEach((_, index) => {

        const dot = document.createElement("div");

        dot.className = "sa-carousel-dot";

        if (index === 0) {
            dot.classList.add("active");
        }

        dotsContainer.appendChild(dot);

    });

    const dots = Array.from(
        dotsContainer.querySelectorAll(".sa-carousel-dot")
    );


    /* ========================================
       ПОЗИЦІЯ
    ======================================== */

    function getWidth() {
        return carousel.clientWidth;
    }


    function updatePosition(animate = true) {

        track.style.transition = animate
            ? `transform ${TRANSITION_TIME}ms cubic-bezier(.22,.61,.36,1)`
            : "none";

        track.style.transform =
            `translate3d(-${currentIndex * getWidth()}px, 0, 0)`;


        slides.forEach((slide, index) => {

            slide.classList.toggle(
                "active",
                index === currentIndex
            );

        });


        dots.forEach((dot, index) => {

            dot.classList.toggle(
                "active",
                index === currentIndex
            );

        });

    }


    /* ========================================
       ПЕРЕХІД ДО СЛАЙДУ
    ======================================== */

    function goTo(index) {

        if (index < 0) {
            index = slides.length - 1;
        }

        if (index >= slides.length) {
            index = 0;
        }

        currentIndex = index;

        updatePosition(true);

    }


    /* ========================================
       НАСТУПНИЙ СЛАЙД
    ======================================== */

    function nextSlide() {

        goTo(currentIndex + 1);

    }


    /* ========================================
       ПОПЕРЕДНІЙ СЛАЙД
    ======================================== */

    function previousSlide() {

        goTo(currentIndex - 1);

    }


    /* ========================================
       АВТОПРОКРУТКА
    ======================================== */

    function startAutoPlay() {

        stopAutoPlay();

        autoTimer = setInterval(() => {

            if (!document.hidden && !isPointerDown) {
                nextSlide();
            }

        }, AUTO_DELAY);

    }


    function stopAutoPlay() {

        if (autoTimer) {

            clearInterval(autoTimer);

            autoTimer = null;

        }

    }


    function restartAutoPlay() {

        stopAutoPlay();

        startAutoPlay();

    }


    /* ========================================
       POINTER DOWN
    ======================================== */

    carousel.addEventListener(
        "pointerdown",
        function (event) {

            if (event.pointerType === "mouse" &&
                event.button !== 0) {
                return;
            }

            isPointerDown = true;
            isDragging = false;

            startX = event.clientX;
            currentX = startX;

            dragOffset = 0;

            track.style.transition = "none";

            carousel.classList.add("is-dragging");

            try {
                carousel.setPointerCapture(event.pointerId);
            } catch (e) {}

            stopAutoPlay();

        }
    );


    /* ========================================
       POINTER MOVE
    ======================================== */

    carousel.addEventListener(
        "pointermove",
        function (event) {

            if (!isPointerDown) return;

            currentX = event.clientX;

            dragOffset = currentX - startX;

            if (Math.abs(dragOffset) > 5) {
                isDragging = true;
            }

            const baseOffset =
                -(currentIndex * getWidth());

            track.style.transform =
                `translate3d(${baseOffset + dragOffset}px,0,0)`;

        }
    );


    /* ========================================
       POINTER UP
    ======================================== */

    function finishDrag() {

        if (!isPointerDown) return;

        isPointerDown = false;

        carousel.classList.remove("is-dragging");

        const width = getWidth();

        const threshold =
            Math.min(width * 0.18, 110);


        /* Якщо свайп достатньо великий */
        if (Math.abs(dragOffset) > threshold) {

            if (dragOffset < 0) {
                nextSlide();
            } else {
                previousSlide();
            }

        } else {

            /* Повернення назад */
            updatePosition(true);

        }

        dragOffset = 0;

        restartAutoPlay();

    }


    carousel.addEventListener(
        "pointerup",
        finishDrag
    );

    carousel.addEventListener(
        "pointercancel",
        finishDrag
    );

    carousel.addEventListener(
        "lostpointercapture",
        function () {

            if (isPointerDown) {
                finishDrag();
            }

        }
    );


    /* ========================================
       ЗАПОБІГАЄМО КЛІКУ ПІСЛЯ СВАЙПУ
    ======================================== */

    carousel.addEventListener(
        "click",
        function (event) {

            if (isDragging) {

                event.preventDefault();
                event.stopPropagation();

                isDragging = false;

            }

        },
        true
    );


    /* ========================================
       RESIZE
    ======================================== */

    let resizeTimer;

    window.addEventListener(
        "resize",
        function () {

            clearTimeout(resizeTimer);

            resizeTimer = setTimeout(() => {

                updatePosition(false);

            }, 100);

        }
    );


    /* ========================================
       ВКЛАДКА НЕАКТИВНА
    ======================================== */

    document.addEventListener(
        "visibilitychange",
        function () {

            if (document.hidden) {

                stopAutoPlay();

            } else {

                restartAutoPlay();

            }

        }
    );


    /* ========================================
       ПАУЗА ПРИ НАВЕДЕННІ НА ПК
    ======================================== */

    carousel.addEventListener(
        "mouseenter",
        function () {

            if (window.matchMedia(
                "(hover: hover)"
            ).matches) {

                stopAutoPlay();

            }

        }
    );


    carousel.addEventListener(
        "mouseleave",
        function () {

            if (window.matchMedia(
                "(hover: hover)"
            ).matches) {

                restartAutoPlay();

            }

        }
    );


    /* ========================================
       СТАРТ
    ======================================== */

    updatePosition(false);

    startAutoPlay();

})();
</script>
