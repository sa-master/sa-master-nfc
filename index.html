<html lang="uk">
<head>
    <meta charset="UTF-8" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SA MASTER — Комплексний монтаж сантехніки" />
    <meta name="twitter:description" content="Комплексний монтаж сантехніки у новобудовах Києва" />
    <meta name="twitter:image" content="https://sa-master.kyiv.ua/og-image.jpg" />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet" />
    <style>
        /* ── змінні ── */
        :root {
            --color-primary: #1976d2;
            --color-primary-light: #42a5f5;
            --color-text: #182228;
            --color-text-secondary: #66727a;
            --color-bg-start: #edf5f8;
            --radius-card: 24px;
            --shadow-card: 0 12px 30px rgba(31, 67, 84, .12), inset 0 1px 0 rgba(255, 255, 255, .8);
            --transition-smooth: .55s cubic-bezier(.22, .61, .36, 1);
        }

        /* ── скидання ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Arial, sans-serif;
            color: var(--color-text);
            background: radial-gradient(circle at 50% -10%, rgba(255, 255, 255, .98), rgba(237, 247, 251, .94) 42%, rgba(228, 240, 245, .95) 100%);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ── layout ── */
        .page {
            width: min(620px, calc(100% - 24px));
            margin: 0 auto;
            padding: 18px 0 26px;
        }

        /* ── hero ── */
        .hero {
            position: relative;
            overflow: hidden;
            padding: 22px 16px 20px;
            border-radius: 30px;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, .98), rgba(255, 255, 255, .78)), linear-gradient(145deg, #fff, #edf5f8);
            border: 1px solid rgba(255, 255, 255, .9);
            box-shadow: 0 18px 45px rgba(32, 72, 94, .10), inset 0 1px 0 rgba(255, 255, 255, .9);
        }
        .hero::before {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            top: -130px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(70, 184, 223, .16);
            filter: blur(45px);
            border-radius: 50%;
            pointer-events: none;
        }
        .hero-header {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .logo-wrapper {
            width: 88px;
            height: 88px;
            flex: 0 0 88px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 8px 22px rgba(0, 0, 0, .08), inset 0 0 0 1px rgba(0, 0, 0, .035);
        }
        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .hero-brand {
            text-align: left;
        }
        .brand-name {
            font-family: "Rubik Mono One", sans-serif;
            font-size: 34px;
            line-height: 1;
            letter-spacing: -1.4px;
            color: #111;
            white-space: nowrap;
        }
        .brand-divider {
            width: 100%;
            height: 1px;
            margin: 8px 0 7px;
            background: linear-gradient(90deg, rgba(17, 17, 17, .75), rgba(70, 184, 223, .5), transparent);
        }
        .brand-sub {
            max-width: 220px;
            font-size: 12px;
            line-height: 1.25;
            font-weight: 600;
            letter-spacing: .5px;
            color: var(--color-text-secondary);
            text-transform: lowercase;
        }

        /* ── gallery ── */
        .gallery {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-card);
            background: #eaf1f4;
            box-shadow: var(--shadow-card);
        }
        .gallery-window {
            position: relative;
            width: 100%;
            overflow: hidden;
            aspect-ratio: 16/10;
        }
        .gallery-track {
            display: flex;
            height: 100%;
            transform: translate3d(0, 0, 0);
            transition: transform var(--transition-smooth);
            will-change: transform;
        }
        .gallery-slide {
            position: relative;
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #e7eef1;
        }
        .gallery-slide img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .gallery-counter {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 5;
            min-width: 42px;
            height: 28px;
            padding: 0 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(20, 28, 32, .42);
            border: 1px solid rgba(255, 255, 255, .28);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .gallery-dots {
            position: absolute;
            left: 50%;
            bottom: 11px;
            z-index: 5;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 8px;
            border-radius: 20px;
            background: rgba(20, 28, 32, .30);
            border: 1px solid rgba(255, 255, 255, .20);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .gallery-dot {
            width: 5px;
            height: 5px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, .50);
            transition: width .25s ease, background .25s ease;
            cursor: pointer;
        }
        .gallery-dot.active {
            width: 15px;
            border-radius: 5px;
            background: #fff;
        }

        /* ── info section ── */
        .info-section {
            position: relative;
            margin: 27px 0 25px;
            padding: 0 12px;
        }
        .info-story-nav {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: calc(100% - 18px);
            margin: 0 auto 13px;
            padding: 0 3px;
        }
        .info-story-nav::before {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            top: 50%;
            height: 1px;
            background: linear-gradient(90deg, rgba(100, 130, 142, .12), rgba(100, 130, 142, .30), rgba(100, 130, 142, .12));
        }
        .info-story-step {
            position: relative;
            z-index: 2;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(239, 247, 250, .96);
            border: 1px solid rgba(105, 137, 150, .20);
            color: #84949b;
            font-size: 7px;
            font-weight: 800;
            letter-spacing: .2px;
            transition: background .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease, transform .35s ease;
        }
        .info-story-step.active {
            background: #e9f8fc;
            color: var(--color-primary);
            border-color: rgba(66, 165, 245, .45);
            box-shadow: 0 0 0 4px rgba(66, 165, 245, .08), 0 4px 10px rgba(66, 165, 245, .13);
            transform: scale(1.12);
        }

        .info-deck-wrap {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .info-deck {
            position: relative;
            width: 100%;
            height: 190px;
            touch-action: pan-y;
            overflow: visible;
        }

        .info-card {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 20px 20px 18px;
            border-radius: 25px;
            background: linear-gradient(145deg, rgba(255, 255, 255, .98), rgba(242, 249, 252, .94));
            border: 1px solid rgba(255, 255, 255, .98);
            box-shadow: 0 15px 35px rgba(30, 70, 90, .11), 0 3px 8px rgba(30, 70, 90, .05), inset 0 1px 0 rgba(255, 255, 255, .95);
            cursor: pointer;
            overflow: hidden;
            transform-origin: center center;
            transition: transform .45s cubic-bezier(.22, .61, .36, 1), opacity .35s ease, box-shadow .35s ease;
            will-change: transform, opacity;
        }
        .info-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(66, 165, 245, .38), transparent);
            pointer-events: none;
        }
        .info-card::after {
            content: attr(data-story);
            position: absolute;
            right: -7px;
            bottom: -28px;
            z-index: 0;
            font-size: 112px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -8px;
            color: rgba(57, 115, 137, .055);
            pointer-events: none;
            user-select: none;
        }
        .info-card.top {
            transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
            z-index: 4;
        }
        .info-card.depth1 {
            transform: translate3d(0, 8px, 0) scale(.965) rotate(-.35deg);
            z-index: 3;
        }
        .info-card.depth2 {
            transform: translate3d(0, 15px, 0) scale(.93) rotate(.5deg);
            z-index: 2;
        }
        .info-card.depth3 {
            transform: translate3d(0, 21px, 0) scale(.895) rotate(-.6deg);
            z-index: 1;
        }
        .info-card.is-leaving-left {
            transform: translate3d(-125%, 35px, 0) scale(.91) rotate(-8deg);
            opacity: .08;
            z-index: 10;
        }
        .info-card.is-leaving-right {
            transform: translate3d(125%, 35px, 0) scale(.91) rotate(8deg);
            opacity: .08;
            z-index: 10;
        }
        .info-card:active {
            box-shadow: 0 9px 22px rgba(30, 70, 90, .09), inset 0 1px 0 rgba(255, 255, 255, .95);
        }

        .info-card-number {
            position: absolute;
            top: 17px;
            left: 20px;
            z-index: 3;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--color-primary);
        }
        .info-card-title {
            position: absolute;
            top: 17px;
            right: 20px;
            z-index: 3;
            font-size: 9px;
            font-weight: 750;
            letter-spacing: 1.15px;
            color: #71828a;
        }
        .info-card-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 17px;
            padding-top: 10px;
        }
        .info-card-photo {
            width: 102px;
            height: 102px;
            flex: 0 0 102px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .11), 0 0 0 1px rgba(50, 100, 120, .04);
        }
        .info-card-icon {
            width: 82px;
            height: 82px;
            flex: 0 0 82px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            background: linear-gradient(145deg, #fff, #edf7fb);
            box-shadow: inset 0 0 0 1px rgba(40, 100, 125, .06), 0 7px 18px rgba(40, 90, 110, .08);
        }
        .info-card-icon svg {
            width: 42px;
            height: 42px;
            display: block;
        }
        .info-card-text {
            min-width: 0;
            flex: 1;
        }
        .info-card-heading {
            font-size: 19px;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -.5px;
            color: #1d282e;
        }
        .info-card-description {
            margin-top: 7px;
            max-width: 250px;
            font-size: 13px;
            line-height: 1.4;
            color: #66777f;
        }
        .info-card-description strong {
            color: var(--color-primary);
        }

        .info-swipe-arrow {
            position: absolute;
            bottom: 15px;
            z-index: 4;
            width: 31px;
            height: 31px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(145deg, #fff, #e9f5fa);
            color: #176c91;
            font-size: 19px;
            font-weight: 500;
            line-height: 1;
            box-shadow: inset 0 0 0 1px rgba(40, 100, 125, .05), 0 4px 10px rgba(40, 90, 110, .05);
            pointer-events: none;
            user-select: none;
        }
        .info-swipe-arrow-left {
            left: 17px;
        }
        .info-swipe-arrow-right {
            right: 17px;
        }

        /* ── модальні вікна (уніфіковані) ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 11000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(8, 18, 24, .58);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .25s ease, visibility .25s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .modal-overlay.transition-target {
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        .modal-box {
            position: relative;
            width: 100%;
            max-width: 440px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 25px 20px 22px;
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(255, 255, 255, .98), rgba(244, 248, 250, .97));
            box-shadow: 0 25px 70px rgba(0, 0, 0, .22), inset 0 1px 0 rgba(255, 255, 255, .9);
            transform: translateY(18px) scale(.97);
            transition: transform .3s cubic-bezier(.22, .61, .36, 1);
            touch-action: pan-y;
            will-change: transform;
        }
        .modal-overlay.active .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 50%;
            background: rgba(120, 130, 140, .10);
            color: #53616a;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            z-index: 5;
        }
        .modal-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -.6px;
        }
        .modal-lead {
            margin-top: 6px;
            font-size: 14px;
            font-weight: 650;
            color: var(--color-primary);
        }
        .modal-text {
            margin-top: 18px;
            font-size: 15px;
            line-height: 1.55;
            color: #5f6c73;
        }
        .modal-text p {
            margin: 0 0 13px;
        }
        .modal-text strong {
            color: #20282d;
        }
        .modal-list {
            margin: 15px 0 0 18px;
            padding: 0;
            color: #5f6c73;
            font-size: 14px;
            line-height: 1.55;
        }
        .modal-list li {
            margin-bottom: 9px;
        }

        .about-modal-photo {
            display: block;
            width: 115px;
            height: 115px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 14px;
            border: 3px solid #fff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .12);
        }

        /* ── payment modal ── */
        .modal-payment-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 22px;
        }
        .modal-payment-button {
            position: relative;
            min-height: 112px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border-radius: 24px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 9px 20px rgba(0, 0, 0, .12), inset 0 1px 0 rgba(255, 255, 255, .32);
            transition: transform .18s ease, box-shadow .18s ease;
            overflow: hidden;
            cursor: pointer;
        }
        .modal-payment-button::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, .24), transparent 43%);
            pointer-events: none;
        }
        .modal-payment-button:active {
            transform: scale(.94);
            box-shadow: 0 4px 10px rgba(0, 0, 0, .12), inset 0 1px 0 rgba(255, 255, 255, .25);
        }
        .modal-payment-button svg {
            position: relative;
            z-index: 2;
            width: 48px;
            height: 48px;
            display: block;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .10));
        }
        .modal-payment-button span {
            position: relative;
            z-index: 2;
            line-height: 1;
        }
        .modal-payment-button.privat {
            background: linear-gradient(145deg, #67d45b 0%, #36b83d 48%, #159c35 100%);
        }
        .modal-payment-button.mono {
            background: linear-gradient(145deg, #303034 0%, #171719 52%, #09090a 100%);
        }

        /* ── lightbox ── */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 12000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: rgba(5, 12, 16, .88);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .25s ease, visibility .25s ease;
            touch-action: none;
        }
        .lightbox.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .lightbox img {
            max-width: 100%;
            max-height: 92vh;
            display: block;
            border-radius: 16px;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .40);
            transform: scale(.97);
            transition: transform .3s ease;
            touch-action: none;
            will-change: transform;
        }
        .lightbox.active img {
            transform: scale(1);
        }
        .lightbox-close {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 3;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 50%;
            background: rgba(255, 255, 255, .10);
            color: #fff;
            font-size: 25px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* ── social dock ── */
        .ios-social-shell {
            width: 350px;
            max-width: calc(100vw - 28px);
            margin: 24px auto 8px;
            padding: 11px 5px 10px;
            background: linear-gradient(180deg, rgba(255, 255, 255, .78), rgba(244, 248, 250, .68));
            border: 1px solid rgba(255, 255, 255, .92);
            box-shadow: 0 16px 38px rgba(38, 75, 91, .13), 0 3px 10px rgba(38, 75, 91, .06), inset 0 1px 0 rgba(255, 255, 255, .96), inset 0 -1px 0 rgba(130, 155, 165, .08);
            backdrop-filter: blur(24px) saturate(170%);
            -webkit-backdrop-filter: blur(24px) saturate(170%);
            overflow: hidden;
            border-radius: 31px;
        }
        .ios-social-viewport {
            width: 100%;
            overflow: hidden;
            touch-action: pan-y;
        }
        .ios-social-track {
            display: flex;
            width: 200%;
            transform: translate3d(0, 0, 0);
            transition: transform .48s cubic-bezier(.22, .61, .36, 1);
            will-change: transform;
        }
        .ios-social-track.social-hint {
            animation: socialHint 1s ease-in-out 1;
        }
        @keyframes socialHint {
            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }
            35% {
                transform: translate3d(-18px, 0, 0);
            }
            65% {
                transform: translate3d(0, 0, 0);
            }
        }

        .ios-social-page {
            width: 50%;
            flex: 0 0 50%;
            display: grid;
            grid-template-columns: repeat(4, 66px);
            column-gap: 12px;
            justify-content: center;
            padding: 0 2px;
        }
        .ios-social-item {
            width: 66px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .ios-social-button {
            position: relative;
            width: 66px;
            height: 66px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 18px;
            color: #fff;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 7px 15px rgba(44, 67, 76, .16), 0 2px 5px rgba(44, 67, 76, .09), inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -1px 0 rgba(0, 0, 0, .06);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .ios-social-button::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, .24), transparent 42%);
