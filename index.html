<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA-MASTER.pro - Комплексний монтаж сантехніки</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #ffffff; }

        /* Header Styles */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #ffffff 0%, #e6f0ff 100%);
            border-bottom: 1px solid #e0e0e0;
            position: relative;
            overflow: hidden;
        }

        /* Background decorative lines */
        .site-header::before {
            content: '';
            position: absolute;
            bottom: -50%;
            right: -5%;
            width: 800px;
            height: 800px;
            border: 2px solid rgba(65, 145, 255, 0.1);
            border-radius: 50%;
        }
        .site-header::after {
            content: '';
            position: absolute;
            bottom: -60%;
            right: -10%;
            width: 1000px;
            height: 1000px;
            border: 2px solid rgba(65, 145, 255, 0.08);
            border-radius: 50%;
        }

        /* Left section: Logo */
        .header-logo-container {
            display: flex;
            align-items: center;
            margin-right: 50px;
            position: relative;
            z-index: 2;
        }

        .logo-circle {
            width: 140px;
            height: 140px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* Bevel effect for logo ring */
        .logo-circle::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; bottom: 5px; right: 5px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffffff, #d1d9e6);
        }
        .logo-icon {
            width: 100px; height: 100px;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.2));
        }

        /* Vertical Separator */
        .header-separator {
            width: 1px;
            height: 100px;
            background-color: #d0d0d0;
            margin-right: 50px;
            position: relative;
            z-index: 2;
        }

        /* Right section: Text and Buttons */
        .header-content-right {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 2;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-name {
            font-size: 50px;
            font-weight: 800;
            color: #1a1a1a;
            letter-spacing: 0.5px;
        }

        .brand-separator {
            width: 40px; height: 6px;
            background-color: #3b82f6; /* Blue dash */
            border-radius: 3px;
        }

        .domain-pro {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            background-color: #3b82f6;
            padding: 6px 12px;
            border-radius: 6px;
            text-transform: lowercase;
            margin-left: -10px;
            margin-top: -5px;
        }

        .tagline {
            font-size: 18px;
            font-weight: 700;
            color: #4a4a4a;
            letter-spacing: 0.2px;
        }

        /* Action Buttons Container */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        /* Phone Button (Primary) */
        .btn-phone {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #3b82f6;
            color: #ffffff;
            padding: 15px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 26px;
            font-weight: 800;
            box-shadow: 0px 10px 25px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }
        .btn-phone:hover {
            transform: translateY(-3px);
            box-shadow: 0px 15px 35px rgba(59, 130, 246, 0.5);
        }
        .btn-phone i { font-size: 24px; }

        /* Save Contact Button (Secondary) */
        .btn-save-contact {
            display: flex;
            flex-direction: column;
            gap: 3px;
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-save-contact:hover {
            background-color: #e5e7eb;
        }
        .btn-save-contact-main {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-save-contact i { color: #3b82f6; font-size: 18px; }
        .btn-save-contact-text {
            text-align: left;
        }

        /* Responsive Adjustments */
        @media (max-width: 992px) {
            .site-header {
                flex-direction: column;
                padding: 30px 20px;
                text-align: center;
            }
            .header-logo-container {
                margin-right: 0;
                margin-bottom: 25px;
            }
            .header-separator { display: none; }
            .header-content-right {
                align-items: center;
            }
            .brand-name { font-size: 40px; }
            .header-actions {
                flex-direction: column;
                width: 100%;
            }
            .btn-phone, .btn-save-contact { width: 100%; justify-content: center; }
            .btn-save-contact { margin-top: 5px;}
            .btn-save-contact-main { justify-content: center; }
        }
        @media (max-width: 576px) {
            .logo-circle { width: 100px; height: 100px; }
            .logo-icon { width: 70px; height: 70px; }
            .brand-name { font-size: 32px; }
            .tagline { font-size: 16px; }
            .btn-phone { font-size: 20px; padding: 12px 20px; }
            .domain-pro { font-size: 14px; }
        }
    </style>
</head>
