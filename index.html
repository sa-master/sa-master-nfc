<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SA MASTER • монтаж майбутнього</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b121a;
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      justify-content: center;
      padding: 32px 16px 60px;
      color: #e8f0f5;
      min-height: 100vh;
      background-image: radial-gradient(circle at 20% 30%, rgba(0, 180, 255, 0.06) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(120, 0, 255, 0.05) 0%, transparent 45%);
    }

    .page {
      max-width: 480px;
      width: 100%;
    }

    /* ——— картка-голограма ——— */
    .glass-card {
      background: rgba(18, 30, 42, 0.55);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border-radius: 48px 48px 36px 36px;
      padding: 28px 22px 30px;
      border: 1px solid rgba(0, 200, 255, 0.18);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 200, 255, 0.06) inset;
      transition: all 0.25s;
    }

    /* ——— хедер ——— */
    .hero-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .logo-box {
      flex-shrink: 0;
      width: 76px;
      height: 76px;
      background: rgba(0, 180, 255, 0.08);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 200, 255, 0.3);
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.08);
      transition: 0.3s;
    }

    .logo-box img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(0, 200, 255, 0.3));
    }

    .brand-group {
      flex: 1;
    }

    .brand-name {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      background: linear-gradient(135deg, #b2f0ff, #6bc8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(0, 180, 255, 0.2);
    }

    .brand-sub {
      font-size: 14px;
      font-weight: 500;
      background: rgba(0, 200, 255, 0.12);
      border: 1px solid rgba(0, 200, 255, 0.15);
      padding: 4px 16px 6px 16px;
      border-radius: 60px;
      display: inline-block;
      margin-top: 6px;
      letter-spacing: 0.4px;
      color: #9ad0e6;
      backdrop-filter: blur(4px);
    }

    /* ——— галерея ——— */
    .gallery-wrap {
      position: relative;
      border-radius: 32px;
      overflow: hidden;
      margin: 8px 0 6px;
      border: 1px solid rgba(0, 200, 255, 0.2);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 200, 255, 0.1) inset;
      touch-action: pan-y;
    }

    .gallery-track {
      display: flex;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .gallery-slide {
      flex: 0 0 100%;
      aspect-ratio: 16 / 10;
      background: #13212b;
      cursor: pointer;
    }

    .gallery-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.9) contrast(1.05);
      transition: 0.4s;
    }

    .gallery-slide:hover img {
      filter: brightness(1) contrast(1.1);
    }

    .gallery-counter {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0, 20, 30, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 200, 255, 0.2);
      color: #b0e5ff;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 60px;
      letter-spacing: 0.5px;
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 30, 45, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 200, 255, 0.25);
      color: #ccefff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .gallery-arrow:hover {
      background: rgba(0, 180, 255, 0.25);
      border-color: #6bc8ff;
      transform: translateY(-50%) scale(1.05);
    }

    .gallery-prev { left: 12px; }
    .gallery-next { right: 12px; }

    .gallery-dots {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(0, 20, 30, 0.6);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 60px;
      border: 1px solid rgba(0, 200, 255, 0.1);
    }

    .gallery-dot {
      width: 7px;
      height: 7px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.25);
      border: none;
      padding: 0;
      transition: 0.3s;
      cursor: pointer;
    }

    .gallery-dot.active {
      width: 24px;
      background: #6bc8ff;
      box-shadow: 0 0 16px #6bc8ff66;
    }

    .gallery-sub {
      font-size: 13px;
      font-weight: 500;
      color: #8fc3da;
      text-align: center;
      margin: 14px 0 18px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* ——— кнопка дзвінка ——— */
    .action-row {
      display: flex;
      align-items: stretch;
      background: rgba(0, 180, 255, 0.08);
      border-radius: 100px;
      overflow: hidden;
      border: 1px solid rgba(0, 200, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 180, 255, 0.05);
      margin: 6px 0 20px;
      transition: 0.25s;
    }

    .action-row:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 180, 255, 0.08);
      border-color: rgba(0, 200, 255, 0.4);
    }

    .phone-link {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      text-decoration: none;
      color: white;
    }

    .phone-icon {
      background: rgba(0, 200, 255, 0.12);
      border-radius: 50%;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(0, 200, 255, 0.15);
    }

    .phone-icon svg {
      width: 22px;
      height: 22px;
      fill: #8fd0ff;
    }

    .phone-number {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #e0f2ff, #94d0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .save-btn {
      flex-shrink: 0;
      width: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 200, 255, 0.04);
      border-left: 1px solid rgba(0, 200, 255, 0.12);
      transition: 0.2s;
      cursor: pointer;
      text-decoration: none;
    }

    .save-btn:hover {
      background: rgba(0, 200, 255, 0.12);
    }

    .save-btn svg {
      width: 28px;
      height: 28px;
      stroke: #8fd0ff;
      fill: none;
      stroke-width: 1.8;
      filter: drop-shadow(0 0 8px rgba(0, 180, 255, 0.2));
    }

    /* ——— соціальні ——— */
    .social-grid {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin: 14px 0 24px;
    }

    .social-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      gap: 6px;
      flex: 1;
    }

    .social-circle {
      width: 54px;
      height: 54px;
      background: rgba(18, 40, 55, 0.6);
      backdrop-filter: blur(6px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 200, 255, 0.1);
      transition: 0.25s;
      color: #b0dfff;
    }

    .social-item:hover .social-circle {
      transform: translateY(-4px) scale(1.02);
      border-color: #6bc8ff;
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.12);
      background: rgba(0, 180, 255, 0.08);
    }

    .social-circle svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .social-label {
      font-size: 11px;
      font-weight: 500;
      color: #6f97ac;
      letter-spacing: 0.3px;
    }

    /* кольори */
    .social-item.instagram .social-circle { color: #e1306c; }
    .social-item.facebook .social-circle { color: #1877f2; }
    .social-item.youtube .social-circle { color: #ff0033; }
    .social-item.telegram .social-circle { color: #0088cc; }
    .social-item.viber .social-circle { color: #7360f2; }

    /* ——— про майстра ——— */
    .about-card {
      background: rgba(12, 30, 42, 0.5);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 20px 20px 16px;
      border: 1px solid rgba(0, 200, 255, 0.08);
      margin: 16px 0 22px;
    }

    .about-top {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .about-photo {
      flex-shrink: 0;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(0, 200, 255, 0.2);
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.06);
      background: #1c3340;
    }

    .about-text {
      font-size: 15px;
      line-height: 1.5;
      color: #c5dde8;
    }

    .about-text strong {
      color: #a0daff;
      font-weight: 600;
    }

    .readmore-btn {
      background: none;
      border: none;
      color: #6bc8ff;
      font-weight: 600;
      font-size: 15px;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
      border-bottom: 2px solid rgba(107, 200, 255, 0.2);
      transition: 0.2s;
    }

    .readmore-btn:hover {
      color: #8fd8ff;
      border-bottom-color: #6bc8ff;
    }

    .about-hidden {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.5s ease, opacity 0.4s ease, margin 0.3s ease;
      margin-top: 0;
    }

    .about-hidden.open {
      max-height: 700px;
      opacity: 1;
      margin-top: 16px;
    }

    .about-hidden p {
      font-size: 14.5px;
      line-height: 1.6;
      color: #c5dde8;
      margin-bottom: 12px;
    }

    .about-hidden p strong {
      color: #a0daff;
    }

    /* ——— оплата ——— */
    .payment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0 24px;
    }

    .payment-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 8px;
      background: rgba(12, 30, 42, 0.5);
      backdrop-filter: blur(6px);
      border-radius: 60px;
      border: 1px solid rgba(0, 200, 255, 0.08);
      text-decoration: none;
      color: #c5dde8;
      font-weight: 600;
      font-size: 15px;
      transition: 0.2s;
    }

    .payment-btn:hover {
      transform: translateY(-3px);
      border-color: rgba(0, 200, 255, 0.25);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      background: rgba(0, 180, 255, 0.04);
    }

    .pay-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.2px;
      color: white;
      flex-shrink: 0;
    }

    .pay-icon.privat {
      background: linear-gradient(145deg, #4caf50, #1d7a2a);
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.15);
    }

    .pay-icon.mono {
      background: linear-gradient(145deg, #2a2a2a, #000000);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* ——— бренди ——— */
    .brands-block {
      text-align: center;
      padding-top: 14px;
      border-top: 1px solid rgba(0, 200, 255, 0.06);
      margin-top: 2px;
    }

    .brands-label {
      font-size: 13px;
      font-weight: 500;
      color: #6f97ac;
      margin-bottom: 8px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .brands-list {
      font-size: 13px;
      font-weight: 500;
      color: #9ec4d9;
      line-height: 1.7;
      letter-spacing: 0.2px;
    }

    .brands-list span {
      display: inline-block;
      white-space: nowrap;
    }

    .brands-list .sep {
      color: #305b6e;
      margin: 0 5px;
    }

    /* ——— лайтбокс ——— */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(1, 12, 20, 0.94);
      backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 24px;
      object-fit: contain;
      border: 1px solid rgba(0, 200, 255, 0.1);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(0, 200, 255, 0.04);
      border: 1px solid rgba(0, 200, 255, 0.1);
      color: #b0dfff;
      font-size: 34px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-close:hover {
      background: rgba(0, 200, 255, 0.08);
      border-color: #6bc8ff;
    }

    /* ——— адаптив ——— */
    @media (max-width: 420px) {
      .glass-card { padding: 20px 16px 24px; }
      .brand-name { font-size: 30px; }
      .phone-number { font-size: 22px; }
      .logo-box { width: 64px; height: 64px; }
      .logo-box img { width: 48px; height: 48px; }
      .about-photo { width: 68px; height: 68px; }
      .social-circle { width: 46px; height: 46px; }
      .social-circle svg { width: 20px; height: 20px; }
      .gallery-arrow { width: 34px; height: 34px; font-size: 20px; }
      .phone-icon { width: 40px; height: 40px; }
      .phone-icon svg { width: 18px; height: 18px; }
    }
  </style>
</head>
