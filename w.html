<style>
:root{--bg:#EEF3F8;--card:#fff;--t:#1C1C1E;--tm:#5F6670;--line:#E1E7EE;--p:#0A6CD6;--soft:#E7F0FB;--red:#C62828;--in:#F7FAFD;--inb:#D3DEE9}
@media (prefers-color-scheme: dark){:root{--bg:#111418;--card:#1C2026;--t:#F2F4F7;--tm:#A3ACB7;--line:#2B323B;--p:#5AA6FF;--soft:#1E2E44;--red:#F87171;--in:#151A20;--inb:#323B46}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px}
.brand{font-size:22px;font-weight:900;letter-spacing:-.02em}.brand i{font-style:normal;color:var(--p)}
.firm{display:flex;align-items:center;gap:10px;min-width:0}.firm img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--card)}.firm b{font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--p);display:flex;align-items:center;justify-content:center}
h1{font-size:24px;font-weight:850;line-height:1.2;padding:0 4px}
.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bal small{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--p)}
.bal b{font-size:34px;font-weight:850;letter-spacing:-.02em;line-height:1.15}
.bal .sub{font-size:13px;color:var(--tm);font-weight:600}
.who{display:block;font-size:14px;font-weight:650;color:var(--tm);margin-top:2px}
.grp{font-size:20px;font-weight:850;padding:8px 4px 0}
.bars{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:4px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.bars i{display:block;width:100%;border-radius:6px;background:var(--soft)}.bars i.cur{background:var(--p)}.bars span{font-size:11px;color:var(--tm);font-weight:650}
.avg{font-size:13.5px;color:var(--tm);font-weight:650}.avg b{color:var(--t);font-weight:800;font-size:15px;letter-spacing:0;display:inline}.avg span{font-size:12px}
.due{display:flex;gap:22px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--tm);font-weight:650}.due b{display:block;font-size:18px;color:var(--t);font-weight:800}.bal .due small{display:block;font-size:11px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--tm)}.bal .due b{display:block;font-size:18px;color:var(--t);font-weight:800;letter-spacing:0}
#list{display:flex;flex-direction:column;gap:14px}
.statbar{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;max-width:616px;margin:0 auto;display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 16px;text-align:left;box-shadow:0 8px 24px rgba(16,40,80,.14)}
.statbar span{display:flex;flex-direction:column;min-width:0}.statbar small{font-size:11.5px;color:var(--tm);font-weight:700}.statbar b{font-size:17px;font-weight:850;color:var(--t);white-space:nowrap}.statbar span:first-child b{color:var(--p)}.statbar i{margin-left:auto;font-style:normal;font-size:22px;color:var(--tm)}
.search{font-size:16px}
.fold{margin-left:8px;color:var(--tm);font-size:15px;vertical-align:2px}
.card.obj.fin h2{color:var(--tm)}
.sheet .bal{display:flex;flex-direction:column;gap:10px;background:var(--in);border-radius:14px;padding:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;width:100%;border-top:1px solid var(--line);padding:10px 0 0;margin-top:2px;color:var(--p);font-weight:750;font-size:15px}.toggle svg{flex:0 0 auto}.toggle.up svg{transform:rotate(180deg)}
.lnk{color:var(--p);font-weight:750;font-size:14px;padding:0;text-align:left}
.obj h2{font-size:18px;font-weight:850;line-height:1.2}.card.obj{gap:8px;padding:14px}
.stage{display:inline-block;font-size:12px;font-weight:750;color:var(--p);background:var(--soft);border-radius:8px;padding:2px 8px;margin-left:6px;vertical-align:3px}
.addr{display:flex;align-items:center;gap:10px;justify-content:space-between}
.addr span{color:var(--tm);font-size:14.5px}
.route{flex:0 0 auto;background:var(--soft);color:var(--p);font-weight:800;font-size:13.5px;border-radius:10px;padding:7px 10px}
.crew{font-size:14px;color:var(--tm);font-weight:600}.crew a{color:var(--p);font-weight:750;text-decoration:none}.mine{color:var(--p);font-weight:800}
.earn{font-size:14px;color:var(--tm);font-weight:650}.earn b{color:var(--p);font-weight:800;font-size:15px}
.sec{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--p);margin-top:4px}
.note{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.box{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--inb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px}
.box.on{background:var(--p);border-color:var(--p)}
.note .tx{flex:1;min-width:0;padding-top:2px;overflow-wrap:anywhere}
.note.done .tx{color:var(--tm);text-decoration:line-through}
.note small,.row small{display:block;font-size:12px;color:var(--tm);font-weight:600;text-decoration:none}
.note small.by{color:var(--p)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.row b{white-space:nowrap}
.st{font-size:12px;font-weight:750;border-radius:8px;padding:2px 8px;white-space:nowrap;align-self:flex-start;background:var(--soft);color:var(--p)}
.st.wait{background:rgba(120,120,128,.14);color:var(--tm)}.st.no{background:rgba(198,40,40,.1);color:var(--red)}
.files{display:flex;flex-wrap:wrap;gap:8px}.th{width:56px;height:56px;border-radius:10px;background:var(--soft) center/cover no-repeat;flex:0 0 auto}.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:36px;padding:0 12px;border-radius:10px;background:var(--soft);color:var(--p);font-weight:750;font-size:14px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi{aspect-ratio:1;border-radius:12px;background:var(--soft) center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--p);font-weight:800;font-size:11px;padding:6px;text-align:center;overflow:hidden}
.fi b{font-size:16px}.fi span{color:var(--tm);font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.acts{display:flex;gap:8px;margin-top:2px}.acts .btn{height:40px;font-size:14px;border-radius:11px}
.btn{flex:1;height:46px;border-radius:13px;background:var(--p);color:#fff;font-weight:800;font-size:15px}
.sheet .btn{flex:0 0 auto;width:100%;min-height:48px}
.sheet .in>*{flex-shrink:0}
.btn.ghost{background:var(--soft);color:var(--p)}
.btn[disabled]{opacity:.5}
.empty{color:var(--tm);text-align:center;padding:30px 16px}
.more{display:flex;flex-direction:column}
.hidden{display:none!important}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:18px;font-weight:850}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.x{width:34px;height:34px;border-radius:50%;background:rgba(120,120,128,.14);font-size:15px;color:var(--tm)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--tm)}
input,textarea{font:inherit;font-size:16px;color:var(--t);background:var(--in);border:1px solid var(--inb);border-radius:12px;padding:11px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--p);outline-offset:1px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;border:1.5px dashed var(--inb);color:var(--p);font-weight:750}
.photo input{display:none}
.prev{max-height:160px;border-radius:12px;object-fit:cover;width:100%}
.nav button{width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--in);font-weight:750;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1C1C1E;color:#fff;border-radius:14px;padding:11px 16px;font-weight:650;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.foot{text-align:center;color:var(--tm);font-size:12.5px}
.foot button{color:var(--p);font-weight:700;font-size:12.5px}

 background-size:12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px;
 background-position:-1px -1px,-1px -1px,calc(100% + 1px) -1px,calc(100% + 1px) -1px,-1px calc(100% + 1px),-1px calc(100% + 1px),calc(100% + 1px) calc(100% + 1px),calc(100% + 1px) calc(100% + 1px)}

<body>
<main id="app"><div class="empty">Завантажуємо…</div></main>
<div id="sheet" class="sheet hidden" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheetIn"></div></div>
<script>
const SERVER = "https://sa-master-api.c6hht469s9.workers.dev";
let LINK = (location.hash || "").replace(/^#/, "").trim();
try{ if(/^[A-Za-z0-9]{6,20}$/.test(LINK)) localStorage.setItem("et_w", LINK); else LINK = localStorage.getItem("et_w") || ""; }catch(e){}
let D = null, openMore = {}, busy = false;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const money = v => (Math.round(Number(v) || 0)).toLocaleString("uk-UA").replace(/,/g, " ") + " ₴";
const day = d => { const x = new Date(d); return isNaN(x) ? "" : x.toLocaleDateString("uk-UA", { day:"2-digit", month:"2-digit" }); };
const startDay = d => { const x = new Date(d + "T12:00:00"); return isNaN(x) ? esc(d) : x.toLocaleDateString("uk-UA", { day:"numeric", month:"long" }); };
function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }

async function load(){
  if(!LINK){ $("app").innerHTML = `<div class="card empty">Посилання неповне. Попросіть майстра надіслати його ще раз.</div>`; return; }
  try{
    const r = await fetch(`${SERVER}/w/${LINK}`, { cache:"no-store" });
    const d = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(d.error || "Не вдалося відкрити");
    D = d; render();
  }catch(e){
    if(!D) $("app").innerHTML = `<div class="card empty">${esc(e.message)}<br><br><button class="lnk" onclick="load()">Спробувати ще раз</button></div>`;
  }
}
/* Свої дії, яких майстер ще не бачив, показуємо одразу */
function view(){
  const st = D.state || {}, at = String(st.at || ""), ev = D.events || [];
  const objs = JSON.parse(JSON.stringify(st.objects || []));
  objs.forEach(o => {
    (o.notes || []).forEach(n => {
      const last = ev.filter(e => (e.type === "done" || e.type === "undone") && e.pid === o.pid && e.noteId === n.id && String(e.at) > at).pop();
      if(last){ n.done = last.type === "done"; n.doneAt = last.at; n.doneBy = n.done ? (D.personName || "") : ""; }
    });
    const reqIds = new Set((o.requests || []).map(r => r.id)), bIds = new Set((o.bought || []).map(r => r.id));
    ev.forEach(e => {
      if(e.pid !== o.pid) return;
      if(e.type === "request" && !reqIds.has(e.id)) (o.requests = o.requests || []).push({ id:e.id, text:e.text, at:e.at, status:"sent" });
      if(e.type === "bought" && !bIds.has(e.id)) (o.bought = o.bought || []).push({ id:e.id, text:e.text, amount:e.amount, date:e.date, status:"sent" });
    });
  });
  return { st, objs };
}
function render(){
  const { st, objs } = view();
  const b = st.balance || { balance:0, earned:0, paid:0, bought:0 };
  const name = D.personName || "";
  const tel = String(D.masterPhone || "").replace(/[^\d+]/g, "");
  document.title = name ? `${name} · et.app` : "et.app";
  const stTag = s => s === "sent" ? `<span class="st wait">надіслано</span>` : s === "new" || s === "wait" ? `<span class="st wait">майстер бачить</span>` : s === "buy" ? `<span class="st">купуємо</span>` : s === "done" ? `<span class="st">✓ зроблено</span>` : s === "ok" ? `<span class="st">✓ прийнято</span>` : s === "no" ? `<span class="st no">не прийнято</span>` : "";
  const note = (o, n) => `<div class="note ${n.done ? "done" : ""}"><button class="box ${n.done ? "on" : ""}" onclick="tick('${esc(o.pid)}','${esc(n.id)}',${n.done ? "false" : "true"})" aria-label="${n.done ? "Зняти галочку" : "Зроблено"}">${n.done ? "✓" : ""}</button><span class="tx">${n.mine ? `<b class="mine">Вам:</b> ` : ""}${esc(n.text)}${n.done && n.doneBy ? `<small class="by">✓ ${esc(n.doneBy)}, ${day(n.doneAt)}</small>` : ""}</span></div>`;
  const obj = o => {
    const open = (o.notes || []).filter(n => !n.done), done = (o.notes || []).filter(n => n.done);
    const reqs = (o.requests || []).slice().reverse().slice(0, 8), bought = (o.bought || []).slice().reverse().slice(0, 8);
    const more = openMore[o.pid];
    const folded = (o.phase === "plan" || o.phase === "done") && !openMore["p_" + o.pid];
    const tag = o.phase === "plan" ? (o.start ? "з " + startDay(o.start) : "дата ще не відома") : o.phase === "done" ? "завершено" : o.stage;
    if(folded) return `<section class="card obj ${o.phase === "done" ? "fin" : ""}">
      <h2>${esc(o.title)}<span class="stage">${esc(tag)}</span></h2>
      ${o.address ? `<div class="addr"><span>${esc(o.address)}</span><button class="route" onclick="routeObj('${esc(o.pid)}')">⌖ Як добратись</button></div>` : ""}
      ${(o.notes || []).length || (o.files || []).length ? `<button class="toggle" onclick="openMore['p_${esc(o.pid)}']=true;render()"><span>${o.phase === "done" ? "Деталі" : "Проєкт і нотатки"}${(o.files || []).length ? ` · ${o.files.length}` : ""}</span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>` : ""}
    </section>`;
    return `<section class="card obj">
      <h2>${esc(o.title)}${tag ? `<span class="stage">${esc(tag)}</span>` : ""}</h2>
      ${o.address ? `<div class="addr"><span>${esc(o.address)}</span><button class="route" onclick="routeObj('${esc(o.pid)}')">⌖ Як добратись</button></div>` : ""}
      ${(o.crew || []).length ? `<div class="crew">На об’єкті також: ${o.crew.map(c => { const t = String(c.phone || "").replace(/[^\d+]/g, ""); return t ? `<a href="tel:${esc(t)}">${esc(c.name)}</a>` : esc(c.name); }).join(", ")}</div>` : ""}
      ${o.earned ? `<div class="earn">Ваш заробіток <b>${money(o.earned)}</b></div>` : ""}
      ${open.length ? `<div class="sec">Зробити</div>${open.map(n => note(o, n)).join("")}` : (o.notes || []).length ? `<div class="sec">Нотатки</div><div class="note"><span class="tx" style="color:var(--tm)">✓ Усе зроблено</span></div>` : ""}
      ${done.length ? `<button class="lnk" onclick="openMore['${esc(o.pid)}']=!openMore['${esc(o.pid)}'];render()">${more ? "Сховати зроблене" : `Зроблено ${done.length}`}</button>${more ? done.map(n => note(o, n)).join("") : ""}` : ""}
      ${(o.files || []).length ? `<div class="sec">Проєкт і фото</div><div class="files">${o.files.filter(f => f.type !== "link" && f.type !== "application/pdf").map(f => `<a class="th" href="${SERVER}/f/${esc(f.id)}" target="_blank" rel="noopener" style="background-image:url('${SERVER}/f/${esc(f.id)}')"></a>`).join("")}${o.files.filter(f => f.type === "link" || f.type === "application/pdf").map(f => `<a class="chip" href="${f.type === "link" ? esc(f.url) : `${SERVER}/f/${esc(f.id)}`}" target="_blank" rel="noopener">${f.type === "link" ? "🔗" : "📄"} ${esc(f.name)}</a>`).join("")}</div>` : ""}
      ${reqs.length ? `<div class="sec">Що потрібно</div>${reqs.map(r => `<div class="row"><span>${esc(r.text)}<small>${day(r.at)}</small></span>${stTag(r.status)}</div>`).join("")}` : ""}
      ${bought.length ? `<div class="sec">Купив за свої</div>${bought.map(r => `<div class="row"><span>${money(r.amount)}${r.text ? ` · ${esc(r.text)}` : ""}<small>${day(r.date)}</small></span>${stTag(r.status)}</div>`).join("")}` : ""}
      ${o.phase === "done" ? "" : `<div class="acts"><button class="btn ghost" onclick="askForm('${esc(o.pid)}')">＋ Потрібно</button><button class="btn ghost" onclick="boughtForm('${esc(o.pid)}')">＋ Купив за свої</button></div>`}
      ${o.phase !== "now" ? `<button class="toggle up" onclick="openMore['p_${esc(o.pid)}']=false;render()"><span>Згорнути</span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>` : ""}
    </section>`;
  };
  $("app").innerHTML = `
    <div class="top">${(() => { const br = st.brand || {}; const nm = br.company || D.masterName || ""; return nm || br.logo ? `<span class="firm">${br.logo ? `<img src="${esc(br.logo)}" alt="">` : ""}<b>${esc(nm)}</b></span>` : `<span class="brand">et<i>.app</i></span>`; })()}${tel ? `<a class="call" href="tel:${esc(tel)}" aria-label="Подзвонити майстру" title="Подзвонити майстру"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></a>` : ""}</div>
    <h1>Мої об’єкти</h1>
    ${objs.length > 3 ? `<input class="search" type="search" placeholder="Пошук: ЖК, вулиця" value="${esc(searchQ)}" oninput="searchQ=this.value;renderList()">` : ""}
    <div id="list">
    ${(() => {
      if(!objs.length) return `<div class="card empty">Поки що об’єктів немає. Коли майстер призначить вас на об’єкт — він з’явиться тут.</div>`;
      const q = searchQ.trim().toLowerCase();
      const list = q ? objs.filter(o => (o.title + " " + (o.address || "")).toLowerCase().includes(q)) : objs;
      const now = list.filter(o => o.phase === "now"), plan = list.filter(o => o.phase === "plan").sort((a, b) => String(a.start || "9999").localeCompare(String(b.start || "9999"))), fin = list.filter(o => o.phase === "done");
      if(q && !list.length) return `<div class="card empty" style="padding:18px">Нічого не знайдено</div>`;
      return (now.length ? now.map(obj).join("") : q ? "" : `<div class="card empty" style="padding:18px">Зараз в роботі нічого немає</div>`)
        + (plan.length ? `<h2 class="grp">Заплановані</h2>${plan.map(obj).join("")}` : "")
        + (fin.length ? `<h2 class="grp">Завершені</h2>${fin.map(obj).join("")}` : "");
    })()}
    </div>
    <div class="foot">Оновлено ${st.at ? new Date(st.at).toLocaleString("uk-UA", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) : "—"} · <button onclick="load()">оновити</button> · <span style="opacity:.7">в. 29.10 02:30</span>${navApp() ? ` · <button onclick="route('', true)">як добиратись: ${esc(NAV[navApp()].name)}</button>` : ""}</div>
    ${statBar(st, b)}`;
}
function renderList(){ render(); const i = document.querySelector(".search"); if(i){ i.focus(); const n = i.value.length; try{ i.setSelectionRange(n, n); }catch(e){} } }
let searchQ = "";
function statsHtml(st, b){
      const em = st.months || {}, now = new Date();
      const key = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
      const keys = [5, 4, 3, 2, 1, 0].map(k => key(new Date(now.getFullYear(), now.getMonth() - k, 15)));
      const cur = keys[5], max = Math.max(1, ...keys.map(k => em[k] || 0));
      const IN = ["січні", "лютому", "березні", "квітні", "травні", "червні", "липні", "серпні", "вересні", "жовтні", "листопаді", "грудні"];
      const short = k => new Date(Number(k.slice(0, 4)), Number(k.slice(5)) - 1, 15).toLocaleDateString("uk-UA", { month:"short" }).replace(".", "");
      return `<small>Заробив у ${IN[now.getMonth()]}</small><b>${money(em[cur] || 0)}</b>
      <div class="bars">${keys.map(k => `<div><i style="height:${Math.max(4, Math.round((em[k] || 0) / max * 100))}%" class="${k === cur ? "cur" : ""}"></i><span>${short(k)}</span></div>`).join("")}</div>
      ${(() => { const ks = Array.from({ length:12 }, (_, i) => key(new Date(now.getFullYear(), now.getMonth() - 11 + i, 15))); const f = ks.findIndex(k => (em[k] || 0) > 0.5); if(f < 0 || f > 10) return ""; const u = ks.slice(f); const v = u.reduce((s2, k) => s2 + (em[k] || 0), 0) / u.length; return `<div class="avg">Середнє за місяць <b>${money(v)}</b> <span>за ${u.length} ${u.length === 1 ? "місяць" : u.length < 5 ? "місяці" : "місяців"}</span></div>`; })()}
      <div class="due"><span>${b.balance >= -0.5 ? "До виплати" : "Видано наперед"}<b>${money(Math.abs(b.balance))}</b></span>${b.pending ? `<span>Ще буде<b>${money(b.pending)}</b><small>за об’єктами в роботі</small></span>` : ""}</div>
`;
    }
function statBar(st, b){
  const em = st.months || {}, now = new Date();
  const k = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const mon = now.toLocaleDateString("uk-UA", { month:"long" });
  return `<button class="statbar" onclick="openBalance()"><span><small>${mon.charAt(0).toUpperCase() + mon.slice(1)}</small><b>${money(em[k] || 0)}</b></span><span><small>${b.balance >= -0.5 ? "До виплати" : "Видано наперед"}</small><b>${money(Math.abs(b.balance))}</b></span>${b.pending ? `<span><small>Ще буде</small><b>${money(b.pending)}</b></span>` : ""}<i>›</i></button>`;
}


/* ---- Дії ---- */
async function send(body){
  const r = await fetch(`${SERVER}/w/${LINK}/event`, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(d.error || "Не вдалося надіслати");
  D.events = (D.events || []).concat(d.event);
  render();
}
async function tick(pid, noteId, done){
  try{ await send({ type: done ? "done" : "undone", pid, noteId }); if(done) toast("✓ Майстер побачить"); }
  catch(e){ toast(e.message); }
}
function sheet(html){ $("sheetIn").innerHTML = html; $("sheet").classList.remove("hidden"); }
function closeSheet(){ $("sheet").classList.add("hidden"); }
function objTitle(pid){ const o = ((D.state || {}).objects || []).find(x => x.pid === pid); return o ? esc(o.title) : ""; }
function askForm(pid){
  sheet(`<div class="hd"><h3>Що потрібно на об’єкт</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <div style="color:var(--tm);font-size:14px">${objTitle(pid)}</div>
    <label class="f">Напишіть майстру<textarea id="askText" placeholder="Привезти три коліна 50"></textarea></label>
    <button class="btn" id="askBtn" onclick="askSend('${esc(pid)}')">Надіслати</button>`);
  setTimeout(() => $("askText").focus(), 80);
}
async function askSend(pid){
  const text = $("askText").value.trim();
  if(!text){ toast("Напишіть, що потрібно"); return; }
  $("askBtn").disabled = true;
  try{ await send({ type:"request", pid, text }); closeSheet(); toast("Надіслано майстру"); }
  catch(e){ toast(e.message); $("askBtn").disabled = false; }
}
let photoBlob = null;
function boughtForm(pid){
  photoBlob = null;
  const today = new Date(); const iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
  sheet(`<div class="hd"><h3>Купив за свої</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <div style="color:var(--tm);font-size:14px">${objTitle(pid)} · майстер підтвердить і поверне</div>
    <div class="r2"><label class="f">Сума, ₴<input id="bAmt" inputmode="decimal" placeholder="450"></label><label class="f">Дата<input id="bDate" type="date" value="${iso}"></label></div>
    <label class="f">Що купив<input id="bText" placeholder="3 коліна, герметик"></label>
    <label class="photo"><input type="file" accept="image/*" capture="environment" onchange="pickPhoto(this.files[0])">📷 Фото чека</label>
    <img id="bPrev" class="prev hidden" alt="">
    <button class="btn" id="bBtn" onclick="boughtSend('${esc(pid)}')">Надіслати</button>`);
}
function pickPhoto(file){
  if(!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    c.toBlob(b => { photoBlob = b; const p = $("bPrev"); p.src = URL.createObjectURL(b); p.classList.remove("hidden"); }, "image/jpeg", 0.7);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Не вдалося відкрити фото"); };
  img.src = url;
}
async function boughtSend(pid){
  const amount = Number(String($("bAmt").value).replace(/\s/g, "").replace(",", "."));
  if(!(amount > 0)){ toast("Впишіть суму"); return; }
  $("bBtn").disabled = true;
  try{
    let photo = "";
    if(photoBlob){
      const r = await fetch(`${SERVER}/w/${LINK}/photo`, { method:"POST", headers:{ "Content-Type":"image/jpeg" }, body:photoBlob });
      const d = await r.json().catch(() => ({}));
      if(!r.ok) throw new Error(d.error || "Фото не завантажилось");
      photo = d.id;
    }
    await send({ type:"bought", pid, amount, date:$("bDate").value, text:$("bText").value.trim(), photo });
    closeSheet(); toast("Надіслано — майстер підтвердить");
  }catch(e){ toast(e.message); $("bBtn").disabled = false; }
}
function openBalance(){
  const st = D.state || {}, b = st.balance || {};
  const rows = [
    ...(st.earnings || (st.objects || []).filter(o => o.earned).map(o => ({ title:o.title, amount:o.earned, note:o.earnedNote, done:o.done }))).map(o => `<div class="row"><span>${esc(o.title)}<small>${o.done ? "завершено" : "буде після завершення"}</small></span><b>${money(o.amount)}</b></div>`),
    ...(st.jobs || []).map(j => `<div class="row"><span>${esc(j.title)}<small>${day(j.date)}${j.place ? " · " + esc(j.place) : ""}${j.paid ? " · отримано одразу" : ""}</small></span><b>${money(j.amount)}</b></div>`)
  ];
  const mon = (st.money || []).slice().sort((x, y) => String(y.date).localeCompare(String(x.date)));
  sheet(`<div class="hd"><h3>Мій розрахунок</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="bal">${statsHtml(st, b)}</div>
    <div class="sec">Заробіток</div>${rows.join("") || `<div class="row"><span>Ще нічого</span></div>`}
    ${mon.length ? `<div class="sec">Видано й покупки</div>${mon.map(m => `<div class="row"><span>${m.kind === "pay" ? "Видано" : "Купив за свої"}<small>${day(m.date)}${m.note ? " · " + esc(m.note) : ""}</small></span><b>${m.kind === "pay" ? "−" : "+"}${money(m.amount)}</b></div>`).join("")}` : ""}
    <div class="row" style="font-weight:800"><span>${(b.balance || 0) >= -0.5 ? "До виплати зараз" : "Видано наперед"}</span><b>${money(Math.abs(b.balance || 0))}</b></div>`);
}

/* ---- Навігатор: вибір запам’ятовується ---- */
const NAV = {
  google:{ name:"Google Maps", url:a => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a)}` },
  apple:{ name:"Apple Карти", url:a => `https://maps.apple.com/?q=${encodeURIComponent(a)}` },
  waze:{ name:"Waze", url:a => `https://waze.com/ul?q=${encodeURIComponent(a)}&navigate=yes` },
  transit:{ name:"🚌 Громадським транспортом", url:a => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(a)}&travelmode=transit` }
};
function navApp(){ try{ const v = localStorage.getItem("et_nav") || ""; return NAV[v] ? v : ""; }catch(e){ return ""; } }
let navAddr = "";
function routeObj(pid){ const o = ((D.state || {}).objects || []).find(x => x.pid === pid); if(o && o.address) route(o.address); }
function route(addr, choose){
  if(addr) navAddr = addr;
  const app = navApp();
  if(app && !choose && navAddr){ navGo(app, navAddr); return; }
  sheet(`<div class="hd"><h3>Як добратись?</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="nav" style="display:flex;flex-direction:column;gap:8px">${Object.keys(NAV).map(k => `<button onclick="navPick('${k}')">${NAV[k].name}${k === app ? " ✓" : ""}</button>`).join("")}</div>
    <div style="color:var(--tm);font-size:13px">Запам’ятаємо вибір. Змінити — внизу сторінки.</div>`);
}
function navPick(k){ try{ localStorage.setItem("et_nav", k); }catch(e){} closeSheet(); render(); if(navAddr) navGo(k, navAddr); }
function navGo(app, addr){
  const a = NAV[app], q = encodeURIComponent(addr);
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const android = /Android/i.test(navigator.userAgent);
  const scheme = app === "waze" ? `waze://?q=${q}&navigate=yes` : app === "transit" ? (ios ? `comgooglemaps://?daddr=${q}&directionsmode=transit` : "") : app === "apple" ? (ios ? `maps://?daddr=${q}` : "") : ios ? `comgooglemaps://?daddr=${q}&directionsmode=driving` : android ? `google.navigation:q=${q}` : "";
  if(!scheme){ window.open(a.url(addr), "_blank"); return; }
  let left = false;
  const onHide = () => { if(document.visibilityState === "hidden") left = true; };
  document.addEventListener("visibilitychange", onHide);
  location.href = scheme;
  setTimeout(() => { document.removeEventListener("visibilitychange", onHide); if(!left && document.visibilityState === "visible") window.open(a.url(addr), "_blank"); }, 1600);
}

load();
window.addEventListener("focus", () => { if(D) load(); });
setInterval(() => { if(document.visibilityState === "visible" && D && $("sheet").classList.contains("hidden")) load(); }, 60000);
</script>
