<script>
(function(){
'use strict';

const API='https://sa-master-worker.c6hht469s9.workers.dev/object/';
const $=id=>document.getElementById(id);

const state={
  object:null,
  client:null,
  requests:[],
  events:[],
  files:[],
  important:[]
};

/* ==========================================
   HELPERS
========================================== */

function esc(value){
  if(value===null||value===undefined)return '';
  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function money(value){
  if(value===null||value===undefined||value==='')return '—';
  const n=Number(value);
  if(!Number.isFinite(n))return esc(value);
  return n.toLocaleString('uk-UA')+' грн';
}

function formatDate(value){
  if(!value)return '—';

  const s=String(value);
  const d=new Date(s.replace(' ','T'));

  if(Number.isNaN(d.getTime()))return esc(value);

  return d.toLocaleDateString('uk-UA',{
    day:'2-digit',
    month:'2-digit',
    year:'numeric'
  });
}

function formatDateTime(value){
  if(!value)return '—';

  const s=String(value);
  const d=new Date(s.replace(' ','T'));

  if(Number.isNaN(d.getTime()))return esc(value);

  return d.toLocaleDateString('uk-UA',{
    day:'2-digit',
    month:'2-digit',
    year:'numeric'
  })+' '+d.toLocaleTimeString('uk-UA',{
    hour:'2-digit',
    minute:'2-digit'
  });
}

/* ==========================================
   STATUS SYSTEM
========================================== */

const STATUS_LABELS={
  new:'Нова',
  processing:'Опрацювання',
  estimate:'Прорахунок',
  approved:'Погоджено',
  scheduled:'Заплановано',
  installation:'Монтаж',
  completed:'Завершено',
  service:'Сервіс',
  cancelled:'Відмова / Неактуально'
};

/*
  Технічні / старі варіанти статусів,
  які можуть прийти з бази.
*/
const STATUS_ALIASES={
  in_progress:'processing',
  'in-progress':'processing',
  progress:'processing',
  pending:'processing',
  active:'processing',
  new_request:'new',
  completed_work:'completed',
  done:'completed',
  canceled:'cancelled',
  cancelled_request:'cancelled'
};

function normalizeStatus(status,label){
  let value=status;

  if(value===null||value===undefined||value===''){
    value=label;
  }

  value=String(value||'')
    .trim()
    .toLowerCase()
    .replace(/\s+/g,'_');

  if(STATUS_ALIASES[value]){
    value=STATUS_ALIASES[value];
  }

  return value;
}

function statusClass(status,label){
  const normalized=normalizeStatus(status,label);

  return Object.prototype.hasOwnProperty.call(
    STATUS_LABELS,
    normalized
  )
    ? normalized
    : 'error';
}

function statusLabel(status,label){
  /*
    ВАЖЛИВО:
    спочатку використовуємо технічний status,
    а не status_label, якщо він містить IN_PROGRESS.
  */

  const normalized=normalizeStatus(status,label);

  if(STATUS_LABELS[normalized]){
    return STATUS_LABELS[normalized];
  }

  /*
    Якщо прийшов невідомий статус —
    показуємо його без небезпечного HTML.
  */
  return label||status||'—';
}

/* ==========================================
   ICONS
========================================== */

const ICONS={
  important:`
    <svg viewBox="0 0 24 24">
      <path d="M12 3l9 18H3L12 3z"/>
      <path d="M12 9v4"/>
      <path d="M12 17h.01"/>
    </svg>`,

  files:`
    <svg viewBox="0 0 24 24">
      <path d="M4 5.5A2.5 2.5 0 016.5 3H11l2 2h4.5A2.5 2.5 0 0120 7.5v11a2.5 2.5 0 01-2.5 2h-11A2.5 2.5 0 014 18.5z"/>
    </svg>`,

  works:`
    <svg viewBox="0 0 24 24">
      <path d="M14.7 6.3a5 5 0 00-6.9 6.9L3 18.9V21h2.1l4.8-4.8a5 5 0 006.9-6.9l-2.9 2.9-2.1-2.1z"/>
    </svg>`,

  history:`
    <svg viewBox="0 0 24 24">
      <path d="M3 12a9 9 0 109-9"/>
      <path d="M3 4v8h8"/>
      <path d="M12 7v5l3 2"/>
    </svg>`
};

/* ==========================================
   OBJECT
========================================== */

function renderObject(){

  const o=state.object||{};
  const c=state.client||{};

  $('objectCode').textContent=
    o.object_code||'—';

  $('objectName').textContent=
    o.name||'Обʼєкт';

  $('objectAddress').textContent=
    o.address||'Адреса не вказана';

  $('objectStart').textContent=
    formatDate(o.planned_start_date);

  $('objectCreated').textContent=
    formatDate(o.created_at);

  $('objectWorkType').textContent=
    o.work_type||'—';

  $('objectCompleted').textContent=
    formatDate(o.completed_at);

  $('objectNotes').textContent=
    o.notes||'—';

  $('clientName').textContent=
    c.name||o.client_name||'—';

  if(c.phone||o.client_phone){

    const phone=c.phone||o.client_phone;

    $('clientPhone').innerHTML=
      `<a href="tel:${esc(phone)}">${esc(phone)}</a>`;

  }else{

    $('clientPhone').textContent='—';

  }

  /* ========================================
     STATUS
  ======================================== */

  const status=$('objectStatus');

  const rawStatus=
    o.status||o.status_label||'new';

  const normalizedStatus=
    normalizeStatus(
      o.status,
      o.status_label
    );

  status.className=
    'status '+statusClass(
      rawStatus,
      o.status_label
    );

  status.textContent=
    statusLabel(
      normalizedStatus,
      o.status_label
    );

  /* ========================================
     EXTRA
  ======================================== */

  if(
    !o.notes &&
    !o.completed_at &&
    !o.work_type
  ){

    $('objectExtra')
      .classList.add('hidden');

  }else{

    $('objectExtra')
      .classList.remove('hidden');

  }
}

/* ==========================================
   FINANCE
========================================== */

function renderFinance(){

  const o=state.object||{};

  $('workCost').textContent=
    money(o.estimated_value);

  $('actualCost').textContent=
    money(o.actual_value);
}

/* ==========================================
   REQUESTS
========================================== */

function requestStatusDot(status){

  const s=normalizeStatus(status);

  if(s==='cancelled'){
    return 'red';
  }

  if(
    s==='estimate'||
    s==='scheduled'
  ){
    return 'orange';
  }

  if(
    s==='new'||
    s==='processing'||
    s==='installation'
  ){
    return 'blue';
  }

  return '';
}

function requestTitle(r){

  return r.type_label||
    r.type||
    'Заявка';
}

function renderRequests(){

  const items=state.requests||[];
  const box=$('works');

  $('worksCount').textContent=
    items.length
      ? `${items.length} ${items.length===1?'заявка':'заявок'}`
      : '0';

  if(!items.length){

    box.innerHTML=
      '<div class="empty">Заявок ще немає</div>';

    return;
  }

  box.innerHTML=
    items.slice(0,5).map(r=>{

      const s=normalizeStatus(
        r.status,
        r.status_label
      );

      return `
        <div class="work-row">

          <div class="work-status ${requestStatusDot(s)}"></div>

          <div class="work-main">

            <div class="work-name">
              ${esc(requestTitle(r))}
            </div>

            <div class="work-date">
              ${esc(
                statusLabel(
                  s,
                  r.status_label
                )
              )}
              ·
              ${formatDate(r.created_at)}
            </div>

          </div>

          <div class="work-price">
            —
          </div>

        </div>
      `;

    }).join('');
}

/* ==========================================
   IMPORTANT
========================================== */

function renderImportant(){

  const o=state.object||{};
  const c=state.client||{};

  state.important=[];

  if(c.name||c.phone){

    state.important.push({
      title:'Клієнт',
      text:[
        c.name,
        c.phone
      ].filter(Boolean).join(' · ')
    });

  }

  if(o.address){

    state.important.push({
      title:'Обʼєкт',
      text:o.address
    });

  }

  if(o.work_type){

    state.important.push({
      title:'Тип робіт',
      text:o.work_type
    });

  }

  if(o.notes){

    state.important.push({
      title:'Примітки',
      text:o.notes
    });

  }
}

/* ==========================================
   FILES
========================================== */

function renderFiles(){

  /*
    Файли поки не повертаються
    поточним endpoint /object/:code.
  */

  state.files=[];
}

/* ==========================================
   EVENTS
========================================== */

function renderEvents(){

  state.events=
    Array.isArray(state.events)
      ? state.events
      : [];
}

/* ==========================================
   MODAL
========================================== */

function renderPanel(type){

  const modal=$('panelModal');
  const title=$('modalTitle');
  const icon=$('modalIcon');
  const content=$('modalContent');

  icon.innerHTML=
    ICONS[type]||'';

  /* ----------------------------------------
     IMPORTANT
  ---------------------------------------- */

  if(type==='important'){

    title.textContent='Важливе';

    if(!state.important.length){

      content.innerHTML=
        '<div class="empty">Важлива інформація ще не додана.</div>';

    }else{

      content.innerHTML=
        '<div class="file-list">'+
        state.important.map(item=>`

          <div class="file-row">

            <div class="file-icon">
              ${ICONS.important}
            </div>

            <div class="file-info">

              <div class="file-name">
                ${esc(item.title)}
              </div>

              <div class="file-date">
                ${esc(item.text)}
              </div>

            </div>

          </div>

        `).join('')+
        '</div>';

    }
  }

  /* ----------------------------------------
     FILES
  ---------------------------------------- */

  if(type==='files'){

    title.textContent='Файли';

    if(!state.files.length){

      content.innerHTML=
        '<div class="empty">Файлів для цього обʼєкта поки немає.</div>';

    }else{

      content.innerHTML=
        '<div class="file-list">'+

        state.files.map(file=>{

          const url=
            file.url||
            file.href||
            '';

          return url

            ? `
              <a
                class="file-row"
                href="${esc(url)}"
                target="_blank"
                rel="noopener noreferrer"
              >

                <div class="file-icon">
                  ${ICONS.files}
                </div>

                <div class="file-info">

                  <div class="file-name">
                    ${esc(
                      file.name||
                      file.title||
                      'Файл'
                    )}
                  </div>

                  <div class="file-date">
                    ${formatDate(
                      file.created_at||
                      file.date
                    )}
                  </div>

                </div>

              </a>
            `

            : `
              <div class="file-row">

                <div class="file-icon">
                  ${ICONS.files}
                </div>

                <div class="file-info">

                  <div class="file-name">
                    ${esc(
                      file.name||
                      file.title||
                      'Файл'
                    )}
                  </div>

                  <div class="file-date">
                    ${formatDate(
                      file.created_at||
                      file.date
                    )}
                  </div>

                </div>

              </div>
            `;

        }).join('')+

        '</div>';
    }
  }

  /* ----------------------------------------
     WORKS / REQUESTS
  ---------------------------------------- */

  if(type==='works'){

    title.textContent='Заявки обʼєкта';

    if(!state.requests.length){

      content.innerHTML=
        '<div class="empty">Заявок ще немає.</div>';

    }else{

      content.innerHTML=
        '<div class="works">'+

        state.requests.map(r=>{

          const s=
            normalizeStatus(
              r.status,
              r.status_label
            );

          return `

            <div class="work-row">

              <div class="work-status ${requestStatusDot(s)}"></div>

              <div class="work-main">

                <div class="work-name">
                  ${esc(requestTitle(r))}
                </div>

                <div class="work-date">

                  Статус:
                  ${esc(
                    statusLabel(
                      s,
                      r.status_label
                    )
                  )}

                  <br>

                  ${formatDateTime(r.created_at)}

                </div>

              </div>

              <div class="work-price">
                —
              </div>

            </div>

          `;

        }).join('')+

        '</div>';
    }
  }

  /* ----------------------------------------
     HISTORY
  ---------------------------------------- */

  if(type==='history'){

    title.textContent='Історія обʼєкта';

    if(!state.events.length){

      content.innerHTML=
        '<div class="empty">Історія поки порожня.</div>';

    }else{

      content.innerHTML=
        '<div class="event-list">'+

        state.events.map(event=>`

          <div class="event-row">

            <div class="event-date">
              ${formatDateTime(event.created_at)}
            </div>

            <div class="event-text">
              ${esc(
                event.content||
                'Подія'
              )}
            </div>

            ${
              event.event_type
                ? `
                  <div class="event-sub">
                    ${esc(event.event_type)}
                  </div>
                `
                : ''
            }

          </div>

        `).join('')+

        '</div>';
    }
  }

  modal.classList.add('act');
  document.body.style.overflow='hidden';
}

function closePanel(){

  $('panelModal')
    .classList.remove('act');

  document.body.style.overflow='';
}

/* ==========================================
   LOAD OBJECT
========================================== */

async function loadObject(){

  const params=
    new URLSearchParams(
      window.location.search
    );

  const code=
    params.get('code');

  if(!code){

    $('objectCode').textContent=
      'КОД НЕ ВКАЗАНО';

    $('objectStatus').textContent=
      'Помилка';

    $('objectStatus').className=
      'status error';

    $('objectName').textContent=
      'Обʼєкт не визначено';

    $('objectAddress').textContent=
      'Відкрийте сторінку з параметром ?code=SM-2026-XXX';

    $('works').innerHTML=
      '<div class="empty">Немає коду обʼєкта.</div>';

    return;
  }

  $('objectCode').textContent=
    code;

  try{

    const response=
      await fetch(
        API+
        encodeURIComponent(code),
        {
          method:'GET',
          cache:'no-store',
          headers:{
            Accept:'application/json'
          }
        }
      );

    if(!response.ok){

      throw new Error(
        'HTTP '+response.status
      );

    }

    const data=
      await response.json();

    if(
      !data||
      data.ok!==true
    ){

      throw new Error(
        data?.error||
        data?.message||
        'Обʼєкт не знайдено'
      );

    }

    state.object=
      data.object||{};

    state.client=
      data.client||{};

    state.requests=
      Array.isArray(data.requests)
        ? data.requests
        : [];

    state.events=
      Array.isArray(data.events)
        ? data.events
        : [];

    renderObject();
    renderFinance();
    renderRequests();
    renderImportant();
    renderFiles();
    renderEvents();

  }catch(error){

    console.error(
      'OBJECT LOAD ERROR:',
      error
    );

    $('objectStatus').textContent=
      'Помилка';

    $('objectStatus').className=
      'status error';

    $('objectName').textContent=
      'Не вдалося завантажити обʼєкт';

    $('objectAddress').innerHTML=
      `<div class="error-box">
        Дані цифрового паспорта тимчасово недоступні.
      </div>`;

    $('objectStart').textContent='—';
    $('objectCreated').textContent='—';
    $('objectWorkType').textContent='—';
    $('objectCompleted').textContent='—';
    $('objectNotes').textContent='—';
    $('clientName').textContent='—';
    $('clientPhone').textContent='—';
    $('workCost').textContent='—';
    $('actualCost').textContent='—';

    $('works').innerHTML=
      '<div class="empty">Дані обʼєкта недоступні.</div>';

    $('worksCount').textContent='—';
  }
}

/* ==========================================
   EVENTS
========================================== */

document.addEventListener(
  'click',
  function(e){

    const dock=
      e.target.closest('.dock-btn');

    if(dock){

      renderPanel(
        dock.dataset.panel
      );

      return;
    }

    if(
      e.target.closest('#modalClose')||
      e.target.closest('#modalFooterClose')
    ){

      closePanel();

      return;
    }

    if(
      e.target===
      $('panelModal')
    ){

      closePanel();

    }
  }
);

$('showAllWorks').addEventListener(
  'click',
  function(){
    renderPanel('works');
  }
);

document.addEventListener(
  'keydown',
  function(e){

    if(e.key==='Escape'){
      closePanel();
    }

  }
);

/* ==========================================
   THEME
========================================== */

const themeToggle=
  $('themeToggle');

function applyTheme(theme){

  document.body.classList.toggle(
    'dark',
    theme==='dark'
  );

  localStorage.setItem(
    'theme',
    theme
  );
}

if(themeToggle){

  themeToggle.addEventListener(
    'click',
    function(){

      const dark=
        document.body.classList.contains(
          'dark'
        );

      applyTheme(
        dark?'light':'dark'
      );

    }
  );
}

const savedTheme=
  localStorage.getItem('theme');

if(
  savedTheme==='dark'||
  (
    !savedTheme&&
    window.matchMedia&&
    window.matchMedia(
      '(prefers-color-scheme: dark)'
    ).matches
  )
){

  document.body.classList.add('dark');

}

/* ==========================================
   YEAR
========================================== */

$('currentYear').textContent=
  new Date().getFullYear();

/* ==========================================
   START
========================================== */

loadObject();

})();
</script>
