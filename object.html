<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Об'єкт — SA-MASTER.PRO</title>
<meta name="description" content="Цифровий паспорт об'єкта SA-MASTER.PRO">

<link rel="icon" type="image/png" href="logo.png">

<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#007AFF;
  --blue-soft:rgba(0,122,255,.10);

  --bg:#f2f2f7;
  --card:rgba(255,255,255,.68);
  --card-strong:rgba(255,255,255,.86);

  --text:#111;
  --muted:#74747a;

  --line:rgba(0,0,0,.075);
  --shadow:0 14px 40px rgba(0,0,0,.07);

  --green:#34c759;
  --orange:#ff9500;
  --red:#ff3b30;

  --radius:25px;
}

[data-theme="dark"]{
  --bg:#0f1012;
  --card:rgba(35,36,40,.72);
  --card-strong:rgba(35,36,40,.92);

  --text:#fff;
  --muted:#a5a5aa;

  --line:rgba(255,255,255,.09);
  --shadow:0 16px 45px rgba(0,0,0,.30);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 15% 5%,
      rgba(0,122,255,.12),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 25%,
      rgba(0,122,255,.07),
      transparent 30%
    ),
    var(--bg);

  transition:
    background .25s ease,
    color .25s ease;

  overflow-x:hidden;
}

/* =========================
   PAGE
========================= */

.page{
  width:min(100%,620px);
  margin:auto;

  padding:
    max(18px,env(safe-area-inset-top))
    16px
    calc(40px + env(safe-area-inset-bottom));
}

/* =========================
   TOP BAR
========================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;

  color:var(--text);
  text-decoration:none;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.brand-text{
  min-width:0;
}

.brand-name{
  font-family:"Russo One",sans-serif;
  font-size:15px;
  letter-spacing:.3px;
}

.brand-sub{
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
}

.top-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  border:1px solid var(--line);
  border-radius:14px;

  background:var(--card);

  color:var(--text);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  cursor:pointer;

  box-shadow:0 4px 15px rgba(0,0,0,.035);
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;

  overflow:hidden;

  padding:25px 21px 20px;

  border:1px solid var(--line);
  border-radius:29px;

  background:var(--card);

  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);

  box-shadow:var(--shadow);
}

.hero::before{
  content:"";

  position:absolute;

  width:220px;
  height:220px;

  right:-110px;
  top:-100px;

  border-radius:50%;

  background:rgba(0,122,255,.13);

  filter:blur(35px);

  pointer-events:none;
}

.hero::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.20),
      transparent 45%
    );

  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:1;
}

.eyebrow{
  margin-bottom:8px;

  color:var(--blue);

  font-size:10px;
  font-weight:700;

  letter-spacing:.8px;
  text-transform:uppercase;
}

.object-name{
  margin:0;

  font-family:"Russo One",sans-serif;

  font-size:26px;
  line-height:1.13;
  letter-spacing:.1px;
}

.address{
  margin-top:9px;

  color:var(--muted);

  font-size:13px;
  line-height:1.45;
}

.status-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;

  margin-top:17px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;

  padding:7px 10px;

  border-radius:12px;

  background:rgba(52,199,89,.11);
  color:var(--green);

  font-size:11px;
  font-weight:650;
}

.badge.blue{
  background:var(--blue-soft);
  color:var(--blue);
}

.start{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  margin-top:17px;
  padding-top:14px;

  border-top:1px solid var(--line);
}

.start-label{
  color:var(--muted);
  font-size:11px;
}

.start-date{
  font-size:14px;
  font-weight:650;
}

/* =========================
   IOS DOCK
========================= */

.dock-wrap{
  margin-top:13px;

  padding:7px;

  border:1px solid var(--line);
  border-radius:25px;

  background:var(--card);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  box-shadow:0 10px 30px rgba(0,0,0,.045);
}

.dock{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}

.dock-button{
  min-width:0;

  padding:9px 3px 8px;

  border:0;
  border-radius:18px;

  background:transparent;

  color:var(--text);

  cursor:pointer;

  transition:
    background .18s ease,
    transform .18s ease;
}

.dock-button:active{
  transform:scale(.94);
  background:rgba(127,127,127,.08);
}

.dock-icon{
  width:34px;
  height:34px;

  display:grid;
  place-items:center;

  margin:0 auto 4px;

  border-radius:11px;

  background:var(--blue-soft);

  color:var(--blue);

  font-size:17px;
}

.dock-label{
  display:block;

  overflow:hidden;

  color:var(--muted);

  font-size:9px;
  line-height:1.15;

  white-space:nowrap;
  text-overflow:ellipsis;
}

/* =========================
   SECTION
========================= */

.section{
  margin-top:13px;

  padding:18px;

  border:1px solid var(--line);
  border-radius:25px;

  background:var(--card);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  box-shadow:0 9px 28px rgba(0,0,0,.035);
}

.section-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;

  margin-bottom:15px;
}

.section-title{
  margin:0;

  font-size:17px;
  line-height:1.2;
}

.section-subtitle{
  margin-top:3px;

  color:var(--muted);

  font-size:10px;
}

.section-count{
  flex:none;

  padding:6px 9px;

  border-radius:10px;

  background:rgba(127,127,127,.08);

  color:var(--muted);

  font-size:10px;
}

/* =========================
   FINANCE
========================= */

.finance{
  display:grid;
  gap:7px;
}

.finance-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  padding:12px 13px;

  border-radius:15px;

  background:rgba(127,127,127,.065);
}

.finance-label{
  color:var(--muted);
  font-size:12px;
  line-height:1.3;
}

.finance-value{
  white-space:nowrap;

  font-size:13px;
  font-weight:650;
}

.finance-value.balance{
  color:var(--green);
}

.finance-row.balance-row{
  background:rgba(52,199,89,.075);
}

/* =========================
   WORKS
========================= */

.work{
  padding:12px 0;

  border-bottom:1px solid var(--line);
}

.work:first-child{
  padding-top:0;
}

.work:last-child{
  border-bottom:0;
}

.work-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.work-name{
  min-width:0;

  font-size:12px;
  line-height:1.4;
}

.work-total{
  flex:none;

  white-space:nowrap;

  font-size:12px;
  font-weight:650;
}

.work-bottom{
  display:flex;
  justify-content:space-between;
  gap:10px;

  margin-top:5px;

  color:var(--muted);

  font-size:10px;
}

.total-box{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:14px;
  padding-top:14px;

  border-top:1px solid var(--line);

  font-size:15px;
  font-weight:700;
}

.show-more{
  width:100%;

  margin-top:12px;
  padding:11px;

  border:0;
  border-radius:14px;

  background:var(--blue-soft);

  color:var(--blue);

  font-size:12px;
  font-weight:600;

  cursor:pointer;
}

/* =========================
   STATUS CARD
========================= */

.passport-note{
  display:flex;
  align-items:center;
  gap:11px;
}

.passport-icon{
  width:38px;
  height:38px;

  flex:none;

  display:grid;
  place-items:center;

  border-radius:12px;

  background:var(--blue-soft);

  color:var(--blue);

  font-size:18px;
}

.passport-note-text{
  color:var(--muted);

  font-size:11px;
  line-height:1.4;
}

/* =========================
   EMPTY / ERROR
========================= */

.empty{
  padding:17px 5px 4px;

  color:var(--muted);

  text-align:center;

  font-size:12px;
}

.error{
  text-align:center;
  padding:40px 15px;
}

.error-icon{
  margin-bottom:10px;
  font-size:38px;
}

.error h2{
  margin:0 0 7px;
  font-size:18px;
}

.error p{
  margin:0;

  color:var(--muted);

  font-size:12px;
  line-height:1.5;
}

/* =========================
   LOADING
========================= */

.loading{
  padding:45px 10px;

  color:var(--muted);

  text-align:center;

  font-size:12px;
}

.spinner{
  width:26px;
  height:26px;

  margin:0 auto 12px;

  border:3px solid rgba(127,127,127,.18);
  border-top-color:var(--blue);

  border-radius:50%;

  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;

  display:none;
  align-items:flex-end;
  justify-content:center;

  padding:0;

  background:rgba(0,0,0,.34);

  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(100%,620px);

  max-height:88vh;

  overflow:auto;

  padding:
    10px
    18px
    calc(25px + env(safe-area-inset-bottom));

  border-radius:29px 29px 0 0;

  background:var(--card-strong);

  color:var(--text);

  box-shadow:0 -18px 55px rgba(0,0,0,.20);

  animation:sheetUp .23s ease-out;
}

@keyframes sheetUp{
  from{
    transform:translateY(35px);
    opacity:0;
  }

  to{
    transform:translateY(0);
    opacity:1;
  }
}

.handle{
  width:38px;
  height:5px;

  margin:1px auto 15px;

  border-radius:5px;

  background:rgba(127,127,127,.35);
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  margin-bottom:15px;
}

.sheet-head h3{
  margin:0;

  font-size:19px;
}

.close{
  width:37px;
  height:37px;

  display:grid;
  place-items:center;

  flex:none;

  border:0;
  border-radius:50%;

  background:rgba(127,127,127,.11);

  color:var(--text);

  font-size:22px;
  line-height:1;

  cursor:pointer;
}

/* =========================
   IMPORTANT
========================= */

.important{
  margin-bottom:8px;
  padding:13px;

  border-radius:15px;

  background:rgba(255,193,7,.09);
}

.important:last-child{
  margin-bottom:0;
}

.important-title{
  font-size:12px;
  font-weight:650;
}

.important-text{
  margin-top:5px;

  color:var(--muted);

  font-size:11px;
  line-height:1.45;
}

/* =========================
   FILES
========================= */

.file{
  display:flex;
  align-items:center;
  gap:11px;

  padding:12px 0;

  border-bottom:1px solid var(--line);
}

.file:last-child{
  border-bottom:0;
}

.file-icon{
  width:38px;
  height:38px;

  flex:none;

  display:grid;
  place-items:center;

  border-radius:12px;

  background:var(--blue-soft);

  font-size:17px;
}

.file-name{
  font-size:12px;
}

.file-meta{
  margin-top:3px;

  color:var(--muted);

  font-size:9px;
}

/* =========================
   HISTORY
========================= */

.event{
  position:relative;

  padding:
    0
    0
    18px
    24px;
}

.event:last-child{
  padding-bottom:0;
}

.event::before{
  content:"";

  position:absolute;

  left:3px;
  top:4px;

  width:9px;
  height:9px;

  border-radius:50%;

  background:var(--blue);

  box-shadow:0 0 0 4px var(--blue-soft);
}

.event::after{
  content:"";

  position:absolute;

  left:7px;
  top:17px;
  bottom:0;

  width:1px;

  background:var(--line);
}

.event:last-child::after{
  display:none;
}

.event-date{
  margin-bottom:5px;

  color:var(--muted);

  font-size:10px;
}

.event-text{
  font-size:12px;
  line-height:1.45;
}

/* =========================
   FOOTER
========================= */

.footer{
  margin-top:25px;

  color:var(--muted);

  text-align:center;

  font-size:9px;
  letter-spacing:.2px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){

  .page{
    padding-left:12px;
    padding-right:12px;
  }

  .hero{
    padding:22px 17px 18px;
  }

  .object-name{
    font-size:23px;
  }

  .section{
    padding:16px;
  }

  .dock-icon{
    width:32px;
    height:32px;
  }

  .dock-label{
    font-size:8px;
  }
}
</style>
</head>

<body>

<div class="page">

  <!-- TOP -->

  <header class="topbar">

    <a class="brand" href="https://sa-master.pro/">

      <img src="logo.png" alt="SA-MASTER.PRO">

      <div class="brand-text">

        <div class="brand-name">
          SA-MASTER.PRO
        </div>

        <div class="brand-sub">
          комплексний монтаж сантехніки
        </div>

      </div>

    </a>

    <div class="top-actions">

      <button
        class="icon-btn"
        id="themeBtn"
        aria-label="Змінити тему"
      >
        ◐
      </button>

    </div>

  </header>


  <!-- APPLICATION -->

  <main id="app">

    <div class="loading">

      <div class="spinner"></div>

      Завантаження цифрового паспорта…

    </div>

  </main>


  <div class="footer">

    SA-MASTER.PRO · цифровий паспорт об'єкта

  </div>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

  <div class="sheet">

    <div class="handle"></div>

    <div class="sheet-head">

      <h3 id="modalTitle">
        Інформація
      </h3>

      <button
        class="close"
        id="closeModal"
        aria-label="Закрити"
      >
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script>

/* =========================
   API
========================= */

const API =
  "https://sa-master-worker.c6hht469s9.workers.dev/object/";


const params =
  new URLSearchParams(location.search);


const objectCode =
  params.get("code") || "SM-2026-001";


const app =
  document.getElementById("app");


const modal =
  document.getElementById("modal");


const modalTitle =
  document.getElementById("modalTitle");


const modalContent =
  document.getElementById("modalContent");


let DATA = null;


/* =========================
   HELPERS
========================= */

function esc(value){

  if(value === null || value === undefined)
    return "";

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function money(value){

  return new Intl.NumberFormat("uk-UA")
    .format(Number(value || 0))
    + " грн";

}


function formatDate(value){

  if(!value)
    return "—";

  const parts =
    value.split("-");

  if(parts.length === 3){

    return `${parts[2]}.${parts[1]}.${parts[0]}`;

  }

  return value;

}


function formatDateTime(value){

  if(!value)
    return "—";

  const d =
    new Date(
      String(value).replace(" ","T")
    );

  if(Number.isNaN(d.getTime()))
    return value;

  return d.toLocaleString(
    "uk-UA",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================
   LOAD OBJECT
========================= */

async function loadObject(){

  try{

    const response =
      await fetch(
        API + encodeURIComponent(objectCode),
        {
          cache:"no-store"
        }
      );

    if(!response.ok)
      throw new Error(
        "HTTP " + response.status
      );


    const json =
      await response.json();


    if(!json.ok || !json.object)
      throw new Error(
        "Об'єкт не знайдено"
      );


    DATA = json;

    render();

  }catch(error){

    console.error(error);

    app.innerHTML = `

      <section class="section error">

        <div class="error-icon">
          ⚠️
        </div>

        <h2>
          Не вдалося завантажити об'єкт
        </h2>

        <p>
          Перевірте посилання або спробуйте
          відкрити сторінку ще раз.
        </p>

      </section>

    `;

  }

}


/* =========================
   MAIN RENDER
========================= */

function render(){

  const o =
    DATA.object || {};


  const financial =
    DATA.financial || {};


  const works =
    DATA.estimate_items || [];


  const estimate =
    DATA.estimates?.[0];


  const important =
    DATA.important || [];


  const files =
    DATA.files || [];


  const status =
    o.status === "in_progress"
      ? "В РОБОТІ"
      : o.status === "completed"
      ? "ЗАВЕРШЕНО"
      : o.status === "new"
      ? "НОВИЙ"
      : o.status || "—";


  const worksTotal =
    works.reduce(
      (sum,item)=>
        sum + Number(item.total || 0),
      0
    );


  app.innerHTML = `

    <!-- HERO -->

    <section class="hero">

      <div class="hero-content">

        <div class="eyebrow">

          ЦИФРОВИЙ ПАСПОРТ ·
          ${esc(o.object_code)}

        </div>


        <h1 class="object-name">

          ${esc(
            o.name ||
            "Об'єкт SA-MASTER"
          )}

        </h1>


        <div class="address">

          ${esc(
            o.address ||
            "Адреса не вказана"
          )}

        </div>


        <div class="status-row">

          <div class="badge">

            ● ${esc(status)}

          </div>


          <div class="badge blue">

            🔧
            ${esc(
              o.work_type ||
              "Сантехнічні роботи"
            )}

          </div>

        </div>


        ${
          o.planned_start_date
          ? `

            <div class="start">

              <div class="start-label">

                Запланований початок робіт

              </div>

              <div class="start-date">

                ${formatDate(
                  o.planned_start_date
                )}

              </div>

            </div>

          `
          : ""
        }

      </div>

    </section>


    <!-- IOS DOCK -->

    <div class="dock-wrap">

      <nav class="dock">

        <button
          class="dock-button"
          data-panel="important"
        >

          <span class="dock-icon">
            📌
          </span>

          <span class="dock-label">
            Важливе
          </span>

        </button>


        <button
          class="dock-button"
          data-panel="works"
        >

          <span class="dock-icon">
            🔧
          </span>

          <span class="dock-label">
            Роботи
          </span>

        </button>


        <button
          class="dock-button"
          data-panel="files"
        >

          <span class="dock-icon">
            📎
          </span>

          <span class="dock-label">
            Файли
          </span>

        </button>


        <button
          class="dock-button"
          data-panel="history"
        >

          <span class="dock-icon">
            🕐
          </span>

          <span class="dock-label">
            Історія
          </span>

        </button>

      </nav>

    </div>


    <!-- FINANCE -->

    <section class="section">

      <div class="section-head">

        <div>

          <h2 class="section-title">
            Фінанси
          </h2>

          ${
            estimate
            ? `
              <div class="section-subtitle">

                ${esc(
                  estimate.title || ""
                )}

              </div>
            `
            : ""
          }

        </div>

      </div>


      <div class="finance">

        <div class="finance-row">

          <div class="finance-label">
            Вартість робіт
          </div>

          <div class="finance-value">

            ${money(worksTotal)}

          </div>

        </div>


        <div class="finance-row">

          <div class="finance-label">
            Коштів на матеріали отримано
          </div>

          <div class="finance-value">

            ${money(
              financial.received
            )}

          </div>

        </div>


        <div class="finance-row">

          <div class="finance-label">
            Матеріалів фактично витрачено
          </div>

          <div class="finance-value">

            ${money(
              financial.spent
            )}

          </div>

        </div>


        <div class="finance-row balance-row">

          <div class="finance-label">
            Залишок коштів на матеріали
          </div>

          <div class="finance-value balance">

            ${money(
              financial.balance
            )}

          </div>

        </div>

      </div>

    </section>


    <!-- WORKS -->

    <section class="section">

      <div class="section-head">

        <div>

          <h2 class="section-title">
            Роботи
          </h2>

          <div class="section-subtitle">
            Виконання та вартість
          </div>

        </div>


        <div class="section-count">

          ${works.length}
          ${
            works.length === 1
              ? "позиція"
              : "позицій"
          }

        </div>

      </div>


      ${
        works.length

        ? works.slice(0,5).map(
          item => `

            <div class="work">

              <div class="work-top">

                <div class="work-name">

                  ${esc(
                    item.description
                  )}

                </div>

                <div class="work-total">

                  ${money(
                    item.total
                  )}

                </div>

              </div>


              <div class="work-bottom">

                <span>

                  ${esc(
                    item.quantity
                  )}

                  ×

                  ${money(
                    item.unit_price
                  )}

                </span>

              </div>

            </div>

          `
        ).join("")

        : `

          <div class="empty">

            Роботи ще не додані.

          </div>

        `
      }


      ${
        works.length > 5

        ? `

          <button
            class="show-more"
            data-panel="works"
          >

            Показати всі роботи

          </button>

        `

        : ""
      }


      ${
        works.length

        ? `

          <div class="total-box">

            <span>
              Разом
            </span>

            <span>
              ${money(worksTotal)}
            </span>

          </div>

        `

        : ""
      }

    </section>


    <!-- PASSPORT INFO -->

    <section class="section">

      <div class="passport-note">

        <div class="passport-icon">
          ✓
        </div>

        <div class="passport-note-text">

          Цей цифровий паспорт оновлюється
          в процесі роботи та містить актуальну
          інформацію щодо об'єкта, робіт,
          матеріалів і подій.

        </div>

      </div>

    </section>

  `;


  document
    .querySelectorAll("[data-panel]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          openPanel(
            button.dataset.panel
          )
      );

    });

}


/* =========================
   PANELS
========================= */

function openPanel(type){

  if(!DATA)
    return;


  const content = {

    important:
      renderImportant(),

    files:
      renderFiles(),

    works:
      renderWorks(),

    history:
      renderHistory()

  };


  const titles = {

    important:
      "📌 Важливе",

    files:
      "📎 Файли",

    works:
      "🔧 Роботи",

    history:
      "🕐 Історія"

  };


  modalTitle.textContent =
    titles[type] ||
    "Інформація";


  modalContent.innerHTML =
    content[type] || "";


  modal.classList.add("show");

  document.body.style.overflow =
    "hidden";

}


function closeModal(){

  modal.classList.remove("show");

  document.body.style.overflow =
    "";

}


/* =========================
   MODAL EVENTS
========================= */

document
  .getElementById("closeModal")
  .addEventListener(
    "click",
    closeModal
  );


modal.addEventListener(
  "click",
  event => {

    if(event.target === modal)
      closeModal();

  }
);


/* =========================
   IMPORTANT
========================= */

function renderImportant(){

  const items =
    DATA.important || [];


  if(!items.length){

    return `

      <div class="empty">

        Тут поки немає важливих записів.

      </div>

    `;

  }


  return items.map(
    item => `

      <div class="important">

        <div class="important-title">

          📌
          ${esc(item.title)}

        </div>


        ${
          item.content

          ? `

            <div class="important-text">

              ${esc(
                item.content
              )}

            </div>

          `

          : ""
        }

      </div>

    `
  ).join("");

}


/* =========================
   FILES
========================= */

function renderFiles(){

  const files =
    DATA.files || [];


  if(!files.length){

    return `

      <div class="empty">

        Файлів поки немає.

      </div>

    `;

  }


  return files.map(
    file => `

      <div class="file">

        <div class="file-icon">
          📎
        </div>


        <div>

          <div class="file-name">

            ${esc(
              file.name
            )}

          </div>


          <div class="file-meta">

            ${esc(
              file.file_type ||
              "Файл"
            )}

            · версія
            ${esc(
              file.version || 1
            )}

            ·

            ${formatDateTime(
              file.created_at
            )}

          </div>

        </div>

      </div>

    `
  ).join("");

}


/* =========================
   WORKS
========================= */

function renderWorks(){

  const works =
    DATA.estimate_items || [];


  if(!works.length){

    return `

      <div class="empty">

        Роботи ще не додані.

      </div>

    `;

  }


  const total =
    works.reduce(
      (sum,item)=>
        sum +
        Number(item.total || 0),
      0
    );


  return `

    ${
      works.map(
        item => `

          <div class="work">

            <div class="work-top">

              <div class="work-name">

                ${esc(
                  item.description
                )}

              </div>

              <div class="work-total">

                ${money(
                  item.total
                )}

              </div>

            </div>


            <div class="work-bottom">

              <span>

                Кількість:
                ${esc(
                  item.quantity
                )}

              </span>


              <span>

                ${money(
                  item.unit_price
                )}
                / од.

              </span>

            </div>

          </div>

        `
      ).join("")
    }


    <div class="total-box">

      <span>
        Загальна вартість
      </span>

      <span>
        ${money(total)}
      </span>

    </div>

  `;

}


/* =========================
   HISTORY
========================= */

function renderHistory(){

  const events =
    [...(
      DATA.events || []
    )].sort(
      (a,b)=>
        new Date(b.created_at) -
        new Date(a.created_at)
    );


  if(!events.length){

    return `

      <div class="empty">

        Історія поки порожня.

      </div>

    `;

  }


  return events.map(
    event => `

      <div class="event">

        <div class="event-date">

          ${formatDateTime(
            event.created_at
          )}

        </div>


        <div class="event-text">

          ${esc(
            event.content
          )}

        </div>

      </div>

    `
  ).join("");

}


/* =========================
   THEME
========================= */

const savedTheme =
  localStorage.getItem(
    "sa-theme"
  );


if(savedTheme){

  document.documentElement
    .dataset.theme =
      savedTheme;

}


document
  .getElementById("themeBtn")
  .addEventListener(
    "click",
    () => {

      const current =
        document.documentElement
          .dataset.theme;


      const next =
        current === "dark"
          ? "light"
          : "dark";


      document.documentElement
        .dataset.theme =
          next;


      localStorage.setItem(
        "sa-theme",
        next
      );

    }
  );


/* =========================
   ESC
========================= */

document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape")
      closeModal();

  }
);


/* =========================
   START
========================= */

loadObject();

</script>

</body>
</html>
